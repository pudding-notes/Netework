Object.assign(QUIZ, {"w1":{"bank":[{"q":"Bandwidth에 대한 설명으로 옳은 것은?","opts":["링크가 이론적으로 전달할 수 있는 최대 데이터량","실제로 일정 시간 동안 전달된 데이터량","패킷이 갔다가 돌아오는 데 걸리는 시간","경로 위 라우터의 개수"],"a":0,"why":"Bandwidth = 이론적 최대(도로 폭). 실제 전달량은 Throughput, 왕복 시간은 RTT(Latency).","ref":"w1.perf"},{"q":"작은 API 요청을 순차로 수십 번 주고받는 서비스에서 체감 속도에 가장 큰 영향을 주는 것은?","opts":["RTT","링크 대역폭","패킷 크기","서버 디스크 용량"],"a":0,"why":"요청마다 왕복 1번을 기다리므로 N × RTT가 지배한다. 대역폭을 늘려도 거의 줄지 않는다.","ref":"w1.perf"},{"q":"경로의 링크가 1 Gbps, 100 Mbps, 500 Mbps일 때 종단 간 throughput의 상한은?","opts":["100 Mbps","500 Mbps","1 Gbps","1.6 Gbps"],"a":0,"why":"Throughput은 가장 느린 링크(병목)를 넘을 수 없다: min = 100 Mbps.","ref":"w1.perf"},{"q":"Endpoint를 구성하는 요소로 가장 알맞은 것은?","opts":["주소(host) + Port + Path","MAC 주소 + IP 주소","Host + Service","DNS 서버 + Gateway"],"a":0,"why":"강의 정의: Endpoint = 주소 + Port + Path. 예) https://api.example.com:443/users","ref":"w1.cs"},{"q":"Edge computing의 장점이 아닌 것은?","opts":["무제한에 가까운 자원 확장","낮은 지연","트래픽 절감","현장 즉시 판단"],"a":0,"why":"Edge는 자원이 제한적인 것이 단점이다. 빠른 확장은 Cloud의 장점.","ref":"w1.place"},{"q":"Packet switching의 특징으로 틀린 것은?","opts":["통신 전 경로와 자원을 고정 예약한다","여러 사용자가 링크를 공유한다","패킷마다 경로와 지연이 다를 수 있다","혼잡하면 지연·손실이 생긴다"],"a":0,"why":"경로·자원을 미리 예약하는 것은 Circuit switching이다.","ref":"w1.packet"},{"q":"Router가 패킷 전달을 위해 주로 보는 계층은?","opts":["Network (IP)","Link (MAC)만","Transport (Port)","Application (HTTP)"],"a":0,"why":"Router는 L3 장비: 목적지 IP를 보고 next hop을 정한다. Switch는 L2(MAC).","ref":"w1.layer"},{"q":"인터넷이 “Network of Networks”인데도 서로 통신할 수 있는 이유는?","opts":["모두 공통 프로토콜(IP)을 사용하기 때문","하나의 회사가 모든 망을 운영하기 때문","모든 망이 같은 대역폭을 쓰기 때문","모든 장비가 같은 MAC 주소를 쓰기 때문"],"a":0,"why":"각 네트워크는 독립 운영되지만 공통 프로토콜인 IP를 쓴다.","ref":"w1.internet"},{"q":"tracert가 보여 주는 것은?","opts":["목적지까지 거치는 라우터(hop) 목록","내 PC의 DNS 서버 주소","도메인의 A 레코드","열려 있는 포트 목록"],"a":0,"why":"tracert(traceroute) = 경로 위 라우터 목록과 각 hop의 RTT.","ref":"w1.lab"},{"q":"“Layer를 나누는 이유”로 이번 학기 관점에 가장 맞는 것은?","opts":["문제가 생겼을 때 어느 계층의 문제인지 구분하기 위해","계층 이름을 외우기 위해","패킷 크기를 늘리기 위해","라우터를 없애기 위해"],"a":0,"why":"강의: 계층을 외우는 것이 목표가 아니라, 문제를 계층별로 구분하는 것이 목표.","ref":"w1.layer"}],"qc":[{"type":"ox","q":"인터넷 속도가 1 Gbps면 latency도 항상 낮다.","ans":"X","ref":"w1.perf","model":"Bandwidth(도로 폭)와 Latency(도착 시간)는 다른 지표다. 서버가 멀면(RTT 큼) 대역폭이 커도 지연은 크다. 작은 요청을 여러 번 주고받는 서비스는 RTT가 체감 속도를 지배한다."},{"type":"ox","q":"Cloud는 “인터넷 어딘가에 있는 다른 사람의 컴퓨터”라고만 이해해도 충분하다.","ans":"X","ref":"w1.place","model":"Cloud는 원격 데이터센터 자원을 쓰는 운영 방식으로, 빠른 확장·관리형 서비스라는 장점과 비용 구조·의존성이라는 단점이 함께 있다. 설계에서는 위치뿐 아니라 이런 성질을 고려해야 한다."},{"type":"ox","q":"Client와 Server는 장치 종류가 아니라 통신에서의 역할이다.","ans":"O","ref":"w1.cs","model":"먼저 요청하는 쪽이 Client, 기다렸다가 응답하는 쪽이 Server다. 같은 노트북이 브라우저로는 Client, FastAPI를 띄우면 Server가 된다."},{"type":"ox","q":"Edge computing은 Cloud를 완전히 대체하는 기술이다.","ans":"X","ref":"w1.place","model":"Edge는 지연을 줄이고 트래픽을 절감하지만 자원이 제한적이다. 장기 저장·통합 분석·모델 관리는 여전히 Cloud가 맡는다(Cloud coordination). 대체가 아니라 보완 관계다."},{"type":"ox","q":"AI 서비스도 결국 네트워크를 통해 request와 response를 주고받는다.","ans":"O","ref":"w1.journey","model":"ChatGPT 질문도 DNS → Internet → Gateway/LB → API Server → GPU로 가는 요청이고, 결과는 응답으로 돌아온다."}]},"w2":{"bank":[{"q":"192.168.10.37/24의 Network 주소는?","opts":["192.168.10.0","192.168.10.255","192.168.0.0","192.168.10.1"],"a":0,"why":"IP AND 255.255.255.0 → 마지막 옥텟이 0이 된다.","ref":"w2.ipv4"},{"q":"/27 네트워크의 사용 가능한 Host 수는?","opts":["30","32","62","14"],"a":0,"why":"2^(32−27) − 2 = 32 − 2 = 30.","ref":"w2.range"},{"q":"255.255.255.240과 같은 CIDR 표기는?","opts":["/28","/26","/30","/24"],"a":0,"why":"240 = 11110000 → 1이 24 + 4 = 28개.","ref":"w2.range"},{"q":"192.168.10.0/24를 /26으로 나눌 때 192.168.10.130이 속한 Subnet은?","opts":["192.168.10.128/26","192.168.10.64/26","192.168.10.192/26","192.168.10.0/26"],"a":0,"why":"블록 크기 64: 0, 64, 128, 192. 130은 128~191 구간.","ref":"w2.split"},{"q":"다음 중 Private IP가 아닌 것은?","opts":["172.32.0.5","10.1.2.3","172.20.0.1","192.168.100.7"],"a":0,"why":"172.16.0.0/12는 172.16~172.31까지. 172.32는 Public.","ref":"w2.addr"},{"q":"Routing Table에 10.0.0.0/8 → A, 10.1.0.0/16 → B, 0.0.0.0/0 → C가 있을 때 10.1.2.3은 어디로?","opts":["B","A","C","모두에게 복사"],"a":0,"why":"세 행 모두 일치하지만 Longest Prefix Match로 /16(B)이 선택된다.","ref":"w2.route"},{"q":"패킷이 여러 Router를 지나는 동안 그대로 유지되는 것은? (NAT 없음)","opts":["Src/Dst IP 주소","Src/Dst MAC 주소","TTL 값","이더넷 FCS"],"a":0,"why":"IP는 종단 간 유지, MAC은 hop마다 새로 쓴다. (TTL은 hop마다 1씩 감소)","ref":"w2.hop"},{"q":"ARP 요청과 응답의 전송 방식으로 옳은 것은?","opts":["요청은 Broadcast, 응답은 Unicast","요청·응답 모두 Broadcast","요청은 Unicast, 응답은 Broadcast","요청·응답 모두 Multicast"],"a":0,"why":"누가 그 IP를 가졌는지 모르니 전체에게 묻고, 답은 물어본 호스트에게만 한다.","ref":"w2.dhcp"},{"q":"DHCP 4단계의 순서로 옳은 것은?","opts":["Discover → Offer → Request → Ack","Request → Offer → Discover → Ack","Discover → Request → Offer → Ack","Offer → Discover → Ack → Request"],"a":0,"why":"DORA. Discover는 아직 IP가 없어 Broadcast로 보낸다.","ref":"w2.dhcp"},{"q":"FastAPI를 127.0.0.1:8000에 bind 했을 때 같은 LAN 친구 PC의 접속 결과는?","opts":["접속 불가 (Loopback에서만 수신)","접속 가능","인터넷 전체에 공개됨","DNS 오류"],"a":0,"why":"127.0.0.1은 내 컴퓨터 자신. 다른 NIC로 온 요청은 받지 않는다. 0.0.0.0으로 실행해야 한다.","ref":"w2.addr"},{"q":"PAT(NAPT)에서 두 내부 호스트가 같은 Src Port 51500을 써도 충돌하지 않는 이유는?","opts":["NAT Router가 서로 다른 Public 포트로 변환해 기록하기 때문","두 호스트의 MAC이 다르기 때문","Server가 Src IP를 무시하기 때문","TCP가 포트를 사용하지 않기 때문"],"a":0,"why":"예: .10:51500 → :40001, .11:51500 → :40002. 응답의 Dst Port로 내부 호스트를 구분한다.","ref":"w2.nat"},{"q":"외부에서 집 PC로 먼저 접속하기 어려운 이유가 아닌 것은?","opts":["TCP는 외부 연결을 지원하지 않는다","NAT Table에 해당 항목이 없다","방화벽이 들어오는 연결을 기본 차단한다","Public IP가 주기적으로 바뀔 수 있다"],"a":0,"why":"TCP 자체는 문제가 아니다. 구조(NAT·Firewall·동적 IP)가 막고 있다.","ref":"w2.nat"},{"q":"“Connection refused”와 “Connection timed out”의 차이로 옳은 것은?","opts":["refused는 도착했지만 거부, timeout은 도착조차 확인 못 함","둘은 같은 의미다","refused는 DNS 오류, timeout은 HTTP 오류","timeout은 항상 서버 프로그램 버그다"],"a":0,"why":"refused = 상대 OS가 RST로 거부(포트에 listen 없음). timeout = 응답이 아예 없음(방화벽·경로).","ref":"w2.trouble"},{"q":"VPC에서 Private Subnet의 Default Route(0.0.0.0/0)가 가리키는 것은?","opts":["NAT Gateway","Internet Gateway","Load Balancer","DNS Resolver"],"a":0,"why":"Public은 IGW, Private은 NAT GW → 나가는 것만 가능.","ref":"w2.vpc"},{"q":"Default Gateway 주소를 잘못 설정한 PC에서 나타나는 전형적 증상은?","opts":["같은 LAN 장비는 되는데 인터넷이 안 된다","LAN과 인터넷 모두 정상이다","DNS만 안 되고 IP 접속은 된다","MAC 주소가 바뀐다"],"a":0,"why":"같은 네트워크는 Gateway 없이 직접 전달되므로 정상, 외부로 가는 출구만 막힌다.","ref":"w2.decide"}],"qc":[{"q":"192.168.1.20/24와 192.168.2.20/24는 같은 subnet인가?","ref":"w2.and","model":"<b>아니다.</b> /24이므로 앞 24 bit(세 옥텟)를 비교한다. AND 결과가 192.168.1.0과 192.168.2.0으로 다르므로 다른 네트워크다 → 서로 통신하려면 Router(Default Gateway)를 거쳐야 한다.","kw":["/24 = 앞 세 옥텟 비교","AND 결과 192.168.1.0 ≠ 192.168.2.0","Gateway(Router) 필요"]},{"q":"192.168.10.0/26의 Broadcast 주소와 사용 가능한 Host 수는?","ref":"w2.split","model":"<b>Broadcast 192.168.10.63, Host 62개.</b> /26은 Host Part 6 bit → 2⁶ = 64 주소(.0~.63). Host Part를 모두 1로 하면 .63, 사용 가능 Host = 64 − 2 = 62 (.1~.62).","kw":["블록 크기 64","Broadcast .63","2⁶ − 2 = 62"]},{"q":"127.0.0.1:8000 에서 127.0.0.1과 8000은 각각 무엇을 식별하는가?","ref":"w2.port","model":"127.0.0.1은 <b>어느 Host인가</b>(Loopback = 내 컴퓨터 자신), 8000은 <b>그 Host 안의 어느 서비스/프로세스인가</b>(Port). IP는 호스트까지, Port는 프로세스까지.","kw":["127.0.0.1 = Loopback, 자기 자신","8000 = Port, 서비스(프로세스) 식별"]},{"q":"Default Gateway가 필요한 경우는 언제인가?","ref":"w2.decide","model":"목적지가 <b>내 Subnet 밖</b>일 때다. 내 IP와 목적지 IP를 Mask와 AND 한 결과가 다르면, 직접 보낼 수 없으므로 Gateway의 MAC을 ARP로 찾아 Gateway에게 넘긴다(목적지 IP는 그대로).","kw":["AND 결과가 다를 때 = 다른 네트워크","Gateway MAC으로 프레임 전송","목적지 IP는 유지"]},{"q":"패킷이 Router를 지날 때 바뀌는 주소는 IP인가 MAC인가?","ref":"w2.hop","model":"<b>MAC.</b> L2 주소는 “이 링크의 다음 장비”를 가리키므로 hop마다 새로 붙고, L3(IP) 주소는 최종 목적지를 가리키므로 끝까지 유지된다(NAT이 없을 때).","kw":["MAC은 hop마다 변경","IP는 종단 간 유지","NAT이 끼면 Src IP도 바뀜(예외)"]},{"q":"Private IP를 가진 PC가 Internet에 접속할 수 있는 이유는?","ref":"w2.nat","model":"<b>NAT(PAT)</b> 덕분이다. 공유기가 나가는 패킷의 Src IP:Port를 자신의 Public IP:Port로 바꾸고 NAT Table에 기록해 두었다가, 응답이 오면 Table을 보고 원래 내부 Host로 되돌린다. Private IP는 인터넷에서 라우팅되지 않으므로 그대로는 응답을 받을 수 없다.","kw":["NAT Router가 Src를 Public IP로 변환","NAT Table(포트 매핑)으로 응답을 되돌림","Private IP는 인터넷에서 라우팅 불가"]},{"q":"0.0.0.0에 bind 한다는 것은 Public Internet에 자동 공개된다는 뜻인가?","ref":"w2.addr","model":"<b>아니다.</b> 0.0.0.0 bind는 “이 PC의 모든 interface(NIC)에서 수신하겠다”는 뜻일 뿐이다. 인터넷에서 닿으려면 Public IP, NAT 포트포워딩(또는 터널), 방화벽 허용이 따로 필요하다.","kw":["모든 interface에서 수신","공개 여부는 NAT·Firewall이 결정"]}]},"w3":{"bank":[{"q":"Client ISN이 4000일 때 Server가 보내는 SYN+ACK의 ack 번호는?","opts":["4001","4000","0","Server ISN + 1"],"a":0,"why":"ACK 번호 = 다음에 받을 바이트. SYN이 1을 소모하므로 x+1.","ref":"w3.hs"},{"q":"seq=2921, len=500 세그먼트까지 모두 받았을 때 누적 ACK는?","opts":["3421","3420","2921","501"],"a":0,"why":"2921 + 500 = 3421 (다음에 받을 바이트).","ref":"w3.seq"},{"q":"UDP가 TCP와 달리 보존하는 것은?","opts":["메시지(데이터그램) 경계","전송 순서","전달 보장","혼잡 제어"],"a":0,"why":"sendto() 1회 = recvfrom() 1회. TCP는 바이트 스트림이라 경계가 없다.","ref":"w3.udp"},{"q":"UDP demux가 소켓을 고를 때 보는 값은?","opts":["목적지 IP와 목적지 Port","4-tuple 전체","출발지 Port만","MAC 주소"],"a":0,"why":"UDP는 2-tuple: 출발지가 달라도 같은 소켓으로 들어온다.","ref":"w3.mux"},{"q":"먼저 close()를 호출한 쪽이 마지막으로 들어가는 상태는?","opts":["TIME_WAIT","CLOSE_WAIT","LAST_ACK","SYN_RCVD"],"a":0,"why":"능동 종료 측: FIN_WAIT_1 → FIN_WAIT_2 → TIME_WAIT(2×MSL) → CLOSED.","ref":"w3.close"},{"q":"서버에 CLOSE_WAIT 상태가 계속 쌓인다. 가장 가능성 높은 원인은?","opts":["앱이 소켓을 close()하지 않음","방화벽이 FIN을 차단","네트워크 대역폭 부족","TIME_WAIT 설정이 짧음"],"a":0,"why":"CLOSE_WAIT은 상대 FIN에 ACK한 뒤 앱이 close()를 부르기 전까지 남는 상태 — 코드 버그.","ref":"w3.close"},{"q":"빠른 재전송(Fast Retransmit)이 일어나는 조건은?","opts":["중복 ACK 3개 수신","RTO 만료","rwnd = 0","SYN 재전송"],"a":0,"why":"3 dup ACK → 타이머를 기다리지 않고 즉시 재전송, cwnd 절반.","ref":"w3.loss"},{"q":"마지막 세그먼트가 유실됐을 때 빠른 재전송이 안 되는 이유는?","opts":["뒤따르는 데이터가 없어 중복 ACK가 생기지 않기 때문","UDP로 바뀌기 때문","RTO가 0이 되기 때문","수신자가 RST를 보내기 때문"],"a":0,"why":"중복 ACK는 뒤 세그먼트가 도착할 때 생긴다. 없으면 타임아웃을 기다린다.","ref":"w3.loss"},{"q":"RTO = SRTT + 4×RTTVAR에서 측정 RTT가 크게 흔들리면?","opts":["RTTVAR이 커져 RTO가 길어진다","RTO가 짧아진다","SRTT가 0이 된다","변화 없다"],"a":0,"why":"변동폭을 반영해 흔들리는 망에서는 더 오래 기다린다.","ref":"w3.rto"},{"q":"Stop-and-Wait에서 RTT 30 ms, MSS 1460 B일 때 처리량 상한은 약?","opts":["0.39 Mbps","1.46 Mbps","30 Mbps","389 Mbps"],"a":0,"why":"1460 × 8 / 0.03 ≈ 389,333 bps ≈ 0.39 Mbps.","ref":"w3.window"},{"q":"1 Gbps, RTT 30 ms 경로의 BDP는?","opts":["약 3.75 MB","약 30 MB","약 64 KB","약 1 MB"],"a":0,"why":"10⁹ / 8 × 0.03 = 3.75 × 10⁶ B.","ref":"w3.flow"},{"q":"수신자가 ACK에 win=0을 광고하는 가장 흔한 원인은?","opts":["수신 애플리케이션이 데이터를 늦게 읽음","네트워크 혼잡","송신자 cwnd 감소","DNS 지연"],"a":0,"why":"Zero window의 진짜 원인은 느린 수신 앱(recv 루프 막힘).","ref":"w3.flow"},{"q":"Slow Start에서 cwnd는 RTT마다 어떻게 변하는가?","opts":["2배","+1 MSS","절반","변화 없음"],"a":0,"why":"ssthresh 전까지는 ×2, 이후 Congestion Avoidance에서 +1.","ref":"w3.cc"},{"q":"cwnd 20에서 타임아웃이 발생하면 (Reno, 슬라이드 모델)?","opts":["ssthresh=10, cwnd=1","ssthresh=10, cwnd=10","ssthresh=20, cwnd=1","ssthresh=1, cwnd=20"],"a":0,"why":"타임아웃은 심각한 신호: ssthresh = cwnd/2, cwnd = 1로 Slow Start부터.","ref":"w3.cc"},{"q":"MTU 1500인 이더넷에서 TCP MSS는?","opts":["1460","1500","1472","1480"],"a":0,"why":"1500 − IP 20 − TCP 20 = 1460. (UDP payload는 1472)","ref":"w3.hdr"},{"q":"accept()가 하는 일로 옳은 것은?","opts":["핸드셰이크가 끝난 연결을 큐에서 꺼내 새 소켓으로 반환","SYN을 보내 연결을 시작","포트를 소켓에 붙임","소켓을 LISTEN 상태로 만듦"],"a":0,"why":"connect = 시작, bind = 주소, listen = 대기 모드. 핸드셰이크는 커널이 한다.","ref":"w3.sock"},{"q":"실시간 영상통화에 UDP가 적합한 주된 이유는?","opts":["늦게 도착한 프레임은 쓸모없어 재전송을 기다릴 필요가 없다","UDP는 대역폭이 더 크다","UDP는 암호화를 제공한다","UDP는 순서를 보장한다"],"a":0,"why":"최신성 > 완전성. 약간의 손실은 코덱이 보정.","ref":"w3.design"},{"q":"QUIC이 TCP+TLS보다 연결 수립이 빠른 이유는?","opts":["전송 핸드셰이크와 암호 협상을 합쳤기 때문","UDP가 대역폭이 크기 때문","인증서를 생략하기 때문","IP 헤더가 없기 때문"],"a":0,"why":"QUIC 신규 1 RTT(재방문 0-RTT) vs TCP+TLS 1.3 2 RTT.","ref":"w3.udp"}],"qc":[{"q":"3-way handshake는 왜 3번인가? 2번으로는 무엇이 부족한가?","ref":"w3.hs","model":"양방향 통신이라 <b>양쪽의 초기 순서번호(ISN)가 각각 상대에게 확인</b>되어야 한다: C→S SYN(x), S→C SYN+ACK(y, ack=x+1), C→S ACK(ack=y+1). 2번이면 Server의 ISN을 Client가 받았는지 확인할 수 없고, <b>오래된 중복 SYN</b>만으로 Server가 연결을 성립시켜 자원을 낭비하게 된다. 세 번째 ACK로 Client의 의사가 확인된다.","kw":["양방향 ISN 확인","Server ISN에 대한 ACK가 필요","오래된 중복 SYN 차단"]},{"q":"“UDP가 빠르다”는 표현은 어떤 의미에서 맞고 어떤 의미에서 틀린가?","ref":"w3.udp","model":"<b>맞는 부분</b>: 핸드셰이크가 없어 시작 지연(1 RTT)이 없고, 유실돼도 재전송을 기다리지 않으므로 지연이 작다(실시간 음성·영상·게임). <b>틀린 부분</b>: 대역폭(처리량)이 더 큰 것은 아니다. 혼잡제어가 없어 과도하게 보내면 손실이 늘어 오히려 느려질 수 있고, 신뢰성이 필요하면 앱이 직접 구현해야 한다.","kw":["시작·재전송 지연이 없다(지연 측면)","처리량·대역폭이 큰 것은 아니다","필요한 기능은 앱이 구현 (QUIC)"]},{"q":"Socket과 Port의 차이를 한 문장으로 설명하라.","ref":"w3.sock","model":"<b>Port는 호스트 안의 프로세스를 가리키는 번호(주소)</b>이고, <b>Socket은 그 주소(프로토콜·IP·Port, 연결이면 상대 IP·Port까지)에 묶인 통신 창구 객체(파일 디스크립터)</b>다. 한 포트 위에 여러 소켓이 있을 수 있다.","kw":["Port = 번호(주소)","Socket = 통신 endpoint 객체(FD)","한 포트에 소켓 여러 개 가능"]},{"q":"TCP 연결은 무엇으로 식별되는가? 같은 서버 포트에 여러 연결이 가능한 이유는?","ref":"w3.mux","model":"<b>4-tuple</b>(출발지 IP, 출발지 Port, 목적지 IP, 목적지 Port)로 식별된다. 서버 쪽 IP·Port(예: 443)가 같아도 클라이언트 IP나 포트(OS가 ephemeral 범위에서 자동 할당)가 다르면 다른 연결이므로, 같은 443에 수천 개의 연결 소켓이 공존할 수 있다.","kw":["4-tuple","클라이언트 ephemeral port가 다름","연결마다 별도 연결 소켓"]},{"q":"listen 소켓과 연결 소켓은 어떻게 다른가? accept()가 하는 일은?","ref":"w3.sock","model":"<b>listen 소켓</b>은 서버 포트에서 새 연결 요청을 받아 대기열(SYN queue → accept queue)에 넣는 창구로, 데이터를 주고받지 않는다(1개). <b>연결 소켓</b>은 클라이언트 하나와 실제 send/recv를 하는 소켓(N개). <b>accept()</b>는 커널이 핸드셰이크를 끝낸 연결을 accept queue에서 꺼내 새 연결 소켓으로 반환한다(새 연결을 “만드는” 것이 아님).","kw":["listen = 받는 창구, 데이터 X","연결 소켓 = 실제 대화","accept = 완료된 연결을 큐에서 꺼냄"]},{"q":"Flow control과 congestion control은 각각 무엇을 보호하는가?","ref":"w3.flow","model":"<b>Flow control</b>은 <b>수신자(수신 버퍼)</b>를 보호한다 — 수신자가 rwnd를 광고해 넘치지 않게 한다. <b>Congestion control</b>은 <b>네트워크(병목 라우터 큐)</b>를 보호한다 — 송신자가 손실·지연으로 혼잡을 추정해 cwnd를 조절한다. 실제 전송량 = min(rwnd, cwnd).","kw":["Flow = 수신자 보호, rwnd","Congestion = 네트워크 보호, cwnd","min(rwnd, cwnd)"]},{"q":"누적 ACK에서 중복 ACK가 반복되면 송신자는 무엇을 알게 되는가?","ref":"w3.loss","model":"해당 ack 번호의 세그먼트 <b>하나가 빠졌고, 그 뒤 세그먼트들은 계속 도착하고 있다</b>는 것(경로는 살아 있는 가벼운 손실). 중복 ACK 3개를 받으면 타임아웃을 기다리지 않고 그 세그먼트를 <b>빠른 재전송</b>하고, cwnd를 절반으로 줄인다.","kw":["그 번호의 조각만 빠짐","뒤 데이터는 도착 중(경로 살아 있음)","3 dup ACK → 빠른 재전송"]},{"q":"TIME_WAIT과 CLOSE_WAIT 중 코드 버그의 신호는 어느 쪽인가? 왜?","ref":"w3.close","model":"<b>CLOSE_WAIT</b>. 상대가 FIN을 보내 커널은 ACK했는데 <b>내 애플리케이션이 close()를 호출하지 않아</b> 남아 있는 상태라, 앱이 닫을 때까지 무한정 쌓인다(FD 고갈). TIME_WAIT은 먼저 닫은 쪽에 2×MSL 동안 남는 <b>정상 동작</b>의 흔적이다(양이 많을 때만 문제).","kw":["CLOSE_WAIT = close() 누락","무한정 남음 → Too many open files","TIME_WAIT은 정상(2×MSL)"]},{"q":"Connection refused와 Connection timed out은 조사 방향이 왜 다른가?","ref":"w3.diag","model":"<b>refused</b>는 SYN이 서버 OS까지 도착했지만 그 포트에 listen 소켓이 없어 <b>RST</b>가 돌아온 것 → 서버 프로세스 실행 여부, 포트 번호, bind 주소를 본다. <b>timed out</b>은 SYN에 대한 응답이 아예 없는 것 → 방화벽·Security Group, 라우팅 등 <b>경로상 차단</b>을 본다.","kw":["refused = RST 수신, 도착은 함","timeout = 응답 없음","서버 측 vs 경로·방화벽"]},{"q":"“연결은 되는데 느리다”를 만났을 때 무엇부터 측정할 것인가?","ref":"w3.diag","model":"<b>RTT(와 그 변동), 재전송률/손실, Recv-Q·Send-Q, 윈도우 크기</b>를 본다. Recv-Q가 쌓이면 수신 앱이 병목(zero window), Send-Q가 쌓이면 네트워크·상대가 병목, 재전송이 많으면 손실로 cwnd가 줄고 있는 것, 윈도우가 BDP보다 작으면 윈도우 제한이다. (Wireshark: tcp.analysis.retransmission, zero_window)","kw":["RTT·재전송률 측정","Recv-Q / Send-Q로 병목 위치","윈도우(rwnd·cwnd) vs BDP"]}]},"w4":{"bank":[{"q":"URL https://a.com:8443/x?y=1#z 에서 서버로 전송되지 않는 부분은?","opts":["#z (fragment)","?y=1 (query)","/x (path)",":8443 (port)"],"a":0,"why":"fragment는 브라우저만 읽는다.","ref":"w4.url"},{"q":"Recursive Resolver가 Root·TLD·권한 서버와 주고받는 질의 방식은?","opts":["반복 질의 (iterative)","재귀 질의 (recursive)","Broadcast","Multicast"],"a":0,"why":"각 서버는 referral만 주고, 리졸버가 따라간다.","ref":"w4.resolve"},{"q":"도메인의 최종 레코드(A, CNAME 등)를 가진 서버는?","opts":["권한(Authoritative) 서버","Root 서버","TLD 서버","Stub resolver"],"a":0,"why":"Root는 TLD 위치, TLD는 권한 서버 위치만 안다.","ref":"w4.dnsh"},{"q":"DNS TTL을 길게 설정했을 때의 단점은?","opts":["잘못된 레코드가 오래 남아 되돌리기 어렵다","권한 서버 부하가 커진다","조회가 느려진다","캐시 적중률이 낮아진다"],"a":0,"why":"길면 빠르고 부하가 적지만 변경 반영이 느리다.","ref":"w4.ttl"},{"q":"IPv6 주소를 담는 DNS 레코드 타입은?","opts":["AAAA","A","CNAME","PTR"],"a":0,"why":"A = IPv4, AAAA = IPv6, PTR = 역방향.","ref":"w4.rec"},{"q":"HTTP/1.1에서 유일한 필수 헤더는?","opts":["Host","Content-Type","User-Agent","Accept"],"a":0,"why":"한 IP의 여러 사이트(가상 호스팅)를 구분하기 위해 필요.","ref":"w4.msg"},{"q":"본문 {\"name\":\"김\"} 의 Content-Length는? (UTF-8)","opts":["14","12","13","16"],"a":0,"why":"ASCII 11자 + 한글 1자(3 B) = 14 B.","ref":"w4.msg"},{"q":"안전(Safe)하면서 멱등한 메서드는?","opts":["GET","POST","PUT","DELETE"],"a":0,"why":"PUT·DELETE는 멱등이지만 상태를 바꾸므로 안전하지 않다.","ref":"w4.method"},{"q":"401과 403의 차이로 옳은 것은?","opts":["401은 누구인지 모름, 403은 누군지 알지만 권한 없음","401은 서버 오류, 403은 클라이언트 오류","둘은 같은 의미","401은 리다이렉트, 403은 캐시"],"a":0,"why":"401 → 인증(토큰) 확인, 403 → 권한·역할 확인.","ref":"w4.status"},{"q":"프록시가 뒷단 응답을 기다리다 시간 초과되면 반환하는 코드는?","opts":["504","502","503","500"],"a":0,"why":"502 = 연결 실패·잘못된 응답, 503 = 가용 upstream 없음, 504 = 시간 초과.","ref":"w4.status"},{"q":"Cache-Control: no-cache의 의미는?","opts":["저장은 하되 쓰기 전에 매번 서버에 검증","저장 자체 금지","1년간 재사용","CDN에만 저장"],"a":0,"why":"저장 금지는 no-store. no-cache는 “매번 확인”.","ref":"w4.cache"},{"q":"HTTP/2가 여전히 겪는 HOL Blocking은 어느 계층의 문제인가?","opts":["TCP 계층","HTTP 계층","DNS 계층","TLS 계층"],"a":0,"why":"TCP는 스트림을 몰라 바이트 하나가 빠지면 모든 스트림이 대기.","ref":"w4.ver"},{"q":"HTTPS 통신에서 경로상의 관찰자가 볼 수 없는 것은?","opts":["요청 경로(path)와 쿼리","목적지 IP","SNI의 도메인 이름","목적지 포트 443"],"a":0,"why":"path·query·header·body는 암호화된다.","ref":"w4.https"},{"q":"Forward Secrecy가 보장하는 것은?","opts":["서버 개인키가 나중에 유출돼도 과거 트래픽은 풀 수 없다","인증서가 만료되지 않는다","DNS가 암호화된다","0-RTT가 항상 안전하다"],"a":0,"why":"세션 키를 매 연결 ECDHE로 새로 만들고 버리기 때문.","ref":"w4.https"},{"q":"TLS 1.3 핸드셰이크가 TLS 1.2보다 빠른 이유는?","opts":["ClientHello에 키 재료(key_share)를 미리 실어 1 RTT로 줄였다","인증서를 생략한다","TCP를 쓰지 않는다","암호화를 하지 않는다"],"a":0,"why":"TLS 1.3 = 1 RTT, TLS 1.2 = 2 RTT.","ref":"w4.tls"},{"q":"RTT 30 ms, DNS 20 ms일 때 신규 HTTPS(TCP+TLS1.3) 요청의 첫 바이트까지 시간은? (서버 처리 제외)","opts":["110 ms","90 ms","60 ms","30 ms"],"a":0,"why":"DNS 20 + TCP 30 + TLS 30 + 요청 30 = 110 ms.","ref":"w4.cost"},{"q":"curl -w 결과 connect 0.052, appconnect 0.087이면 TLS 핸드셰이크 시간은?","opts":["35 ms","87 ms","52 ms","139 ms"],"a":0,"why":"누적값의 차이: 0.087 − 0.052 = 0.035 s.","ref":"w4.obs"},{"q":"ERR_CONNECTION_REFUSED가 뜰 때 먼저 확인할 것은?","opts":["서버 실행 여부·포트·바인드 주소","인증서 SAN","DNS 레코드","CORS 헤더"],"a":0,"why":"TCP 단계: 포트에 listen 소켓이 없다.","ref":"w4.diag"},{"q":"CORS 오류에 대한 설명으로 옳은 것은?","opts":["서버는 응답을 보냈지만 브라우저가 공유를 막은 것","DNS 단계 실패","TCP 연결 실패","서버가 요청을 받지 못한 것"],"a":0,"why":"응답은 도착했다. Access-Control-Allow-Origin을 확인.","ref":"w4.diag"}],"qc":[{"q":"URL과 Domain의 차이는? DNS는 URL의 어느 부분만 아는가?","ref":"w4.url","model":"URL은 scheme://host:port/path?query#fragment 전체 <b>자원 주소</b>이고, Domain은 그중 <b>host</b>(이름)다. DNS는 <b>host만</b> IP로 바꾸며, path·query는 서버가, fragment는 브라우저만 읽는다(서버로 안 감).","kw":["URL = 자원 전체 주소","Domain = host 부분","DNS는 host만"]},{"q":"재귀 질의와 반복 질의는 각각 누구와 누구 사이에서 일어나는가?","ref":"w4.resolve","model":"<b>재귀 질의</b>: 클라이언트(Stub) ↔ Recursive Resolver — “끝까지 알아와 줘”. <b>반복 질의</b>: Resolver ↔ Root / TLD / 권한 서버 — 각 서버가 “나는 모른다, 저기 물어봐(referral)”로 답하고 리졸버가 따라간다.","kw":["재귀 = 클라이언트 ↔ 리졸버","반복 = 리졸버 ↔ Root·TLD·권한 서버","referral(위임)"]},{"q":"DNS 레코드를 바꿨는데 일부 사용자만 옛 서버로 가는 이유는?","ref":"w4.ttl","model":"그 사용자들의 리졸버·OS·브라우저 <b>캐시에 옛 레코드가 TTL이 남은 채</b> 있기 때문이다. TTL이 만료되어야 새 레코드를 다시 묻는다. 그래서 이전 전에 TTL을 미리 낮춰 둔다.","kw":["캐시","TTL 만료 전까지 옛 값","미리 TTL 낮추기"]},{"q":"HTTP 메시지에서 헤더와 본문의 경계는 무엇으로 구분되는가?","ref":"w4.msg","model":"<b>빈 줄(CRLF CRLF, \\r\\n\\r\\n)</b>로 헤더가 끝나고 본문이 시작된다. 본문의 끝은 <b>Content-Length</b>(바이트 수) 또는 Transfer-Encoding: chunked로 알린다 — TCP 바이트 스트림에 경계를 만드는 방법.","kw":["\\r\\n\\r\\n (빈 줄)","Content-Length / chunked"]},{"q":"PUT은 멱등인데 POST는 아닌 이유는? 재시도와 어떤 관계인가?","ref":"w4.method","model":"PUT은 “이 자원을 이 내용으로 교체” — 몇 번 보내도 결과 상태가 같다. POST는 “새로 생성/처리” — 보낼 때마다 새 자원이 생긴다. 네트워크는 응답만 유실됐는지 구분 못 하므로 <b>자동 재시도는 멱등 요청에만 안전</b>하고, POST는 Idempotency-Key로 멱등하게 만들어야 중복 주문·결제를 막는다.","kw":["PUT = 전체 교체 → 같은 결과","POST = 매번 생성","재시도는 멱등에만 / Idempotency-Key"]},{"q":"404와 502는 각각 누가 만든 응답인가?","ref":"w4.status","model":"<b>404</b>는 보통 <b>App Server</b>(경로·자원 없음, 라우팅 실패)가 만든다. <b>502</b>는 <b>Reverse Proxy·LB</b>가 만든다 — 뒷단(app) 연결에 실패했거나 잘못된 응답을 받았을 때. 둘 다 상태 코드가 있으므로 DNS·TCP·TLS(클라이언트↔프록시)는 이미 성공했다.","kw":["404 = 앱","502 = 프록시/LB, 뒷단 연결 실패","상태 코드가 있으면 앞 단계는 통과"]},{"q":"HTTP/2가 해결한 것과 해결하지 못해 HTTP/3가 나온 이유는?","ref":"w4.ver","model":"HTTP/2는 바이너리 프레임과 <b>스트림 다중화</b>로 한 연결에서 여러 요청을 동시에 처리해 <b>HTTP 계층 HOL Blocking</b>(1.1의 순서대로 응답)을 해결했다. 하지만 TCP는 스트림을 몰라 <b>패킷 하나가 유실되면 모든 스트림이 대기</b>(TCP 계층 HOL)한다. HTTP/3는 스트림을 아는 QUIC(UDP) 위에서 동작해 유실된 스트림만 기다리게 하고, 연결 수립도 1 RTT로 줄였다.","kw":["H2 = 다중화로 HTTP 계층 HOL 해결","TCP 계층 HOL은 남음","H3/QUIC = 스트림 단위 독립"]},{"q":"HTTPS에서 암호화되는 것과 여전히 보이는 것은?","ref":"w4.https","model":"<b>암호화</b>: Method · Path · Query · Header(Cookie 포함) · Body. <b>보이는 것</b>: DNS 질의(DoH 제외), IP 주소, TCP 포트, TLS SNI(ECH 제외)의 도메인 이름, 통신 시각과 양. 즉 “어디에”는 보이고 “무엇을”은 숨긴다.","kw":["메서드·경로·쿼리·헤더·본문은 암호화","DNS·IP·포트·SNI는 보임"]},{"q":"브라우저는 인증서에서 어떤 항목들을 검증하는가?","ref":"w4.https","model":"① <b>체인</b>: 서명을 따라 신뢰 저장소의 Root CA까지 닿는가 ② <b>이름</b>: SAN에 접속 도메인이 있는가 ③ <b>기간</b>: 유효기간 안인가 ④ <b>폐기</b>: OCSP·CRL로 취소되지 않았는가 ⑤ <b>소유</b>: 서버가 그 공개키의 개인키를 가졌는가(핸드셰이크 서명).","kw":["체인(Root까지)","이름(SAN)","유효기간","폐기 여부","개인키 소유"]},{"q":"DevTools에서 TTFB만 길다면 무엇을 의심해야 하는가?","ref":"w4.obs","model":"DNS·연결·TLS 구간은 정상이므로 <b>서버 쪽 처리</b>를 의심한다 — 앱 로직, 느린 DB 쿼리, 콜드 스타트, 뒷단(외부 API·upstream) 대기. 서버 로그와 요청 ID로 추적한다.","kw":["네트워크 구간은 정상","서버 처리·DB 쿼리·콜드 스타트"]}]}});

  ['ipconfig의 192.168.x 주소와 “내 IP 확인” 사이트가 보여 주는 주소가 다른 이유는 NAT 때문이다.', 'O', '사이트에는 공유기가 바꿔 쓴 Public IP가 보인다.', 'w2.addr'],
  ['PAT에서 두 내부 기기가 우연히 같은 Src Port를 쓰면 변환할 수 없어 한쪽은 통신하지 못한다.', 'X', 'NAT Router가 서로 <b>다른 변환 포트</b>(예: 40001, 40002)를 준다. 그래서 충돌하지 않는다.', 'w2.nat'],
  ['Reverse Tunnel(ngrok 등)이 NAT 뒤에서도 동작하는 이유는 내부에서 밖으로 연결을 먼저 열어 NAT Table 항목이 생기기 때문이다.', 'O', '나가야 돌아온다. 터널은 안에서 먼저 나간 연결이다.', 'w2.expose'],
  ['Port Forwarding은 공유기 관리 권한이 없어도 학교망에서 쉽게 설정할 수 있다.', 'X', '공유기 권한과 공인 IP가 필요하다. 학교망에서는 둘 다 없고, IP가 바뀌며, PC를 직접 노출한다.', 'w2.expose'],
  ['DHCP로 받은 IP는 Lease Time이 있어 바뀔 수 있으므로, 서버 PC는 고정 IP나 DHCP 예약을 쓰는 것이 좋다.', 'O', '확인: ipconfig /release → /renew.', 'w2.dhcp'],
  ['arp -a의 ARP 표에는 인터넷에 있는 서버들의 MAC 주소도 함께 저장된다.', 'X', 'ARP 표에는 <b>같은 LAN</b> 장비만 나온다. 다른 네트워크로 갈 때는 Gateway의 MAC만 쓴다.', 'w2.dhcp'],
  ['Cloud의 Security Group과 Host 방화벽 중 하나만 허용해도 외부 요청이 서버 앱까지 도달한다.', 'X', '두 계층(Cloud·Host)과 bind를 <b>모두</b> 통과해야 한다. 한쪽만 열어 두는 실수가 가장 흔하다.', 'w2.port'],
  ['VPC의 Private Subnet에 있는 DB는 NAT Gateway를 통해 외부에서 직접 접속할 수 있다.', 'X', 'NAT Gateway는 <b>나갈 때만</b> 쓴다. 밖에서 먼저 들어올 수 없고, Private Subnet의 route는 IGW를 가리키지 않는다.', 'w2.vpc'],
],
w3: [
  ['IP는 호스트까지 전달하고, TCP/UDP는 포트 번호로 그 호스트 안의 프로세스까지 전달한다.', 'O', 'IP = 아파트 동호수, 포트 = 받는 사람 이름.', 'w3.role'],
  ['UDP는 목적지 IP와 목적지 Port(2-tuple)만으로 받을 소켓을 찾는다.', 'O', '그래서 출발지가 달라도 같은 UDP 소켓으로 들어온다.', 'w3.mux'],
  ['TCP 서버에서 같은 443 포트로 들어온 여러 연결은 모두 하나의 소켓을 공유한다.', 'X', 'TCP는 <b>4-tuple</b>로 구분해 연결마다 별도 소켓을 만든다(listen 소켓 1 + 연결 소켓 N).', 'w3.mux'],
  ['클라이언트의 출발지 포트는 보통 OS가 Ephemeral 범위에서 자동으로 고른다.', 'O', '강의 기준 Dynamic/Ephemeral = 49152–65535. connect() 때 OS가 4-tuple이 유일하도록 고른다.', 'w3.ports'],
  ['TCP 연결이 맺어지면 경로상의 라우터들도 그 연결의 상태를 기억한다.', 'X', '연결 상태(TCB)는 <b>양쪽 끝 호스트의 커널</b>에만 있다. 라우터는 연결의 존재를 모른다.', 'w3.state'],
  ['3-way handshake에서 Server가 보내는 SYN+ACK의 ack 번호는 Client의 ISN + 1이다.', 'O', 'SYN도 순서번호 1을 쓰므로 “x까지 받았다, 다음엔 x+1을 다오”.', 'w3.hs'],
  ['TCP의 초기 순서번호(ISN)는 항상 0부터 시작한다.', 'X', 'ISN은 무작위로 정한다. 옛 연결의 패킷 혼입과 순서번호 추측 공격을 막기 위해서다. Wireshark의 0은 보기 편한 상대값.', 'w3.hs'],
  ['3-way handshake가 필요한 이유 중 하나는 늦게 도착한 옛 SYN 때문에 Server가 쓸모없는 연결을 여는 것을 막기 위해서다.', 'O', 'Client가 세 번째 ACK를 보내지 않으면(실제로는 RST) 연결이 성립하지 않는다.', 'w3.hs'],
  ['TCP의 Sequence Number는 세그먼트의 개수를 센다.', 'X', '<b>바이트</b>를 센다. Seq = 이 세그먼트 첫 바이트의 번호.', 'w3.seq'],
  ['seq=1, 길이 1460바이트인 세그먼트를 받았다면 수신자는 ACK 1461을 보낸다.', 'O', 'ACK = 다음에 받고 싶은 바이트 번호 = 1 + 1460.', 'w3.seq'],
  ['TCP는 바이트 스트림이라서 send()를 3번 호출한 데이터가 recv() 한 번에 합쳐져 나올 수 있다.', 'O', 'TCP에는 메시지 경계가 없다. 그래서 앱이 길이 헤더나 구분자를 정해야 한다.', 'w3.seq'],
  ['4-way 종료에서 TIME_WAIT 상태에 들어가는 쪽은 나중에 close()한 쪽이다.', 'X', '<b>먼저</b> close()한 쪽(능동 종료)이 마지막 ACK를 보낸 뒤 2×MSL 동안 TIME_WAIT에 머문다. 나중에 닫는 쪽은 CLOSE_WAIT → LAST_ACK.', 'w3.close'],
  ['CLOSE_WAIT가 계속 쌓인다면 상대가 연결을 닫았는데 내 애플리케이션이 close()를 하지 않은 것이다.', 'O', 'CLOSE_WAIT는 앱이 close()할 때까지 무한정 남는다 — 버그의 흔적 (Quick Check Q8).', 'w3.close'],
  ['TIME_WAIT 상태는 비정상이므로 발견하면 바로 없애야 한다.', 'X', 'TIME_WAIT는 정상 동작의 흔적이다. 문제는 존재가 아니라 <b>양</b>(포트 고갈).', 'w3.close'],
  ['TCP의 ACK는 상대 애플리케이션이 그 데이터를 처리했다는 보장이다.', 'X', 'ACK는 상대 <b>커널</b>이 받았다는 뜻일 뿐이다. 앱 처리 보장은 애플리케이션 수준(멱등성 등)의 몫.', 'w3.rel'],
  ['중복 ACK를 3번 받으면 송신자는 타임아웃을 기다리지 않고 그 구간을 재전송한다.', 'O', 'Fast Retransmit. 뒤 데이터는 도착 중이라는 증거이므로 cwnd는 절반으로.', 'w3.loss'],
  ['마지막 세그먼트가 유실되면 중복 ACK가 생기지 않아 결국 타임아웃(RTO)을 기다려야 한다.', 'O', '뒤따르는 데이터가 없으면 중복 ACK 자체가 만들어지지 않는다.', 'w3.loss'],
  ['RTO는 측정한 RTT의 평균(SRTT)만으로 정하고, RTT의 변동폭은 고려하지 않는다.', 'X', '<b>RTO = SRTT + 4 × RTTVAR</b>. 변동이 클수록 여유를 더 둔다.', 'w3.rto'],
  ['타임아웃 재전송이 반복되면 RTO는 두 배씩 늘어난다.', 'O', '지수 백오프 — 혼잡한 네트워크에 재전송을 퍼붓지 않기 위해서다.', 'w3.rto'],
  ['Flow control은 수신자의 버퍼가 넘치지 않도록 하는 것이며, 수신자가 rwnd로 남은 공간을 알린다.', 'O', 'rwnd가 0이면 송신자는 멈춘다(Zero Window). 원인은 느린 수신 앱.', 'w3.flow'],
  ['Congestion control은 수신자를 보호하기 위한 장치이다.', 'X', '혼잡제어는 <b>네트워크</b>를 보호한다(cwnd). 수신자 보호는 Flow control(rwnd).', 'w3.cc'],
  ['송신자가 한 번에 보낼 수 있는 양은 min(rwnd, cwnd)이다.', 'O', '수신자 한계와 네트워크 한계 중 더 작은 쪽에 맞춘다.', 'w3.cc'],
  ['Slow Start 구간에서 cwnd는 RTT마다 1 MSS씩 선형으로 늘어난다.', 'X', 'Slow Start는 RTT마다 <b>두 배</b>(1 → 2 → 4 → 8 …). +1씩 선형 증가는 ssthresh 이후의 Congestion Avoidance.', 'w3.cc'],
  ['UDP 헤더는 8바이트로 고정이며, UDP는 순서 보장이나 재전송을 하지 않는다.', 'O', 'TCP가 해 주던 일을 하지 않는 대신 가볍다. 필요하면 앱이 직접 구현한다.', 'w3.vs'],
  ['QUIC은 TCP 위에서 동작하는 프로토콜이다.', 'X', 'QUIC은 <b>UDP</b> 위에 신뢰성·혼잡제어·암호화를 직접 구현했다(HTTP/3의 기반).', 'w3.udp'],
  // ── 추가 25문항 ──
  ['전송계층은 호스트 대 호스트 통신 위에 프로세스 대 프로세스 통신을 제공한다.', 'O', '그 주소가 Port, 손잡이가 Socket이다.', 'w3.role'],
  ['리눅스에서 Well-known 포트(0~1023)에 bind하려면 보통 root 권한이 필요하다.', 'O', '그래서 개발 서버는 8000·8080 같은 포트를 흔히 쓴다.', 'w3.ports'],
  ['포트 번호는 서비스별로 강제 예약되어 있어서 8080 포트에 SSH 서버를 띄우는 것은 불가능하다.', 'X', '포트는 “예약”이 아니라 “합의”다. 띄울 수는 있지만 아무도 찾아오지 못할 뿐이다.', 'w3.ports'],
  ['DNS는 응답이 커지면 UDP 대신 TCP 53을 쓰기도 한다.', 'O', '응답이 잘리면(TC 플래그) TCP로 다시 묻는다. zone transfer도 TCP.', 'w3.ports'],
  ['TCB에는 4-tuple, 연결 상태, 순서번호, 윈도우, 타이머, 송수신 버퍼 같은 정보가 들어 있다.', 'O', '연결 = 양쪽 커널에 남은 이 상태다.', 'w3.state'],
  ['TCP 연결 수가 아무리 늘어도 서버의 메모리·포트·타이머는 소모되지 않는다.', 'X', '상태는 비용이다. 연결마다 TCB가 생겨 메모리·타이머·포트가 소모된다 → 동시 접속 한계, TIME_WAIT 누적.', 'w3.state'],
  ['TCP 헤더는 UDP처럼 8바이트로 고정되어 있다.', 'X', 'TCP 헤더는 <b>20바이트 이상(최대 60)</b>, UDP가 8바이트 고정이다.', 'w3.vs'],
  ['UDP는 broadcast·multicast 같은 1:N 통신이 가능하다.', 'O', 'TCP는 연결형 1:1(unicast)만 가능하다.', 'w3.vs'],
  ['UDP로 sendto()한 메시지 여러 개는 받는 쪽에서 하나로 붙어 나올 수 있다(경계 없음).', 'X', '경계가 없는 것은 TCP다. UDP는 <b>데이터그램 경계를 유지</b>한다 — sendto 1번 = recvfrom 1번.', 'w3.udp'],
  ['UDP는 혼잡제어가 없으므로 같은 회선에서 TCP보다 항상 더 큰 처리량을 낸다.', 'X', '대역폭이 더 커지지는 않는다. 과도하게 보내면 손실이 폭증해 오히려 느려질 수 있다(필기: 막히는 건 똑같이 막힌다).', 'w3.udp'],
  ['DNS가 UDP를 쓰는 주된 이유는 질의 하나·응답 하나로 끝나는데 핸드셰이크 1 RTT가 아깝기 때문이다.', 'O', '실패하면 다시 물으면 된다.', 'w3.udp'],
  ['FIN은 데이터를 싣지 않으므로 순서번호를 소비하지 않는다.', 'X', 'FIN도 SYN처럼 순서번호 <b>1</b>을 쓴다. 그래서 상대는 ack = u+1로 답한다.', 'w3.close'],
  ['4-way 종료에서 Server가 ACK와 FIN을 바로 합치지 않는 것은 아직 보낼 데이터가 남아 있을 수 있기 때문이다.', 'O', 'half-close — 한 방향만 닫히고 Server는 남은 응답을 더 보낼 수 있다.', 'w3.close'],
  ['CLOSE_WAIT 상태는 2×MSL이 지나면 자동으로 사라진다.', 'X', '2×MSL 뒤 사라지는 것은 TIME_WAIT다. CLOSE_WAIT는 앱이 close()할 때까지 <b>무한정</b> 남는다.', 'w3.close'],
  ['TCP 헤더의 Window Size 필드는 16비트라 최대 64KB이고, Window Scale 옵션으로 확장한다.', 'O', '고속·장거리 회선에서는 64KB로 부족해 확장 옵션을 쓴다.', 'w3.hdr'],
  ['이더넷 MTU 1500에서 IP 헤더 20바이트와 TCP 헤더 20바이트를 빼면 MSS는 1460바이트이다.', 'O', '앱이 1MB를 send()해도 이 단위로 쪼개진다.', 'w3.hdr'],
  ['누적 ACK에서는 중간 ACK 하나가 유실되어도 뒤에 오는 ACK가 그 확인을 대신할 수 있다.', 'O', 'ACK N = “N−1번째 바이트까지 빠짐없이 받았다”이므로 뒤 ACK가 앞 내용을 포함한다.', 'w3.seq'],
  ['Zero Window가 나타나는 원인은 보통 네트워크 혼잡이다.', 'X', '진짜 원인은 <b>수신 앱이 느린 것</b>이다(recv 루프가 막힘 등). 수신 버퍼가 꽉 찬 상태.', 'w3.flow'],
  ['BDP(대역폭 × RTT)는 파이프를 꽉 채우려면 윈도우가 얼마나 커야 하는지를 나타낸다.', 'O', '윈도우가 BDP보다 작으면 회선이 남아도 처리량이 막힌다.', 'w3.flow'],
  ['윈도우가 1 MSS일 때 RTT가 2배로 늘면 처리량 상한도 2배가 된다.', 'X', '처리량 ≈ 윈도우 ÷ RTT이므로 RTT가 2배면 처리량은 <b>절반</b>.', 'w3.window'],
  ['TCP는 라우터에게 혼잡 여부를 직접 물어보고 그에 맞춰 속도를 조절한다.', 'X', 'TCP는 라우터에게 묻지 않는다. <b>손실과 지연 변화를 관찰해 스스로 추정</b>한다.', 'w3.cc'],
  ['리눅스의 기본 혼잡제어 알고리즘은 CUBIC이다.', 'O', '확인: sysctl net.ipv4.tcp_congestion_control → cubic.', 'w3.cc'],
  ['accept()는 이미 핸드셰이크가 끝난 연결을 accept queue에서 꺼내 새 소켓으로 돌려준다.', 'O', 'accept()는 연결을 “만드는” 함수가 아니라 “꺼내는” 함수다. 핸드셰이크는 커널이 한다.', 'w3.sock'],
  ['TCP 클라이언트는 connect() 전에 반드시 bind()로 자기 포트를 직접 지정해야 한다.', 'X', '클라이언트는 bind를 생략한다. OS가 ephemeral 포트를 자동 할당한다.', 'w3.sock'],
  ['recv()가 0(빈 바이트)을 반환하면 상대가 FIN을 보내 연결을 닫았다는 뜻이다.', 'O', '그래서 서버 루프는 b""를 받으면 conn.close() 하고 다음 accept()로 간다.', 'w3.sock'],
],
w4: [
  ['URL의 모든 부분(경로·쿼리 포함)이 DNS 조회에 사용된다.', 'X', 'DNS가 보는 것은 <b>host</b>(도메인)뿐이다. 경로·쿼리는 서버에 도착한 HTTP 요청에서 쓰인다.', 'w4.url'],
  ['https URL에서 포트를 적지 않으면 기본으로 443을 사용한다.', 'O', 'http는 80, https는 443이 기본값.', 'w4.url'],
  ['클라이언트↔리졸버 질의는 재귀 질의, 리졸버↔Root·TLD·권한 서버 질의는 반복 질의이다.', 'O', '재귀 = “끝까지 알아와 줘”, 반복 = “나는 모른다, 저기 물어봐”(referral).', 'w4.resolve'],

<script>
/* 시험 대비 — summary, random quiz, confusing pairs, notes to double-check */
'use strict';
(function () {
const T = H.tbl;

function mountBank(host) {
  const weeks = ['w1', 'w2', 'w3', 'w4'];
  let sel = LS.get('bank.weeks', weeks.slice()), round = [], i = 0;
  const box = document.createElement('div'); host.appendChild(box);
  const newRound = () => {
    const rng = rngFrom(Date.now() & 0xffffffff); const wrong = LS.get('wrong', []);
    const pool = []; sel.forEach(w => (QUIZ[w].bank || []).forEach((q, k) => pool.push({ ...q, qid: w + ':' + k, w })));
    const pri = rng.shuffle(pool.filter(q => wrong.includes(q.qid))), rest = rng.shuffle(pool.filter(q => !wrong.includes(q.qid)));
    round = rng.shuffle(pri.concat(rest).slice(0, Math.min(10, pool.length))).map(q => ({ ...q, order: rng.shuffle(q.opts.map((_, j) => j)), picked: null }));
    i = 0; draw();
  };
  function draw() {
    const done = round.filter(q => q.picked != null), right = done.filter(q => q.order[q.picked] === q.a).length;
    let h = `<div class="lab"><div class="lab-head"><span class="tag">모의 퀴즈</span>문제은행 ${weeks.reduce((a, w) => a + QUIZ[w].bank.length, 0)}문항에서 10문제 · 틀린 문제는 다음 라운드에 먼저 나온다</div><div class="lab-ctl">${weeks.map(w => `<div class="ctl tog"><input type="checkbox" id="bk-${w}" value="${w}" ${sel.includes(w) ? 'checked' : ''}><label for="bk-${w}">${w.slice(1)}주 (${QUIZ[w].bank.length})</label></div>`).join('')}<button class="btn" data-new>이 범위로 새 라운드</button><span class="mono cm" style="margin-left:auto">${right} / ${done.length} 정답 · ${round.length}문제</span></div><div class="lab-out">`;
    if (i < round.length) {
      const q = round[i];
      h += `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px">${round.map((r, k) => `<button class="btn sm" data-go="${k}" style="min-width:34px;${k === i ? 'background:var(--btn);color:var(--btn-ink);border-color:var(--btn)' : r.picked != null ? (r.order[r.picked] === r.a ? 'border-color:var(--ok);color:var(--ok)' : 'border-color:var(--bad);color:var(--bad)') : ''}">${k + 1}</button>`).join('')}<button class="btn sm" data-go="${round.length}">결과</button></div>
<div class="q" style="font-weight:600;font-size:17px;margin-bottom:6px">${i + 1}. ${q.q}</div><div class="mc">${q.order.map((oi, j) => { const cls = q.picked == null ? '' : oi === q.a ? 'right' : j === q.picked ? 'wrong' : ''; return `<button data-pick="${j}" class="${cls}" ${q.picked != null ? 'disabled' : ''}>${String.fromCharCode(9312 + j)} ${q.opts[oi]}</button>`; }).join('')}</div>`;
      if (q.picked != null) h += `<div class="model"><div class="mh">${q.order[q.picked] === q.a ? '정답' : '오답'}</div>${q.why}<div style="margin-top:6px">${H.ref(q.ref, '관련 설명으로 이동')}</div></div><div style="margin-top:10px"><button class="btn pri" data-go="${i + 1}">${i + 1 < round.length ? '다음 문제 ▶' : '결과 보기 ▶'}</button></div>`;
    } else {
      const wrongs = round.filter(q => q.picked != null && q.order[q.picked] !== q.a);
      h += `<div class="big" style="margin-bottom:8px">${right} / ${round.length}</div>${done.length < round.length ? `<p class="cm">안 푼 문제 ${round.length - done.length}개</p>` : ''}${wrongs.length ? `<p><b>틀린 문제</b> — 다음 라운드에 먼저 나온다</p><ul>${wrongs.map(q => `<li>${q.q} ${H.ref(q.ref, '복습')}</li>`).join('')}</ul>` : done.length ? '<p>모두 맞혔다. 새 라운드로 다른 문제를 풀어 보자.</p>' : ''}<button class="btn pri" data-new>새 라운드</button>`;
    }
    box.innerHTML = h + '</div></div>';
    box.querySelectorAll('[data-new]').forEach(b => b.onclick = () => { sel = weeks.filter(w => box.querySelector('#bk-' + w).checked); if (!sel.length) sel = weeks.slice(); LS.set('bank.weeks', sel); newRound(); });
    box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { i = +b.dataset.go; draw(); });
    box.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { const q = round[i]; q.picked = +b.dataset.pick; let w = LS.get('wrong', []); w = q.order[q.picked] !== q.a ? [...new Set([...w, q.qid])] : w.filter(x => x !== q.qid); LS.set('wrong', w); draw(); });
    box.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => APP.goto(b.dataset.goto));
  }
  newRound();
}

/* ---------- OX random mock quiz ---------- */
function mountOX(host) {
  const weeks = ['w1', 'w2', 'w3', 'w4', 'w5', 'quiz'].filter(w => OXBANK[w]);
  const gl = w => w === 'quiz' ? '퀴즈 기출' : w.slice(1) + '주';
  const ALL = []; weeks.forEach(w => OXBANK[w].forEach((r, k) => ALL.push({ id: w + ':' + k, w, no: k + 1, q: r[0], a: r[1], why: r[2], ref: r[3] })));
  let sel = LS.get('ox.groups', weeks.slice()).filter(w => weeks.includes(w)), cnt = LS.get('ox.cnt', 50), round = [], i = 0, onlyWrong = false;
  if (![50, 100, 'all'].includes(cnt)) cnt = 50;
  const box = document.createElement('div'); host.appendChild(box);
  const wrongSet = () => new Set(LS.get('ox.wrong', []));
  function newRound(wrongOnly) {
    onlyWrong = !!wrongOnly;
    const rng = rngFrom((Date.now() ^ (Math.random() * 1e9)) >>> 0); const W = wrongSet();
    let pool = ALL.filter(q => sel.includes(q.w)); if (onlyWrong) pool = pool.filter(q => W.has(q.id));
    const n = cnt === 'all' ? pool.length : Math.min(+cnt, pool.length);
    const pri = rng.shuffle(pool.filter(q => W.has(q.id))), rest = rng.shuffle(pool.filter(q => !W.has(q.id)));
    round = rng.shuffle(pri.concat(rest).slice(0, n)).map(q => ({ ...q, pick: null }));
    i = 0; draw();
  }
  function answer(v) {
    const q = round[i]; if (!q || q.pick) return; q.pick = v;
    const W = wrongSet(); if (v === q.a) W.delete(q.id); else W.add(q.id); LS.set('ox.wrong', [...W]);
    draw();
  }
  function draw() {
    const done = round.filter(q => q.pick), right = done.filter(q => q.pick === q.a).length, W = wrongSet();
    let h = `<div class="lab oxq"><div class="lab-head"><span class="tag">OX 모의 퀴즈</span>문제은행 ${ALL.length}문항 · 매 라운드 무작위 · 틀린 문제는 다음 라운드에 먼저</div>
<div class="lab-ctl">${weeks.map(w => `<div class="ctl tog"><input type="checkbox" id="ox-${w}" value="${w}" ${sel.includes(w) ? 'checked' : ''}><label for="ox-${w}">${gl(w)} (${OXBANK[w].length})</label></div>`).join('')}
<div class="ctl"><label for="ox-cnt">문항 수</label><select id="ox-cnt">${[['50', '50'], ['100', '100'], ['all', '범위 전체']].map(([v, l]) => `<option value="${v}" ${String(cnt) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
<button class="btn pri" data-new>새 라운드</button><button class="btn" data-wrong ${W.size ? '' : 'disabled'}>내 오답만 (${W.size})</button></div><div class="lab-out">`;
    if (!round.length) h += `<p>${onlyWrong ? '선택한 범위에 저장된 오답이 없다.' : '선택한 범위에 문제가 없다.'}</p>`;
    else if (i < round.length) {
      const q = round[i];
      h += `<div class="oxbar"><div class="oxprog"><i style="width:${done.length / round.length * 100}%"></i></div><span class="mono">${i + 1} / ${round.length} · 정답 ${right}</span></div>
<div class="oxdots">${round.map((r, k) => `<button data-go="${k}" class="${k === i ? 'cur' : r.pick ? (r.pick === r.a ? 'ok' : 'no') : ''}" aria-label="${k + 1}번">${k + 1}</button>`).join('')}</div>
<div class="oxcard"><div class="oxmeta">${q.w === 'quiz' ? `<b style="color:var(--l7)">퀴즈 기출 #${q.no}</b>` : q.w.slice(1) + '주차'}${W.has(q.id) && !q.pick ? ' · <b>지난번 오답</b>' : ''}</div><div class="oxq-t">${q.q}</div>
<div class="oxbtn"><button data-ox="O" class="o ${q.pick ? (q.a === 'O' ? 'right' : q.pick === 'O' ? 'wrong' : 'dim') : ''}" ${q.pick ? 'disabled' : ''}>O</button><button data-ox="X" class="x ${q.pick ? (q.a === 'X' ? 'right' : q.pick === 'X' ? 'wrong' : 'dim') : ''}" ${q.pick ? 'disabled' : ''}>X</button></div>`;
      if (q.pick) h += `<div class="model"><div class="mh">${q.pick === q.a ? '⭕ 정답' : '❌ 오답'} — 정답은 ${q.a}</div>${q.why}<div style="margin-top:6px">${H.ref(q.ref, '관련 설명으로 이동')}</div></div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn pri" data-go="${i + 1}">${i + 1 < round.length ? '다음 문제 ▶' : '결과 보기 ▶'}</button></div>`;
      else h += `<p class="cm" style="font-size:13px;margin:10px 0 0">키보드: O / X 로 답하고 Enter 또는 → 로 다음 문제</p>`;
      h += `</div>`;
    } else {
      const wr = round.filter(q => q.pick && q.pick !== q.a);
      const byW = weeks.filter(w => round.some(q => q.w === w)).map(w => { const r = round.filter(q => q.w === w); return `${gl(w)} ${r.filter(q => q.pick === q.a).length}/${r.length}`; }).join(' · ');
      h += `<div class="big" style="margin-bottom:4px">${right} / ${round.length}</div><p class="mono cm" style="margin:0 0 10px">${byW}${done.length < round.length ? ` · 안 푼 문제 ${round.length - done.length}` : ''}</p>`;
      if (wr.length) h += `<p><b>틀린 문제 ${wr.length}개</b> — 해설과 함께 다시 보기</p><div class="oxrev">${wr.map(q => `<div><div class="oxq-t" style="font-size:15.5px">${q.q} <b class="mono">→ ${q.a}</b></div><div class="cm" style="font-size:14px">${q.why} ${H.ref(q.ref, '복습')}</div></div>`).join('')}</div>`;
      else if (done.length) h += '<p>전부 맞혔다. 범위를 넓히거나 새 라운드로 다른 문제를 풀어 보자.</p>';
      h += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn pri" data-new>새 라운드</button>${wr.length ? `<button class="btn" data-retry>방금 틀린 ${wr.length}문제 다시</button>` : ''}</div>`;
    }
    box.innerHTML = h + '</div></div>';
    const readSel = () => { sel = weeks.filter(w => box.querySelector('#ox-' + w).checked); if (!sel.length) sel = weeks.slice(); LS.set('ox.groups', sel); cnt = box.querySelector('#ox-cnt').value; if (cnt !== 'all') cnt = +cnt; LS.set('ox.cnt', cnt); };
    box.querySelectorAll('[data-new]').forEach(b => b.onclick = () => { readSel(); newRound(false); });
    const wb = box.querySelector('[data-wrong]'); if (wb) wb.onclick = () => { readSel(); newRound(true); };
    const rb = box.querySelector('[data-retry]'); if (rb) rb.onclick = () => { const ids = new Set(round.filter(q => q.pick && q.pick !== q.a).map(q => q.id)); round = rngFrom(Date.now() >>> 0).shuffle(round.filter(q => ids.has(q.id))).map(q => ({ ...q, pick: null })); i = 0; draw(); };
    box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { i = +b.dataset.go; draw(); });
    box.querySelectorAll('[data-ox]').forEach(b => b.onclick = () => answer(b.dataset.ox));
    box.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => APP.goto(b.dataset.goto));
  }
  box.tabIndex = -1;
  document.addEventListener('keydown', e => {
    if (!box.isConnected || !round.length || i >= round.length) return;
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const r = box.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
    const k = e.key.toLowerCase();
    if (k === 'o' || k === '0') { answer('O'); e.preventDefault(); }
    else if (k === 'x') { answer('X'); e.preventDefault(); }
    else if ((k === 'enter' || k === 'arrowright') && round[i].pick) { i++; draw(); e.preventDefault(); }
  });
  newRound(false);
}

  ["Client와 Server는 장치 종류가 아니라 통신에서의 역할이다.", "O", "Client/Server는 <b>통신에서의 역할</b>이다. 같은 노트북이 브라우저(Client)이면서 동시에 localhost:8000 서버(Server)일 수 있다.", "w1.cs"],
  ["Edge computing은 Cloud를 완전히 대체하는 기술이다.", "X", "Edge는 Cloud를 <b>보완</b>한다. 지연에 민감한 판단은 현장(Edge)에서, 저장·학습·집계는 Cloud에서 — 둘을 <b>나눠 쓰는 것</b>이 핵심이다.", "w1.place"],
  ["AI 서비스도 결국 네트워크를 통해 request와 response를 주고받는다.", "O", "AI 서비스도 Client → API Server → GPU 서버로 가는 <b>request/response</b>이다. 모델이 클 뿐 네트워크 흐름은 같다.", "w1.journey"],
  ["인터넷은 하나의 거대한 단일 네트워크가 아니라, 공통 프로토콜(IP)로 상호 연결된 독립 네트워크들의 집합이다.", "O", "인터넷 = <b>Network of Networks</b>. 각 ISP·기관의 독립 네트워크가 공통 언어 <b>IP</b>로 서로 연결된 것이다.", "w1.internet"],
  ["Switch는 서로 다른 네트워크 사이에서 IP 주소를 보고 패킷의 다음 경로를 결정하는 L3 장비이다.", "X", "설명은 <b>Router</b>(L3, IP로 경로 결정)에 대한 것이다. <b>Switch는 L2</b> 장비로, 같은 네트워크 안에서 <b>MAC 주소</b>를 보고 프레임을 전달한다.", "w1.layer"],
  ["Packet switching 방식에서는 여러 사용자가 링크를 공유하므로, 트래픽이 몰리면 혼잡(Congestion)으로 지연과 손실이 발생할 수 있다.", "O", "Packet switching은 링크를 <b>나눠 쓴다</b>(효율 ↑). 대신 몰리면 라우터 큐가 차서 <b>지연(큐잉)·손실</b>이 생긴다 — 이것이 혼잡이다.", "w1.packet"],
  ["Throughput은 링크가 이론적으로 전달할 수 있는 최대 데이터량을 의미한다.", "X", "그건 <b>Bandwidth</b>(이론상 최대)의 정의다. <b>Throughput</b>은 실제로 전달된 양이며, 경로 중 <b>가장 좁은 병목</b>과 프로토콜 오버헤드에 좌우된다.", "w1.perf"],
  ["Endpoint는 주소, Port, Path의 조합으로 표현되는 서비스의 구체적 접근 지점이다.", "O", "Endpoint = <b>주소(host) + Port + Path</b>. 예: <code>http://127.0.0.1:8000/api/chat</code> — 서비스에 접근하는 구체적 지점이다.", "w1.cs"],
  ["MQTT는 Broker 없이 발행자와 구독자가 직접 연결되는, 고성능 네트워크 전용의 무거운 메시지 프로토콜이다.", "X", "MQTT는 <b>Broker를 거치는</b> Publish/Subscribe 구조이고, 저전력·저대역 IoT 장치를 위한 <b>가벼운</b> 프로토콜이다. 장치는 Broker 하나만 알면 된다.", "w1.place"],
  ["Availability Zone(AZ)은 한 Region 안에서 장애가 서로 전파되지 않도록 분리된 구역이다.", "O", "AZ는 한 Region 안에서 전원·네트워크가 분리된 데이터센터 구역이다. 한 AZ 장애가 다른 AZ로 번지지 않도록 <b>여러 AZ에 나눠 배치</b>한다.", "w1.place"],
  ["Local Inference는 단말이 데이터를 클라우드 서버로 보내 추론 결과를 받아오는 방식이다.", "X", "그건 Cloud(원격) 추론이다. <b>Local inference</b>는 데이터를 보내지 않고 <b>단말·Edge 장치에서 직접</b> 추론해 지연·대역폭·개인정보 부담을 줄인다.", "w1.place"],
  ["HTTP, DNS, MQTT는 네트워크 계층(Network Layer)에서 동작하는 프로토콜이다.", "X", "HTTP · DNS · MQTT는 모두 <b>응용 계층(Application, L7)</b> 프로토콜이다. 네트워크 계층(L3)은 IP.", "w1.layer"],
  ["QUIC은 TCP 위에서 동작하며 빠른 연결과 암호화를 내장한 전송 프로토콜이다.", "X", "QUIC은 <b>UDP 위</b>에서 동작한다. 신뢰성·혼잡 제어·TLS 1.3 암호화를 사용자 공간에서 직접 구현했다(HTTP/3의 기반).", "w4.ver"],
  ["HTTPS는 HTTP를 TLS로 암호화한 형태이며, TLS의 이전 이름은 SSL이다.", "O", "HTTPS = HTTP over <b>TLS</b>. TLS는 SSL(Secure Sockets Layer)의 후속으로, 지금도 관습적으로 “SSL 인증서”라고 부른다.", "w4.https"],
  ["AI Coding Agent가 생성한 네트워크 코드는 문법 오류만 없으면 포트·보안·로그를 별도로 확인하지 않고 배포해도 된다.", "X", "문법이 맞아도 <b>0.0.0.0 노출 · 하드코딩된 포트 · 인증 없음 · 로그 부재</b> 같은 문제가 남는다. AI가 만든 코드는 포트·보안·로그를 <b>사람이 검증</b>해야 한다.", "w1.lab"],
  ["192.168.1.20/24와 192.168.2.20/24는 같은 subnet에 속한다.", "X", "/24면 앞 3옥텟이 네트워크 부분이다. <b>192.168.1</b>.0 ≠ <b>192.168.2</b>.0 → 다른 subnet.", "w2.and"],
  ["192.168.10.0/26의 Broadcast 주소는 192.168.10.63이다.", "O", "/26 → 블록 크기 2^(32−26) = <b>64</b>. 0~63이 한 블록이므로 Network = .0, <b>Broadcast = .63</b>.", "w2.range"],
  ["192.168.10.0/26에서 호스트에 할당 가능한 주소는 64개이다.", "X", "주소는 64개지만 Network(.0)와 Broadcast(.63)를 빼면 할당 가능한 호스트는 <b>64 − 2 = 62개</b>.", "w2.range"],
  ["127.0.0.1:8000에서 127.0.0.1은 호스트(자기 자신)를, 8000은 그 호스트 안의 프로세스(서비스)를 식별한다.", "O", "IP는 <b>호스트</b>를, Port는 그 호스트 안의 <b>프로세스(서비스)</b>를 가리킨다. 아파트 동·호수 비유: IP = 건물, Port = 호수.", "w2.port"],
  ["목적지가 내 subnet 밖에 있을 때 호스트는 패킷을 Default Gateway에 맡긴다.", "O", "목적지가 <b>내 subnet 밖</b>(IP AND Mask 결과가 다름)이면 Default Gateway에 맡긴다. 그다음 경로는 Router들이 결정한다.", "w2.decide"],
  ["같은 subnet 안의 호스트와 통신할 때도 패킷은 항상 Default Gateway(라우터)를 거쳐야 한다.", "X", "같은 subnet이면 <b>ARP로 상대 MAC을 알아내 직접</b> 보낸다(Switch만 거침). Gateway는 subnet 밖으로 나갈 때만.", "w2.decide"],
  ["패킷이 Router를 지날 때마다 MAC 주소는 바뀌지만, 목적지 IP 주소는 (NAT가 없다면) 그대로 유지된다.", "O", "MAC은 “이 링크의 다음 장비” → hop마다 <b>새로 씀</b>. IP는 “최종 목적지” → <b>유지</b>(NAT가 없을 때).", "w2.hop"],
  ["ARP는 같은 네트워크에서 IPv4 주소에 해당하는 MAC 주소를 알아내는 프로토콜이다.", "O", "ARP = Address Resolution Protocol. “192.168.0.1 가진 사람?”을 브로드캐스트해 그 IP의 <b>MAC</b>을 알아낸다.", "w2.hop"],
  ["Private IP를 가진 PC가 Internet에 접속할 수 있는 것은 공유기(게이트웨이)의 NAT가 Private 주소를 Public 주소로 변환해 주기 때문이다.", "O", "Private IP는 인터넷에서 라우팅되지 않는다. 공유기 NAT가 출발지를 <b>Public IP(:port)로 바꿔</b> 내보내고, 응답은 NAT 테이블로 되돌린다.", "w2.nat"],
  ["서버 프로세스를 0.0.0.0에 bind하면 Public Internet에 자동으로 공개된다.", "X", "0.0.0.0 bind는 “이 PC의 <b>모든 NIC</b>에서 받겠다”는 뜻일 뿐이다. 인터넷 공개에는 <b>Public IP + 포트포워딩/터널 + 방화벽 허용</b>이 따로 필요하다.", "w2.expose"],
  ["172.16.5.10은 Private IP 대역에 속한다.", "O", "Private 대역 172.16.0.0/12 = <b>172.16.0.0 ~ 172.31.255.255</b>. 172.16.5.10은 그 안이다.", "w2.addr"],
  ["172.32.1.1은 Private IP 대역(172.16.0.0/12)에 속한다.", "X", "/12면 두 번째 옥텟은 <b>16~31</b>까지다. 172.<b>32</b>는 범위 밖 → Public 주소.", "w2.addr"],
  ["Subnetting은 Prefix 길이를 줄여 하나의 주소 공간을 여러 Subnet으로 분할하는 일이다.", "X", "Subnetting은 Prefix를 <b>늘려서</b>(예: /24 → /26) 호스트 비트를 빌려 subnet을 만든다. Prefix를 줄이는 것은 합치기(Supernetting·요약).", "w2.split"],
  ["Longest Prefix Match는 여러 경로 중 prefix가 가장 짧은(가장 넓은) 경로를 선택하는 규칙이다.", "X", "LPM은 매칭되는 경로 중 prefix가 <b>가장 긴(가장 구체적인)</b> 경로를 고른다. /0(default)은 가장 짧아 맨 마지막 후보.", "w2.route"],
  ["Default Route(0.0.0.0/0)는 더 구체적인 경로가 없을 때 사용하는 기본 경로이다.", "O", "0.0.0.0/0은 모든 주소와 매칭되지만 prefix 길이가 0이라, 더 구체적인 경로가 없을 때만 쓰인다 — “모르면 여기로”.", "w2.route"],
  ["DHCP가 IP를 할당받는 DORA 절차는 Discover → Offer → Request → ACK 순서이다.", "O", "<b>D</b>iscover(브로드캐스트) → <b>O</b>ffer → <b>R</b>equest → <b>A</b>CK = DORA.", "w2.dhcp"],
  ["DHCP로 받은 IP 주소는 Lease Time과 무관하게 영구적으로 사용할 수 있다.", "X", "DHCP 주소는 <b>임대(Lease)</b>다. 기간 안에 갱신해야 하고, 만료되면 반납되어 다른 장치에 줄 수 있다.", "w2.dhcp"],
  ["PAT(NAPT)는 IP 주소와 함께 Port까지 변환하는 방식이며, 흔히 그냥 NAT라고 부른다.", "O", "PAT(NAPT)는 IP와 <b>Port까지</b> 바꿔서 Public IP 하나를 여러 장치가 나눠 쓴다. 가정용 공유기의 “NAT”가 사실 이것.", "w2.nat"],
  ["클라우드에서 Security Group은 서브넷 단위로, Network ACL은 인스턴스 단위로 적용되는 접근 제어 규칙이다.", "X", "<b>반대</b>다. Security Group은 <b>인스턴스(ENI) 단위</b>(stateful), Network ACL은 <b>서브넷 단위</b>(stateless) 규칙이다.", "w2.vpc"],
  ["Private Subnet은 인터넷에서 직접 접근할 수 없으며, 밖으로 나가야 할 때는 NAT Gateway를 사용할 수 있다.", "O", "Private Subnet에는 IGW 경로가 없어 밖에서 들어올 수 없다. 패키지 설치처럼 <b>나가야</b> 할 때는 NAT Gateway(Public Subnet에 위치)를 거친다.", "w2.vpc"],
  ["Connection refused는 응답이 아예 오지 않는 상태로, 주로 방화벽이나 경로 문제를 뜻한다.", "X", "그건 <b>timed out</b>의 설명이다. <b>Refused</b>는 SYN이 서버 OS에 <b>도착했는데</b> 그 포트에 listen 소켓이 없어 <b>RST가 즉시</b> 돌아온 것 → 프로세스·포트·bind 주소를 본다.", "w3.diag"],
  ["netstat -ano는 도메인 이름에 대한 DNS 질의 결과를 확인하는 명령이다.", "X", "netstat -ano는 <b>연결·LISTEN 포트와 PID</b>를 보여 준다(“내 서버가 그 포트에 떠 있나?”). DNS 확인은 <b>nslookup</b>.", "w2.trouble"],
  ["Troubleshooting Ladder에서는 보통 DNS부터 확인한 뒤 마지막에 서비스 실행과 Bind/Port를 확인한다.", "X", "Ladder는 <b>아래(내 쪽)부터</b>: Service 실행 → Bind/Port → 방화벽 → 경로(NAT·라우팅) → DNS. 서비스가 안 떠 있으면 DNS를 고쳐도 소용없다.", "w2.trouble"],
  ["3-way handshake에서 세 번째 ACK가 필요한 이유 중 하나는, 늦게 도착한 오래된 중복 SYN(Old Duplicate SYN)으로 잘못된 연결이 성립하는 것을 막기 위해서이다.", "O", "세 번째 ACK가 없으면 Server는 <b>Client가 지금 원하는 연결인지</b> 확인할 수 없다. 오래된 중복 SYN에 Client가 ACK하지 않으므로 잘못된 연결이 성립하지 않는다.", "w3.hs"],
  ["TCP 3-way handshake는 SYN → ACK → SYN+ACK 순서로 진행된다.", "X", "순서는 <b>SYN → SYN+ACK → ACK</b>. Server가 받은 SYN에 ACK하면서 자기 SYN을 함께 보낸다.", "w3.hs"],
  ["UDP는 TCP보다 링크의 대역폭 자체를 늘려 주기 때문에 어떤 상황에서도 데이터 전송이 더 빠르다.", "X", "UDP는 대역폭을 늘리지 않는다. 연결 설정·재전송·혼잡 제어를 <b>생략</b>해 오버헤드와 대기가 적을 뿐이고, 손실 처리는 앱의 몫이다(“UDP는 생략이다”).", "w3.udp"],
  ["UDP 헤더는 8바이트이며 Source Port, Destination Port, Length, Checksum 네 필드로 구성된다.", "O", "UDP 헤더 = <b>8바이트</b>: Source Port(2) · Destination Port(2) · Length(2) · Checksum(2).", "w3.hdr"],
  ["Port는 번호(주소)이고 Socket은 그 주소에 묶인 통신 객체이므로, 하나의 포트 위에 여러 개의 소켓이 존재할 수 있다.", "O", "Port는 16비트 <b>번호</b>, Socket은 그 번호에 묶인 <b>통신 객체(FD)</b>다. 서버의 443에는 listen 소켓 1개 + 연결 소켓 N개가 함께 존재한다.", "w3.sock"],
  ["TCP 연결은 목적지 IP와 목적지 Port의 2-tuple만으로 식별된다.", "X", "TCP 연결은 <b>4-tuple</b>(출발지 IP · 출발지 Port · 목적지 IP · 목적지 Port)로 식별한다. 2-tuple로 구분하는 것은 UDP demux.", "w3.mux"],
  ["listen 소켓은 새 연결을 받아 큐에 넣는 역할만 하고, 실제 데이터 send/recv는 accept()가 반환한 연결 소켓이 담당한다.", "O", "listen 소켓은 “접수 창구”, accept()가 돌려준 <b>연결 소켓</b>이 실제 상담(send/recv)을 맡는다.", "w3.sock"],
  ["accept()는 서버 애플리케이션이 클라이언트와 3-way handshake를 직접 수행하는 함수이다.", "X", "Handshake는 <b>커널(OS)</b>이 처리해 완료된 연결을 Accept queue에 넣는다. accept()는 그 큐에서 <b>하나를 꺼내</b> 연결 소켓을 받을 뿐이다.", "w3.sock"],
  ["Flow control은 네트워크(병목 라우터)를 보호하고, Congestion control은 수신자의 버퍼를 보호한다.", "X", "<b>반대</b>다. Flow control(rwnd)은 <b>수신자 버퍼</b>를, Congestion control(cwnd)은 <b>네트워크(병목)</b>를 보호한다.", "w3.flow"],
  ["TCP 송신자가 실제로 보낼 수 있는 양(Effective Window)은 min(rwnd, cwnd)이다.", "O", "송신자는 수신자(rwnd)와 네트워크(cwnd) <b>둘 다</b> 감당할 수 있는 만큼만 보낸다 → <b>min(rwnd, cwnd)</b>.", "w3.flow"],
  ["누적 ACK 환경에서 같은 ack 번호의 중복 ACK가 반복되면, 송신자는 뒤의 데이터는 도착하고 있으나 특정 조각 하나가 빠졌음을 알 수 있다.", "O", "누적 ACK는 “여기까지 다 받았다”이므로, 같은 ack가 반복되면 그 뒤 데이터는 도착 중인데 <b>한 조각이 빠진 것</b>이다. 3 dup ACK → 빠른 재전송.", "w3.loss"],
  ["CLOSE_WAIT은 먼저 close()한 쪽이 늦은 패킷을 흡수하기 위해 2×MSL 동안 머무는 정상적인 상태이다.", "X", "그건 <b>TIME_WAIT</b>의 설명이다. <b>CLOSE_WAIT</b>은 <b>상대가 먼저</b> 닫았는데 내 앱이 아직 close()를 안 한 상태 — 기한 없이 남는다.", "w3.close"],
  ["CLOSE_WAIT 소켓이 계속 누적된다면, 내 애플리케이션이 close()를 호출하지 않는 코드 버그(소켓 누수)를 의심해야 한다.", "O", "CLOSE_WAIT은 내 코드가 close()를 해야 끝난다. 누적 = <b>소켓 누수 버그</b> → with · finally로 반드시 닫자.", "w3.close"],
  ["Connection refused는 대상 포트에 listen 소켓이 없어 RST가 돌아온 경우이고, Connection timed out은 SYN에 응답이 없는 경우라서 두 오류의 조사 방향이 다르다.", "O", "Refused = 도착했고 거절(RST) → <b>서버 프로세스·포트·bind</b> 조사. Timed out = 응답 없음 → <b>방화벽·SG·라우팅·NAT</b> 조사.", "w3.diag"],
  ["TCP의 Sequence Number는 몇 번째 세그먼트인지를 나타내는 세그먼트 번호이다.", "X", "Seq는 세그먼트 번호가 아니라 그 세그먼트 <b>첫 바이트의 번호</b>(바이트 단위)다.", "w3.seq"],
  ["seq=1, len=1460인 세그먼트를 정상적으로 받은 수신자는 ack=1461을 보낸다.", "O", "ack = “다음에 받을 바이트 번호” = 1 + 1460 = <b>1461</b>.", "w3.seq"],
  ["Slow Start는 cwnd를 매 RTT마다 +1 MSS씩 천천히 늘리는 단계이다.", "X", "Slow Start는 ACK마다 +1 MSS → RTT마다 <b>2배</b>(지수). RTT마다 +1 MSS는 ssthresh 이후의 <b>Congestion Avoidance</b>.", "w3.cc"],
  ["AIMD는 천천히(가산적으로) 올리고 손실 시 급히(절반으로) 내리는 혼잡 제어 규칙이다.", "O", "AIMD = Additive Increase(+1 MSS/RTT), Multiplicative Decrease(손실 시 ½). 톱니 모양 cwnd 그래프가 나온다.", "w3.cc"],
  ["수신자가 win=0을 광고해 전송이 멈추는 Zero Window 현상의 주된 원인은 네트워크 혼잡이다.", "X", "win=0은 <b>수신 앱이 버퍼를 늦게 읽어서</b>(flow control) 생긴다. 네트워크 혼잡은 cwnd 쪽 이야기.", "w3.flow"],
  ["BDP(Bandwidth-Delay Product)는 대역폭 × RTT로, 링크를 꽉 채우는 데 필요한 윈도우 크기를 의미한다.", "O", "BDP = Bandwidth × RTT = “파이프 안에 동시에 떠 있을 수 있는 데이터 양”. 윈도우가 이보다 작으면 링크를 다 못 쓴다.", "w3.window"],
  ["TCP는 바이트 스트림이므로 송신 측의 send() 3번이 수신 측에서 recv() 1번으로 합쳐져 읽힐 수 있다.", "O", "TCP는 <b>메시지 경계가 없는 바이트 스트림</b>이다. send 3번이 recv 1번으로 합쳐지거나 쪼개질 수 있어, 앱이 길이·구분자로 경계를 정해야 한다.", "w3.vs"],
  ["UDP는 unicast만 가능하고, TCP는 broadcast와 multicast까지 지원한다.", "X", "<b>반대</b>다. UDP는 연결이 없으므로 unicast·<b>broadcast·multicast</b> 모두 가능하고(DHCP·mDNS), TCP는 1:1 연결이라 <b>unicast만</b> 된다.", "w3.udp"],
  ["SO_REUSEADDR은 TIME_WAIT 때문에 서버 재시작 시 bind()가 EADDRINUSE로 실패하는 것을 피하기 위한 소켓 옵션이다.", "O", "서버 재시작 직후 이전 연결의 TIME_WAIT 때문에 bind()가 EADDRINUSE로 실패하는 것을 SO_REUSEADDR로 피한다.", "w3.close"],
  ["ss 출력에서 Recv-Q가 계속 쌓이면 네트워크가 병목이고, Send-Q가 계속 쌓이면 수신 앱이 병목이다.", "X", "<b>반대</b>다. Recv-Q가 쌓임 = <b>내(수신) 앱이 안 읽음</b> → 앱 병목. Send-Q가 쌓임 = 보냈지만 ACK를 못 받음 → <b>네트워크·상대 수신 측</b> 병목.", "w3.diag"],
  ["QUIC은 커널이 아닌 사용자 공간(User Space)에서 구현되며, Connection ID 덕분에 Wi-Fi ↔ LTE처럼 IP가 바뀌어도 연결을 유지할 수 있다.", "O", "QUIC은 <b>User space</b> 라이브러리라 빠르게 개선·배포된다. 연결을 4-tuple이 아닌 <b>Connection ID</b>로 식별해 IP가 바뀌어도 유지된다.", "w4.ver"],
  ["HTTP/3는 443 포트를 사용하므로 TCP 위에서 동작한다.", "X", "HTTP/3는 <b>UDP 443</b> 위의 QUIC이다. 포트 번호는 TCP/UDP를 결정하지 않는다(TCP 443 = HTTP/1.1·2, UDP 443 = HTTP/3).", "w4.ver"],
  ["DNS가 주로 UDP를 사용하는 이유는 질의 하나·응답 하나로 끝나는 통신에 3-way handshake로 1 RTT를 더 쓰는 것이 아깝기 때문이다.", "O", "질의 1개·응답 1개로 끝나는데 handshake로 1 RTT를 더 쓰는 것은 아깝다. 응답이 크거나(zone transfer) 잘리면 TCP로 다시 묻는다.", "w3.udp"],
  ["Exponential Backoff는 타임아웃이 반복될 때마다 RTO를 절반으로 줄여 더 빨리 재전송하는 규칙이다.", "X", "Exponential backoff는 타임아웃이 반복될 때마다 RTO를 <b>2배로 늘린다</b>(혼잡할 때 재전송을 더 몰아넣지 않으려고).", "w3.rto"],
  ["이더넷 MTU가 1500B이고 IP 헤더와 TCP 헤더가 각각 20B라면 MSS는 1460B이다.", "O", "MSS = MTU − IP 헤더 − TCP 헤더 = 1500 − 20 − 20 = <b>1460B</b>.", "w3.hdr"],
  ["TIME_WAIT 상태는 연결 종료 시 나중에 close()한 쪽(수동 종료 측)에 생긴다.", "X", "TIME_WAIT은 <b>먼저 close()한 쪽(능동 종료)</b>에 생긴다. 나중에 닫는 쪽은 CLOSE_WAIT → LAST_ACK를 거친다.", "w3.close"],
  ["DNS는 URL 전체가 아니라 host(도메인) 부분만 알며, path와 query string은 알지 못한다.", "O", "DNS는 <b>host</b>(예: www.example.com)만 IP로 바꾼다. path·query는 HTTP 요청 안에 들어가 서버가 읽는다.", "w4.url"],
  ["URL의 Fragment(#…) 부분은 서버로 전송되어 서버가 페이지 위치를 결정하는 데 사용된다.", "X", "Fragment(#…)는 <b>브라우저 안에서만</b> 쓰인다(페이지 내 위치). 서버로 전송되지 않는다.", "w4.url"],
  ["클라이언트(Stub Resolver)와 재귀 리졸버 사이에서는 재귀 질의가, 재귀 리졸버와 root·TLD·권한 서버 사이에서는 반복 질의가 일어난다.", "O", "Stub ↔ 리졸버 = <b>재귀</b>(“끝까지 알아와 줘”). 리졸버 ↔ Root·TLD·권한 서버 = <b>반복</b>(“나는 모르니 저기 물어봐”).", "w4.resolve"],
  ["DNS 레코드를 바꿨는데 일부 사용자만 옛 서버로 가는 것은, 리졸버·OS·브라우저 캐시에 남은 이전 응답의 TTL이 아직 만료되지 않았기 때문이다.", "O", "각 캐시(리졸버·OS·브라우저)는 받은 응답을 <b>TTL 동안</b> 재사용한다. 만료 전인 사용자는 옛 IP로 간다.", "w4.ttl"],
  ["DNS Propagation은 변경된 레코드를 권한 서버가 전 세계 리졸버로 능동적으로 푸시(push)하는 과정이다.", "X", "푸시는 없다. 권한 서버는 기다릴 뿐이고, 각 리졸버의 <b>캐시 TTL이 만료되어 다시 물을 때</b> 새 값이 퍼진다 — “propagation”은 캐시 만료의 다른 이름.", "w4.ttl"],
  ["HTTP/1.1 메시지에서 헤더와 본문의 경계는 빈 줄(CRLF CRLF)로 구분된다.", "O", "시작줄 + 헤더들 + <b>빈 줄(CRLF CRLF)</b> + 본문. 빈 줄이 “헤더 끝”을 알린다.", "w4.msg"],
  ["PUT은 같은 요청을 N번 보내도 서버 상태가 1번 보낸 것과 같아 멱등이지만, POST는 보낼 때마다 새 자원이 생성될 수 있어 멱등이 아니다.", "O", "멱등 = N번 보내도 <b>서버 상태</b>가 1번과 같다. PUT(통째로 교체)은 멱등, POST(생성)는 보낼 때마다 새 자원이 생길 수 있다.", "w4.method"],
  ["응답만 유실되었을 가능성이 있더라도, POST 요청은 자동 재시도해도 항상 안전하다.", "X", "응답만 유실되었을 수 있으므로 POST 재시도는 <b>중복 생성·중복 결제</b> 위험이 있다. Idempotency-Key 같은 장치가 필요하다.", "w4.method"],
  ["DELETE는 같은 요청을 두 번째 보내면 404가 반환될 수 있으므로 멱등이 아니다.", "X", "멱등은 <b>응답</b>이 아니라 <b>서버 상태</b> 기준이다. 두 번째 DELETE가 404를 받아도 “지워진 상태”는 같으므로 <b>멱등</b>이다.", "w4.method"],
  ["404는 주로 애플리케이션 서버가 만든 응답이고, 502는 프록시(리버스 프록시·LB)가 뒷단 서버에 연결하지 못했거나 잘못된 응답을 받았을 때 만든 응답이다.", "O", "404는 App Server가 “그 경로 없음”이라고 답한 것(DNS·TCP·TLS는 성공). 502·504는 <b>프록시·LB</b>가 뒷단 실패를 번역한 것이다.", "w4.status"],
  ["401 Unauthorized는 누구인지는 알지만 권한이 없을 때, 403 Forbidden은 누구인지 모를 때(토큰 없음·만료) 사용한다.", "X", "<b>반대</b>다. 401 = <b>누구인지 모름</b>(토큰 없음·만료), 403 = <b>누군지 알지만 권한 없음</b>.", "w4.status"],
  ["HTTP/2는 한 TCP 연결에서 여러 스트림을 다중화해 HTTP 계층의 HOL blocking을 해결했지만, TCP 계층의 HOL blocking은 남아 있어 HTTP/3가 등장했다.", "O", "HTTP/2는 한 연결에 스트림을 다중화해 HTTP 계층 HOL을 해결했지만, TCP는 바이트 순서를 지켜야 해 패킷 하나 유실 시 <b>모든 스트림이 대기</b>(TCP HOL) → HTTP/3(QUIC).", "w4.ver"],
  ["HTTPS를 사용하면 접속하는 도메인 이름(SNI)과 목적지 IP 주소까지 모두 암호화되어 경로상에서 보이지 않는다.", "X", "<b>목적지 IP</b>는 IP 헤더에, <b>SNI</b>는 ClientHello에 평문으로 보인다(ECH를 쓰지 않는 한). 그래서 “어느 사이트에 가는지”는 보인다.", "w4.https"],
  ["HTTPS에서는 URL의 path와 query string, HTTP 헤더, 본문이 암호화되어 경로상에서 보이지 않는다.", "O", "TLS 안으로 들어가는 것은 HTTP 메시지 전체 — <b>path · query · 헤더(쿠키·토큰) · 본문</b>이다.", "w4.https"],
  ["브라우저는 인증서를 검증할 때 신뢰 체인(Leaf → Intermediate → Root), 유효기간, SAN에 있는 도메인 이름과 접속 도메인의 일치 여부 등을 확인한다.", "O", "체인(Leaf → Intermediate → Root), 유효기간, <b>SAN</b>의 도메인 일치, 폐기 여부 등을 확인한다.", "w4.tls"],
  ["서버가 Intermediate 인증서를 빠뜨려도 Root CA가 Trust Store에 있으면 인증서 검증은 항상 성공한다.", "X", "Root는 Intermediate를, Intermediate는 Leaf를 서명했다. Intermediate가 없으면 Leaf에서 Root까지 <b>체인을 이을 수 없어 검증 실패</b>한다(일부 브라우저만 우회 다운로드로 구제).", "w4.tls"],
  ["DevTools 워터폴에서 다른 구간은 짧고 TTFB만 길다면, DNS나 TCP 연결보다 서버 측 처리(애플리케이션·DB·upstream) 지연을 먼저 의심해야 한다.", "O", "TTFB = 요청을 보낸 뒤 첫 바이트까지 = <b>서버 처리 시간</b> + 1 RTT. 다른 구간이 짧고 이것만 길면 App·DB·upstream을 본다.", "w4.obs"],
  ["CNAME 레코드는 zone 최상단(apex, 예: example.com)에도 자유롭게 둘 수 있다.", "X", "apex(example.com)에는 SOA·NS 레코드가 반드시 있는데, CNAME은 <b>다른 레코드와 공존할 수 없어</b> 둘 수 없다. 그래서 클라우드 DNS는 ALIAS·ANAME을 제공한다.", "w4.rec"],
  ["MX 레코드는 IP 주소를 도메인 이름으로 바꾸는 역방향 조회용 레코드이다.", "X", "그건 <b>PTR</b>(역방향) 레코드다. <b>MX</b>는 그 도메인의 <b>메일 서버</b>를 지정한다.", "w4.rec"],
  ["'그런 이름 없음(NXDOMAIN)' 응답은 캐시되지 않으므로, 레코드를 새로 추가하면 즉시 모든 사용자에게 반영된다.", "X", "NXDOMAIN도 SOA의 negative TTL 동안 <b>캐시된다(Negative caching)</b>. 막 만든 레코드가 일부 사용자에게 안 보이는 이유.", "w4.ttl"],
  ["Cache-Control: no-cache는 응답을 캐시에 저장하는 것 자체를 금지한다는 의미이다.", "X", "그건 <b>no-store</b>다. <b>no-cache</b>는 저장은 하되 쓰기 전에 <b>매번 검증</b>(If-None-Match → 304)한다.", "w4.cache"],
  ["304 Not Modified는 캐시 검증 결과 기존 캐시를 그대로 써도 된다는 응답이며 본문이 없다.", "O", "304 = “네가 가진 사본(ETag) 그대로 써도 된다”. 본문 없이 헤더만 와서 전송량이 줄어든다.", "w4.cache"],
  ["TLS에서 실제 데이터 암호화에는 주로 공개키 암호(RSA 등)가 쓰이고, 대칭키 암호는 신원 증명에만 쓰인다.", "X", "<b>반대</b>다. 실제 데이터는 빠른 <b>대칭키</b>(AES-GCM 등)로 암호화하고, 공개키·서명(ECDHE·RSA·ECDSA)은 <b>키 교환과 신원 증명</b>에 쓴다.", "w4.tls"],
  ["Forward Secrecy가 보장되면 서버 개인키가 나중에 유출되더라도 과거에 기록된 트래픽을 복호화할 수 없다.", "O", "(EC)DHE로 연결마다 <b>일회용 키</b>를 만들고 버리므로, 서버 장기 개인키가 유출돼도 과거 세션 키를 계산할 수 없다.", "w4.tls"],

const abNorm = s => String(s).toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/[^a-z0-9]/g, '').replace(/s$/, '');
function abCheck(input, forms) {
  const a = abNorm(input); if (!a) return false;

}

    box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { i = +b.dataset.go; draw(); });
    box.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => APP.goto(b.dataset.goto));
    if (!ex || i >= ex.items.length) return;
    const it = ex.items[i];
    box.querySelectorAll('[data-ox]').forEach(b => b.onclick = () => answerOX(b.dataset.ox));
    box.querySelectorAll('[data-ab]').forEach(inp => { inp.oninput = () => { it.ans[+inp.dataset.ab] = inp.value; save(); }; inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const n = box.querySelector(`[data-ab="${+inp.dataset.ab + 1}"]`); if (n) n.focus(); else chkAb(); } }; });
    const ac = box.querySelector('[data-abchk]'); if (ac) ac.onclick = chkAb;
    box.querySelectorAll('[data-ov]').forEach(b => b.onclick = () => { const j = +b.dataset.ov; it.ov[j] = it.ov[j] ? null : true; record(it); draw(); });
    const ta = box.querySelector('[data-es]'); if (ta) ta.oninput = () => { it.txt = ta.value; save(); };
    const sh = box.querySelector('[data-show]'); if (sh) sh.onclick = () => { it.shown = true; record(it); draw(); };
    box.querySelectorAll('[data-kw]').forEach(cb => cb.onchange = () => { const j = +cb.dataset.kw; it.kw = cb.checked ? [...new Set([...it.kw, j])] : it.kw.filter(x => x !== j); record(it); draw(); });
    function chkAb() { it.checked = true; record(it); draw(); }
  }
  function answerOX(v) { const it = ex && ex.items[i]; if (!it || it.t !== 'ox' || it.pick) return; it.pick = v; record(it); draw(); }
  document.addEventListener('keydown', e => {
    if (!box.isConnected || !ex || i >= ex.items.length || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const r = box.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
    const it = ex.items[i], k = e.key.toLowerCase();
    if (it.t === 'ox' && (k === 'o' || k === '0')) { answerOX('O'); e.preventDefault(); }
    else if (it.t === 'ox' && k === 'x') { answerOX('X'); e.preventDefault(); }
    else if ((k === 'enter' || k === 'arrowright') && answered(it)) { i++; draw(); e.preventDefault(); }
  });
  draw();
}

/* ---------- Abbreviation study: importance first ---------- */
const TIER = { 3: ['★★★', '핵심'], 2: ['★★', '중요'], 1: ['★', '참고'] };
const tierOf = k => (AB_INFO[k] || [1])[0];
const meanOf = k => (AB_INFO[k] || [, ''])[1];
/* bold the letters of the full name that make up the abbreviation (word starts / capitals first) */
function abHL(full, ab) {
  const s = String(full), letters = ab.replace(/[^a-z0-9]/gi, '').toLowerCase(), mark = new Set(); let pos = 0;
  const strong = j => /[A-Z0-9]/.test(s[j]) || j === 0 || /[\s\-–·:,(+/]/.test(s[j - 1]);
  for (const c of letters) {
    let j = -1;
    for (let t = pos; t < s.length; t++) if (s[t].toLowerCase() === c && strong(t)) { j = t; break; }
    if (j < 0) for (let t = pos; t < s.length; t++) if (s[t].toLowerCase() === c) { j = t; break; }
    if (j < 0) break; mark.add(j); pos = j + 1;
  }
  return [...s].map((ch, j) => mark.has(j) ? `<b class="ini">${esc(ch)}</b>` : esc(ch)).join('');
}
const abCard = (r, big) => `<div class="ab-full${big ? ' big' : ''}">${r[1].map(f => abHL(f, r[0])).join(' <span class="cm">/</span> ')}</div><div class="ab-mean">${esc(meanOf(r[0]))}</div>`;

function mountAbbr(host) {
  let tiers = LS.get('ab.tiers', [3]), sel = LS.get('ab.weeks', Object.keys(AB_WK)), mode = LS.get('ab.mode', 'learn'), deck = [], i = 0, st = [], hide = true;
  if (!['learn', 'write', 'table'].includes(mode)) mode = 'learn';
  const box = document.createElement('div'); host.appendChild(box);
  const getW = () => new Set(LS.get('ab.wrong', [])), getK = () => new Set(LS.get('ab.ok', []));
  function setRes(k, ok) { const W = getW(), K = getK(); if (ok) { W.delete(k); K.add(k); } else { W.add(k); K.delete(k); } LS.set('ab.wrong', [...W]); LS.set('ab.ok', [...K]); }
  const inScope = r => tiers.includes(tierOf(r[0])) && r[2].some(g => sel.includes(g));
  function newDeck(onlyWrong) {
    const W = getW(), K = getK(), R = rng(); let p = ABBR.filter(inScope); if (onlyWrong) p = p.filter(r => W.has(r[0]));
    const rank = r => (W.has(r[0]) ? 0 : K.has(r[0]) ? 2 : 1) * 10 + (3 - tierOf(r[0]));
    deck = R.shuffle(p).sort((a, b) => rank(a) - rank(b)); st = deck.map(() => ({ v: '', ok: null, open: false })); i = 0; draw();
  }
  function draw() {
    const W = getW(), K = getK();
    const prog = [3, 2, 1].map(t => { const a = ABBR.filter(r => tierOf(r[0]) === t), k = a.filter(r => K.has(r[0])).length; return `<div class="ab-tier t${t}"><span>${TIER[t][0]} ${TIER[t][1]}</span><div class="oxprog"><i style="width:${k / a.length * 100}%"></i></div><b class="mono">${k}/${a.length}</b></div>`; }).join('');
    let h = `<div class="lab oxq"><div class="lab-head"><span class="tag">약어</span>중요도 순으로 외우기 — ★★★ 핵심 개념부터 · 외운 것은 뒤로, 틀린 것은 앞으로</div>
<div class="lab-ctl">${[3, 2, 1].map(t => `<div class="ctl tog"><input type="checkbox" id="abt-${t}" ${tiers.includes(t) ? 'checked' : ''}><label for="abt-${t}">${TIER[t][0]} ${TIER[t][1]} (${ABBR.filter(r => tierOf(r[0]) === t).length})</label></div>`).join('')}
<div class="ctl"><label for="ab-wk">주차</label><select id="ab-wk"><option value="all">전체</option>${Object.entries(AB_WK).map(([g, l]) => `<option value="${g}" ${sel.length === 1 && sel[0] === g ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
<div class="abseg">${[['learn', '외우기'], ['write', '쓰기 시험'], ['table', '한눈에 표']].map(([m, l]) => `<button class="btn sm ${mode === m ? 'pri' : ''}" data-mode="${m}">${l}</button>`).join('')}</div>
<button class="btn" data-new>섞기</button><button class="btn" data-wrong ${W.size ? '' : 'disabled'}>틀린 것만 (${W.size})</button></div>
<div class="lab-out"><div class="ab-prog">${prog}</div>`;
    if (mode === 'table') {
      const list = ABBR.filter(inScope);
      h += `<div style="display:flex;gap:8px;align-items:center;margin:0 0 8px"><button class="btn sm" data-hide>${hide ? '원래 이름 보이기' : '원래 이름 가리기'}</button><span class="cm" style="font-size:13px">${hide ? '가려진 칸을 누르면 하나씩 보인다' : ''}</span></div>`;
      h += [3, 2, 1].filter(t => list.some(r => tierOf(r[0]) === t)).map(t => `<h4 class="ab-th t${t}">${TIER[t][0]} ${TIER[t][1]}</h4><div class="ab-tbl">${list.filter(r => tierOf(r[0]) === t).map(r => `<div class="${W.has(r[0]) ? 'wr' : K.has(r[0]) ? 'kn' : ''}"><b class="mono">${esc(r[0])}</b><div><div class="ab-full ${hide ? 'veil' : ''}" data-veil>${r[1].map(f => abHL(f, r[0])).join(' / ')}</div><div class="ab-mean">${esc(meanOf(r[0]))}</div></div></div>`).join('')}</div>`).join('') || '<p>선택한 범위에 약어가 없다.</p>';
    } else if (!deck.length) h += '<p>선택한 범위에 약어가 없다. 중요도나 주차를 넓혀 보자.</p>';
    else if (i < deck.length) {
      const r = deck[i], s = st[i], t = tierOf(r[0]);
      h += `<div class="oxbar"><div class="oxprog"><i style="width:${i / deck.length * 100}%"></i></div><span class="mono">${i + 1} / ${deck.length}</span></div>
<div class="oxcard"><div class="oxmeta"><span class="ab-badge t${t}">${TIER[t][0]} ${TIER[t][1]}</span> ${r[2].map(g => AB_WK[g]).join(', ')}${W.has(r[0]) && s.ok == null ? ' · <b>지난번에 틀림</b>' : K.has(r[0]) && s.ok == null ? ' · 외운 것' : ''}</div><div class="ab-big mono">${esc(r[0])}</div>`;
      if (mode === 'learn') {
        if (!s.open) h += `<p class="cm" style="margin:0 0 10px;font-size:14px">원래 이름을 머릿속으로 말해 본 뒤 펼친다.</p><button class="btn pri" data-open>펼치기 (Space)</button>`;
        else h += abCard(r, true) + (s.ok == null ? `<div class="ab-self"><button class="btn ok" data-self="1">알았다 ✓ (1)</button><button class="btn no" data-self="0">헷갈렸다 ✗ (2)</button></div>` : `<div style="margin-top:10px"><button class="btn pri" data-next>다음 ▶</button></div>`);
      } else {
        h += `<input type="text" class="ab-in" data-in value="${esc(s.v)}" ${s.ok != null ? 'disabled' : ''} autocomplete="off" spellcheck="false" placeholder="원래 이름을 영어로 · Enter로 채점">`;
        if (s.ok != null) h += `<div class="model"><div class="mh">${s.ok ? '⭕ 정답' : '❌ 오답'}${!s.ok ? ` <button class="btn sm" data-ov>맞은 걸로</button>` : ''}</div>${abCard(r)}</div><div style="margin-top:10px"><button class="btn pri" data-next>다음 ▶</button></div>`;
        else h += `<div style="margin-top:10px;display:flex;gap:8px"><button class="btn pri" data-chk>채점</button><button class="btn" data-skip>모르겠다</button></div>`;
      }
      h += '</div>';
    } else { const ok = st.filter(s => s.ok).length; h += `<div class="big">${ok} / ${deck.length}</div><p>${deck.length - ok ? `헷갈린 ${deck.length - ok}개는 다음 판에 맨 앞에 나온다.` : '이 범위는 전부 외웠다. ★★로 넓혀 보자.'}</p><button class="btn pri" data-new>다시 섞기</button>`; }
    box.innerHTML = h + '</div></div>';
    const rd = () => { tiers = [3, 2, 1].filter(t => box.querySelector('#abt-' + t).checked); if (!tiers.length) tiers = [3]; const v = box.querySelector('#ab-wk').value; sel = v === 'all' ? Object.keys(AB_WK) : [v]; LS.set('ab.tiers', tiers); LS.set('ab.weeks', sel); };
    box.querySelectorAll('.lab-ctl input, .lab-ctl select').forEach(c => c.onchange = () => { rd(); newDeck(false); });
    box.querySelectorAll('[data-new]').forEach(b => b.onclick = () => { rd(); newDeck(false); });
    box.querySelector('[data-wrong]').onclick = () => { rd(); if (mode === 'table') mode = 'learn'; newDeck(true); };
    box.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; LS.set('ab.mode', mode); rd(); newDeck(false); });
    const hb = box.querySelector('[data-hide]'); if (hb) hb.onclick = () => { hide = !hide; draw(); };
    box.querySelectorAll('[data-veil]').forEach(v => v.onclick = () => v.classList.remove('veil'));
    const next = () => { i++; draw(); const n = box.querySelector('[data-in]') || box.querySelector('[data-open]'); if (n) n.focus({ preventScroll: true }); };
    const mark = ok => { st[i].ok = ok; setRes(deck[i][0], ok); draw(); const n = box.querySelector('[data-next]'); if (n) n.focus({ preventScroll: true }); };
    const op = box.querySelector('[data-open]'); if (op) op.onclick = () => { st[i].open = true; draw(); };
    box.querySelectorAll('[data-self]').forEach(b => b.onclick = () => mark(b.dataset.self === '1'));
    const inp = box.querySelector('[data-in]');
    if (inp) { inp.oninput = () => st[i].v = inp.value; inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if (st[i].ok == null) mark(abCheck(inp.value, deck[i][1])); } }; }
    const c = box.querySelector('[data-chk]'); if (c) c.onclick = () => mark(abCheck(inp.value, deck[i][1]));
    const sk = box.querySelector('[data-skip]'); if (sk) sk.onclick = () => mark(false);
    const ov = box.querySelector('[data-ov]'); if (ov) ov.onclick = () => mark(true);
    const nx = box.querySelector('[data-next]'); if (nx) nx.onclick = next;
    box._next = next; box._mark = mark;
  }
  document.addEventListener('keydown', e => {
    if (!box.isConnected || mode !== 'learn' || i >= deck.length || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const r = box.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
    const s = st[i];
    if (!s.open && (e.key === ' ' || e.key === 'Enter')) { s.open = true; draw(); e.preventDefault(); }
    else if (s.open && s.ok == null && (e.key === '1' || e.key === '2')) { box._mark(e.key === '1'); e.preventDefault(); }
    else if (s.ok != null && (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === ' ')) { box._next(); e.preventDefault(); }
  });
  newDeck(false);
}

/* ---------- Essay drill ---------- */
function mountEssay(host) {
  let sel = LS.get('es.weeks', WEEKS.slice()), list = [], i = 0;
  const box = document.createElement('div'); host.appendChild(box);
  function newList() { const W = new Set(LS.get('es.wrong', [])), p = essayPool().filter(q => sel.includes(q.w)), R = rng(); list = R.shuffle(p.filter(q => W.has(q.id))).concat(R.shuffle(p.filter(q => !W.has(q.id)))); i = 0; draw(); }
  function draw() {
    const all = essayPool();
    let h = `<div class="lab oxq"><div class="lab-head"><span class="tag">서술형</span>Quick Check ${all.filter(q => q.src === 'Quick Check').length} + 개념·흐름 ${ESSAY.length} = ${all.length}문항 · 내 말로 쓰고 모범 답안의 핵심 요소로 자가 채점</div><div class="lab-ctl">${WEEKS.map(w => `<div class="ctl tog"><input type="checkbox" id="es-${w}" ${sel.includes(w) ? 'checked' : ''}><label for="es-${w}">${w.slice(1)}주 (${all.filter(q => q.w === w).length})</label></div>`).join('')}<button class="btn pri" data-new>섞어서 시작</button></div><div class="lab-out">`;
    if (!list.length) h += '<p>선택한 범위에 문항이 없다.</p>';
    else {
      const q = list[i], s = LS.get('es.' + q.id, { txt: '', shown: false, kw: [] });
      h += `<div class="oxbar"><div class="oxprog"><i style="width:${(i + 1) / list.length * 100}%"></i></div><span class="mono">${i + 1} / ${list.length}</span></div><div class="oxcard"><div class="oxmeta">${q.w.slice(1)}주차 · ${q.src}</div><div class="oxq-t">${q.q}</div><textarea class="mt-ta" data-es rows="5" placeholder="핵심 단어 중심으로 3~5줄">${esc(s.txt)}</textarea>`;
      h += s.shown ? `<div class="model"><div class="mh">모범 답안</div>${q.model}${kwHTML(q, s.kw, false)}<div style="margin-top:6px">${H.ref(q.ref, '관련 설명으로 이동')}</div></div>` : `<div style="margin-top:8px"><button class="btn pri" data-show>모범 답안과 비교</button></div>`;
      h += `<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" data-mv="-1" ${i ? '' : 'disabled'}>◀ 이전</button><button class="btn pri" data-mv="1" ${i < list.length - 1 ? '' : 'disabled'}>다음 ▶</button></div></div>`;
    }
    box.innerHTML = h + '</div></div>';
    box.querySelector('[data-new]').onclick = () => { sel = WEEKS.filter(w => box.querySelector('#es-' + w).checked); if (!sel.length) sel = WEEKS.slice(); LS.set('es.weeks', sel); newList(); };
    box.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { i = Math.max(0, Math.min(list.length - 1, i + +b.dataset.mv)); draw(); });
    box.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => APP.goto(b.dataset.goto));
    if (!list.length) return;
    const q = list[i], key = 'es.' + q.id, s = LS.get(key, { txt: '', shown: false, kw: [] });
    const upd = () => { LS.set(key, s); const W = new Set(LS.get('es.wrong', [])); if (s.shown) { if (s.kw.length >= Math.ceil((q.kw || []).length * 0.6)) W.delete(q.id); else W.add(q.id); } LS.set('es.wrong', [...W]); };
    const ta = box.querySelector('[data-es]'); ta.oninput = () => { s.txt = ta.value; LS.set(key, s); };
    const sh = box.querySelector('[data-show]'); if (sh) sh.onclick = () => { s.shown = true; upd(); draw(); };
    box.querySelectorAll('[data-kw]').forEach(cb => cb.onchange = () => { const j = +cb.dataset.kw; s.kw = cb.checked ? [...new Set([...s.kw, j])] : s.kw.filter(x => x !== j); upd(); });
  }
  newList();
}

    H.key(`<b>기출 30% 보장 규칙</b><br>기출 OX 수 = <b>올림(전체 문항 수 × 30%)</b>. 시험지를 만들 때 이 수만큼 퀴즈 기출 100문항에서 먼저 뽑고, 나머지 OX만 새 문제은행(1~5주차 ${WEEKS.reduce((a, w) => a + (OXBANK[w] || []).length, 0)}문항)에서 채운다.<br>선택한 주차의 기출이 모자라면 범위 밖 기출로 채워서라도 비율을 지킨다. “기출 비중 50% 이상”도 고를 수 있다.`),
    `<ol><li><b>퀴즈 정답표</b>(M.2)로 100문항의 답과 이유를 훑는다 — 틀린 이유가 “반대로 말함”인 문항(36 · 49 · 62 · 64 · 81 · 93)이 특히 함정.</li><li><b>약어</b>(M.3) — 용어표 Week1-5의 약어 149개를 중요도 3단계(★★★ 핵심 36 · ★★ 중요 46 · ★ 참고 67)로 나눴다. ★★★부터 “외우기” 카드로 익히고 “쓰기 시험”으로 확인한다. 모의시험의 약어는 ★★★ 70% 이상 + ★★에서만 나온다.</li><li><b>서술형</b>(M.4) — 각 주차 Quick Check와 흐름 문제를 내 말로 쓰고 핵심 요소를 체크한다.</li><li><b>모의시험</b>(M.5)으로 섞어서 실전처럼. 한 화면에 한 문제, 결과는 유형별 · 주차별로.</li></ol>`,
    H.note('세 연습의 오답 기록은 모두 이 브라우저에 저장되고 서로 공유된다 — 정답표에서 빨간 테두리로 보이는 기출, 시험 대비 탭 OX 연습의 “내 오답만”, 모의시험의 우선 출제가 같은 기록을 쓴다.'),
  ] },
