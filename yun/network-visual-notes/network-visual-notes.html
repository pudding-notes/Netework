<script>
/* 기말 대비 — final OX 100 (given expected questions) + abbreviation full names (weeks 5·6·7·9) by importance + mock exam */
'use strict';
(function () {
const T = H.tbl;
const D = {"ox": [["REST는 HTTP처럼 표준 문서로 정의된 통신 프로토콜이다.", "X", "REST는 프로토콜이 아니라 Roy Fielding(2000)이 정리한 6가지 제약(Client-Server, Stateless, Cacheable, Uniform Interface, Layered System, Code on Demand) 기반의 아키텍처 설계 스타일입니다.", "w5"], ["REST의 6가지 제약 중 Code on Demand는 유일한 선택(optional) 제약으로, 없어도 REST라고 할 수 있다.", "O", "Code on Demand는 서버가 JavaScript 같은 실행 코드를 내려보낼 수 있다는 선택 제약이며, 나머지 5개 제약과 달리 지키지 않아도 REST입니다.", "w5"], ["Uniform Interface는 URI로 자원을 식별하고 표준 메서드로 조작하게 하는 REST의 핵심 제약이다.", "O", "Uniform Interface는 자원 식별, 표현을 통한 조작, 자기 서술적 메시지, HATEOAS로 구성되며, 모든 API가 같은 문법을 쓰게 하는 REST의 핵심입니다.", "w5"], ["Richardson Maturity Model의 Level 2는 HTTP 메서드와 상태 코드를 의미대로 사용하는 단계로, 실무 표준이자 이번 수업의 목표선이다.", "O", "Level 0은 URI·POST 하나, Level 1은 자원별 URI, Level 2는 메서드+상태 코드의 의미대로 사용, Level 3는 HATEOAS입니다. 실무 REST API는 최소 Level 2를 넘어야 합니다.", "w5"], ["모든 응답을 200 OK로 보내고 Body에 {\"success\": false}를 담는 방식은 권장되는 오류 처리 방식이다.", "X", "이는 대표적인 안티패턴입니다. 캐시·모니터링·재시도 로직·DevTools는 모두 상태 코드를 기준으로 동작하므로, 실패는 404·409·422 등 알맞은 상태 코드로 알려야 합니다.", "w5"], ["GET /getStudent?id=10 보다 GET /students/10이 권장되는 이유는 URI는 자원(명사)을, Method는 행위(동사)를 담당하기 때문이다.", "O", "URI에 동사를 넣지 않고, 복수형 컬렉션 + id로 자원을 식별하며 행위는 GET·POST·PATCH·DELETE 같은 메서드로 표현합니다.", "w5"], ["3학년 학생만 조회할 때는 GET /students/grade/3처럼 경로(path)에 조건을 넣는 것이 권장된다.", "X", "경로는 자원 '식별', 쿼리는 '조건'을 표현합니다. 필터는 GET /students?grade=3처럼 쿼리 파라미터로 쓰는 것이 권장됩니다.", "w5"], ["비밀번호나 토큰은 HTTPS로 암호화되므로 URI의 쿼리 파라미터에 넣어도 안전하다.", "X", "민감 정보를 URI·쿼리에 넣으면 서버 로그와 브라우저 기록에 그대로 남습니다. 비밀번호·토큰은 Body나 Authorization 헤더로 보내야 합니다.", "w5"], ["같은 URI(/students/10)라도 Accept 헤더에 따라 JSON, CSV, HTML 등 서로 다른 표현(Representation)을 받을 수 있다.", "O", "Content Negotiation입니다. 클라이언트는 Accept로 원하는 형식을 말하고 서버는 Content-Type으로 실제 형식을 알려 줍니다. 지원하지 않으면 406 Not Acceptable입니다.", "w5"], ["API 응답 표현(Representation)에는 DB 테이블의 모든 컬럼(password_hash 등 포함)을 그대로 담는 것이 좋다.", "X", "표현은 DB 테이블과 같지 않습니다. 클라이언트가 알아야 할 것만 담는 계약이므로 password_hash, 내부 메모 같은 컬럼은 응답에 넣지 않습니다.", "w5"], ["POST로 자원 생성에 성공하면 201 Created와 함께 Location 헤더로 새 자원의 URI를 알려 주는 것이 좋다.", "O", "새 id는 서버가 정하므로 Location 헤더(그리고 보통 Body)로 새 자원 URI를 돌려주면 클라이언트가 바로 GET할 수 있습니다. 200만 쓰면 생성 여부가 흐려집니다.", "w5"], ["DELETE /students/11을 여러 번 보내도 DB 상태는 똑같이 '없음'이므로 DELETE는 멱등(idempotent)하다.", "O", "멱등은 여러 번 보내도 결과 상태가 같다는 뜻입니다. GET·PUT·DELETE는 멱등하므로 재시도가 안전합니다.", "w5"], ["POST는 멱등하므로 네트워크 오류가 나면 자유롭게 재시도해도 중복 생성 위험이 없다.", "X", "POST는 멱등하지 않습니다. 재시도하면 같은 자원이 중복 생성될 수 있으므로 Idempotency-Key 같은 장치가 필요합니다.", "w5"], ["PUT 요청 Body에서 빠진 필드는 기존 값이 그대로 유지된다.", "X", "PUT은 자원 전체를 교체하는 계약이므로 빠진 필드는 삭제(null)·기본값으로 간주됩니다. 보낸 필드만 바꾸고 나머지를 유지하는 것은 PATCH입니다.", "w5"], ["GET /cancelEnrollment?id=5처럼 GET으로 상태를 바꾸면, 크롤러나 브라우저 프리페치가 의도치 않게 수강을 취소할 수 있다.", "O", "GET은 안전(safe)해야 하는 메서드입니다. 어떤 경우든 GET으로 상태를 변경하지 않고 PATCH·POST 등으로 표현해야 합니다.", "w5"], ["FastAPI는 JSON 문법은 맞지만 값이 규칙을 위반한 요청(예: grade=7)에 대해 500 Internal Server Error를 반환한다.", "X", "Schema(Pydantic) 검증 실패는 422 Unprocessable Content입니다. 400은 JSON 자체가 깨진 경우, 500은 서버 측 예외로 클라이언트 잘못이 아닌 경우입니다.", "w5"], ["FastAPI가 422를 반환했다면 handler 코드는 이미 실행된 뒤에 오류가 발생한 것이다.", "X", "422는 Router 다음 Validation(Pydantic) 단계에서 반환됩니다. 즉 handler 코드는 실행조차 되지 않았습니다. 500이면 handler 이후 단계의 문제입니다.", "w5"], ["response_model을 지정하면 DB 객체에 password_hash가 있어도 응답에서 자동으로 걸러진다.", "O", "response_model=StudentOut처럼 응답 Schema를 지정하면 출력도 검증·필터링됩니다. 입력 검증만큼 출력 필터링이 중요합니다.", "w5"], ["Offset 방식 페이지네이션은 대용량 데이터에서도 깊은 페이지까지 일정한 속도를 보장한다.", "X", "Offset은 앞의 행을 세고 버리므로 뒤로 갈수록 느려지고 중간 삽입 시 중복·누락이 생깁니다. 대용량에서 일정한 속도는 Cursor(Keyset) 방식의 장점입니다.", "w5"], ["응답에 새 필드를 추가하는 것은 하위 호환을 깨는 변경이므로 반드시 새 버전(/v2)이 필요하다.", "X", "새 필드 추가·선택 요청 필드 추가·새 endpoint 추가는 호환 유지(Non-breaking) 변경입니다. 필드 이름 변경·삭제, 타입 변경, 선택→필수 변경이 Breaking입니다.", "w5"], ["OpenAPI는 REST API 명세 표준의 이름이고, Swagger는 그 문서·테스트 UI 도구의 이름이다.", "O", "Swagger = 도구, OpenAPI = 명세 표준입니다. FastAPI는 /openapi.json, /docs(Swagger UI), /redoc을 자동으로 만들어 줍니다.", "w5"], ["Stateless란 서버에 DB를 포함한 어떤 데이터도 저장하지 않는다는 뜻이다.", "X", "Stateless는 '대화 상태(session state)'를 서버 메모리에 두지 않는다는 뜻입니다. 자원 상태(DB)는 있어도 되며, 공유 상태는 DB·Redis에 둡니다.", "w5"], ["Origin은 scheme + host + port로 구성되며, path와 query는 Origin에 포함되지 않는다.", "O", "Origin은 브라우저 보안 경계의 단위이며 scheme·host·port 세 요소가 모두 같아야 같은 Origin입니다.", "w5"], ["http://localhost:5500과 http://127.0.0.1:5500은 같은 컴퓨터를 가리키므로 같은 Origin이다.", "X", "브라우저는 host를 문자열로 비교하므로 localhost와 127.0.0.1은 다른 Origin입니다. 실습에서 가장 흔한 CORS 혼란의 원인입니다.", "w5"], ["CORS는 브라우저의 규칙이므로 curl이나 Python requests로 보낸 요청은 CORS 때문에 차단되지 않는다.", "O", "CORS(SOP)는 브라우저 안의 사용자를 보호하는 장치입니다. curl·Postman·서버 간 호출에는 적용되지 않습니다. 그래서 'curl은 되는데 브라우저만 안 되면' 거의 CORS입니다.", "w5"], ["Console에 CORS 오류가 떴다면 서버는 요청을 전혀 받지 못한 것이다.", "X", "Simple Request의 경우 서버는 요청을 받아 처리(DB 수정까지)하고 응답도 보냈지만, Access-Control-Allow-Origin이 없어 브라우저가 JS에 응답을 넘기지 않은 것일 수 있습니다.", "w5"], ["Content-Type: application/json으로 POST하는 cross-origin fetch 요청은 Preflight(OPTIONS) 요청을 발생시킨다.", "O", "Simple Request의 Content-Type은 text/plain, application/x-www-form-urlencoded, multipart/form-data뿐입니다. application/json, PUT·PATCH·DELETE, Authorization 헤더는 Preflight를 발생시킵니다.", "w5"], ["쿠키를 포함한 요청(credentials)에 대해 서버가 Access-Control-Allow-Origin: * 로 응답하면 브라우저가 거부한다.", "O", "'*' + credentials는 규격상 성립하지 않는 조합입니다. 로그인·개인정보가 있는 API는 허용 Origin을 명시적으로 열거해야 합니다.", "w5"], ["Access-Control-Expose-Headers를 설정하지 않아도 JS는 cross-origin 응답의 Location 헤더를 항상 읽을 수 있다.", "X", "Expose-Headers를 빼먹으면 r.headers.get(\"Location\")이 null이 됩니다. 201 응답의 새 URI를 JS가 읽게 하려면 expose_headers=[\"Location\"]이 필요합니다.", "w5"], ["TLS가 제공하는 세 가지 보안 목표는 기밀성(Confidentiality), 무결성(Integrity), 인증(Authentication)이다.", "O", "기밀성은 대칭키 암호(AES-GCM 등), 무결성은 MAC/AEAD 인증 태그, 인증은 인증서 + 전자서명이 담당합니다.", "w6"], ["TLS는 공개키 암호가 대칭키 암호보다 빠르기 때문에 실제 데이터 암호화에 공개키 암호를 사용한다.", "X", "공개키 암호는 대칭키보다 수백~수천 배 느립니다. TLS는 공개키 기술로 키를 교환(ECDHE)하고, 실제 데이터는 빠른 대칭키(AES)로 암호화하는 하이브리드 방식을 씁니다.", "w6"], ["Forward Secrecy 덕분에 나중에 서버 개인키가 유출되더라도 과거에 녹화된 TLS 대화는 풀 수 없다.", "O", "세션 키는 연결마다 새로 만들어지고 연결 종료 시 폐기되므로, 서버 개인키가 나중에 유출돼도 과거 대화를 복호화할 수 없습니다.", "w6"], ["해시는 단방향 함수이므로 해시값으로부터 원문을 되돌릴 수 없다.", "O", "해시는 단방향·고정 길이·눈사태 효과·충돌 저항의 성질을 가집니다. 같은 입력은 항상 같은 출력을 내지만 출력으로 입력을 복원할 수는 없습니다.", "w6"], ["전자서명은 데이터를 암호화해 다른 사람이 내용을 읽지 못하게 숨기는 기술이다.", "X", "서명은 데이터를 숨기지 않습니다. 누구나 읽을 수 있지만 바꾸면 들킵니다(무결성 + 발급자 증명). 이것이 JWT가 암호화가 아닌 이유입니다.", "w6"], ["HTTPS 인증서는 해당 사이트가 피싱 사이트가 아닌 '믿을 수 있는 착한 사이트'임을 보증한다.", "X", "인증서는 '이 서버가 그 도메인의 주인'임만 보증합니다. 피싱 사이트도 자기 도메인의 인증서는 쉽게 받을 수 있습니다.", "w6"], ["인증서 체인 검증에서 브라우저가 처음부터 신뢰하는 출발점은 OS·브라우저 Trust Store에 내장된 Root CA이다.", "O", "브라우저는 Leaf → Intermediate → Root 순서로 서명을 검증하며, 신뢰의 출발점은 미리 설치된 Root CA(자기 서명)입니다.", "w6"], ["HTTPS를 적용하면 XSS와 SQL Injection 공격도 함께 방어된다.", "X", "TLS는 '네트워크 구간'만 지킵니다. 브라우저 안의 XSS, 서버 로직의 IDOR, DB의 SQL Injection은 각각 출력 이스케이프·CSP, 소유권 검사, 파라미터 바인딩으로 따로 막아야 합니다.", "w6"], ["HSTS(Strict-Transport-Security) 헤더는 브라우저가 해당 사이트에 HTTPS로만 접속하도록 강제해 SSL Strip 공격을 막는다.", "O", "예: Strict-Transport-Security: max-age=31536000 → 1년간 HTTPS로만 접속하게 하여 http:// 첫 요청을 가로채는 공격을 방지합니다.", "w6"], ["인증(Authentication)은 '무엇을 해도 되는가'를, 인가(Authorization)는 '당신은 누구인가'를 확인하는 것이다.", "X", "반대입니다. 인증(AuthN)은 '누구인가', 인가(AuthZ)는 '무엇을 해도 되는가'입니다. 인증이 먼저 이루어져야 인가를 판단할 수 있습니다.", "w6"], ["403 Forbidden은 보통 토큰 만료 때문이므로 다시 로그인하면 해결된다.", "X", "토큰이 없거나 만료된 경우는 401 Unauthorized(인증 실패)입니다. 403은 신원은 확인됐지만 권한이 없는 인가 실패라 다시 로그인해도 해결되지 않습니다.", "w6"], ["'비밀번호 + 보안 질문' 조합은 두 가지를 확인하므로 MFA(다중 요소 인증)에 해당한다.", "X", "MFA는 서로 다른 '종류'의 요소(지식·소유·생체)를 조합해야 합니다. 비밀번호와 보안 질문은 둘 다 지식 요소이므로 MFA가 아닙니다.", "w6"], ["비밀번호를 SHA-256 한 번으로만 해시해 저장하면 같은 비밀번호는 같은 해시가 되고, GPU 대입 공격에 취약하다.", "O", "단순 해시는 너무 빠르고 Salt가 없어 레인보우 테이블과 대량 대입에 취약합니다. Argon2id·bcrypt 같은 느린 해시 + Salt를 사용해야 합니다.", "w6"], ["Salt는 비밀 값이므로 해시와 분리해 별도의 안전한 저장소에 보관해야 한다.", "X", "Salt는 비밀이 아니며 해시 문자열 안에 함께 저장됩니다($argon2id$…$salt$hash). 역할은 사람마다 해시를 다르게 만들어 미리 만든 레인보우 테이블을 무력화하는 것입니다.", "w6"], ["Argon2id·bcrypt 같은 비밀번호 해시는 공격자의 대량 대입 비용을 높이기 위해 일부러 느리게 설계되었다.", "O", "정상 로그인은 0.1초가 걸려도 불편하지 않지만, 10억 개를 대입하는 공격자에게는 0.1초 × 10억 = 약 3년이 됩니다.", "w6"], ["로그인 실패 시 '아이디 없음'과 '비밀번호 틀림'을 구분해서 알려 주는 것이 보안상 바람직하다.", "X", "둘을 구분하면 계정 존재 여부가 노출됩니다. 로그인 실패 메시지는 모호하게 하고 401로 응답하는 것이 원칙입니다.", "w6"], ["Session 방식에서 쿠키에는 의미 없는 무작위 Session ID만 담기고, 사용자 정보는 서버의 세션 저장소에 있다.", "O", "세탁소 번호표처럼 sid 자체에는 정보가 없고, 서버가 메모리·Redis·DB 저장소에서 sid로 사용자 정보를 조회합니다. 그래서 즉시 로그아웃이 쉽습니다.", "w6"], ["HttpOnly 속성이 설정된 쿠키는 JavaScript의 document.cookie로 읽을 수 없다.", "O", "HttpOnly는 XSS로 세션 쿠키를 탈취하는 것을 막습니다. Secure는 HTTPS에서만 전송, SameSite는 CSRF 방어 속성입니다.", "w6"], ["SameSite=None 쿠키는 Secure 속성 없이도 정상적으로 사용할 수 있다.", "X", "SameSite=None은 모든 요청에 쿠키를 보내므로 반드시 Secure와 함께 설정해야 합니다. Secure가 없으면 쿠키가 붙지 않는 장애가 생깁니다.", "w6"], ["JWT의 Header와 Payload는 Base64URL로 인코딩만 되어 있어 누구나 디코딩해 내용을 읽을 수 있다.", "O", "JWT(JWS)는 서명만 할 뿐 암호화가 아닙니다. 그래서 Payload에 비밀번호·주민번호·성적 같은 민감 정보를 넣으면 안 됩니다.", "w6"], ["JWT의 Payload에서 role을 student에서 professor로 바꾸면, 서명이 맞지 않아 서버 검증에서 거부된다.", "O", "서명은 header.payload를 서버 키로 계산한 값이므로 내용이 바뀌면 서명이 불일치합니다. 읽을 수는 있지만 고칠 수는 없습니다(홀로그램 입장권 비유).", "w6"], ["JWT 방식은 Session 방식보다 만료 전에 특정 사용자를 즉시 로그아웃(강제 무효화)시키기 쉽다.", "X", "Session은 저장소에서 삭제하면 즉시 차단되지만, JWT는 서버가 기억하지 않으므로 만료 전에는 무효화가 어렵습니다(블랙리스트 필요). 대신 Scale-out에 유리합니다.", "w6"], ["Access Token은 짧은 수명(예: 5~15분)으로, Refresh Token은 긴 수명으로 운영하는 것이 일반적이다.", "O", "Access Token은 모든 요청에 쓰이므로 짧게 해 탈취 피해를 줄이고, Refresh Token은 재발급 endpoint에서만 쓰며 HttpOnly 쿠키·DB 기록으로 깊이 보관합니다.", "w6"], ["OAuth 2.0은 사용자의 비밀번호를 제3자 앱에 넘겨 주는 방식으로 권한을 위임한다.", "X", "OAuth 2.0에서 비밀번호는 Authorization Server(예: 구글 로그인 화면)에만 입력하고, 앱은 scope가 제한된 Access Token만 받습니다(발레파킹 키 비유).", "w6"], ["OAuth 2.0 자체는 인가(권한 위임) 프로토콜이며, '구글로 로그인'처럼 신원까지 받으려면 OpenID Connect(ID Token)를 얹는다.", "O", "OAuth는 권한 위임을 위한 표준이고, 인증(신원 확인)은 그 위에 OpenID Connect를 사용해 ID Token으로 처리합니다.", "w6"], ["API Key만으로도 요청을 보낸 사용자가 누구인지 식별할 수 있다.", "X", "API Key는 '어떤 앱·프로젝트'를 식별하는 값이지 사용자를 나타내지 않습니다. 사용자별 데이터가 있다면 세션·토큰 같은 사용자 인증이 따로 필요합니다.", "w6"], ["IDOR은 인증은 했지만 자원의 소유권 검사를 하지 않아, URL의 id만 바꾸면 남의 데이터에 접근할 수 있는 취약점이다.", "O", "예: /students/2026001/grades → 2026002로 바꾸면 남의 성적이 보이는 경우입니다. 서버에서 path의 id와 토큰의 sub를 비교하고 실패 시 403(또는 404)으로 막습니다.", "w6"], ["SQL Injection의 가장 근본적인 방어책은 따옴표 같은 위험 문자를 블랙리스트로 지우는 입력 필터링이다.", "X", "블랙리스트 필터링은 언제나 우회됩니다. 핵심은 파라미터 바인딩(Prepared Statement)·ORM으로 데이터와 명령을 구조적으로 분리하는 것입니다.", "w6"], ["HTTP 기본 모델에서 서버는 클라이언트의 요청을 받기 전에는 먼저 데이터를 보낼 수 없다.", "O", "HTTP는 Client-initiated 요청/응답 모델입니다. 게다가 클라이언트는 대부분 NAT·방화벽 뒤에 있어 서버가 먼저 연결할 수도 없으므로, 클라이언트가 연결을 열어 두는 방식이 필요합니다.", "w7"], ["Polling 주기를 3초에서 1초로 줄이면 서버 요청 수는 줄어들고 평균 감지 지연도 줄어든다.", "X", "Polling 요청률은 '사용자 수 ÷ 주기'이므로 주기를 줄이면 요청 수는 3배로 늘어납니다(1만 명 기준 3,333 → 10,000 req/s). 지연과 비용을 동시에 줄일 수 없는 것이 Polling의 한계입니다.", "w7"], ["Long Polling 서버는 대기 중인 요청이 오래 자원을 점유하므로 비동기(async)로 구현해야 한다.", "O", "스레드 하나가 요청 하나를 30초씩 붙잡는 동기 서버라면 수백 명만 접속해도 스레드가 바닥납니다.", "w7"], ["SSE(Server-Sent Events)는 하나의 연결로 클라이언트와 서버가 양방향 메시지를 주고받는 기술이다.", "X", "SSE는 서버 → 클라이언트 단방향 Push입니다. 클라이언트가 서버로 보낼 때는 별도 POST가 필요하며, 양방향(Full-duplex)은 WebSocket입니다.", "w7"], ["SSE는 Content-Type: text/event-stream을 사용하는 HTTP 응답이며, 각 이벤트는 빈 줄로 끝난다.", "O", "SSE는 새 프로토콜이 아니라 끝나지 않는 HTTP 응답입니다. 이벤트 끝의 빈 줄(\\n\\n)을 빠뜨리면 브라우저 onmessage가 호출되지 않습니다.", "w7"], ["SSE 연결이 끊겼다가 재연결될 때 브라우저는 Last-Event-ID 헤더를 자동으로 보내 이어받기를 할 수 있다.", "O", "서버가 id: 필드로 이벤트 번호를 보내면, 재연결 시 브라우저가 Last-Event-ID를 보내 그 다음 이벤트부터 누락 없이 받을 수 있습니다.", "w7"], ["SSE는 이미지 같은 바이너리 데이터를 별도 인코딩 없이 그대로 전송할 수 있다.", "X", "SSE는 UTF-8 텍스트만 전송할 수 있습니다. 텍스트 + 바이너리를 모두 보낼 수 있는 것은 WebSocket입니다.", "w7"], ["브라우저 내장 EventSource API는 Authorization 헤더를 자유롭게 지정할 수 있어 Bearer 토큰 방식과 잘 맞는다.", "X", "EventSource에는 커스텀 헤더를 지정할 수 없습니다. 같은 사이트 HttpOnly 쿠키를 쓰거나 fetch 기반 스트림으로 읽어야 합니다.", "w7"], ["LLM 답변 스트리밍은 SSE 형식을 많이 쓰지만, 질문을 POST Body로 보내야 하므로 EventSource 대신 fetch()로 스트림을 읽는 경우가 많다.", "O", "질문 1번 → 답변 스트림 1번인 단방향 구조라 SSE면 충분합니다. 다만 'SSE 형식 ≠ EventSource API'로, 수신은 fetch() + ReadableStream을 씁니다.", "w7"], ["WebSocket 핸드셰이크에 성공하면 서버는 200 OK로 응답한다.", "X", "WebSocket은 HTTP Upgrade 요청에 101 Switching Protocols로 응답하며, 그 이후 같은 TCP 연결은 더 이상 HTTP가 아닌 WebSocket Frame 통로가 됩니다.", "w7"], ["Sec-WebSocket-Accept 값은 이후 WebSocket 메시지를 암호화하는 키로 사용된다.", "X", "Sec-WebSocket-Accept는 Key + 고정 GUID를 SHA-1 후 Base64한 증명값으로, 진짜 WebSocket 서버인지 확인하는 용도일 뿐 암호화·인증이 아닙니다. 보안은 wss(TLS)와 Origin·토큰 검사로 합니다.", "w7"], ["wss://는 TLS 위에서 동작하는 WebSocket으로, 운영 환경에서는 ws:// 대신 wss://를 사용해야 한다.", "O", "ws://는 80번 평문, wss://는 443번 TLS + TCP입니다. 또 https 페이지에서 ws://로 연결하면 Mixed Content로 차단됩니다.", "w7"], ["WebSocket close code 1006은 Close Frame 없이 비정상적으로 연결이 끊겼음을 의미한다.", "O", "1000 정상 종료, 1001 떠남, 1006 비정상 끊김, 1008 정책 위반, 1009 메시지 과대, 1011 서버 내부 오류입니다. 핸드셰이크 실패 시에도 브라우저는 1006만 알려 줍니다.", "w7"], ["브라우저는 WebSocket 연결에도 CORS를 적용하므로, 서버가 따로 Origin 헤더를 검사할 필요가 없다.", "X", "브라우저는 WebSocket에 SOP·CORS를 적용하지 않습니다. 서버가 핸드셰이크 때 Origin을 허용 목록과 비교하지 않으면 Cross-Site WebSocket Hijacking(CSWSH)에 노출됩니다.", "w7"], ["재연결 시 지수 백오프에 무작위 지터(jitter)를 섞는 이유는 다수 클라이언트가 동시에 재접속하는 thundering herd를 막기 위해서다.", "O", "서버 재시작 직후 1만 명이 같은 순간 재접속하면 서버가 다시 죽을 수 있습니다. 재연결 시점을 무작위로 흩어 부하를 분산합니다.", "w7"], ["WebSocket 서버를 여러 대로 늘려도 Redis Pub/Sub 같은 backplane 없이 모든 사용자에게 메시지가 자동으로 전달된다.", "X", "연결 목록은 서버마다 메모리에 따로 있으므로(연결은 상태), A 서버의 메시지를 B 서버 사용자에게 전하려면 Redis·MQTT·Kafka 같은 Pub/Sub backplane이 필요합니다.", "w7"], ["WebRTC는 미디어 전송에 TCP를 사용하여 재전송으로 영상 품질을 보장한다.", "X", "WebRTC는 UDP 기반(SRTP·SCTP over DTLS)입니다. 영상 통화에서는 늦게 오는 정확한 데이터보다 지금의 데이터가 중요하므로 TCP 재전송 대기(HOL blocking)를 피합니다.", "w7"], ["WebRTC 표준에는 Signaling 방법이 정해져 있지 않아, 보통 WebSocket 등으로 직접 구현한다.", "O", "Signaling 서버는 SDP(Offer/Answer)와 ICE 후보를 교환하는 '소개' 역할만 하며, 그 방법은 개발자가 정합니다.", "w7"], ["STUN 서버는 P2P 직접 연결이 실패했을 때 모든 미디어 트래픽을 대신 중계한다.", "X", "STUN은 NAT 바깥 공인 주소를 알려 주는 가벼운 서버입니다. 직접 연결이 안 될 때 모든 트래픽을 중계하는 것은 TURN 서버입니다.", "w7"], ["BLE와 MQTT는 같은 계층의 기술이므로 IoT 제품에서는 둘 중 하나만 선택해야 한다.", "X", "BLE는 무선 링크(Link/PHY) 기술, MQTT는 메시지(Application) 프로토콜로 서로 다른 계층입니다. 실제로는 'BLE 센서 → 폰(Gateway) → MQTT → 서버'처럼 함께 씁니다.", "w7"], ["MQTT에서 Publisher와 Subscriber는 메시지를 주고받기 위해 서로의 IP 주소를 알아야 한다.", "X", "MQTT는 Broker 중심 Pub/Sub 구조로, 양쪽 모두 Broker에만 연결하고 Topic으로 만납니다(공간·시간·동기 분리). 구독자를 추가해도 센서 코드는 그대로입니다.", "w7"], ["MQTT 구독 패턴 inu/+/temp는 발행 토픽 inu/bldg7/301/temp를 수신한다.", "X", "+는 정확히 한 단계만 대응합니다. inu/bldg7/301/temp는 inu와 temp 사이가 두 단계이므로 수신하지 않습니다.", "w7"], ["MQTT 구독 패턴 inu/#은 inu/bldg7/301/temp처럼 inu 아래의 모든 단계 토픽을 수신한다.", "O", "#은 그 아래 모든 단계(부모 단계 자신 포함)에 대응하며, 토픽의 맨 끝에만 사용할 수 있습니다.", "w7"], ["MQTT 와일드카드 +와 #은 구독뿐 아니라 PUBLISH 토픽에도 사용할 수 있다.", "X", "와일드카드는 구독(SUBSCRIBE) 전용입니다. inu/+/temp 같은 토픽으로는 발행할 수 없습니다.", "w7"], ["MQTT QoS 1은 최소 1회 전달을 보장하지만, 수신자가 같은 메시지를 중복으로 받을 수 있다.", "O", "PUBACK을 받지 못하면 DUP=1로 재전송하므로 중복이 생길 수 있습니다. 대부분 QoS 1 + 수신 측 중복 제거(멱등 처리)로 운영하며, QoS 2가 항상 최선은 아닙니다.", "w7"], ["Retained message는 토픽별 마지막 메시지 1개를 브로커가 저장해 두었다가, 새 구독자에게 구독 즉시 전달한다.", "O", "대시보드를 켜자마자 '현재 값'을 보여 줄 때 씁니다. 오래된 값일 수 있으므로 payload에 timestamp를 넣는 것이 좋고, 빈 payload를 retain으로 발행하면 지워집니다.", "w7"], ["Last Will(LWT)은 클라이언트가 Keep Alive 초과 등으로 비정상 종료될 때 브로커가 대신 발행하며, 정상 DISCONNECT 시에는 발행되지 않는다.", "O", "CONNECT 때 등록해 두면 비정상 종료 시 브로커가 'offline' 같은 메시지를 대신 발행합니다. Keep Alive 30초라면 약 1.5배인 45초 안에 감지됩니다.", "w7"], ["MQTT에서 같은 Client ID로 두 클라이언트가 접속하면, 먼저 접속한 쪽의 연결이 끊긴다.", "O", "Client ID는 브로커 안에서 유일해야 합니다. 두 기기가 같은 ID를 쓰면 서로를 끊으며 계속 끊겼다 붙는 장애가 생깁니다.", "w7"], ["주소창에 localhost:8000을 입력하면 어느 기기에서 입력하든 내 노트북의 서버를 가리킨다.", "X", "localhost는 '입력한 그 기기 자신'을 가리킵니다. 친구 휴대폰에서 입력하면 친구 휴대폰을 가리키므로, 다른 사람이 쓰게 하려면 인터넷에서 접속 가능한 주소와 서버가 필요합니다.", "w9"], ["AWS에서 VPC는 하나의 리전에 속하고, 서브넷 하나는 하나의 AZ에 속한다.", "O", "VPC는 한 Region 안의 가상 네트워크이며, 그 안을 나눈 서브넷은 각각 하나의 Availability Zone에 배치됩니다.", "w9"], ["Availability Zone(AZ)은 서울·도쿄처럼 서로 다른 지리적 지역을 의미한다.", "X", "서울처럼 클라우드가 운영되는 지리적 지역은 Region입니다. AZ는 한 리전 안에서 장애 영향을 줄이도록 분리한 데이터센터 구역입니다.", "w9"], ["10.x.x.x, 172.16~31.x.x, 192.168.x.x는 사설 IP 범위로, 인터넷에서 직접 찾아올 수 없다.", "O", "사설 IP는 한 네트워크 안에서만 쓰는 주소(아파트 단지 안의 '101동 1203호')이고, 공인 IP는 인터넷 전체에서 유일한 주소(도로명 주소)입니다.", "w9"], ["10.0.10.0/24는 10.0.0.0/16 범위 안에 포함되는 더 작은 주소 범위이며, 10.0.10.5는 이 /24 서브넷에 속한다.", "O", "/16은 앞 16비트(10.0) 고정, /24는 앞 24비트(10.0.10) 고정입니다. 10.0.10.5는 10.0.10으로 시작하므로 앱 서브넷에 속합니다.", "w9"], ["라우팅 테이블에서 목적지가 여러 행에 해당하면 0.0.0.0/0처럼 더 넓은 범위의 경로가 우선한다.", "X", "더 구체적인(prefix가 긴) 경로가 우선합니다. DB 10.0.20.5는 10.0.0.0/16과 0.0.0.0/0에 모두 해당하지만 /16(local)이 우선합니다.", "w9"], ["Public Subnet과 Private Subnet은 라우팅 테이블에 0.0.0.0/0 → IGW 경로가 있는지 여부로 구분된다.", "O", "이름표가 아니라 라우팅 테이블의 한 줄이 차이를 만듭니다. IGW 경로가 있으면 Public, NAT 또는 경로가 없으면 Private Subnet입니다.", "w9"], ["NAT Gateway를 사용하면 외부 인터넷에서 Private Subnet의 API 서버로 새 연결을 시작할 수 있다.", "X", "NAT Gateway는 내부 서버가 밖으로 나가는(Outbound) 연결만 시작할 수 있게 하는 출구입니다. 응답은 돌아오지만 외부에서 새 연결을 시작할 수는 없습니다.", "w9"], ["로드 밸런서를 사용하면 뒤의 서버를 늘리거나 교체해도 사용자는 같은 대표 주소로 계속 접속할 수 있다.", "O", "사용자는 로드 밸런서 주소 하나만 알면 되고, 로드 밸런서가 정상인 서버들에 요청을 나눠 보냅니다.", "w9"], ["로드 밸런서는 상태 확인(health check)을 통과한 정상 서버로만 요청을 보낸다.", "O", "서버를 두 AZ에 나눠 두는 Multi-AZ 배치와 함께 쓰면 한 서버가 멈춰도 다른 서버가 요청을 받습니다. 단, DB와 외부 호출 경로의 장애 대비는 따로 설계해야 합니다.", "w9"], ["Security Group은 Stateful이므로 허용된 인바운드 연결에 대한 응답 트래픽은 별도 규칙 없이 자동으로 허용된다.", "O", "Security Group은 리소스(네트워크 인터페이스)에 적용하는 가상 방화벽이며, 허용된 연결의 응답을 자동 허용합니다.", "w9"], ["DB(PostgreSQL 5432) 보안 그룹은 관리 편의를 위해 인터넷 전체(0.0.0.0/0)에 열어 두는 것이 권장된다.", "X", "DB 포트 5432는 API 서버의 요청에만 허용해야 합니다. 예시 설계는 LB는 443(인터넷), API는 8000(LB에서만), DB는 5432(API에서만)입니다.", "w9"], ["Network ACL은 서브넷 단위로 적용되며, 규칙 번호 순으로 허용·거부를 판단하고 양방향 규칙을 모두 확인해야 한다.", "O", "Security Group은 리소스 단위·Stateful인 반면, Network ACL은 서브넷 단위이며 응답 방향 규칙도 직접 확인해야 합니다.", "w9"], ["AWS에서 /24 서브넷을 만들면 256개 IP 주소를 모두 서버에 할당할 수 있다.", "X", "/24는 2⁸ = 256개 주소이지만 AWS가 5개를 예약하므로 실제로 사용할 수 있는 주소는 251개입니다.", "w9"], ["VPC Flow Logs에는 HTTP 요청 본문(Body)까지 기록되므로 요청 내용을 분석할 수 있다.", "X", "Flow Logs에는 IP, 포트, ACCEPT/REJECT 같은 흐름 정보만 기록되고 요청 본문은 담기지 않습니다. 차단 여부를 좁히는 데 사용합니다.", "w9"]], "abbr": [["2FA", ["Two-Factor Authentication"], ["w6"], 3, "", []], ["ACL", ["Access Control List"], ["w7", "w9"], 3, "누가 어떤 토픽에 읽기/쓰기를 할 수 있는지 정한 규칙 (pattern write devices/%c/#).", [98]], ["AES", ["Advanced Encryption Standard"], ["w6"], 3, "가장 널리 쓰이는 대칭키 블록 암호. TLS에서는 AES-GCM 형태로데이터 암호화에 쓴다.", []], ["ALB", ["Application Load Balancer"], ["w9"], 3, "L7(HTTP · HTTPS) 로드밸런서. 경로 · 호스트 · 헤더 라우팅, TLS 종료. REST ·WebSocket · SSE에 적합.", []], ["API", ["Application Programming Interface"], ["w5", "w6", "w7", "w9"], 3, "프로그램끼리 기능·데이터를 주고받기 위해 약속된 인터페이스. 서버 코드자체가 아니라 팀(시스템) 사이의 경계선이다.", [10, 21, 55, 65, 93]], ["AZ", ["Availability Zone"], ["w9"], 3, "리전 안에서 전력 · 냉각 · 네트워크가 독립된 데이터센터 묶음. 서브넷은 AZ 하나에 속한다.", [87, 88]], ["BLE", ["Bluetooth Low Energy"], ["w7"], 3, "근거리(~수십 m)·저전력 무선 기술. 대부분 잠들어 있다가 짧은 간격에만 깨어 통신한다.", [77]], ["CA", ["Certificate Authority"], ["w6"], 3, "인증서를 발급하고 서명하는 신뢰 기관 (Let's Encrypt, DigiCert, Sectigo 등).", [36]], ["CIDR", ["Classless Inter-Domain Routing"], ["w9"], 3, "10.0.0.0/16처럼 IP 대역을 “주소/접두사 길이”로 표기하는 방식 (Week 2).", []], ["CORS", ["Cross-Origin Resource Sharing"], ["w5", "w6", "w7"], 3, "서버가 응답 헤더로 특정 Origin의 cross-origin 읽기를 허용해 SOP를 완화하는 메커니즘. 보안 장치가 아니라 완화 장치다.", [25, 26, 71]], ["CRUD", ["Create · Read · Update · Delete"], ["w5"], 3, "데이터 조작 4가지. 각각 POST · GET · PUT/PATCH · DELETE에 대응한다.", []], ["CSRF", ["Cross-Site Request Forgery"], ["w5", "w6"], 3, "쿠키 자동 첨부를 악용해 사용자가 모르게 요청을 보내게 하는 공", []], ["DNS", ["Domain Name System"], ["w5", "w9"], 3, "도메인 이름 → IP. 위임(Root → TLD → 권한) + 캐시(TTL)", []], ["EIP", ["Elastic IP"], ["w9"], 3, "계정에 고정된 공인 IPv4. DNS · 화이트리스트에 등록할 주소. 보유만 해도 과금될 수 있다.", []], ["ENI", ["Elastic Network Interface"], ["w9"], 3, "인스턴스 · LB · RDS에 붙는 가상 NIC. 사설 IP · 공인 IP · SG가 여기에 연결된다.", []], ["HA", ["High Availability"], ["w9"], 3, "일부 구성요소가 고장 나도 서비스가 계속되도록 하는 설계.", []], ["HMAC", ["Hash-based Message Authentication Code"], ["w6"], 3, "", []], ["HSTS", ["HTTP Strict Transport Security"], ["w6"], 3, "Strict-Transport-Security 헤더로 “이 사이트는 일정 기간HTTPS로만 접속하라”고 브라우저에 지시. SSL Strip을 막는다.", [38]], ["HTTPS", ["HyperText Transfer Protocol Secure"], ["w5", "w6"], 3, "TLS로 암호화된 통로 위의 HTTP. 기본 포트 443. URL 경로·쿼리·헤더·Body가 모두 암호화된다.", [8, 35, 37, 38]], ["IaC", ["Infrastructure as Code"], ["w9"], 3, "인프라를 코드로 정의해 Git으로 버전 관리 · 리뷰 · 재현하는 방식.", []], ["ICE", ["Interactive Connectivity Establishment"], ["w7"], 3, "가능한 주소 후보를 모아 후보 쌍을 시험하고, 성공한 경로를 고르는 절차.", []], ["IDOR", ["Insecure Direct Object Reference"], ["w6"], 3, "URL·파라미터의 id만 바꿔 남의 데이터에 접근되는 취약점. 인증은 됐지만 소유권 검사가 빠진 경우.", [56]], ["IGW", ["Internet Gateway"], ["w9"], 3, "VPC와 인터넷을 잇는 관리형 출입구. 공인 IP ↔ 사설 IP를 1:1로 변환한다. VPC당 1개.", [92]], ["JSON", ["JavaScript Object Notation"], ["w5", "w7"], 3, "이름–값 쌍과 배열로 데이터를 표현하는 경량 텍스트 형식. REST API의 기본 표현 형식.", [9, 16]], ["JWT", ["JSON Web Token"], ["w5", "w6"], 3, "header.payload.signature 세 부분을 점으로 이은 서명된 토큰. 서버는 저장소 조회 없이 서명만 검증한다. ‘홀로그램 입장권’ 비유.", [49, 50, 51]], ["LB", ["Load Balancer"], ["w5", "w7", "w9"], 3, "여러 서버에 요청을 나눠 주는 장치 (L4/L7)", []], ["LWT", ["Last Will and Testament"], ["w7"], 3, "CONNECT 때 등록해 두면, 클라이언트가 비정상으로 사라질 때 브로커가 대신 발행하는 메시지 (예: status = offline).", [84]], ["MFA", ["Multi-Factor Authentication"], ["w6"], 3, "서로 다른 종류의 인증 요소를 둘 이상 조합하는 것. 비밀번호 + 보안 질문은 MFA가 아니다.", [41]], ["MITM", ["Man-In-The-Middle"], ["w6"], 3, "통신 중간에 끼어들어 엿보거나 바꾸는 공격. 인증서 검증으로 막는다.", []], ["MQTT", ["Message Queuing Telemetry Transport"], ["w7"], 3, "TCP 위의 경량 Publish/Subscribe 메시징 프로토콜. 고정 헤더 최소 2 B. 1999년 위성 원격 감시용으로 시작.", [77, 78, 79, 80, 81, 82, 85]], ["NACL", ["Network Access Control List"], ["w9"], 3, "서브넷 경계에 적용되는 Stateless 방화벽. 허용 · 거부 규칙과 번호 순서를 가진다.", []], ["NAT", ["Network Address Translation"], ["w7", "w9"], 3, "Private ↔ Public 주소 변환. 나가야 돌아온다", [93]], ["NLB", ["Network Load Balancer"], ["w9"], 3, "L4(TCP · UDP · TLS) 로드밸런서. AZ별 고정 IP · 초저지연. MQTT · 게임 서버에적합.", []], ["OAuth", ["Open Authorization"], ["w5", "w6"], 3, "비밀번호를 넘기지 않고 제3자 앱에 scope가 제한된 권한을 위임하는 인가 프레임워크. ‘발레파킹 키’ 비유.", [53, 54]], ["OIDC", ["OpenID Connect"], ["w6"], 3, "OAuth 2.0 위에 ‘인증’을 얹은 표준. 사용자 신원을 담은 ID Token(JWT)을 함께 발급한다 (“구글로 로그인”).", []], ["OTP", ["One-Time Password"], ["w6"], 3, "한 번만 쓰는 코드.", []], ["P2P", ["Peer-to-Peer"], ["w7"], 3, "서버를 거치지 않고 두 단말이 직접 데이터를 주고받는 구조.", [76]], ["PAT", ["Port Address Translation"], ["w9"], 3, "포트 번호로 여러 내부 연결을 구분해 하나의 공인 IP로 내보내는 방식. 가정용 공유기와 같은 원리.", []], ["PFS", ["Perfect Forward Secrecy"], ["w6"], 3, "서버 개인키가 나중에 유출돼도 과거 트래픽은 안전", []], ["QoS", ["Quality of Service"], ["w7"], 3, "MQTT 메시지가 얼마나 확실히 전달되는지의 단계 (0·1·2). 높을수록 왕복이 늘어난다.", [82]], ["REST", ["Representational State Transfer"], ["w5"], 3, "Roy Fielding(2000)이 웹의 확장성을 6가지 제약으로 정리한 아키텍처 스타일. 프로토콜이 아니며 HTTP 그 자체도 아니다.", [1, 2, 3, 21]], ["RTT", ["Round-Trip Time"], ["w5", "w6", "w7"], 3, "요청이 갔다가 응답이 돌아오는 시간. TCP 1-RTT + TLS 1.3 1-RTT 후 첫 HTTP 요청이 나간다.", []], ["SDP", ["Session Description Protocol"], ["w7"], 3, "코덱·미디어 종류·암호화 지문 등 “어떻게 통화할지”를 적은 텍스트 설명서.", []], ["SG", ["Security Group"], ["w9"], 3, "ENI에 붙는 Stateful 방화벽. 허용 규칙만 있고, 규칙끼리는 OR로 평가한다.", []], ["SLA", ["Service Level Agreement"], ["w9"], 3, "사업자가 약속한 가용성 수치. 우리 서비스의 가용성은 우리 설계가 결정한다.", []], ["SNAT", ["Source Network Address Translation"], ["w9"], 3, "패킷의 출발지 IP를 NAT 자신의 주소로 바꾸는 것. 응답은 매핑 테이블로 원래 서버에 돌려준다.", []], ["SNI", ["Server Name Indication"], ["w6"], 3, "한 IP에 여러 도메인이 있을 때 어떤 도메인의 인증서가 필요한지ClientHello에 적어 보내는 값.", []], ["SOP", ["Same-Origin Policy"], ["w5", "w7"], 3, "다른 Origin의 응답을 JS가 '읽는 것'을 막는 브라우저 규칙. 요청을 '보내는 것'은 원래 가능하다.", []], ["SQLi", ["SQL Injection"], ["w6"], 3, "입력이 SQL 문법의 일부가 되어 쿼리가 바뀌는 공격 (admin' --).", []], ["SSE", ["Server-Sent Events"], ["w5", "w7"], 3, "HTTP 응답을 끝내지 않고 이벤트를 텍스트로 계속 흘려보내는 서버→클라이언트단방향 Push 방식.", [61, 62, 63, 64, 66]], ["STUN", ["Session Traversal Utilities for NAT"], ["w7"], 3, "“밖에서 보면 너의 주소는 이것”을 알려 주는 가벼운 서버. 공인 IP:포트 확인용.", [76]], ["TCP", ["Transmission Control Protocol"], ["w5", "w7", "w9"], 3, "연결형 · 신뢰성 L4. 3-way handshake, Seq/ACK, 재전송, 흐름·혼잡 제어", [74]], ["TLS", ["Transport Layer Security"], ["w5", "w6", "w7", "w9"], 3, "TCP 위에서 기밀성·무결성·서버 인증을 제공하는 프로토콜. SSL의 후속이며 현재 1.2·1.3을 쓴다.", [30, 31, 32, 69]], ["TOTP", ["Time-based One-Time Password"], ["w6"], 3, "공유 비밀값 + 현재 시각(30초 단위)을 해시해 6자리 코드를 만드는 방식. 네트워크 없이 앱에서 생성된다.", []], ["TURN", ["Traversal Using Relays around NAT"], ["w7"], 3, "P2P가 불가능할 때 모든 미디어를 대신 중계하는 서버. 확실하지만 대역폭 비용이크다.", []], ["UDP", ["User Datagram Protocol"], ["w7", "w9"], 3, "비연결 · 비신뢰 L4. 8바이트 헤더, 생략으로 빠름 (DNS · 스트리밍 · QUIC)", []], ["URI", ["Uniform Resource Identifier"], ["w5"], 3, "자원을 식별하는 문자열. URI는 '명사(자원)'를, Method는 '동사(행위)'를담당한다.", [3, 6, 8, 9, 11] const abNorm = s => String(s).toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/[^a-z0-9]/g, '').replace(/s$/, '');
function abCheck(input, forms) {
  const a = abNorm(input); if (!a) return false;
  return forms.some(f => abNorm(f) === a || String(f).toLowerCase().replace(/[^a-z0-9]/g, '').replace(/s$/, '') === a);
}
function abHL(full, ab) {
  const s = String(full), letters = ab.replace(/[^a-z0-9]/gi, '').toLowerCase(), mk = new Set(); let pos = 0;
  const strong = j => /[A-Z0-9]/.test(s[j]) || j === 0 || /[\s\-–·:,(+/]/.test(s[j - 1]);
  for (const c of letters) {
    let j = -1;
    for (let t = pos; t < s.length; t++) if (s[t].toLowerCase() === c && strong(t)) { j = t; break; }
    if (j < 0) for (let t = pos; t < s.length; t++) if (s[t].toLowerCase() === c) { j = t; break; }
    if (j < 0) break; mk.add(j); pos = j + 1;
  }

}

function mountOXF(host) {
  let sel = LS.get('fx.weeks', WEEKS.slice()), order = LS.get('fx.order', 'seq'), set = [], i = 0, picks = {};
  const box = document.createElement('div'); host.appendChild(box);
  function newSet(onlyWrong) {

    if (onlyWrong) p = p.filter(k => W.has(k));
    set = order === 'seq' && !onlyWrong ? p : rng().shuffle(p); i = 0; picks = {}; draw();

    let h = `<div class="lab oxq"><div class="lab-head"><span class="tag">OX 100</span>교수님이 준 기말 예상 OX — 시험에 그대로 나온다 · 해설은 자료 원문</div>
<div class="lab-ctl">${WEEKS.map(w => `<div class="ctl tog"><input type="checkbox" id="fx-${w}" ${sel.includes(w) ? 'checked' : ''}><label for="fx-${w}">${WS[w]} (${FOX.filter(r => r[3] === w).length})</label></div>`).join('')}
<div class="abseg">${[['seq', '번호순'], ['mix', '섞기']].map(([m, l]) => `<button class="btn sm ${order === m ? 'pri' : ''}" data-order="${m}">${l}</button>`).join('')}</div>
<button class="btn" data-new>처음부터</button><button class="btn" data-wrong ${W.size ? '' : 'disabled'}>틀린 것만 (${W.size})</button></div><div class="lab-out">
<div class="ab-prog one"><div class="ab-tier t3"><span>맞힌 문항</span><div class="oxprog"><i style="width:${K.size}%"></i></div><b class="mono">${K.size}/100</b></div></div>`;
    if (!set.length) h += '<p>선택한 범위에 문항이 없다.</p>';
    else if (i < set.length) {
      const k = set[i], r = FOX[k], p = picks[k];
      h += `<div class="oxbar"><div class="oxprog"><i style="width:${done.length / set.length * 100}%"></i></div><span class="mono">${i + 1} / ${set.length} · 정답 ${right}</span></div>
<div class="oxcard"><div class="oxmeta"><b class="mono">문제 ${k + 1}</b> · ${WL[r[3]]}${W.has(k) && !p ? ' · <b style="color:var(--bad)">지난번에 틀림</b>' : ''}</div><div class="oxq-t">${esc(r[0])}</div>
<div class="oxbtn"><button data-ox="O" class="o ${p ? (r[1] === 'O' ? 'right' : p === 'O' ? 'wrong' : 'dim') : ''}" ${p ? 'disabled' : ''}>O</button><button data-ox="X" class="x ${p ? (r[1] === 'X' ? 'right' : p === 'X' ? 'wrong' : 'dim') : ''}" ${p ? 'disabled' : ''}>X</button></div>`;
      if (p) h += `<div class="model"><div class="mh">${p === r[1] ? '⭕ 정답' : '❌ 오답'} — 정답은 ${r[1]}</div>${esc(r[2])}${relChips(k + 1)}</div><div style="margin-top:12px"><button class="btn pri" data-next>${i + 1 < set.length ? '다음 ▶ (Enter)' : '결과 ▶'}</button></div>`;
      h += '</div>';
    } else {
      const wr = set.filter(k => picks[k] && picks[k] !== FOX[k][1]);
      h += `<div class="big">${right} / ${done.length}</div><p class="cm">${WEEKS.filter(w => set.some(k => oxW(k) === w)).map(w => { const a = set.filter(k => oxW(k) === w && picks[k]); return `${WS[w]} ${a.filter(k => picks[k] === FOX[k][1]).length}/${a.length}`; }).join(' · ')}</p>`;
      if (wr.length) h += `<div class="oxrev">${wr.map(k => `<div><div class="oxq-t" style="font-size:15.5px"><b class="mono">${k + 1}.</b> ${esc(FOX[k][0])} <b class="mono">→ ${FOX[k][1]}</b></div><div class="cm" style="font-size:14px">${esc(FOX[k][2])}</div></div>`).join('')}</div>`;
      h += `<div style="margin-top:10px;display:flex;gap:8px"><button class="btn pri" data-new>다시</button>${wr.length ? '<button class="btn" data-wrong>틀린 것만</button>' : ''}</div>`;
    }
    box.innerHTML = h + '</div></div>';
    const rd = () => { sel = WEEKS.filter(w => box.querySelector('#fx-' + w).checked); if (!sel.length) sel = WEEKS.slice(); LS.set('fx.weeks', sel); };
    box.querySelectorAll('.lab-ctl input').forEach(c => c.onchange = () => { rd(); newSet(false); });
    box.querySelectorAll('[data-order]').forEach(b => b.onclick = () => { order = b.dataset.order; LS.set('fx.order', order); rd(); newSet(false); });
    box.querySelectorAll('[data-new]').forEach(b => b.onclick = () => { rd(); newSet(false); });
    box.querySelectorAll('[data-wrong]').forEach(b => b.onclick = () => { rd(); newSet(true); });
    box.querySelectorAll('[data-ox]').forEach(b => b.onclick = () => answer(b.dataset.ox));
    const nx = box.querySelector('[data-next]'); if (nx) nx.onclick = () => { i++; draw(); };
  }
  document.addEventListener('keydown', e => {
    if (!box.isConnected || i >= set.length || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;

    const k = e.key.toLowerCase();

    else if (picks[set[i]] && (k === 'enter' || k === 'arrowright')) { i++; draw(); e.preventDefault(); }
  });
  newSet(false);
}

/* ---------- Abbreviation → full name ---------- */
function mountAbbrF(host) {
  let tiers = LS.get('fa.tiers', [3]), sel = LS.get('fa.weeks', WEEKS.slice()), mode = LS.get('fa.mode', 'learn'), onlyOX = LS.get('fa.ox', false), deck = [], i = 0, st = [], hide = true;
  if (!['learn', 'write', 'table'].includes(mode)) mode = 'learn';
  const box = document.createElement('div'); host.appendChild(box);
  const inScope = r => tiers.includes(r.tier) && r.weeks.some(w => sel.includes(w)) && (!onlyOX || r.ox);
  function newDeck(onlyWrong) {
    const W = setOf('fa.wrong'), K = setOf('fa.ok'), R = rng(); let p = AL.filter(inScope); if (onlyWrong) p = p.filter(r => W.has(r.key));
    const rank = r => (W.has(r.key) ? 0 : K.has(r.key) ? 2 : 1) * 10 + (3 - r.tier) * 2 + (r.ox ? 0 : 1);
    deck = R.shuffle(p).sort((a, b) => rank(a) - rank(b)); st = deck.map(() => ({ v: '', ok: null, open: false })); i = 0; draw();
  }
  function progress(K) {
    return `<div class="ab-prog">${[3, 2, 1].map(t => { const a = AL.filter(r => r.tier === t), k = a.filter(r => K.has(r.key)).length; return `<div class="ab-tier t${t}"><span>${TIER[t][0]} ${TIER[t][1]}</span><div class="oxprog"><i style="width:${a.length ? k / a.length * 100 : 0}%"></i></div><b class="mono">${k}/${a.length}</b></div>`; }).join('')}</div>`;
  }
  function draw() {
    const W = setOf('fa.wrong'), K = setOf('fa.ok');
    let h = `<div class="lab oxq"><div class="lab-head"><span class="tag">약어</span>5·6·7·9주 약어 ${FA.length}개 → 영문 원래 이름 · ★★★ 핵심과 OX에 나온 약어부터</div>
<div class="lab-ctl">${[3, 2, 1].map(t => `<div class="ctl tog"><input type="checkbox" id="fa-t${t}" ${tiers.includes(t) ? 'checked' : ''}><label for="fa-t${t}">${TIER[t][0]} ${TIER[t][1]} (${AL.filter(r => r.tier === t).length})</label></div>`).join('')}
<div class="ctl"><label for="fa-wk">주차</label><select id="fa-wk"><option value="all">전체</option>${WEEKS.map(w => `<option value="${w}" ${sel.length === 1 && sel[0] === w ? 'selected' : ''}>${WL[w]}</option>`).join('')}</select></div>
<div class="ctl tog"><input type="checkbox" id="fa-ox" ${onlyOX ? 'checked' : ''}><label for="fa-ox">OX에 나온 약어만 (${AL.filter(r => r.ox).length})</label></div>
<div class="abseg">${[['learn', '외우기'], ['write', '쓰기 시험'], ['table', '한눈에 표']].map(([m, l]) => `<button class="btn sm ${mode === m ? 'pri' : ''}" data-mode="${m}">${l}</button>`).join('')}</div>
<button class="btn" data-new>섞기</button><button class="btn" data-wrong ${W.size ? '' : 'disabled'}>틀린 것만 (${W.size})</button></div><div class="lab-out">${progress(K)}`;
    if (mode === 'table') {
      const list = AL.filter(inScope);
      h += `<div style="display:flex;gap:8px;align-items:center;margin:0 0 8px"><button class="btn sm" data-hide>${hide ? '원래 이름 보이기' : '원래 이름 가리기'}</button><span class="cm" style="font-size:13px">${list.length}개${hide ? ' · 가려진 칸을 누르면 하나씩 보인다' : ''}</span></div>`;
      h += `<div class="ft-scroll">` + [3, 2, 1].filter(t => list.some(r => r.tier === t)).map(t => `<h4 class="ab-th t${t}">${TIER[t][0]} ${TIER[t][1]}</h4><div class="ab-tbl">${list.filter(r => r.tier === t).map(r => `<div class="${W.has(r.key) ? 'wr' : K.has(r.key) ? 'kn' : ''}"><b class="mono">${esc(r.key)}</b><div><div class="ab-full ${hide ? 'veil' : ''}" data-veil>${abFull(r.a)}</div><div class="ab-mean">${esc(r.a[4])} ${oxChip(r.a)}</div></div></div>`).join('')}</div>`).join('') + '</div>' + (list.length ? '' : '<p>선택한 범위에 약어가 없다.</p>');
    } else if (!deck.length) h += '<p>선택한 범위에 약어가 없다. 중요도나 주차를 넓혀 보자.</p>';
    else if (i < deck.length) {
      const r = deck[i], s = st[i];
      h += `<div class="oxbar"><div class="oxprog"><i style="width:${i / deck.length * 100}%"></i></div><span class="mono">${i + 1} / ${deck.length}</span></div>
<div class="oxcard"><div class="oxmeta"><span class="ab-badge t${r.tier}">${TIER[r.tier][0]} ${TIER[r.tier][1]}</span> ${r.weeks.map(w => WS[w]).join(', ')} ${oxChip(r.a)}${W.has(r.key) && s.ok == null ? ' · <b style="color:var(--bad)">지난번에 틀림</b>' : ''}</div><div class="ab-big mono">${esc(r.key)}</div>`;
      const card = `<div class="ab-full big">${abFull(r.a)}</div><div class="ab-mean">${esc(r.a[4])}</div>`;
      if (mode === 'learn') {
        if (!s.open) h += `<p class="cm" style="margin:0 0 10px;font-size:14px">원래 이름을 머릿속으로 말해 본 뒤 펼친다.</p><button class="btn pri" data-open>펼치기 (Space)</button>`;
        else h += card + (s.ok == null ? `<div class="ab-self"><button class="btn ok" data-self="1">알았다 ✓ (1)</button><button class="btn no" data-self="0">헷갈렸다 ✗ (2)</button></div>` : `<div style="margin-top:10px"><button class="btn pri" data-next>다음 ▶</button></div>`);
      } else {
        h += `<input type="text" class="ab-in" data-in value="${esc(s.v)}" ${s.ok != null ? 'disabled' : ''} autocomplete="off" spellcheck="false" placeholder="원래 이름을 영어로 · Enter로 채점">`;
        if (s.ok != null) h += `<div class="model"><div class="mh">${s.ok ? '⭕ 정답' : '❌ 오답'}${!s.ok ? ' <button class="btn sm" data-ov>맞은 걸로</button>' : ''}</div>${card}</div><div style="margin-top:10px"><button class="btn pri" data-next>다음 ▶</button></div>`;
        else h += `<div style="margin-top:10px;display:flex;gap:8px"><button class="btn pri" data-chk>채점</button><button class="btn" data-skip>모르겠다</button></div>`;
      }
      h += '</div>';
    } else { const ok = st.filter(s => s.ok).length; h += `<div class="big">${ok} / ${deck.length}</div><p>${deck.length - ok ? `틀린 ${deck.length - ok}개는 다음 판에 맨 앞에 나온다.` : '이 범위는 전부 외웠다. ★★로 넓혀 보자.'}</p><button class="btn pri" data-new>다시 섞기</button>`; }
    box.innerHTML = h + '</div></div>';
    const rd = () => { tiers = [3, 2, 1].filter(t => box.querySelector('#fa-t' + t).checked); if (!tiers.length) tiers = [3]; const v = box.querySelector('#fa-wk').value; sel = v === 'all' ? WEEKS.slice() : [v]; onlyOX = box.querySelector('#fa-ox').checked; LS.set('fa.tiers', tiers); LS.set('fa.weeks', sel); LS.set('fa.ox', onlyOX); };
    box.querySelectorAll('.lab-ctl input, .lab-ctl select').forEach(c => c.onchange = () => { rd(); newDeck(false); });
    box.querySelectorAll('[data-new]').forEach(b => b.onclick = () => { rd(); newDeck(false); });
    box.querySelector('[data-wrong]').onclick = () => { rd(); if (mode === 'table') mode = 'learn'; newDeck(true); };
    box.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; LS.set('fa.mode', mode); rd(); newDeck(false); });
    const hb = box.querySelector('[data-hide]'); if (hb) hb.onclick = () => { hide = !hide; draw(); };
    box.querySelectorAll('[data-veil]').forEach(v => v.onclick = () => v.classList.remove('veil'));
    const next = () => { i++; draw(); const n = box.querySelector('[data-in]') || box.querySelector('[data-open]'); if (n) n.focus({ preventScroll: true }); };
    const op = box.querySelector('[data-open]'); if (op) op.onclick = () => { st[i].open = true; draw(); };
    box.querySelectorAll('[data-self]').forEach(b => b.onclick = () => res(b.dataset.self === '1'));
    const inp = box.querySelector('[data-in]');
    if (inp) { inp.oninput = () => st[i].v = inp.value; inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if (st[i].ok == null) res(abCheck(inp.value, deck[i].a[1])); } }; }
    const c = box.querySelector('[data-chk]'); if (c) c.onclick = () => res(abCheck(inp.value, deck[i].a[1]));
    const sk = box.querySelector('[data-skip]'); if (sk) sk.onclick = () => res(false);
    const ov = box.querySelector('[data-ov]'); if (ov) ov.onclick = () => res(true);
    const nx = box.querySelector('[data-next]'); if (nx) nx.onclick = next;
    box._next = next;
  }
  function res(ok) { st[i].ok = ok; mark('fa', deck[i].key, ok); draw(); const n = box.querySelector('[data-next]'); if (n) n.focus({ preventScroll: true }); }
  document.addEventListener('keydown', e => {
    if (!box.isConnected || mode !== 'learn' || i >= deck.length || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const r = box.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
    const s = st[i];
    if (!s.open && (e.key === ' ' || e.key === 'Enter')) { s.open = true; draw(); e.preventDefault(); }
    else if (s.open && s.ok == null && (e.key === '1' || e.key === '2')) { res(e.key === '1'); e.preventDefault(); }
    else if (s.ok != null && (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === ' ')) { box._next(); e.preventDefault(); }
  });
  newDeck(false);
}

/* ---------- Mock final exam: OX (from the 100) + abbreviation full names ---------- */
const SIZES = { s: ['짧게', 30, 8], m: ['기본', 50, 15], l: ['실전', 100, 20] };

  let cfg = LS.get('fe.cfg', { size: 'm', weeks: WEEKS.slice() }), ex = LS.get('fe.cur', null), i = 0;
  if (!SIZES[cfg.size]) cfg.size = 'm';
  if (ex && ex.v !== 3) ex = null;
  const box = document.createElement('div'); host.appendChild(box);
  const save = () => LS.set('fe.cur', ex);

    const R = rng(), [, nOx, nAb] = SIZES[cfg.size], sel = cfg.weeks.length ? cfg.weeks : WEEKS;
    const pick = (arr, n, first) => R.shuffle(arr.filter(first)).concat(R.shuffle(arr.filter(x => !first(x)))).slice(0, n);
    const XW = setOf('fx.wrong'), XK = setOf('fx.ok');
    const oxPool = FOX.map((r, k) => k).filter(k => sel.includes(oxW(k)));
    const oxs = (nOx >= oxPool.length ? R.shuffle(oxPool) : R.shuffle(pick(oxPool, nOx, k => XW.has(k) || !XK.has(k)))).map(k => ({ t: 'ox', k, pick: null }));
    const AW = setOf('fa.wrong'), AK = setOf('fa.ok'), ap = AL.filter(r => r.tier >= 2 && r.weeks.some(w => sel.includes(w)));
    const need = nAb * 3, n3 = Math.ceil(need * 0.75);
    const pri = r => AW.has(r.key) || (!AK.has(r.key) && r.ox);
    const a3 = pick(ap.filter(r => r.tier === 3), n3, pri);
    const aSel = R.shuffle(a3.concat(pick(ap.filter(r => !a3.includes(r)), need - a3.length, pri)));
    const abs = []; for (let k = 0; k < nAb && aSel.length >= (k + 1) * 3; k++) abs.push({ t: 'ab', keys: aSel.slice(k * 3, k * 3 + 3).map(r => r.k), ans: [], ov: [], checked: false });
    ex = { v: 3, size: cfg.size, weeks: sel, items: oxs.concat(abs) }; i = 0; save(); draw();
  }
  const abOk = (it, j) => it.ov[j] != null ? it.ov[j] : abCheck(it.ans[j] || '', FA[it.keys[j]][1]);
  const grade = it => it.t === 'ox' ? (it.pick && it.pick === FOX[it.k][1] ? 1 : 0) : (it.checked ? it.keys.filter((_, j) => abOk(it, j)).length : 0);
  const maxOf = it => it.t === 'ab' ? it.keys.length : 1;
  const answered = it => it.t === 'ab' ? it.checked : it.pick != null;
  const TYPE = { ox: 'OX', ab: '약어 원래 이름' };
  function draw() {
    let h = `<div class="lab oxq mt"><div class="lab-head"><span class="tag">기말 모의시험</span>OX(예상문제 100에서만) + 약어 원래 이름 — 틀린 것 · 아직 못 맞힌 것 · OX에 나온 약어 먼저</div>
<div class="lab-ctl"><div class="ctl"><label for="fe-size">분량</label><select id="fe-size">${Object.entries(SIZES).map(([k, v]) => `<option value="${k}" ${cfg.size === k ? 'selected' : ''}>${v[0]} · OX ${v[1]} + 약어 ${v[2]}문항 × 3</option>`).join('')}</select></div>
${WEEKS.map(w => `<div class="ctl tog"><input type="checkbox" id="fe-${w}" ${cfg.weeks.includes(w) ? 'checked' : ''}><label for="fe-${w}">${WS[w]}</label></div>`).join('')}
<button class="btn pri" data-new>새 시험지</button></div><div class="lab-out">`;
    if (!ex) { h += '<p>분량과 범위를 고르고 <b>새 시험지</b>를 누르면 시작한다. OX는 예상문제 100에서만 나오고, “실전”은 범위 안의 100문항을 전부 섞어 낸다. 약어는 한 문항에 3개씩 — ★★★ 75% 이상, 나머지는 ★★에서만.</p>'; box.innerHTML = h + '</div></div>'; bind(); return; }
    const its = ex.items;
    h += `<div class="mt-comp"><span>OX <b>${its.filter(x => x.t === 'ox').length}</b></span><span>약어 <b>${its.filter(x => x.t === 'ab').length}</b> <i>(×3 = ${its.filter(x => x.t === 'ab').length * 3}개)</i></span><span class="mt-past">${ex.weeks.map(w => WS[w]).join(' · ')}</span></div>`;
    h += `<div class="oxdots">${its.map((r, k) => `<button data-go="${k}" class="${k === i ? 'cur' : answered(r) ? (grade(r) >= maxOf(r) ? 'ok' : grade(r) > 0 ? 'part' : 'no') : ''} t-${r.t}">${k + 1}</button>`).join('')}<button data-go="${its.length}" class="${i >= its.length ? 'cur' : ''}" style="width:auto;padding:0 8px">결과</button></div>`;
    if (i < its.length) {
      const it = its[i], first = its.findIndex(x => x.t === it.t), last = its.length - 1 - [...its].reverse().findIndex(x => x.t === it.t);
      h += `<div class="oxcard"><div class="oxmeta">${TYPE[it.t]} ${i - first + 1}/${last - first + 1}${it.t === 'ox' ? ` · <b class="mono">문제 ${it.k + 1}</b> · ${WS[oxW(it.k)]}` : ''}</div>`;
      if (it.t === 'ox') {
        const r = FOX[it.k], p = it.pick;
        h += `<div class="oxq-t">${esc(r[0])}</div><div class="oxbtn"><button data-ox="O" class="o ${p ? (r[1] === 'O' ? 'right' : p === 'O' ? 'wrong' : 'dim') : ''}" ${p ? 'disabled' : ''}>O</button><button data-ox="X" class="x ${p ? (r[1] === 'X' ? 'right' : p === 'X' ? 'wrong' : 'dim') : ''}" ${p ? 'disabled' : ''}>X</button></div>`;
        if (p) h += `<div class="model"><div class="mh">${p === r[1] ? '⭕ 정답' : '❌ 오답'} — 정답은 ${r[1]}</div>${esc(r[2])}</div>`;
      } else {

        if (!it.checked) h += `<div style="margin-top:10px"><button class="btn pri" data-abchk>채점</button> <span class="cm" style="font-size:13px">대소문자 · 띄어쓰기 · 하이픈 · 괄호 속 보충 설명은 무시한다</span></div>`;
      }
      if (answered(it)) h += `<div style="margin-top:12px"><button class="btn pri" data-go="${i + 1}">${i + 1 < its.length ? '다음 문제 ▶' : '결과 보기 ▶'}</button></div>`;
      h += '</div>';
    } else {
      const sum = f => its.filter(f).reduce((s, x) => s + grade(x), 0), mx = f => its.filter(f).reduce((s, x) => s + maxOf(x), 0);
      const rows = [['OX', x => x.t === 'ox'], ['약어 원래 이름 (개수)', x => x.t === 'ab']];
      const tot = sum(() => true), tmx = mx(() => true), un = its.filter(x => !answered(x)).length;
      h += `<div class="big" style="margin-bottom:4px">${tot} / ${tmx}</div><p class="mono cm" style="margin:0 0 10px">${Math.round(tot / tmx * 100)}%${un ? ` · 안 푼 문제 ${un}` : ''}</p>`;
      h += T(['유형', '점수', '정답률'], rows.filter(([, f]) => its.some(f)).map(([l, f]) => [l, `${sum(f)} / ${mx(f)}`, `${Math.round(sum(f) / Math.max(1, mx(f)) * 100)}%`]));
      h += `<p class="cm" style="font-size:14px">OX 주차별 — ${WEEKS.filter(w => its.some(x => x.t === 'ox' && oxW(x.k) === w)).map(w => { const r = its.filter(x => x.t === 'ox' && oxW(x.k) === w); return `${WS[w]} ${r.filter(x => grade(x)).length}/${r.length}`; }).join(' · ')}</p>`;

    else if ((k === 'enter' || k === 'arrowright') && answered(it)) { i++; draw(); e.preventDefault(); }
  });

}

const cnt = (arr, f) => arr.filter(f).length;
addWeek({ id: 'fn', num: 'F', short: '기말', title: '기말 대비 — OX 100 · 약어 원래 이름', range: '5·6·7·9주차',
  lead: '기말 필기(12/7)는 <b>OX와 용어(약어의 원래 이름)만</b> 나오고, OX는 미리 준 <b>예상문제 100개가 그대로</b> 나온다. 그래서 OX는 그 100문항만 반복하고, 약어는 용어표(5·6·7·9주)를 <b>중요도 3단계</b>로 나눠 ★★★부터 외운다. 개념이 막히면 6 · 7 · 9주 탭의 정리로.',
  sections: [
{ id: 'fn.guide', title: '기말 공부 지도', slides: '기말 필기 · 용어표 Week5-9',
  blocks: [
    T(['범위', 'OX 예상문제', '약어 ★★★', '약어 ★★', '약어 ★', 'OX에 나온 약어', '정리 탭'], WEEKS.map(w => [WL[w], `${cnt(FOX, r => r[3] === w)}문항`, cnt(FA, a => a[2][0] === w && a[3] === 3), cnt(FA, a => a[2][0] === w && a[3] === 2), cnt(FA, a => a[2][0] === w && a[3] === 1), cnt(FA, a => a[2][0] === w && a[5].length), `${w.slice(1)}주 탭`]).concat([['<b>합계</b>', '<b>100</b>', `<b>${cnt(FA, a => a[3] === 3)}</b>`, cnt(FA, a => a[3] === 2), cnt(FA, a => a[3] === 1), `<b>${cnt(FA, a => a[5].length)}</b>`, '']])),
    H.key(`<b>약어 중요도 기준</b><br>★★★ 핵심 (${cnt(FA, a => a[3] === 3)}개) = 강의의 중심 프로토콜 · 보안 · 클라우드 개념 (TLS · JWT · OAuth · XSS · CSRF · IDOR · SSE · MQTT · QoS · LWT · STUN · TURN · VPC · NAT · SG · NACL …)<br>★★ 중요 (${cnt(FA, a => a[3] === 2)}개) = 설명에 함께 나오는 약어 · MQTT 패킷 이름 · OX 문장에 나온 약어<br>★ 참고 (${cnt(FA, a => a[3] === 1)}개) = 제품 · 도구 이름과 일반 약어<br>용어표 부록에 없던 약어 중 용어 설명에 나온 것(ETag · SHA-256 · CONNACK · PUBACK · PUBREC …)도 추가했다.`),
    `<ol><li><b>OX 100</b>(F.2)을 번호순으로 한 바퀴. 틀린 것만 다시 돌려서 0개가 될 때까지. 해설은 예상문제 파일의 원문이고, 문장에 나온 약어의 원래 이름도 함께 보인다.</li><li><b>정답표</b>(F.3)로 O/X만 빠르게 훑는다 — “정답 X만” 보기로 함정 문장을 모아 보면 좋다.</li><li><b>약어</b>(F.4) — ★★★만 켜고 “외우기”로 익힌 뒤 “쓰기 시험”으로 확인. “OX에 나온 약어만”으로 좁힐 수도 있다.</li><li><b>모의시험</b>(F.5)으로 섞어서 확인. 결과는 유형별 · 주차별로.</li></ol>`,

  ] },
{ id: 'fn.ox', title: '기말 OX 예상문제 100', slides: '네트워크__기말_OX100.xlsx', tag: '그대로 출제', blocks: [{ mount: mountOXF }] },
{ id: 'fn.key', title: 'OX 100 정답표', slides: 'O 50 · X 50', tag: '정답', blocks: [{ mount: mountKeyF }] },
{ id: 'fn.abbr', title: '약어 → 원래 이름 (중요도순)', slides: '용어표 Week5 · 6 · 7 · 9', tag: '용어', blocks: [{ mount: mountAbbrF }] },
{ id: 'fn.exam', title: '기말 모의시험', slides: 'OX + 약어', tag: '실전', blocks: [{ mount: mountExamF }] },

<script>
/* app.js — week pages, table of contents, routing (#w2, #w2-and), D-day */
'use strict';
(function () {
  const $ = id => document.getElementById(id);
  const anchor = id => id.replace(/\./g, '-');
  const secIndex = {};
  COURSE.weeks.forEach(w => w.sections.forEach((s, i) => { secIndex[s.id] = { w, s, i }; }));
  let curWeek = null, obs = null;

  function tabs() {
    $('tabs').innerHTML = COURSE.weeks.map(w => `<a href="#${w.id}" data-w="${w.id}">${w.short}</a>`).join('');
  }
  function renderWeek(w) {
    curWeek = w;
    document.querySelectorAll('#tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.w === w.id ? 'page' : 'false'));
    const main = $('main'); main.innerHTML = '';
    const head = document.createElement('div'); head.className = 'wk-head';
    head.innerHTML = `<div class="eb">${w.short}${w.range ? ' · 강의 ' + w.range : ''}</div><h1>${w.title}</h1>${w.lead ? `<p>${w.lead}</p>` : ''}`;
    main.appendChild(head);
    const sel = document.createElement('select'); sel.className = 'tocsel'; sel.setAttribute('aria-label', '섹션 이동');
    sel.innerHTML = w.sections.map((s, i) => `<option value="${s.id}">${w.num}.${i + 1} ${s.title.replace(/<[^>]+>/g, '')}</option>`).join('');
    sel.onchange = () => goto(sel.value);
    main.appendChild(sel);
    $('toc').innerHTML = `<h4>${w.short} · ${w.title}</h4>` + w.sections.map((s, i) => `<a href="#${anchor(s.id)}" data-id="${s.id}"><span class="n">${w.num}.${i + 1}</span><span>${s.title}</span>${s.tag ? `<span class="tg">${s.tag}</span>` : ''}</a>`).join('');
    w.sections.forEach((s, i) => {
      const sec = document.createElement('section'); sec.className = 'sec'; sec.id = anchor(s.id); sec.dataset.id = s.id;
      sec.innerHTML = `<header><span class="num">${w.num}.${i + 1}</span><h2>${s.title}</h2>${s.slides ? `<span class="sl">${w.id === 'ex' ? '' : '강의 '}${s.slides}</span>` : ''}</header>`;
      main.appendChild(sec);
      (s.blocks || []).forEach(b => mountBlock(sec, b));
    });
    const nav = document.createElement('div'); nav.style.cssText = 'display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:8px';
    const wi = COURSE.weeks.indexOf(w);
    nav.innerHTML = (wi > 0 ? `<a class="btn" href="#${COURSE.weeks[wi - 1].id}">◀ ${COURSE.weeks[wi - 1].short}</a>` : '<span></span>') + (wi < COURSE.weeks.length - 1 ? `<a class="btn pri" href="#${COURSE.weeks[wi + 1].id}" style="text-decoration:none">${COURSE.weeks[wi + 1].short} ▶</a>` : '');
    nav.querySelectorAll('a').forEach(a => a.style.textDecoration = 'none');
    main.appendChild(nav);
    main.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => goto(b.dataset.goto));
    // active section
    if (obs) obs.disconnect();
    obs = new IntersectionObserver(ents => {
      ents.forEach(en => { if (en.isIntersecting) { const id = en.target.dataset.id; document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('on', a.dataset.id === id)); sel.value = id; const on = document.querySelector('#toc a.on'); if (on) on.scrollIntoView({ block: 'nearest' }); LS.set('last', id); } });
    }, { rootMargin: '-70px 0px -65% 0px' });
    main.querySelectorAll('section.sec').forEach(s => obs.observe(s));
  }
  function mountBlock(sec, b) {
    if (typeof b === 'string') { const d = document.createElement('div'); d.className = /^<div class="tw">/.test(b) ? 'prose wide' : 'prose'; d.innerHTML = b; sec.appendChild(d); return; }
    if (b.h3) { const h = document.createElement('h3'); h.className = 'sub'; h.innerHTML = b.h3; sec.appendChild(h); return; }
    if (b.trace) { mountTrace(sec, typeof b.trace === 'function' ? b.trace() : b.trace); return; }
    if (b.lab) { mountLab(sec, b.lab); return; }
    if (b.qc) { mountQC(sec, b.qc); return; }
    if (b.prac) { mountPractice(sec, b.prac); return; }
    if (b.fig) { const d = document.createElement('div'); d.className = 'fig'; sec.appendChild(d); if (typeof b.fig === 'function') b.fig(d); else d.innerHTML = b.fig; if (b.cap) d.insertAdjacentHTML('beforeend', `<div class="cap">${b.cap}</div>`); return; }
    if (b.mount) { const d = document.createElement('div'); sec.appendChild(d); b.mount(d); return; }
  }
  /* history/hash can be blocked when the page runs inside a sandboxed frame (artifact preview) — never let that break navigation */
  function setHash(h) { try { history.replaceState(null, '', '#' + h); } catch (e) { } }
  function readHash() { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; } }
  function showWeek(w) { renderWeek(w); window.scrollTo(0, 0); setHash(w.id); LS.set('last', w.sections[0].id); }
  function goto(id) {
    const info = secIndex[id];
    if (!info) { const w = COURSE.weeks.find(x => x.id === id); if (w) showWeek(w); return; }
    if (curWeek !== info.w) renderWeek(info.w);
    setHash(anchor(id));
    const el = document.getElementById(anchor(id));
    if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
  }
  function route(h) {
    if (h == null) h = readHash();
    const w = COURSE.weeks.find(x => x.id === h);
    if (w) { showWeek(w); return; }
    const id = h.replace('-', '.');
    if (secIndex[id]) { goto(id); return; }
    const last = LS.get('last', null);
    if (last && secIndex[last]) { goto(last); return; }
    renderWeek(COURSE.weeks[0]);
  }
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#"]'); if (!a) return;
    e.preventDefault(); route(a.getAttribute('href').slice(1));
  });
  window.APP = { goto };
  tabs();
  window.addEventListener('hashchange', () => route());
  route();
  (function () {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const d = (m, dd) => Math.round((new Date(2026, m - 1, dd) - t) / 864e5);
    const q = d(10, 19), m = d(11, 3); const parts = [];
    if (q >= 0) parts.push(`퀴즈 ${q ? 'D-' + q : 'D-day'}`); if (m >= 0) parts.push(`중간 ${m ? 'D-' + m : 'D-day'}`);
    $('dday').textContent = parts.join(' · '); $('dday').hidden = !parts.length;
  })();
})();

</script>
