/* ===== OX 퀴즈 ===== */
(function(){
const UN={1:'기초',2:'주소와 길',3:'전송',4:'웹 요청'},KEY='nj.ox.wrong';
const q$=id=>document.getElementById(id);
let wrong=new Set();try{wrong=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...wrong]));}catch(e){}};
const S={units:new Set([1,2,3,4]),mode:'r100',list:[],i:0,ok:0,bad:[],answered:false,screen:'setup',onMap:false};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function pool(mode){const ids=QZ.map((q,i)=>i).filter(i=>S.units.has(QZ[i][0]));
  if(mode==='qc')return ids.filter(i=>QZ[i][1]);if(mode==='wrong')return ids.filter(i=>wrong.has(i));return ids;}
function tag(q){return '<span class="qzU">'+q[0]+' '+UN[q[0]]+'</span>'+(q[1]?'<span class="qzQ">퀵체크 '+q[1]+'</span>':'');}
function setup(){S.screen='setup';const n={r100:Math.min(100,pool('r100').length),qc:pool('qc').length,wrong:pool('wrong').length};
  q$('qzBody').innerHTML='<div class="qzH">OX 퀴즈 <small>전체 '+QZ.length+'문제</small></div>'+
  '<div class="qzL">단원</div><div class="qzChips">'+[1,2,3,4].map(u=>'<button class="qzC'+(S.units.has(u)?' on':'')+'" data-u="'+u+'">'+u+' '+UN[u]+' <small>'+QZ.filter(q=>q[0]===u).length+'</small></button>').join('')+'</div>'+
  '<div class="qzL">풀 방식</div><div class="qzChips">'+[['r100','100문제 풀기'],['qc','퀵체크만'],['wrong','오답노트만']].map(([k,t])=>'<button class="qzC'+(S.mode===k?' on':'')+'" data-m="'+k+'">'+t+' <small>'+n[k]+'</small></button>').join('')+'</div>'+
  '<p class="qzNote">'+(S.mode==='r100'?'고른 단원에서 무작위로 '+n.r100+'문제를 뽑아요.':S.mode==='qc'?'각 단원의 Quick Check 문항만 풀어요.':'틀렸던 문제만 다시 풀어요. 맞히면 오답노트에서 빠져요.')+'</p>'+
  '<div class="qzRow"><button class="btn pri" id="qzGo"'+(n[S.mode]?'':' disabled')+'>시작하기 ▶</button><button class="btn" id="qzNb">오답노트 보기 ('+wrong.size+')</button></div>';
  q$('qzBody').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=+b.dataset.u;if(S.units.has(u)){if(S.units.size>1)S.units.delete(u);}else S.units.add(u);setup();});
  q$('qzBody').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;setup();});
  q$('qzGo').onclick=()=>{let l=shuf(pool(S.mode));if(S.mode==='r100')l=l.slice(0,100);start(l);};
  q$('qzNb').onclick=notebook;}
/* 타이머: 퀴즈 창이 열려 있는 동안만 흐름 (맵 보기·닫기 중엔 멈춤) */
const T={acc:0,t0:null,iv:null};
const el=()=>T.acc+(T.t0?Date.now()-T.t0:0);
const fmt=ms=>{const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t/60)%60,x=t%60,p=n=>String(n).padStart(2,'0');return (h?h+':'+p(m):p(m))+':'+p(x);};
function tick(){const e=q$('qzT');if(e)e.textContent='⏱ '+fmt(el());}
function tRun(){if(T.t0)return;T.t0=Date.now();clearInterval(T.iv);T.iv=setInterval(tick,500);tick();}
function tStop(){if(T.t0){T.acc+=Date.now()-T.t0;T.t0=null;}clearInterval(T.iv);tick();}
function start(l){Object.assign(S,{list:l,i:0,ok:0,bad:[],ans:[],answered:false});T.acc=0;T.t0=null;show();tRun();}
const prevBtn=()=>S.i>0?'<button class="btn" id="qzPv">◀ 이전 문제</button>':'';
function show(){S.screen='play';const q=QZ[S.list[S.i]],done=S.ans[S.i]!=null;S.answered=done;
  q$('qzBody').innerHTML='<div class="qzTop">'+tag(q)+'<span class="qzP"></span><span class="qzT" id="qzT"></span></div>'+
  '<div class="qzBarO"><i style="width:'+(S.ans.filter(x=>x!=null).length/S.list.length*100)+'%"></i></div>'+
  '<div class="qzS">'+esc(q[3])+'</div>'+
  '<div class="qzOX"><button class="qzB o" data-a="1">O<small>맞다</small></button><button class="qzB x" data-a="0">X<small>틀리다</small></button></div>'+
  '<div id="qzF">'+(done?'':'<div class="qzRow">'+prevBtn()+'</div>')+'</div>';
  q$('qzBody').querySelectorAll('.qzB').forEach(b=>b.onclick=()=>answer(+b.dataset.a));
  if(done)feedback();else bindPrev();prog();tick();}
function prog(){q$('qzBody').querySelector('.qzP').textContent=(S.i+1)+' / '+S.list.length+' · 맞힘 '+S.ok;}
function bindPrev(){const p=q$('qzPv');if(p)p.onclick=prevQ;}
function answer(a){if(S.answered)return;S.answered=true;S.ans[S.i]=a;const id=S.list[S.i],q=QZ[id],ok=a===q[2];
  if(ok){S.ok++;if(S.mode==='wrong')wrong.delete(id);}else{S.bad.push(id);wrong.add(id);}save();
  q$('qzBody').querySelector('.qzBarO i').style.width=(S.ans.filter(x=>x!=null).length/S.list.length*100)+'%';
  feedback();prog();}
function feedback(){const a=S.ans[S.i],q=QZ[S.list[S.i]],ok=a===q[2];
  q$('qzBody').querySelectorAll('.qzB').forEach(b=>{b.disabled=true;const v=+b.dataset.a;if(v===q[2])b.classList.add('ans');if(v===a&&!ok)b.classList.add('no');});
  const loc=q[5],ep=loc?+loc.split('.')[0]:-1;
  q$('qzF').innerHTML='<div class="qzFb '+(ok?'ok':'ng')+'"><b>'+(ok?'정답이에요!':'아쉬워요. 정답은 '+(q[2]?'O':'X')+'예요.')+'</b><p>'+esc(q[4])+'</p></div>'+
  '<div class="qzRow">'+prevBtn()+(loc?'<button class="btn" id="qzMap">맵에서 보기 · Ep. '+ep+' '+esc(ST[ep].name)+'</button>':'')+
  '<button class="btn pri" id="qzNx">'+(S.i<S.list.length-1?'다음 문제 ▶':'결과 보기 ▶')+'</button></div>';
  q$('qzNx').onclick=nextQ;if(loc)q$('qzMap').onclick=()=>toMap(loc);bindPrev();}
function prevQ(){if(S.i>0){S.i--;show();}}
function nextQ(){if(!S.answered)return;if(S.i<S.list.length-1){S.i++;show();}else result();}
function result(){S.screen='result';tStop();const tm=T.acc,n=S.ans.filter(x=>x!=null).length,pc=n?Math.round(S.ok/n*100):0;
  q$('qzBody').innerHTML='<div class="qzH">결과</div><div class="qzScore"><b>'+S.ok+'</b> / '+n+'<small>'+pc+'%</small></div>'+
  '<div class="qzTime"><span>⏱ 걸린 시간 <b>'+fmt(tm)+'</b></span><span>문제당 평균 <b>'+(n?(tm/n/1000).toFixed(1):'0')+'초</b></span></div>'+
  (S.bad.length?'<div class="qzL">이번에 틀린 문제 '+S.bad.length+'개</div><div class="qzList">'+S.bad.map(i=>item(i,false)).join('')+'</div>':'<p class="qzNote">이번에 푼 문제는 모두 맞혔어요.</p>')+
  '<div class="qzRow">'+(S.bad.length?'<button class="btn pri" id="qzRe">틀린 문제 다시 풀기</button>':'')+'<button class="btn" id="qzHome">처음으로</button></div>';
  if(S.bad.length)q$('qzRe').onclick=()=>{S.mode='wrong';start(shuf(S.bad.slice()));};
  q$('qzHome').onclick=setup;bindItems();}
function item(i,rm){const q=QZ[i];return '<div class="qzI"><div class="qzIt">'+tag(q)+'<b class="'+(q[2]?'o':'x')+'">'+(q[2]?'O':'X')+'</b></div><p>'+esc(q[3])+'</p><p class="qzE">'+esc(q[4])+'</p><div class="qzRow sm">'+
  (q[5]?'<button class="btn" data-map="'+q[5]+'">맵에서 보기 · Ep. '+q[5].split('.')[0]+'</button>':'')+(rm?'<button class="btn" data-rm="'+i+'">오답노트에서 빼기</button>':'')+'</div></div>';}
function bindItems(){q$('qzBody').querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>toMap(b.dataset.map));
  q$('qzBody').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{wrong.delete(+b.dataset.rm);save();notebook();});}
function notebook(){S.screen='nb';const ids=[...wrong].filter(i=>QZ[i]).sort((a,b)=>a-b);
  q$('qzBody').innerHTML='<div class="qzH">오답노트 <small>'+ids.length+'문제</small></div>'+
  (ids.length?'<div class="qzList">'+ids.map(i=>item(i,true)).join('')+'</div>':'<p class="qzNote">아직 틀린 문제가 없어요.</p>')+
  '<div class="qzRow"><button class="btn" id="qzHome">처음으로</button>'+(ids.length?'<button class="btn" id="qzClr">오답노트 비우기</button><span id="qzCf"></span>':'')+'</div>';
  q$('qzHome').onclick=setup;bindItems();
  if(ids.length)q$('qzClr').onclick=()=>{q$('qzCf').innerHTML='정말 비울까요? <button class="btn pri" id="qzY">비우기</button> <button class="btn" id="qzN">취소</button>';
    q$('qzY').onclick=()=>{wrong.clear();save();notebook();};q$('qzN').onclick=()=>{q$('qzCf').innerHTML='';};};}
function open(){const wasMap=S.onMap;MS=null;q$('qz').classList.add('on');q$('qzBack').classList.remove('on');q$('qzOpen').textContent='OX 퀴즈';S.onMap=false;
  if(auto){auto=false;clearTimeout(autoTimer);setBar();}
  if(wasMap)setBar();if(S.screen==='setup')setup();if(S.screen==='play')tRun();}
function close(){q$('qz').classList.remove('on');tStop();}
let MS=null;/* 맵 설명 구간 {e,b0,b1} */
const plain=h=>String(h||'').replace(/<[^>]+>/g,'').trim();
function span(loc){let [e,b]=loc.split('.');e=+e;const r=b.split('-').map(Number);let b0=Math.min(r[0]||0,BEATS[e].length-1),b1=r.length>1?Math.min(r[1],BEATS[e].length-1):b0;
  /* "~볼게요." 같은 예고로 끝나면 다음 설명(보통 직접 해 보기)까지 포함 */
  while(r.length<2&&b1<BEATS[e].length-1&&!BEATS[e][b1].btn&&/(볼게요\.|볼까요\?|\?)$/.test(plain(BEATS[e][b1].s)))b1++;
  return {e,b0,b1};}
function inSpan(){return MS&&cur===MS.e&&beat>=MS.b0&&beat<=MS.b1;}
function backLabel(){const p=S.screen==='play'?' <small>'+(S.i+1)+' / '+S.list.length+'</small>':'';
  q$('qzBack').innerHTML='◀ 퀴즈로 돌아가기'+p+(inSpan()&&MS.b1>MS.b0?' <small>· 설명 '+(beat-MS.b0+1)+' / '+(MS.b1-MS.b0+1)+'</small>':'');}
function toMap(loc){MS=span(loc);close();S.onMap=true;
  q$('qzBack').classList.add('on');q$('qzOpen').textContent='◀ 퀴즈로';go(MS.e,false,MS.b0);backLabel();}
/* 구간의 마지막 설명에서 '다음'을 누르면 퀴즈로 복귀 */
const _next=next;next=function(){if(S.onMap&&inSpan()&&beat===MS.b1&&!gateRes&&!simActive){open();return;}_next();};
const _setBar=setBar;setBar=function(){_setBar();if(!S.onMap)return;
  if(!inSpan()){MS=null;}else if(beat===MS.b1&&!gateRes&&!simActive){const nb=document.getElementById('bNext');nb.textContent='다 봤어요 · 퀴즈로 ▶';nb.disabled=false;}
  backLabel();};
q$('qzOpen').onclick=()=>q$('qz').classList.contains('on')?close():open();
q$('qzX').onclick=close;q$('qzBack').onclick=open;
q$('qz').addEventListener('click',e=>{if(e.target.id==='qz')close();});
window.addEventListener('keydown',e=>{if(!q$('qz').classList.contains('on'))return;
  const k=e.key;if(k==='Escape'){close();e.preventDefault();e.stopImmediatePropagation();return;}
  if(['ArrowRight','ArrowLeft',' '].includes(k)){e.stopImmediatePropagation();if(k===' ')e.preventDefault();}
  if(S.screen!=='play')return;
  if(!S.answered){if('oO1ㅐ'.includes(k)&&k.length===1)answer(1);else if('xX2ㅌ'.includes(k)&&k.length===1)answer(0);}
  else if(k==='Enter'||k==='ArrowRight'){e.preventDefault();nextQ();}
  if(k==='ArrowLeft'){e.preventDefault();prevQ();}},true);
setup();
})();

</script>
</body>
