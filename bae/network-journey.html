:root{
  --bg:#F5F0E6;--bg2:#FBF8F2;--bg3:#FFFDF8;--bg4:#F3EBDD;
  --bd:#E6DCCB;--bd2:#D3C3AA;
  --tx:#3D2B1F;--tx2:#7A6450;--tx3:#A08A72;
  --or:#D97757;--orD:#9A3F1E;--orL:#FBE9DF;--teal:#2F8F7A;--amber:#C98A1E;
  --font:'Galmuri11',system-ui,sans-serif;
  --mono:'GalmuriMono11','Galmuri11',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.7;overflow:hidden}
header{height:64px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.brand{white-space:nowrap}
.brand b{display:block;font-size:15px;line-height:1.3}
.brand span{font-size:12px;color:var(--tx3)}
nav{display:flex;gap:5px;overflow-x:auto;flex:1;padding:4px 0;scrollbar-width:none}
nav button{flex:none;display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--bd);color:var(--tx2);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--tx3)}
nav button:hover{border-color:var(--bd2);color:var(--tx)}
nav button.on{background:var(--or);border-color:var(--or);color:#FFF8F0}
nav button.on i{color:#FFE3D4}
nav .sep{flex:none;color:var(--bd2);font-size:11px;align-self:center}
main{display:block;height:calc(100% - 64px)}
.stage{height:100%}
#ptr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#ptr .tip{animation:tipP 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tipP{50%{transform:scale(1.35)}}
.guide{position:absolute;left:40px;top:70px;width:0;height:0;transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:8}
.guide svg{position:absolute;left:-3px;top:-3px;overflow:visible;transform-origin:3px 3px;transition:transform .35s;filter:drop-shadow(2px 3px 2px rgba(61,43,31,.28))}
.guide.o1 svg{transform:scaleX(-1)}.guide.o2 svg{transform:scaleY(-1)}.guide.o3 svg{transform:scale(-1,-1)}
.guide .ring{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--or);opacity:0}
.guide.click .ring{animation:ring .9s ease-out}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.8);opacity:0}}
.guide.idle svg{animation:wig 2.6s ease-in-out infinite}
@keyframes wig{50%{translate:3px 3px}}
.bub{position:absolute;left:110px;top:60px;width:360px;background:#FFFDF8;border:2px solid var(--or);border-radius:14px;padding:11px 15px;font-size:15px;line-height:1.65;color:var(--tx);transition:left .8s cubic-bezier(.4,0,.2,1),top .8s cubic-bezier(.4,0,.2,1);z-index:6;box-shadow:0 6px 18px rgba(61,43,31,.12)}
.bub b{font-weight:500;color:var(--orD)}
.bub .gap{display:block;height:.6em}
.bub .ghint{display:block;margin-top:6px;font-size:13px;color:var(--tx2)}
.btn.pulse{animation:bp 1.2s ease-in-out infinite}@keyframes bp{50%{box-shadow:0 0 0 5px rgba(217,119,87,.28)}}
.bar{position:absolute;left:12px;right:12px;bottom:10px;min-height:56px;display:flex;align-items:center;gap:7px;padding:8px 10px;background:rgba(251,248,242,.95);border:1px solid var(--bd);border-radius:12px;z-index:7;overflow-x:auto}
.bar .bpos{font-family:var(--mono);font-size:12.5px;color:var(--tx2);min-width:46px;text-align:center}
.bar .sep{width:1px;align-self:stretch;background:var(--bd);margin:0 4px}
.bar .simLab{font-size:12px;color:var(--tx3);white-space:nowrap}
.simBtns{display:flex;gap:6px;flex-wrap:nowrap}
button.btn.sm{font-size:12.5px;padding:6px 10px;white-space:nowrap}
#bAuto.on{background:var(--orL);border-color:var(--or);color:var(--orD)}
.scope span{color:var(--tx3)}
.gp{position:absolute;left:16px;top:56px;width:320px;background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;padding:8px 10px;display:none;z-index:4}
.gpT{font-size:12px;color:var(--tx2)}

.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#FDF9F1 0%,#F2EADC 78%)}
#sv{width:100%;height:100%;display:block;user-select:none}
#sv text{font-family:var(--font)}
#sv .mono{font-family:var(--mono)}
#sv text{paint-order:stroke fill;stroke:#FBF6EC;stroke-width:.3em;stroke-linejoin:round}
#sv text.nohalo{stroke:none}
.cap{position:absolute;left:215px;right:165px;bottom:12px;margin:0 auto;width:fit-content;max-width:calc(100% - 380px);background:rgba(61,43,31,.9);color:#FFF8F0;font-size:14.5px;line-height:1.55;padding:9px 16px;border-radius:10px;display:none;text-align:center;pointer-events:none}
.cap.show{display:block}
.ns{vector-effect:non-scaling-stroke}
#sv.hiSend .mssMark{opacity:.15}
#sv.hiMss .sendMark{opacity:.15}
.scope{position:absolute;left:16px;top:14px;font-size:13px;color:var(--tx2);background:rgba(255,253,248,.92);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;pointer-events:none}
.scope b{color:var(--tx);font-weight:500}
.hud{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;align-items:center;padding:6px;border-radius:12px;background:rgba(251,248,242,.9);border:1px solid var(--bd)}
.hint{position:absolute;right:16px;bottom:20px;font-size:12px;color:var(--tx3);pointer-events:none;background:rgba(251,248,242,.9);padding:3px 8px;border-radius:6px}
button.btn{background:var(--bg3);border:1px solid var(--bd2);color:var(--tx);font:inherit;font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;line-height:1.3}
button.btn:hover{border-color:var(--or)}
button.btn:disabled{opacity:.4;cursor:default}
button.btn.pri{background:var(--or);border-color:var(--or);color:#FFF8F0}
button.btn.pri:hover{background:#C9663F}
/* header card */
#rcol{position:absolute;right:16px;top:14px;width:350px;display:flex;flex-direction:column;gap:8px;z-index:4;max-height:calc(100% - 110px)}
.hc{position:relative;width:100%;flex:0 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;overflow:hidden}
.hcBtn{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:none;font:inherit;font-size:13px;color:var(--tx);padding:8px 12px;cursor:pointer;text-align:left}
.hcBtn b{font-weight:500}
.hcBtn .cnt{font-family:var(--mono);font-size:12px;color:var(--or)}
.hcBtn .chev{margin-left:auto;color:var(--tx3);transition:transform .25s}
.hc.open .chev{transform:rotate(180deg)}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--or);color:#FFF8F0;display:none}
.pill.show{display:inline-block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.hcBody{display:none;padding:2px 12px 12px;border-top:1px solid var(--bd)}
.hc.open .hcBody{display:block}
.hc .hcBody{overflow-y:auto;min-height:0}
.hcBtn{flex:none}
.lg{max-height:100%;display:flex;flex-direction:column;flex:0 1 auto;min-height:0}
.lg .hcBody{overflow-y:auto;min-height:0}
.lg.open .hcBody{display:block}
.lgI{padding:7px 0;border-bottom:1px solid var(--bd);font-size:12.5px;line-height:1.55;color:var(--tx2)}
.lgI:last-child{border-bottom:none}
.lgI b{color:var(--tx);font-weight:600;margin-right:6px}
.lgI.new b{color:var(--orD)}
.lgI.new b::after{content:'NEW';font-size:9.5px;font-weight:600;color:#FFF8F0;background:var(--or);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px}
.spd{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12.5px;color:var(--tx2);flex:none;padding-left:8px}
.spd input{width:90px;accent-color:#D97757}
.spd b{font-family:var(--mono);color:var(--orD);min-width:22px}
.hgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px}
.hf{border:1px dashed #D9CBB4;border-radius:6px;padding:4px 7px;min-height:44px;background:var(--bg4);transition:all .3s}
.hf .n{font-size:10.5px;color:var(--tx3);line-height:1.3}
.hf .v{font-family:var(--mono);font-size:12.5px;color:#B9A78F;line-height:1.5}
.hf .m{display:none;font-size:10.5px;color:var(--tx2);line-height:1.35}
.hf.on{border:1px solid #E8B9A3;background:var(--orL)}
.hf.on .n{color:#A9573A}.hf.on .v{color:var(--tx)}.hf.on .m{display:block}
.hf.new{border:2px solid var(--or);background:#F9D9C8}
.hf.new .v{color:#7A3115}
.hcNote{font-size:12px;color:var(--tx2);margin-top:8px;line-height:1.55}
.udp{display:none;margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd2)}

body.dtOn #dtDim{opacity:1}
body.dtOn #tl{z-index:6}
.dt{position:absolute;top:50px;right:8px;bottom:84px;width:min(820px,calc(100% - 430px));min-width:520px;z-index:5;background:#282828;color:#E3E3E3;
  font:12px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Apple SD Gothic Neo",sans-serif;border:1px solid #4A4A4A;border-radius:6px;box-shadow:0 10px 32px rgba(0,0,0,.35);
  display:flex;flex-direction:column;overflow:hidden;transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .3s;-webkit-font-smoothing:antialiased}
.dt.out{transform:translateX(calc(100% + 40px))!important;opacity:0;pointer-events:none}
.dt.peek,.dt.now{transition:none}
.dt svg{width:15px;height:15px;display:block}
.dtEdge{position:absolute;left:0;top:0;bottom:0;width:6px;z-index:2}
.dt .sep{width:1px;align-self:stretch;background:#4A4A4A;margin:4px 3px}
.dt .ib{display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:#C4C7C5;border-radius:4px}
.dtTabs{display:flex;align-items:center;gap:2px;height:34px;padding:0 6px;border-bottom:1px solid #4A4A4A;flex:none;white-space:nowrap}
.dtTabs>span:not(.ib):not(.sep):not(.sp){padding:0 9px;height:34px;line-height:34px;color:#C4C7C5;font-size:12.5px}
.dtTabs .on{color:#7CACF8!important;box-shadow:inset 0 -2px 0 #7CACF8}
.dtTabs .sp{flex:1}.dtTabs .err{color:#F28B82!important;font-size:11.5px!important}
.dtTool{display:flex;align-items:center;gap:4px;height:32px;padding:0 6px;border-bottom:1px solid #4A4A4A;flex:none;white-space:nowrap;overflow:hidden}
.dt label{display:flex;align-items:center;gap:5px;color:#E3E3E3;padding:2px 4px;border-radius:3px}
.dt .cb{display:inline-block;width:12px;height:12px;border:1.5px solid #9AA0A6;border-radius:2px}
.dt label.ck .cb{background:#7CACF8;border-color:#7CACF8;position:relative}.dt label.ck .cb::after{content:'';position:absolute;left:3px;top:0;width:3px;height:7px;border:solid #202124;border-width:0 2px 2px 0;transform:rotate(45deg)}
.dt .sel{border:1px solid #5F6368;border-radius:4px;padding:1px 8px;margin:0 4px;color:#E3E3E3}
.dtFil{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px;flex:none}
.dtFil .in{flex:1;display:flex;align-items:center;gap:6px;height:24px;background:#3C3C3C;border-radius:12px;padding:0 10px;color:#9AA0A6}
.dtChips{display:flex;gap:5px;padding:2px 6px 6px;flex:none;flex-wrap:nowrap;overflow:hidden;border-bottom:1px solid #4A4A4A}
.dtChips span{border:1px solid #5F6368;border-radius:6px;padding:0 7px;line-height:20px;color:#E3E3E3;white-space:nowrap}
.dtChips .on{background:#0B57D0;border-color:#0B57D0;color:#fff}
.dtOv{position:relative;height:62px;flex:none;border-bottom:1px solid #4A4A4A;background:linear-gradient(90deg,transparent calc(18.5% - 1px),#3A3A3A 0,transparent calc(18.5% + 1px)) 0 0/18.5% 100% repeat-x}
.dtOv span{position:absolute;top:2px;transform:translateX(-100%);padding-right:4px;color:#C4C7C5;font-size:11px}
.dtOv i{position:absolute;height:3px;background:#1A73E8;border-radius:1px}
.dtMain{flex:1;display:flex;min-height:0}
.dtList{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.dtMain.sel .dtList{flex:0 0 30%;border-right:1px solid #4A4A4A}
.dtT{width:100%;border-collapse:collapse;table-layout:fixed}
.dtT th{font-weight:400;text-align:left;padding:4px 6px;border-bottom:1px solid #4A4A4A;border-right:1px solid #4A4A4A;color:#E3E3E3;background:#282828;white-space:nowrap}
.dtT td{padding:3px 6px;border-right:1px solid #3A3A3A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:23px}
.dtT tbody tr:nth-child(even):not(.fill) td{background:#2E2E2E}
.dtT tr.on td{background:#0E3A5C!important}
.dtT .cN{width:30%}.dtT .cS{width:9%}.dtT .cTy{width:12%}.dtT .cI{width:13%}.dtT .cSz{width:13%}.dtT .cTm{width:9%}
.dtMain.sel .dtT .cN{width:100%}
.dtT td.cN span{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis}
.dtT td.cN svg{flex:none;width:14px;height:14px}
.dtT td.lnk{color:#7CACF8;text-decoration:underline;text-decoration-color:#4A6A9A}
.dtT td.dim{color:#9AA0A6}
.dtT td.cW{position:relative}.dtT td.cW i{position:absolute;top:8px;height:7px;background:#1A73E8;border-radius:1px}
.dtT tr.fill td{height:auto}
.dtT tr.ap{animation:dtIn .3s both}
@keyframes dtIn{from{opacity:0;transform:translateY(-4px)}}
.dtEmpty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 30px;gap:8px}
.dtEmpty b{font-size:15px;font-weight:600}.dtEmpty p{color:#C4C7C5;max-width:330px}.dtEmpty u{color:#7CACF8}
.dtPill{background:#0B57D0;color:#fff;border:0;border-radius:16px;padding:6px 16px;font:inherit;font-size:12.5px;font-weight:500}
.dtStat{height:24px;line-height:24px;padding:0 8px;border-top:1px solid #4A4A4A;color:#C4C7C5;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.dtDet{flex:1;display:flex;flex-direction:column;min-width:0}
.dtDT{display:flex;align-items:center;height:30px;border-bottom:1px solid #4A4A4A;padding:0 4px;white-space:nowrap;overflow:hidden;flex:none}
.dtDT span{padding:0 8px;line-height:30px;color:#C4C7C5}.dtDT span.x{padding:0 4px;display:flex}.dtDT span.on{color:#7CACF8;box-shadow:inset 0 -2px 0 #7CACF8}
.dtDB{flex:1;overflow:hidden;padding:4px 0}
.dtSec{padding:2px 0 6px;border-bottom:1px solid #3A3A3A}
.dtSH{font-weight:600;padding:5px 10px;display:flex;gap:10px}.dtSH .raw{font-weight:400;color:#9AA0A6;margin-left:auto}
.dtKV{display:flex;gap:10px;padding:1px 10px 1px 24px}
.dtKV .k{flex:0 0 34%;color:#C4C7C5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtKV .v{flex:1;color:#E3E3E3;word-break:break-all;font-family:Menlo,Consolas,monospace;font-size:11.5px}
.dtKV .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#81C995;margin-right:6px;vertical-align:-1px}
.dtTq{padding:6px 12px;color:#C4C7C5}
.dtTT{width:100%;border-collapse:collapse;table-layout:fixed}
.dtTT td{padding:4px 8px}.dtTT tr.sh td{color:#9AA0A6;font-size:11px;padding-top:10px}
.dtTT .tn{width:42%;color:#E3E3E3}.dtTT .tdur{width:84px;text-align:right;color:#C4C7C5;white-space:nowrap}
.dtTT .tb{position:relative}.dtTT .tb i{position:absolute;top:50%;height:10px;margin-top:-5px;border-radius:1px}
.dtTT tr.tot td{border-top:1px solid #4A4A4A;padding-top:8px}.dtTT u{color:#7CACF8}
/* 커서가 가리키는 곳 */
.dt .dtHi{outline:2px solid #D97757!important;outline-offset:-1px;box-shadow:0 0 0 4px rgba(217,119,87,.35)!important;background-color:rgba(217,119,87,.14)!important;border-radius:3px}
.dtT th.dtHi{background:rgba(217,119,87,.18)!important}
/* 끙끙 */
#dtGrunt{position:absolute;z-index:9;font-family:'Galmuri14',var(--font);font-size:14px;color:var(--orD);background:#FFFBF2;border:2px solid var(--tx);padding:0 6px;box-shadow:2px 2px 0 var(--tx);display:none;white-space:nowrap;pointer-events:none}
#dtGrunt.on{display:block;animation:grunt .25s steps(2) infinite}
@keyframes grunt{50%{transform:translate(1px,-2px)}}
.guide.strain svg{animation:strain .14s steps(2) infinite}
@keyframes strain{0%{transform:translate(-1px,0) rotate(-4deg)}100%{transform:translate(2px,-1px) rotate(3deg)}}
@media (max-width:1000px){.dt{width:calc(100% - 16px);min-width:0}}
.qzC.ex{border-color:var(--orD)}.qzC.ex:not(.on){color:var(--orD)}
.qzUnits{display:flex;flex-direction:column;gap:5px;margin-top:12px;font-size:12.5px}
.qzUnits div{display:flex;align-items:center;gap:10px}.qzUnits span{flex:0 0 92px;color:var(--tx2)}
.qzUnits i{flex:1;height:10px;border:2px solid var(--tx);background:var(--bg4)}.qzUnits i b{display:block;height:100%;background:var(--or)}
.qzUnits em{flex:0 0 58px;font-style:normal;font-family:var(--mono);text-align:right}
</style>

let SW=900,SH=600;const BOT=84;let TOP=104;const HY=()=>TOP+(SH-BOT-TOP)/2;const cam={x:0,y:0,k:1};let camId=0,camBusy=false;
function tgt(s){const w=frameW(s.f);const k=Math.min(SW/(s.w*w.s),(SH-BOT-TOP)/(s.h*w.s));return {x:w.x+w.s*s.x,y:w.y+w.s*s.y,k:k};}

const refK=()=>Math.min(SW/1000,(SH-BOT-TOP)/600);
function sm(a,b,v){const t=(Math.log(v)-Math.log(a))/(Math.log(b)-Math.log(a));return Math.max(0,Math.min(1,t));}

let SPD=1;
function flyTo(to){
  return new Promise(res=>{
  const from={x:cam.x,y:cam.y,k:cam.k},k0=from.k,k1=to.k;
  const lr=Math.log(k1/k0);let p=null;
  if(Math.abs(lr)>0.05)p={x:(to.x*k1-from.x*k0)/(k1-k0),y:(to.y*k1-from.y*k0)/(k1-k0)};
  const dur=Math.min(3600,900+380*Math.abs(lr)/Math.LN10)/SPD;
  const id=++camId,st=performance.now();camBusy=true;
  (function f(n){if(id!==camId){res();return;}const t=Math.min(1,(n-st)/dur);const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    const k=Math.exp(Math.log(k0)+lr*e);cam.k=k;
    if(p){cam.x=p.x-(p.x-from.x)*k0/k;cam.y=p.y-(p.y-from.y)*k0/k;}else{cam.x=from.x+(to.x-from.x)*e;cam.y=from.y+(to.y-from.y)*e;}
    render();if(t<1)requestAnimationFrame(f);else{Object.assign(cam,to);camBusy=false;render();res();}})(st);});
}

const LEG=[[0, "URL", "scheme://host:port/path?query#fragment. 어디로(host), 무엇을(path·query) 요청할지 적은 주소.", 4], [0, "Fragment (#)", "브라우저 안에서만 쓰는 위치 표시. 서버로 전송되지 않아요.", 4], [0, "퍼센트 인코딩", "URL에 못 쓰는 글자를 %EB%B9%A8 같은 바이트로 바꿔 쓰는 방법.", 4], [1, "IP 주소", "네트워크 인터페이스마다 붙는 논리 주소. IPv4는 32비트(점으로 나눈 0~255 숫자 넷).", 2], [1, "IPv6", "128비트 주소. IPv4 주소(약 43억 개)가 모자라서 나왔어요.", 2], [1, "인터페이스", "네트워크에 연결되는 출입구. Wi-Fi·유선·Loopback·Docker 가상 어댑터가 각자 IP를 가져요.", 2], [1, "localhost · 127.0.0.1", "localhost는 이름, 127.0.0.1은 그 이름이 가리키는 나 자신(Loopback).", 2], [2, "서브넷 마스크", "1인 자리까지가 Network 부분, 0인 자리가 Host 부분이라고 표시하는 32비트.", 2], [2, "CIDR", "마스크를 \"/숫자\"로 줄여 쓰는 표기. /24 = 앞 24비트가 Network.", 2], [2, "Network 주소", "Host 부분이 전부 0인 주소(.0). 방 이름이라 기기에 못 줘요.", 2], [2, "Broadcast 주소", "Host 부분이 전부 1인 주소(.255). 방 전체에 보낼 때 써요.", 2], [2, "서브넷", "큰 네트워크를 칸막이로 나눈 작은 네트워크. 보안·장애 범위의 경계예요.", 2], [3, "DHCP", "IP·마스크·게이트웨이·DNS를 자동으로 나눠 주는 방법. 4단계 DORA.", 2], [3, "임대 시간 (Lease)", "DHCP로 받은 설정을 쓸 수 있는 기간. 지나면 IP가 바뀔 수 있어요.", 2], [4, "AND 판단", "IP AND 마스크 = Network 주소. 두 결과가 같으면 같은 방이에요.", 2], [4, "스위치", "같은 방 안에서 MAC 주소를 보고 전달하는 장비.", 2], [4, "MAC 주소", "랜카드의 물리 주소. \"이 연결에서 바로 다음 장비\"를 가리켜요.", 2], [4, "ARP", "IP로 MAC을 알아내는 방법. 방 전체에 묻고(Broadcast) 주인만 답해요.", 2], [4, "Default Gateway", "다른 방으로 가는 패킷을 넘기는 출입문. 보통 공유기(.1).", 2], [4, "Routing Table", "목적지 범위마다 다음에 보낼 곳(Next Hop)을 적은 표.", 2], [4, "Longest Prefix Match", "여러 줄에 맞으면 가장 구체적인(Prefix가 긴) 줄을 고르는 규칙.", 2], [4, "0.0.0.0/0", "\"모든 주소\". 경로표에서는 다른 줄에 안 맞을 때 쓰는 기본 경로.", 2], [5, "DNS", "이름(api.example.com)을 IP 주소로 바꿔 주는 서버.", 2], [5, "DNS", "이름(www.shop.com)을 IP 주소로 바꿔 주는 분산 전화번호부.", 4], [5, "리졸버 (Resolver)", "손님 대신 DNS 서버들을 돌아다니며 답을 찾아 주는 DNS 서버. 통신사·구글(8.8.8.8) 등이 운영해요.", 4], [5, "Stub Resolver", "OS 안의 작은 DNS 클라이언트. 직접 찾지 않고 리졸버에게 \"끝까지 알아와 줘\"라고 맡겨요.", 4], [5, "hosts 파일", "DNS보다 먼저 보는 로컬 이름표. 개발용으로 쓰거나 악성코드가 노리기도 해요.", 4], [5, "DoH · DoT", "DNS 질문을 HTTPS(443)나 TLS(853)로 암호화해서 보내는 방법.", 4], [6, "재귀 질의", "\"답을 끝까지 찾아서 줘\". 노트북 → 리졸버 구간이에요(rd 플래그).", 4], [6, "반복 질의", "\"모르면 아는 곳을 알려 줘\". 리졸버 → Root → TLD → 권한 서버 구간이에요.", 4], [6, "권한 DNS 서버", "그 도메인의 정답 레코드를 직접 가진 서버(NS 레코드가 가리킴).", 4], [6, "TTL", "레코드를 캐시에 둘 수 있는 시간(초). 짧으면 변경이 빨리 퍼지고 질의가 늘어요.", 4], [6, "NXDOMAIN", "\"그런 이름 없음\". 이 답도 SOA의 negative TTL 동안 캐시돼요(Negative Caching).", 4], [6, "SERVFAIL", "\"이름은 몰라도 답을 못 구했음\". 권한 서버 장애나 DNSSEC 검증 실패 때 나와요.", 4], [6, "dig", "DNS 질의 도구. status · flags · ANSWER · TTL · Query time · SERVER를 읽어요.", 4], [7, "CNAME", "\"이 이름은 저 이름의 별명\". CDN을 붙일 때 www → d123.cdn.net처럼 써요.", 4], [7, "CDN", "전 세계 엣지 서버에 콘텐츠를 복사해 두고 가까운 곳에서 응답하는 서비스.", 4], [7, "GeoDNS", "묻는 리졸버의 위치에 따라 다른 IP를 답하는 DNS.", 4], [7, "Round Robin", "A 레코드 여러 개를 돌려 가며 답해 부하를 나누는 방법.", 4], [7, "DNS Failover", "헬스체크 실패 서버를 답에서 빼는 것. 하지만 TTL 동안은 옛 답이 남아요.", 4], [7, "Anycast", "같은 IP를 여러 곳에서 광고해서 가장 가까운 곳으로 가게 하는 방법(루트 서버·CDN).", 4], [8, "Private IP", "10/8 · 172.16/12 · 192.168/16. 안쪽에서만 쓰고 인터넷에서는 길이 없어요.", 2], [8, "Public IP", "인터넷 전체에서 하나뿐인 주소. ISP·클라우드가 할당해요.", 2], [8, "NAT", "사설 주소를 공인 주소로 바꿔 내보내고, 돌아올 때 되돌리는 것.", 2], [8, "PAT (NAPT)", "포트까지 바꾸는 NAT. 기기 여러 대가 공인 IP 하나를 나눠 써요.", 2], [9, "hop", "장비 하나를 건너는 한 구간. hop마다 MAC은 바뀌고 IP는 그대로예요.", 2], [9, "Next Hop", "바로 다음에 넘길 장비. 라우터는 전체 길이 아니라 이것만 정해요.", 2], [9, "tracert", "패킷이 지나간 라우터 목록을 보여 주는 명령어(맥: traceroute).", 2], [9, "hop", "장비 하나를 건너가는 구간. hop마다 Ethernet 헤더의 MAC 주소가 다음 장비로 바뀌어요.", 3], [10, "바이트", "0과 1 여덟 개(8비트). 전송 계층에겐 글자든 사진이든 전부 바이트의 줄이에요.", 3], [10, "순서번호 (seq)", "바이트마다 1부터 붙이는 번호. 순서를 다시 맞추고 빠진 것을 찾는 기준이에요.", 3], [10, "MSS", "조각 하나에 담는 데이터의 최대 크기(헤더 제외). 보통 1460바이트이고, 연결을 맺을 때 서로 알려 줘요.", 3], [11, "헤더", "조각 앞에 붙이는 20바이트 메모지. 칸 하나가 TCP 기능 하나예요.", 3], [11, "세그먼트", "헤더 + 데이터 조각. TCP가 실제로 보내는 단위예요.", 3], [12, "ACK", "\"여기까지 받았어.\" 다음에 받고 싶은 번호를 적어 보내요(누적 확인).", 3], [12, "RTT", "보낸 신호가 상대에게 갔다가 답이 돌아오기까지 걸리는 왕복 시간.", 3], [12, "3-way handshake", "SYN → SYN+ACK → ACK. 서로의 시작 번호를 주고받아 연결 메모를 만드는 절차.", 3], [12, "상황판 (TCB)", "연결마다 OS가 적어 두는 메모. 상태, 다음에 보낼 번호, 다음에 받을 번호 등.", 3], [13, "TLS", "Transport Layer Security. 데이터를 암호화하고 서버가 진짜인지 확인하는 규칙. https의 s.", 4], [13, "대칭키 암호", "같은 키로 잠그고 여는 암호(AES, ChaCha20). 빨라서 실제 데이터에 써요.", 4], [13, "디지털 서명", "개인키로 서명하고 공개키로 확인. \"진짜 주인\"임을 증명해요.", 4], [13, "ECDHE", "공개값만 주고받아 양쪽이 같은 비밀을 만드는 키 교환. 매 연결 새 키.", 4], [13, "Forward Secrecy", "서버 개인키가 나중에 털려도 지난 대화는 못 푸는 성질.", 4], [14, "TLS 1.3 핸드셰이크", "ClientHello · ServerHello · 인증서 · Finished를 1 RTT에 끝내는 절차.", 4], [14, "SNI", "ClientHello에 적는 \"어느 사이트로 왔는지\". IP 하나에 사이트가 여럿이라 필요해요.", 4], [14, "ALPN", "TLS 안에서 HTTP 버전(h2, h3)을 정하는 확장.", 4], [14, "CA · Root CA", "인증 기관. Root CA는 OS·브라우저에 미리 설치된 최상위 기관이라 신뢰의 출발점이에요.", 4], [14, "인증서 체인", "Root CA → Intermediate CA → Leaf. 서명을 따라 신뢰가 이어져요.", 4], [14, "CertificateVerify", "서버가 개인키로 지금 대화에 서명한 것. 인증서 \"소유\"를 증명해요.", 4], [14, "Finished", "지금까지 주고받은 모든 메시지의 요약 값. 중간 변조(다운그레이드)를 잡아요.", 4], [14, "0-RTT", "재방문 때 첫 패킷에 요청을 실어 보내기. 재전송 공격 위험 → 멱등 요청만.", 4], [14, "CAA", "\"이 도메인 인증서는 이 CA만 발급 가능\"이라는 DNS 레코드.", 4], [15, "캡슐화", "아래 층으로 내려가며 헤더를 한 겹씩 씌우는 것. 받는 쪽은 바깥부터 벗겨요.", 3], [15, "MTU", "한 번에 실을 수 있는 최대 크기(이더넷 1500바이트). MSS = MTU − IP 20 − TCP 20.", 3], [15, "ECH", "ClientHello의 SNI까지 암호화하는 확장(Encrypted Client Hello).", 4], [15, "메타데이터", "내용이 아닌 정보: 누가 · 언제 · 어디로 · 얼마나. HTTPS로도 남아요.", 4], [16, "시작줄", "메서드 · 경로 · 버전. 응답은 상태줄(버전 · 코드 · 설명).", 4], [16, "CRLF", "줄 끝 표시 \\\\r\\\\n. 빈 줄(\\\\r\\\\n\\\\r\\\\n)이 헤더의 끝이에요.", 4], [16, "Content-Length", "본문 바이트 수. 이걸로 메시지 끝을 알아요(없으면 chunked).", 4], [16, "Content-Type", "본문의 형식: application/json, text/html; charset=utf-8 등.", 4], [16, "Chunked", "길이를 미리 모를 때 조각마다 크기를 붙여 보내는 방식.", 4], [17, "cwnd", "길(네트워크) 사정을 보고 보내는 쪽이 정한 한 왕복 전송량. 헤더에 없고 보내는 쪽 OS만 알아요.", 3], [17, "ssthresh", "cwnd를 2배씩 늘리다가 1씩 늘리기로 바꾸는 경계. 처음엔 큰 값이고, 손실이 날 때마다 그때 cwnd의 절반으로 다시 정해요.", 3], [17, "라우터 큐", "라우터가 바로 내보내지 못한 패킷이 줄 서는 곳. 넘치면 새로 온 패킷을 버려요.", 3], [18, "VPC", "클라우드 안에 내가 직접 설계하는 가상 네트워크.", 2], [18, "IGW", "VPC와 인터넷 사이의 출입문(인터넷 게이트웨이).", 2], [18, "NAT 게이트웨이", "Private 서브넷이 밖으로 나갈 때만 쓰는 클라우드의 NAT.", 2], [18, "Security Group", "클라우드 방화벽. \"무엇만 허용할지\"로 규칙을 써요.", 2], [18, "호스트 방화벽", "서버 자체의 방화벽(ufw, Windows 방화벽). 클라우드 방화벽과 두 겹이에요.", 2], [18, "리버스 프록시", "서버 앞에서 요청을 받아 뒤로 나눠 주는 대리인(nginx, LB, CDN).", 4], [18, "포워드 프록시", "클라이언트 앞에서 대신 나가 주는 대리인(회사 프록시, VPN 비슷).", 4], [19, "포트", "한 컴퓨터 안에서 어느 프로그램인지 구분하는 번호(0~65535).", 2], [19, "소켓", "출발지 IP·포트, 목적지 IP·포트 네 값의 조합으로 구분되는 연결의 끝점.", 2], [19, "bind", "프로그램이 \"어느 인터페이스의 몇 번 포트에서 받을지\" 정하는 것.", 2], [19, "0.0.0.0 (bind)", "\"이 PC의 모든 인터페이스에서 받기\". 인터넷 공개와는 다른 말이에요.", 2], [19, "포트", "컴퓨터 안의 프로그램을 구분하는 번호.", 3], [19, "4-tuple", "출발지 IP · 출발지 포트 · 목적지 IP · 목적지 포트. TCP는 이 네 값으로 연결을 구분해요.", 3], [19, "소켓", "OS 안의 통신 창구. 앱은 이 창구를 통해서만 데이터를 주고받아요.", 3], [19, "listen 소켓", "새 손님의 악수만 받는 접수 창구. 악수가 끝나면 손님 전용 연결 소켓을 새로 만들어요.", 3], [19, "fd", "OS가 앱에게 주는 번호표. 앱은 \"3번에 보내 줘\"처럼 이 번호로만 소켓을 다뤄요.", 3], [20, "502 · 504 · 503", "프록시가 만드는 코드: 뒷단 이상한 답 · 뒷단 늦음 · 받을 서버 없음.", 4], [20, "401 · 403", "401은 \"누구세요?\"(인증 없음), 403은 \"알지만 안 돼요\"(권한 없음).", 4], [20, "429", "요청이 너무 많음. Retry-After 뒤에 다시 시도해요.", 4], [21, "Cache-Control", "max-age · no-cache(매번 확인) · no-store(저장 금지) · immutable.", 4], [21, "ETag · 304", "버전 표. If-None-Match로 물으면 안 바뀐 경우 본문 없이 304만 와요.", 4], [21, "HSTS", "\"앞으로 이 사이트는 https로만\"이라고 브라우저에 기억시키는 헤더.", 4], [21, "charset", "글자를 바이트로 바꾼 규칙. 틀리면 글자가 깨져 보여요(ë¹¨ê°•).", 4], [22, "중복 ACK", "같은 ACK 번호가 반복해서 오는 것. \"뒤는 오는데 그 조각만 없다\"는 신호예요.", 3], [22, "RTO (타임아웃)", "ACK를 기다리는 제한 시간. RTT를 재서 정하고, 넘으면 잃어버린 걸로 보고 다시 보내요.", 3], [22, "SACK", "\"이 구간은 받아 뒀어\"를 알려 주는 Options 칸의 기능. 빠진 조각만 골라 재전송하게 해 줘요.", 3], [22, "윈도우", "ACK를 기다리지 않고 미리 보내도 되는 양.", 3], [22, "rwnd", "받는 쪽 버퍼에 남은 공간. ACK의 Window 칸에 적어 보내고, 0이면 보내는 쪽이 멈춰요.", 3], [23, "쿠키", "서버가 브라우저에 맡겨 두고 매 요청마다 돌려받는 작은 값.", 4], [23, "세션", "서버가 상태를 저장하고 쿠키엔 열쇠(sid)만. 지우면 바로 로그아웃.", 4], [23, "JWT", "서명된 토큰에 정보를 담아 서버는 검증만. 만료 전엔 취소가 어려워요.", 4], [23, "안전 · 멱등", "안전 = 서버 상태를 안 바꿈(GET). 멱등 = 여러 번 해도 결과가 같음(PUT · DELETE).", 4], [23, "Idempotency-Key", "같은 키로 온 재시도는 처음 결과를 그대로 돌려주는 장치. 중복 주문 방지.", 4], [23, "CORS", "다른 출처 요청을 서버가 허용했는지 브라우저가 확인하는 규칙(preflight OPTIONS function renderBuf(){

  $('winT').style.display=showW?'':'none';$('rwT').style.display=showW?'':'none';
  $('winT').textContent=S4.win.n>0?'윈도우 = '+S4.win.n+'칸':'윈도우 = 0 → 전송 정지';

function s4Reset(){S4.send=['wait','wait','wait','wait','wait'];S4.recv=[null,null,null];S4.win={s:0,n:3};S4.app=true;$('appT').textContent=appLabel();$('appB').setAttribute('stroke',C.teal);renderBuf();}
function slide(){let s=0;while(s<5&&(S4.send[s]==='ok'))s++;S4.win.s=s;}
async function consume(ep,i,d){await sleep(d||500,ep);if(S4.app){S4.recv[i]=null;renderBuf();}}
const ackN=i=>1+(i+1)*1460;
async function sendOne(ep,i,quiet){S4.send[i]='sent';renderBuf();await flyPkt(ep,'조각'+(i+1)+' seq='+(1+i*1460),C.coral,1);
  const slot=S4.recv.indexOf(null);S4.recv[slot]={seg:i,st:'data'};renderBuf();consume(ep,slot,500).catch(()=>{});
  await flyPkt(ep,'ACK '+ackN(i),C.teal,-1);S4.send[i]='ok';slide();renderBuf();
  if(!quiet)log('ACK '+ackN(i)+' 도착 → 조각'+(i+1)+' 확인, 윈도우가 한 칸 오른쪽으로'+(i+3<5?' → 조각'+(i+4)+' 전송':''));}
async function s4Stop(ep){s4Reset();S4.win.n=1;renderBuf();log('윈도우 1칸: 하나 보내고 ACK가 올 때까지 기다려요');await gate(ep,1200);
  for(let i=0;i<5;i++){await sendOne(ep,i,true);log('조각'+(i+1)+' 확인 · 지금까지 왕복 '+(i+1)+'번');await gate(ep,500);}
  log('왕복 5번(5 RTT). RTT 30ms면 처리량이 0.39 Mbps에 묶여요');}
async function s4Normal(ep){
  s4Reset();log('윈도우 3칸: ACK를 기다리지 않고 조각 1~3을 연달아 보내요');await gate(ep,1200);
  const chain=async i=>{await sendOne(ep,i);if(i+3<5)await chain(i+3);};
  await Promise.all([chain(0),sleep(700,ep).then(()=>chain(1)),sleep(1400,ep).then(()=>chain(2))]);
  await sleep(600,ep);log('5조각 모두 확인. 하나씩이면 왕복 5번, 윈도우 덕분에 거의 2번이면 끝나요');}
async function s4Loss(ep){
  s4Reset();
  log('조각1을 보내요. 확인(ACK)을 받을 때까지 송신 버퍼에 사본을 들고 있어요');S4.send[0]='sent';renderBuf();await gate(ep,1000);
  await flyPkt(ep,'조각1 seq=1',C.coral,1);S4.recv[0]={seg:0,st:'data'};renderBuf();log('조각1 도착 → 빈칸이 없으니 앱에 올려 줘요');consume(ep,0,900).catch(()=>{});await gate(ep,900);
  await flyPkt(ep,'ACK 1461',C.teal,-1);S4.send[0]='ok';renderBuf();log('ACK 1461 = "1460번까지 다 받았어" → 조각1 사본은 지워요');await gate(ep,1500);
  S4.send[1]='sent';renderBuf();log('조각2를 보내요');await gate(ep,700);
  await flyPkt(ep,'조각2 seq=1461',C.coral,1,true);log('조각2가 길에서 사라졌어요. 받는 쪽은 이 조각이 출발했다는 것조차 몰라요');await gate(ep,1600);
  S4.send[2]='sent';renderBuf();log('보내는 쪽도 아직 몰라서 조각3을 계속 보내요');await gate(ep,800);
  await flyPkt(ep,'조각3 seq=2921',C.coral,1);S4.recv[1]={seg:1,st:'hole'};S4.recv[2]={seg:2,st:'hold'};renderBuf();
  log('조각3 도착. 1461번이 와야 하는데 2921번이 왔어요 → 빈칸(구멍) 뒤라서 보관만 하고 앱엔 못 올려요');await gate(ep,2600);
  await flyPkt(ep,'ACK 1461 + SACK 2921~4380',C.amber,-1,false,2300);S4.send[2]='sack';renderBuf();
  log('Server: "아직 1461번이 필요해(중복 ACK). 단, 2921~4380은 받아 뒀어(SACK)"');await gate(ep,2600);
  log('<b>SACK이 없다면?</b> ACK는 "1461번부터 필요해"까지만 말해요.<span class="gap"></span>보내는 쪽은 조각3이 도착했는지 몰라서, 조각2만 보내고 다음 ACK를 한 번 더 기다리거나(왕복이 늘어 느림) 조각2·3을 전부 다시 보내야 해요(이미 받은 걸 또 보내는 낭비).');await gate(ep,3600);
  log('<b>SACK이 있으면</b> "받아 둔 구간"까지 알려 주니까 빠진 조각만 정확히 골라 한 번에 재전송해요. 왕복도, 대역폭도 아껴요. 손실이 여러 군데 생길수록 차이가 커져요.');await gate(ep,3200);
  log('SACK은 헤더의 <b>Options</b> 칸에 실려요. 연결을 맺을 때 SYN에서 "나 SACK 쓸 수 있어"라고 서로 약속한 경우에만 써요. 헤더 카드의 Options 칸을 펴 보세요.');await gate(ep,3000);
  log('Client: 보낸 기록 − ACK − SACK = 빠진 건 조각2뿐 → 그것만 다시 보내요');await gate(ep,2200);
  await flyPkt(ep,'재전송 조각2',C.red,1);S4.recv[1]={seg:1,st:'data'};S4.recv[2]={seg:2,st:'data'};renderBuf();

  await flyPkt(ep,'ACK 4381',C.teal,-1);S4.send[1]='ok';S4.send[2]='ok';slide();renderBuf();
  log('ACK 하나(누적)로 4380번까지 확인. 조각3은 다시 보낼 필요가 없었어요');}
async function s4TO(ep){
  s4Reset();log('이번엔 마지막 조각이 사라지는 경우예요');await gate(ep,1200);
  for(let i=0;i<2;i++){S4.send[i]='sent';renderBuf();await flyPkt(ep,'조각'+(i+1)+' seq='+(1+i*1460),C.coral,1);
    S4.recv[i]={seg:i,st:'data'};renderBuf();consume(ep,i,600).catch(()=>{});await flyPkt(ep,'ACK '+ackN(i),C.teal,-1);S4.send[i]='ok';renderBuf();log('조각'+(i+1)+' 정상 확인');await gate(ep,600);}
  S4.send[2]='sent';renderBuf();log('마지막 조각3을 보내요');await gate(ep,600);
  await flyPkt(ep,'조각3 seq=2921',C.coral,1,true);
  log('조각3이 사라졌어요. 뒤따르는 조각이 없어서 받는 쪽은 중복 ACK를 보낼 계기가 없어요');await gate(ep,2400);
  for(let t=3;t>=1;t--){say('보내는 쪽 재전송 타이머(RTO) … '+t);await sleep(900,ep);}
  log('타임아웃! 이번엔 뒤따르는 조각이 없어서 <b>중복 ACK가 생기지 않아요</b>. 그래서 마지막 수단인 <b>타이머(RTO)</b>로 알아채요.<span class="gap"></span>보낸 뒤 정해진 시간 안에 ACK가 안 오면 잃어버린 걸로 보고 조각3을 다시 보내요.<span class="gap"></span>아무 응답도 없었다는 건 길이 심하게 막혔을 수도 있다는 뜻이라, 보내는 속도도 크게 줄여요.');await gate(ep,1800);
  await flyPkt(ep,'재전송 조각3',C.red,1);
  const s=S4.recv.indexOf(null);S4.recv[s]={seg:2,st:'data'};renderBuf();consume(ep,s,800).catch(()=>{});
  await flyPkt(ep,'ACK 4381',C.teal,-1);S4.send[2]='ok';renderBuf();
  log('복구는 됐지만 중복 ACK 방식보다 훨씬 늦어요 → 짧은 요청이 가끔 느려지는 이유');}
async function s4Zero(ep){
  s4Reset();S4.app=false;$('appT').textContent='멈춤 (안 꺼내 감)';$('appB').setAttribute('stroke',C.red);renderBuf();
  log('Server 앱이 다른 일로 바빠 수신 버퍼에서 데이터를 꺼내 가지 않는 상황');await gate(ep,1500);
  const one=async i=>{S4.send[i]='sent';renderBuf();await flyPkt(ep,'조각'+(i+1),C.coral,1);
    const slot=S4.recv.indexOf(null);S4.recv[slot]={seg:i,st:'data'};renderBuf();const free=S4.recv.filter(x=>!x).length;
    await flyPkt(ep,'ACK '+ackN(i)+' win='+free,C.teal,-1);S4.send[i]='ok';slide();S4.win.n=Math.min(3,free);renderBuf();
    log('ACK의 Window 칸 = '+free+' → 보내는 쪽 윈도우도 '+free+'칸으로 줄어요');};
  await Promise.all([one(0),sleep(700,ep).then(()=>one(1)),sleep(1400,ep).then(()=>one(2))]);
  await sleep(800,ep);log('rwnd = 0 (ZeroWindow) → 보내는 쪽은 전송을 멈춰요');await gate(ep,1800);
  await flyPkt(ep,'Window Probe',C.blue,1);await flyPkt(ep,'ACK win=0',C.teal,-1);log('Window Probe: "이제 받을 수 있어?" → 아직 0');
  await gate(ep,1600);S4.app=true;$('appT').textContent=cur>=19?'recv() 재개':'다시 꺼내 감';$('appB').setAttribute('stroke',C.teal);
  for(let i=0;i<3;i++){await sleep(450,ep);S4.recv[i]=null;renderBuf();}
  log('앱이 꺼내 가자 버퍼가 비워졌어요');await gate(ep,1000);
  await flyPkt(ep,'ACK win=3',C.teal,-1);S4.win.n=3;renderBuf();log('윈도우 업데이트: 다시 3칸 → 전송 재개');await gate(ep,800);
  await Promise.all([sendOne(ep,3,true),sleep(700,ep).then(()=>sendOne(ep,4,true))]);}

/* ---- 7: 호스트 ---- */
function tok(label,color){const fs=11,h=18,w=label.length*fs*0.6+16;const g=G(EP);R(g,-w/2,-h/2,w,h,{fill:rgba(color,.25),stroke:color,rx:4});g._t=T(g,0,0,fs,label,{mono:true});return g;}
function moveTo(g,a,b,ms,ep){return tween(ms,t=>{const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;g.setAttribute('transform','translate('+(a[0]+(b[0]-a[0])*e)+','+(a[1]+(b[1]-a[1])*e)+')');},ep);}
function s5Reset(){['cNicR','sNicR'].forEach(i=>$(i).setAttribute('stroke-width',1));c3.style.display='none';dm3._hide=true;dm3.style.display='none';const f=$('fd6');f.textContent='fd 6  —';f.setAttribute('fill',C.tx3);$('srvApp').setAttribute('stroke-width',1);}

async function s5Rewind(ep){
  const v=(f,x,y,w,h)=>tgt({f:f,x:x,y:y,w:w,h:h});
  log('① Ep. 10에서 브라우저가 OS에게 "이 데이터 보내 줘"라고 맡겼죠? 그때 그 부탁이 바로 <b>send()</b>였어요');await gate(ep,3000);
  await flyTo(stTarget(2));if(ep!==epoch)return;
  log('② Ep. 10의 "앱이 맡긴 덩어리" 하나 = send() 한 번 호출');await gate(ep,3400);
  await flyTo(stTarget(4));if(ep!==epoch)return;
  log('③ "Client 쪽 끝 / Server 쪽 끝" = 소켓 (앱에겐 fd 번호 하나로 보임)');await gate(ep,2600);
  log('④ 연결하자(SYN)를 시작시키는 함수 = connect() · 손님 받을 준비 = bind()+listen() · 완성된 연결 꺼내기 = accept()');await gate(ep,4200);
  await flyTo(stTarget(6));if(ep!==epoch)return;
  log('⑤ 수신 버퍼에서 "앱이 꺼내 감" = recv() · "그만 보낼게" = close()');await gate(ep,3400);
  await flyTo(stTarget(7));if(ep!==epoch)return;
  log('다시 컴퓨터 안으로. 이제 이 그림의 상자들에 이름이 다 붙었어요');await gate(ep,3500);cap('');}

/* ---- 8: 네트워크 ---- */
function along(c,pts,ms,ep){const seg=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);tot+=d;}
  return tween(ms,t=>{let d=t*tot,i=0;while(i<seg.length-1&&d>seg[i]){d-=seg[i];i++;}const f=seg[i]?Math.min(1,d/seg[i]):1;
    c.setAttribute('cx',pts[i][0]+(pts[i+1][0]-pts[i][0])*f);c.setAttribute('cy',pts[i][1]+(pts[i+1][1]-pts[i][1])*f);},ep);}
const SIM={cwnd:1,ssth:16,hist:[],run:false,busy:false,pending:null};const CAP=22;
const gameRx=LD(T(D,880,482,9.5,'',{id:'gameRx',fill:C.purpleD}),0.5);
function dPill(label,color){const g=G(DP);const fs=10,w=label.length*fs*0.62+16;g._r=R(g,-w/2,-9,w,18,{fill:'#FFFDF8',stroke:color,sw:1.6,rx:4});
  g._t=T(g,0,0,fs,label,{mono:true,cls:'nohalo'});g.set=t=>{g._t.textContent=t;const w2=t.length*fs*0.62+16;g._r.setAttribute('x',-w2/2);g._r.setAttribute('width',w2);};return g;}
function alongG(g,pts,ms,ep){const seg=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);tot+=d;}
  return tween(ms,t=>{let d=t*tot,i=0;while(i<seg.length-1&&d>seg[i]){d-=seg[i];i++;}const f=seg[i]?Math.min(1,d/seg[i]):1;
    g.setAttribute('transform','translate('+(pts[i][0]+(pts[i+1][0]-pts[i][0])*f)+','+(pts[i][1]+(pts[i+1][1]-pts[i][1])*f)+')');},ep);}
const RB=ROUTE.slice().reverse(),R1=ROUTE.slice(0,4),R2=ROUTE.slice(3);
function xMark(layer,x,y,s){return P(layer,'M'+(x-s)+' '+(y-s)+' L'+(x+s)+' '+(y+s)+' M'+(x+s)+' '+(y-s)+' L'+(x-s)+' '+(y+s),{stroke:C.red,sw:3});}
function s6Reset(){SIM.run=false;SIM.busy=false;SIM.pending=null;SIM.cwnd=1;SIM.ssth=16;SIM.hist=[{c:1,s:16,ev:''}];
  for(let i=0;i<8;i++)$('q'+i).setAttribute('fill',C.card);gameRx.textContent='';drawGraph();}
function setQueue(){const n=Math.max(0,Math.min(8,Math.round((SIM.cwnd-14)/8*8)));for(let i=0;i<8;i++)$('q'+i).setAttribute('fill',i<n?rgba(C.amber,.7):C.card);}
function push(ev){SIM.hist.push({c:SIM.cwnd,s:SIM.ssth,ev:ev});if(SIM.hist.length>40)SIM.hist.shift();drawGraph();}
async function simRTT(ep){
  const n=SIM.cwnd,pk=SIM.pending;SIM.pending=null;
  const g=dPill('TCP 조각 ×'+n,C.coral);
  if(pk==='to'){
    await alongG(g,R1,1100,ep);const X=xMark(DP,N.BN[0],N.BN[1],12);for(let i=0;i<8;i++)$('q'+i).setAttribute('fill',rgba(C.red,.75));
    g.set('×'+n+' 전부 버려짐');log('병목 대기열이 넘쳐 이번 왕복에 보낸 '+n+'개가 전부 버려졌어요. 돌아오는 ACK가 하나도 없어요');
    await gate(ep,1600);g.remove();X.remove();
    for(let t=3;t>=1;t--){say('보내는 쪽 재전송 타이머(RTO) … '+t);await sleep(800,ep);}
    SIM.ssth=Math.max(2,Math.floor(n/2));SIM.cwnd=1;push('to');setQueue();
    log('타임아웃 → 심각한 혼잡으로 판단: cwnd = 1, 경계(ssthresh) = '+SIM.ssth+'. 잃어버린 것을 다시 보내며 처음부터 천천히');
    const r=dPill('재전송 ×1',C.red);await alongG(r,ROUTE,1300,ep);r.remove();
    const a=dPill('ACK',C.teal);await alongG(a,RB,1100,ep);a.remove();return;}
  let lost=pk==='dup'?Math.max(1,Math.ceil(n*0.1)):(n>CAP?n-CAP:0);
  if(lost){
    await alongG(g,R1,900,ep);const X=xMark(DP,N.BN[0],N.BN[1],12);for(let i=0;i<8;i++)$('q'+i).setAttribute('fill',i<7?rgba(C.amber,.7):rgba(C.red,.85));
    g.set('×'+(n-lost)+' 통과 · '+lost+'개 버려짐');log(n+'개를 보냈는데 대기열이 넘쳐 '+lost+'개가 버려졌어요');
    await gate(ep,1500);X.remove();g.set('TCP ×'+(n-lost));await alongG(g,R2,900,ep);g.remove();
    const a=dPill('중복 ACK ×3',C.amber);log('받는 쪽: 빈 번호가 생겨 같은 ACK를 반복해서 보내요 (나머지는 잘 받고 있다는 뜻)');await alongG(a,RB,1300,ep);a.remove();
    SIM.ssth=Math.max(2,Math.floor(n/2));SIM.cwnd=SIM.ssth;push('dup');setQueue();
    log('가벼운 손실로 판단 → cwnd 절반('+SIM.cwnd+'). 빠진 '+lost+'개만 바로 재전송');
    const r=dPill('재전송 ×'+lost,C.red);await alongG(r,ROUTE,1200,ep);r.remove();
    const b=dPill('ACK',C.teal);await alongG(b,RB,1000,ep);b.remove();return;}
  await alongG(g,ROUTE,1400,ep);g.remove();
  const a=dPill('ACK ×'+n,C.teal);await alongG(a,RB,1200,ep);a.remove();
  const ss=SIM.cwnd<SIM.ssth;
  SIM.cwnd=ss?Math.min(SIM.cwnd*2,SIM.ssth):SIM.cwnd+1;push('');setQueue();
  log('ACK가 모두 돌아옴 → '+(ss?'Slow Start: 2배로 늘려 '+SIM.cwnd+'개':'혼잡 회피: 1개만 늘려 '+SIM.cwnd+'개'));}
async function simLoop(ep){try{while(SIM.run&&ep===epoch){SIM.busy=true;await simRTT(ep);SIM.busy=false;await sleep(400,ep);}}catch(e){}SIM.busy=false;}
function simKick(kind){SIM.pending=kind;log(kind==='dup'?'다음 왕복에서 조각 일부를 잃게 할게요':'다음 왕복에서 조각을 전부 잃게 할게요');
  if(!SIM.busy){const ep=epoch;SIM.busy=true;simRTT(ep).catch(()=>{}).then(()=>{SIM.busy=false;});}}
function drawGraph(){
  const g=$('g6');if(!g)return;g.innerHTML='';

 {view:VP,t:[320,300],s:'한 칸 줌아웃했어요. <b>인터페이스</b>는 컴퓨터가 네트워크에 연결되는 출입구예요. 무선으로 공유기에 붙는 Wi-Fi 랜카드가 그중 하나라서 <b>Wi-Fi 인터페이스</b>라고 불러요.'+GP+'이 주소는 노트북 전체가 아니라 바로 이 출입구에 붙어 있어요.'},
 {t:[800,330],s:'노트북엔 인터페이스가 여러 개고, 각자 IP를 가져요. <b>Loopback(127.0.0.1)</b>은 나 자신을 가리키는 주소예요. Docker 같은 가상 어댑터도 따로 주소가 있어요.'+GP+'그래서 <code>ipconfig</code>에서 가상 어댑터의 IP를 내 IP로 착각하기 쉬워요.'},
 {t:[800,330],s:'그럼 나를 가리키는 주소가 192.168.0.23과 127.0.0.1 두 개일까요? 맞아요, <b>둘 다 나</b>예요. 쓰임이 달라요.'+GP+'다른 기기가 나를 찾아올 때는 Wi-Fi의 <b>192.168.0.23</b>을 써요. <b>127.0.0.1</b>은 노트북이 <b>자기 자신에게만</b> 보낼 때 쓰는 특별한 주소라 밖으로는 절대 나가지 않아요. 어느 컴퓨터든 127.0.0.1은 "나 자신"이에요.'+GP+'처음의 <code>localhost:8000</code>도 사실 127.0.0.1:8000이었어요.'}],
/* Ep 2 · 방의 크기 */
[{t:[512,272],s:'이 32비트에 <b>칸막이</b>를 쳐 볼게요. 아래 줄이 <b>서브넷 마스크</b>예요. 1이 있는 자리까지가 앞부분, 0인 자리가 뒷부분이에요.'},
 {t:()=>[(bxi(0)+bxi(23)+24)/2,325],s:'앞부분은 <b>Network 부분</b>, 어느 "방(네트워크)"인지예요. 뒷부분은 <b>Host 부분</b>, 그 방의 몇 번 자리인지예요.'+GP+'Network 부분이 같은 주소끼리는 같은 방에 있어요.'},
 {t:[900,236],s:'마스크 255.255.255.0을 짧게 <b>/24</b>라고도 써요. 이게 <b>CIDR</b> 표기예요. "앞 24비트가 Network"라는 뜻이에요.'},
 {t:[512,396],s:'이 방엔 몇 자리가 있을까요? Host 부분 8비트로 만들 수 있는 번호는 2⁸ = <b>256개</b>예요.'},
 {t:[150,440],s:'단, 두 자리는 못 써요. 맨 앞 <b>.0</b>은 방 이름(<b>Network 주소</b>), 맨 끝 <b>.255</b>는 방 전체에 외칠 때 쓰는 <b>Broadcast 주소</b>예요.'+GP+'그래서 실제로 쓸 자리는 <b>254개</b>이고, 보통 .1은 공유기가 써요.'},
 {btn:'p26',hint:'아래 <b>/16 · /24 · /26 · /28</b> 버튼을 눌러 칸막이를 옮겨 보세요.',s:'Prefix가 1 늘면 방 크기는 <b>절반</b>, 2 늘면 <b>1/4</b>이에요. 이 두 가지만 기억하면 나머지는 계산돼요.'},
 {btn:'split',s:'이번엔 /24 방 하나를 <b>/26 네 개</b>로 쪼개 볼게요.'},
 {t:[512,396],s:'왜 쪼갤까요? 주소를 아끼려는 게 아니라 <b>경계</b>를 만들려는 거예요.'+GP+'손님용 Wi-Fi와 업무용을 나누듯 보안과 장애 범위를 나누는 선이에요. Ep. 18 미국 데이터센터(VPC)에서 이 계산을 그대로 다시 써요.'}],
/* Ep 3 · 집 Wi-Fi에 붙기 */
[{t:[200,155],s:'그런데 잠깐, 내 IP 192.168.0.23과 마스크는 누가 정해 줬을까요? 내가 입력한 적은 없어요.'},
 {t:[885,234],s:'공유기 안의 <b>DHCP 서버</b>가 나눠 줬어요. 노트북이 Wi-Fi에 붙으면 4단계로 설정을 받아 와요.'},
 {btn:'dora',s:'Ep. 2에서 본 <b>Broadcast</b>로 시작해요. DHCP 4단계를 따라가 볼게요.'},
 {t:'card',do:()=>{dhcpGot=true;updateCard();},s:'받아 온 설정이 오른쪽 위 카드에 채워졌어요. <b>IP · 마스크 · 게이트웨이 · DNS</b>, 이 네 줄이 내 PC가 알아야 하는 최소한의 정보예요.'+GP+'<code>ipconfig /all</code>로 볼 수 있어요. 이 네 줄만 제대로 읽어도 진단의 절반이에요.'+GP+'DNS 줄의 <b>168.126.63.1</b>은 Ep. 5에서 이름을 물어볼 곳이에요.'},
 {t:[200,155],s:'설정엔 <b>임대 시간(Lease)</b>이 있어요. 끝나기 전에 갱신하지만, 내 IP가 언제든 바뀔 수 있다는 뜻이에요.'+GP+'그래서 서버를 돌릴 PC는 고정 IP나 DHCP 예약을 써요.'}],
/* Ep 4 · 같은 방? 다른 방? */
[{t:[200,72],s:'우리 집 방(LAN)이에요. 내 노트북, 같은 Wi-Fi의 친구 노트북, 휴대폰, 전구가 모두 <b>192.168.0.0/24</b> 방에 있어요.'},
 {t:[812,410],s:'패킷을 보낼 때마다 노트북의 <b>OS</b>가 자동으로 판단해요. <b>내 IP AND 마스크</b>와 <b>상대 IP AND 마스크</b>가 같으면 같은 방이에요. 비트 AND 한 번이라 눈 깜짝할 새에 끝나요.'+GP+'AND는 둘 다 1일 때만 1이라, 마스크의 0 자리를 지워서 Network 부분만 남겨요.'},
 {btn:'and',s:'친구 노트북(192.168.0.30)과 shop.com의 서울 엣지(13.0.0.5)로 직접 계산해 볼게요.'},
 {t:[520,300],s:'같은 방이면 공유기를 거치지 않고 <b>스위치</b>로 바로 보내요. 그런데 스위치는 IP를 보지 않아요. 보는 건 기기마다 붙은 <b>MAC 주소</b>예요.'},
 {t:[170,525],s:'<b>MAC 주소</b>는 랜카드에 새겨진 물리 주소예요(예: cc:cc:cc:cc:cc:cc).'+GP+'IP가 "최종적으로 누구"를 가리킨다면, MAC은 "지금 이 연결에서 바로 다음 장비"를 가리켜요.'},
 {btn:'arp',s:'그럼 친구의 MAC은 어떻게 알까요? 방 전체에 물어봐요. 이게 <b>ARP</b>예요.'},
 {t:[200,272],s:'알아낸 IP ↔ MAC 짝은 <b>ARP Cache</b>에 잠시 저장해요. <code>arp -a</code>로 볼 수 있어요. 매번 묻지 않아도 되게요.'},
 {t:[885,300],s:'이번엔 목적지가 서울 엣지 <b>13.0.0.5</b>예요. AND 결과가 달라서 <b>다른 방</b>이에요. 다른 방이면 스위치로는 못 가요.'},
 {t:[885,330],s:'모르는 방으로 가는 패킷은 전부 <b>Default Gateway</b>(192.168.0.1, 공유기)에 넘겨요. 방의 출입문 같은 곳이에요.'},
 {btn:'gw',s:'패킷 라벨을 보면서 보내 볼게요. 목적지 IP는 엣지인데, 목적지 MAC은 누구 것이 될까요?'},
 {t:[885,300],s:'목적지가 아무리 멀어도 노트북은 <b>Gateway까지만</b> 책임져요.'+GP+'Gateway 주소가 틀리면 같은 방의 친구는 보이는데 인터넷은 안 돼요. "핑은 되는데 웹이 안 되는" 전형적인 증상이에요.'},
 {t:[802,48],s:'노트북은 이걸 <b>경로표(Routing Table)</b>로 판단해요. <code>route print</code>로 볼 수 있어요. 목적지 범위마다 보낼 곳(<b>Next Hop</b>)이 적혀 있어요.'},
 {t:[700,95],s:'<b>0.0.0.0/0</b>은 "모든 주소"예요. 다른 줄에 안 맞을 때 쓰는 <b>Default Route</b>, 곧 Gateway로 가는 줄이에요.'+GP+'이 줄이 없으면 인터넷으로 나갈 길을 아예 몰라요.'},
 {btn:'lpm',s:'여러 줄에 동시에 맞으면? <b>가장 구체적인(Prefix가 긴) 줄</b>이 이겨요. 이걸 <b>Longest Prefix Match</b>라고 해요. 목적지 몇 개로 골라 볼게요.'}],
/* Ep 5 · 노트북 안의 기억 */
[{t:[292,81],s:'엔터를 눌렀어요. 브라우저는 <b>www.shop.com</b>만 알고 서버 IP는 몰라요.'+GP+'Ep. 4에서 Gateway까지 가는 법은 알았지만, 정작 목적지 IP를 모르면 출발할 수 없어요. 이름을 IP로 바꿔 주는 <b>DNS</b>부터 시작해요. 하지만 바로 밖에 묻지 않고 <b>가까운 기억</b>부터 뒤져요.'},
 {t:[165,357],do:()=>nmem('bdns','www.shop.com ? → 없음','miss'),s:'① <b>브라우저 DNS 캐시</b>: 처음 와 본 사이트라 없어요.'},
 {t:[165,405],do:()=>nmem('odns','www.shop.com ? → 없음','miss'),s:'② <b>OS DNS 캐시</b>: 다른 프로그램이 물어본 기록도 없어요.'},
 {t:[165,453],do:()=>nmem('hosts','(기본: localhost만)','miss'),s:'③ <b>hosts 파일</b>: 컴퓨터에 직접 적어 두는 이름표예요. DNS보다 먼저 봐요. 여기도 없어요.'},
 {btn:'hosts',s:'hosts 파일에 한 줄을 적으면 어떻게 될까요?'},
 {t:[445,365],s:'세 곳 다 없으면 OS 안의 <b>Stub Resolver</b>가 밖에 물어요. 이름처럼 "작은" 해결사라서 직접 찾아다니지 않아요. <b>"끝까지 알아와 줘"</b>라고 맡기기만 해요.'},
 {t:[445,439],s:'누구한테 맡길까요? <b>리졸버</b>(Resolver, 재귀 DNS 서버)예요. 손님 대신 DNS 서버들을 돌아다니며 답을 찾아 주는 <b>심부름꾼 DNS 서버</b>라는 뜻이에요.'+GP+'주소는 Ep. 3의 <b>DHCP</b>가 IP를 줄 때 같이 줬어요. 집 공유기가 알려 준 <b>168.126.63.1</b>, 통신사의 리졸버예요. 찾은 답은 캐시에 기억해 두고 다른 손님에게도 써요.'+GP+'그래서 "DNS 서버 주소는 어떻게 알아?"의 답은 "Wi-Fi에 붙을 때 받아 둔다"예요.'},
 {t:[445,527],s:'질문 쪽지는 <b>UDP의 DNS 전용 포트 53번</b>으로 가요. 작고 빨라야 해서 TCP 악수 없이 보내요. <code>rd</code>(recursion desired) 플래그가 "끝까지 알아와 줘"라는 표시예요.'},
 {btn:'doh',s:'그런데 이 쪽지는 <b>평문</b>이에요. 숨길 수는 없을까요?'},
 {t:'uc',s:'카드의 첫 번째 불 <b>① DNS 질문</b>이 켜졌어요. host가 처음 쓰인 곳이에요.'}],
/* Ep 6 · DNS 서버 찾기 */
[{t:[416,321],s:'쪽지가 집을 나가 <b>통신사 리졸버</b>에 도착했어요. 리졸버의 캐시도 비어 있다고 해 볼게요. 이제 리졸버가 대신 찾아 나서요.'},
 {tree:1,t:[650,285],s:'DNS 서버는 <b>나무</b>처럼 층이 나뉘어 있다는 뜻이에요. 맨 위가 <b>Root(.)</b>, 그 아래 <b>com · org · kr</b> 같은 <b>TLD</b>, 그 아래 <b>shop.com</b>을 직접 아는 <b>권한 서버</b>예요.'+GP+'대한민국 → 도 → 시 → 동처럼, 각 층은 <b>바로 아래 칸만</b> 알아요. 그래서 이름은 오른쪽부터 읽어요: www.shop.com<b>.</b> (끝의 점이 Root)'+GP+'선은 "이 구역은 저 서버에 맡겼어"라는 <b>위임</b>이에요. 다음 설명에서 건물들이 제자리로 돌아가요.'},
 {btn:'iter',s:'리졸버가 Root부터 한 칸씩 내려가 볼게요.'},
 {t:[416,321],s:'방금 리졸버가 주고받은 질문과 답도 전부 <b>UDP</b>였어요. DNS가 UDP를 쓰는 이유는, 질문 하나 · 답 하나면 끝나서 <b>악수(Ep. 12)에 쓰는 시간이 아깝기</b> 때문이에요. 답이 없으면 앱이 그냥 다시 물어봐요.'+GP+'"UDP가 빠르다"는 처리량이 아니라 <b>기다림이 없다</b>는 뜻이에요. UDP는 Ep. 24에서 자세히 봐요.'},
 {view:VR,t:[290,74],s:'DNS 사무실로 들어왔어요. 권한 서버가 준 답은 이런 <b>레코드</b> 한 줄이에요. 이름 · TTL(초) · 클래스 · 타입 · 값.'},
 {t:[240,330],s:'타입별로 뜻이 달라요. <b>A</b>/<b>AAAA</b>는 IP, <b>CNAME</b>은 별명, <b>NS</b>는 담당 서버, <b>MX</b>는 메일, <b>TXT</b>는 소유 증명, <b>CAA</b>는 인증서 발급 허용 기관(Ep. 14)이에요.'},
 {t:[700,190],s:'터미널의 <code>dig www.shop.com</code> 결과예요. <b>status</b>(NOERROR · NXDOMAIN · SERVFAIL), <b>flags</b>(qr 응답, rd 요청함, ra 재귀 가능), <b>ANSWER</b>와 TTL, <b>Query time</b>, <b>SERVER</b>(누가 답했나)를 읽어요.'},
 {view:VTREE,btn:'ttl',s:'답 옆의 숫자 <b>300</b>, <b>60</b>이 TTL이에요. 캐시가 언제까지 유효한지 흘려 볼게요.'},
 {btn:'nx',s:'이름을 틀리게 치면요?'},
 {btn:'sf',s:'이름은 맞는데 서버가 고장이면요?'},
 {t:[935,85],s:'정리: 리졸버는 <b>재귀로 받고 반복으로 찾고</b>, 찾은 답은 <b>TTL만큼</b> 기억해요. 그래서 대부분의 질문은 Root까지 안 가고 캐시에서 끝나요.'}],
/* Ep 7 · DNS가 길을 정한다 */
[{t:[935,85],s:'아까 shop.com 권한 서버는 IP 대신 "www는 <b>d123.cdn.net</b>의 별명(CNAME)"이라고 답했어요. 이 한 줄이 길을 바꿔요.'},
 {btn:'cdn',s:'별명을 끝까지 따라가 볼게요.'},
 {view:VE,t:GT(37.5,127),s:'초록 점들이 CDN의 <b>엣지 서버</b>예요. 쇼핑몰 원본을 전 세계에 복사해 두고 가까운 곳에서 답해요.'},
 {btn:'geo',s:'그런데 CDN DNS는 내가 서울에 있는 걸 어떻게 알까요?'},
 {view:VW,btn:'rr',s:'다시 지도로 왔어요. DNS로 길을 나누는 더 단순한 방법도 있어요. 원본 서버가 여러 대일 때요.'},
 {btn:'fo',s:'그중 한 대가 죽으면?'},
 {t:[763,136],s:'정리하면 DNS가 길을 정하는 네 방법: <b>CNAME</b>(남에게 위임) · <b>GeoDNS</b>(가까운 곳) · <b>Round Robin</b>(나눠 주기) · <b>Failover</b>(죽은 곳 빼기).'+GP+'넷 다 <b>TTL</b>의 지배를 받아요. 답을 바꿔도 캐시가 끝나야 퍼져요.'+GP+'이제 목적지 IP <b>13.0.0.5</b>를 알았어요. 이제 이 주소로 패킷이 집을 나서요.'}],
/* Ep 8 · 집 밖으로 */
[{view:VHW,t:[985,300],s:'목적지 IP를 알았으니 패킷이 출발해요. Ep. 4에서 본 대로 공유기에 도착했어요. 이제 집 밖으로 나갈 차례예요. 그런데 <b>192.168.x.x</b>는 집 밖에서 쓸 수 없는 주소예요.'},
 {t:[1150,374],s:'<b>Private IP(사설)</b>는 집·학교·회사·클라우드 안에서 자유롭게 쓰는 범위예요. 인터넷에는 이 주소로 가는 길이 없어요.'+GP+'<b>Public IP(공인)</b>는 인터넷 전체에서 하나뿐인 주소로, ISP나 클라우드가 나눠 줘요. 공유기 바깥쪽 <b>203.0.113.5</b>가 그거예요.'},
 {btn:'nat',s:'그래서 공유기가 주소를 바꿔 줘요. <b>NAT</b>을 따라가 볼게요.'},
 {t:[1150,150],s:'바꾼 기록은 <b>NAT 표</b>에 남아요. 실제로는 IP뿐 아니라 <b>포트</b>까지 바꿔서(<b>PAT</b>), 집 안 기기 여러 대가 공인 IP 하나를 나눠 써요.'+GP+'<b>포트</b>는 한 컴퓨터 안에서 어느 프로그램인지 가리키는 번호예요. 52310은 내 브라우저가 임시로 받은 번호, 443은 서버의 웹 프로그램 번호예요. 자세한 건 Ep. 19에서 봐요.'},
 {t:[1000,272],s:'"내 IP 확인" 사이트가 <code>ipconfig</code>와 다른 주소를 보여 주는 이유가 이거예요. 사이트는 바뀐 바깥 주소만 보거든요.'}],
/* Ep 9 · 인터넷을 건너 */
[{t:[440,384],s:'집 밖으로 나왔어요. 지도에 통신사(ISP)와 인터넷의 라우터들이 보여요.'+GP+'각 라우터는 목적지까지 전체 길을 몰라요. 경로표를 보고 <b>다음 한 칸(Next Hop)</b>만 정해요.'},
 {btn:'hop',s:'hop마다 패킷 라벨이 어떻게 바뀌는지 따라가 볼게요.'},
 {t:'label',s:'정리하면 <b>MAC은 hop마다</b> "이 구간의 출발 장비 → 다음 장비"로 바뀌어요. <b>IP는 끝까지</b> 그대로예요(공유기의 NAT는 빼고요).'+GP+'MAC은 이번 구간을, IP는 최종 목적지를 가리키니까요.'},
 {t:[685,408],s:'<code>tracert</code>(맥은 traceroute)는 패킷이 지나간 라우터 목록을 보여 줘요. IP가 바뀐 기록이 아니라 지나온 길이에요.'+GP+'"인터넷이 안 된다"는 대부분 "어느 구간에서 다음 칸을 못 정했나"의 문제예요.'},
 {t:[421,496],s:'목적지 서울 엣지까지 길이 이어졌어요. 그런데 이 길 위로 데이터를 <b>어떻게 나눠서, 빠짐없이</b> 보낼까요? 바다 위 <b>전송 계층 실험실</b>로 확대해 볼게요.'}],
/* Ep 10 · 요청은 바이트의 줄 */
[{t:[378,135],s:'전송 계층 실험실이에요. 왼쪽은 <b>우리 집 노트북</b>, 오른쪽은 <b>서울 엣지 서버</b>예요. 노트북의 브라우저가 www.shop.com에 보낼 요청을 들고 있어요.'},
 {t:[370,230],s:'브라우저(앱)는 네트워크 선을 직접 다루지 않아요. 대신 운영체제(OS)에게 <b>"이 데이터 보내 줘"</b>라고 맡겨요.'},
 {t:[330,329],s:'맡겨진 데이터는 OS 안의 <b>전송 계층(TCP · UDP)</b>으로 가요. 지금부터 확대해 볼 곳이 바로 여기예요.'},
 {t:[500,545],s:'Ep. 8~9에서 본 IP 덕분에 데이터는 서버 컴퓨터까지는 갈 수 있어요. 그런데 아직 질문 두 개가 남아 있어요.'},
 {t:[720,329],s:'① 네트워크는 데이터를 <b>섞거나 잃어버리기도</b> 해요. 원래 모습 그대로 받을 수 있을까?<br>② 서버 안엔 프로그램이 여럿이에요. <b>누구에게</b> 줘야 하지?'},
 {t:[330,329],s:'이 질문들의 답을 찾으러, 맡겨진 데이터 속으로 확대해 들어가 볼게요.'},
 {view:VTA1,t:()=>[W3.bx(1461)+W3.u/2,105.0],s:'데이터를 끝까지 확대하면 이렇게 생겼어요. 이 칸 하나가 <b>바이트</b>예요.'},
 {t:()=>[W3.bx(1461)+W3.u/2,105.095],s:'바이트 하나는 0과 1 <b>여덟 개</b>예요. 이 바이트는 <code>1110 1100</code>이고, 16진수로 짧게 쓰면 <code>EC</code>예요.'},
 {t:()=>[W3.bx(1461)+W3.u/2,104.83],s:'글자든 사진이든 전송 계층에겐 전부 이런 바이트의 줄일 뿐이에요. 내용이 뭔지는 신경 쓰지 않아요.'},
 {t:()=>[W3.bx(1461)+W3.u/2,105.22],s:'그런데 이 바이트 아래에 <b>1461</b>이라는 번호가 붙어 있죠? 이 번호는 무엇일까요?'},
 {view:VTA2,t:()=>[W3.bx(1461)+W3.u/2,104.6],s:'한 칸 줌아웃했어요. 바이트 1461 앞에도 뒤에도 바이트가 줄지어 있고, 모두 자기 번호를 달고 있어요.'},
 {view:VTA3,t:[300,105],s:'더 줌아웃하니 이 바이트들은 <b>5,840바이트짜리 줄</b>의 일부였어요. TCP는 바이트마다 1부터 번호를 붙여요. 이게 <b>순서번호(seq)</b>예요.'},
 {t:[300,105],s:'번호가 있으면 순서가 섞여 도착해도 다시 맞출 수 있고, 빈 번호가 있으면 <b>무엇이 빠졌는지</b> 알 수 있어요.'},
 {t:()=>[(W3.bx(1461)+W3.bx(2921))/2,142],s:'또 한 번에 실을 수 있는 크기가 정해져 있어서, TCP는 <b>1460바이트(MSS)씩</b> 잘라요. 아래 주황 줄이 그 <b>조각</b>이에요. 아까 바이트 1461은 조각2의 첫 바이트였어요.'},
 {t:()=>[(W3.bx(1461)+W3.bx(2921))/2,142],s:'<b>MSS</b>(Maximum Segment Size)는 조각 하나에 담을 수 있는 <b>데이터의 최대 크기</b>라는 뜻이에요.'+GP+'헤더는 빼고 데이터만 센 값이라, 실제로 나가는 세그먼트는 여기에 헤더만큼 더 커요. 이 값은 연결을 맺을 때(SYN) 양쪽이 서로 알려 줘요.'},
 {t:()=>[(W3.bx(1201)+W3.bx(3101))/2,68],s:'위 보라 줄은 앱이 OS에 <b>한 번에 맡긴 덩어리</b>예요. 앱 마음대로라 크기가 제각각이에요.'},
 {t:()=>[(W3.bx(1201)+W3.bx(3101))/2,68],s:'덩어리는 왜 생길까요? 앱은 보낼 데이터를 처음부터 다 갖고 있지 않아요. 채팅 앱은 메시지를 입력할 때마다, 파일 전송 앱은 디스크에서 읽어 온 만큼씩 OS에 넘겨요.'+GP+'그때그때 <b>한 번 넘긴 묶음</b>이 덩어리라서 크기가 제각각이에요.'},
 {btn:'hiSend',hint:'아래 <b>위 줄 강조 · 아래 줄 강조 · 둘 다</b>를 눌러 두 줄을 번갈아 비교해 보세요.',s:'두 줄의 칸막이가 다르죠? 덩어리③은 조각 1·2·3에 걸쳐 잘려요. TCP는 조각만 관리하고 <b>덩어리 경계는 기억하지 않아서</b>, 받는 앱은 원래 덩어리를 알 수 없어요.'},
 {t:()=>[(W3.bx(1201)+W3.bx(3101))/2,68],s:'예를 들어 앱이 "아버지가"와 "방에들어가신다"를 따로 두 번 넘겨도, 받는 앱에는 <b>"아버지가방에들어가신다"</b>가 한 줄로 도착해요.'+GP+'원래 "아버지가 / 방에들어가신다"였는지 "아버지 / 가방에들어가신다"였는지, 받는 쪽은 알 수 없어요.'+GP+'그래서 앱은 메시지 앞에 <b>길이</b>를 적거나 끝에 <b>줄바꿈</b> 같은 구분자를 붙여서 직접 나눠요. Ep. 16의 HTTP가 바로 이렇게 해요(Content-Length · 빈 줄).'}],
/* Ep 11 · 세그먼트 만들기 */
[{t:[310,310],s:'잘라 낸 조각 앞에 <b>메모지(헤더) 20바이트</b>를 붙이면 <b>세그먼트</b>가 돼요. 지금 아는 칸은 <b>Sequence Number = 1461</b>, 이 조각의 첫 바이트 번호예요.'},
 {t:[660,342],s:'뒤쪽은 실제 데이터, 조각2의 바이트 1461~2920이에요.'},
 {t:[392,390],s:'나머지 칸은 아직 <b>?</b>예요. "이럴 땐 어떻게 하지?"라는 질문이 생길 때마다 하나씩 열려요.'},
 {btn:'card',s:'열린 칸은 오른쪽 위 <b>TCP 헤더 카드</b>에 모아 둘게요. 눌러서 펴 보면 지금까지 모은 칸과 뜻을 볼 수 있어요.'}],
/* Ep 12 · 엣지와 연결 맺고 끊기 */
[{view:VCAFE,btn:'tcp',s:'지도 위에서 보면 이렇게 연결부터 맺어요. TLS(Ep. 14) 전에 먼저 길을 놓는 거예요.'},
 {view:VTB,t:[230,300],s:'실험실로 돌아왔어요. 세그먼트는 두 끝 사이를 날아가는 중이었어요. 그럼 받는 쪽이 <b>잘 받았는지</b>는 어떻게 알까요?'},
 {t:[795,440],s:'받는 쪽은 "여기까지 받았어"를 돌려보내요. 이게 <b>ACK</b>이고, 헤더의 Acknowledgment Number 칸에 <b>다음에 받고 싶은 번호</b>를 적어요.'},
 {t:[205,440],s:'번호로 확인하려면 먼저 <b>서로의 시작 번호</b>를 알려 주고 확인해야 해요. 양쪽 OS는 이걸 각자의 <b>메모(상황판)</b>에 적어 둬요.'},
 {t:[500,420],s:'앞으로 <b>왕복</b>이라는 말이 자주 나와요. <b>RTT</b>(Round Trip Time)는 보낸 신호가 상대에게 갔다가 답(ACK)이 돌아오기까지 걸리는 시간이라는 뜻이에요.'+GP+'멀리 있고 거치는 장비가 많을수록 길어져요. 서울↔도쿄면 약 30ms, 서울↔미국 서부면 약 150ms예요. 타임라인의 TCP 30ms가 바로 이 왕복 1번이에요.'},
 {btn:'s3auto',s:'이 약속 과정이 <b>3-way handshake</b>예요. 시작 번호를 주고받고, 데이터를 보내고, 연결을 끝내는 것까지 따라가 볼게요.'},
 {t:[500,420],s:'정리하면, <b>연결은 선이 아니라 양쪽 메모</b>예요. SYN·FIN 같은 신호는 헤더의 <b>Flags</b> 칸에 적혀요. 악수는 3번이지만 기다리는 시간은 왕복 1번이에요.'},
 {t:[205,440],s:'헷갈리기 쉬운 것: 먼저 닫은 쪽은 <b>TIME_WAIT</b>으로 잠깐 기다리는 게 정상이에요. 반대로 <b>CLOSE_WAIT</b>이 계속 남아 있으면 내 앱이 닫지 않은 버그예요.'+GP+'이제 이 연결 위에 자물쇠를 걸 차례예요(Ep. 13~14).'}],
/* Ep 13 · TLS의 재료 */
[{t:[500,26],s:'엣지와 TCP 연결을 맺었어요(Ep. 12). 그런데 이 길은 집 밖 여러 장비(Ep. 9의 통신사 · IX 라우터)를 지나가요. 그 사이 누가 엿본다면? 지금 요청은 <b>평문</b>(암호화하지 않은 글)이라 다 보여요. 그래서 <b>TLS</b>로 감싸요.'+GP+'<b>TLS</b>(Transport Layer Security, 전송 계층 보안)는 오가는 데이터를 <b>암호화</b>하고, 상대가 <b>진짜 그 서버인지 확인</b>하는 규칙이라는 뜻이에요. https의 s가 바로 이거예요.'+GP+'TLS를 이해하려면 재료 세 가지를 먼저 알아야 해요.'},
 {t:[175,205],s:'① <b>대칭키 암호</b>: 같은 열쇠로 잠그고 열어요. 아주 빨라서 실제 HTTP 데이터는 전부 이걸로 잠가요.'+GP+'문제는 처음 보는 엣지 서버와 <b>열쇠를 어떻게 나누냐</b>예요. 열쇠를 그냥 보내면 도청자도 받아요.'},
 {t:[445,175],s:'② <b>공개키 · 서명</b>: 주인만 가진 <b>개인키</b>로 도장을 찍고, 누구나 가진 <b>공개키</b>로 "진짜 그 도장 맞네"를 확인해요.'+GP+'느려서 데이터를 잠그는 데는 안 쓰고, <b>상대가 진짜인지</b> 확인하는 데만 써요.'},
 {t:[500,446],s:'<b>인증서</b>는 "이 공개키는 www.shop.com의 것"이라고 믿을 만한 기관(CA)이 <b>서명해 준 문서</b>예요. Ep. 14에서 은행 사업자등록증으로 다시 만나요.'},
 {t:[825,76],s:'③ <b>키 교환(ECDHE)</b>: 열쇠를 보내지 않고, 공개값만 주고받아서 <b>양쪽이 같은 비밀</b>을 만들어요. 말로는 마술 같으니 진짜 숫자로 해 볼게요.'},
 {btn:'dh',s:'작은 숫자로 키 교환을 해 볼게요.'},
 {btn:'fs',s:'매 연결마다 a, b를 새로 고르는 게 왜 중요할까요?'},
 {t:[500,26],s:'정리: <b>③으로 열쇠를 만들고</b>, <b>②로 상대가 진짜인지 확인하고</b>, <b>①로 데이터를 잠가요</b>. TLS는 이 셋을 한 번의 악수에 묶은 절차예요.'}],
/* Ep 14 · 은행 창구의 악수 */
[{t:[500,26],s:'서울 엣지 안으로 들어왔어요. TLS 악수를 <b>은행 창구</b>로 비유해 볼게요. 손님(브라우저)이 은행(엣지)에게 "진짜 shop.com 맞아요?"를 확인하고, 둘만 아는 금고 비밀번호를 정하는 자리예요.'},
 {t:[240,420],s:'은행은 <b>사업자등록증(Leaf 인증서)</b>을 보여 줘요. 그건 <b>Intermediate CA</b>(중간 인증 기관)가 발급했고, 그 기관은 <b>Root CA</b>가 보증해요.'+GP+'<b>CA</b>(Certificate Authority, 인증 기관)는 "이 공개키는 이 도메인 것"이라고 도장을 찍어 주는 기관이라는 뜻이에요.'},
 {t:[240,395],s:'<b>Root CA</b>는 신뢰의 맨 꼭대기 기관이라는 뜻이에요.'+GP+'Apple · Microsoft · Google · Mozilla가 보안 심사를 통과한 수십 곳만 골라, 그 기관들의 <b>Root 인증서(공개키)</b>를 OS와 브라우저에 <b>처음부터 넣어서</b> 배포해요. 업데이트 때 목록도 같이 갱신돼요.'+GP+'그래서 내 컴퓨터에 이미 깔려 있어요. 맥이라면 <b>키체인 접근 → 시스템 루트</b>에서 직접 볼 수 있어요. 브라우저는 이 목록을 "무조건 믿는 출발점"으로 써요.'},
 {t:[640,470],s:'브라우저는 등록증을 받으면 <b>다섯 가지</b>를 확인해요. ① 체인 ② 이름 ③ 기간 ④ 폐기 여부 ⑤ 소유(개인키). 하나라도 실패하면 접속을 멈춰요.'},
 {btn:'hs',s:'실제 TLS 1.3 메시지 이름으로 창구 대화를 따라가 볼게요.'},
 {t:[500,200],s:'<b>TLS 1.2</b>는 "어떤 암호 쓸래?"를 먼저 정하고 나서 키를 교환해서 <b>2 RTT</b>가 걸렸어요. <b>1.3</b>은 브라우저가 "아마 이걸 쓰겠지" 하고 key_share를 <b>미리</b> 실어 1 RTT로 줄였어요. 약한 옛 암호도 전부 뺐어요.'},
 {btn:'forge',s:'인증서를 훔쳐 온 가짜 은행이라면?'},
 {btn:'down',hint:'아래 <b>다운그레이드</b>를 눌러 보세요.',s:'창구 사이에서 서류를 몰래 고치면?'},
 {btn:'clock',hint:'<b>PC 시계 오류</b> · <b>이름 불일치</b> · <b>중간 인증서 누락</b> 버튼으로 실제 오류 화면의 원인을 하나씩 확인해 보세요.',s:'실제로 자주 보는 인증서 오류는 대부분 ①~③에서 나요.'},
 {t:[881,95],s:'엣지는 <b>세션 티켓</b>(다음 접속 때 악수를 줄이는 재입장권)도 줬어요(오른쪽 기억 카드). 다음에 오면 첫 패킷에 요청을 바로 싣는 <b>0-RTT</b>가 돼요.'+GP+'단, 도청자가 그 패킷을 <b>복사해 다시 보내면(재전송)</b> 서버는 구분 못 해요. 그래서 0-RTT엔 GET처럼 <b>여러 번 해도 같은(멱등)</b> 요청만 실어요. 주문은 안 돼요.'},
 {t:[240,535],s:'인증서는 요즘 <b>Let\'s Encrypt</b>가 무료로, <b>90일</b>짜리로 줘요. 짧은 대신 자동 갱신해요. 아무 CA나 내 도메인 인증서를 못 만들게 DNS의 <b>CAA</b> 레코드로 "이 CA만"이라고 정해 둘 수 있어요.'},
 {t:'uc',s:'카드의 두 번째 불 <b>② TLS SNI</b>가 켜졌어요. ClientHello는 암호화 전이라 이 이름이 <b>보여요</b>.'}],
/* Ep 15 · 전선 위의 도청자 */
[{view:VWIRE,btn:'wire',s:'악수가 끝났으니 패킷들은 전선을 타고 서울 엣지로 가요. 지금까지 이 전선을 지나간 패킷들(DNS 쪽지 · ClientHello · 잠긴 레코드)을 다시 따라가 볼게요.'},
 {t:()=>WP.spy,s:'집 밖 전선 중간에 <b>도청자</b>가 매달려 있었어요. 패킷을 막지 않고 <b>복사만</b> 해 가서, 보내는 쪽도 받는 쪽도 눈치채기 어려워요.'+GP+'공용 Wi-Fi의 다른 손님, 같은 공유기를 쓰는 사람, 중간 장비를 다루는 쪽이 이런 자리에 설 수 있어요. HTTPS가 정말 다 숨겨 줄까요?'},
 {view:VY,btn:'peel',s:'도청자의 해부대예요. 복사한 패킷을 한 겹씩 벗겨 볼게요.'},
 {view:VTF,t:[100,250],s:'도청자가 한 겹씩 벗긴 건, 사실 보내는 쪽 OS가 한 겹씩 씌운 <b>봉투</b>예요. 전송 계층 실험실을 한 번 더 줌아웃해서 <b>계층 지도</b>로 볼게요.'+GP+'Ep. 10~12에서 본 바이트 · 세그먼트 · 연결은 전부 이 지도의 한 줄, <b>Transport(전송 계층)</b>에 있었어요.'},
 {t:[100,383],s:'그 아래는 Ep. 1~9에서 본 층이에요. <b>IP</b>는 컴퓨터까지, <b>MAC</b>은 다음 장비까지 데려다줘요. 포트 · 소켓은 그 컴퓨터 안의 <b>프로그램</b>까지예요(Ep. 19).'},
 {t:[907,330],s:'데이터는 아래 층으로 내려갈 때마다 봉투가 한 겹씩 씌워져요. 이걸 <b>캡슐화</b>라고 해요. 받는 쪽은 바깥 봉투부터 벗겨요.'+GP+'도청자의 해부대가 바로 이 순서였어요. 바깥 IP · TCP 봉투는 배달에 필요해서 평문이고, 그 안의 TLS 레코드부터 잠겨 있었죠.'},
 {t:[907,470],s:'한 번에 실을 수 있는 1500바이트(<b>MTU</b>)에서 IP · TCP 헤더 40바이트를 빼면 <b>1460</b>. Ep. 10의 MSS가 여기서 나온 숫자예요.'},
 {btn:'s7',s:'Ep. 10에서 본 바이트 1461이 들어 있는 조각 하나가 서버까지 가는 여정을 볼게요.'},
 {t:'tcard',s:'TCP 헤더 카드에 <b>헤더 길이(Offset)</b> 칸이 열렸어요. 이 카드 바깥에 IP · Ethernet 봉투가 한 겹씩 더 씌워져요.'},
 {view:VY,btn:'hide',s:'다시 해부대로 돌아왔어요. 보이는 것들을 더 숨길 수 있을까요?'},
 {t:'uc',s:'카드로 정리하면, host가 쓰인 세 곳 중 <b>① DNS · ② SNI</b>는 밖에서 보이고(DoH · ECH로 숨길 수 있음), <b>③ Host 헤더</b>는 처음부터 암호화 안쪽이에요. 경로 · 쿼리 · 쿠키도요.'+GP+'그래서 공용 Wi-Fi라도 HTTPS면 <b>내용</b>은 안전해요. 다만 <b>어느 사이트에 갔는지</b>는 남을 수 있어요.'}],
/* Ep 16 · 요청서 쓰기 */
[{t:[260,96],s:'이제 암호 터널 안에 넣을 <b>요청서</b>를 써요. 첫 줄은 <b>시작줄</b>: 메서드 <b>GET</b> · 경로 · 버전. 한글 쿼리는 UTF-8 바이트로 <b>%EB%B9%A8…</b> 인코딩돼요.'},
 {t:[150,140],s:'<b>Host</b> 헤더: host의 세 번째 쓰임이에요. IP 하나(13.0.0.5)에 사이트 수천 개가 살아서, "이 중 <b>누구</b>한테 온 건지"를 적어요. 이게 없으면 엣지가 어느 사이트 페이지를 줄지 몰라요.'},
 {t:[150,228],s:'나머지 헤더는 "나에 대한 정보와 바람"이에요. <b>User-Agent</b>(누가), <b>Accept</b>(어떤 형식 원함), <b>Accept-Encoding: gzip, br</b>(압축해서 보내 줘).'},
 {t:[70,316],s:'그리고 <b>빈 줄</b>. 줄 끝마다 보이지 않는 <b>\\r\\n(CRLF)</b>이 있고, 두 번 연속이면 "헤더 끝"이에요.'+GP+'Ep. 10에서 본 것처럼 TCP는 메시지 경계를 기억하지 않아요. 그래서 HTTP가 직접 <b>빈 줄</b>로 "여기까지 헤더"를 표시하는 거예요.'},
 {t:[150,360],s:'GET은 가져오기만 하니 <b>본문이 없어요</b>. 본문이 있으면 <b>Content-Length</b>로 길이를 알려 줘요. Ep. 10의 "앞에 길이 적기"가 바로 이거예요.'},
 {btn:'pGet',s:'서버 파서가 이걸 어떻게 읽는지 볼게요.'},
 {btn:'pPost',s:'본문이 있는 요청은요?'},
 {btn:'pBad',s:'길이를 틀리게 적으면?'},
 {btn:'pNob',s:'빈 줄을 빼먹으면?'},
 {t:[255,432],s:'길이를 미리 모를 때(스트리밍 · AI 답변처럼 생성하면서 보낼 때)는 <code>Transfer-Encoding: chunked</code>로 조각마다 크기를 붙여요. 0 크기 조각이 "끝"이에요.'+GP+'요청서가 완성됐어요. 이제 TLS로 <b>잠가서</b> 엣지로 보내요.'},
 {t:'uc',s:'세 번째 불 <b>③ Host 헤더</b>가 켜졌어요. 이번엔 <b>잠긴 요청서 안</b>이라 도청자는 못 봐요.'+GP+'이제 이 요청서가 엣지에 도착해 바다 건너 원본 서버까지 가요.'}],
/* Ep 17 · 바다 건너 원본으로 */
[{t:[360,500],s:'Ep. 16에서 잠근 요청서가 <b>서울 엣지</b>에 도착했어요. 엣지가 TLS를 풀고(<b>TLS 종료</b>) 자기 캐시를 봐요. 상품 페이지는 재고 · 가격이 바뀌어서 캐시가 없어요. <b>원본에 물어봐야</b> 해요.'},
 {view:VSEA,t:[540,330],s:'엣지가 해저 케이블을 건너 미국 원본으로 대신 요청해요. 엣지와 원본 사이엔 <b>미리 열어 둔 연결</b>이 있어서 악수를 다시 안 해요. 나는 가까운 엣지와만 악수한 셈이에요.'},
 {view:VTD,t:[500,290],s:'이 길을 전송 계층 실험실에서 더 줌아웃해 볼게요. TCP가 믿는 "파이프"는 논리적 연결일 뿐이고, 실제 조각은 이 아래 <b>라우터들</b>을 지나가요. 라우터는 연결을 전혀 몰라요.'},
 {t:[500,520],s:'여러 사람이 지나가는 <b>병목 라우터</b>는 대기열이 차면 늦어지고, 넘치면 조각을 버려요. 받는 쪽은 멀쩡해도 <b>길이 막힐</b> 수 있는 거예요. 바다를 건너는 긴 길일수록 이런 구간이 많아요.'},
 {t:[500,568],s:'그림의 큐 8칸은 이해를 돕기 위한 <b>개념상의 크기</b>예요. 실제 라우터 큐는 장비마다 다르고 보통 패킷 수백~수천 개를 담아요.'+GP+'큐가 차는 이유는 <b>들어오는 양이 나가는 속도보다 많을 때</b>예요.'+GP+'이 라우터는 100 Mbps로만 내보낼 수 있는데, 나와 다른 사용자 A·B가 동시에 보내면 남는 패킷이 줄을 서요.'},
 {t:'graph',s:'TCP는 라우터에게 묻지 않고 <b>손실과 지연을 보고 스스로 판단</b>해서 한 번에 보내는 양 <b>cwnd</b>를 조절해요. cwnd는 헤더에 없고, 보내는 쪽 OS가 혼자 들고 있는 값이에요.'},
 {t:'graph',s:'그래프의 두 선을 먼저 볼게요. 주황 실선 <b>cwnd</b>(혼잡 윈도우)는 ACK를 기다리지 않고 한 왕복에 보낼 수 있는 조각 수예요.'+GP+'Ep. 22에서 볼 rwnd가 <b>받는 쪽</b> 사정이라면, cwnd는 <b>길(네트워크)</b> 사정을 보고 보내는 쪽이 스스로 정한 한도예요.'},
 {t:'graph',s:'파란 점선 <b>ssthresh</b>는 "여기부터는 조심"이라는 경계선이에요. 아래면 왕복마다 <b>2배</b>, 닿으면 <b>1개씩</b> 늘려요.'+GP+'경계는 처음엔 OS가 정한 큰 값(여기선 16)이고, 손실이 날 때마다 <b>그때 cwnd의 절반</b>으로 다시 그어요.'+GP+'"지난번 이만큼에서 막혔으니 그 절반부터 조심하자"는 기억이에요.'},
 {btn:'simDemo',hint:'아래 <b>cwnd 따라가기</b>를 누르거나, <b>▶ / ⏸ cwnd</b>로 직접 돌리면서 <b>일부 잃기 · 전부 잃기</b>를 눌러 보세요.',s:'한 왕복마다 cwnd개를 묶어 보내 볼게요. 주황 상자 하나가 한 번에 보낸 묶음이에요.'},
 {t:'graph',s:'정리: 처음엔 <b>2배씩</b> 빠르게 늘리고, 경계를 넘으면 <b>1씩</b> 조심스럽게. 일부를 잃으면 <b>절반</b>, 아무 응답이 없으면 <b>1</b>로. 천천히 올리고 급히 내리는 이 규칙 덕분에 모두가 공평하게 나눠 써요.'}],
/* Ep 18 · 데이터센터 입구 */
[{t:[763,136],s:'바다를 건너 <b>미국 데이터센터</b>에 도착했어요. 원본 쇼핑몰은 클라우드(AWS 등) 안에 있어요. 안으로 들어가 볼게요.'},
 {view:VVPC,t:[180,44],s:'데이터센터 안으로 들어왔어요. 여기는 <b>VPC</b>, 클라우드 안에 직접 설계하는 가상 네트워크예요. 주소 범위는 10.0.0.0/16이에요.'},
 {t:[305,92],s:'VPC 안은 Ep. 2에서 본 것처럼 <b>서브넷</b>으로 쪼개져 있어요. 인터넷과 맞닿는 <b>Public Subnet</b>과, 밖에서 직접 못 들어오는 <b>Private Subnet</b>이에요.'},
 {t:[42,300],s:'VPC의 출입문은 <b>인터넷 게이트웨이(IGW)</b>예요. Public Subnet의 경로표가 "0.0.0.0/0 → IGW"라서 인터넷과 바로 오가요.'},
 {t:[385,142],s:'Private Subnet의 경로표는 "0.0.0.0/0 → <b>NAT 게이트웨이</b>"예요. 밖으로 나갈 수는 있지만, 우리 집 공유기(Ep. 8)처럼 밖에서 먼저 들어올 수는 없어요.'},
 {btn:'vpc',s:'엣지가 보낸 요청이 VPC 안에서 어디로 가는지 따라가 볼게요.'},
 {t:[885,120],s:'서버 앞의 빨간 점선은 <b>Security Group</b>, 클라우드 방화벽이에요. 규칙은 "무엇을 막을까"가 아니라 <b>"무엇만 허용할까"</b>로 써요. 여기선 443만 허용이에요.'+GP+'<b>443</b>은 Ep. 8에서 잠깐 본 <b>포트</b> 번호예요. HTTPS(자물쇠가 달린 웹)를 받는 번호라, "443만 허용"은 웹 요청만 들여보낸다는 뜻이에요.'},
 {view:VD,t:[165,115],s:'입구의 <b>로드밸런서(LB, nginx)</b>를 바다 쪽 상황판에서 크게 볼게요. LB는 서버들 앞에서 요청을 받아 뒤로 나눠 주는 대리인, <b>리버스 프록시</b>예요. 서울 CDN 엣지도 사실 리버스 프록시예요.'},
 {t:[165,115],s:'<b>포워드 프록시</b>는 반대편에 있어요. 회사 · 학교망에서 <b>내 쪽 앞</b>에 서서 "나 대신 밖에 나가 주는" 대리인이에요.'+GP+'서버를 숨기면 리버스, 클라이언트를 숨기면 포워드. 둘 다 중간자인데 <b>누구 편</b>이냐가 달라요.'},
 {t:[500,115],s:'앱 서버(FastAPI)가 받은 요청의 출발 IP는 내가 아니라 <b>LB</b>예요(그 앞은 엣지였고요). 그래서 프록시들은 <code>X-Forwarded-For</code> 헤더에 원래 손님 IP를 적어 넘겨요.'},
 {view:VSS,t:[500,76],s:'요청이 앱 서버 안으로 들어가요. 서버 안에도 방화벽이 또 있어요. ufw나 Windows 방화벽 같은 <b>호스트 방화벽</b>이에요.'+GP+'클라우드와 호스트, <b>두 겹 모두</b> 통과해야 접속돼요. 한쪽만 열어 두고 "안 된다"고 하는 경우가 가장 많아요.'}],
/* Ep 19 · 서버 안의 프로그램들 */
[{t:[525,278],s:'서버 안까지 왔어요. 이 서버엔 SSH, 웹 서버, Redis, FastAPI가 동시에 떠 있어요. 도착한 패킷을 누구에게 줄지 정하는 게 <b>포트</b>예요.'},
 {t:[295,278],s:'IP가 "어느 컴퓨터"라면 포트는 "그 컴퓨터의 어느 프로그램"이에요. 443은 HTTPS, 22는 SSH처럼 번호가 정해진 것들이 있어요.'},
 {t:[500,125],s:'포트는 0~65535예요. 0~1023은 <b>Well-known</b>, 1024~49151은 <b>Registered</b>, 49152~65535는 <b>Dynamic</b> 번호예요.'+GP+'내 노트북의 출발 포트 52310처럼, 클라이언트 쪽 포트는 OS가 Dynamic 범위에서 자동으로 골라 줘요.'},
 {t:'label',s:'그래서 연결 하나는 <b>출발지 IP · 출발지 포트 · 목적지 IP · 목적지 포트</b>, 네 값으로 구분돼요. 이 네 값을 <b>4-tuple</b>이라고 하고, 이 조합을 그대로 <b>소켓</b>이라고 부르기도 해요(정확한 뜻은 이 에피소드 끝에서 다시 정리해요).'+GP+'서버는 <b>443 포트 하나</b>로 손님 수천 명과 동시에 연결해요. 목적지가 같은 443이어도 보낸 쪽 IP나 포트가 다르면 다른 연결이에요. 브라우저 탭 두 개도 출발 포트만 달라도(52310, 52311) 서로 다른 연결이에요.'},
 {t:[295,322],s:'마지막 열쇠는 <b>bind</b>예요. 프로그램이 "어느 인터페이스의 몇 번 포트에서 받을지" 정하는 거예요. 웹 서버는 <b>0.0.0.0:443</b>, 곧 모든 인터페이스에서 받아요.'},
 {t:[755,322],s:'Redis와 FastAPI는 <b>127.0.0.1</b>에 bind했어요. Loopback에서만 받으니 서버 자신만 접속할 수 있어요.'+GP+'밖에서 온 패킷은 NIC로 들어오니까 이 둘에겐 닿지 않아요. 그래서 웹 서버(nginx)가 443으로 받아서 안쪽 FastAPI로 넘겨줘요.'},
 {t:[805,520],s:'헷갈리는 주소 넷을 정리하면, <b>localhost</b>는 이름, <b>127.0.0.1</b>은 그 이름이 가리키는 나 자신, <b>0.0.0.0</b>은 bind할 때 "모든 인터페이스", <b>192.168.0.23</b> 같은 사설 IP는 실제 인터페이스의 주소예요. Ep. 1의 localhost가 바로 이 그림이에요.'},
 {view:VTE,t:[246,135],s:'이 원리를 전송 계층 실험실에서 더 자세히 볼게요. 실험실의 서버는 서울 엣지지만, 엣지든 원본이든 OS 안 구조는 같아요. 컴퓨터 안엔 프로그램이 여럿인데, 누구에게 줄지는 어떻게 알까요?'},
 {t:[136,470],s:'프로그램마다 <b>포트</b> 번호가 있다는 건 이 에피소드 앞부분에서 봤죠. 헤더 카드의 <b>Src/Dst Port</b> 칸이 드디어 열렸어요. 조각마다 "어느 프로그램에서 어느 프로그램으로"가 적혀 가요.'},
 {t:[870,250],s:'TCP는 도착한 조각을 <b>4-tuple</b>(출발지 IP · 출발지 포트 · 목적지 IP · 목적지 포트)로 맞춰 봐요. 목적지가 같은 443이어도 보낸 쪽 IP나 포트가 다르면 다른 연결로 나눠 담아요.'},
 {t:[870,250],s:'그래서 내 브라우저 탭 두 개도 OS가 출발지 포트를 따로(52310, 52311) 골라 줘서 서로 다른 연결이 돼요. 참고로 UDP는 연결이 없어서 <b>목적지 IP·포트 두 값</b>만 보고 나눠요.'},
 {btn:'s5b',s:'여러 프로그램의 데이터가 어떻게 모이고 나뉘는지 볼게요.'},
 {t:[603,440],s:'서버는 443 하나 위에 손님 받는 <b>listen</b> 1개와, 손님마다 연결 1개씩을 가져요. listen 뒤엔 대기열이 두 개 있어요.'},
 {t:[603,440],s:'<b>listen 소켓</b>은 데이터를 주고받지 않는 <b>접수 창구</b>예요.'+GP+'서버 앱이 이 에피소드 앞부분에서 본 bind()로 443번을 잡고 listen()을 부르면 생기고, 하는 일은 새 손님의 SYN을 받아 악수를 처리하는 것뿐이에요.'+GP+'악수가 끝나면 그 손님 전용 <b>연결 소켓</b>을 새로 만들어 넘기고, 자신은 계속 다음 손님을 기다려요.'},
 {btn:'s5a',s:'새 손님이 오면 어떻게 되는지 볼게요.'},
 {btn:'rw',s:'이제 앞에서 이름 없이 부르던 것들에 <b>정식 이름</b>을 붙일 차례예요. Ep. 10~12 장면들로 되감아 볼게요.'},
 {t:[136,470],s:'정리: 이름 없이 본 "Client 쪽 끝"이 <b>소켓</b>이고, 앱에겐 <b>fd</b> 번호 하나로 보여요. 소켓은 OS 안에 계속 있는 창구, 세그먼트는 그 창구로 오가는 편지예요.'},
 {t:[136,470],s:'<b>fd</b>(file descriptor)는 OS가 앱에게 건네는 <b>번호표</b>예요. 앱은 소켓 안을 직접 만지지 못하고 "3번에 이거 보내 줘"처럼 이 번호로만 OS에 부탁해요.'+GP+'0~2번은 키보드 입력·화면 출력용으로 미리 열려 있어서 소켓은 보통 3번부터 받아요.'}],
/* Ep 20 · 상태 코드는 누가 만드나 */
[{t:[300,394],s:'이제 앱 서버가 요청을 처리해요. 응답의 <b>상태 코드</b>는 누가 만들까요? 아래 표처럼 <b>층마다</b> 달라요. 코드를 보면 <b>어느 층에서 멈췄는지</b>가 보여요.'},
 {btn:'k502',hint:'아래 <b>상태 코드 버튼 아홉 개</b>를 아무거나 눌러 보세요. 패킷이 어디까지 갔다가, 누가 코드를 만들어 돌려보내는지 보여요.',s:'먼저 502부터 볼게요.'},
 {btn:'k401',s:'401과 403은 헷갈리기 쉬워요.'},
 {t:[830,540],s:'정리: <b>2xx</b> 성공 · <b>3xx</b> 다른 곳으로 · <b>4xx</b> 요청 쪽 문제(고쳐서 다시) · <b>5xx</b> 서버 쪽 문제(기다리거나 서버를 고침).'+GP+'이번엔 정상이라 앱이 <b>200 OK</b>와 HTML을 만들었어요. 답장이 돌아가요.'}],
/* Ep 21 · 답장 쓰기 */
[{t:[600,96],s:'답장이 원본 → 바다 → 엣지를 거쳐 노트북에 도착했어요(돌아오는 길의 조각들은 Ep. 22에서 자세히 봐요). HTTP/2라서 상태줄엔 <b>200</b>만 있고 "OK" 같은 설명 문구가 없어요. 헤더 이름도 소문자예요. 뜻은 1.1과 같아요.'},
 {t:[650,140],s:'<b>content-type: text/html; charset=utf-8</b>. 본문이 HTML이고, 바이트를 <b>UTF-8</b> 규칙으로 읽으라는 뜻이에요.'},
 {btn:'charset',s:'charset이 틀리면 어떻게 될까요?'},
 {t:[620,184],s:'<b>content-encoding: br</b>. 요청 때 "압축해 줘"(Accept-Encoding)라고 했더니 Brotli로 압축해 보냈어요. HTML이 1/5쯤으로 줄어요.'},
 {t:[640,228],s:'<b>cache-control: max-age=60</b>과 <b>etag: "v7"</b>은 "이걸 얼마나 오래, 어떤 이름표로 기억할지"예요.'},
 {btn:'cache',s:'시간을 흘려 가며 다시 열어 볼게요.'},
 {btn:'css',s:'캐시를 길게 잡았다가 생기는 사고도 있어요.'},
 {t:[700,316],s:'<b>strict-transport-security</b>(HSTS, HTTP Strict Transport Security): "앞으로 2년간 shop.com은 <b>https로만</b> 와". 다음에 주소창에 shop.com만 쳐도 브라우저가 http로 나가지 않고 바로 https로 가요. 첫 http 요청을 가로채는 공격을 막아요.'},
 {t:'mc',s:'오른쪽 <b>브라우저의 기억</b> 카드에 DNS · TLS 티켓 · HSTS · HTTP 캐시가 쌓였어요. 다음 방문이 빨라지는 재료예요(Ep. 26).'},
 {view:VN,t:[292,200],s:'화면에 머그컵 페이지가 그려졌어요. 하지만 HTML 안에 CSS · JS · 이미지 링크가 있어서 브라우저는 <b>수십 개 요청</b>을 더 보내요. 그 방법이 Ep. 24의 HTTP 버전 이야기예요.'}],
/* Ep 22 · 답장이 돌아오는 길 */
[{t:[30,640],s:'답장 HTML은 여러 조각으로 나뉘어 돌아와요. 실험실 그림은 노트북이 보내는 쪽이지만, 답장도 <b>방향만 반대</b>일 뿐 똑같아요.'+GP+'조금 더 줌아웃하니 양쪽에 <b>버퍼</b>가 보여요. 보내는 쪽은 ACK를 받기 전까지 <b>사본을 지우지 않고</b> 들고 있어요. 다시 보내야 할 수도 있으니까요.'},
 {t:[970,640],s:'받는 쪽 버퍼는 도착한 조각을 쌓아 두고, 앱이 꺼내 가요. 그런데 중간 조각 하나가 사라지면 어떻게 될까요?'},
 {btn:'s4b',s:'중간 조각이 사라지는 상황을 볼게요.'},
 {btn:'s4t',s:'이번엔 <b>마지막</b> 조각이 사라지는 경우예요. 뒤에 오는 조각이 없으면 어떻게 될까요?'},
 {t:[970,640],s:'정리: 손실은 <b>중복 ACK</b>(빠름)나 <b>타임아웃</b>(느리지만 확실)으로 알아채고 다시 보내요. 깨진 조각도 <b>Checksum</b> 칸 검사에 걸려 버려지고, 똑같이 재전송돼요.'},
 {t:[970,640],s:'반대로 같은 조각이 <b>두 번</b> 도착할 때도 있어요. 예를 들어 ACK가 늦게 와서 보내는 쪽이 타임아웃으로 이미 도착한 조각을 또 보낸 경우예요.'+GP+'받는 쪽은 <b>Sequence Number</b>를 보고 "이미 받은 번호"면 조용히 버리고, ACK만 다시 보내요. 그래서 앱에는 한 번만 올라가요.'},
 {view:VTB6,t:[30,640],s:'그런데 조각 하나 보내고 ACK를 기다리고… 이러면 너무 느리지 않을까요? 직접 비교해 볼게요.'},
 {btn:'s4s',s:'먼저 <b>하나씩 기다리는</b> 방식이에요.'},
 {btn:'s4a',s:'이번엔 ACK를 기다리지 않고 <b>미리 보내도 되는 범위</b>, <b>윈도우</b>로 보내 볼게요.'},
 {t:[970,707],s:'윈도우를 무작정 키우면 받는 쪽 버퍼가 넘쳐요. 그래서 받는 쪽은 매 ACK의 <b>Window</b> 칸에 <b>남은 공간(rwnd)</b>을 적어 보내요. Ep. 17의 cwnd가 길 사정이라면 rwnd는 받는 쪽 사정이에요.'},
 {btn:'s4c',s:'받는 앱이 데이터를 꺼내 가지 않으면 무슨 일이 생기는지 볼게요.'},
 {t:[30,707],s:'정리: 처리량은 대략 <b>윈도우 ÷ 왕복 시간</b>이에요. 그리고 rwnd가 0이 되는 원인은 대부분 네트워크가 아니라 <b>받는 앱이 느린 것</b>이에요.'}],
/* Ep 23 · 로그인과 주문 */
[{t:[835,260],do:()=>dset('ses','a8f3 → 7번 회원',C.purpleD),s:'마음에 들어서 로그인했어요. <code>POST /login</code>에 앱이 <code>Set-Cookie: sid=a8f3; HttpOnly; Secure; SameSite=Lax</code>로 답했어요. 브라우저는 이 쿠키를 <b>매 요청마다</b> 자동으로 붙여요.'+GP+'HTTP는 원래 요청끼리 서로 모르는(무상태) 규칙이라, "아까 그 사람"을 기억하려면 이런 표가 필요해요.'},
 {btn:'logout',s:'세션과 JWT, 로그아웃할 때 차이가 커요.'},
 {t:[500,115],s:'주문 전에 <b>메서드</b>를 정리해요.<span class="ol"><b>GET</b> 읽기 · 안전 · 멱등<br><b>POST</b> 만들기 · 안전 ✕ · 멱등 ✕<br><b>PUT</b> 통째로 교체 · 멱등<br><b>PATCH</b> 일부 수정 · 멱등 보장 ✕<br><b>DELETE</b> 삭제 · 멱등</span>'+GP+'<b>안전</b> = 서버를 안 바꿈. <b>멱등</b> = 여러 번 해도 최종 상태가 같음. "재고를 5로"(PUT)는 멱등, "재고를 +1"(PATCH)은 아니에요.'},
 {t:[165,115],s:'주문 버튼은 <b>api.shop.com</b>을 불러요. 페이지(www)와 출처가 달라서 브라우저가 먼저 <code>OPTIONS</code>로 "이 출처에서 POST 해도 돼?"를 물어요(<b>CORS preflight</b>).'+GP+'서버가 <code>Access-Control-Allow-Origin: https://www.shop.com</code>으로 허락해야 진짜 요청이 나가요. 이건 서버가 아니라 <b>브라우저가 지키는</b> 규칙이에요.'},
 {btn:'dup',s:'이제 주문! 그런데 집 Wi-Fi가 잠깐 불안해요.'},
 {btn:'ikey',s:'어떻게 막을까요?'},
 {btn:'dbl',s:'마지막으로 더블클릭 문제예요.'},
 {t:[165,260],s:'주문 완료! 앱은 <b>201 Created</b>와 <code>Location: /orders/1001</code>로 "새로 만들었고 여기 있어요"라고 답했어요.'}],
/* Ep 24 · 이미지 12장 */
[{view:VTD,t:[880,442],s:'이미지 이야기 전에, 같은 길 위엔 <b>UDP</b>도 다녀요. 지금까지 본 악수·번호·확인·재전송·속도 조절을 <b>전부 빼고</b> 8바이트 헤더만 붙여요. 헤더 카드 아래에서 비교해 보세요.'},
 {btn:'udpgame',s:'게임은 내 위치를 계속 보내요. 하나가 버려지면 어떻게 될까요?'},
 {view:VQ,t:[500,26],s:'다시 Ep. 21의 페이지로 돌아가요. 머그컵 페이지엔 이미지가 12장 있어요. 같은 일을 HTTP 버전마다 어떻게 하는지 비교해요. 마지막 HTTP/3는 방금 본 <b>UDP</b> 위에서 돌아요.'},
 {btn:'lanes',s:'타임라인을 그려 볼게요.'},
 {btn:'loss',s:'HTTP/2도 완벽하지 않아요.'},
 {btn:'move',s:'휴대폰으로 보다가 집을 나서면서 생기는 일이에요.'},
 {t:[120,464],s:'버전은 어떻게 정할까요? TLS 악수의 <b>ALPN</b>(Ep. 14)에서 "h2"로 정해요. HTTP/3는 서버가 <code>Alt-Svc</code>로 광고한 뒤 다음 연결부터 써요.'+GP+'DevTools Network의 <b>Protocol</b> 열(http/1.1 · h2 · h3)에서 확인해요. "우리만 h3가 안 잡혀요"는 대개 방화벽이 <b>UDP 443</b>을 막아 TCP로 되돌아간 경우예요.'}],
/* Ep 25 · 이번엔 내가 서버 */
[{t:[200,270],s:'이제 Ep. 1의 질문으로 돌아갈게요. 내가 만든 미니 쇼핑몰(FastAPI)은 <b>127.0.0.1:8000</b>에 bind되어 있었어요. 그래서 localhost로는 되는데 친구는 안 됐던 거예요(Ep. 19의 Redis · FastAPI처럼요).'},
 {btn:'try',hint:'아래 <b>친구 접속</b>을 눌러 보고, <b>127 bind · 0.0.0.0 bind · 방화벽</b>으로 조건을 바꿔 가며 다시 시도해 보세요.',s:'같은 Wi-Fi의 친구가 직접 접속해 보게 할게요.'},
 {t:[200,270],s:'정리: <b>0.0.0.0은 "인터넷에 공개"가 아니라 "이 PC의 모든 인터페이스에서 받기"</b>예요.'+GP+'같은 방의 친구는 이걸로 접속할 수 있어요. 하지만 다른 동네 친구 앞에는 또 다른 벽이 있어요.'},
 {view:VW25,t:[92,438],s:'다른 동네 친구가 인터넷으로 내 노트북에 접속하면 어떻게 될까요? 내 노트북은 이미 0.0.0.0에 bind했고 방화벽도 열었어요.'},
 {btn:'in',s:'친구의 패킷을 따라가 볼게요.'},
 {t:[357,336],s:'막히는 이유는 세 가지예요.<span class="ol">① 공유기의 <b>NAT 표에 그 줄이 없어요</b>. 안에서 먼저 나간 적이 없으니 되돌릴 곳을 몰라요.<br>② 공유기 <b>방화벽</b>이 들어오는 연결을 기본으로 막아요.<br>③ 공인 IP도 ISP가 <b>가끔 바꿔요</b>.</span>'+GP+'"내 코드가 잘못됐나?"보다 "구조상 막혀 있나?"를 먼저 물어야 해요.'},

 {view:VZ,dt:1,t:'dtAuth',s:'<b>Request Headers</b>는 내가 보낸 요청서예요(Ep. 16). HTTP/2라서 Host 헤더가 <code>:authority</code>라는 이름으로 바뀌었고, 로그인한 뒤라 <code>cookie</code>도 실려 있어요(Ep. 23).',do:D({rows:1,sel:0,tab:'headers',hi:'req'})},
 {view:VZ,dt:1,t:'dtTiming',s:'<b>Timing</b> 탭을 열면 이 요청 하나가 어디서 시간을 썼는지 나와요. 줄마다 우리가 지나온 단계예요.'+GP+'DNS Lookup = DNS · Initial connection = TCP 악수(SSL 포함) · SSL = TLS 악수 · Waiting = 요청이 가서 서버가 답을 만들기까지 · Content Download = 본문 받기',do:()=>{DTX.show({rows:1,sel:0,tab:'headers',hi:'ttab'},true);DTX.later(950,()=>DTX.set({rows:1,sel:0,tab:'timing',hi:''}));}},
 {view:VZ,dt:1,t:'dtTTFB',s:'<b>Waiting for server response</b>(TTFB)가 길면 서버 처리나 원본까지의 거리, <b>DNS · Initial connection · SSL</b>이 길면 연결 문제예요. 왼쪽 위 "첫 바이트까지" 카드와 같은 숫자예요.',do:D({rows:1,sel:0,tab:'timing',hi:'ttfb'})},
 {view:VZ,dt:1,t:'dtClear',s:'한 번 더 열어 볼게요. 기록을 지우고(⊘) 다시 새로고침해요.',do:()=>{DTX.show({rows:1,sel:0,tab:'timing',hi:''},true);
   DTX.later(950,()=>{DTX.set({rows:0,sel:-1,hi:''});DTX.later(500,()=>{DTX.move('dtReload',true);DTX.later(950,()=>{DTX.set({rows:2,anim:1});DTX.later(800,()=>DTX.move('dtSt0'));});});});}},
 {view:VZ,dt:1,t:'dtSt0',s:'두 번째는 달라요. 문서는 <b>304</b>예요. 브라우저가 etag로 "바뀌었나요?"라고 물었고 서버가 "그대로예요"라고 답했어요. CSS · JS · 이미지는 <b>(memory cache)</b>, 아예 묻지도 않았어요.'+GP+'그래서 159 kB였던 전송량이 724 B로 줄었어요. 가장 빠른 요청은 안 보내는 요청이에요.',do:D({rows:2,sel:-1,hi:'st0'})},
 {view:VZ,dt:1,t:'dtTTFB',s:'304 요청의 Timing에는 <b>DNS Lookup · Initial connection · SSL</b> 줄이 아예 없어요. 아까 맺은 연결을 그대로 다시 쓰는 중(Keep-Alive)이라는 뜻이에요. 그래서 182ms가 34ms로 줄었어요.',do:D({rows:2,sel:0,tab:'timing',hi:'ttfb'})},
 {view:VZ,dt:1,t:'dtDC',s:'반대로 "지금 보는 화면이 방금 배포한 새 버전일까?"가 궁금하면 <b>Disable cache</b>를 켜고 새로고침해요. 캐시를 쓰지 않고 전부 서버에서 다시 받아요.'+GP+'그다음 문서의 <code>last-modified</code>와 <code>etag</code>를 보면 어느 버전을 받았는지 알 수 있어요.',do:()=>{DTX.show({rows:2,sel:-1,hi:'dc'},true);DTX.later(950,()=>{DTX.set({rows:0,dc:1,hi:''});DTX.later(450,()=>DTX.set({rows:3,dc:1,anim:1}));});}}];

LEG.push([27,"DevTools · Network","브라우저가 주고받은 요청을 하나씩 기록하는 창. 요청을 누르면 Headers(무엇을 주고받았나)와 Timing(어디서 시간을 썼나)이 나와요.",4],
 [27,"TTFB","Time To First Byte. 요청을 보내고 응답 첫 바이트가 올 때까지. 길면 서버 처리나 원본까지의 거리를 의심해요.",4],
 [27,"304 · (memory cache)","304는 서버에 '바뀌었나요?'라고 물어 '그대로'를 받은 것, (memory cache)는 아예 묻지 않고 저장본을 쓴 것.",4]);
