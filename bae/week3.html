body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.7;overflow:hidden}
header{height:64px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.brand{white-space:nowrap}
.brand b{display:block;font-size:15px;line-height:1.3}
.brand span{font-size:12px;color:var(--tx3)}
nav{display:flex;gap:5px;overflow-x:auto;flex:1;padding:4px 0;scrollbar-width:none}
nav button{flex:none;display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--bd);color:var(--tx2);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--tx3)}
nav button:hover{border-color:var(--bd2);color:var(--tx)}
nav button.on{background:var(--or);border-color:var(--or);color:#FFF8F0}
nav button.on i{color:#FFE3D4}
nav .sep{flex:none;color:var(--bd2);font-size:11px;align-self:center}
main{display:block;height:calc(100% - 64px)}
.stage{height:100%}
#ptr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#ptr .tip{animation:tipP 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tipP{50%{transform:scale(1.35)}}
.guide{position:absolute;left:40px;top:70px;width:0;height:0;transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:8}
.guide svg{position:absolute;left:-3px;top:-3px;overflow:visible;transform-origin:3px 3px;transition:transform .35s;filter:drop-shadow(2px 3px 2px rgba(61,43,31,.28))}
.guide.o1 svg{transform:scaleX(-1)}.guide.o2 svg{transform:scaleY(-1)}.guide.o3 svg{transform:scale(-1,-1)}
.guide .ring{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--or);opacity:0}
.guide.click .ring{animation:ring .9s ease-out}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.8);opacity:0}}
.guide.idle svg{animation:wig 2.6s ease-in-out infinite}
@keyframes wig{50%{translate:3px 3px}}
.bub{position:absolute;left:110px;top:60px;width:360px;background:#FFFDF8;border:2px solid var(--or);border-radius:14px;padding:11px 15px;font-size:15px;line-height:1.65;color:var(--tx);transition:left .8s cubic-bezier(.4,0,.2,1),top .8s cubic-bezier(.4,0,.2,1);z-index:6;box-shadow:0 6px 18px rgba(61,43,31,.12)}
.bub b{font-weight:500;color:var(--orD)}
.bub .gap{display:block;height:.6em}
.bub .ghint{display:block;margin-top:6px;font-size:13px;color:var(--tx2)}
.btn.pulse{animation:bp 1.2s ease-in-out infinite}@keyframes bp{50%{box-shadow:0 0 0 5px rgba(217,119,87,.28)}}
.bar{position:absolute;left:12px;right:12px;bottom:10px;min-height:56px;display:flex;align-items:center;gap:7px;padding:8px 10px;background:rgba(251,248,242,.95);border:1px solid var(--bd);border-radius:12px;z-index:7;overflow-x:auto}
.bar .bpos{font-family:var(--mono);font-size:12.5px;color:var(--tx2);min-width:46px;text-align:center}
.bar .sep{width:1px;align-self:stretch;background:var(--bd);margin:0 4px}
.bar .simLab{font-size:12px;color:var(--tx3);white-space:nowrap}
.simBtns{display:flex;gap:6px;flex-wrap:nowrap}
button.btn.sm{font-size:12.5px;padding:6px 10px;white-space:nowrap}
#bAuto.on{background:var(--orL);border-color:var(--or);color:var(--orD)}
.scope span{color:var(--tx3)}
.gp{position:absolute;left:16px;top:56px;width:320px;background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;padding:8px 10px;display:none;z-index:4}
.gpT{font-size:12px;color:var(--tx2)}

.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#FDF9F1 0%,#F2EADC 78%)}
#sv{width:100%;height:100%;display:block;user-select:none}
#sv text{font-family:var(--font)}
#sv .mono{font-family:var(--mono)}
#sv text{paint-order:stroke fill;stroke:#FBF6EC;stroke-width:.3em;stroke-linejoin:round}
#sv text.nohalo{stroke:none}
.cap{position:absolute;left:215px;right:165px;bottom:12px;margin:0 auto;width:fit-content;max-width:calc(100% - 380px);background:rgba(61,43,31,.9);color:#FFF8F0;font-size:14.5px;line-height:1.55;padding:9px 16px;border-radius:10px;display:none;text-align:center;pointer-events:none}
.cap.show{display:block}
.ns{vector-effect:non-scaling-stroke}
#sv.hiSend .mssMark{opacity:.15}
#sv.hiMss .sendMark{opacity:.15}
.scope{position:absolute;left:16px;top:14px;font-size:13px;color:var(--tx2);background:rgba(255,253,248,.92);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;pointer-events:none}
.scope b{color:var(--tx);font-weight:500}
.hud{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;align-items:center;padding:6px;border-radius:12px;background:rgba(251,248,242,.9);border:1px solid var(--bd)}
.hint{position:absolute;right:16px;bottom:20px;font-size:12px;color:var(--tx3);pointer-events:none;background:rgba(251,248,242,.9);padding:3px 8px;border-radius:6px}
button.btn{background:var(--bg3);border:1px solid var(--bd2);color:var(--tx);font:inherit;font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;line-height:1.3}
button.btn:hover{border-color:var(--or)}
button.btn:disabled{opacity:.4;cursor:default}
button.btn.pri{background:var(--or);border-color:var(--or);color:#FFF8F0}
button.btn.pri:hover{background:#C9663F}
/* header card */
#rcol{position:absolute;right:16px;top:14px;width:350px;display:flex;flex-direction:column;gap:8px;z-index:4;max-height:calc(100% - 110px)}
.hc{position:relative;width:100%;flex:0 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;overflow:hidden}
.hcBtn{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:none;font:inherit;font-size:13px;color:var(--tx);padding:8px 12px;cursor:pointer;text-align:left}
.hcBtn b{font-weight:500}
.hcBtn .cnt{font-family:var(--mono);font-size:12px;color:var(--or)}
.hcBtn .chev{margin-left:auto;color:var(--tx3);transition:transform .25s}
.hc.open .chev{transform:rotate(180deg)}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--or);color:#FFF8F0;display:none}
.pill.show{display:inline-block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.hcBody{display:none;padding:2px 12px 12px;border-top:1px solid var(--bd)}
.hc.open .hcBody{display:block}
.hc .hcBody{overflow-y:auto;min-height:0}
.hcBtn{flex:none}
.lg{max-height:100%;display:flex;flex-direction:column;flex:0 1 auto;min-height:0}
.lg .hcBody{overflow-y:auto;min-height:0}
.lg.open .hcBody{display:block}
.lgI{padding:7px 0;border-bottom:1px solid var(--bd);font-size:12.5px;line-height:1.55;color:var(--tx2)}
.lgI:last-child{border-bottom:none}
.lgI b{color:var(--tx);font-weight:600;margin-right:6px}
.lgI.new b{color:var(--orD)}
.lgI.new b::after{content:'NEW';font-size:9.5px;font-weight:600;color:#FFF8F0;background:var(--or);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px}
.spd{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12.5px;color:var(--tx2);flex:none;padding-left:8px}
.spd input{width:90px;accent-color:#D97757}
.spd b{font-family:var(--mono);color:var(--orD);min-width:22px}
.hgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px}
.hf{border:1px dashed #D9CBB4;border-radius:6px;padding:4px 7px;min-height:44px;background:var(--bg4);transition:all .3s}
.hf .n{font-size:10.5px;color:var(--tx3);line-height:1.3}
.hf .v{font-family:var(--mono);font-size:12.5px;color:#B9A78F;line-height:1.5}
.hf .m{display:none;font-size:10.5px;color:var(--tx2);line-height:1.35}
.hf.on{border:1px solid #E8B9A3;background:var(--orL)}
.hf.on .n{color:#A9573A}.hf.on .v{color:var(--tx)}.hf.on .m{display:block}
.hf.new{border:2px solid var(--or);background:#F9D9C8}
.hf.new .v{color:#7A3115}
.hcNote{font-size:12px;color:var(--tx2);margin-top:8px;line-height:1.55}
.udp{display:none;margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd2)}
.udp.show{display:block}
.udp .hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.udp .hf{border:1px solid #CBB8E0;background:#F1EBF8}
.udp .hf .n{color:#6B4FA0}.udp .hf .v{color:var(--tx)}
/* panel */
aside{border-left:1px solid var(--bd);background:var(--bg2);overflow-y:auto;padding:22px 22px 48px}
.kicker{font-size:12px;color:var(--tx3);letter-spacing:.04em}
aside h2{font-size:24px;font-weight:700;margin:2px 0 8px;line-height:1.3}
.q{font-size:15px;color:var(--orD);background:var(--orL);border-left:3px solid var(--or);padding:8px 12px;margin:0 0 12px}
.q small{display:block;font-size:11.5px;color:#B56A4B}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--bd2);color:var(--tx2);background:var(--bg3)}
.body p{margin:0 0 10px}
.body ul{margin:0 0 10px 18px}
.body li{margin-bottom:5px}
.body b{font-weight:500;color:var(--orD)}
.body table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 10px}
.body td{border-bottom:1px solid var(--bd);padding:5px 4px;vertical-align:top}
.body td:last-child{font-family:var(--mono);font-size:12.5px;color:var(--orD);white-space:nowrap}
code{font-family:var(--mono);font-size:12.5px;background:#F3E6DA;padding:1px 5px;border-radius:4px;color:var(--orD)}
.ctrl{margin:14px 0 8px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg3)}
.ctrl .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .lab{font-size:12px;color:var(--tx3);margin-bottom:8px}
.note{font-size:14px;margin-top:10px;min-height:48px}
.log{font-size:13px;color:var(--tx2);margin:8px 0 0;min-height:20px}
.log div{padding:3px 0 3px 10px;border-left:2px solid var(--bd2);margin-bottom:4px}
.log div:first-child{border-left-color:var(--or);color:var(--tx)}
.readout{font-family:var(--mono);font-size:12.5px;margin-top:8px}
#g6{width:100%;height:auto;display:block;margin:8px 0 4px;background:var(--bg2);border-radius:8px;border:1px solid var(--bd)}
.tips{margin-top:18px;padding:12px 14px;border:1px solid #E8D3A8;border-radius:10px;background:#FBF3E2}
.tips h4{font-size:13px;color:#8A5A0A;margin-bottom:6px;font-weight:500}
.tips ul{margin-left:16px;font-size:13.5px}
.tips li{margin-bottom:6px}
.sum{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--orL);border:1px solid #E8B9A3;font-size:14px}
.sum b{display:block;font-size:12px;color:var(--or);font-weight:500;margin-bottom:2px}
.navrow{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
@media (max-width:960px){.brand span{display:none}#rcol{width:280px}.bub{font-size:14px}}

/* ===== PIXEL THEME ===== */
*{border-radius:0!important}
html,body{-webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;font-smooth:never}
body{font-size:13px;letter-spacing:0}
b,strong{font-weight:700!important}
header{border-bottom:3px solid var(--tx);background:#FBF3E4;height:64px}
.brand b{font-size:15px;color:var(--orD)}
nav button{border:2px solid var(--tx);box-shadow:2px 2px 0 var(--tx);font-size:12px;padding:3px 9px;background:#FFFBF2;color:var(--tx)}
nav button:hover{background:var(--orL)}
nav button.on{background:var(--or);border-color:var(--tx);color:#FFF8F0}
nav button i{color:var(--tx3)}
.stage{background-color:#F4ECDD;background-image:linear-gradient(90deg,rgba(61,43,31,.055) 2px,transparent 2px),linear-gradient(rgba(61,43,31,.055) 2px,transparent 2px);background-size:24px 24px}
#sv{shape-rendering:crispEdges;text-rendering:optimizeSpeed}
#sv text{shape-rendering:auto;stroke-linejoin:miter;stroke-width:.32em}
#sv rect{rx:0;ry:0}
#sv .ns[stroke-width="1"]{stroke-width:2px}
#sv .ns[stroke-width="1.5"]{stroke-width:2px}
.scope{border:2px solid var(--tx);box-shadow:3px 3px 0 var(--tx);background:#FFFBF2;font-size:12px}
.bub{border:3px solid var(--tx);box-shadow:6px 6px 0 var(--or);background:#FFFBF2;font-size:14px;line-height:1.75;padding:12px 16px;transition:none}
.bub b{color:var(--orD)}
.bub .ghint{font-size:12px;color:var(--tx2);border-top:2px dashed var(--bd2);padding-top:6px}
.bar{border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:#FBF3E4}
button.btn{border:2px solid var(--tx);box-shadow:3px 3px 0 var(--tx);background:#FFFBF2;font-size:12.5px;padding:6px 12px;transition:none}
button.btn:hover{background:var(--orL);border-color:var(--tx)}
button.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tx)}
button.btn.pri{background:var(--or);border-color:var(--tx);color:#FFF8F0}
button.btn.pri:hover{background:#C9663F}
button.btn:disabled{opacity:.45;box-shadow:none}
.btn.pulse{animation:bpx 1s steps(30) infinite}
@keyframes bpx{50%{box-shadow:3px 3px 0 var(--tx),0 0 0 4px var(--or)}}
#bAuto.on{background:var(--orL);color:var(--orD)}
.hc{border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:#FFFBF2;overflow:visible}
.hc .hcBody{border-top:2px solid var(--tx)}
.hcBtn .chev{transition:none}
.pill{border:2px solid var(--tx);font-size:10px;padding:0 6px}
.pill.show{animation:blinkpx 1.2s steps(36) infinite}
@keyframes blinkpx{50%{opacity:.35}}
.hf{border-radius:0}
.hf.on{border:2px solid var(--tx)}
.hf.new{border:2px solid var(--or);box-shadow:2px 2px 0 var(--orD)}
.lgI{border-bottom:2px dotted var(--bd2)}
.lgI.new b::after{border:1px solid var(--tx)}
.gp{border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:#FFFBF2}
code{border:1px solid var(--bd2)}
.spd input{-webkit-appearance:none;appearance:none;height:10px;background:var(--bg4);border:2px solid var(--tx);outline:none}
.spd input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:18px;background:var(--or);border:2px solid var(--tx);cursor:pointer}
.spd input::-moz-range-thumb{width:10px;height:16px;background:var(--or);border:2px solid var(--tx);border-radius:0;cursor:pointer}
.guide{transition:none}
.guide svg{left:0;top:0;transform-origin:0 0;transition:none;filter:drop-shadow(3px 3px 0 rgba(61,43,31,.35));shape-rendering:crispEdges}
.guide .ring{border:3px solid var(--or)}
.guide.click .ring{animation:ringpx .6s steps(18)}
@keyframes ringpx{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.8);opacity:0}}
.guide.idle svg{animation:wigpx 1.4s steps(42) infinite}
@keyframes wigpx{50%{translate:3px 3px}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bd2);border:2px solid var(--tx)}::-webkit-scrollbar-track{background:var(--bg4)}

/* ===== 가독성: 폰트별 설계 크기에 맞춤 ===== */
:root{--tx:#24170E;--tx2:#4F3D2E;--tx3:#7C6652}
body{font-size:12px}
.bub{font-family:'Galmuri14',var(--font);font-size:15px;line-height:1.8;color:var(--tx)}
.bub .ghint{font-family:var(--font);font-size:12px}
.lgI{font-family:'Galmuri14',var(--font);font-size:15px;line-height:1.7;color:var(--tx)}
.lgI b{font-family:var(--font);font-size:12px;display:block;margin:0 0 2px}
.lgI.new b::after{font-family:'Galmuri9',var(--font);font-size:10px}
nav button,button.btn,button.btn.sm,.scope,.hcBtn,.bar .simLab,.spd,.gpT,.hcNote,.brand span{font-size:12px}
.brand b{font-size:24px;line-height:1.15}
nav button i,.hcBtn .cnt,.bar .bpos,.spd b,.readout{font-size:12px}
.pill,.lgI.new b::after{font-family:'Galmuri9',var(--font);font-size:10px}
.hf .n,.hf .m{font-family:'Galmuri9',var(--font);font-size:10px;line-height:1.4}
.hf .v{font-size:12px}
code{font-size:12px}

/* 배속: 화면 전체에 적용 */
:root{--spd:1}
.btn.pulse{animation-duration:calc(1s / var(--spd))}
.pill.show{animation-duration:calc(1.2s / var(--spd))}
.guide.click .ring{animation-duration:calc(.6s / var(--spd))}
.guide.idle svg{animation-duration:calc(1.4s / var(--spd))}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Week 3 · TCP & UDP</b><span>질문을 따라 바이트 하나에서 전체 그림까지</span></div>
  <nav id="nav"></nav>
</header>
<main>
  <section class="stage" id="stage">
    <svg id="sv" xmlns="http://www.w3.org/2000/svg"></svg>
    <svg id="ptr" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="scope" id="scope"></div>
    <div id="rcol">
    <div class="hc" id="hc">
      <button class="hcBtn" id="hcBtn"><b>TCP 헤더 카드</b><span class="cnt" id="hcCnt">0 / 10칸</span><span class="pill" id="hcNew">NEW</span><span class="chev">▾</span></button>
      <div class="hcBody">
        <div class="hgrid" id="hgrid"></div>
        <div class="hf" id="hf-data" style="margin-top:4px"><div class="n">데이터 (payload)</div><div class="v">?</div><div class="m">MSS 크기로 자른 바이트 조각</div></div>
        <div class="hcNote" id="hcNote"></div>
        <div class="udp" id="udp"><div class="hcNote" style="margin:0 0 4px;color:#6B4FA0">UDP 헤더 (8바이트) — 이게 전부</div>
          <div class="hgrid"><div class="hf"><div class="n">Src Port</div><div class="v">50000</div></div><div class="hf"><div class="n">Dst Port</div><div class="v">53</div></div><div class="hf"><div class="n">Length</div><div class="v">48</div></div><div class="hf"><div class="n">Checksum</div><div class="v">0x41b0</div></div></div>
        </div>
      </div>
    </div>
    <div class="hc lg" id="lg"><button class="hcBtn" id="lgBtn"><b>용어 정리</b><span class="cnt" id="lgCnt">0개</span><span class="pill" id="lgNew">NEW</span><span class="chev">▾</span></button><div class="hcBody" id="lgBody"></div></div>
    </div>

  await flyTo(stTarget(6));if(ep!==epoch)return;

/* ---- 8: 네트워크 ---- */
function along(c,pts,ms,ep){const seg=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);tot+=d;}
  return tween(ms,t=>{let d=t*tot,i=0;while(i<seg.length-1&&d>seg[i]){d-=seg[i];i++;}const f=seg[i]?Math.min(1,d/seg[i]):1;
    c.setAttribute('cx',pts[i][0]+(pts[i+1][0]-pts[i][0])*f);c.setAttribute('cy',pts[i][1]+(pts[i+1][1]-pts[i][1])*f);},ep);}
const SIM={cwnd:1,ssth:16,hist:[],run:false,busy:false,pending:null};const CAP=22;
const gameRx=LD(T(D,880,482,9.5,'',{id:'gameRx',fill:C.purpleD}),0.5);
function dPill(label,color){const g=G(DP);const fs=10,w=label.length*fs*0.62+16;g._r=R(g,-w/2,-9,w,18,{fill:'#FFFDF8',stroke:color,sw:1.6,rx:4});
  g._t=T(g,0,0,fs,label,{mono:true,cls:'nohalo'});g.set=t=>{g._t.textContent=t;const w2=t.length*fs*0.62+16;g._r.setAttribute('x',-w2/2);g._r.setAttribute('width',w2);};return g;}
function alongG(g,pts,ms,ep){const seg=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);tot+=d;}
  return tween(ms,t=>{let d=t*tot,i=0;while(i<seg.length-1&&d>seg[i]){d-=seg[i];i++;}const f=seg[i]?Math.min(1,d/seg[i]):1;
    g.setAttribute('transform','translate('+(pts[i][0]+(pts[i+1][0]-pts[i][0])*f)+','+(pts[i][1]+(pts[i+1][1]-pts[i][1])*f)+')');},ep);}
const RB=ROUTE.slice().reverse(),R1=ROUTE.slice(0,4),R2=ROUTE.slice(3);
function xMark(layer,x,y,s){return P(layer,'M'+(x-s)+' '+(y-s)+' L'+(x+s)+' '+(y+s)+' M'+(x+s)+' '+(y-s)+' L'+(x-s)+' '+(y+s),{stroke:C.red,sw:3});}
function s6Reset(){SIM.run=false;SIM.busy=false;SIM.pending=null;SIM.cwnd=1;SIM.ssth=16;SIM.hist=[{c:1,s:16,ev:''}];
  for(let i=0;i<8;i++)$('q'+i).setAttribute('fill',C.card);gameRx.textContent='';drawGraph();}
function setQueue(){const n=Math.max(0,Math.min(8,Math.round((SIM.cwnd-14)/8*8)));for(let i=0;i<8;i++)$('q'+i).setAttribute('fill',i<n?rgba(C.amber,.7):C.card);}
function push(ev){SIM.hist.push({c:SIM.cwnd,s:SIM.ssth,ev:ev});if(SIM.hist.length>40)SIM.hist.shift();drawGraph();}
async function simRTT(ep){
  const n=SIM.cwnd,pk=SIM.pending;SIM.pending=null;
  const g=dPill('TCP 조각 ×'+n,C.coral);
  if(pk==='to'){
    await alongG(g,R1,1100,ep);const X=xMark(DP,N.BN[0],N.BN[1],12);for(let i=0;i<8;i++)$('q'+i).setAttribute('fill',rgba(C.red,.75));
    g.set('×'+n+' 전부 버려짐');log('병목 대기열이 넘쳐 이번 왕복에 보낸 '+n+'개가 전부 버려졌어요. 돌아오는 ACK가 하나도 없어요');
    await gate(ep,1600);g.remove();X.remove();
    for(let t=3;t>=1;t--){say('보내는 쪽 재전송 타이머(RTO) … '+t);await sleep(800,ep);}
    SIM.ssth=Math.max(2,Math.floor(n/2));SIM.cwnd=1;push('to');setQueue();
    log('타임아웃 → 심각한 혼잡으로 판단: cwnd = 1, 경계(ssthresh) = '+SIM.ssth+'. 잃어버린 것을 다시 보내며 처음부터 천천히');
    const r=dPill('재전송 ×1',C.red);await alongG(r,ROUTE,1300,ep);r.remove();
    const a=dPill('ACK',C.teal);await alongG(a,RB,1100,ep);a.remove();return;}
  let lost=pk==='dup'?Math.max(1,Math.ceil(n*0.1)):(n>CAP?n-CAP:0);
  if(lost){
    await alongG(g,R1,900,ep);const X=xMark(DP,N.BN[0],N.BN[1],12);for(let i=0;i<8;i++)$('q'+i).setAttribute('fill',i<7?rgba(C.amber,.7):rgba(C.red,.85));
    g.set('×'+(n-lost)+' 통과 · '+lost+'개 버려짐');log(n+'개를 보냈는데 대기열이 넘쳐 '+lost+'개가 버려졌어요');
    await gate(ep,1500);X.remove();g.set('TCP ×'+(n-lost));await alongG(g,R2,900,ep);g.remove();
    const a=dPill('중복 ACK ×3',C.amber);log('받는 쪽: 빈 번호가 생겨 같은 ACK를 반복해서 보내요 (나머지는 잘 받고 있다는 뜻)');await alongG(a,RB,1300,ep);a.remove();
    SIM.ssth=Math.max(2,Math.floor(n/2));SIM.cwnd=SIM.ssth;push('dup');setQueue();
    log('가벼운 손실로 판단 → cwnd 절반('+SIM.cwnd+'). 빠진 '+lost+'개만 바로 재전송');
    const r=dPill('재전송 ×'+lost,C.red);await alongG(r,ROUTE,1200,ep);r.remove();
    const b=dPill('ACK',C.teal);await alongG(b,RB,1000,ep);b.remove();return;}
  await alongG(g,ROUTE,1400,ep);g.remove();
  const a=dPill('ACK ×'+n,C.teal);await alongG(a,RB,1200,ep);a.remove();
  const ss=SIM.cwnd<SIM.ssth;
  SIM.cwnd=ss?Math.min(SIM.cwnd*2,SIM.ssth):SIM.cwnd+1;push('');setQueue();
  log('ACK가 모두 돌아옴 → '+(ss?'Slow Start: 2배로 늘려 '+SIM.cwnd+'개':'혼잡 회피: 1개만 늘려 '+SIM.cwnd+'개'));}
async function simLoop(ep){try{while(SIM.run&&ep===epoch){SIM.busy=true;await simRTT(ep);SIM.busy=false;await sleep(400,ep);}}catch(e){}SIM.busy=false;}
function simKick(kind){SIM.pending=kind;log(kind==='dup'?'다음 왕복에서 조각 일부를 잃게 할게요':'다음 왕복에서 조각을 전부 잃게 할게요');
  if(!SIM.busy){const ep=epoch;SIM.busy=true;simRTT(ep).catch(()=>{}).then(()=>{SIM.busy=false;});}}
function drawGraph(){
  const g=$('g6');if(!g)return;g.innerHTML='';
  const X0=34,X1=350,Y0=170,Y1=14,xs=i=>X0+i*(X1-X0)/39,ys=v=>Y0-v*(Y0-Y1)/32;
  for(let v=0;v<=32;v+=8){el('line',{x1:X0,x2:X1,y1:ys(v),y2:ys(v),stroke:C.bd,'stroke-width':1},g);el('text',{x:X0-6,y:ys(v),'font-size':10,fill:C.tx3,'text-anchor':'end','dominant-baseline':'central'},g,String(v));}
  el('line',{x1:X0,x2:X1,y1:ys(CAP),y2:ys(CAP),stroke:C.red,'stroke-width':1,'stroke-dasharray':'2 3',opacity:.6},g);
  el('text',{x:X1,y:ys(CAP)-7,'font-size':9.5,fill:C.redD,'text-anchor':'end'},g,'경로 한계(가정)');
  const H=SIM.hist;if(!H.length)return;
  el('path',{d:H.map((h,i)=>(i?'L':'M')+xs(i)+' '+ys(h.s)).join(' '),fill:'none',stroke:C.blue,'stroke-width':1.5,'stroke-dasharray':'4 3'},g);
  el('path',{d:H.map((h,i)=>(i?'L':'M')+xs(i)+' '+ys(h.c)).join(' '),fill:'none',stroke:C.coral,'stroke-width':2},g);
  H.forEach((h,i)=>{if(h.ev)el('circle',{cx:xs(i),cy:ys(h.c),r:3.5,fill:h.ev==='dup'?C.amber:C.red},g);});
  el('text',{x:X0,y:190,'font-size':10,fill:C.tx3},g,'시간 (RTT) →');
  el('text',{x:X1,y:190,'font-size':10,fill:C.coral,'text-anchor':'end'},g,'— cwnd');
  el('text',{x:X1-56,y:190,'font-size':10,fill:C.blueD,'text-anchor':'end'},g,'-- ssthresh');
  const r=$('simR');if(r)r.textContent='cwnd = '+SIM.cwnd+' MSS · ssthresh = '+SIM.ssth+' · '+(SIM.cwnd<SIM.ssth?'Slow Start (2배씩)':'Congestion Avoidance (+1씩)');}

  for(let i=0;i<4;i++){for(let j=0;j<4;j++)$('encH'+j).style.opacity=j===3-i?1:0;log('[Server] '+back[i]);

 {t:()=>[bx(1461)+u/2,105.22],s:'그런데 이 바이트 아래에 <b>1461</b>이라는 번호가 붙어 있죠? 이 번호는 무엇일까요?'}],
[{cam:'enter',t:()=>[bx(1461)+u/2,104.6],s:'한 칸 줌아웃했어요. 바이트 1461 앞에도 뒤에도 바이트가 줄지어 있고, 모두 자기 번호를 달고 있어요.'},
 {cam:'full',at:'below',t:[300,105],s:'더 줌아웃하니 이 바이트들은 <b>5,840바이트짜리 줄</b>의 일부였어요. TCP는 바이트마다 1부터 번호를 붙여요. 이게 <b>순서번호(seq)</b>예요.'},
 {cam:'full',at:'below',t:[300,105],s:'번호가 있으면 순서가 섞여 도착해도 다시 맞출 수 있고, 빈 번호가 있으면 <b>무엇이 빠졌는지</b> 알 수 있어요.'},
 {at:'below',t:()=>[C2(1461,2920),142],s:'또 한 번에 실을 수 있는 크기가 정해져 있어서, TCP는 <b>1460바이트(MSS)씩</b> 잘라요. 아래 주황 줄이 그 <b>조각</b>이에요. 아까 바이트 1461은 조각2의 첫 바이트였어요.'},
 {at:'below',t:()=>[C2(1461,2920),142],s:'<b>MSS</b>(Maximum Segment Size)는 조각 하나에 담을 수 있는 <b>데이터의 최대 크기</b>예요.<span class="gap"></span>헤더는 빼고 데이터만 센 값이라, 실제로 나가는 세그먼트는 여기에 헤더만큼 더 커요. 이 값은 연결을 맺을 때(SYN) 양쪽이 서로 알려 줘요.'},
 {at:'above',t:()=>[C2(1201,3100),68],s:'위 보라 줄은 앱이 OS에 <b>한 번에 맡긴 덩어리</b>예요. 앱 마음대로라 크기가 제각각이에요.'},
 {at:'below',t:()=>[C2(1201,3100),68],s:'덩어리는 왜 생길까요? 앱은 보낼 데이터를 처음부터 다 갖고 있지 않아요. 채팅 앱은 메시지를 입력할 때마다, 파일 전송 앱은 디스크에서 읽어 온 만큼씩 OS에 넘겨요.<span class="gap"></span>그때그때 <b>한 번 넘긴 묶음</b>이 덩어리라서 크기가 제각각이에요.'},
 {at:'below',t:[500,192],s:'두 줄의 칸막이가 다르죠? 덩어리③은 조각 1·2·3에 걸쳐 잘려요. TCP는 조각만 관리하고 <b>덩어리 경계는 기억하지 않아서</b>, 받는 앱은 원래 덩어리를 알 수 없어요.'},
 {at:'below',t:[500,192],s:'예를 들어 앱이 "아버지가"와 "방에들어가신다"를 따로 두 번 넘겨도, 받는 앱에는 <b>"아버지가방에들어가신다"</b>가 한 줄로 도착해요.<span class="gap"></span>원래 "아버지가 / 방에들어가신다"였는지 "아버지 / 가방에들어가신다"였는지, 받는 쪽은 알 수 없어요.<span class="gap"></span>그래서 앱은 메시지 앞에 <b>길이</b>를 적거나 끝에 <b>줄바꿈</b> 같은 구분자를 붙여서 직접 나눠요.'},
 {t:'legend',s:'새로 나온 용어는 오른쪽 위 <b>용어 정리</b>에 한 줄씩 모아 둘게요. 말풍선을 놓쳐도 눌러서 다시 볼 수 있어요.'}],
[{t:[310,310],s:'잘라 낸 조각 앞에 <b>메모지(헤더) 20바이트</b>를 붙이면 <b>세그먼트</b>가 돼요. 지금 아는 칸은 <b>Sequence Number = 1461</b>, 이 조각의 첫 바이트 번호예요.'},
 {t:[660,342],s:'뒤쪽은 실제 데이터, 조각2의 바이트 1461~2920이에요.'},
 {t:[392,390],s:'나머지 칸은 아직 <b>?</b>예요. "이럴 땐 어떻게 하지?"라는 질문이 생길 때마다 하나씩 열려요.'},
 {t:'card',s:'열린 칸은 오른쪽 위 <b>TCP 헤더 카드</b>에 모아 둘게요. 눌러서 펴 보면 지금까지 모은 칸과 뜻을 볼 수 있어요.'}],
[{t:[230,300],s:'줌아웃하니 세그먼트는 두 끝 사이를 날아가는 중이었어요. 그럼 받는 쪽이 <b>잘 받았는지</b>는 어떻게 알까요?'},
 {t:[795,440],s:'받는 쪽은 "여기까지 받았어"를 돌려보내요. 이게 <b>ACK</b>이고, 헤더의 Acknowledgment Number 칸에 <b>다음에 받고 싶은 번호</b>를 적어요.'},
 {t:[205,440],s:'번호로 확인하려면 먼저 <b>서로의 시작 번호</b>를 알려 주고 확인해야 해요. 양쪽 OS는 이걸 각자의 <b>메모(상황판)</b>에 적어 둬요.'},
 {t:[500,420],s:'앞으로 <b>왕복</b>이라는 말이 자주 나와요. <b>RTT</b>(Round Trip Time)는 보낸 신호가 상대에게 갔다가 답(ACK)이 돌아오기까지 걸리는 시간이에요.<span class="gap"></span>멀리 있고 거치는 장비가 많을수록 길어져요. 서울↔도쿄면 약 30ms예요.'},
 {btn:'s3auto',s:'이 약속 과정이 <b>3-way handshake</b>예요. 시작 번호를 주고받고, 데이터를 보내고, 연결을 끝내는 것까지 따라가 볼게요.'},
 {t:[500,420],s:'정리하면, <b>연결은 선이 아니라 양쪽 메모</b>예요. SYN·FIN 같은 신호는 헤더의 <b>Flags</b> 칸에 적혀요. 악수는 3번이지만 기다리는 시간은 왕복 1번이에요.'},
 {t:[205,440],s:'헷갈리기 쉬운 것: 먼저 닫은 쪽은 <b>TIME_WAIT</b>으로 잠깐 기다리는 게 정상이에요. 반대로 <b>CLOSE_WAIT</b>이 계속 남아 있으면 내 앱이 닫지 않은 버그예요.'}],
[{t:[30,640],s:'조금 더 줌아웃하니 양쪽에 <b>버퍼</b>가 보여요. 보내는 쪽은 ACK를 받기 전까지 <b>사본을 지우지 않고</b> 들고 있어요. 다시 보내야 할 수도 있으니까요.'},
 {t:[970,640],s:'받는 쪽 버퍼는 도착한 조각을 쌓아 두고, 앱이 꺼내 가요. 그런데 중간 조각 하나가 사라지면 어떻게 될까요?'},
 {btn:'s4b',s:'중간 조각이 사라지는 상황을 볼게요.'},
 {btn:'s4t',s:'이번엔 <b>마지막</b> 조각이 사라지는 경우예요. 뒤에 오는 조각이 없으면 어떻게 될까요?'},
 {t:[970,640],s:'정리: 손실은 <b>중복 ACK</b>(빠름)나 <b>타임아웃</b>(느리지만 확실)으로 알아채고 다시 보내요. 깨진 조각도 <b>Checksum</b> 칸 검사에 걸려 버려지고, 똑같이 재전송돼요.'},
 {t:[970,640],s:'반대로 같은 조각이 <b>두 번</b> 도착할 때도 있어요. 예를 들어 ACK가 늦게 와서 보내는 쪽이 타임아웃으로 이미 도착한 조각을 또 보낸 경우예요.<span class="gap"></span>받는 쪽은 <b>Sequence Number</b>를 보고 "이미 받은 번호"면 조용히 버리고, ACK만 다시 보내요. 그래서 앱에는 한 번만 올라가요.'}],
[{t:[30,640],s:'그런데 조각 하나 보내고 ACK를 기다리고… 이러면 너무 느리지 않을까요? 직접 비교해 볼게요.'},
 {btn:'s4s',s:'먼저 <b>하나씩 기다리는</b> 방식이에요.'},
 {btn:'s4a',s:'이번엔 ACK를 기다리지 않고 <b>미리 보내도 되는 범위</b>, <b>윈도우</b>로 보내 볼게요.'},
 {t:[970,707],s:'윈도우를 무작정 키우면 받는 쪽 버퍼가 넘쳐요. 그래서 받는 쪽은 매 ACK의 <b>Window</b> 칸에 <b>남은 공간(rwnd)</b>을 적어 보내요.'},
 {btn:'s4c',s:'받는 앱이 데이터를 꺼내 가지 않으면 무슨 일이 생기는지 볼게요.'},
 {t:[30,707],s:'정리: 처리량은 대략 <b>윈도우 ÷ 왕복 시간</b>이에요. 그리고 rwnd가 0이 되는 원인은 대부분 네트워크가 아니라 <b>받는 앱이 느린 것</b>이에요.'}],
[{t:[246,135],s:'처음 봤던 장면으로 돌아왔어요. 이번엔 안이 훨씬 자세하죠. 컴퓨터 안엔 프로그램이 여럿인데, 누구에게 줄지는 어떻게 알까요?'},
 {t:[136,470],s:'프로그램마다 <b>포트</b> 번호가 있다는 건 2주차에서 봤죠. 헤더 카드의 <b>Src/Dst Port</b> 칸이 드디어 열렸어요. 조각마다 "어느 프로그램에서 어느 프로그램으로"가 적혀 가요.'},
 {t:[870,250],s:'그런데 서버는 <b>443 포트 하나</b>로 손님 수천 명과 동시에 연결해요. 어떻게 구분할까요?<span class="gap"></span>TCP는 도착한 조각을 <b>출발지 IP · 출발지 포트 · 목적지 IP · 목적지 포트</b>, 네 값(<b>4-tuple</b>)으로 맞춰 봐요.<span class="gap"></span>목적지가 같은 443이어도 보낸 쪽 IP나 포트가 다르면 다른 연결이에요.'},
 {t:[870,250],s:'그래서 내 브라우저 탭 두 개도 OS가 출발지 포트를 따로(52310, 52311) 골라 줘서 서로 다른 연결이 돼요. 참고로 UDP는 연결이 없어서 <b>목적지 IP·포트 두 값</b>만 보고 나눠요.'},
 {btn:'s5b',s:'여러 프로그램의 데이터가 어떻게 모이고 나뉘는지 볼게요.'},
 {t:[603,440],s:'서버는 443 하나 위에 손님 받는 <b>listen</b> 1개와, 손님마다 연결 1개씩을 가져요. listen 뒤엔 대기열이 두 개 있어요.'},
 {t:[603,440],s:'<b>listen 소켓</b>은 데이터를 주고받지 않는 <b>접수 창구</b>예요.<span class="gap"></span>서버 앱이 2주차에서 본 bind()로 443번을 잡고 listen()을 부르면 생기고, 하는 일은 새 손님의 SYN을 받아 악수를 처리하는 것뿐이에요.<span class="gap"></span>악수가 끝나면 그 손님 전용 <b>연결 소켓</b>을 새로 만들어 넘기고, 자신은 계속 다음 손님을 기다려요.'},
 {btn:'s5a',s:'새 손님이 오면 어떻게 되는지 볼게요.'},
 {run:'rw',s:'이제 앞에서 이름 없이 부르던 것들에 <b>정식 이름</b>을 붙일 차례예요. 앞 장면들로 되감아 볼게요.'},
 {t:[136,470],s:'정리: 이름 없이 본 "Client 쪽 끝"이 <b>소켓</b>이고, 앱에겐 <b>fd</b> 번호 하나로 보여요. 소켓은 OS 안에 계속 있는 창구, 세그먼트는 그 창구로 오가는 편지예요.'},
 {t:[136,470],s:'<b>fd</b>(file descriptor)는 OS가 앱에게 건네는 <b>번호표</b>예요. 앱은 소켓 안을 직접 만지지 못하고 "3번에 이거 보내 줘"처럼 이 번호로만 OS에 부탁해요.<span class="gap"></span>0~2번은 키보드 입력·화면 출력용으로 미리 열려 있어서 소켓은 보통 3번부터 받아요.'}],
[{t:[500,290],s:'더 줌아웃했어요. TCP가 믿는 "파이프"는 논리적 연결일 뿐이고, 실제 조각은 이 아래 <b>라우터들</b>을 지나가요. 라우터는 연결을 전혀 몰라요.'},
 {t:[500,520],s:'여러 사람이 지나가는 <b>병목 라우터</b>는 대기열이 차면 늦어지고, 넘치면 조각을 버려요. 받는 쪽은 멀쩡해도 <b>길이 막힐</b> 수 있는 거예요.'},
 {t:[500,568],s:'그림의 큐 8칸은 이해를 돕기 위한 <b>개념상의 크기</b>예요. 실제 라우터 큐는 장비마다 다르고 보통 패킷 수백~수천 개를 담아요.<span class="gap"></span>큐가 차는 이유는 <b>들어오는 양이 나가는 속도보다 많을 때</b>예요.<span class="gap"></span>이 라우터는 100 Mbps로만 내보낼 수 있는데, 나와 다른 사용자 A·B가 동시에 보내면 남는 패킷이 줄을 서요.'},
 {t:'graph',s:'TCP는 라우터에게 묻지 않고 <b>손실과 지연을 보고 스스로 판단</b>해서 한 번에 보내는 양 <b>cwnd</b>를 조절해요. cwnd는 헤더에 없고, 보내는 쪽 OS가 혼자 들고 있는 값이에요.'},
 {t:'graph',s:'그래프의 두 선을 먼저 볼게요. 주황 실선 <b>cwnd</b>(혼잡 윈도우)는 ACK를 기다리지 않고 한 왕복에 보낼 수 있는 조각 수예요.<span class="gap"></span>6단계의 rwnd가 <b>받는 쪽</b> 사정이라면, cwnd는 <b>길(네트워크)</b> 사정을 보고 보내는 쪽이 스스로 정한 한도예요.'},
 {t:'graph',s:'파란 점선 <b>ssthresh</b>는 "여기부터는 조심"이라는 경계선이에요. 아래면 왕복마다 <b>2배</b>, 닿으면 <b>1개씩</b> 늘려요.<span class="gap"></span>경계는 처음엔 OS가 정한 큰 값(여기선 16)이고, 손실이 날 때마다 <b>그때 cwnd의 절반</b>으로 다시 그어요.<span class="gap"></span>"지난번 이만큼에서 막혔으니 그 절반부터 조심하자"는 기억이에요.'},
 {btn:'simDemo',s:'한 왕복마다 cwnd개를 묶어 보내 볼게요. 주황 상자 하나가 한 번에 보낸 묶음이에요.'},
 {t:'graph',s:'정리: 처음엔 <b>2배씩</b> 빠르게 늘리고, 경계를 넘으면 <b>1씩</b> 조심스럽게. 일부를 잃으면 <b>절반</b>, 아무 응답이 없으면 <b>1</b>로. 천천히 올리고 급히 내리는 이 규칙 덕분에 모두가 공평하게 나눠 써요.'},
 {t:[880,442],s:'같은 길 위엔 <b>UDP</b>도 다녀요. 지금까지 본 악수·번호·확인·재전송·속도 조절을 <b>전부 빼고</b> 8바이트 헤더만 붙여요. 헤더 카드 아래에서 비교해 보세요.'},
 {btn:'game',s:'게임은 내 위치를 계속 보내요. 하나가 버려지면 어떻게 될까요?'},
 {t:[120,442],s:'DNS도 UDP를 써요. 질문 하나, 답 하나면 끝나서 악수에 쓰는 시간이 아깝거든요. 답이 없으면 앱이 그냥 다시 물어봐요. "UDP가 빠르다"는 처리량이 아니라 <b>기다림이 없다</b>는 뜻이에요.'}],
[{t:[100,250],s:'마지막 줌아웃이에요. 지금까지 본 모든 게 이 <b>계층 지도</b>의 한 줄, Transport 층에 있었어요.'},
 {t:[100,383],s:'그 아래는 2주차에서 본 층이에요. <b>IP</b>는 컴퓨터까지, <b>MAC</b>은 다음 장비까지 데려다줘요. 이번 주의 포트·소켓은 그 컴퓨터 안의 <b>프로그램</b>까지예요.'},

function bodyRect(x,y,o){const w=30,h=58;return [o&1?x-w:x-3,y-14,w+3,h];}
/* 픽셀 테마 이전과 같은 곡선 cubic-bezier(.4,0,.2,1), 30프레임으로 끊어 이동 */
function bez(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t,Y=t=>((ay*t+by)*t+cy)*t,dX=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{let t=x;for(let i=0;i<8;i++){const e=X(t)-x,d=dX(t);if(Math.abs(e)<1e-5||Math.abs(d)<1e-6)break;t-=e/d;}return Y(Math.min(1,Math.max(0,t)));};}
const EASE=bez(.4,0,.2,1);
function animPos(e,x,y,ms){ms=ms/SPD;

  (function f(n){if(e._aid!==id)return;const t=Math.min(1,(n-st)/ms),fr=Math.floor((n-st)/33.333);
    if(fr!==last||t>=1){last=fr;const k=t>=1?1:EASE(Math.min(1,fr*33.333/ms));

    if(ok)out.push([r.left-st.left-3,r.top-st.top-3,r.width+6,r.height+6,1]);});

function ovA(a,b){const w=Math.min(a[0]+a[2],b[0]+b[2])-Math.max(a[0],b[0]),h=Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1]);return w>0&&h>0?w*h:0;}
let tipOff=[0,0];
/* 가리키는 곳이 글자 위면, 커서 끝을 글자 가장자리로 옮겨 글자를 가리지 않게 */
function tipFor(T,o,obs){return T;}
/* 학사모까지 포함한 커서가 글자를 덮지 않는 끝점 찾기: 원래 점 / 글자 아래 / 글자 왼쪽 / 글자 오른쪽 */
function bestO(T,obs){let q=null;for(const r of obs){if(r[4]!==1)continue;if(T[0]>=r[0]&&T[0]<=r[0]+r[2]&&T[1]>=r[1]&&T[1]<=r[1]+r[3]){q=r;break;}}

  if(q){const cy=q[1]+q[3]/2;cands.push([[T[0],q[1]+q[3]+13],0,10],[[T[0],q[1]+q[3]+13],1,10],[[q[0]-1,cy],1,6],[[q[0]+q[2]+1,cy],0,6]);}
  let best=null;
  for(const [t,o,pen] of cands){const r=bodyRect(t[0],t[1],o);let sc=pen*20+(o?60:0);
    if(r[0]<4||r[1]<50||r[0]+r[2]>SW-4||r[1]+r[3]>SH-BOT)sc+=1e6;for(const x of obs)sc+=ovA(r,x)*x[4]*3;
    if(!best||sc<best[0])best=[sc,o,t];}

function placeNear(T){
  if(!T||T[0]<0||T[0]>SW||T[1]<40||T[1]>SH){park();return;}guide.classList.remove('idle');
  const BW=Math.min(360,SW-40);bub.style.width=BW+'px';const bh=bub.offsetHeight||110;
  const obs=obstacles();const [o,tp]=bestO(T,obs);tipOff=[tp[0]-T[0],tp[1]-T[1]];const body=bodyRect(tp[0],tp[1],o);const tz=[T[0]-34,T[1]-20,68,40];
  moveCursor(tp[0],tp[1],o,true);
  let best=null;
  for(const r of [70,110,150,200,260,330,420,520,640])for(let a=0;a<360;a+=15){
    const rad=a*Math.PI/180,cx=T[0]+Math.cos(rad)*(r+BW/2*Math.abs(Math.cos(rad))),cy=T[1]+Math.sin(rad)*(r*0.7+bh/2*Math.abs(Math.sin(rad)));
    const b=[Math.round(cx-BW/2),Math.round(cy-bh/2),BW,bh];

  if(!best){best=[0,Math.max(8,Math.min(SW-BW-8,T[0]+40)),Math.max(52,Math.min(SH-BOT-bh-6,T[1]+50))];}

var EYE={L:document.getElementById('eyeL'),R:document.getElementById('eyeR'),dir:1};
function setEyes(d){if(!EYE||!EYE.L)return;EYE.dir=d;const c=d<0?2:3;EYE.L.setAttribute('x',(c*2.6).toFixed(1));EYE.R.setAttribute('x',((c+2)*2.6).toFixed(1));}
function blink(){if(!EYE||!EYE.L)return;[EYE.L,EYE.R].forEach(e=>{e.setAttribute('y',(8*2.6).toFixed(1));e.setAttribute('height','2.65');});
  setTimeout(()=>[EYE.L,EYE.R].forEach(e=>{e.setAttribute('y',(7*2.6).toFixed(1));e.setAttribute('height','5.25');}),140);}
(function eyeLoop(){setTimeout(()=>{blink();if(Math.random()<0.25)setTimeout(blink,260);
