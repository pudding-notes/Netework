<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Net Voca — 네트워크 용어 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#0FBF83; --g-d:#07966A; --g-bg:#E3F8F0; --g-ink:#067A56;
  --r:#F0444F; --r-bg:#FDECEE;
  --o:#FF8A00; --o-bg:#FFF3E2;
  --ink:#191F28; --ink2:#4E5968; --mute:#8B95A1; --line:#E5E8EB; --bg:#F2F4F6; --card:#fff;
  --app-h:100dvh;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9ECEF;color:var(--ink);font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;justify-content:center;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{position:relative;width:100%;max-width:440px;height:var(--app-h);background:var(--card);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){#app{box-shadow:0 0 0 1px rgba(0,0,0,.04),0 20px 60px rgba(0,0,0,.08)}}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

/* ── HOME ── */
#home{background:var(--bg)}
.home-scroll{flex:1;overflow-y:auto;padding:calc(var(--sat) + 20px) 20px 24px;-webkit-overflow-scrolling:touch}
.brand{display:flex;align-items:center;gap:10px;margin:4px 0 4px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--g);display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;letter-spacing:-.5px;box-shadow:0 6px 14px rgba(15,191,131,.35)}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.6px}
.tag{margin:6px 0 20px;color:var(--ink2);font-size:14.5px;line-height:1.5}
.stat{display:flex;gap:10px;margin-bottom:18px}
.stat>div{flex:1;background:var(--card);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:22px;font-weight:900;letter-spacing:-.5px}
.stat span{font-size:12.5px;color:var(--mute)}
.sec{background:var(--card);border-radius:18px;padding:18px 16px;margin-bottom:12px}
.sec h2{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sec h2 small{font-weight:500;color:var(--mute);font-size:12.5px}
.weeks{display:grid;gap:8px}
.wk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);text-align:left;transition:.15s}
.wk .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid #C9CED4;display:grid;place-items:center;flex:none;transition:.15s}
.wk .ck svg{opacity:0}
.wk .tx{flex:1;min-width:0}
.wk .tx b{display:block;font-size:14.5px;font-weight:700}
.wk .tx span{font-size:12.5px;color:var(--mute)}
.wk .n{font-size:12.5px;color:var(--mute);font-weight:500}
.wk.on{border-color:var(--g);background:var(--g-bg)}
.wk.on .ck{background:var(--g);border-color:var(--g)}
.wk.on .ck svg{opacity:1}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.row+.row{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.row .l b{display:block;font-size:14.5px;font-weight:500}
.row .l span{font-size:12.5px;color:var(--mute)}
.sw{width:46px;height:28px;border-radius:14px;background:#D1D6DB;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--g)}
.sw.on::after{left:21px}
.home-foot{padding:12px 20px calc(var(--sab) + 14px);background:var(--bg);display:grid;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:54px;border-radius:16px;font-size:16.5px;font-weight:700;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--g);color:#fff}
.btn.pri:disabled{background:#C9CED4}
.btn.sec2{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sec2:disabled{color:#B0B8C1}
.btn.ghost{background:var(--bg);color:var(--ink2)}

/* ── QUIZ ── */
#quiz{background:#fff}
.qtop{padding:calc(var(--sat) + 10px) 16px 6px;display:flex;align-items:center;gap:12px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);flex:none}
.icon-btn:active{background:var(--bg)}
.bar{flex:1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g);border-radius:4px;transition:width .35s ease}
.cnt{font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.qbody{flex:1;min-height:0;overflow-y:auto;padding:10px 22px 16px;-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:var(--bg);color:var(--ink2)}
.chip.g{background:var(--g-bg);color:var(--g-ink)}
.chip.o{background:var(--o-bg);color:#C46A00}
.qcard{position:relative}
.en{font-size:21px;line-height:1.75;font-weight:700;letter-spacing:-.2px;word-break:keep-all;overflow-wrap:break-word;margin:0}
.blanks{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;margin:0 2px}
.bx{display:inline-flex;align-items:center;height:38px;padding:0 8px;border-radius:9px;background:var(--bg);border:2px solid transparent;font-family:var(--mono);font-weight:700;font-size:19px;line-height:1;color:var(--ink);transition:background .15s,border-color .15s}
.bx .c{display:inline-block;width:1ch;text-align:center;position:relative}
.bx .c.fx{color:var(--mute)}
.bx.hid{min-width:6ch}
.bx.hid .t{white-space:pre}
.bx.act{border-color:var(--g);background:#fff;box-shadow:0 0 0 3px rgba(15,191,131,.15)}
.bx .c.cur{background:rgba(15,191,131,.16);border-radius:4px;height:26px}
.bx .c.cur::after{content:"";position:absolute;left:10%;right:10%;bottom:-5px;height:3px;border-radius:2px;background:var(--g);animation:blink 1s steps(1) infinite}
.bx .c.k{color:var(--g-d)}
.bx .c.h{color:#E07B00}
.bx.hid .c.cur{display:inline-block;width:1ch}
@keyframes blink{50%{opacity:0}}
.ok .bx{background:var(--g-bg);border-color:var(--g);color:var(--g-ink)}
.ok .bx .c.fx{color:var(--g-ink)}
.rv .bx{background:var(--o-bg);border-color:var(--o);color:#B35F00}
.bad .bx{background:var(--r-bg);border-color:var(--r);color:var(--r)}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.06)}}
.acr{display:inline-block;font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:-.5px;color:var(--ink);margin-bottom:6px}
.acr-sub{display:block;font-size:14px;font-weight:500;color:var(--mute);margin-bottom:12px}
.en.ab .blanks{display:flex;margin:0}
.mode{display:flex;background:#fff;border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.mode button{flex:1;padding:11px 0;border-radius:11px;font-size:15px;font-weight:700;color:var(--mute)}
.mode button.on{background:var(--ink);color:#fff}
.mode button small{display:block;font-size:11.5px;font-weight:500;opacity:.75;margin-top:1px}
.ko{margin:16px 0 0;font-size:15.5px;line-height:1.65;color:var(--ink2);word-break:keep-all}
.ko mark{background:none;color:var(--g-d);font-weight:700}
.msg{min-height:22px;margin-top:16px;font-size:14px;font-weight:700}
.msg.bad{color:var(--r)} .msg.close{color:#D97500} .msg.ok{color:var(--g-d)} .msg.rv{color:#C46A00}
.info{margin-top:6px;border-radius:16px;background:var(--bg);padding:16px;display:none}
.info.on{display:block;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.info .term{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.info .term b{font-size:18px;font-weight:900;font-family:var(--mono);letter-spacing:-.3px}
.spk{width:30px;height:30px;border-radius:9px;background:#fff;display:grid;place-items:center;color:var(--g-d);flex:none}
.info p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink)}
.info .note{margin-top:12px;padding-top:12px;border-top:1px dashed #D1D6DB}
.info .note h4{margin:0 0 4px;font-size:12.5px;color:#C46A00;font-weight:700}
.info .note p{color:var(--ink2);font-size:13.5px}
.qfoot{padding:6px 6px calc(var(--sab) + 8px);border-top:1px solid var(--line);background:#F7F8FA;touch-action:manipulation}
#btnNext{margin:6px 10px 4px;width:calc(100% - 20px)}
[hidden]{display:none!important}
.kb{display:grid;gap:7px;padding:2px 3px 0;user-select:none;-webkit-user-select:none}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:none;width:calc((100% - 45px) / 10);height:46px;border-radius:9px;background:#fff;box-shadow:0 1px 0 #C9CED4;font-size:20px;font-weight:500;color:var(--ink);display:grid;place-items:center;touch-action:manipulation;transition:background .05s}
.kr.num .key{height:38px;font-size:16px;background:#ECEEF1;box-shadow:none;color:var(--ink2)}
.key.wide{width:calc((100% - 45px) / 10 * 1.5);background:#DDE1E5}
.kspace{flex:none;width:calc((100% - 45px) / 10 * 1.5)}
.kr.r3{justify-content:space-between}
.key.pr{background:#C9CED4!important;transform:scale(.96)}
.key.enter{flex:1;width:auto;height:48px;background:#B0B8C1;color:#fff;font-size:16.5px;font-weight:700;box-shadow:none;margin:0 4px}
.key.enter.ready{background:var(--g)}
.tools{display:flex;justify-content:space-between;margin:0 6px 6px;gap:8px}
.tool{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:700;color:var(--ink2);padding:9px 8px;border-radius:11px;background:#fff;border:1px solid var(--line)}
.tool:active{background:var(--bg)}
.tool:disabled{color:#C9CED4}
.btn.chk{background:var(--ink);color:#fff}
.btn.chk.ready{background:var(--g)}
.btn.chk.next{background:var(--g)}

/* ── RESULT ── */
#result{background:var(--bg)}
.res-scroll{flex:1;overflow-y:auto;padding:calc(var(--sat) + 28px) 20px 20px}
.res-hero{background:#fff;border-radius:22px;padding:26px 20px 22px;text-align:center}
.ring{width:132px;height:132px;margin:0 auto 14px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;font-size:32px;font-weight:900;letter-spacing:-1px}
.ring b small{font-size:15px;font-weight:700;margin-top:10px}
.res-hero h2{margin:0 0 6px;font-size:20px;font-weight:900}
.res-hero p{margin:0;color:var(--ink2);font-size:14px}
.res-stats{display:flex;margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.res-stats div{flex:1}
.res-stats b{display:block;font-size:19px;font-weight:900}
.res-stats span{font-size:12px;color:var(--mute)}
.list{background:#fff;border-radius:18px;margin-top:12px;padding:6px 0}
.list h3{margin:12px 16px 6px;font-size:14px;font-weight:700}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;text-align:left}
.li:active{background:var(--bg)}
.li .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:900;color:#fff}
.li .dot.y{background:var(--g)} .li .dot.n{background:var(--r)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-family:var(--mono);font-size:15px;font-weight:700}
.li .t span{font-size:12.5px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .w{font-size:11.5px;color:var(--mute)}
.res-foot{padding:12px 20px calc(var(--sab) + 14px);display:grid;gap:8px;background:var(--bg)}

/* ── SHEET / DIALOG ── */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 20px calc(var(--sab) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21;max-height:82%;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#D1D6DB;margin:0 auto 16px}
.sheet .st{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sheet .st b{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.5px}
.sheet .lbl{font-size:12.5px;font-weight:700;color:var(--mute);margin:18px 0 6px}
.sheet p{margin:0;font-size:15px;line-height:1.65}
.sheet .ex{background:var(--bg);border-radius:14px;padding:14px;font-size:14.5px;line-height:1.6}
.sheet .ex .e{font-weight:500}
.sheet .ex .e u{text-decoration:none;color:var(--g-d);font-weight:700;font-family:var(--mono)}
.sheet .ex .k{color:var(--ink2);margin-top:6px;font-size:13.5px}
.sheet .ex .k mark{background:none;color:var(--g-d);font-weight:700}
.sheet .nt{background:var(--o-bg);border-radius:14px;padding:14px;font-size:14px;line-height:1.6;color:#6B4A1F}
.dlg{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%) scale(.96);background:#fff;border-radius:20px;padding:24px 20px 16px;z-index:22;opacity:0;pointer-events:none;transition:.18s;text-align:center}
.dlg.on{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.dlg h3{margin:0 0 6px;font-size:18px;font-weight:900}
.dlg p{margin:0 0 18px;color:var(--ink2);font-size:14px;line-height:1.5}
.dlg .bt{display:flex;gap:8px}
.dlg .bt .btn{height:48px;font-size:15px}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 64px);transform:translate(-50%,-10px);background:rgba(25,31,40,.92);color:#fff;font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.combo{position:absolute;right:22px;top:calc(var(--sat) + 58px);font-weight:900;color:var(--g);font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.combo.on{opacity:1}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="home" class="screen on">
    <div class="home-scroll">
      <div class="brand"><div class="logo">NV</div><h1>Net Voca</h1></div>
      <p class="tag" id="tagline"></p>
      <div class="mode" id="modeSeg"><button data-v="term">용어<small>예문 빈칸 채우기</small></button><button data-v="abbr">약어<small>풀네임 쓰기</small></button></div>
      <div class="stat">
        <div><b id="stTotal">0</b><span id="stTotalL">전체 용어</span></div>
        <div><b id="stWrong">0</b><span>오답 노트</span></div>
        <div><b id="stDone">0</b><span id="stDoneL">외운 용어</span></div>
      </div>
      <div class="sec">
        <h2>주차 선택 <small id="selCnt"></small></h2>
        <div class="weeks" id="weekList"></div>
      </div>
      <div class="sec">
        <h2>문제 수</h2>
        <div class="seg" id="segCount">
          <button data-v="10">10</button><button data-v="20">20</button><button data-v="30">30</button><button data-v="0">전체</button>
        </div>
      </div>
      <div class="sec">
        <h2>설정</h2>
        <div class="row"><div class="l"><b>빈칸 길이 숨기기</b><span>글자 수로 정답을 짐작하지 못하게 해요</span></div><button class="sw" id="swHide" aria-label="빈칸 길이 숨기기"></button></div>
        <div class="row"><div class="l"><b>효과음</b><span>정답·오답 소리</span></div><button class="sw" id="swSound" aria-label="효과음"></button></div>
        <div class="row"><div class="l"><b>정답 문장 읽어주기</b><span>맞히면 영어 예문을 소리로 들려줘요</span></div><button class="sw" id="swSpeak" aria-label="정답 문장 읽어주기"></button></div>
      </div>
    </div>
    <div class="home-foot">
      <button class="btn pri" id="btnStart">시작하기</button>
      <button class="btn sec2" id="btnWrong">오답 노트 복습</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="screen">
    <div class="qtop">
      <button class="icon-btn" id="btnQuit" aria-label="그만하기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="bar"><i id="bar"></i></div>
      <div class="cnt" id="cnt">0/0</div>
    </div>
    <div class="combo" id="combo"></div>
    <div class="qbody" id="qbody">
      <div class="chips" id="chips"></div>
      <div class="qcard" id="qcard">
        <p class="en" id="en"></p>
        <p class="ko" id="ko"></p>
      </div>
      <div class="msg" id="msg"></div>
      <div class="info" id="info"></div>
    </div>
    <div class="qfoot">
      <div class="tools" id="tools">
        <button class="tool" id="btnHint"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>힌트 보기</button>
        <button class="tool" id="btnReveal"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>정답 보기</button>
      </div>
      <div class="kb" id="kb"></div>
      <button class="btn pri" id="btnNext" hidden>다음 문제</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="res-scroll">
      <div class="res-hero">
        <div class="ring"><svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="#F2F4F6" stroke-width="12"/><circle id="ringArc" cx="66" cy="66" r="56" fill="none" stroke="#0FBF83" stroke-width="12" stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="351.86" style="transition:stroke-dashoffset .9s ease"/></svg><b id="resPct">0<small>%</small></b></div>
        <h2 id="resTitle"></h2>
        <p id="resSub"></p>
        <div class="res-stats">
          <div><b id="rsFirst">0</b><span>한 번에 정답</span></div>
          <div><b id="rsMiss">0</b><span>다시 푼 용어</span></div>
          <div><b id="rsTime">0:00</b><span>걸린 시간</span></div>

  { w: 2, a: "routing table", en: "A router looks up its ___ to choose the next hop.", ko: "라우터는 [목적지별 경로 표]를 보고 다음 홉을 고른다.", d: "Destination → Next Hop / Interface 대응표. route print로 확인.", n: "0.0.0.0/0 = Default Route. 이 줄이 없으면 인터넷으로 나갈 길을 모른다." },
  { w: 2, a: "next hop", en: "Each router decides only the ___, not the entire path to the destination.", ko: "각 라우터는 목적지까지의 전체 경로가 아니라 [다음으로 넘겨줄 장비]만 정한다.", d: "패킷을 다음으로 넘겨줄 바로 옆 장비.", n: "'인터넷이 안 된다'는 대부분 어느 구간에서 next hop 결정이 실패했는가의 문제다." },
  { w: 2, a: "longest prefix match", en: "When several routes match, the most specific one wins by ___.", ko: "여러 경로가 겹치면 [가장 긴 접두사 일치] 규칙에 따라 가장 구체적인 경로가 이긴다.", d: "Routing Table에서 prefix가 가장 긴(가장 구체적인) 경로를 선택하는 규칙.", n: "0.0.0.0/0은 prefix 길이가 0이라 다른 경로가 없을 때만 쓰인다." },

  { w: 2, a: "public IP", alt: ["public IP address", "public address"], en: "To expose a service to the outside world, you need a ___ assigned by an ISP or a cloud provider.", ko: "외부에 서비스를 공개하려면 ISP나 클라우드가 할당한 [공인 주소]가 필요하다.", d: "인터넷에서 전역적으로 유일하게 식별되는 주소.", n: "ipconfig는 192.168.x.x를 보여 주는데 '내 IP 확인' 사이트는 다른 주소를 보여 주는 이유 = NAT." },
  { w: 2, a: "loopback", en: "127.0.0.1 is the ___ address that always points to my own computer.", ko: "127.0.0.1은 언제나 [내 컴퓨터 자신을 가리키는] 주소다.", d: "자기 자신을 가리키는 가상 인터페이스 주소. localhost는 보통 127.0.0.1(또는 ::1).", n: "127.0.0.1에 bind → 내 PC에서만 접근 / 0.0.0.0에 bind → 모든 interface에서 수신." },
  { w: 2, a: "bind", en: "If you ___ the server to 0.0.0.0, it listens on every interface.", ko: "서버를 0.0.0.0에 [묶으면] 모든 인터페이스에서 수신한다.", d: "소켓을 특정 IP·Port에 묶는 것. 어디에 bind하느냐가 '누가 접속할 수 있는가'를 정한다.", n: "0.0.0.0 = '이 PC의 모든 NIC에서 수신'이지 '인터넷에 공개'가 아니다. 공개 여부는 방화벽과 NAT이 결정." },
  { w: 2, a: "NAT", en: "___ lets many private hosts share a single public IP.", ko: "[주소 변환] 덕분에 여러 사설 호스트가 공인 IP 하나를 함께 쓴다.", d: "Network Address Translation. 나갈 때 Private → Public으로 바꾸고, 돌아올 때 원래 Host로 되돌린다.", n: "실제로는 Port까지 바꾸는 PAT/NAPT. NAT Table은 나갈 때 만들어지므로 밖에서 먼저 들어오기 어렵다." },
  { w: 2, a: "port forwarding", en: "With ___, the router maps 203.0.113.5:8080 to 192.168.0.23:8000.", ko: "[공유기에 외부→내부 연결 규칙을 걸면] 203.0.113.5:8080이 192.168.0.23:8000으로 연결된다.", d: "라우터에 '이 외부 포트는 이 내부 주소로' 규칙을 추가하는 방법.", n: "약점: 공인 IP·관리 권한 필요, IP 변동, 보안 노출. 대안: Reverse Tunnel, Cloud 배포." },
  { w: 2, a: "reverse tunnel", en: "Tools like ngrok open a ___ from the inside, so they pass through NAT and firewalls.", ko: "ngrok 같은 도구는 안에서 밖으로 [나가는 연결을 먼저 열어 되돌려 쓰는 통로]를 만들어 NAT와 방화벽을 통과한다.", d: "내부에서 외부로 먼저 연결을 열고 그 연결을 되돌려 쓰는 방식. ngrok, Cloudflare Tunnel, SSH -R.", n: "장점: NAT·방화벽 그대로 통과 / 약점: 외부 서비스 의존, 주소가 임시." },
  { w: 2, a: "DHCP", en: "___ automatically hands out the IP, mask, gateway, and DNS in four steps called DORA.", ko: "[IP 설정 자동 배정 프로토콜]은 IP, 마스크, 게이트웨이, DNS를 DORA 4단계로 나눠 준다.", d: "Dynamic Host Configuration Protocol. Discover → Offer → Request → Ack.", n: "Lease Time이 끝나기 전에 갱신하므로 내 IP는 언제든 바뀔 수 있다. 서버는 고정 IP나 DHCP 예약." },
  { w: 2, a: "lease time", en: "An address from DHCP must be renewed before its ___ runs out.", ko: "DHCP로 받은 주소는 [임대 기간]이 끝나기 전에 갱신해야 한다.", d: "DHCP가 준 IP를 쓸 수 있는 기간.", n: "ipconfig /release → /renew 로 직접 확인할 수 있다." },
  { w: 2, a: "ARP", en: "___ broadcasts 'Who has 192.168.1.20?' to find the matching MAC address.", ko: "[IP로 MAC 주소를 알아내는 프로토콜]은 'Who has 192.168.1.20?'이라고 전체에 묻는다.", d: "Address Resolution Protocol. IPv4 주소 → MAC 주소. 질의는 Broadcast, 응답은 Unicast.", n: "ARP Cache(arp -a)에 최근 IP ↔ MAC 대응을 임시 저장한다." },
  { w: 2, a: "port", en: "The IP address finds the host, and the ___ number finds the service inside it.", ko: "IP 주소는 호스트를 찾고, [서비스를 구분하는 번호]는 그 안의 서비스를 찾는다.", d: "한 Host 안에서 어떤 프로세스/서비스로 전달할지 구분하는 16비트 번호(0~65535).", n: "22 SSH · 53 DNS · 80 HTTP · 443 HTTPS · 3306 MySQL · 5432 PostgreSQL · 6379 Redis." },

  { w: 2, a: "security group", en: "In the cloud, a ___ blocks traffic before it even reaches the instance.", ko: "클라우드에서는 [인스턴스 앞단의 방화벽 규칙]이 트래픽을 인스턴스에 닿기 전에 막는다.", d: "Cloud 계층의 방화벽 규칙. '무엇만 허용하는가'로 작성한다.", n: "Cloud 계층(Security Group·NACL)과 Host 계층(Windows Firewall·ufw)을 모두 통과해야 접속된다." },
  { w: 2, a: "VPC", en: "A ___ is a virtual network you design yourself, such as 10.0.0.0/16.", ko: "[클라우드 안에 직접 설계하는 가상 네트워크]는 10.0.0.0/16처럼 주소 공간을 정해 만든다.", d: "Virtual Private Cloud. Public/Private Subnet, Route, IGW, NAT Gateway로 구성.", n: "Private Subnet은 밖으로 나갈 때만 NAT Gateway를 쓴다." },
  { w: 2, a: "refused", en: "Connection ___ means the packet arrived, but no process is listening on that port.", ko: "연결 [거부]는 패킷은 도착했지만 그 포트에서 기다리는 프로세스가 없다는 뜻이다.", d: "상대 호스트가 RST로 응답한 경우. 서버 미실행, 포트 오류, 127.0.0.1에만 bind 등.", n: "refused = '도착은 했다', timed out = '도착조차 못 했다'. 조사 방향이 반대다." },
  { w: 2, a: "timed out", alt: ["timeout"], en: "Connection ___ usually means a firewall silently dropped the packet.", ko: "연결 [시간 초과]는 보통 방화벽이 조용히 패킷을 버렸다는 뜻이다.", d: "SYN에 응답이 아예 없는 경우. 방화벽·Security Group·라우팅 문제를 의심.", n: "refused는 Service·Bind 쪽, timed out은 Firewall·Route 쪽부터 확인." },

  // ───────── Week 3 ─────────
  { w: 3, a: "TCP", en: "___ sets up a connection with a 3-way handshake and guarantees order and reliability.", ko: "[전송 제어 프로토콜]은 3-way handshake로 연결하고 순서와 신뢰성을 보장한다.", d: "Transmission Control Protocol. 연결형, 순서·재전송·중복 제거, 흐름·혼잡 제어. 헤더 20바이트 이상.", n: "TCP가 대신 해 주는 일의 목록이 곧 그 비용이다." },
  { w: 3, a: "UDP", en: "___ has an 8-byte header and sends data without any guarantees.", ko: "[사용자 데이터그램 프로토콜]은 8바이트 헤더만 붙여 아무 보장 없이 보낸다.", d: "User Datagram Protocol. 비연결형, 보낸 단위(데이터그램) 경계가 유지된다.", n: "'UDP가 빠르다'는 시작 지연·재전송 대기가 없다는 뜻이지, 대역폭이 더 크다는 뜻이 아니다." },
  { w: 3, a: "socket", en: "A ___ is the communication handle a process holds, seen as a file descriptor.", ko: "[프로세스가 쥐는 통신 손잡이]는 프로세스에게 파일 디스크립터로 보인다.", d: "프로토콜 + IP + Port로 지정되는 통신 endpoint. 프로세스에게는 정수 하나(fd).", n: "Port는 번호(주소), Socket은 그 주소에 묶인 통신 창구(객체). 한 포트 위에 수천 개의 소켓이 있을 수 있다." },
  { w: 3, a: "4-tuple", alt: ["four-tuple", "4 tuple"], en: "A TCP connection is identified by its ___: source IP, source port, destination IP, and destination port.", ko: "TCP 연결은 [네 값의 조합]으로 식별된다: 출발지 IP·포트, 목적지 IP·포트.", d: "출발지 IP, 출발지 Port, 목적지 IP, 목적지 Port. 하나라도 다르면 다른 연결.", n: "UDP demux는 (목적지 IP, 목적지 Port) 2-tuple만 본다." },
  { w: 3, a: "3-way handshake", alt: ["three-way handshake"], en: "The ___ exchanges SYN, SYN+ACK, and ACK before any data flows.", ko: "[3단계 연결 수립 절차]는 데이터를 보내기 전에 SYN, SYN+ACK, ACK를 주고받는다.", d: "초기 순서번호(ISN)를 교환하고 양쪽의 수신 능력을 확인하는 절차. 1 RTT 소모.", n: "왜 3번? 양방향 각각의 ISN 확인 + 오래된 중복 SYN 차단." },
  { w: 3, a: "SYN", en: "The client starts a connection by sending a ___ segment with seq = x.", ko: "클라이언트는 seq = x를 담은 [연결 요청 플래그] 세그먼트를 보내 연결을 시작한다.", d: "Synchronize. 연결 수립을 요청하고 초기 순서번호를 알리는 플래그.", n: "SYN 하나도 1바이트로 세기 때문에 응답은 ack = x+1이 된다." },
  { w: 3, a: "sequence number", en: "The ___ counts bytes, not segments, so the receiver can restore the order.", ko: "[순서 번호]는 세그먼트가 아니라 바이트를 세서 받는 쪽이 순서를 복원하게 한다.", d: "보낸 바이트의 위치. 순서 복원과 중복 제거의 기준.", n: "'세그먼트 3번'이 아니라 '1461번째 바이트부터'." },
  { w: 3, a: "ACK", en: "An ___ of 1461 means 'please send byte 1461 next.'", ko: "1461이라는 [확인 응답]은 '다음엔 1461번 바이트부터 주세요'라는 뜻이다.", d: "Acknowledgment. '여기까지 잘 받았다'는 누적 확인 응답. 값은 다음에 받고 싶은 순서번호.", n: "ACK는 커널이 받았다는 뜻이지, 상대 앱이 처리했다는 뜻이 아니다." },
  { w: 3, a: "MSS", en: "With an Ethernet MTU of 1500, the TCP ___ is 1460 bytes.", ko: "이더넷 MTU가 1500이면 TCP의 [최대 세그먼트 크기]는 1460바이트다.", d: "Maximum Segment Size. MTU − IP 헤더(20) − TCP 헤더(20).", n: "UDP라면 8바이트 헤더라서 1472바이트." },
  { w: 3, a: "MTU", en: "If a packet is larger than the ___, IP fragmentation happens.", ko: "패킷이 [한 번에 보낼 수 있는 최대 크기]를 넘으면 IP 단편화가 일어난다.", d: "Maximum Transmission Unit. 링크가 한 번에 실을 수 있는 최대 크기(이더넷 1500B).", n: "조각 하나만 잃어도 전체를 다시 보내야 한다 → VPN·터널 환경에서 MTU를 줄이는 이유." },
  { w: 3, a: "4-way handshake", alt: ["four-way handshake"], en: "TCP closes with a ___ because each direction is closed separately.", ko: "TCP는 방향마다 따로 닫기 때문에 [4단계 종료 절차]로 연결을 끝낸다.", d: "FIN → ACK → (데이터) → FIN → ACK. '3-way로 열고 4-way로 닫는다.'", n: "ACK와 FIN을 합치지 않는 이유: ACK를 받은 쪽이 아직 보낼 데이터가 남아 있을 수 있다(half-close)." },
  { w: 3, a: "FIN", en: "Sending a ___ means 'I have nothing more to send.'", ko: "[종료 플래그]를 보내는 것은 '나는 더 보낼 것이 없다'는 뜻이다.", d: "Finish. 한 방향의 전송이 끝났음을 알리는 플래그.", n: "recv()가 0을 반환하면 상대가 FIN을 보냈다는 신호." },
  { w: 3, a: "half-close", alt: ["half close"], en: "After receiving a FIN, the other side can keep sending data; this is called a ___.", ko: "FIN을 받은 뒤에도 상대는 계속 데이터를 보낼 수 있는데, 이를 [한쪽 방향만 닫힌 상태]라고 한다.", d: "한 방향만 닫히고 반대 방향은 여전히 열려 있는 상태.", n: "그래서 종료는 4단계가 된다." },
  { w: 3, a: "TIME_WAIT", alt: ["time wait"], en: "The side that closes first stays in ___ for 2×MSL.", ko: "먼저 닫은 쪽은 2×MSL 동안 [늦은 패킷을 흡수하며 기다리는 상태]로 남는다.", d: "마지막 ACK 유실 대비 + 늦게 온 옛 패킷이 새 연결에 섞이는 것을 막는 상태.", n: "TIME_WAIT은 정상 동작의 흔적(양이 문제), CLOSE_WAIT은 버그의 흔적(존재 자체가 문제)." },
  { w: 3, a: "CLOSE_WAIT", alt: ["close wait"], en: "If sockets pile up in ___, the application forgot to call close().", ko: "[상대가 닫았는데 내가 정리 못한 상태]의 소켓이 쌓이면 앱이 close()를 빠뜨린 것이다.", d: "상대의 FIN에 ACK는 보냈지만 내 앱이 아직 close()를 호출하지 않은 상태. 앱이 닫을 때까지 무한정 남는다.", n: "커널 설정으로는 해결되지 않는다. with 문·try/finally로 반드시 닫자." },
  { w: 3, a: "RTO", en: "___ = SRTT + 4 × RTTVAR.", ko: "[재전송 대기 시간] = SRTT + 4 × RTTVAR.", d: "Retransmission Timeout. RTT를 계속 추정해서 정하는 재전송 대기 시간.", n: "너무 짧으면 불필요한 재전송, 너무 길면 복구가 느려진다." },
  { w: 3, a: "exponential backoff", en: "When timeouts repeat, TCP doubles the waiting time each round using ___.", ko: "타임아웃이 반복되면 TCP는 [대기 시간을 매번 두 배로 늘리는 방식]을 쓴다.", d: "1×RTO → 2×RTO → 4×RTO → 8×RTO … 후 연결 포기.", n: "그래서 연결이 죽어도 앱이 한참 멈춰 있다 → 앱도 자기 타임아웃(settimeout)을 걸어야 한다." },
  { w: 3, a: "fast retransmit", en: "With ___, three duplicate ACKs trigger a resend before the timer expires.", ko: "[빠른 재전송]에서는 중복 ACK 3개가 오면 타이머가 끝나기 전에 바로 다시 보낸다.", d: "타임아웃을 기다리지 않고 3중 중복 ACK로 손실을 판단해 즉시 재전송.", n: "타임아웃 재전송 → cwnd = 1 (Slow Start부터) / 빠른 재전송 → cwnd 절반 (Fast Recovery)." },
  { w: 3, a: "sliding window", en: "A ___ lets the sender send many segments without waiting for each ACK.", ko: "[ACK가 오면 미끄러지는 전송 범위] 덕분에 송신자는 ACK를 하나씩 기다리지 않고 여러 세그먼트를 보낸다.", d: "윈도우 크기 = min(rwnd, cwnd). ACK가 오면 오른쪽으로 이동한다.", n: "한 조각씩 보내면 처리량이 MSS/RTT에 묶인다(RTT 30ms면 약 0.39 Mbps)." },
  { w: 3, a: "flow control", en: "___ protects the receiver's buffer by advertising rwnd.", ko: "[흐름 제어]는 rwnd를 알려 수신자 버퍼가 넘치지 않게 보호한다.", d: "수신자를 보호. 매 ACK에 '내 버퍼가 이만큼 남았다'(rwnd)를 실어 보낸다.", n: "Flow control = 상대 컵의 크기 / Congestion control = 중간 수도관의 굵기. 전송량은 둘 중 작은 값." },
  { w: 3, a: "congestion control", en: "___ protects the network itself by adjusting cwnd.", ko: "[혼잡 제어]는 cwnd를 조절해 네트워크 자체를 보호한다.", d: "네트워크를 보호. 손실과 지연 변화를 관찰해 송신자가 스스로 속도를 조절한다.", n: "Reno/NewReno(손실 기반) · CUBIC(리눅스 기본) · BBR(대역폭·RTT 기반)." },
  { w: 3, a: "slow start", en: "In ___, cwnd begins at 1 MSS and doubles every RTT.", ko: "[느린 시작] 단계에서 cwnd는 1 MSS에서 시작해 매 RTT마다 두 배가 된다.", d: "'느린 것'이 아니라 '낮게 시작'하는 것. ssthresh를 넘으면 Congestion Avoidance로.", n: "타임아웃이 나면 cwnd = 1로 돌아가 다시 Slow Start." },
  { w: 3, a: "AIMD", en: "___ means increasing slowly and cutting quickly.", ko: "[천천히 더하고 급히 곱해서 줄이는 방식]은 천천히 올리고 급히 내린다는 뜻이다.", d: "Additive Increase, Multiplicative Decrease. 3 dup ACK면 cwnd를 절반으로.", n: "이 비대칭이 인터넷이 붕괴하지 않는 이유이자 공평성(fairness)의 바탕." },
  { w: 3, a: "head-of-line blocking", alt: ["HOL blocking", "head of line blocking"], en: "When one segment is lost, everything behind it has to wait; this is ___.", ko: "한 조각이 빠지면 뒤에 도착한 데이터까지 모두 기다리는데, 이를 [앞줄 막힘 현상]이라 한다.", d: "앞의 데이터가 막혀 뒤의 데이터가 전달되지 못하는 현상.", n: "HTTP/2는 HTTP 계층의 HOL을 풀었지만 TCP 계층 HOL은 남아 있다 → HTTP/3(QUIC)." },
  { w: 3, a: "QUIC", en: "___ runs on top of UDP and combines transport setup and encryption in 1 RTT.", ko: "[UDP 위에서 동작하는 차세대 전송 프로토콜]은 전송 연결과 암호화 협상을 합쳐 1 RTT에 끝낸다.", d: "UDP 위에 신뢰성·혼잡 제어·TLS 1.3을 구현. 재방문 0-RTT, 스트림 단위 독립, Connection ID.", n: "HTTP/3는 443 포트를 쓰지만 UDP다. UDP 443이 막히면 조용히 TCP로 돌아간다." },
  { w: 3, a: "RST", en: "Sending a SYN to a closed port returns an ___, which the app sees as Connection refused.", ko: "닫힌 포트에 SYN을 보내면 [즉시 끊으라는 플래그]가 돌아와 Connection refused로 보인다.", d: "Reset. '이 연결은 없다, 즉시 끊어라.'", n: "Connection reset by peer = 상대가 RST로 연결을 버렸다." },
  { w: 3, a: "accept", en: "The ___() call takes an already-established connection out of the queue.", ko: "[대기열에서 연결을 꺼내는 함수]는 이미 맺어진 연결을 큐에서 꺼내 새 소켓을 돌려준다.", d: "핸드셰이크는 커널이 하고, accept()는 완성된 연결을 꺼내 '연결 소켓'을 반환한다.", n: "서버 소켓 = listen 소켓 1개 + accept()가 만든 연결 소켓 N개(모두 같은 포트, 다른 4-tuple)." },
  { w: 3, a: "backlog", en: "listen(128) sets the ___, the length of the accept queue.", ko: "listen(128)은 [접속 대기열의 길이]를 128로 정한다.", d: "핸드셰이크가 끝난 연결이 accept()를 기다리는 대기열 길이.", n: "앱이 accept()를 늦게 부르면 큐가 차서 새 연결이 버려진다." },
  { w: 3, a: "SYN flood", alt: ["SYN flooding"], en: "Filling the half-open connection queue with fake requests is a ___ attack.", ko: "가짜 요청으로 반쯤 열린 연결 대기열을 가득 채우는 것은 [연결 요청 폭주] 공격이다.", d: "SYN_RCVD 상태를 대량으로 만들어 SYN queue를 넘치게 하는 공격. SYN cookie로 대응.", n: "SYN queue(반쯤 열림)와 Accept queue(ESTABLISHED 대기)는 다른 큐다." },

  // ───────── Week 4 ─────────
  { w: 4, a: "DNS", en: "___ turns a domain name into an IP address.", ko: "[도메인 이름 시스템]은 도메인 이름을 IP 주소로 바꿔 준다.", d: "Domain Name System. 분산·계층형 이름 체계. 보통 UDP 53.", n: "DNS가 아는 것은 URL의 host뿐이다. path·query는 모른다." },
  { w: 4, a: "resolver", en: "A recursive ___ asks the root, TLD, and authoritative servers on your behalf.", ko: "재귀 [이름 해석 서버]는 사용자 대신 루트, TLD, 권한 서버에 차례로 묻는다.", d: "사용자 대신 끝까지 물어 답을 찾아 주는 재귀 DNS 서버(ISP, 8.8.8.8, 1.1.1.1).", n: "재귀 질의 = 클라이언트↔리졸버 / 반복 질의 = 리졸버↔각 서버." },
  { w: 4, a: "TTL", en: "A cached DNS answer can be reused until its ___ expires.", ko: "캐시된 DNS 응답은 [유효 시간]이 끝날 때까지 재사용된다.", d: "Time To Live. 응답을 재사용해도 되는 시간(초).", n: "'DNS 전파 48시간'은 전 세계 캐시의 TTL 만료를 기다리는 것. 이전 전에 TTL부터 낮춰 둔다." },
  { w: 4, a: "authoritative", en: "The final answer comes from the ___ server that holds the real records.", ko: "최종 답은 실제 레코드를 관리하는 [권한] 서버에서 나온다.", d: "도메인 소유자가 실제 레코드(A · CNAME · MX …)를 관리하는 서버.", n: "dig 결과의 aa 플래그 = 권한 서버가 직접 준 답." },
  { w: 4, a: "CNAME", en: "A ___ record makes www an alias of example.com.", ko: "[다른 이름의 별칭] 레코드는 www를 example.com의 별칭으로 만든다.", d: "다른 이름을 가리키는 별칭 레코드. CDN·SaaS 연결에 쓰인다.", n: "루트 도메인(example.com)에는 CNAME을 걸 수 없다 → ALIAS·ANAME 같은 확장." },
  { w: 4, a: "NXDOMAIN", en: "The DNS status ___ means the name does not exist at all.", ko: "DNS 상태 값 [그런 이름 없음]은 해당 도메인이 아예 없다는 뜻이다.", d: "Non-Existent Domain. 브라우저에선 ERR_NAME_NOT_RESOLVED로 보인다.", n: "SERVFAIL = 리졸버나 권한 서버가 답을 못 함. 'NXDOMAIN'도 negative TTL 동안 캐시된다." },
  { w: 4, a: "fragment", en: "The ___ part of a URL, like #profile, is never sent to the server.", ko: "#profile 같은 URL의 [페이지 안 위치 표시] 부분은 서버로 전송되지 않는다.", d: "페이지 안의 위치. 브라우저만 읽는다.", n: "scheme://host:port/path?query#fragment — 조각마다 읽는 주체가 다르다." },
  { w: 4, a: "query string", alt: ["query"], en: "The ___ ?fields=name&lang=ko carries key=value parameters.", ko: "[물음표 뒤 매개변수 부분] ?fields=name&lang=ko는 key=value 값을 담는다.", d: "key=value 매개변수. &로 구분하고 공백·한글은 퍼센트 인코딩.", n: "URL 쿼리에 넣은 토큰은 서버 로그·브라우저 기록·Referer에 남는다 → 비밀은 헤더나 본문으로." },
  { w: 4, a: "stateless", en: "HTTP is ___, so the server does not remember previous requests.", ko: "HTTP는 [이전 요청을 기억하지 않아서] 매 요청이 필요한 정보를 스스로 담아 와야 한다.", d: "서버가 이전 요청을 기억하지 않는 성질. 그래서 쿠키·토큰이 필요하다.", n: "서버는 먼저 말을 걸 수 없다 → 실시간 알림에는 WebSocket·SSE가 따로 필요." },
  { w: 4, a: "idempotent", en: "PUT is ___: sending it N times leaves the server in the same state as sending it once.", ko: "PUT은 [여러 번 보내도 결과가 같은] 메서드라서 N번 보내도 한 번 보낸 것과 상태가 같다.", d: "Idempotency(멱등성). 여러 번 보내도 한 번 보낸 것과 결과가 같은 성질.", n: "GET·PUT·DELETE는 멱등, POST는 아님. 자동 재시도는 멱등 요청에만 안전하다." },
  { w: 4, a: "Idempotency-Key", alt: ["idempotency key"], en: "Adding an ___ header makes a retried POST return the stored result instead of a new order.", ko: "[중복 처리 방지 키] 헤더를 붙이면 재시도된 POST가 새 주문 대신 저장된 결과를 돌려준다.", d: "같은 키로 온 요청은 저장된 결과를 반환하게 해 POST를 멱등하게 만드는 헤더.", n: "네트워크는 '요청 실패'와 '응답만 유실'을 구분해 주지 않는다 → 중복 결제 방지." },
  { w: 4, a: "Content-Length", alt: ["content length"], en: "The ___ header tells the receiver exactly how many bytes the body has.", ko: "[본문 바이트 수] 헤더는 본문이 정확히 몇 바이트인지 알려 준다.", d: "본문 바이트 수. HTTP/1.1이 TCP 스트림 위에서 메시지 경계를 만드는 방법.", n: "길이를 모르면 Transfer-Encoding: chunked. 값이 틀리면 응답이 잘리거나 영원히 기다린다." },
  { w: 4, a: "Not Modified", en: "304 ___ tells the browser to reuse its cached copy without a body.", ko: "304 [변경되지 않음]은 본문 없이 '캐시에 있는 것 그대로 써라'는 뜻이다.", d: "If-None-Match로 확인한 ETag가 그대로일 때 보내는 응답.", n: "본문이 없어 1 RTT에 적은 바이트만 오간다." },
  { w: 4, a: "Bad Gateway", en: "502 ___ means the proxy could not get a valid response from the backend.", ko: "502 [잘못된 게이트웨이]는 프록시가 뒷단에서 정상 응답을 받지 못했다는 뜻이다.", d: "프록시·LB가 뒷단 연결에 실패하거나 잘못된 응답을 받음. upstream 프로세스·포트 확인.", n: "502·504는 '프록시가 보고하는 뒷단의 전송 계층 실패'다." },
  { w: 4, a: "Gateway Timeout", en: "504 ___ means the backend did not answer within the time limit.", ko: "504 [게이트웨이 시간 초과]는 뒷단이 제한 시간 안에 답하지 않았다는 뜻이다.", d: "프록시가 뒷단 응답을 기다리다 시간 초과. 느린 쿼리·타임아웃 설정 확인.", n: "느린 쿼리 → App이 늦음 → 프록시 504." },
  { w: 4, a: "no-store", alt: ["no store"], en: "Use Cache-Control: ___ to forbid saving a private response anywhere.", ko: "개인정보 응답은 Cache-Control: [저장 자체 금지]로 어디에도 남지 않게 한다.", d: "캐시에 저장 자체를 금지. 개인정보·토큰 응답에 사용.", n: "no-cache는 '캐시하지 마라'가 아니라 '쓰기 전에 매번 확인하라'다." },
  { w: 4, a: "no-cache", alt: ["no cache"], en: "Cache-Control: ___ does not mean 'don't cache'; it means 'validate before every use.'", ko: "Cache-Control: [쓰기 전에 매번 확인]은 '캐시하지 마라'가 아니라 '매번 서버에 검증하라'는 뜻이다.", d: "저장은 하되, 쓰기 전에 매번 서버에 검증.", n: "저장 자체를 막으려면 no-store. AI가 만든 설정에서 가장 자주 틀리는 부분." },
  { w: 4, a: "ETag", en: "The server sends an ___ as a version ID, and the browser later asks with If-None-Match.", ko: "서버는 [자원 버전 식별자]를 보내고, 브라우저는 나중에 If-None-Match로 확인한다.", d: "Entity Tag. 자원 버전을 식별하는 값.", n: "같으면 304 Not Modified, 다르면 200 + 새 본문." },
  { w: 4, a: "Keep-Alive", alt: ["keep alive", "keepalive"], en: "HTTP/1.1 ___ reuses one TCP connection for many requests.", ko: "HTTP/1.1의 [연결 유지]는 TCP 연결 하나로 여러 요청을 재사용한다.", d: "요청마다 새 연결을 맺지 않고 연결을 재사용. 핸드셰이크 1번.", n: "그래도 HTTP/1.1은 한 연결에서 응답이 요청 순서대로만 나온다(HOL)." },
  { w: 4, a: "multiplexing", en: "HTTP/2 ___ runs many streams at once over a single connection.", ko: "HTTP/2의 [다중화]는 연결 하나에서 여러 스트림을 동시에 진행한다.", d: "한 연결 안에서 스트림 ID로 구분된 여러 요청·응답을 동시에 주고받는 것.", n: "HTTP/2는 '연결 6개'를 '연결 1개 + 스트림 N개'로 바꿨다. 도메인 샤딩은 오히려 역효과." },
  { w: 4, a: "HPACK", en: "HTTP/2 compresses repeated headers like Host and Cookie with ___.", ko: "HTTP/2는 Host, Cookie처럼 반복되는 헤더를 [헤더 압축 방식]으로 테이블 인덱스로 보낸다.", d: "HTTP/2의 헤더 압축. HTTP/3에서는 QPACK.", n: "HTTP/1.1은 헤더 압축이 없다." },
  { w: 4, a: "ALPN", en: "During the TLS handshake, ___ negotiates 'h2' as the HTTP version.", ko: "TLS 핸드셰이크 중 [응용 프로토콜 협상 확장]으로 'h2'를 HTTP 버전으로 합의한다.", d: "Application-Layer Protocol Negotiation. 협상된 값이 곧 HTTP 버전(h2, http/1.1).", n: "HTTP/3는 Alt-Svc 광고를 보고 다음 접속부터 ALPN 'h3'로 시도한다." },
  { w: 4, a: "Alt-Svc", alt: ["alt svc"], en: "The ___ header advertises h3, so the browser tries UDP 443 next time.", ko: "[대체 서비스 광고] 헤더가 h3를 알려 주면 브라우저는 다음부터 UDP 443을 시도한다.", d: "Alternative Service. 'h3=\":443\"'처럼 다른 프로토콜로도 접속할 수 있음을 알린다.", n: "첫 접속은 HTTP/2, 이후 HTTP/3." },
  { w: 4, a: "connection ID", alt: ["connection identifier"], en: "QUIC keeps the connection alive across Wi-Fi and LTE by using a ___.", ko: "QUIC는 [연결 식별자]를 써서 Wi-Fi↔LTE로 IP가 바뀌어도 연결을 유지한다.", d: "IP·Port가 아니라 ID로 연결을 식별하는 QUIC의 방식.", n: "TCP는 4-tuple로 식별하므로 IP가 바뀌면 연결이 끊긴다." },
  { w: 4, a: "TTFB", en: "If only ___ is long in DevTools, suspect server processing or a slow query.", ko: "DevTools에서 [첫 바이트가 오기까지의 시간]만 길면 서버 처리나 느린 쿼리를 의심한다.", d: "Time To First Byte. 요청을 보낸 뒤 응답 첫 바이트가 오기까지의 시간.", n: "DNS Lookup·Initial connection·SSL이 길면 거리/연결 재사용 문제, Content Download가 길면 응답 크기 문제." },
  { w: 4, a: "SNI", en: "The ClientHello carries the ___, so the domain name is still visible on the path.", ko: "ClientHello에는 [접속할 도메인 이름 표시]가 들어 있어 경로에서 도메인은 여전히 보인다.", d: "Server Name Indication. 한 IP에 여러 도메인이 있을 때 어느 인증서를 줄지 알려 주는 값.", n: "HTTPS는 '어디에 접속하는지(IP·SNI·DNS)'는 숨기지 못하고 '무엇을 주고받는지'를 숨긴다." },
  { w: 4, a: "ECDHE", en: "TLS agrees on a session key through ___ key exchange.", ko: "TLS는 [타원곡선 임시 디피-헬만] 키 교환으로 세션 키를 합의한다.", d: "양쪽이 공개값만 주고받는데 둘만 같은 비밀값을 계산하는 키 교환(X25519 등).", n: "매 연결마다 새 키 → Forward Secrecy." },
  { w: 4, a: "forward secrecy", alt: ["perfect forward secrecy", "PFS"], en: "Because session keys are new every time, ___ protects past traffic even if the private key leaks later.", ko: "세션 키를 매번 새로 만들기 때문에 [순방향 비밀성] 덕분에 나중에 개인키가 유출돼도 과거 트래픽은 안전하다.", d: "나중에 서버 개인키가 유출돼도 과거에 녹화된 트래픽을 풀 수 없는 성질.", n: "TLS 1.3은 이를 필수로 만들었다." },
  { w: 4, a: "CORS", en: "When the browser refuses to share a response from another origin, it shows a ___ error.", ko: "다른 출처의 응답 공유를 브라우저가 거부하면 [교차 출처 리소스 공유] 오류가 뜬다.", d: "Cross-Origin Resource Sharing. 서버가 Access-Control-Allow-Origin으로 허용해야 한다.", n: "CORS 오류는 서버가 이미 응답을 보낸 뒤 '브라우저가' 막은 것이다." },
  { w: 4, a: "Mixed Content", alt: ["mixed content"], en: "Calling an http:// API from an HTTPS page is blocked as ___.", ko: "HTTPS 페이지 안에서 http:// API를 부르면 [혼합 콘텐츠]로 차단된다.", d: "HTTPS 페이지 안의 HTTP 요청을 브라우저가 차단하는 것.", n: "모든 리소스·API를 HTTPS로 바꿔야 한다." },

  // ───────── Week 6 ─────────
  { w: 6, a: "authentication", alt: ["AuthN"], en: "___ answers the question 'Who are you?'", ko: "[인증]은 '당신은 누구인가?'라는 질문에 답한다.", d: "사용자의 신원을 확인하는 것(비밀번호·OTP·지문). 실패 시 401.", n: "Authentication(누구인가, 401) → Authorization(해도 되는가, 403) 순서. 인증은 로그인 때 한 번, 인가는 요청마다." },
  { w: 6, a: "authorization", alt: ["AuthZ"], en: "___ answers the question 'What are you allowed to do?'", ko: "[인가]는 '당신은 무엇을 해도 되는가?'라는 질문에 답한다.", d: "권한을 확인하는 것(역할·소유권·scope). 실패 시 403.", n: "다시 로그인해도 해결되지 않는다 — 권한 자체가 없기 때문." },
  { w: 6, a: "Unauthorized", en: "Despite its name, 401 ___ really means 'not authenticated.'", ko: "이름과 달리 401 [인가 안 됨(이라는 이름)]의 실제 의미는 '인증되지 않음'이다.", d: "토큰 없음·만료·서명 오류. '로그인하세요.'", n: "헤더 이름 Authorization도 사실은 인증 정보를 담는다." },
  { w: 6, a: "Forbidden", en: "403 ___ means the server knows who you are, but you lack permission.", ko: "403 [금지됨]은 서버가 누군지는 알지만 권한이 없다는 뜻이다.", d: "인증은 됐지만 권한이 없음. role·소유권 로직을 확인.", n: "존재 자체를 숨기려면 404를 쓰기도 한다." },
  { w: 6, a: "certificate", en: "A ___ is an electronic ID in which a CA signs that this public key belongs to the domain.", ko: "[전자 신분증]은 CA가 '이 공개키는 이 도메인 것'이라고 서명한 문서다.", d: "Subject/SAN · Issuer · 유효 기간 · 공개키 · CA 서명으로 구성.", n: "인증서는 '그 도메인의 주인'임을 보증할 뿐 '착한 사이트'임을 보증하지 않는다. 피싱 사이트도 받는다." },
  { w: 6, a: "Root CA", alt: ["root"], en: "Trust starts from the ___ that comes preinstalled in the OS and the browser.", ko: "신뢰는 OS와 브라우저에 미리 설치된 [최상위 인증기관]에서 시작한다.", d: "Trust Store에 내장된 자기 서명(Self-signed) 인증기관. 개인키는 오프라인 금고에.", n: "체인: Root CA → Intermediate CA → Leaf(서버 인증서)." },
  { w: 6, a: "intermediate CA", alt: ["intermediate"], en: "The server's leaf certificate is signed by an ___, not directly by the root.", ko: "서버 인증서는 루트가 아니라 [중간 인증기관]이 서명한다.", d: "Root가 서명한 CA. 평소 발급 업무를 담당해 Root를 직접 쓰지 않게 한다.", n: "서버가 Intermediate를 빠뜨리면 브라우저에선 되는데 curl·Python에선 실패하는 일이 흔하다 → fullchain.pem." },
  { w: 6, a: "public key", en: "Anyone can verify a signature with the ___.", ko: "서명은 누구나 [모두에게 공개된 키]로 검증할 수 있다.", d: "모두에게 공개해도 안전한 키. 암호화(잠그기)와 서명 검증에 쓴다. '열린 자물쇠'.", n: "공개키로 잠근 것은 개인키로만 열린다." },
  { w: 6, a: "private key", en: "If the server's ___ leaks, attackers can impersonate it, so never push key.pem to Git.", ko: "서버의 [혼자만 보관하는 키]가 유출되면 서버를 사칭할 수 있으니 key.pem을 Git에 올리면 안 된다.", d: "나만 보관하는 키. 복호화와 서명에 쓴다. '자물쇠의 열쇠'.", n: "공개키 방식은 대칭키보다 수백~수천 배 느려 키 교환·서명에만 쓴다." },
  { w: 6, a: "symmetric", en: "AES is a ___ cipher that uses the same key to lock and unlock.", ko: "AES는 잠글 때와 열 때 [같은 키를 쓰는] 암호다.", d: "대칭키 암호(AES, ChaCha20). 매우 빨라서 실제 데이터 암호화에 사용.", n: "문제: 처음 만난 상대와 키를 어떻게 나누지? → 공개키 기술(ECDHE)로 해결." },
  { w: 6, a: "hash", en: "A ___ is a one-way function, so you cannot recover the input from its output.", ko: "[단방향 요약 함수]는 결과로 입력을 되돌릴 수 없다.", d: "입력을 고정 길이 값으로 바꾸는 단방향 함수(SHA-256). 눈사태 효과·충돌 저항.", n: "해시 = 무결성 / HMAC = 무결성 + 비밀 공유자 / 전자서명 = 무결성 + 발급자 증명." },
  { w: 6, a: "salt", en: "Mixing in a random ___ makes the same password produce different hashes.", ko: "[사용자마다 다른 무작위 값]을 섞으면 같은 비밀번호라도 해시가 달라진다.", d: "가입할 때마다 섞는 무작위 값. 비밀이 아니며 해시 문자열 안에 함께 저장된다.", n: "레인보우 테이블을 무력화하지만, 그래도 SHA-256은 너무 빠르다 → 느린 해시(Argon2id)." },
  { w: 6, a: "rainbow table", en: "Salting defeats a ___, a list of precomputed hashes for common passwords.", ko: "솔트를 쓰면 흔한 비밀번호의 해시를 미리 계산해 둔 [색상표 공격]이 무력해진다.", d: "흔한 비밀번호의 해시를 미리 계산해 둔 표.", n: "123456, password, qwerty… 같은 입력을 미리 갈아 둔 '주스 색상표'." },
  { w: 6, a: "Argon2id", alt: ["argon2"], en: "Store passwords with a deliberately slow hash such as ___ or bcrypt.", ko: "비밀번호는 [시간과 메모리를 많이 쓰는 느린 해시]나 bcrypt로 저장한다.", d: "일부러 느리고 메모리를 많이 쓰는 비밀번호 해시. salt 자동 포함.", n: "정상 로그인은 0.1초여도 괜찮지만, 10억 번 대입하는 공격자에게는 3년이 된다." },
  { w: 6, a: "MFA", alt: ["2FA", "multi-factor authentication"], en: "A password plus an OTP app counts as ___.", ko: "비밀번호에 OTP 앱을 더하면 [다중 요소 인증]이 된다.", d: "서로 다른 종류의 인증 요소(지식·소유·생체)를 둘 이상 조합하는 것.", n: "비밀번호 + 보안 질문은 MFA가 아니다(둘 다 '지식' 요소). SMS는 약한 2FA." },
  { w: 6, a: "TOTP", en: "A ___ code is computed from a shared secret and the current 30-second window.", ko: "[시간 기반 일회용 비밀번호]는 공유 비밀값과 현재 30초 구간으로 계산된다.", d: "Time-based One-Time Password. 서버와 앱이 같은 비밀값 + 현재 시각으로 6자리를 각자 계산.", n: "그래서 네트워크 없이도 앱에서 코드가 생성된다." },
  { w: 6, a: "passkey", alt: ["FIDO2"], en: "A ___ signs with the device's private key, so the server stores only a public key.", ko: "[비밀번호 없이 기기 키로 하는 로그인]은 기기 개인키로 서명하므로 서버에는 공개키만 저장된다.", d: "FIDO2 기반. 기기 소유 + 생체/PIN. 피싱 저항.", n: "서버가 털려도 훔칠 비밀번호가 없다." },
  { w: 6, a: "cookie", en: "The server hands out a small ___ in a response header, and the browser attaches it to later requests automatically.", ko: "서버가 Set-Cookie로 [작은 이름표 값]을 주면 브라우저가 이후 요청에 자동으로 붙인다.", d: "브라우저가 사이트별로 보관하다가 조건이 맞으면 매 요청에 자동 첨부하는 작은 값(약 4KB).", n: "자동 첨부 = 편리함이자 CSRF의 원인." },
  { w: 6, a: "session ID", alt: ["session id", "sid"], en: "In session auth, the cookie holds only a random ___, and the user data stays on the server.", ko: "세션 방식에서 쿠키에는 무작위 [세션 식별 번호]만 담기고, 사용자 정보는 서버에 있다.", d: "의미 없는 무작위 번호(128비트 이상). '세탁소 번호표'.", n: "로그인 성공 시 새로 발급해야 한다(Session Fixation 방지)." },
  { w: 6, a: "HttpOnly", alt: ["http only"], en: "An ___ cookie cannot be read through document.cookie, which blocks theft via XSS.", ko: "[자바스크립트에서 읽을 수 없는] 쿠키는 document.cookie로 접근할 수 없어 XSS로 훔칠 수 없다.", d: "JS에서 쿠키 읽기를 차단하는 속성. 세션 쿠키에 필수.", n: "탈취는 막지만 그 페이지에서 요청을 보내는 것은 가능 → XSS 자체를 막는 게 먼저." },
  { w: 6, a: "Secure", en: "A cookie with the ___ attribute is sent only over HTTPS.", ko: "[HTTPS에서만 보내는] 속성이 있는 쿠키는 HTTPS 연결에서만 전송된다.", d: "평문 HTTP에서의 도청을 막는 쿠키 속성.", n: "SameSite=None이면 반드시 Secure와 함께 써야 한다." },
  { w: 6, a: "SameSite", alt: ["same site"], en: "Setting ___=Lax stops the cookie from riding along on cross-site POST requests.", ko: "[다른 사이트발 요청에 쿠키 동봉을 제한하는] 속성을 Lax로 두면 다른 사이트의 POST에는 쿠키가 붙지 않는다.", d: "Strict(가장 강함) / Lax(브라우저 기본, 링크 GET 이동만 허용) / None(모두 전송, Secure 필수).", n: "CSRF를 막는 가장 효과적인 방법." },
  { w: 6, a: "session fixation", en: "Issue a new session ID after login to prevent ___.", ko: "로그인 성공 후 세션 ID를 새로 발급해 [세션 고정 공격]을 막는다.", d: "공격자가 미리 정해 둔 세션 ID로 피해자가 로그인하게 만드는 공격.", n: "로그인 성공 시 기존 값 재사용 ✕, 새 세션/토큰 발급." },
  { w: 6, a: "JWT", en: "A ___ looks like header.payload.signature and can be verified without server storage.", ko: "[서명된 JSON 토큰]은 header.payload.signature 형태이며 서버 저장소 없이 검증된다.", d: "JSON Web Token. 서버는 서명만 검증하면 끝(Stateless).", n: "Session = 서버가 기억(즉시 차단 쉬움) / JWT = 토큰이 증명(Scale-out 유리, 강제 무효화 어려움)." },
  { w: 6, a: "payload", en: "Anyone can decode a JWT's ___, so never put a password in it.", ko: "JWT의 [클레임이 담긴 가운데 부분]은 누구나 디코딩할 수 있으니 비밀번호를 넣으면 안 된다.", d: "sub · role · exp 같은 클레임이 담긴 부분. Base64URL 인코딩일 뿐 암호화가 아니다.", n: "넣어도 되는 것: sub, role, scope, exp / 안 되는 것: 비밀번호, 개인정보, API 비밀키." },
  { w: 6, a: "signature", en: "Changing the role breaks the ___, so the server rejects the token.", ko: "role을 바꾸면 [위조 방지 서명]이 맞지 않아 서버가 토큰을 거부한다.", d: "header.payload를 비밀키(HS256)나 개인키(RS256)로 서명한 값.", n: "'디코딩'은 누구나 한다. 서버가 해야 하는 것은 '검증'이다." },
  { w: 6, a: "exp", en: "The ___ claim sets when the token expires, in Unix seconds.", ko: "[만료 시각] 클레임은 토큰이 언제 만료되는지 Unix 초 단위로 정한다.", d: "Expiration. 지나면 401 token expired.", n: "밀리초로 넣거나 서버 간 시계가 다르면 '바로 만료'가 생긴다." },
  { w: 6, a: "sub", en: "The ___ claim identifies the user, for example 2026001.", ko: "[토큰 주인(사용자) 식별] 클레임은 2026001처럼 사용자를 나타낸다.", d: "Subject. 등록 클레임: sub · exp · iss · aud · iat · jti.", n: "iss = 발급자, aud = 받을 대상 API도 함께 검증한다." },
  { w: 6, a: "Base64URL", alt: ["base64"], en: "The first two parts of a JWT are only encoded with ___, not encrypted.", ko: "JWT의 앞 두 덩어리는 [URL에 안전한 문자 인코딩]으로 포장만 되어 있을 뿐 암호화되지 않았다.", d: "바이트를 URL에 안전한 문자로 바꾸는 인코딩. 누구나 되돌릴 수 있다.", n: "인코딩(Base64) ≠ 암호화(AES) ≠ 서명(HMAC/RSA)." },
  { w: 6, a: "access token", en: "An ___ is a short-lived pass, about 15 minutes, used on every API call.", ko: "[짧은 수명의 출입증]은 약 15분 동안 모든 API 호출에 쓰인다.", d: "API 호출에 쓰는 짧은 수명 토큰. 저장은 메모리(JS 변수) 권장.", n: "자주 보여 주는 것은 짧게, 오래가는 것은 드물게 보여 주고 깊이 보관한다." },
  { w: 6, a: "refresh token", en: "When the access token expires, the client uses a ___ to get a new one.", ko: "Access Token이 만료되면 [새 출입증을 받기 위한 긴 수명 토큰]으로 새것을 받는다.", d: "수 일~수 주 수명. /token/refresh 한 곳에만 보내고 HttpOnly·Secure 쿠키에 보관.", n: "DB에 기록해 두면 로그아웃·비밀번호 변경 시 폐기할 수 있다." },
  { w: 6, a: "rotation", en: "Refresh token ___ issues a new refresh token every time and revokes the old one.", ko: "Refresh Token [교체]는 재발급할 때마다 새 토큰을 주고 이전 것은 폐기한다.", d: "이미 폐기된 RT가 다시 오면 '도난'으로 보고 그 사용자의 모든 토큰을 끊는다.", n: "Secret 유출 시에도 키 폐기·재발급(Rotation)이 먼저다." },
  { w: 6, a: "OAuth", en: "With ___ 2.0, an app gets limited access without ever seeing your Google password.", ko: "[권한 위임 표준] 2.0을 쓰면 앱이 구글 비밀번호를 보지 않고도 제한된 권한을 받는다.", d: "비밀번호 대신 scope가 제한된 Access Token을 제3자 앱에 위임하는 '인가' 프로토콜.", n: "역할: Resource Owner(나) · Client(앱) · Authorization Server · Resource Server. '발레파킹 키'." },
  { w: 6, a: "scope", en: "The OAuth ___ limits the token to specific actions, such as calendar.events.", ko: "OAuth [권한 범위]는 토큰이 calendar.events 같은 특정 행동만 하도록 제한한다.", d: "토큰에 허용된 행동 목록(grades:read, grades:write).", n: "필요한 최소 권한만 요청한다." },
  { w: 6, a: "PKCE", en: "___ stops a stolen authorization code from being used by checking a code verifier.", ko: "[코드 가로채기 방지 확장]은 code verifier를 확인해 훔친 인가 코드를 쓸 수 없게 한다.", d: "Proof Key for Code Exchange. ① challenge(해시)를 먼저 보내고 ⑤에서 원래 verifier를 보여 준다.", n: "토큰을 URL로 바로 주던 Implicit Flow는 더 이상 권장되지 않는다. SPA·모바일도 Code + PKCE." },
  { w: 6, a: "OpenID Connect", alt: ["OIDC"], en: "To also get the user's identity, layer ___ on top of OAuth and receive an ID token.", ko: "사용자 신원까지 받으려면 OAuth 위에 [신원 확인 계층]을 얹어 ID Token을 받는다.", d: "OAuth 2.0 위에 인증(ID Token)을 더한 표준. '구글로 로그인'.", n: "OAuth 자체는 '인가(권한 위임)' 프로토콜이다." },
  { w: 6, a: "API key", en: "An ___ identifies a program rather than a user, and it must never live in frontend code.", ko: "[사용자가 아닌 프로그램을 식별하는 고정 비밀 문자열]은 프론트엔드 코드에 넣으면 안 된다.", d: "앱·프로젝트를 식별하는 긴 수명의 비밀 문자열. 서버에서만 환경변수로 사용.", n: "API Key만으로는 '어떤 사용자인지' 알 수 없다. Git에 올라갔다면 즉시 폐기·재발급." },
  { w: 6, a: "RBAC", en: "With ___, permissions are tied to roles such as student and professor.", ko: "[역할 기반 접근 제어]에서는 학생, 교수 같은 역할에 권한을 묶는다.", d: "Role-Based Access Control.", n: "그 외: 소유권 검사(grade.student_id == user.sub), ABAC(속성 기반), Scope(OAuth)." },
  { w: 6, a: "IDOR", en: "Changing /students/2026001 to 2026002 and seeing someone else's grades is an ___ bug.", ko: "/students/2026001을 2026002로 바꿨더니 남의 성적이 보이는 것은 [소유권 검사 누락 취약점]이다.", d: "Insecure Direct Object Reference. 인증은 했지만 소유권을 검사하지 않은 API.", n: "방어: 서버에서 path의 id == 토큰의 sub 검사. UUID는 보조 수단일 뿐." },
  { w: 6, a: "least privilege", en: "The principle of ___ grants only the permissions needed, only for as long as needed.", ko: "[최소 권한] 원칙은 필요한 권한만, 필요한 시간만 준다.", d: "기본값은 '거부', 허용을 명시.", n: "프론트에서 버튼을 숨기는 것은 보안이 아니다 → 서버에서 매번 검사." },
  { w: 6, a: "XSS", en: "___ runs an attacker's script inside another user's page.", ko: "[교차 사이트 스크립팅]은 다른 사용자의 페이지 안에서 공격자의 스크립트를 실행시킨다.", d: "Cross-Site Scripting. 입력한 글이 '코드'로 실행되는 순간.", n: "방어: 출력 이스케이프, innerHTML 최소화, CSP 헤더, HttpOnly 쿠키(피해 축소)." },
  { w: 6, a: "CSP", alt: ["Content-Security-Policy", "content security policy"], en: "A ___ header such as script-src 'self' allows only scripts from trusted origins.", ko: "script-src 'self' 같은 [콘텐츠 보안 정책] 헤더는 허용된 출처의 스크립트만 실행하게 한다.", d: "Content-Security-Policy. XSS 피해를 줄이는 응답 헤더.", n: "처음부터 엄격하게 걸면 페이지가 깨진다 → Report-Only로 먼저 관찰." },
  { w: 6, a: "CSRF", en: "___ abuses automatic cookie attachment to send forged requests.", ko: "[교차 사이트 요청 위조]는 쿠키 자동 첨부를 악용해 위조된 요청을 보낸다.", d: "Cross-Site Request Forgery. 내 브라우저가 나도 모르게 보낸 요청.", n: "방어: SameSite=Lax/Strict, CSRF 토큰, Bearer 헤더 인증(자동 첨부 안 됨, 대신 XSS 주의)." },
  { w: 6, a: "SQL injection", alt: ["SQLi"], en: "Typing admin' -- into the ID field to skip the password check is ___.", ko: "아이디 칸에 admin' -- 를 넣어 비밀번호 검사를 건너뛰는 것은 [SQL 삽입 공격]이다.", d: "입력이 쿼리의 일부(문법)가 되어 버리는 공격.", n: "같은 뿌리: Command Injection, Prompt Injection. 공통 원칙: 데이터와 명령을 섞지 않는다." },
  { w: 6, a: "parameter binding", alt: ["prepared statement"], en: "___ treats input only as a value, so it can never become SQL syntax.", ko: "[매개변수 바인딩]은 입력을 '값'으로만 취급해 SQL 문법이 될 수 없게 한다.", d: "Prepared Statement. 쿼리 구조와 값을 분리해 전달. ORM도 내부적으로 사용.", n: "방어의 핵심은 '입력 필터링'이 아니라 '구조적 분리'. 따옴표 블랙리스트는 언제나 우회된다." },
  { w: 6, a: "credential stuffing", en: "Trying ID and password pairs leaked from other sites is called ___.", ko: "다른 사이트에서 유출된 아이디·비밀번호 쌍을 그대로 시도하는 것을 [유출 계정 재사용 공격]이라 한다.", d: "유출된 계정 정보를 그대로 대입하는 공격.", n: "Brute Force(모든 조합) · Dictionary(흔한 목록) · Password Spraying(많은 계정에 흔한 비번 1~2개)." },
  { w: 6, a: "rate limiting", alt: ["rate limit"], en: "___ returns 429 Too Many Requests after too many login attempts.", ko: "[요청 횟수 제한]은 로그인 시도가 너무 많으면 429 Too Many Requests를 돌려준다.", d: "IP·계정별 시도 횟수 제한. Retry-After 헤더로 대기 시간을 알린다.", n: "영구 잠금은 남의 계정을 일부러 잠그는 공격에 쓰인다 → 시간 기반 잠금 + 알림." },
  { w: 6, a: "HSTS", alt: ["Strict-Transport-Security"], en: "___ tells the browser to use only HTTPS for this site from now on.", ko: "[HTTPS로만 접속하라는 강제 정책]은 브라우저가 앞으로 이 사이트에 HTTPS로만 접속하게 한다.", d: "Strict-Transport-Security: max-age=31536000.", n: "http://로 시작하는 첫 요청 가로채기(SSL Strip)를 막는다." },
  { w: 6, a: "MITM", alt: ["man-in-the-middle", "man in the middle"], en: "A ___ attacker sits between you and the server to intercept the traffic.", ko: "[중간자] 공격자는 나와 서버 사이에 끼어들어 트래픽을 가로챈다.", d: "Man-In-The-Middle. 인증서 검증으로 막는다.", n: "암호화만으로는 부족하다 — '누구와' 암호화했는지가 중요. 인증서 경고를 무시하면 안 된다." },
  { w: 6, a: "clickjacking", en: "X-Frame-Options: DENY prevents ___ by blocking the page from being framed.", ko: "X-Frame-Options: DENY는 페이지가 iframe에 들어가지 못하게 해 [클릭 가로채기]를 막는다.", d: "투명한 iframe을 덮어 사용자가 모르게 클릭하게 만드는 공격.", n: "CSP frame-ancestors 'none'으로도 막을 수 있다." },
  { w: 6, a: "defense in depth", en: "___ layers protections so that a single breach doesn't break everything.", ko: "[다층 방어]는 보호 장치를 여러 겹으로 쌓아 한 곳이 뚫려도 전체가 무너지지 않게 한다.", d: "한 계층이 뚫려도 다음 계층이 피해를 줄이도록 설계하는 원칙.", n: "TLS는 네트워크 구간만 지킨다 — 브라우저(XSS), 서버 로직(IDOR), DB(SQLi)는 따로." }
];

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }

/* ── QUIZ ── */
let Q = null, cur = null;
function start(items){
  if (!items.length) return;
  Q = { items, queue: items.map(it => ({ it, again: false })), pos: 0, res: new Map(), t0: Date.now(), streak: 0 };
  items.forEach(it => Q.res.set(it.id, { it, first: null, mastered: false }));
  show("quiz"); load();
}
function progress(){
  const mastered = [...Q.res.values()].filter(r => r.mastered).length;
  $("bar").style.width = (mastered / Q.items.length * 100) + "%";
  $("cnt").textContent = `${mastered}/${Q.items.length}`;
}
function load(){
  try { speechSynthesis.cancel(); } catch (e) {}
  const q = Q.queue[Q.pos];
  cur = { it: q.it, again: q.again, attempts: 0, hint: false, revealed: false, done: false, buf: [], lock: 0, marks: [] };
  const it = cur.it;
  progress();
  $("chips").innerHTML = `<span class="chip">${WEEKS[it.w].t}</span>` + (cur.again ? `<span class="chip o">다시 나온 문제</span>` : "");
  if (it.abbr) {
    $("en").className = "en ab";
    $("en").innerHTML = `<span class="acr">${esc(it.acr)}</span><span class="acr-sub">이 약어의 풀네임은?</span><span class="blanks" id="blanks"></span>`;
  } else {
    const [L, R] = it.en.split("___");
    $("en").className = "en";
    $("en").innerHTML = esc(L) + `<span class="blanks" id="blanks"></span>` + esc(R || "");
  }
  $("ko").innerHTML = koHTML(it.ko);
  $("qcard").className = "qcard";
  setMsg("", "");
  $("info").className = "info"; $("info").innerHTML = "";
  $("btnHint").disabled = false; $("btnReveal").disabled = false;
  setFoot(false);
  drawBlanks(); readyState();
  $("qbody").scrollTop = 0;
}
function capLen(){ return Math.max(...[cur.it.a].concat(cur.it.alt || []).map(x => norm(x).length)); }
function drawBlanks(){
  const it = cur.it;
  const buf = cur.done ? [...it.a].filter(isAN) : cur.buf;
  const mk = i => (!cur.done && cur.marks[i]) ? " " + cur.marks[i] : "";
  let html = "";
  if (S.hide && !cur.done) {
    html = `<span class="bx hid act">` + buf.map((c, i) => `<span class="c${mk(i)}">${esc(c)}</span>`).join("") + `<span class="c cur"></span></span>`;
  } else {
    let k = 0, curSet = false;
    it.a.split(" ").forEach(tok => {
      let inner = "", act = false;
      [...tok].forEach(ch => {
        if (isAN(ch)) {
          const i = k++, c = buf[i];
          let cl = "c";
          if (c === undefined) { if (!curSet && !cur.done) { cl += " cur"; curSet = true; act = true; } }
          else cl += mk(i);
          inner += `<span class="${cl}">${c === undefined ? "" : esc(c)}</span>`;
        } else inner += `<span class="c fx">${esc(ch)}</span>`;
      });
      html += `<span class="bx${act ? " act" : ""}">${inner}</span>`;
    });
    if (k < buf.length) {
      const extra = buf.slice(k).map(c => `<span class="c">${esc(c)}</span>`).join("");
      html = html.replace(/<\/span>$/, extra + "</span>");
    }
  }
  $("blanks").innerHTML = html;
}
function setMsg(t, cls){ const m = $("msg"); m.textContent = t; m.className = "msg " + (cls || ""); }
function setFoot(done){
  $("tools").hidden = done; $("kb").hidden = done; $("btnNext").hidden = !done;
  if (done) $("btnNext").textContent = Q.pos + 1 >= Q.queue.length ? "결과 보기" : "다음 문제";
}
function readyState(){ const e = $("kEnter"); if (e) e.classList.toggle("ready", cur && cur.buf.length > cur.lock); }
function clearErr(){
  $("qcard").classList.remove("bad");
  const m = $("msg"); if (m.classList.contains("bad")) setMsg("", "");
}
function typeKey(ch){
  if (!cur || cur.done) return;
  if (cur.buf.length >= capLen()) { shake(); return; }
  const c = ch.toLowerCase(), i = cur.buf.length, tg = norm(cur.it.a);
  cur.buf.push(c);
  // live grading: a letter that continues the correct prefix turns green and stays
  if (i === cur.lock && tg[i] === c) { cur.marks[i] = cur.marks[i] || "k"; cur.lock = i + 1; }
  clearErr(); drawBlanks(); readyState();
  // whole answer typed correctly → grade without pressing 확인
  const v = cur.buf.join("");
  const auto = v === tg || (cur.it.alt || []).some(x => { const n = norm(x); return n === v && !tg.startsWith(n); });
  if (auto) { cur.auto = true; setTimeout(() => { if (cur && !cur.done && cur.buf.join("") === v) correct(); }, 180); }
}
function backspace(){
  if (!cur || cur.done) return;
  if (cur.buf.length <= cur.lock) { if (cur.lock) toast("맞힌 글자는 지워지지 않아요"); return; }
  cur.buf.pop(); clearErr(); drawBlanks(); readyState();
}

/* in-page keyboard */
const KB_ROWS = ["1234567890", "qwertyuiop", "asdfghjkl", "zxcvbnm⌫", "↵"];
(function buildKB(){
  const kb = $("kb");
  KB_ROWS.forEach((row, ri) => {
    const r = document.createElement("div"); r.className = "kr" + (ri === 0 ? " num" : "") + (ri === 3 ? " r3" : "");
    if (ri === 3) { const sp = document.createElement("span"); sp.className = "kspace"; r.appendChild(sp); }
    [...row].forEach(ch => {
      const b = document.createElement("button"); b.type = "button";
      if (ch === "⌫") { b.className = "key wide"; b.setAttribute("aria-label", "지우기"); b.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>`; b.dataset.k = "BS"; }
      else if (ch === "↵") { b.className = "key enter"; b.id = "kEnter"; b.textContent = "확인"; b.dataset.k = "EN"; }
      else { b.className = "key"; b.textContent = ch; b.dataset.k = ch; }
      r.appendChild(b);
    });
    kb.appendChild(r);
  });
  let rep = null, repT = null;
  const stop = () => { clearTimeout(repT); clearInterval(rep); repT = rep = null; kb.querySelectorAll(".pr").forEach(x => x.classList.remove("pr")); };
  kb.addEventListener("pointerdown", e => {
    const b = e.target.closest(".key"); if (!b) return;
    e.preventDefault(); b.classList.add("pr");
    const k = b.dataset.k;
    if (k === "BS") { backspace(); repT = setTimeout(() => { rep = setInterval(backspace, 70); }, 380); }
    else if (k === "EN") main();
    else typeKey(k);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => kb.addEventListener(ev, stop));
  kb.addEventListener("click", e => e.preventDefault());
})();
/* physical keyboard (desktop) */
document.addEventListener("keydown", e => {
  if (!cur || !$("quiz").classList.contains("on")) return;
  if ($("dlg").classList.contains("on") || $("sheet").classList.contains("on")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Enter") { e.preventDefault(); main(); return; }
  if (cur.done) return;
  if (e.key === "Backspace") { e.preventDefault(); backspace(); return; }
  if (/^[a-z0-9]$/i.test(e.key)) { e.preventDefault(); typeKey(e.key); }
});

function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const c = [i];
    for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    p = c;
  }
  return p[n];
}
function isMatch(v, it){ return [it.a].concat(it.alt || []).some(x => norm(x) === v); }

$("btnNext").onclick = () => next();
function main(){
  if (!cur) return;
  if (cur.done) return next();
  const v = cur.buf.join("");
  if (!v) { setMsg("빈칸에 들어갈 영어를 입력해 주세요", "bad"); shake(); return; }
  if (isMatch(v, cur.it)) return correct();
  cur.attempts++; Q.streak = 0;
  const t = norm(cur.it.a);
  let p = 0; while (p < v.length && p < t.length && v[p] === t[p]) p++;
  const d = lev(v, t);
  const close = d > 0 && d <= (t.length >= 7 ? 2 : 1);
  // keep only the correct prefix, lock and color it
  for (let i = cur.lock; i < p; i++) cur.marks[i] = cur.marks[i] || "k";
  cur.lock = Math.max(cur.lock, p);
  const hadWrong = v.length > p;
  let m;
  if (close) m = "아깝다! 철자를 다시 확인해 보세요";
  else if (p > 0) m = `앞 ${p}글자는 맞았어요. 이어서 입력해 보세요`;
  else m = "다시 생각해 보세요";
  if (cur.attempts >= 3 && !cur.hint) m += " · 힌트를 써 봐도 좋아요";
  setMsg(m, close || p > 0 ? "close" : "bad");
  $("qcard").classList.add("bad"); shake(); sndBad(); buzz(40);
  setTimeout(() => {
    if (!cur || cur.done) return;
    if (hadWrong) cur.buf = cur.buf.slice(0, p);
    $("qcard").classList.remove("bad");
    drawBlanks(); readyState();
  }, hadWrong ? 520 : 0);
}
function shake(){ const b = $("blanks"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
function finish(kind){
  cur.done = true;
  const r = Q.res.get(cur.it.id);
  const clean = kind === "ok" && cur.attempts === 0 && !cur.hint;
  if (r.first === null) r.first = clean;
  if (clean) r.mastered = true;
  else Q.queue.splice(Math.min(Q.pos + 4, Q.queue.length), 0, { it: cur.it, again: true });
  $("qcard").className = "qcard " + (kind === "ok" ? "ok" : "rv");
  drawBlanks();
  $("blanks").classList.add("pop");
  setFoot(true);
  showInfo(cur.it);
  progress();
  return clean;
}
function correct(){
  const clean = finish("ok");
  if (clean) { Q.streak++; setMsg(Q.streak >= 3 ? `정답! ${Q.streak}연속 🔥` : "정답!", "ok"); }
  else setMsg("정답! 이 문제는 조금 뒤에 한 번 더 나와요", "ok");
  sndOk(); buzz(15);
  if (S.speak) speak(fullEn(cur.it));
}
$("btnHint").onclick = () => {
  if (!cur || cur.done || cur.hint) return;
  const t = [...norm(cur.it.a)];
  const from = cur.lock;
  let to;
  if (cur.it.abbr) {
    // fill up to the end of the word the cursor is in
    let k = 0; to = t.length;
    for (const tok of cur.it.a.split(" ")) { k += [...tok].filter(isAN).length; if (k > from) { to = k; break; } }
  } else {
    to = Math.min(t.length, from + (t.length >= 6 ? 2 : 1));
  }
  if (to >= t.length) to = Math.max(from, t.length - 1); // never fill the whole answer
  if (to <= from) { toast("더 줄 힌트가 없어요"); return; }
  cur.hint = true;
  cur.buf = t.slice(0, to);
  for (let i = from; i < to; i++) cur.marks[i] = "h";
  cur.lock = to;
  $("btnHint").disabled = true;
  setMsg(`${to - from}글자를 채워 드렸어요`, "close");
  clearErr(); drawBlanks(); readyState(); sndHint();
};
$("btnReveal").onclick = () => {
  if (!cur || cur.done) return;
  cur.revealed = true; Q.streak = 0;
  finish("rv");
  setMsg("정답을 확인했어요. 조금 뒤에 다시 나와요", "rv");
  if (S.speak) speak(fullEn(cur.it));
};
function showInfo(it){
  const el = $("info");
  el.innerHTML = `<div class="term"><b>${it.abbr ? esc(it.acr) + " = " + esc(it.a) : esc(it.a)}</b><button class="spk" id="spkBtn" aria-label="예문 듣기"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button></div>${it.abbr ? `<p style="font-weight:700;margin-bottom:6px">${esc(koPlain(it.ko))}</p>` : ""}<p>${esc(it.d)}</p>` + (it.n ? `<div class="note"><h4>헷갈리기 쉬운 포인트</h4><p>${esc(it.n)}</p></div>` : "");
  el.className = "info on";
  $("spkBtn").onclick = e => { e.stopPropagation(); speak(fullEn(it)); };
  setTimeout(() => { const qb = $("qbody"); qb.scrollTo({ top: qb.scrollHeight, behavior: "smooth" }); }, 60);
}
function next(){
  Q.pos++;
  if (Q.pos >= Q.queue.length) return results();

}

$("btnQuit").onclick = () => { $("dim").classList.add("on"); $("dlg").classList.add("on") };

/* ── RESULT ── */
function results(early){
  try { speechSynthesis.cancel(); } catch (e) {}
  const rs = [...Q.res.values()];
  const seen = rs.filter(r => r.first !== null);
  const first = seen.filter(r => r.first).length;
  const missed = seen.filter(r => !r.first);
  const denom = seen.length || 1;
  const pct = Math.round(first / denom * 100);
  // update notes
  seen.forEach(r => {
    const id = r.it.id;
    if (r.first) { S.wrong = S.wrong.filter(x => x !== id); if (!S.mastered.includes(id)) S.mastered.push(id); }
    else { if (!S.wrong.includes(id)) S.wrong.push(id); S.mastered = S.mastered.filter(x => x !== id); }
  });
  save();
  const sec = Math.round((Date.now() - Q.t0) / 1000);
  $("rsTime").textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  $("rsFirst").textContent = first;
  $("rsMiss").textContent = missed.length;
  $("resPct").innerHTML = `${pct}<small>%</small>`;
  $("resTitle").textContent = !seen.length ? "아직 푼 문제가 없어요" : pct >= 90 ? "완벽에 가까워요!" : pct >= 70 ? "잘하고 있어요" : pct >= 40 ? "조금만 더 해 봐요" : "오늘이 시작이에요";
  $("resSub").textContent = early ? `${Q.items.length}개 중 ${seen.length}개를 풀고 멈췄어요` : `${seen.length}개 용어를 모두 외웠어요`;
  const arc = $("ringArc"); arc.style.strokeDashoffset = 351.86;
  requestAnimationFrame(() => requestAnimationFrame(() => { arc.style.strokeDashoffset = 351.86 * (1 - first / denom); }));
  const list = $("resList");
  const row = r => `<button class="li" data-id="${esc(r.it.id)}"><span class="dot ${r.first ? "y" : "n"}">${r.first ? "✓" : "✕"}</span><span class="t"><b>${esc(label(r.it))}</b><span>${r.it.abbr ? esc(r.it.a) : esc(r.it.d)}</span></span><span class="w">${WEEKS[r.it.w].t}</span></button>`;
  list.innerHTML = !seen.length ? `<h3>푼 용어가 없어요</h3>` :
    (missed.length ? `<h3>다시 봐야 할 용어 ${missed.length}</h3>` + missed.map(row).join("") : "") +
    (first ? `<h3>한 번에 맞힌 용어 ${first}</h3>` + seen.filter(r => r.first).map(row).join("") : "");
  list.querySelectorAll(".li").forEach(b => b.onclick = () => openSheet(BY_ID.get(b.dataset.id)));
  const rb = $("btnRetry"); rb.disabled = missed.length === 0; rb.textContent = missed.length ? `틀린 용어만 다시 풀기 (${missed.length})` : "틀린 용어가 없어요";
  rb.onclick = () => start(shuffle(missed.map(r => r.it)));
  show("result");
  $("result").querySelector(".res-scroll").scrollTop = 0;
}
$("btnHome").onclick = () => { renderHome(); show("home"); };

function openSheet(it){
  const sh = $("sheet");
  const [L, R] = it.abbr ? ["", ""] : it.en.split("___");
  sh.innerHTML = `<div class="grab"></div><div class="st"><b>${esc(label(it))}</b><span class="chip">${WEEKS[it.w].t}</span><button class="spk" id="shSpk" aria-label="예문 듣기" style="background:var(--g-bg);margin-left:auto"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button></div>` +
    (it.alt ? `<div style="font-size:13px;color:var(--mute)">다른 정답: ${it.alt.map(esc).join(", ")}</div>` : "") +
    (it.abbr ? `<div class="lbl">풀네임</div><p style="font-family:var(--mono);font-weight:700;color:var(--g-d)">${esc(it.a)}</p><div class="lbl">뜻</div><p>${esc(koPlain(it.ko))}</p><div class="lbl">강의 속 맥락</div><p>${esc(it.d)}</p>` :
    `<div class="lbl">뜻</div><p>${esc(it.d)}</p>` +
    `<div class="lbl">예문</div><div class="ex"><div class="e">${esc(L)}<u>${esc(it.a)}</u>${esc(R || "")}</div><div class="k">${koHTML(it.ko)}</div></div>`) +
    (it.n ? `<div class="lbl">헷갈리기 쉬운 포인트</div><div class="nt">${esc(it.n)}</div>` : "") +
    `<div style="height:14px"></div><button class="btn ghost" id="shClose">닫기</button>`;
  $("dim").classList.add("on"); sh.classList.add("on"); sh.scrollTop = 0;
  $("shClose").onclick = closeOverlays;
  $("shSpk").onclick = () => speak(fullEn(it));
}

renderHome();
try { speechSynthesis.getVoices(); } catch (e) {}
})();
</script>
</body>
</html>
