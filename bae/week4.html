body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.7;overflow:hidden}
header{height:64px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.brand{white-space:nowrap}
.brand b{display:block;font-size:15px;line-height:1.3}
.brand span{font-size:12px;color:var(--tx3)}
nav{display:flex;gap:5px;overflow-x:auto;flex:1;padding:4px 0;scrollbar-width:none}
nav button{flex:none;display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--bd);color:var(--tx2);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--tx3)}
nav button:hover{border-color:var(--bd2);color:var(--tx)}
nav button.on{background:var(--or);border-color:var(--or);color:#FFF8F0}
nav button.on i{color:#FFE3D4}
nav .sep{flex:none;color:var(--bd2);font-size:11px;align-self:center}
main{display:block;height:calc(100% - 64px)}
.stage{height:100%}
#ptr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#ptr .tip{animation:tipP 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tipP{50%{transform:scale(1.35)}}
.guide{position:absolute;left:40px;top:70px;width:0;height:0;transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:8}
.guide svg{position:absolute;left:-3px;top:-3px;overflow:visible;transform-origin:3px 3px;transition:transform .35s;filter:drop-shadow(2px 3px 2px rgba(61,43,31,.28))}
.guide.o1 svg{transform:scaleX(-1)}.guide.o2 svg{transform:scaleY(-1)}.guide.o3 svg{transform:scale(-1,-1)}
.guide .ring{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--or);opacity:0}
.guide.click .ring{animation:ring .9s ease-out}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.8);opacity:0}}
.guide.idle svg{animation:wig 2.6s ease-in-out infinite}
@keyframes wig{50%{translate:3px 3px}}
.bub{position:absolute;left:110px;top:60px;width:360px;background:#FFFDF8;border:2px solid var(--or);border-radius:14px;padding:11px 15px;font-size:15px;line-height:1.65;color:var(--tx);transition:left .8s cubic-bezier(.4,0,.2,1),top .8s cubic-bezier(.4,0,.2,1);z-index:6;box-shadow:0 6px 18px rgba(61,43,31,.12)}
.bub b{font-weight:500;color:var(--orD)}
.bub .gap{display:block;height:.6em}
.bub .ghint{display:block;margin-top:6px;font-size:13px;color:var(--tx2)}
.btn.pulse{animation:bp 1.2s ease-in-out infinite}@keyframes bp{50%{box-shadow:0 0 0 5px rgba(217,119,87,.28)}}
.bar{position:absolute;left:12px;right:12px;bottom:10px;min-height:56px;display:flex;align-items:center;gap:7px;padding:8px 10px;background:rgba(251,248,242,.95);border:1px solid var(--bd);border-radius:12px;z-index:7;overflow-x:auto}
.bar .bpos{font-family:var(--mono);font-size:12.5px;color:var(--tx2);min-width:46px;text-align:center}
.bar .sep{width:1px;align-self:stretch;background:var(--bd);margin:0 4px}
.bar .simLab{font-size:12px;color:var(--tx3);white-space:nowrap}
.simBtns{display:flex;gap:6px;flex-wrap:nowrap}
button.btn.sm{font-size:12.5px;padding:6px 10px;white-space:nowrap}
#bAuto.on{background:var(--orL);border-color:var(--or);color:var(--orD)}
.scope span{color:var(--tx3)}
.gp{position:absolute;left:16px;top:56px;width:320px;background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;padding:8px 10px;display:none;z-index:4}
.gpT{font-size:12px;color:var(--tx2)}

.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#FDF9F1 0%,#F2EADC 78%)}
#sv{width:100%;height:100%;display:block;user-select:none}
#sv text{font-family:var(--font)}
#sv .mono{font-family:var(--mono)}
#sv text{paint-order:stroke fill;stroke:#FBF6EC;stroke-width:.3em;stroke-linejoin:round}
#sv text.nohalo{stroke:none}
.cap{position:absolute;left:215px;right:165px;bottom:12px;margin:0 auto;width:fit-content;max-width:calc(100% - 380px);background:rgba(61,43,31,.9);color:#FFF8F0;font-size:14.5px;line-height:1.55;padding:9px 16px;border-radius:10px;display:none;text-align:center;pointer-events:none}
.cap.show{display:block}
.ns{vector-effect:non-scaling-stroke}
#sv.hiSend .mssMark{opacity:.15}
#sv.hiMss .sendMark{opacity:.15}
.scope{position:absolute;left:16px;top:14px;font-size:13px;color:var(--tx2);background:rgba(255,253,248,.92);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;pointer-events:none}
.scope b{color:var(--tx);font-weight:500}
.hud{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;align-items:center;padding:6px;border-radius:12px;background:rgba(251,248,242,.9);border:1px solid var(--bd)}
.hint{position:absolute;right:16px;bottom:20px;font-size:12px;color:var(--tx3);pointer-events:none;background:rgba(251,248,242,.9);padding:3px 8px;border-radius:6px}
button.btn{background:var(--bg3);border:1px solid var(--bd2);color:var(--tx);font:inherit;font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;line-height:1.3}
button.btn:hover{border-color:var(--or)}
button.btn:disabled{opacity:.4;cursor:default}
button.btn.pri{background:var(--or);border-color:var(--or);color:#FFF8F0}
button.btn.pri:hover{background:#C9663F}
/* header card */
#rcol{position:absolute;right:16px;top:14px;width:350px;display:flex;flex-direction:column;gap:8px;z-index:4;max-height:calc(100% - 110px)}
.hc{position:relative;width:100%;flex:0 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;overflow:hidden}
.hcBtn{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:none;font:inherit;font-size:13px;color:var(--tx);padding:8px 12px;cursor:pointer;text-align:left}
.hcBtn b{font-weight:500}
.hcBtn .cnt{font-family:var(--mono);font-size:12px;color:var(--or)}
.hcBtn .chev{margin-left:auto;color:var(--tx3);transition:transform .25s}
.hc.open .chev{transform:rotate(180deg)}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--or);color:#FFF8F0;display:none}
.pill.show{display:inline-block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.hcBody{display:none;padding:2px 12px 12px;border-top:1px solid var(--bd)}
.hc.open .hcBody{display:block}
.hc .hcBody{overflow-y:auto;min-height:0}
.hcBtn{flex:none}
.lg{max-height:100%;display:flex;flex-direction:column;flex:0 1 auto;min-height:0}
.lg .hcBody{overflow-y:auto;min-height:0}
.lg.open .hcBody{display:block}
.lgI{padding:7px 0;border-bottom:1px solid var(--bd);font-size:12.5px;line-height:1.55;color:var(--tx2)}
.lgI:last-child{border-bottom:none}
.lgI b{color:var(--tx);font-weight:600;margin-right:6px}
.lgI.new b{color:var(--orD)}
.lgI.new b::after{content:'NEW';font-size:9.5px;font-weight:600;color:#FFF8F0;background:var(--or);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px}
.spd{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12.5px;color:var(--tx2);flex:none;padding-left:8px}
.spd input{width:90px;accent-color:#D97757}
.spd b{font-family:var(--mono);color:var(--orD);min-width:22px}
.hgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px}
.hf{border:1px dashed #D9CBB4;border-radius:6px;padding:4px 7px;min-height:44px;background:var(--bg4);transition:all .3s}
.hf .n{font-size:10.5px;color:var(--tx3);line-height:1.3}
.hf .v{font-family:var(--mono);font-size:12.5px;color:#B9A78F;line-height:1.5}
.hf .m{display:none;font-size:10.5px;color:var(--tx2);line-height:1.35}
.hf.on{border:1px solid #E8B9A3;background:var(--orL)}
.hf.on .n{color:#A9573A}.hf.on .v{color:var(--tx)}.hf.on .m{display:block}
.hf.new{border:2px solid var(--or);background:#F9D9C8}
.hf.new .v{color:#7A3115}
.hcNote{font-size:12px;color:var(--tx2);margin-top:8px;line-height:1.55}
.udp{display:none;margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd2)}
.udp.show{display:block}
.udp .hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.udp .hf{border:1px solid #CBB8E0;background:#F1EBF8}
.udp .hf .n{color:#6B4FA0}.udp .hf .v{color:var(--tx)}
/* panel */
aside{border-left:1px solid var(--bd);background:var(--bg2);overflow-y:auto;padding:22px 22px 48px}
.kicker{font-size:12px;color:var(--tx3);letter-spacing:.04em}
aside h2{font-size:24px;font-weight:700;margin:2px 0 8px;line-height:1.3}
.q{font-size:15px;color:var(--orD);background:var(--orL);border-left:3px solid var(--or);padding:8px 12px;margin:0 0 12px}
.q small{display:block;font-size:11.5px;color:#B56A4B}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--bd2);color:var(--tx2);background:var(--bg3)}
.body p{margin:0 0 10px}
.body ul{margin:0 0 10px 18px}
.body li{margin-bottom:5px}
.body b{font-weight:500;color:var(--orD)}
.body table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 10px}
.body td{border-bottom:1px solid var(--bd);padding:5px 4px;vertical-align:top}
.body td:last-child{font-family:var(--mono);font-size:12.5px;color:var(--orD);white-space:nowrap}
code{font-family:var(--mono);font-size:12.5px;background:#F3E6DA;padding:1px 5px;border-radius:4px;color:var(--orD)}
.ctrl{margin:14px 0 8px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg3)}
.ctrl .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .lab{font-size:12px;color:var(--tx3);margin-bottom:8px}
.note{font-size:14px;margin-top:10px;min-height:48px}
.log{font-size:13px;color:var(--tx2);margin:8px 0 0;min-height:20px}
.log div{padding:3px 0 3px 10px;border-left:2px solid var(--bd2);margin-bottom:4px}
.log div:first-child{border-left-color:var(--or);color:var(--tx)}
.readout{font-family:var(--mono);font-size:12.5px;margin-top:8px}
#g6{width:100%;height:auto;display:block;margin:8px 0 4px;background:var(--bg2);border-radius:8px;border:1px solid var(--bd)}
.tips{margin-top:18px;padding:12px 14px;border:1px solid #E8D3A8;border-radius:10px;background:#FBF3E2}
.tips h4{font-size:13px;color:#8A5A0A;margin-bottom:6px;font-weight:500}
.tips ul{margin-left:16px;font-size:13.5px}
.tips li{margin-bottom:6px}
.sum{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--orL);border:1px solid #E8B9A3;font-size:14px}
.sum b{display:block;font-size:12px;color:var(--or);font-weight:500;margin-bottom:2px}
.navrow{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
@media (max-width:960px){.brand span{display:none}#rcol{width:280px}.bub{font-size:14px}}

/* ===== PIXEL THEME ===== */
*{border-radius:0!important}
html,body{-webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;font-smooth:never}
body{font-size:13px;letter-spacing:0}
b,strong{font-weight:700!important}
header{border-bottom:3px solid var(--tx);background:#FBF3E4;height:64px}
.brand b{font-size:15px;color:var(--orD)}
nav button{border:2px solid var(--tx);box-shadow:2px 2px 0 var(--tx);font-size:12px;padding:3px 9px;background:#FFFBF2;color:var(--tx)}
nav button:hover{background:var(--orL)}
nav button.on{background:var(--or);border-color:var(--tx);color:#FFF8F0}
nav button i{color:var(--tx3)}
.stage{background-color:#F4ECDD;background-image:linear-gradient(90deg,rgba(61,43,31,.055) 2px,transparent 2px),linear-gradient(rgba(61,43,31,.055) 2px,transparent 2px);background-size:24px 24px}
#sv{shape-rendering:crispEdges;text-rendering:optimizeSpeed}
#sv text{shape-rendering:auto;stroke-linejoin:miter;stroke-width:.32em}
#sv rect{rx:0;ry:0}
#sv .ns[stroke-width="1"]{stroke-width:2px}
#sv .ns[stroke-width="1.5"]{stroke-width:2px}
.scope{border:2px solid var(--tx);box-shadow:3px 3px 0 var(--tx);background:#FFFBF2;font-size:12px}
.bub{border:3px solid var(--tx);box-shadow:6px 6px 0 var(--or);background:#FFFBF2;font-size:14px;line-height:1.75;padding:12px 16px;transition:none}
.bub b{color:var(--orD)}
.bub .ghint{font-size:12px;color:var(--tx2);border-top:2px dashed var(--bd2);padding-top:6px}
.bar{border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:#FBF3E4}
button.btn{border:2px solid var(--tx);box-shadow:3px 3px 0 var(--tx);background:#FFFBF2;font-size:12.5px;padding:6px 12px;transition:none}
button.btn:hover{background:var(--orL);border-color:var(--tx)}
button.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tx)}
button.btn.pri{background:var(--or);border-color:var(--tx);color:#FFF8F0}
button.btn.pri:hover{background:#C9663F}
button.btn:disabled{opacity:.45;box-shadow:none}
.btn.pulse{animation:bpx 1s steps(30) infinite}
@keyframes bpx{50%{box-shadow:3px 3px 0 var(--tx),0 0 0 4px var(--or)}}
#bAuto.on{background:var(--orL);color:var(--orD)}
.hc{border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:#FFFBF2;overflow:visible}
.hc .hcBody{border-top:2px solid var(--tx)}
.hcBtn .chev{transition:none}
.pill{border:2px solid var(--tx);font-size:10px;padding:0 6px}
.pill.show{animation:blinkpx 1.2s steps(36) infinite}
@keyframes blinkpx{50%{opacity:.35}}
.hf{border-radius:0}
.hf.on{border:2px solid var(--tx)}
.hf.new{border:2px solid var(--or);box-shadow:2px 2px 0 var(--orD)}
.lgI{border-bottom:2px dotted var(--bd2)}
.lgI.new b::after{border:1px solid var(--tx)}
.gp{border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:#FFFBF2}
code{border:1px solid var(--bd2)}
.spd input{-webkit-appearance:none;appearance:none;height:10px;background:var(--bg4);border:2px solid var(--tx);outline:none}
.spd input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:18px;background:var(--or);border:2px solid var(--tx);cursor:pointer}
.spd input::-moz-range-thumb{width:10px;height:16px;background:var(--or);border:2px solid var(--tx);border-radius:0;cursor:pointer}
.guide{transition:none}
.guide svg{left:0;top:0;transform-origin:0 0;transition:none;filter:drop-shadow(3px 3px 0 rgba(61,43,31,.35));shape-rendering:crispEdges}
.guide .ring{border:3px solid var(--or)}
.guide.click .ring{animation:ringpx .6s steps(18)}
@keyframes ringpx{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.8);opacity:0}}
.guide.idle svg{animation:wigpx 1.4s steps(42) infinite}
@keyframes wigpx{50%{translate:3px 3px}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bd2);border:2px solid var(--tx)}::-webkit-scrollbar-track{background:var(--bg4)}

/* ===== 가독성: 폰트별 설계 크기에 맞춤 ===== */
:root{--tx:#24170E;--tx2:#4F3D2E;--tx3:#7C6652}
body{font-size:12px}
.bub{font-family:'Galmuri14',var(--font);font-size:15px;line-height:1.8;color:var(--tx)}
.bub .ghint{font-family:var(--font);font-size:12px}
.lgI{font-family:'Galmuri14',var(--font);font-size:15px;line-height:1.7;color:var(--tx)}
.lgI b{font-family:var(--font);font-size:12px;display:block;margin:0 0 2px}
.lgI.new b::after{font-family:'Galmuri9',var(--font);font-size:10px}

/* 배속: 화면 전체에 적용 */

let epoch=0;
function sleep(ms,ep){return new Promise((res,rej)=>setTimeout(()=>ep===epoch?res():rej('stop'),ms/SPD));}
function tween(ms,fn,ep){ms=ms/SPD;const FQ=Math.max(3,Math.round(ms/33.3));return new Promise((res,rej)=>{const st=performance.now();fn(0);
  (function f(n){if(ep!==undefined&&ep!==epoch)return rej('stop');const t0=Math.min(1,(n-st)/ms),t=t0>=1?1:Math.floor(t0*FQ)/FQ;fn(t);if(t<1)requestAnimationFrame(f);else res();})(st);});}

function pill(f,label,color,fs){fs=fs||14;const g=G(OV[f]);const w=label.length*fs*0.62+fs*1.2,h=fs*1.7;
  g._r=R(g,-w/2,-h/2,w,h,{fill:'#FFFBF2',stroke:color,sw:2});R(g,-w/2,-h/2,w,h,{fill:rgba(color,.2)});g._t=T(g,0,0,fs,label,{mono:true,cls:'nohalo'});
  g.set=(t,c)=>{g._t.textContent=t;const w2=t.length*fs*0.62+fs*1.2;[g.childNodes[0],g.childNodes[1]].forEach(n=>{n.setAttribute('x',-w2/2);n.setAttribute('width',w2);});
    if(c){g.childNodes[0].setAttribute('stroke',c);g.childNodes[1].setAttribute('fill',rgba(c,.2));}};return g;}
function place(g,p){g.setAttribute('transform','translate('+p[0]+','+p[1]+')');}
function along(g,pts,ms,ep){const seg=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);tot+=d;}
  return tween(ms,t=>{const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;let d=e*tot,i=0;while(i<seg.length-1&&d>seg[i]){d-=seg[i];i++;}const f=seg[i]?Math.min(1,d/seg[i]):1;
    place(g,[pts[i][0]+(pts[i+1][0]-pts[i][0])*f,pts[i][1]+(pts[i+1][1]-pts[i][1])*f]);},ep);}
function fly(f,label,color,pts,ms,ep,fs){const g=pill(f,label,color,fs);place(g,pts[0]);return along(g,pts,ms,ep).then(()=>g);}

[{t:[935,85],s:'아까 shop.com 권한 서버는 IP 대신 "www는 <b>d123.cdn.net</b>의 별명(CNAME)"이라고 답했어요. 이 한 줄이 길을 바꿔요.'},
 {btn:'cdn',s:'별명을 끝까지 따라가 볼게요.'},
 {view:VE,t:GT(37.5,127),s:'초록 점들이 CDN의 <b>엣지 서버</b>예요. 쇼핑몰 원본을 전 세계에 복사해 두고 가까운 곳에서 답해요.'},
 {btn:'geo',s:'그런데 CDN DNS는 내가 서울에 있는 걸 어떻게 알까요?'},
 {view:VW,btn:'rr',s:'다시 지도로 왔어요. DNS로 길을 나누는 더 단순한 방법도 있어요. 원본 서버가 여러 대일 때요.'},
 {btn:'fo',s:'그중 한 대가 죽으면?'},
 {t:[763,136],s:'정리하면 DNS가 길을 정하는 네 방법: <b>CNAME</b>(남에게 위임) · <b>GeoDNS</b>(가까운 곳) · <b>Round Robin</b>(나눠 주기) · <b>Failover</b>(죽은 곳 빼기).'+GP+'넷 다 <b>TTL</b>의 지배를 받아요. 답을 바꿔도 캐시가 끝나야 퍼져요.'}],
/* 4 */
[{t:[500,26],s:'IP를 알았으니 엣지에 연결할 차례예요. 그런데 카페 Wi-Fi엔 <b>도청자</b>가 있을 수 있어요. 3주차에서 본 것처럼 평문은 다 보여요. 그래서 <b>TLS</b>로 감싸요.'+GP+'<b>TLS</b>(Transport Layer Security, 전송 계층 보안)는 오가는 데이터를 <b>암호화</b>하고, 상대가 <b>진짜 그 서버인지 확인</b>하는 규칙이라는 뜻이에요. https의 s가 바로 이거예요.'+GP+'TLS를 이해하려면 재료 세 가지를 먼저 알아야 해요.'},
 {t:[175,205],s:'① <b>대칭키 암호</b>: 같은 열쇠로 잠그고 열어요. 아주 빨라서 실제 HTTP 데이터는 전부 이걸로 잠가요.'+GP+'문제는 처음 보는 엣지 서버와 <b>열쇠를 어떻게 나누냐</b>예요. 열쇠를 그냥 보내면 도청자도 받아요.'},
 {t:[445,175],s:'② <b>공개키 · 서명</b>: 주인만 가진 <b>개인키</b>로 도장을 찍고, 누구나 가진 <b>공개키</b>로 "진짜 그 도장 맞네"를 확인해요.'+GP+'느려서 데이터를 잠그는 데는 안 쓰고, <b>상대가 진짜인지</b> 확인하는 데만 써요.'},
 {t:[500,446],s:'<b>인증서</b>는 "이 공개키는 www.shop.com의 것"이라고 믿을 만한 기관(CA)이 <b>서명해 준 문서</b>예요. 5단계에서 은행 사업자등록증으로 다시 만나요.'},
 {t:[825,76],s:'③ <b>키 교환(ECDHE)</b>: 열쇠를 보내지 않고, 공개값만 주고받아서 <b>양쪽이 같은 비밀</b>을 만들어요. 말로는 마술 같으니 진짜 숫자로 해 볼게요.'},
 {btn:'dh',s:'작은 숫자로 키 교환을 해 볼게요.'},
 {btn:'fs',s:'매 연결마다 a, b를 새로 고르는 게 왜 중요할까요?'},
 {t:[500,26],s:'정리: <b>③으로 열쇠를 만들고</b>, <b>②로 상대가 진짜인지 확인하고</b>, <b>①로 데이터를 잠가요</b>. TLS는 이 셋을 한 번의 악수에 묶은 절차예요.'}],
/* 5 */
[{view:VCAFE,btn:'tcp',s:'TLS 전에 먼저 길부터 놓아요.'},
 {view:VK,t:[500,26],s:'서울 엣지 안으로 들어왔어요. TLS 악수를 <b>은행 창구</b>로 비유해 볼게요. 손님(브라우저)이 은행(엣지)에게 "진짜 shop.com 맞아요?"를 확인하고, 둘만 아는 금고 비밀번호를 정하는 자리예요.'},
 {t:[240,420],s:'은행은 <b>사업자등록증(Leaf 인증서)</b>을 보여 줘요. 그건 <b>Intermediate CA</b>(중간 인증 기관)가 발급했고, 그 기관은 <b>Root CA</b>가 보증해요.'+GP+'<b>CA</b>(Certificate Authority, 인증 기관)는 "이 공개키는 이 도메인 것"이라고 도장을 찍어 주는 기관이라는 뜻이에요.'},
 {t:[240,395],s:'<b>Root CA</b>는 신뢰의 맨 꼭대기 기관이라는 뜻이에요.'+GP+'Apple · Microsoft · Google · Mozilla가 보안 심사를 통과한 수십 곳만 골라, 그 기관들의 <b>Root 인증서(공개키)</b>를 OS와 브라우저에 <b>처음부터 넣어서</b> 배포해요. 업데이트 때 목록도 같이 갱신돼요.'+GP+'그래서 내 컴퓨터에 이미 깔려 있어요. 맥이라면 <b>키체인 접근 → 시스템 루트</b>에서 직접 볼 수 있어요. 브라우저는 이 목록을 "무조건 믿는 출발점"으로 써요.'},
 {t:[640,470],s:'브라우저는 등록증을 받으면 <b>다섯 가지</b>를 확인해요. ① 체인 ② 이름 ③ 기간 ④ 폐기 여부 ⑤ 소유(개인키). 하나라도 실패하면 접속을 멈춰요.'},
 {btn:'hs',s:'실제 TLS 1.3 메시지 이름으로 창구 대화를 따라가 볼게요.'},
 {t:[500,200],s:'<b>TLS 1.2</b>는 "어떤 암호 쓸래?"를 먼저 정하고 나서 키를 교환해서 <b>2 RTT</b>가 걸렸어요. <b>1.3</b>은 브라우저가 "아마 이걸 쓰겠지" 하고 key_share를 <b>미리</b> 실어 1 RTT로 줄였어요. 약한 옛 암호도 전부 뺐어요.'},
 {btn:'forge',s:'인증서를 훔쳐 온 가짜 은행이라면?'},
 {btn:'down',hint:'아래 <b>다운그레이드</b>를 눌러 보세요.',s:'창구 사이에서 서류를 몰래 고치면?'},
 {btn:'clock',hint:'<b>PC 시계 오류</b> · <b>이름 불일치</b> · <b>중간 인증서 누락</b> 버튼으로 실제 오류 화면의 원인을 하나씩 확인해 보세요.',s:'실제로 자주 보는 인증서 오류는 대부분 ①~③에서 나요.'},
 {t:[881,95],s:'엣지는 <b>세션 티켓</b>(다음 접속 때 악수를 줄이는 재입장권)도 줬어요(오른쪽 기억 카드). 다음에 오면 첫 패킷에 요청을 바로 싣는 <b>0-RTT</b>가 돼요.'+GP+'단, 도청자가 그 패킷을 <b>복사해 다시 보내면(재전송)</b> 서버는 구분 못 해요. 그래서 0-RTT엔 GET처럼 <b>여러 번 해도 같은(멱등)</b> 요청만 실어요. 주문은 안 돼요.'},
 {t:[240,535],s:'인증서는 요즘 <b>Let\'s Encrypt</b>가 무료로, <b>90일</b>짜리로 줘요. 짧은 대신 자동 갱신해요. 아무 CA나 내 도메인 인증서를 못 만들게 DNS의 <b>CAA</b> 레코드로 "이 CA만"이라고 정해 둘 수 있어요.'},
 {t:'uc',s:'카드의 두 번째 불 <b>② TLS SNI</b>가 켜졌어요. ClientHello는 암호화 전이라 이 이름이 <b>보여요</b>.'}],
/* 6 */
[{view:VCAFE,t:[306,370],s:'카페 구석에 <b>도청자</b>가 나타났어요. 같은 공유기를 쓰면서 지나가는 패킷을 몰래 복사해요. HTTPS가 정말 다 숨겨 줄까요?'},
 {view:VY,btn:'peel',s:'도청자의 해부대예요. 내 패킷을 한 겹씩 벗겨 볼게요.'},
 {btn:'hide',s:'보이는 것들을 더 숨길 수 있을까요?'},
 {t:'uc',s:'카드로 정리하면, host가 쓰인 세 곳 중 <b>① DNS · ② SNI</b>는 밖에서 보이고(DoH · ECH로 숨길 수 있음), <b>③ Host 헤더</b>는 처음부터 암호화 안쪽이에요. 경로 · 쿼리 · 쿠키도요.'}],
/* 7 */
[{t:[260,96],s:'이제 암호 터널 안에 넣을 <b>요청서</b>를 써요. 첫 줄은 <b>시작줄</b>: 메서드 <b>GET</b> · 경로 · 버전. 한글 쿼리는 UTF-8 바이트로 <b>%EB%B9%A8…</b> 인코딩돼요.'},
 {t:[150,140],s:'<b>Host</b> 헤더: host의 세 번째 쓰임이에요. IP 하나(13.0.0.5)에 사이트 수천 개가 살아서, "이 중 <b>누구</b>한테 온 건지"를 적어요. 이게 없으면 엣지가 어느 사이트 페이지를 줄지 몰라요.'},
 {t:[150,228],s:'나머지 헤더는 "나에 대한 정보와 바람"이에요. <b>User-Agent</b>(누가), <b>Accept</b>(어떤 형식 원함), <b>Accept-Encoding: gzip, br</b>(압축해서 보내 줘).'},
 {t:[70,316],s:'그리고 <b>빈 줄</b>. 줄 끝마다 보이지 않는 <b>\\r\\n(CRLF)</b>이 있고, 두 번 연속이면 "헤더 끝"이에요.'},
 {t:[150,360],s:'GET은 가져오기만 하니 <b>본문이 없어요</b>. 본문이 있으면 <b>Content-Length</b>로 길이를 알려 줘요.'},
 {btn:'pGet',s:'서버 파서가 이걸 어떻게 읽는지 볼게요.'},
 {btn:'pPost',s:'본문이 있는 요청은요?'},
 {btn:'pBad',s:'길이를 틀리게 적으면?'},
 {btn:'pNob',s:'빈 줄을 빼먹으면?'},
 {t:[255,432],s:'길이를 미리 모를 때(스트리밍 · AI 답변처럼 생성하면서 보낼 때)는 <code>Transfer-Encoding: chunked</code>로 조각마다 크기를 붙여요. 0 크기 조각이 "끝"이에요.'+GP+'요청서가 완성됐어요. 이제 TLS로 <b>잠가서</b> 엣지로 보내요.'},
 {t:'uc',s:'세 번째 불 <b>③ Host 헤더</b>가 켜졌어요. 이번엔 <b>잠긴 요청서 안</b>이라 도청자는 못 봐요.'}],
/* 8 */
[{view:VW,t:[360,500],s:'잠긴 요청서가 <b>서울 엣지</b>에 도착했어요. 엣지가 TLS를 풀고(TLS 종료) 자기 캐시를 봐요. 상품 페이지는 재고 · 가격이 바뀌어서 캐시가 없어요. <b>원본에 물어봐야</b> 해요.'},
 {view:VSEA,t:[540,330],s:'엣지가 해저 케이블을 건너 미국 원본으로 대신 요청해요. 엣지와 원본 사이엔 <b>미리 열어 둔 연결</b>이 있어서 악수를 다시 안 해요. 나는 가까운 엣지와만 악수한 셈이에요.'},
 {view:VD,t:[165,115],s:'미국 데이터센터 입구의 <b>LB(nginx)</b>예요. 서버들 앞에서 요청을 받아 뒤로 나눠 주는 대리인, <b>리버스 프록시</b>예요. CDN 엣지도 사실 리버스 프록시예요.'},
 {t:[165,115],s:'<b>포워드 프록시</b>는 반대편에 있어요. 회사 · 학교망에서 <b>내 쪽 앞</b>에 서서 "나 대신 밖에 나가 주는" 대리인이에요.'+GP+'서버를 숨기면 리버스, 클라이언트를 숨기면 포워드. 둘 다 중간자인데 <b>누구 편</b>이냐가 달라요.'},
 {t:[500,115],s:'앱 서버(FastAPI)가 받은 요청의 출발 IP는 내가 아니라 <b>LB</b>예요. 그래서 프록시들은 <code>X-Forwarded-For</code> 헤더에 원래 손님 IP를 적어 넘겨요.'},
 {t:[300,394],s:'응답의 <b>상태 코드</b>는 누가 만들까요? 아래 표처럼 <b>층마다</b> 달라요. 코드를 보면 <b>어느 층에서 멈췄는지</b>가 보여요.'},
 {btn:'k502',hint:'아래 <b>상태 코드 버튼 아홉 개</b>를 아무거나 눌러 보세요. 패킷이 어디까지 갔다가, 누가 코드를 만들어 돌려보내는지 보여요.',s:'먼저 502부터 볼게요.'},
 {btn:'k401',s:'401과 403은 헷갈리기 쉬워요.'},
 {t:[830,540],s:'정리: <b>2xx</b> 성공 · <b>3xx</b> 다른 곳으로 · <b>4xx</b> 요청 쪽 문제(고쳐서 다시) · <b>5xx</b> 서버 쪽 문제(기다리거나 서버를 고침).'+GP+'이번엔 정상이라 앱이 <b>200 OK</b>와 HTML을 만들었어요. 답장이 돌아가요.'}],
/* 9 */
[{t:[600,96],s:'답장이 노트북에 도착했어요. HTTP/2라서 상태줄엔 <b>200</b>만 있고 "OK" 같은 설명 문구가 없어요. 헤더 이름도 소문자예요. 뜻은 1.1과 같아요.'},
 {t:[650,140],s:'<b>content-type: text/html; charset=utf-8</b>. 본문이 HTML이고, 바이트를 <b>UTF-8</b> 규칙으로 읽으라는 뜻이에요.'},
 {btn:'charset',s:'charset이 틀리면 어떻게 될까요?'},
 {t:[620,184],s:'<b>content-encoding: br</b>. 요청 때 "압축해 줘"(Accept-Encoding)라고 했더니 Brotli로 압축해 보냈어요. HTML이 1/5쯤으로 줄어요.'},
 {t:[640,228],s:'<b>cache-control: max-age=60</b>과 <b>etag: "v7"</b>은 "이걸 얼마나 오래, 어떤 이름표로 기억할지"예요.'},
 {btn:'cache',s:'시간을 흘려 가며 다시 열어 볼게요.'},
 {btn:'css',s:'캐시를 길게 잡았다가 생기는 사고도 있어요.'},
 {t:[700,316],s:'<b>strict-transport-security</b>(HSTS, HTTP Strict Transport Security): "앞으로 2년간 shop.com은 <b>https로만</b> 와". 다음에 주소창에 shop.com만 쳐도 브라우저가 http로 나가지 않고 바로 https로 가요. 첫 http 요청을 가로채는 공격을 막아요.'},
 {t:'mc',s:'오른쪽 <b>브라우저의 기억</b> 카드에 DNS · TLS 티켓 · HSTS · HTTP 캐시가 쌓였어요. 다음 방문이 빨라지는 재료예요(12단계).'},
 {view:VN,t:[292,200],s:'화면에 머그컵 페이지가 그려졌어요. 하지만 HTML 안에 CSS · JS · 이미지 링크가 있어서 브라우저는 <b>수십 개 요청</b>을 더 보내요. 그 방법이 11단계 HTTP 버전 이야기예요.'}],
/* 10 */
[{t:[835,260],do:()=>dset('ses','a8f3 → 7번 회원',C.purpleD),s:'마음에 들어서 로그인했어요. <code>POST /login</code>에 앱이 <code>Set-Cookie: sid=a8f3; HttpOnly; Secure; SameSite=Lax</code>로 답했어요. 브라우저는 이 쿠키를 <b>매 요청마다</b> 자동으로 붙여요.'+GP+'HTTP는 원래 요청끼리 서로 모르는(무상태) 규칙이라, "아까 그 사람"을 기억하려면 이런 표가 필요해요.'},

  const px=Math.max(bx,Math.min(bx+bw,tx)),py=Math.max(by,Math.min(by+bh,ty));
  const d=Math.hypot(tx-px,ty-py);
  if(d<60){ptr.style.display='none';return;}
  ptr.style.display='';pLine.setAttribute('x1',px);pLine.setAttribute('y1',py);
  const k=(d-22)/d;pLine.setAttribute('x2',px+(tx-px)*k);pLine.setAttribute('y2',py+(ty-py)*k);}

async function playBeat(i){
  const B=BEATS[cur];if(i<0||i>=B.length)return;
  clearTimeout(autoTimer);beat=i;beatLabel();const b=B[i],step=cur,tok=++beatTok;
  const v=effView(cur,i);

    prevView=curView;curView=v;await flyTo(tgt(v));if(tok!==beatTok||step!==cur)return;}
  guide.style.visibility='';dnsTree(!!b.tree);if(b.do)b.do();updateJP(cur,i);
  if(b.btn){simActive=false;say(b.s+'<span class="ghint">'+(b.hint||('아래 <b>'+btnLabel(b.btn)+'</b> 버튼을 누르면 한 단계씩 직접 실행해 볼 수 있어요.'))+'</span>');
    curT={btn:b.btn};curAt=null;setBar();placeNear(tgtScreen(curT));requestAnimationFrame(()=>{placeNear(tgtScreen(curT));updatePtr();});
    if(auto&&RUNS[b.btn])autoTimer=setTimeout(()=>startSim(b.btn),2600/SPD);else if(auto)scheduleAuto(3000);return;}
  simActive=false;say(b.s);curT=b.t;placeNear(tgtScreen(b.t));
  requestAnimationFrame(()=>{placeNear(tgtScreen(b.t));updatePtr();});setTimeout(updatePtr,850);
  setBar();scheduleAuto(1800+b.s.replace(/<[^>]+>/g,'').length*55);}
function scheduleAuto(ms){clearTimeout(autoTimer);if(auto)autoTimer=setTimeout(()=>next(),ms/SPD);}
function next(){if(gateRes){gateRes();return;}if(simActive)return;if(beat<BEATS[cur].length-1){epoch++;clearOV();playBeat(beat+1);}else if(cur<ST.length-1)go(cur+1);}

function setBar(){

  else{nb.textContent=last?(cur<ST.length-1?'다음 장면으로 ▶':'끝'):'다음 설명 ▶';nb.disabled=last&&cur===ST.length-1;}
  $('bAuto').classList.toggle('on',auto);

});
