, 인터넷에 나갈 때마다 Gateway MAC이 필요하기 때문이에요.", "136": "틀린 곳은 ARP의 역할을 DNS와 바꿔 쓴 부분이에요. 도메인 이름을 IP 주소로 바꿔 주는 건 DNS예요.\nARP는 같은 네트워크 안에서 IPv4 주소를 MAC 주소로 바꿔 주는 프로토콜이에요. 계층으로 보면 DNS는 Application 계층, ARP는 Network와 Link 계층 사이에서 일해요.\n웹 접속을 예로 들면 www.shop.com → 13.0.0.5는 DNS가, 그 패킷을 Gateway에 넘기기 위해 192.168.0.1 → Gateway의 MAC을 알아내는 건 ARP가 해요.", "137": "맞는 문장이에요. IP 주소가 '어느 Host(컴퓨터)인가'를 정한다면, Port 번호는 '그 Host 안에서 어느 프로세스(실행 중인 프로그램)로 보낼까'를 정해요.\nPort는 0~65535 사이의 16비트 숫자이고, 서버 프로그램은 자기가 받을 포트를 정해 두고 기다려요.\n그래서 한 서버에 웹(80/443), DB(5432), SSH(22)가 동시에 떠 있어도 포트로 구분해 각자에게 정확히 전달돼요. 같은 건물(IP)에 여러 사무실(Port)이 있는 것과 같아요.", "138": "틀린 곳은 '반드시 직접 지정해야 한다'는 부분이에요. 클라이언트의 출발 포트(Src Port)는 개발자가 정하지 않아도 OS가 연결할 때마다 자동으로 골라 줘요.\nOS는 비어 있는 번호를 Dynamic(Ephemeral, 잠깐 쓰고 버리는 포트라는 뜻이에요) 범위인 49152–65535에서 골라요.\n반면 서버는 클라이언트가 찾아올 수 있도록 80, 443, 8000처럼 정해진 포트에서 기다려야 해요. 서버 포트는 '고정', 클라이언트 포트는 '자동'이라고 구분하면 돼요.", "139": "맞는 문장이에요. 포트 번호 0–65535는 세 구간으로 나뉘어요. 0–1023은 Well-known 포트로, HTTP(80)·HTTPS(443)·SSH(22)·DNS(53)처럼 널리 알려진 표준 서비스에 쓰는 번호예요.\n1024–49151은 Registered 포트로 MySQL(3306)·PostgreSQL(5432)처럼 특정 프로그램이 등록해 쓰는 번호이고, 49152–65535는 Dynamic/Ephemeral 포트로 클라이언트 출발 포트에 자동 할당돼요.\n참고로 Linux·macOS에서는 1023 이하 포트로 서버를 띄우려면 관리자 권한이 필요해서 개발 서버는 8000 같은 번호를 많이 써요.", "140": "맞는 문장이에요. 22는 원격 접속용 SSH, 53은 이름→IP 변환인 DNS, 80은 암호화 없는 웹 HTTP, 443은 TLS로 암호화한 웹 HTTPS의 기본 포트예요.\n기본 포트라서 브라우저에 https://shop.com만 쳐도 자동으로 443으로 접속하고, 다른 포트면 :8000처럼 직접 적어야 해요.\n함께 외워 두면 좋은 번호는 MySQL 3306, PostgreSQL 5432, Redis 6379, 그리고 FastAPI 개발 서버에서 흔히 쓰는 8000이에요.", "141": "틀린 곳은 두 서비스의 포트를 바꿔 쓴 부분이에요. 5432가 PostgreSQL, 6379가 Redis의 기본 포트예요.\nPostgreSQL은 데이터를 표 형태로 저장하는 관계형 DB이고, Redis는 데이터를 메모리에 두고 아주 빠르게 읽고 쓰는 키-값 저장소라는 뜻이에요.\n외우는 요령으로 'Postgre(P) 5432는 5-4-3-2로 내려가는 숫자', 'Redis는 6379'를 따로 묶어 기억하면 헷갈리지 않아요. MySQL 3306도 함께 기억해요.", "142": "맞는 문장이에요. 하나의 연결은 Src IP·Src Port·Dst IP·Dst Port 네 값의 조합으로 구분돼요(프로토콜까지 포함해 5-tuple이라고도 해요).\n탭 두 개가 같은 서버의 443에 접속해도 OS가 출발 포트를 51500, 51501처럼 다르게 붙여서 네 값 중 하나가 달라져요.\n그래서 서버는 두 요청을 서로 다른 연결로 보고, 응답도 각 탭에 정확히 돌아가요. 같은 집에서 같은 가게에 전화를 두 번 걸어도 회선이 달라 구분되는 것과 비슷해요.", "143": "맞는 문장이에요. 막을 것을 하나하나 적는 방식(blacklist)은 빠뜨린 것이 생기면 바로 뚫려요. 그래서 기본은 전부 막고, 꼭 필요한 것만 허용하는 방식(whitelist, 기본 거부)으로 써요.\n예를 들어 웹 서버라면 ALLOW TCP 443 FROM 0.0.0.0/0만 열고, SSH 22번은 내 IP/32에서만 허용해요.\nAWS Security Group도 아무 규칙이 없으면 들어오는 연결을 모두 막고, 허용 규칙만 추가하도록 되어 있어요. 필요한 최소만 여는 것을 최소 권한 원칙이라고 해요.", "144": "틀린 곳은 '호스트 방화벽 설정과 관계없이'라는 부분이에요. 클라우드 서버에 들어가려면 방화벽 두 겹을 모두 통과해야 해요.\n바깥 겹은 Cloud 계층의 Security Group으로, 패킷이 인스턴스에 닿기 전에 걸러요. 안쪽 겹은 서버 OS 안의 호스트 방화벽(Linux의 ufw·iptables, Windows 방화벽)이에요.\nSecurity Group에서 8000을 열어도 ufw가 8000을 막고 있으면 접속이 안 돼요. 아파트 공동현관과 우리 집 현관문을 둘 다 열어야 들어올 수 있는 것과 같아요.", "145": "맞는 문장이에요. 클라우드 접속은 두 계층에서 검사받아요. Security Group(인스턴스 단위 가상 방화벽)과 Network ACL(Subnet 단위 방화벽)은 패킷이 서버에 닿기 전 클라우드 네트워크에서 걸러요.\nufw·iptables는 서버 OS 안에서 동작하는 호스트 방화벽으로, 서버에 도착한 패킷을 프로그램에 넘기기 전에 다시 걸러요.\n둘 중 하나라도 막으면 접속이 안 되니, 문제가 생기면 두 계층의 규칙을 각각 확인해야 해요.", "146": "틀린 곳은 '주소가 맞으면 접속도 반드시 허용된다'는 부분이에요. 주소는 '어디로 갈지'를 정할 뿐, 거기까지 가는 길이 있는지와 들어가도 되는지는 별개의 문제예요.\n접속이 되려면 Routing(경로가 있는가), Port(그 포트에서 서버가 기다리는가), Firewall(방화벽이 허용하는가), Service(프로그램이 정상 동작하는가)를 모두 통과해야 해요.\n집 주소를 정확히 알아도 길이 막혀 있거나 문이 잠겨 있거나 집에 아무도 없으면 못 만나는 것과 같아요.", "147": "맞는 문장이에요. VPC(Virtual Private Cloud)는 클라우드 안에 나만 쓰도록 떼어 낸 가상 네트워크라는 뜻이에요.\n집 공유기가 정해 주는 LAN과 달리, VPC는 주소 범위(예: 10.0.0.0/16), Subnet 분할, Routing Table, 방화벽 규칙을 내가 직접 설계해요.\n보통 10.0.0.0/16을 인터넷과 닿는 Public Subnet과 밖에서 못 들어오는 Private Subnet으로 나눠, Load Balancer는 Public에, 서버·DB는 Private에 둬요.", "148": "맞는 문장이에요. Internet Gateway(IGW)는 VPC와 인터넷을 직접 잇는 출입문이라는 뜻이에요.\nPublic Subnet은 경로표에 0.0.0.0/0 → IGW가 있어서, '내 VPC 밖 모든 주소'로 가는 트래픽이 IGW를 통해 인터넷과 바로 오가요. 이 경로가 있느냐가 Public Subnet의 정의예요.\n그래서 인터넷에서 직접 받아야 하는 Load Balancer, 관리자 접속용 Bastion, Private Subnet의 외부 출구인 NAT Gateway를 여기에 둬요.", "149": "틀린 곳은 Private Subnet의 경로가 'IGW'라는 부분이에요. 0.0.0.0/0 → IGW는 Public Subnet의 경로표예요.\nPrivate Subnet은 0.0.0.0/0 → NAT Gateway예요. NAT Gateway가 주소를 바꿔 IGW로 내보내기 때문에 안에서 밖으로 나가는 것은 되지만, 밖에서 먼저 들어오는 연결은 받지 않아요.\n집 공유기 뒤의 PC가 인터넷은 쓰지만 외부에서 먼저 접속할 수 없는 것과 같은 구조예요. 경로표의 next hop이 IGW냐 NAT Gateway냐가 둘을 가르는 기준이에요.", "150": "맞는 문장이에요. API Server, GPU Worker, Database는 중요한 로직과 데이터를 가진 곳이라, 인터넷에서 직접 들어올 수 없는 Private Subnet에 두는 것이 기본 설계예요.\n사용자 요청은 Public Subnet의 Load Balancer가 받아서 Private의 API Server로 넘겨 줘요. 그래서 외부에 노출되는 입구는 Load Balancer 하나뿐이에요.\n건물 로비(Public)에만 손님을 받고, 금고와 사무실(Private)은 직원 통로로만 갈 수 있게 하는 것과 같아요.", "151": "맞는 문장이에요. NAT Gateway는 Public Subnet에 두고, Private Subnet의 서버가 밖으로 나가야 할 때 쓰는 출구예요. 예를 들어 OS 업데이트나 패키지 설치, 외부 API 호출이 그래요.\nPrivate 서버의 사설 주소를 NAT Gateway의 공인 주소로 바꿔 IGW로 내보내고, 응답은 다시 원래 서버로 돌려줘요.\n우리 집 공유기의 NAT과 같은 원리라서 나가는 건 되지만 밖에서 먼저 들어오는 연결은 통과시키지 않아요. 그래서 Private 서버의 보안이 유지돼요.", "152": "틀린 곳은 'IP만 알면 바로 접속할 수 있다'는 부분이에요. 사설 주소(10.x.x.x 등)는 인터넷에서 라우팅되지 않아서, 인터넷의 Router들이 그 주소로 가는 길을 아예 몰라요.\n게다가 Private Subnet에는 0.0.0.0/0 → IGW 경로가 없고 NAT Gateway만 있어서, 밖에서 먼저 들어오는 연결은 받지 않아요.\n그래서 DB에 접근하려면 같은 VPC 안의 API Server를 거치거나, Bastion·VPN처럼 허가된 통로를 따로 만들어야 해요.", "153": "틀린 곳은 refused를 '도착조차 못 했다'로 해석한 부분이에요. Connection refused는 패킷이 목적지 Host에 도착은 했지만, 그 포트에서 기다리는 프로그램이 없어서 Host가 '여기 아무도 없어요'라고 거절 응답을 보낸 거예요.\n그래서 refused가 나오면 서버 프로그램이 꺼졌는지, 포트 번호나 bind 주소(127.0.0.1 등)가 틀렸는지를 확인해요.\n도착조차 못 한 경우는 Connection timed out이에요. 응답이 아예 없어서 기다리다 시간 초과가 나는 거예요.", "154": "맞는 문장이에요. Connection timed out은 요청을 보냈는데 정해진 시간 동안 아무 응답도 없었다는 뜻이에요.\n방화벽이나 Security Group은 막을 때 거절 응답 없이 패킷을 조용히 버리는(drop) 경우가 많아서, 클라이언트는 답을 기다리다 시간 초과가 나요. 경로가 끊겨 패킷이 도중에 사라져도 같은 증상이 나와요.\n그래서 방화벽 규칙을 확인하고, tracert로 어느 hop에서 멈추는지 봐요. 거절 응답이 오는 refused와 구분하는 게 핵심이에요.", "155": "맞는 문장이에요. Network is unreachable은 OS가 그 목적지로 보낼 경로를 Routing Table에서 찾지 못해 패킷을 내보내지도 못했다는 뜻이에요.\n흔한 원인은 Default Gateway가 비어 있거나 틀려서 0.0.0.0/0(Default Route) 줄이 없거나, IP 설정 자체가 안 된 경우예요.\n그래서 ipconfig로 Gateway가 있는지, route print로 0.0.0.0/0 줄과 그 Gateway가 공유기 주소인지 확인해요. 출발도 못 한 상태라 상대 서버는 원인이 아니에요.", "156": "맞는 문장이에요. Name not resolved는 도메인 이름을 IP로 바꾸는 DNS 단계에서 실패했다는 뜻이라, 서버에 연결을 시도하기도 전에 멈춘 거예요.\n원인은 주로 도메인 오타, 아직 등록·전파되지 않은 도메인, DNS 서버 설정 문제예요.\nnslookup 도메인으로 IP가 나오는지 확인하고, IP로 직접 접속(예: ping 8.8.8.8)이 되는지 비교하면 DNS 문제인지 연결 문제인지 가를 수 있어요.", "157": "맞는 문장이에요. 403(접근 금지)이나 404(없는 페이지)는 HTTP 상태 코드로, 서버 프로그램이 요청을 받아 읽고 직접 돌려준 응답이에요.\n응답이 왔다는 것 자체가 DNS·경로·방화벽·포트·TCP 연결이 모두 성공했다는 증거예요.\n그래서 이때는 네트워크가 아니라 애플리케이션 쪽, 예를 들어 URL 경로 오타, 권한 설정, 라우팅 코드를 확인해야 해요. refused나 timed out처럼 응답 자체가 없는 오류와 구분해요.", "158": "맞는 문장이에요. Troubleshooting Ladder는 접속 문제를 위에서 아래로 한 칸씩 확인하며 원인을 좁혀 가는 사다리형 점검 순서라는 뜻이에요.\nService(프로그램이 떠 있나) → Bind/Port(어느 주소·포트에서 받나) → Local Firewall(내 PC 방화벽) → IP/Subnet(주소·마스크) → Gateway/Route(나가는 길) → NAT/Cloud Rule(공유기·Security Group) → DNS(이름 해석) 순이에요.\n한 단계씩 '여기는 정상'을 확인하고 배제하면, 막연히 이것저것 바꾸지 않고 문제 지점을 찾을 수 있어요.", "159": "맞는 문장이에요. route print는 Windows에서 내 PC의 Routing Table, 즉 '어떤 목적지로 가려면 어느 인터페이스·Gateway로 보낼지' 적힌 표를 보여 주는 명령이에요.\n가장 먼저 볼 곳은 0.0.0.0/0 줄(Default Route)이에요. 이 줄의 Gateway가 192.168.0.1처럼 내 공유기 주소인지 확인해요.\n이 줄이 없거나 엉뚱한 주소면 인터넷으로 나가지 못해요. macOS·Linux에서는 netstat -rn이나 ip route가 같은 역할을 해요.", "160": "틀린 곳은 가상 어댑터의 IP를 '다른 기기가 나를 찾아올 주소'로 본 부분이에요. WSL·Docker의 가상 어댑터는 내 PC 안의 가상 환경과 통신하려고 만든 내부용 인터페이스예요.\n같은 Wi-Fi의 친구 폰이나 PC는 그 가상 네트워크에 연결돼 있지 않아서 그 주소로는 나를 찾을 수 없어요.\n친구에게 알려 줄 주소는 ipconfig에서 'Wireless LAN adapter Wi-Fi' 항목의 IPv4 주소(예: 192.168.0.23)예요. 어댑터 이름을 보고 고르는 습관이 중요해요.", "161": "맞는 문장이에요. AI는 내 상황을 모르기 때문에, 정보가 부족하면 일반적인 추측 답변만 하게 돼요.\n증상(예: 친구 PC에서 Connection refused), 환경(Windows, FastAPI, 같은 Wi-Fi), 이미 확인한 사실(netstat 결과, 방화벽 상태), 원하는 출력 형식(진단 순서와 확인 명령, 기대 출력)을 함께 주면 정확도가 높아져요.\n'고쳐줘'라고만 하면 이유도 모르는 코드가 나오지만, '진단 순서를 알려줘'라고 하면 내가 직접 확인하며 이해할 수 있어요.", "162": "맞는 문장이에요. 같은 진단도 OS마다 명령 이름이 달라요. Windows의 ipconfig는 macOS·Linux의 ifconfig(최신 Linux는 ip a)에, tracert는 traceroute에 대응해요.\n그 밖에 netstat -ano는 netstat -an(또는 ss), nslookup은 더 자세한 dig로 대응해요.\n명령 이름은 달라도 확인하는 내용(내 IP·Gateway, 경로, 열린 포트, DNS 결과)은 같아요. Mac과 Windows를 오가며 작업할 때는 '무엇을 확인하는 명령인가'로 짝지어 기억하면 편해요.", "163": "맞는 문장이에요. MAC 주소는 Link 계층의 주소라 '이번 구간에서 보내는 장비 → 바로 다음 장비'만 가리켜요. 그래서 구간이 바뀔 때마다 새로 적어야 해요.\nIP는 Network 계층의 주소로 '최종 출발지와 목적지'라서 끝까지 유지돼요.\nRouter는 프레임을 받으면 Ethernet 봉투(MAC이 적힌 겉봉투)를 벗겨 안의 IP를 보고 다음 경로를 정한 뒤, '나 → 다음 장비' MAC을 적은 새 봉투를 씌워 보내요. 안의 편지(IP 패킷)는 그대로예요.", "164": "맞는 문장이에요. 집 공유기 한 대 안에는 여러 장비의 기능이 함께 들어 있어요.\nRouter(집 LAN과 인터넷 연결), Switch(유선 포트끼리 MAC으로 전달), DHCP 서버(기기에 IP 자동 배정), NAT(사설 IP ↔ 공인 IP 변환), 방화벽(밖에서 들어오는 연결 차단) 역할을 다 해요.\n그래서 공유기 하나만 재시작해도 IP가 바뀌거나 인터넷이 잠시 끊기는 거예요. 회사나 클라우드에서는 이 기능들이 각각 별도의 장비나 서비스로 나뉘어 있어요.", "165": "핵심은 '양방향 각각의 ISN을 확인받아야 한다'는 부분이라 O예요.\nISN(Initial Sequence Number)은 연결을 시작할 때 각자 정하는 첫 순서번호라는 뜻이에요. Client가 SYN으로 자기 ISN을 알리면 Server가 ACK로 확인해 주고, Server도 자기 ISN을 SYN으로 알려 Client의 ACK를 받아야 해요.\n이때 Server의 ACK와 SYN을 한 메시지(SYN+ACK)로 합치기 때문에 4번이 아니라 3번이 돼요. 전화로 비유하면 \"여보세요?\"→\"네, 들려요. 제 목소리도 들리세요?\"→\"네, 들려요\"와 같아요.", "166": "'2-way만으로도 막을 수 있다'는 부분이 틀려서 X예요. 올바른 말은 '마지막 ACK(3번째 메시지)가 있어야 막을 수 있다'예요.\n오래된 중복 SYN이란 예전 연결 시도 때 보낸 SYN이 네트워크 어딘가에 지연돼 있다가 뒤늦게 서버에 도착한 것이라는 뜻이에요. 2-way라면 서버는 SYN+ACK만 보내고 곧바로 연결을 열어 버려, 아무도 원하지 않는 연결에 자원을 쓰게 돼요.\n3-way에서는 Client가 그 SYN+ACK를 보고 '내가 지금 보낸 게 아니네' 하고 ACK 대신 RST를 보내 거절할 수 있어요.", "167": "'최대 처리량이 TCP보다 크다'는 부분이 틀려서 X예요. 같은 회선이라면 둘 다 결국 회선 대역폭이 상한이라 최대 처리량은 비슷해요.\n처리량(throughput)은 단위 시간당 실제로 전달되는 데이터 양이라는 뜻이에요. UDP는 혼잡제어가 없어서 회선이 감당 못 할 만큼 보내면 라우터 큐가 넘쳐 손실이 크게 늘고, 오히려 유효 처리량이 떨어질 수 있어요.\n'빠르다'의 진짜 의미는 '지연(latency)이 적다'에 가까워요. 고속도로 제한 속도는 같은데 UDP는 톨게이트(핸드셰이크)가 없는 것에 비유할 수 있어요.", "168": "'핸드셰이크와 재전송 대기가 없다'는 설명이 정확해서 O예요.\nUDP는 연결을 맺는 과정 없이 바로 첫 데이터를 보내고, 데이터가 빠져도 다시 보내 달라고 기다리지 않아요. 그래서 시작 지연(1 RTT의 핸드셰이크)도, 손실 복구를 위한 대기도 없어요.\nTCP는 중간 조각이 빠지면 그게 다시 올 때까지 뒤 데이터를 앱에 못 올려 줘서 멈칫해요. 영상통화에서 0.5초 전 화면을 다시 받아 봐야 소용없기 때문에, 늦게 오느니 버리는 UDP가 실시간 서비스에 맞아요.", "169": "'Port는 번호, Socket은 그 번호에 묶인 통신 창구(객체)'라는 구분이 맞아서 O예요.\n포트는 호스트 안에서 프로세스를 구분하는 16비트 숫자일 뿐이고, 소켓은 OS가 통신을 위해 만들어 주는 객체로 버퍼·상태 등을 담고 있어요. 프로세스는 이 소켓을 fd(파일 디스크립터) 번호로 다뤄요.\n웹 서버가 443 포트 하나로 수천 명을 받을 때, 손님마다 연결 소켓이 따로 하나씩 생겨요. 포트는 '가게 주소', 소켓은 '손님마다 배정되는 상담 창구'라고 생각하면 돼요.", "170": "'목적지 IP와 목적지 Port, 두 값으로 식별된다'는 부분이 틀려서 X예요. TCP 연결은 출발지 IP·출발지 Port·목적지 IP·목적지 Port 네 값(4-tuple)으로 식별돼요.\ntuple은 여러 값을 하나로 묶은 조합이라는 뜻이에요. 서버 입장에서 목적지(자기 IP:443)는 모든 손님이 똑같아서, 출발지까지 봐야 '어느 손님의 연결인지' 구분할 수 있어요.\n반면 UDP는 연결 개념이 없어 목적지 IP·Port 2-tuple만으로 소켓을 찾아요. 이 차이가 TCP/UDP demux 문제의 단골 포인트예요.", "171": "'연결마다 출발지 IP나 Port가 달라 4-tuple이 다르다'는 이유가 정확해서 O예요.\n서버 쪽 IP와 443 포트는 모든 연결에서 같지만, 클라이언트마다 IP가 다르고, 같은 PC에서도 탭마다 OS가 임시(ephemeral) 포트를 다르게 붙여요. 그래서 네 값의 조합이 겹치지 않아요.\n예를 들어 (1.1.1.1:50001 → 서버:443)과 (1.1.1.1:50002 → 서버:443)은 같은 사람의 서로 다른 두 연결이에요. 포트 하나 = 연결 하나라고 오해하기 쉬운데, 포트는 그냥 '번호'예요.", "172": "'3-way handshake를 직접 수행한다'는 부분이 틀려서 X예요. 핸드셰이크는 커널이 알아서 하고, accept()는 이미 완성된 연결을 꺼내 오는 역할만 해요.\n서버가 listen()을 해 두면 커널이 SYN을 받아 SYN+ACK를 보내고, 마지막 ACK까지 오면 그 연결을 Accept queue(완성된 연결 대기열)에 넣어 둬요. 앱이 accept()를 부르면 그 큐에서 하나를 꺼내 새 연결 소켓(fd)을 돌려줘요.\n그래서 앱이 accept()를 늦게 불러도 핸드셰이크 자체는 이미 끝나 있을 수 있어요. 식당으로 치면 입장 처리는 직원(커널)이 하고, 사장(앱)은 대기석에서 손님을 모셔 오는 셈이에요.", "173": "'listen 소켓은 데이터를 주고받지 않고 접수 창구 역할만 한다'는 부분이 맞아서 O예요.\nlisten 소켓은 특정 포트에서 새 연결 요청(SYN)을 기다리는 소켓이라는 뜻이에요. 새 손님이 오면 커널이 핸드셰이크를 처리해 대기열에 넣고, accept()가 손님 전용 연결 소켓을 새로 만들어 줘요.\n실제 send()/recv()는 이 연결 소켓으로만 해요. 은행에 비유하면 listen 소켓은 번호표 발급기, 연결 소켓은 손님별 상담 창구예요. 서버에는 listen 소켓 1개와 연결 소켓 N개가 함께 있어요.", "174": "보호 대상이 서로 뒤바뀌어 있어서 X예요. Flow control은 수신자 버퍼를, Congestion control은 네트워크(라우터)를 보호해요.\nFlow control(흐름 제어)은 받는 쪽이 감당할 수 있는 만큼만 보내도록 하는 것으로, 수신자가 ACK에 적어 보내는 rwnd(수신 윈도우)로 조절해요. Congestion control(혼잡 제어)은 중간 길이 막히지 않게 하는 것으로, 송신자가 혼자 추정하는 cwnd(혼잡 윈도우)로 조절해요.\n택배로 비유하면 흐름 제어는 '받는 집 창고가 꽉 찼으니 그만', 혼잡 제어는 '고속도로가 막히니 트럭을 줄이자'예요.", "175": "'뒤 데이터는 도착하는데 그 번호 조각만 빠졌다'는 해석이 정확해서 O예요.\nTCP의 ACK 번호는 '다음에 받고 싶은 바이트 번호'예요. 1461번부터 시작하는 조각이 빠지면, 그 뒤 조각들이 도착할 때마다 수신자는 계속 ack=1461을 반복해서 보내요. 이것을 중복 ACK(duplicate ACK)라고 해요.\n같은 번호가 3번 더 오면 송신자는 '이건 순서가 잠깐 바뀐 게 아니라 진짜 빠졌구나' 하고 타임아웃 전에 바로 재전송해요. 이것이 Fast Retransmit이에요.", "176": "'존재 자체가 버그 신호'라는 부분이 틀려서 X예요. TIME_WAIT은 먼저 close()한 쪽에 생기는 정상적인 상태예요.\nTIME_WAIT은 연결을 닫은 뒤에도 2×MSL 동안 4-tuple을 잠시 붙잡아 두는 상태로, 마지막 ACK가 유실됐을 때 상대 FIN의 재전송을 받아 주고 늦게 온 옛 패킷이 새 연결에 섞이지 않게 해요. 개수가 수만 개로 너무 많을 때만 포트 고갈 문제가 돼요.\n반대로 CLOSE_WAIT은 상대가 닫았는데 내 앱이 close()를 안 부른 상태라, 보이기만 해도 코드 버그를 의심해야 해요.", "177": "'상대는 FIN을 보냈는데 내 앱이 close()를 호출하지 않았다'는 원인 설명이 정확해서 O예요.\nCLOSE_WAIT은 상대의 FIN을 받아 커널이 ACK까지 보낸 뒤, 내 앱이 close()해 주기를 기다리는 상태라는 뜻이에요. 앱이 닫기 전까지 커널은 이 상태를 영원히 유지해요.\n그래서 예외가 나서 close()를 건너뛰는 코드에서 자주 쌓이고, 커널 파라미터로는 못 고쳐요. Python이라면 with socket... 문이나 try/finally로 어떤 경우에도 닫히게 하는 것이 해결책이에요.", "178": "'상대 호스트에는 닿았지만 그 포트에 listen이 없다'는 해석이 맞아서 O예요.\nConnection refused는 SYN을 보냈더니 상대 OS가 RST를 돌려준 경우라는 뜻이에요. 즉 네트워크 경로와 호스트는 살아 있고, 그 포트에서 기다리는 프로세스가 없는 거예요. 그래서 서버 프로세스가 떠 있는지, 포트 번호가 맞는지, 127.0.0.1에만 bind돼 있지 않은지를 먼저 봐요.\n반면 Connection timed out은 응답 자체가 없는 경우라, 방화벽·보안그룹·라우팅처럼 중간에서 막혔는지를 먼저 의심해요.", "179": "'느리다'는 증상에 맞는 측정 항목을 골랐기 때문에 O예요.\n재전송률은 보낸 조각 중 다시 보낸 비율로, 높으면 손실이 많다는 뜻이에요. Recv-Q/Send-Q는 ss 명령에서 보이는 큐 길이로, Recv-Q가 쌓이면 내 앱이 늦게 읽는 것이고 Send-Q가 쌓이면 네트워크나 상대가 느린 거예요. RTT 변동은 지연이 들쭉날쭉한지를 보여 줘요.\n연결 자체가 안 될 때는 포트·방화벽을 보지만, 연결은 되는데 느릴 때는 이렇게 '어디서 기다리고 있는지'를 숫자로 확인하는 게 순서예요.", "180": "IP와 전송 계층의 배달 범위를 정확히 나눴기 때문에 O예요.\nIP(네트워크 계층)는 패킷을 목적지 호스트(컴퓨터)까지만 데려다줘요. 그 컴퓨터 안에는 브라우저, 카톡, 게임처럼 여러 프로세스가 동시에 통신하고 있어서, 누구에게 줄지는 전송 계층이 포트 번호를 보고 정해요.\n아파트로 비유하면 IP 주소는 '동·호수', 포트는 '그 집의 받는 사람 이름'이에요. 그래서 전송 계층을 '프로세스 간(process-to-process) 통신'이라고 불러요.", "181": "전송 계층의 세 가지 역할을 바르게 나열해서 O예요.\n첫째, 포트로 어느 프로세스의 데이터인지 구분해요. 둘째, TCP를 고르면 순서번호와 ACK·재전송으로 순서와 신뢰성을 보장해요. 셋째, 윈도우를 이용해 흐름 제어·혼잡 제어로 보내는 속도를 조절해요.\n'TCP 선택 시'라는 단서가 중요해요. UDP는 첫째(포트 구분)와 체크섬 정도만 하고, 순서·신뢰성·속도 조절은 하지 않아요.", "182": "두 용어의 방향을 올바르게 짝지어서 O예요.\nMultiplexing(다중화)은 보내는 쪽에서 여러 프로세스의 데이터에 각자 포트 번호를 붙여 하나의 IP 통로로 내보내는 것이라는 뜻이에요. Demultiplexing(역다중화)은 받는 쪽에서 헤더의 포트 번호를 보고 알맞은 소켓(프로세스)에게 나눠 주는 것이에요.\n우체국에 비유하면, 한 집의 여러 사람이 쓴 편지를 한 우편함에 넣는 게 MUX, 도착한 편지를 수신자 이름 보고 가족에게 나눠 주는 게 DEMUX예요.", "183": "'4개 값을 모두 본다'는 부분이 틀려서 X예요. UDP는 목적지 IP와 목적지 Port, 두 값(2-tuple)만 봐요.\nUDP는 연결이라는 개념이 없어서, 보낸 사람이 누구든 목적지 포트가 같으면 같은 소켓으로 들어와요. 예를 들어 DNS 서버의 53번 소켓 하나가 전 세계 클라이언트의 질의를 모두 받아요. 누가 보냈는지는 recvfrom()이 돌려주는 주소로 앱이 확인해요.\n4-tuple을 모두 보는 건 TCP예요. TCP는 손님마다 연결 소켓이 따로 있어서 출발지까지 봐야 소켓을 고를 수 있어요.", "184": "포트 필드 크기와 범위를 정확히 말해서 O예요.\nTCP·UDP 헤더에서 포트 번호 칸은 16비트라서 2¹⁶ = 65536가지, 즉 0~65535를 표현할 수 있어요. 이 중 0~1023은 Well-known(HTTP 80, HTTPS 443 등), 1024~49151은 Registered, 49152~65535는 보통 클라이언트가 임시로 쓰는 Dynamic/ephemeral 영역이에요.\n그래서 한 클라이언트 IP가 같은 서버 IP·포트로 동시에 열 수 있는 연결 수도 대략 이 임시 포트 개수만큼으로 제한돼요.", "185": "0~1023 포트의 권한 규칙을 정확히 말해서 O예요.\n0~1023은 Well-known 포트로, 22(SSH)·80(HTTP)·443(HTTPS)처럼 중요한 서비스용이라는 뜻이에요. 아무 사용자나 이 포트를 차지하면 가짜 서버를 띄울 수 있으니, 리눅스는 root(또는 해당 권한을 받은 프로세스)만 bind할 수 있게 막아 둬요.\n그래서 개발할 때는 8000·8080·3000처럼 1024 이상 포트를 쓰고, 실제 80/443은 nginx 같은 서버가 받아 넘겨주는 구성이 흔해요.", "186": "DNS의 기본 프로토콜과 TCP를 쓰는 예외 상황을 맞게 말해서 O예요.\nDNS 질의는 '이 도메인의 IP 알려 줘' 한 번, 응답 한 번으로 끝나는 짧은 대화라서, 1 RTT짜리 핸드셰이크를 하는 TCP보다 바로 보내는 UDP가 효율적이에요. 손실되면 앱(리졸버)이 다시 물어보면 돼요.\n하지만 응답이 UDP 한 덩어리에 담기지 않을 만큼 크거나, DNS 서버끼리 zone(도메인 정보 전체)을 복사하는 zone transfer처럼 큰 데이터를 정확히 옮겨야 할 때는 TCP 53을 써요.", "187": "HTTP/3의 전송 프로토콜을 맞게 말해서 O예요.\nHTTP/1.1과 HTTP/2는 TCP 위에서 동작하지만, HTTP/3는 UDP 위에 만든 QUIC이라는 프로토콜 위에서 동작해요. QUIC은 신뢰성·혼잡제어·암호화(TLS 1.3)를 UDP 위에 직접 구현한 것이라는 뜻이에요.\n헷갈리기 쉬운 점은 포트 번호예요. 둘 다 443을 쓰지만 HTTP/2는 'TCP 443', HTTP/3는 'UDP 443'이라 운영체제 입장에서는 서로 다른 소켓이에요. 방화벽에서 UDP 443을 막으면 HTTP/3가 안 되고 TCP로 내려가요.", "188": "EADDRINUSE의 의미를 맞게 말해서 O예요.\nEADDRINUSE는 'Address already in use', 즉 bind()하려는 IP:포트를 이미 다른 소켓이 쓰고 있다는 오류라는 뜻이에요. 서버를 끄지 않고 또 실행했거나, 방금 종료한 서버의 연결이 TIME_WAIT으로 남아 있을 때 자주 나요.\n해결할 때는 lsof -i :8000 이나 ss -ltnp로 그 포트를 쥔 프로세스를 찾고, 재시작 때문이라면 SO_REUSEADDR 옵션을 켜요. 'Cannot assign requested address'(클라이언트 쪽 임시 포트 고갈)와는 다른 오류예요.", "189": "'TCP 헤더는 8바이트 고정'이 틀려서 X예요. 8바이트 고정인 건 UDP 헤더이고, TCP 헤더는 최소 20바이트, 옵션을 붙이면 최대 60바이트예요.\nUDP 헤더는 출발지 포트·목적지 포트·길이·체크섬 4칸(각 2바이트)뿐이에요. TCP는 여기에 순서번호, ACK 번호, 헤더 길이, Flags(SYN·ACK·FIN 등), Window, 긴급 포인터, 옵션(MSS·SACK 등)까지 담아야 해서 훨씬 커요.\n헤더 크기 차이가 곧 기능 차이예요. TCP가 신뢰성과 속도 조절을 하려면 그만큼 적어 둘 정보가 많아요.", "190": "UDP가 1:N 통신을 지원한다는 말이 맞아서 O예요.\nbroadcast는 같은 네트워크의 모든 호스트에게, multicast는 특정 그룹에 가입한 호스트들에게 한 번에 보내는 방식이라는 뜻이에요. UDP는 연결 없이 보내기만 하므로 받는 사람이 여럿이어도 문제없어요.\nTCP는 두 끝점이 각자 상태(순서번호·윈도우)를 맞춰야 하는 1:1 연결이라 이런 방식이 불가능해요. 같은 네트워크의 프린터나 크롬캐스트를 자동으로 찾는 mDNS가 UDP multicast의 예예요.", "191": "TCP와 UDP의 데이터 단위 차이를 바르게 말해서 O예요.\n바이트 스트림이란 데이터를 경계 없는 바이트의 흐름으로 다룬다는 뜻이에요. send()를 3번 해도 받는 쪽 recv()에서는 한 번에 붙어 나오거나 다르게 쪼개질 수 있어요. 데이터그램은 보낸 한 덩어리가 그대로 한 덩어리로 도착하는 단위예요.\n그래서 TCP 위의 앱은 '앞 4바이트는 길이' 같은 길이 헤더나 줄바꿈 문자 같은 구분자를 직접 정해 메시지를 잘라야 해요. 물(스트림)과 택배 상자(데이터그램)를 떠올리면 쉬워요.", "192": "서비스별 프로토콜 선택이 맞아서 O예요.\n웹 페이지(HTTP/1.1·2), 원격 접속(SSH), DB 연결은 한 바이트만 틀려도 결과가 망가지므로 순서·무손실을 보장하는 TCP를 써요. DNS는 짧은 질의응답이라, 실시간 영상·게임은 늦은 데이터가 쓸모없어서 주로 UDP를 써요.\n예외로 HTTP/3는 웹이지만 UDP 위의 QUIC을 써요. 'UDP = 신뢰성 없음'이 아니라 'UDP 위에서 필요한 신뢰성을 앱이 직접 만든다'로 이해하면 돼요.", "193": "'중간 라우터가 전용 경로를 잡아 둔다'는 부분이 틀려서 X예요. 라우터는 TCP 연결이 있는지조차 몰라요.\n라우터는 각 패킷의 목적지 IP만 보고 그때그때 다음 hop으로 넘기는 장비예요. TCP 연결 정보(순서번호·상태·윈도우)는 양 끝 호스트의 커널, 즉 TCB(Transmission Control Block)라는 자료구조에만 있어요.\n전화 교환망처럼 회선을 예약하는 방식(회선 교환)과 달리 인터넷은 패킷 교환이라, 같은 연결의 패킷도 서로 다른 경로로 갈 수 있어요.", "194": "TCP 연결의 실체를 정확히 말해서 O예요.\n'연결됐다'는 것은 물리적인 선이 생긴 게 아니라, 양쪽 OS 커널이 각자 메모리에 '상대 IP·포트, 지금 상태(ESTABLISHED), 다음 순서번호, 윈도우 크기' 같은 기록을 갖게 됐다는 뜻이에요.\n그래서 중간 케이블을 잠깐 뽑았다 꽂아도, 그 사이 데이터를 안 보냈다면 연결은 그대로 살아 있을 수 있어요. 반대로 한쪽 커널이 기록을 지우면(재부팅 등) 선은 멀쩡해도 연결은 사라져요.", "195": "TCB에 담기는 정보를 바르게 나열해서 O예요.\nTCB(Transmission Control Block)는 커널이 TCP 연결 하나마다 만들어 두는 장부라는 뜻이에요. 여기에 4-tuple(누구와의 연결인지), 상태(ESTABLISHED 등), 보낼/받을 순서번호, rwnd·cwnd, 재전송 타이머, 송수신 버퍼가 들어 있어요.\n연결 하나하나가 메모리와 타이머, 포트를 차지하므로 '연결 = 공짜'가 아니에요. 동시 접속이 수십만이면 이 장부만으로도 서버 자원이 크게 소모돼요.", "196": "3-way handshake의 메시지 순서가 맞아서 O예요.\n① Client가 SYN(내 ISN은 x야)을 보내고 SYN_SENT가 돼요. ② Server는 LISTEN 상태에서 이를 받고 SYN+ACK(x+1 받았어, 내 ISN은 y야)를 보내며 SYN_RCVD가 돼요. ③ Client가 ACK(y+1)를 보내며 ESTABLISHED가 되고, Server도 이 ACK를 받으면 ESTABLISHED가 돼요.\nSYN은 '동기화(synchronize) 요청', ACK는 '확인(acknowledge)'이라는 뜻이에요. 순서를 SYN→ACK→SYN+ACK 등으로 바꿔 내는 문제에 주의하세요.", "197": "'SYN도 1바이트로 센다'는 규칙에 따라 ack = x+1이 맞아서 O예요.\nSYN에는 실제 데이터가 없지만, TCP는 SYN과 FIN을 순서번호 1개를 소비하는 것으로 취급해요. 그래야 SYN 자체도 ACK로 확인받을 수 있어요.\nACK 번호는 '다음에 받고 싶은 순서번호'라서, seq=x인 SYN을 받은 서버는 'x는 받았고 다음은 x+1'이라는 뜻으로 ack=x+1을 보내요. 그 후 Client가 첫 데이터를 보낼 때 seq도 x+1부터 시작해요.", "198": "'마지막으로 받은 바이트의 번호'라는 정의가 틀려서 X예요. TCP의 ACK 번호는 '다음에 받고 싶은 바이트 번호'예요.\n예를 들어 1~1460번 바이트를 잘 받았다면 ack=1460이 아니라 ack=1461을 보내요. '1460까지는 다 받았으니 이제 1461번부터 보내 줘'라는 의미예요.\n이 방식 덕분에 ack 하나로 그 앞의 모든 바이트를 한꺼번에 확인하는 누적 ACK가 가능해요. 계산 문제에서 +1을 빼먹는 실수가 가장 흔하니 조심하세요.", "199": "'보통 0부터 시작한다'는 부분이 틀려서 X예요. ISN은 연결마다 난수(무작위 값)로 정해요.\nISN(Initial Sequence Number)은 연결의 첫 순서번호라는 뜻이에요. 매번 0부터 시작하면, 방금 닫힌 같은 4-tuple 연결의 늦게 도착한 패킷이 새 연결의 번호 범위에 딱 맞아 섞여 들어갈 수 있어요.\n또 공격자가 번호를 쉽게 예측해 가짜 패킷을 끼워 넣는 '순서번호 추측 공격'도 가능해져요. 그래서 OS는 ISN을 예측하기 어렵게 무작위로 골라요.", "200": "서버의 상태 전이가 맞아서 O예요.\nLISTEN은 서버가 listen()을 호출해 새 연결 요청을 기다리는 상태라는 뜻이에요. 여기서 SYN을 받으면 서버 커널은 SYN+ACK를 보내고, 마지막 ACK를 기다리는 SYN_RCVD(SYN 받음) 상태가 돼요. 이 반쯤 열린 연결은 SYN queue에 들어가 있어요.\n마지막 ACK가 도착하면 ESTABLISHED가 되어 Accept queue로 옮겨져요. Client 쪽은 SYN을 보낸 직후 SYN_SENT 상태라는 점과 헷갈리지 마세요.", "201": "연결 수립 비용이 1 RTT라는 말이 맞아서 O예요.\nRTT(Round Trip Time)는 패킷이 상대에게 갔다가 응답이 돌아오기까지 걸리는 왕복 시간이라는 뜻이에요. Client가 SYN을 보내고 SYN+ACK를 받으면 1 RTT가 지난 것이고, 마지막 ACK는 첫 데이터와 함께 바로 보내면 되니 추가로 기다릴 필요가 없어요.\n서울–도쿄 RTT가 30ms라면, 데이터를 보내기 전 30ms가 연결 준비에 쓰여요. 거리가 먼 서버일수록 이 고정 비용이 커져요.", "202": "TCP와 TLS 1.3을 합친 비용 계산이 맞아서 O예요.\nTLS는 데이터를 암호화하기 위해 열쇠를 협상하는 프로토콜이라는 뜻이에요. 먼저 TCP 핸드셰이크에 1 RTT, 그 위에서 TLS 1.3 협상에 1 RTT가 들어 HTTPS 첫 요청을 보내기까지 총 2 RTT가 걸려요.\n예전 TLS 1.2는 협상에 2 RTT가 들어서 총 3 RTT였어요. RTT 100ms인 해외 서버라면 TLS 1.2는 300ms, TLS 1.3은 200ms가 데이터 없이 준비에만 쓰이는 셈이에요.", "203": "'QUIC도 2 RTT가 든다'는 부분이 틀려서 X예요. QUIC은 처음 연결에 1 RTT, 다시 방문할 때는 0-RTT로 시작할 수 있어요.\nTCP+TLS는 전송 연결과 암호 협상을 따로 차례대로 하지만, QUIC은 UDP 위에서 이 둘을 한 번의 왕복에 합쳐서 처리해요. 0-RTT는 예전에 받아 둔 정보로 첫 패킷부터 암호화된 데이터를 보내는 것이라는 뜻이에요.\n그래서 RTT가 큰 모바일 환경일수록 HTTP/3(QUIC)의 체감 속도 이점이 커요.", "204": "첫 호출 지연의 원인을 연결 수립 비용에서 찾는 접근이 맞아서 O예요.\n첫 호출에는 DNS 조회, TCP 1 RTT, TLS 1 RTT가 모두 들어가지만, 두 번째부터는 열린 연결을 재사용하면 이 비용이 사라져요. 만약 매 요청마다 연결을 새로 열고 닫는 코드라면 모든 호출이 '첫 호출'처럼 느려져요.\nKeep-Alive는 요청이 끝나도 연결을 닫지 않고 유지하는 것, 커넥션 풀은 미리 열어 둔 연결 여러 개를 돌려 쓰는 것이라는 뜻이에요. Python requests라면 Session 객체를 쓰는 게 이 원리예요.", "205": "'세그먼트 개수를 센다'는 부분이 틀려서 X예요. TCP 순서번호는 바이트 단위로 세요.\n세그먼트는 TCP가 보내는 한 조각이라는 뜻이에요. seq=1461이라는 건 '3번째 조각'이 아니라 '이 조각의 첫 바이트가 전체 스트림에서 1461번째 바이트'라는 의미예요.\n그래서 1460바이트짜리 조각 다음 조각의 seq는 1이 늘어나는 게 아니라 1460이 늘어나요. 바이트 단위로 세기 때문에 조각 크기가 제각각이어도 정확히 어디가 빠졌는지 알 수 있어요.", "206": "ACK 번호 계산이 맞아서 O예요.\nseq=1461은 이 조각의 첫 바이트 번호, len=1460은 길이라서 이 조각은 1461번부터 2920번 바이트까지 담고 있어요. 다음에 받고 싶은 바이트는 2921번이므로 ack = 1461 + 1460 = 2921이에요.\n공식으로는 'ack = seq + len'이에요. 2920이라고 답하면 '마지막으로 받은 번호'로 착각한 거예요. ACK는 항상 '다음에 줄 번호'라는 걸 기억하세요.", "207": "누적 ACK의 장점을 정확히 설명해서 O예요.\n누적 ACK(cumulative ACK)는 ack 번호 하나가 '이 번호 앞의 모든 바이트를 다 받았다'를 뜻하는 방식이라는 뜻이에요. 그래서 ack=1461이 중간에 유실돼도, 뒤이어 ack=2921이 도착하면 1~2920 전체가 확인돼요.\n송신자는 빠진 ACK 때문에 괜히 재전송할 필요가 없어요. 출석부에 '3번까지 왔음'이라고 적으면 1·2번을 따로 부르지 않아도 되는 것과 같아요.", "208": "MSS 계산이 맞아서 O예요.\nMTU(Maximum Transmission Unit)는 링크가 한 번에 실어 나를 수 있는 IP 패킷의 최대 크기, MSS(Maximum Segment Size)는 TCP 한 조각에 담을 수 있는 순수 데이터의 최대 크기라는 뜻이에요. 이더넷 MTU 1500에서 IP 헤더 20과 TCP 헤더 20을 빼면 1460이 남아요.\nUDP는 헤더가 8바이트라 1500 − 20 − 8 = 1472바이트까지 담을 수 있어요. TCP 옵션이 붙으면 실제 데이터 공간은 1460보다 조금 더 줄어들어요.", "209": "'헤더를 포함한 전체 크기'라는 부분이 틀려서 X예요. MSS는 TCP·IP 헤더를 뺀 데이터(payload)만의 최대 크기예요.\npayload는 헤더를 뺀 실제 내용물이라는 뜻이에요. 이더넷 기준 MSS가 1460이면, 여기에 TCP 헤더 20 + IP 헤더 20이 붙어 IP 패킷 1500바이트(=MTU)가 돼요.\n헤더까지 포함한 크기 제한은 MTU 쪽 개념이에요. 정리하면 MTU = MSS + IP 헤더 + TCP 헤더예요.", "210": "MSS를 알리는 시점과 방법이 맞아서 O예요.\n3-way handshake의 SYN과 SYN+ACK에는 TCP 헤더의 Options 칸이 붙어, '나는 한 조각에 최대 1460바이트까지 받을 수 있어' 같은 MSS 값을 서로 알려요. 연결 중간에 바꾸는 게 아니라 시작할 때 정해요.\n같은 Options 칸으로 Window Scale(윈도우 크기 배율)과 SACK 허용 여부도 협상해요. 그래서 SYN 패킷은 데이터가 없어도 옵션 때문에 헤더가 20바이트보다 커지는 경우가 많아요.", "211": "TCP가 큰 데이터를 MSS 단위로 쪼갠다는 말이 맞아서 O예요.\n앱은 send()로 1MB를 한 번에 맡기지만, 그 덩어리는 커널의 송신 버퍼에 들어가고 TCP가 MSS(이더넷이면 1460바이트) 크기로 잘라 각각 헤더를 붙여 보내요. 1,000,000 ÷ 1460을 하면 약 690개 안팎의 세그먼트가 돼요.\n앱 입장에서는 한 번 보낸 것 같아도 네트워크에는 수백 개의 조각이 흐르고, 각 조각이 순서번호로 관리돼요. 반대로 UDP는 앱이 준 단위를 그대로 하나의 데이터그램으로 보내요.", "212": "TCP가 메시지 경계를 기억하지 않는다는 말이 맞아서 O예요.\nTCP는 데이터를 바이트의 연속(스트림)으로만 보기 때문에, 앱이 send()를 몇 번 나눠 불렀는지는 받는 쪽에 전달되지 않아요. '아버지가'와 '방에들어가신다'를 따로 보내도 받는 쪽은 '아버지가방에들어가신다'로 받을 수 있어요.\n그래서 TCP 앱은 길이 헤더나 줄바꿈 같은 구분자로 메시지 경계를 직접 정해야 해요. UDP는 반대로 sendto() 한 번의 단위가 그대로 유지돼요.", "213": "ACK와 FIN을 합치지 않는 이유가 정확해서 O예요.\nhalf-close는 한쪽 방향만 먼저 닫고 반대 방향은 계속 열어 두는 것이라는 뜻이에요. A가 FIN('나는 더 보낼 게 없어')을 보내면 B는 ACK로 '알았어'라고만 답하고, 아직 보낼 데이터가 남았다면 마저 다 보낸 뒤 자기 FIN을 따로 보내요.\n그래서 닫을 때는 FIN→ACK→FIN→ACK의 4번이 돼요. 열 때는 서버가 바로 SYN과 ACK를 합칠 수 있어 3번인 것과 대비돼요.", "214": "먼저 닫는 쪽(active close)의 상태 순서가 맞아서 O예요.\nFIN을 보내면 FIN_WAIT_1, 그 FIN에 대한 ACK를 받으면 FIN_WAIT_2(상대 FIN을 기다림), 상대의 FIN이 오면 ACK를 보내고 TIME_WAIT이 돼요. TIME_WAIT에서 2×MSL을 기다린 뒤 CLOSED가 돼요.\n나중에 닫는 쪽(passive close)은 FIN을 받으면 CLOSE_WAIT, 앱이 close()해서 FIN을 보내면 LAST_ACK, 마지막 ACK를 받으면 CLOSED예요. TIME_WAIT은 먼저 닫은 쪽, CLOSE_WAIT은 나중에 닫는 쪽에 생긴다고 짝지어 외우세요.", "215": "'2×MSL이 지나면 자동으로 사라진다'는 부분이 틀려서 X예요. 그건 TIME_WAIT의 특징이고, CLOSE_WAIT은 앱이 close()를 부를 때까지 무한정 남아요.\nCLOSE_WAIT은 상대가 FIN을 보내 와서 '상대는 다 보냈다'는 걸 알게 된 상태로, 이제 내 쪽 앱이 닫아 주기를 기다리는 상태라는 뜻이에요. 커널은 앱이 아직 데이터를 보낼 수도 있으니 마음대로 닫지 않아요.\nMSL(Maximum Segment Lifetime)은 패킷이 네트워크에서 살아 있을 수 있는 최대 시간이에요. 타이머로 사라지는 TIME_WAIT과 코드로만 사라지는 CLOSE_WAIT을 구분하세요.", "216": "TIME_WAIT이 생기는 쪽과 목적이 맞아서 O예요.\nTIME_WAIT은 먼저 close()한 쪽이 마지막 ACK를 보낸 뒤 바로 사라지지 않고 잠시 기다리는 상태라는 뜻이에요. 그 사이 같은 4-tuple로 새 연결이 생기면, 옛 연결의 늦은 패킷이 새 연결의 데이터로 잘못 받아들여질 수 있어서 그걸 막는 거예요.\n또 내가 보낸 마지막 ACK가 유실되면 상대가 FIN을 다시 보내는데, TIME_WAIT이 있어야 그걸 받아 ACK를 다시 보내 줄 수 있어요. 없으면 상대는 RST를 받고 비정상 종료로 처리해요.", "217": "TIME_WAIT의 유지 시간과 영향이 맞아서 O예요.\nMSL은 패킷이 네트워크를 떠돌 수 있는 최대 수명이라는 뜻이고, 2×MSL은 '갔다 오는 패킷까지 모두 사라질 시간'이에요. 리눅스는 이 값을 약 60초로 고정해 두고, 그동안 그 4-tuple을 다시 쓰지 못하게 해요.\n부하 테스트처럼 짧은 연결을 초당 수천 개씩 열고 닫으면, 60초 동안 TIME_WAIT이 수만 개 쌓여 클라이언트의 임시 포트가 바닥날 수 있어요.", "218": "TIME_WAIT 대량 누적의 결과와 오류 메시지가 맞아서 O예요.\n클라이언트가 연결을 열 때마다 OS는 임시(ephemeral) 포트를 하나씩 붙이는데, TIME_WAIT 상태의 연결이 그 포트들을 약 60초씩 붙잡고 있어요. 포트를 다 쓰면 connect()가 'Cannot assign requested address'(EADDRNOTAVAIL)로 실패해요.\n가장 좋은 해결책은 연결을 매번 새로 열지 않고 Keep-Alive나 커넥션 풀로 재사용하는 거예요. 서버 bind 실패인 EADDRINUSE와 헷갈리지 마세요.", "219": "'커널 파라미터를 조정하면 해결된다'는 부분이 틀려서 X예요. CLOSE_WAIT 누적은 앱 코드가 close()를 안 부르는 버그라서 코드를 고쳐야 해요.\nCLOSE_WAIT은 상대가 이미 FIN을 보냈고 커널은 ACK까지 끝낸 상태에서, 앱이 소켓을 닫기만 기다리는 상태라는 뜻이에요. 커널에는 'CLOSE_WAIT을 몇 초 뒤 지워라' 같은 타이머가 없어요.\n흔한 원인은 예외 발생 시 close()를 건너뛰는 코드예요. try/finally, with 문, 커넥션 풀 반납을 확인하세요. 커널 설정(tcp_tw_reuse 등)으로 다룰 수 있는 건 TIME_WAIT 쪽이에요.", "220": "'상대 앱이 데이터를 처리했다'는 부분이 틀려서 X예요. ACK는 상대 커널이 그 바이트를 수신 버퍼에 받았다는 뜻일 뿐이에요.\n상대 앱은 아직 recv()로 읽지도 않았을 수 있고, 읽은 뒤 DB 저장 중에 죽을 수도 있어요. 그래서 '결제 완료' 같은 확인은 앱 수준의 응답(예: HTTP 200)으로 따로 받아야 해요.\n응답을 못 받아 다시 요청할 때를 대비해, 같은 요청을 여러 번 보내도 결과가 한 번 보낸 것과 같은 성질인 멱등성(idempotency)을 설계해야 해요. 택배 '배송 완료'가 '받는 사람이 열어 봤다'는 뜻이 아닌 것과 같아요.", "221": "'암호화와 인증까지 보장한다'는 부분이 틀려서 X예요. TCP는 순서와 무손실만 보장하고, 암호화·인증은 TLS가 담당해요.\n암호화는 중간에서 엿봐도 내용을 못 알아보게 하는 것, 인증은 상대가 진짜 그 서버인지 확인하는 것이라는 뜻이에요. TCP 패킷은 평문이라 같은 Wi-Fi의 누군가가 캡처하면 내용이 그대로 보여요.\n그래서 HTTPS는 'HTTP + TLS + TCP' 구조예요. TCP는 '내용을 빠짐없이 순서대로', TLS는 '남이 못 보고 위조 못 하게'로 역할이 나뉘어요.", "222": "TCP 체크섬의 역할이 맞아서 O예요.\n체크섬은 보낸 데이터를 일정 규칙으로 더해 만든 16비트 검사값으로, 받는 쪽이 다시 계산해 다르면 '중간에 깨졌다'고 판단하는 장치라는 뜻이에요. 깨진 조각은 ACK 없이 버려지고, 송신자가 결국 재전송해요.\n다만 16비트 합이라 비트 두 개가 서로 상쇄되는 식의 오류는 놓칠 수 있어서 '약한 수준'의 무결성이에요. 악의적인 위조까지 막는 강한 무결성은 TLS의 MAC 같은 암호 기술이 담당해요.", "223": "'TCP 문제가 아니라 메시지 경계 처리 문제'라는 진단이 맞아서 O예요.\nTCP는 바이트를 순서대로 빠짐없이 전달하지만, 메시지가 어디서 끝나는지는 알려 주지 않아요. recv() 한 번에 메시지 하나가 온다고 가정하면, 두 메시지가 붙어 오거나 하나가 반으로 잘려 올 때 파싱이 깨져요.\n예를 들어 JSON 두 개가 붙어 와서 json.loads()가 실패하는 경우예요. 길이 헤더를 먼저 읽고 그 길이만큼 모을 때까지 반복해서 recv()하는 식으로 고쳐요.", "224": "Head-of-Line Blocking의 정의가 맞아서 O예요.\nHead-of-Line(줄의 맨 앞) Blocking은 맨 앞이 막히면 뒤가 다 준비돼도 못 나가는 현상이라는 뜻이에요. TCP는 순서를 보장해야 하므로, 1461번 조각이 빠지면 2921번 이후 조각이 이미 도착해 있어도 앱에 넘기지 않고 버퍼에 쥐고 기다려요.\n마트 계산대 맨 앞 손님이 계산을 멈추면 뒤 손님들이 모두 기다리는 것과 같아요. QUIC은 스트림을 독립적으로 나눠, 한 스트림의 손실이 다른 스트림을 막지 않게 했어요.", "225": "RTO 계산식이 맞아서 O예요.\nRTO(Retransmission Timeout)는 ACK가 이 시간 안에 안 오면 잃어버린 것으로 보고 다시 보내는 대기 시간이라는 뜻이에요. SRTT는 측정한 RTT들의 부드러운 평균, RTTVAR는 RTT가 얼마나 들쭉날쭉한지(변동폭)를 나타내요.\n평균에 변동폭의 4배를 여유로 더하는 이유는, RTT가 잠깐 튀었을 뿐인데 손실로 오해해 불필요하게 재전송하지 않기 위해서예요. 지연이 안정된 회선은 RTO가 평균에 가깝고, 불안정한 회선은 더 길어져요.", "226": "타임아웃 반복 시 지수 백오프가 맞아서 O예요.\n지수 백오프(exponential backoff)는 실패할 때마다 다음 대기 시간을 2배씩 늘리는 방식이라는 뜻이에요. RTO가 1초였다면 재전송이 계속 실패할 때 1초, 2초, 4초, 8초…로 기다려요.\n네트워크가 혼잡한데 모두가 같은 간격으로 계속 재전송하면 더 막히기 때문에 물러나 주는 거예요. 대신 회선이 완전히 죽으면 커널이 포기하기까지 수십 초~수 분이 걸려, 앱은 그동안 멈춘 것처럼 보일 수 있어요.", "227": "앱이 별도 타임아웃을 걸어야 한다는 말이 맞아서 O예요.\nTCP 재전송은 커널이 알아서 하지만, 지수 백오프 때문에 '이 연결은 죽었다'고 앱에 알려 주기까지 수십 초 이상 걸릴 수 있어요. 그동안 recv()는 하염없이 기다려요.\n그래서 앱은 '3초 안에 응답 없으면 실패 처리하고 재시도'처럼 자기 기준의 타임아웃(예: Python의 settimeout(), requests의 timeout=)을 따로 둬야 해요. 커널 타이머는 '패킷 재전송용', 앱 타이머는 '사용자 경험용'이라고 구분하면 쉬워요.", "228": "Fast Retransmit의 동작이 맞아서 O예요.\n중복 ACK는 같은 ack 번호가 반복해서 오는 것으로, 수신자가 '중간이 빠졌는데 뒤에 것들이 계속 오고 있어'라고 알리는 신호라는 뜻이에요. 중복 ACK 3개가 쌓이면 송신자는 RTO 타이머가 끝나기를 기다리지 않고 그 조각을 바로 다시 보내요.\nRTO는 보통 수백 ms~1초 이상이지만, 중복 ACK는 몇 RTT(수십 ms) 안에 오기 때문에 복구가 훨씬 빨라요. 1~2개가 아닌 3개를 기다리는 건 패킷 순서가 살짝 바뀐 경우를 손실로 오해하지 않기 위해서예요.", "229": "'빠른 재전송으로 곧바로 복구된다'는 부분이 틀려서 X예요. 마지막 조각이 빠지면 결국 타임아웃(RTO)을 기다려야 해요.\n빠른 재전송은 빠진 조각 뒤에 다른 조각들이 도착해서 중복 ACK를 만들어 줘야 작동해요. 그런데 마지막 조각 뒤에는 따라올 데이터가 없어서 수신자가 중복 ACK를 보낼 계기가 없어요.\n그래서 짧은 요청·응답의 끝부분이 유실되면 체감 지연이 갑자기 커지는 경우가 있어요(tail loss). 중간 손실은 빠르게, 끝 손실은 느리게 복구된다고 기억하세요.", "230": "두 가지 손실 감지 방식을 혼잡 정도로 해석하는 방식이 맞아서 O예요.\n타임아웃은 ACK가 아예 안 돌아왔다는 뜻이라 뒤 조각까지 못 가고 있을 만큼 길이 심하게 막혔다고 봐요. 그래서 cwnd(혼잡 윈도우)를 1 MSS로 확 줄이고 Slow Start부터 다시 해요.\n중복 ACK 3개는 뒤 조각들은 잘 도착하고 있다는 증거라 '살짝 넘쳤다' 정도로 보고 cwnd를 절반으로만 줄여요. 같은 '손실'이라도 어떤 신호로 알았는지에 따라 반응 강도가 달라요.", "231": "SACK의 역할이 맞아서 O예요.\nSACK(Selective ACK, 선택적 확인)는 누적 ACK만으로는 표현할 수 없는 '중간에 받은 구간'을 TCP 옵션으로 함께 알려 주는 기능이라는 뜻이에요. 예를 들어 ack=1461과 함께 'SACK: 2921~5840'을 보내면, 송신자는 1461~2920만 빠졌다는 걸 정확히 알아요.\n누적 ACK만 있으면 송신자는 빠진 지점 이후를 전부 다시 보낼지 고민해야 하지만, SACK가 있으면 정확히 빠진 조각만 다시 보내 대역폭을 아낄 수 있어요. SACK 사용 여부는 SYN 때 옵션으로 협상해요.", "232": "중복 수신 처리 방식이 맞아서 O예요.\n재전송이 일어나면 원래 조각이 늦게 도착하고 다시 보낸 조각도 도착해, 같은 데이터가 두 번 올 수 있어요. 수신자는 순서번호를 보고 '이 범위는 이미 받았다'고 판단해 버리고, 송신자에게 현재 상태를 알리려고 ACK만 다시 보내요.\n그래서 앱의 recv()에는 데이터가 정확히 한 번만 올라가요. 이 중복 제거는 TCP가 바이트 단위 순서번호를 쓰기 때문에 가능한 일이에요.", "233": "송신 버퍼에 사본을 유지한다는 말이 맞아서 O예요.\n송신 버퍼는 앱이 send()로 맡긴 데이터를 커널이 들고 있는 공간이라는 뜻이에요. 데이터를 보낸 직후에도 아직 ACK를 받지 못했다면 유실됐을 가능성이 있어서, 커널은 그 부분을 지우지 않고 보관해요.\nACK가 와서 '여기까지 받았어'가 확인되면 그제야 그 앞부분을 버퍼에서 비워요. 그래서 send()가 성공했다는 건 '상대에게 도착했다'가 아니라 '커널 송신 버퍼에 넣었다'는 뜻에 가까워요.", "234": "정지-대기 방식의 처리량 한계가 맞아서 O예요.\n정지-대기(Stop-and-Wait)는 한 조각을 보내고 ACK가 올 때까지 아무것도 안 보내는 방식이라는 뜻이에요. 그러면 RTT마다 MSS 하나만 전달되니 처리량 = MSS ÷ RTT가 돼요.\nRTT 30ms, MSS 1460바이트라면 1460×8비트 ÷ 0.03초 ≈ 0.39 Mbps예요. 회선이 1 Gbps여도 대부분 시간을 ACK만 기다리며 놀게 되는 거예요. 이 문제를 해결하려고 슬라이딩 윈도우를 써요.", "235": "슬라이딩 윈도우의 개념이 맞아서 O예요.\n윈도우는 ACK 없이 한꺼번에 보내도 되는 데이터의 양이라는 뜻이에요. 윈도우가 10 MSS라면 10개 조각을 연달아 보내 두고, 앞 조각의 ACK가 오는 만큼 창(window)을 오른쪽으로 밀어 새 조각을 추가로 보내요.\n그래서 회선 위에 항상 여러 조각이 동시에 떠 있어, 정지-대기보다 처리량이 윈도우 크기만큼 배로 늘어요. 컨베이어 벨트에 상자를 하나씩 올렸다 내리는 게 아니라 여러 개를 계속 올리는 것과 같아요.", "236": "실제 전송 윈도우가 min(rwnd, cwnd)라는 말이 맞아서 O예요.\nrwnd는 수신자가 '내 버퍼에 이만큼 남았어'라고 알려 주는 수신 윈도우, cwnd는 송신자가 '네트워크가 이만큼은 견딜 것 같다'고 추정한 혼잡 윈도우라는 뜻이에요. 둘 중 하나라도 넘으면 문제가 생기므로 작은 쪽에 맞춰요.\n예를 들어 rwnd=64KB, cwnd=20KB면 20KB만 보내요. 받는 쪽이 넉넉해도 길이 막히면 못 보내고, 길이 뻥 뚫려도 받는 쪽이 꽉 차면 못 보내요.", "237": "처리량 ≈ 윈도우 ÷ RTT 관계가 맞아서 O예요.\n한 RTT 동안 ACK 없이 보낼 수 있는 양이 윈도우이므로, 1초에 보내는 양은 대략 윈도우를 RTT로 나눈 값이 돼요. 윈도우 64KB, RTT 10ms라면 약 6.4MB/s(약 52 Mbps)예요.\n같은 64KB라도 RTT가 100ms인 해외 회선이면 처리량이 1/10로 떨어져요. 그래서 멀리 있는 서버와 빠르게 주고받으려면 '대역폭 × RTT'만큼 큰 윈도우가 필요해요(이를 BDP, 대역폭-지연 곱이라고 해요).", "238": "'주된 원인은 네트워크 혼잡'이라는 부분이 틀려서 X예요. Zero Window의 주된 원인은 수신 앱이 데이터를 늦게 읽는 거예요.\nrwnd는 수신 버퍼의 남은 공간이에요. 커널은 데이터를 잘 받아 버퍼에 쌓는데, 앱의 recv() 루프가 다른 일(DB 처리 등)에 막혀 꺼내 가지 않으면 버퍼가 꽉 차서 rwnd=0을 광고하게 돼요.\n네트워크 혼잡은 rwnd가 아니라 송신자의 cwnd를 줄여요. 즉 Zero Window는 흐름 제어(받는 쪽 문제), 혼잡은 혼잡 제어(길 문제)로 구분해요.", "239": "Zero Window 상황에서의 송신자 동작이 맞아서 O예요.\n수신자가 rwnd=0을 광고하면 송신자는 더 보내면 버려질 테니 데이터 전송을 멈춰요. 하지만 나중에 수신자가 버퍼를 비우고 보낸 '윈도우 열렸어' 업데이트가 유실되면 양쪽이 서로 기다리는 교착 상태가 될 수 있어요.\n그래서 송신자는 주기적으로 아주 작은 Window Probe(윈도우 탐색) 패킷을 보내 '지금은 받을 수 있어?'라고 물어요. 응답의 Window 값이 0보다 커지면 다시 전송을 시작해요.", "240": "rwnd를 전달하는 방법이 맞아서 O예요.\n수신자는 ACK를 보낼 때마다 TCP 헤더의 Window 칸에 '내 수신 버퍼에 지금 이만큼 남아 있어'라는 값(rwnd)을 적어요. 송신자는 이 값을 보고 그 이상은 보내지 않아요.\n앱이 데이터를 빨리 읽어 가면 rwnd가 다시 커지고, 늦게 읽으면 점점 줄어 결국 0이 돼요. 이렇게 받는 쪽이 직접 속도를 조절하게 하는 것이 흐름 제어(Flow control)예요.", "241": "Window 필드 크기와 한계가 맞아서 O예요.\n16비트로 표현할 수 있는 최댓값은 65535, 즉 약 64KB예요. 그래서 옵션이 없으면 아무리 빠른 회선이어도 한 RTT에 64KB까지만 보낼 수 있어요.\n윈도우 ÷ RTT로 계산하면 RTT 100ms에서 64KB는 약 5 Mbps밖에 안 돼요. 그래서 SYN 때 Window Scaling 옵션으로 '이 값에 2의 n승을 곱해서 읽어라'라는 배율을 협상해 최대 1GB까지 늘려요.", "242": "병목 원인을 윈도우에서 찾는 접근이 맞아서 O예요.\n처리량 ≈ 윈도우 ÷ RTT이므로, 회선 대역폭이 넉넉해도 윈도우가 작으면 그만큼만 나와요. 원인은 수신 버퍼가 작거나 앱이 늦게 읽어서 rwnd가 작은 경우, 또는 손실이 반복돼 cwnd가 자꾸 반으로 줄어드는 경우 두 가지예요.\nss -ti 같은 명령으로 rwnd·cwnd·재전송 수를 보면 둘 중 무엇이 병목인지 가릴 수 있어요. '파이프는 굵은데 수도꼭지를 조금만 연 상태'라고 생각하면 돼요.", "243": "병목 라우터 큐의 두 가지 영향이 맞아서 O예요.\n라우터는 바로 내보낼 수 없는 패킷을 큐(버퍼)에 잠시 쌓아 둬요. 큐가 차기 시작하면 패킷들이 줄 서서 기다리느라 지연이 늘어나는데, 큐가 너무 커서 지연이 과하게 늘어나는 현상을 bufferbloat라고 해요.\n큐가 끝까지 차면 새로 오는 패킷은 버려져요(손실). 그래서 수신자 버퍼(rwnd)가 넉넉해도 중간 길이 막힐 수 있고, 이걸 막는 게 혼잡 제어의 목적이에요.", "244": "큐가 차는 원인이 맞아서 O예요.\n라우터의 출구 링크는 정해진 속도로만 패킷을 내보낼 수 있어요. 들어오는 속도(여러 입력의 합)가 이보다 크면 남는 패킷이 큐에 쌓이고, 이 상태가 계속되면 큐가 가득 차요.\n예를 들어 100 Mbps 출구에 세 송신자가 각각 50 Mbps씩 보내면, 초당 50 Mbps만큼이 계속 큐에 쌓여요. 고속도로 진입로 세 개가 한 차선으로 합쳐지는 병목 구간을 떠올리면 돼요.", "245": "'라우터에게 물어서 정한다'는 부분이 틀려서 X예요. TCP는 라우터에 묻지 않고, 손실과 지연 변화를 보고 스스로 추정해요.\n일반적인 TCP는 ACK가 안 오거나(타임아웃) 중복 ACK가 오면 '길이 막혔구나'로 판단해 cwnd를 줄이고, 잘 오면 조금씩 늘려요. 라우터는 연결의 존재조차 몰라서 '혼잡한가요?'에 답해 주지 않아요.\n이렇게 끝단 호스트끼리 결과만 보고 판단하는 방식을 종단 간(end-to-end) 혼잡 제어라고 해요. 안개 낀 길에서 앞차 브레이크등만 보고 속도를 맞추는 것과 비슷해요.", "246": "cwnd가 헤더에 없다는 말이 맞아서 O예요.\ncwnd(혼잡 윈도우)는 송신자가 '네트워크가 이만큼은 감당할 것 같다'고 혼자 추정한 값이라 상대에게 알릴 필요가 없어요. 송신자 커널의 TCB 안에만 있어요.\n반면 rwnd는 수신자가 송신자에게 알려 줘야 하는 값이라 ACK마다 TCP 헤더의 Window 칸에 실려 가요. 그래서 패킷 캡처(Wireshark)로는 rwnd는 보이지만 cwnd는 직접 보이지 않아요.", "247": "'매 RTT마다 1 MSS씩 늘어난다'는 부분이 틀려서 X예요. Slow Start에서는 매 RTT마다 cwnd가 2배로 늘어요.\nSlow Start에서는 ACK 하나를 받을 때마다 cwnd를 1 MSS씩 늘리는데, 한 RTT 동안 cwnd개의 ACK가 오므로 결과적으로 1→2→4→8로 두 배씩 커져요(지수 증가).\nRTT마다 1 MSS씩 늘리는 선형 증가는 cwnd가 ssthresh(임계값)를 넘은 뒤의 Congestion Avoidance 단계예요. '처음엔 2배, 임계값 이후엔 +1'로 짝지어 기억하세요.", "248": "Slow Start 이름의 뜻을 정확히 짚어서 O예요.\nSlow Start는 cwnd를 1 MSS(요즘 리눅스는 보통 10 MSS)처럼 낮은 값에서 시작한다는 뜻이지, 계속 천천히 보낸다는 뜻이 아니에요. 시작한 뒤에는 매 RTT마다 2배로 늘어 순식간에 커져요.\n예전 TCP는 연결하자마자 윈도우만큼 한꺼번에 쏟아부어 네트워크를 마비시키곤 했는데, 그에 비해 '천천히 시작'한다는 의미로 붙은 이름이에요. 실제 증가 속도는 Congestion Avoidance보다 훨씬 빨라요.", "249": "ssthresh 이후의 증가 방식이 맞아서 O예요.\nssthresh(slow start threshold)는 '여기부터는 조심해서 늘리자'는 경계값이라는 뜻이에요. cwnd가 이 값에 닿기 전까지는 2배씩(Slow Start), 닿은 뒤에는 RTT마다 1 MSS씩 선형으로(Congestion Avoidance) 늘려요.\n이전에 손실이 났던 근처라 혼잡이 다시 올 수 있으니 조금씩 늘리며 한계를 더듬는 거예요. 물 컵을 채울 때 처음엔 콸콸, 가득 찰 즈음엔 조금씩 따르는 것과 같아요.", "250": "타임아웃 시 반응이 맞아서 O예요.\n타임아웃은 RTO 동안 ACK가 하나도 안 왔다는 뜻이라, 뒤 조각까지 못 가고 있을 만큼 심각한 혼잡으로 해석해요. 그래서 cwnd를 1 MSS로 확 낮추고(ssthresh는 그때 cwnd의 절반으로 저장) Slow Start부터 다시 시작해요.\n중복 ACK 3개로 손실을 감지한 경우에는 '가벼운 손실'로 보고 절반만 줄이는 것과 대비돼요. 타임아웃이 잦은 연결의 처리량이 톱니처럼 확 떨어졌다 오르는 이유예요.", "251": "중복 ACK 감지 시 반응이 맞아서 O예요.\n중복 ACK 3개는 뒤 조각들이 잘 도착하고 있다는 뜻이라, 네트워크가 완전히 막힌 게 아니라 살짝 넘친 정도로 봐요. 그래서 cwnd를 절반으로 줄이고, Slow Start로 돌아가지 않고 그 지점부터 RTT마다 1 MSS씩 선형 증가를 이어 가요(Fast Recovery).\n이 '절반으로 줄이기'가 AIMD의 MD(Multiplicative Decrease, 곱으로 감소)예요. 타임아웃 때의 '1로 리셋'과 짝지어 비교해 두세요.", "252": "손실 시 ssthresh 갱신 규칙이 맞아서 O예요.\nssthresh는 Slow Start에서 Congestion Avoidance로 넘어가는 경계값이에요. 손실이 났다는 건 그때의 cwnd가 네트워크 한계를 넘었다는 뜻이므로, 그 절반을 새 경계로 잡아 다음에는 그 근처부터 조심하게 해요.\n예를 들어 cwnd=32에서 손실이 나면 ssthresh=16이 돼요. 타임아웃이었다면 cwnd=1에서 2배씩 올라가다 16부터 선형으로, 중복 ACK였다면 바로 16부터 선형으로 늘려요.", "253": "AIMD가 공평성을 만드는 원리가 맞아서 O예요.\nAIMD(Additive Increase, Multiplicative Decrease)는 손실이 없으면 조금씩 더하고(+1 MSS), 손실이 나면 곱으로 줄이는(×1/2) 규칙이라는 뜻이에요. 큰 흐름은 줄일 때 많이 줄고, 작은 흐름은 적게 줄기 때문에 반복할수록 흐름들의 몫이 비슷해져요.\n다만 이 공평성은 모두가 같은 규칙을 지킨다는 전제가 있어요. 혼잡 제어 없이 마구 보내는 UDP 앱이 섞이면 TCP 흐름들만 양보하게 되는 문제가 생겨요.", "254": "'리눅스 기본값은 BBR'이라는 부분이 틀려서 X예요. 리눅스의 기본 혼잡제어 알고리즘은 CUBIC이에요.\nCUBIC은 손실을 혼잡 신호로 보고, 손실 후 cwnd를 3차 함수(cubic) 모양으로 회복시키는 손실 기반 알고리즘이라는 뜻이에요. 고속·장거리 회선에서도 빠르게 윈도우를 키울 수 있게 기존 Reno를 개선한 거예요.\nBBR은 구글이 만든 알고리즘으로, 손실 대신 측정한 대역폭과 최소 RTT로 적정 전송량을 계산해요. 설정으로 바꿀 수는 있지만 기본값은 아니에요.", "255": "UDP 헤더 구성이 맞아서 O예요.\nUDP 헤더는 출발지 포트(2바이트), 목적지 포트(2바이트), Length(헤더+데이터 전체 길이, 2바이트), Checksum(오류 검사값, 2바이트) 네 칸, 합쳐서 8바이트뿐이에요.\nTCP 헤더(최소 20바이트)에 있는 순서번호, ACK 번호, Flags, Window 칸이 UDP에는 하나도 없어요. 헤더에 칸이 없다는 건 곧 순서 보장, 재전송, 흐름·혼잡 제어 기능이 없다는 뜻이기도 해요.", "256": "UDP 체크섬의 동작이 맞아서 O예요.\nUDP도 체크섬으로 데이터가 중간에 깨졌는지 검사해요. 하지만 깨진 걸 발견해도 상대에게 '다시 보내 줘'라고 알릴 수단(ACK, 순서번호)이 없어서 그 데이터그램을 조용히 버려요.\n결과적으로 앱 입장에서는 그 데이터가 아예 안 온 것처럼 보여요. TCP라면 깨진 조각을 버린 뒤 송신자가 ACK를 못 받아 재전송하지만, UDP에서는 필요하면 앱이 직접 재요청 로직을 만들어야 해요.", "257": "'UDP는 혼잡제어를 한다'는 부분이 틀려서 X예요. UDP에는 흐름 제어도 혼잡 제어도 없어요.\nUDP는 앱이 sendto()를 부르는 대로 즉시 내보내요. 네트워크가 막혀 패킷이 버려져도 UDP 자체는 그걸 알 방법도, 속도를 줄일 장치(cwnd)도 없어요.\n그래서 영상 스트리밍이나 QUIC처럼 UDP를 쓰는 서비스는 앱이나 상위 프로토콜에서 손실률을 보고 화질(비트레이트)을 낮추는 식으로 속도 조절을 직접 구현해요. TCP는 이 일을 커널이 자동으로 해 줘요.", "258": "'TCP 위에서 동작한다'는 부분이 틀려서 X예요. QUIC는 UDP 위에서 동작해요.\nQUIC는 구글이 시작하고 IETF가 표준화한 전송 프로토콜로, UDP 위에 신뢰성(재전송), 혼잡 제어, TLS 1.3 암호화, 여러 스트림 기능을 직접 얹은 것이라는 뜻이에요.\nTCP는 OS 커널에 박혀 있어 바꾸기 어렵지만, UDP 위의 QUIC는 앱(브라우저) 안에서 구현되므로 빠르게 개선할 수 있어요. HTTP/3가 바로 이 QUIC 위에서 동작해요.", "259": "QUIC의 Connection ID 덕분에 연결이 유지된다는 말이 맞아서 O예요.\nConnection ID는 IP·포트와 상관없이 연결을 식별하는 고유 번호라는 뜻이에요. 스마트폰이 Wi-Fi에서 LTE로 바뀌면 IP 주소가 바뀌지만, 패킷에 같은 Connection ID가 붙어 있으니 서버는 '같은 연결'로 알아보고 이어 가요.\nTCP는 4-tuple(출발지·목적지 IP·포트)로 연결을 식별해서, IP가 하나만 바뀌어도 다른 연결로 취급돼 끊기고 처음부터 다시 맺어야 해요. 이 기능을 connection migration이라고 해요.", "260": "QUIC 스트림의 독립성이 맞아서 O예요.\n스트림은 한 연결 안에서 서로 다른 파일·요청을 실어 나르는 독립된 통로라는 뜻이에요. QUIC는 스트림마다 순서를 따로 관리해서, 이미지 A의 조각이 빠져도 CSS 파일 B의 데이터는 바로 앱에 전달돼요.\nHTTP/2도 한 연결에 여러 스트림을 싣지만, 그 아래 TCP는 하나의 바이트 스트림이라 조각 하나만 빠져도 모든 스트림이 같이 멈춰요(TCP HOL Blocking). QUIC는 이 문제를 전송 계층에서 풀었어요.", "261": "Flags 칸의 역할이 맞아서 O예요.\nFlags는 TCP 헤더 안의 1비트짜리 스위치 묶음으로, 각각 켜지면 특별한 의미를 가져요. SYN은 연결 시작, ACK는 확인 번호가 유효함, FIN은 정상 종료, RST는 강제 종료, PSH는 버퍼에 쌓지 말고 바로 앱에 올리라는 뜻이에요.\n3-way handshake의 SYN → SYN+ACK → ACK도 결국 이 플래그 조합이에요. Wireshark에서 [SYN], [SYN, ACK], [FIN, ACK]처럼 표시되는 게 바로 이 칸이에요.", "262": "RST의 의미와 예시가 맞아서 O예요.\nRST(Reset)는 정상적인 FIN 절차 없이 '이 연결은 없거나 더는 유지 못 하니 즉시 버려라'고 알리는 플래그라는 뜻이에요. 닫힌 포트(listen하는 프로세스가 없는 포트)로 SYN을 보내면 상대 OS가 바로 RST를 돌려줘요.\n이 RST를 받은 클라이언트 앱에는 'Connection refused'로 보여요. 이미 연결된 상태에서 RST를 받으면 'Connection reset by peer'가 돼요. FIN은 '예의 바른 작별 인사', RST는 '전화 끊어 버리기'예요.", "263": "'송신자의 cwnd를 알려 준다'는 부분이 틀려서 X예요. Window Size 칸에는 수신자가 광고하는 rwnd가 들어가요.\nrwnd는 '내 수신 버퍼에 지금 이만큼 남았으니 이 이상은 보내지 마'라는 값이라 상대에게 알려야 해서 헤더에 실어요.\ncwnd는 송신자가 네트워크 상태를 보고 스스로 추정해 혼자 쓰는 값이라 헤더 어디에도 없어요. 즉 헤더로 오가는 건 흐름 제어(rwnd) 정보뿐이고, 혼잡 제어(cwnd)는 각자 내부에서 처리해요.", "264": "캡슐화의 정의가 맞아서 O예요.\n캡슐화(encapsulation)는 위 계층의 데이터를 아래 계층이 자기 헤더로 감싸는 것이라는 뜻이에요. 앱 데이터에 TCP 헤더가 붙으면 세그먼트, 거기에 IP 헤더가 붙으면 패킷, 다시 Ethernet 헤더·트레일러가 붙으면 프레임이 돼요.\n받는 쪽은 반대로 Ethernet → IP → TCP 순으로 바깥 봉투부터 벗겨 내며 각 계층이 자기 헤더만 읽어요(역캡슐화). 편지를 봉투에 넣고, 그 봉투를 다시 택배 상자에 넣는 것과 같아요.", "265": "Ethernet 프레임의 크기 구성이 맞아서 O예요.\nEthernet 헤더 14바이트는 목적지 MAC(6), 출발지 MAC(6), 타입(2)으로 이뤄지고, 끝에 붙는 FCS(Frame Check Sequence) 4바이트는 프레임 전체가 깨졌는지 검사하는 값이라는 뜻이에요.\n그래서 1460바이트 데이터는 TCP 20 + IP 20을 거쳐 1500바이트 IP 패킷이 되고, Ethernet 18을 더해 1518바이트 프레임으로 선 위를 지나가요. MTU 1500은 Ethernet 부분을 뺀 IP 패킷 기준이라는 점을 함께 기억하세요.", "266": "TCP 헤더가 종단 간 유지된다는 말이 맞아서 O예요.\n종단 간(end-to-end)이란 출발 호스트에서 최종 목적 호스트까지라는 뜻이에요. 라우터는 IP 헤더까지만 보고 다음 hop으로 넘기므로 그 안의 TCP 헤더(포트·순서번호·ACK)는 건드리지 않아요.\n반면 Ethernet 헤더의 MAC 주소는 '이번 구간의 출발·도착 장비'라서 라우터를 지날 때마다 새로 바뀌어요. 국제 택배에서 안쪽 편지(TCP)는 그대로이고, 구간마다 운송장(MAC)만 갈아 붙이는 것과 같아요.", "267": "IP 단편화의 위험이 맞아서 O예요.\nIP 단편화(fragmentation)는 패킷이 경로의 MTU보다 클 때 IP가 여러 조각으로 쪼개 보내고, 목적지에서 다시 합치는 것이라는 뜻이에요. 이때 조각 하나라도 빠지면 원래 패킷을 다시 조립할 수 없어 전체가 버려지고, TCP는 그 세그먼트 전체를 재전송해야 해요.\nVPN·터널은 원래 패킷에 헤더를 한 겹 더 씌워서 1500을 넘기기 쉬워요. 그래서 터널 안의 MTU(또는 MSS)를 미리 줄여 단편화 자체가 일어나지 않게 해요.", "268": "소켓을 식별하는 다섯 가지 값이 맞아서 O예요.\nendpoint는 통신의 한쪽 끝점이라는 뜻이에요. 소켓은 어떤 프로토콜(TCP/UDP)로, 내 IP·포트에서 상대 IP·포트로 통신하는지를 묶어 정의돼요. TCP 연결 식별에 쓰는 4-tuple에 프로토콜을 더한 5-tuple이에요.\n같은 포트 번호라도 TCP 53과 UDP 53은 프로토콜이 달라서 서로 다른 소켓이에요. 앱은 이런 복잡한 정보 대신 OS가 준 정수 하나(fd)로 소켓을 가리켜요.", "269": "UNIX의 '모든 것은 파일' 철학이 맞아서 O예요.\nUNIX 계열 OS는 파일, 파이프, 소켓을 모두 fd(파일 디스크립터)라는 번호로 다뤄요. 그래서 파일에 쓰는 read()/write()를 연결된 TCP 소켓에도 그대로 쓸 수 있어요.\nrecv()/send()는 소켓 전용 함수로 플래그(MSG_PEEK 등)를 추가로 줄 수 있다는 차이만 있어요. 이 덕분에 같은 프로그램이 입력을 파일에서 받든 네트워크에서 받든 거의 같은 코드로 처리할 수 있어요.", "270": "fd의 개념과 번호 규칙이 맞아서 O예요.\nfd(file descriptor)는 OS가 앱에게 '네가 연 이 자원은 이 번호로 불러'라고 건네는 정수 번호표라는 뜻이에요. 프로세스가 시작하면 0번(표준 입력), 1번(표준 출력), 2번(표준 에러)이 이미 열려 있어서, 새로 연 소켓은 보통 남은 가장 작은 번호인 3번부터 받아요.\n앱은 소켓 내부 구조를 몰라도 'fd 3번에 이 데이터 보내 줘'라고만 요청하면 돼요. 은행 번호표처럼, 번호만 있으면 창구(커널)가 알아서 해당 업무를 찾아 줘요.", "271": "'네트워크를 거쳐 다른 호스트와 통신'한다는 부분이 틀려서 X예요. Unix Domain 소켓은 같은 호스트 안의 프로세스끼리 통신할 때 써요.\nUnix Domain 소켓은 IP·포트 대신 /var/run/docker.sock 같은 파일 경로를 주소로 쓰는 소켓이라는 뜻이에요. 네트워크 스택(TCP/IP 헤더, 체크섬, 라우팅)을 거치지 않아 같은 PC 안에서는 localhost TCP보다 빠르고 가벼워요.\n예를 들어 docker 명령어는 이 소켓으로 Docker 데몬과 대화하고, 로컬 PostgreSQL·MySQL 접속도 이 방식을 쓸 수 있어요. 다른 호스트와 통신하려면 TCP/UDP(인터넷 도메인) 소켓을 써야 해요.", "272": "서버·클라이언트 소켓 API 호출 순서가 맞아서 O예요.\n서버는 socket()으로 소켓을 만들고, bind()로 IP·포트를 붙이고, listen()으로 손님을 받을 준비를 한 뒤, accept()로 연결을 하나씩 꺼내 recv()/send()로 대화하고 close()로 닫아요.\n클라이언트는 bind()와 listen()·accept()가 없어요. socket() 후 바로 connect()로 서버에 연결을 요청하면 OS가 임시 포트를 붙여 주고 핸드셰이크까지 처리해요. 식당으로 비유하면 서버는 '가게 차리기→간판 달기→문 열기→손님 맞기' 순서예요.", "273": "'반드시 bind()를 호출해야 한다'는 부분이 틀려서 X예요. 클라이언트는 보통 bind()를 생략해요.\nbind()는 소켓에 특정 IP·포트를 붙이는 함수라는 뜻이에요. 서버는 손님이 찾아올 고정 주소(예: 443)가 필요하니 bind가 필수지만, 클라이언트는 어떤 포트에서 출발하든 상관없어요.\nconnect()를 부르면 OS가 비어 있는 임시(ephemeral) 포트(예: 51234)를 자동으로 골라 붙여 줘요. 특정 출발 포트가 꼭 필요한 특수한 경우에만 클라이언트도 bind를 직접 해요.", "274": "connect()에서 핸드셰이크가 일어난다는 말이 맞아서 O예요.\n클라이언트가 connect()를 호출하면 커널이 SYN을 보내고 SYN+ACK를 받은 뒤 ACK까지 보내야 connect()가 성공으로 돌아와요. 그래서 서버가 없거나(Connection refused), 응답이 없거나(timed out) 하는 실패는 바로 이 지점에서 오류로 드러나요.\n서버 쪽에서는 같은 핸드셰이크를 커널이 처리해 Accept queue에 넣어 두고, 앱은 accept()로 완성된 소켓을 넘겨받아요. 즉 클라이언트는 connect(), 서버는 accept()가 '연결 완료'를 확인하는 지점이에요.", "275": "listen 소켓과 연결 소켓의 개수 관계가 맞아서 O예요.\nlisten 소켓은 443 포트에서 새 손님을 받는 접수 창구로 1개만 있어요. accept()를 할 때마다 손님 전용 연결 소켓이 새로 만들어지는데, 이 소켓들도 모두 서버 쪽 포트는 443이에요.\n같은 포트를 공유해도 각 연결 소켓은 상대(클라이언트) IP·포트가 달라 4-tuple이 다르므로 커널이 헷갈리지 않아요. ss -t 로 보면 로컬 주소가 모두 :443인 줄이 손님 수만큼 보여요.", "276": "backlog의 의미가 맞아서 O예요.\nbacklog는 listen()에 넘기는 숫자로, 핸드셰이크가 끝났지만 앱이 아직 accept()로 꺼내 가지 않은 연결을 최대 몇 개까지 줄 세워 둘지 정하는 값이라는 뜻이에요. listen(128)이면 Accept queue에 128개까지 기다릴 수 있어요.\n이 큐가 꽉 차면 새로 핸드셰이크를 끝낸 연결은 버려지거나 응답이 지연돼요. 앞에 있는 SYN queue(아직 핸드셰이크 중인 연결)와는 별개의 큐라는 점도 구분해 두세요.", "277": "SYN flood와 대응책이 맞아서 O예요.\nSYN queue는 SYN을 받고 SYN+ACK를 보낸 뒤 마지막 ACK를 기다리는 반쯤 열린(SYN_RCVD) 연결들이 머무는 곳이라는 뜻이에요. 공격자가 가짜 출발지로 SYN만 대량으로 보내고 ACK를 안 주면 이 큐가 가득 차 진짜 손님이 못 들어와요.\nSYN cookie는 큐에 상태를 저장하지 않고, 연결 정보를 암호화해 SYN+ACK의 순서번호에 숨겨 보냈다가 ACK가 돌아오면 그 번호로 검증하는 기법이에요. 그래서 큐가 넘쳐도 정상 손님을 받을 수 있어요.", "278": "accept 지연의 영향이 맞아서 O예요.\n커널은 핸드셰이크를 끝낸 연결을 Accept queue에 넣어 두고 앱이 accept()로 꺼내 가길 기다려요. 앱이 한 손님 처리에 오래 붙잡혀 accept()를 늦게 부르면 큐가 backlog만큼 차고, 그 뒤로 오는 연결은 버려져요.\n클라이언트는 SYN을 재전송하며 기다리게 되어 '서버가 느리다'고 느끼지만, 실제 원인은 요청 처리 속도가 아니라 accept 루프가 막힌 거예요. 그래서 accept는 별도 스레드나 비동기(이벤트 루프)로 계속 돌리는 구조를 써요.", "279": "ss 명령의 옵션 차이가 맞아서 O예요.\nss는 리눅스에서 소켓 상태를 보여 주는 명령어로, -t는 TCP, -l은 listen 상태만이라는 뜻이에요. ss -lt는 '손님을 기다리는 창구'인 listen 소켓 목록, ss -t는 기본적으로 ESTABLISHED 같은 연결된 소켓 목록을 보여 줘요.\n예를 들어 웹 서버라면 ss -lt에는 :443 한 줄, ss -t에는 :443에 붙은 손님 수만큼 여러 줄이 보여요. 여기에 -n(숫자로), -p(프로세스 표시)를 붙여 ss -ltnp처럼 자주 써요.", "280": "'항상 대응한다'는 부분이 틀려서 X예요. TCP에서는 send()와 recv()의 횟수가 서로 맞지 않을 수 있어요.\nTCP는 경계 없는 바이트 스트림이라, send(\"Hello\")와 send(\"World\")를 따로 해도 받는 쪽 recv() 한 번에 \"HelloWorld\"가 붙어 나올 수 있어요. 반대로 큰 데이터 한 번의 send()가 recv() 여러 번에 나뉘어 나올 수도 있어요.\n그래서 TCP 앱은 길이 헤더나 구분자로 메시지를 직접 잘라야 해요. send() 한 번 = recv() 한 번이 보장되는 건 UDP(데이터그램)예요.", "281": "UDP의 데이터그램 경계 유지가 맞아서 O예요.\n데이터그램은 보낸 한 덩어리가 그대로 하나의 단위로 전달되는 메시지라는 뜻이에요. 그래서 sendto()로 100바이트를 보내면, 받는 쪽 recvfrom()에서 그 100바이트가 한 번에 통째로 나오고 다른 데이터와 섞이지 않아요(유실되면 통째로 없어져요).\n덕분에 UDP 앱은 메시지 경계를 위한 길이 헤더를 따로 만들 필요가 없어요. 다만 순서가 바뀌거나 빠질 수는 있으니, 필요하면 앱이 번호를 붙여야 해요.", "282": "'정확히 4096바이트가 모일 때까지 기다린다'는 부분이 틀려서 X예요. recv(4096)은 최대 4096바이트까지, 지금 수신 버퍼에 있는 만큼만 돌려줘요.\n4096은 '한 번에 받을 최대 크기'라는 뜻이에요. 버퍼에 100바이트만 있으면 100바이트만 반환하고, 아무것도 없을 때만 데이터가 올 때까지 기다려요(블로킹 모드).\n그래서 정확히 N바이트가 필요하면, 받은 길이를 더해 가며 N이 될 때까지 recv()를 반복하는 루프를 직접 짜야 해요. 컵 크기가 4096일 뿐, 컵을 꼭 가득 채워 주는 건 아니에요.", "283": "recv()의 0 반환 의미가 맞아서 O예요.\nTCP에서 recv()가 빈 바이트(b'')를 돌려주는 건 '데이터가 아직 없다'가 아니라, 상대가 FIN을 보내 더 이상 보낼 데이터가 없다는 뜻이에요. 데이터가 없으면 recv()는 0을 반환하지 않고 기다려요(블로킹 모드 기준).\n그래서 echo 서버는 data = conn.recv(1024) 뒤에 if not data: break로 루프를 끝내고 close()해요. 이 처리를 빼먹으면 빈 데이터를 무한 반복하거나, 닫지 않아 CLOSE_WAIT이 쌓여요.", "284": "'send()는 항상 전부 보낸다'는 부분이 틀려서 X예요. send()는 요청한 데이터 중 일부만 보내고 실제 보낸 바이트 수를 돌려줄 수 있어요.\nsend()는 데이터를 커널 송신 버퍼에 넣는 함수인데, 버퍼에 남은 공간이 부족하면 들어간 만큼만 넣고 그 길이를 반환해요. 반환값을 확인하지 않으면 뒷부분이 조용히 빠질 수 있어요.\nPython의 sendall()은 내부에서 send()를 반복 호출해 모든 데이터를 다 넣을 때까지 보내 줘요. 그래서 '전부 보내야 하는' 일반적인 경우엔 sendall()을 쓰는 게 안전해요.", "285": "settimeout() 누락의 위험이 맞아서 O예요.\n소켓은 기본적으로 블로킹 모드라서, recv()나 connect()는 응답이 올 때까지 무한정 기다려요. 상대 서버가 멈추거나 네트워크가 끊겨 응답이 오지 않으면 프로그램도 그 줄에서 영원히 멈춰요.\nsettimeout(5)처럼 시간을 정해 두면 5초 뒤 socket.timeout 예외가 나서 재시도나 오류 처리를 할 수 있어요. AI가 만든 예제 코드는 정상 상황만 가정하는 경우가 많아 이 부분을 가장 먼저 확인해야 해요.", "286": "SO_REUSEADDR의 용도가 맞아서 O예요.\n서버를 종료하면 서버가 먼저 연결을 닫은 경우 그 포트에 TIME_WAIT 연결들이 약 60초 남아요. 이 상태에서 바로 재시작해 같은 포트에 bind()하면 EADDRINUSE(Address already in use)로 실패해요.\nSO_REUSEADDR은 'TIME_WAIT 연결이 남아 있어도 이 주소에 bind하게 해 줘'라는 소켓 옵션이라는 뜻이에요. 그래서 대부분의 서버 코드는 bind() 전에 setsockopt(SOL_SOCKET, SO_REUSEADDR, 1)를 넣어 둬요.", "287": "UDP 코드 구조의 특징이 맞아서 O예요.\nlisten()과 accept()는 연결 요청을 기다리고 손님별 연결을 만드는 함수인데, UDP는 연결이라는 개념이 없어서 둘 다 필요 없어요. 서버는 socket() → bind() 후 바로 recvfrom()으로 받아요.\nsendto()는 매번 목적지 주소를 같이 넘기고, recvfrom()은 데이터와 함께 보낸 사람의 주소를 돌려줘요. 하나의 소켓으로 여러 상대와 주고받기 때문이에요. '사라진 함수 = UDP가 안 하는 일(연결 관리)'로 기억하세요.", "288": "'recvfrom()이 0을 반환해 바로 알 수 있다'는 부분이 틀려서 X예요. UDP에는 종료를 알리는 FIN이 없어서 상대가 끝났는지 알 수 없어요.\nTCP는 연결이 있어서 상대가 닫으면 FIN이 오고 recv()가 0을 반환하지만, UDP는 연결 없이 데이터그램만 주고받아요. 상대 프로그램이 죽어도 내 recvfrom()은 그냥 다음 데이터를 계속 기다릴 뿐이에요.\n그래서 UDP 앱은 '3초 동안 아무것도 안 오면 상대가 나간 것으로 본다'처럼 타임아웃이나 주기적인 heartbeat(생존 신호) 메시지로 직접 판단해요.", "289": "'네트워크가 병목'이라는 해석이 틀려서 X예요. Recv-Q가 쌓이면 내 앱이 병목이에요.\nRecv-Q는 커널이 이미 받아 수신 버퍼에 넣어 뒀지만 앱이 아직 recv()로 읽어 가지 않은 바이트 수라는 뜻이에요. 네트워크는 데이터를 잘 배달했는데, 앱이 느리게 읽고 있다는 증거예요.\n반대로 Send-Q가 쌓이면 보냈지만 상대의 ACK가 안 온 양이 많다는 뜻이라 네트워크나 상대 쪽이 병목이에요. Recv-Q는 '내 책상에 쌓인 우편물', Send-Q는 '보냈는데 답장이 안 온 우편물'로 기억하세요.", "290": "Send-Q 누적의 해석이 맞아서 O예요.\nSend-Q는 내 앱이 send()로 보냈지만 아직 상대로부터 ACK를 받지 못한(또는 아직 못 보낸) 바이트 수라는 뜻이에요. 이게 계속 쌓인다면 네트워크가 느리거나 손실이 있어 ACK가 늦게 오거나, 상대가 rwnd를 작게 광고해 더 못 보내는 상황이에요.\n반대로 Recv-Q가 쌓이면 상대는 잘 보내는데 내 앱이 읽지 못하는 것이라 내 쪽이 병목이에요. 둘 중 어느 큐가 쌓이는지로 '문제가 내 쪽인지 바깥인지'를 빠르게 가를 수 있어요.", "291": "'Too many open files'의 원인이 맞아서 O예요.\nOS는 프로세스 하나가 동시에 열 수 있는 fd 개수에 제한(ulimit -n, 흔히 1024)을 둬요. 소켓도 fd를 하나씩 차지하므로, 연결을 열기만 하고 close()하지 않으면 fd가 쌓여 결국 새 소켓이나 파일을 못 열게 돼요.\n이건 CLOSE_WAIT 누적과 같은 뿌리예요. 상대는 닫았는데 내 앱이 close()를 안 해서 소켓(fd)이 계속 남는 거예요. ulimit를 올리는 건 임시방편이고, 진짜 해결은 close() 누락을 고치는 거예요.", "292": "Connection reset by peer의 의미가 맞아서 O예요.\npeer는 통신 상대라는 뜻이에요. 이미 연결된 상태에서 상대가 정상 종료(FIN) 대신 RST를 보내 '이 연결은 버렸다'고 알렸을 때 이 오류가 나요.\n흔한 원인은 상대 프로세스가 갑자기 죽었거나, 서버·로드밸런서(LB)가 일정 시간 조용한 연결을 유휴 타임아웃으로 끊었거나, 내가 이미 닫힌 연결에 데이터를 보낸 경우예요. 연결 시도 단계에서 받는 RST가 Connection refused라면, 연결 도중 받는 RST가 reset by peer예요.", "293": "Broken pipe의 의미가 맞아서 O예요.\nBroken pipe(EPIPE)는 상대가 이미 연결을 닫았거나 RST로 끊은 소켓에 내가 또 send()/write()를 하려고 할 때 나는 오류라는 뜻이에요. '파이프(통로)가 끊어졌는데 계속 물을 붓는' 상황이에요.\nreset by peer가 주로 읽을 때 '상대가 끊었다'를 알게 되는 것이라면, Broken pipe는 쓸 때 알게 되는 경우예요. 오래 쉬던 연결을 다시 쓸 때 자주 나므로, 오류를 잡아 재연결하는 로직을 둬요.", "294": "계층별로 올라가며 확인하는 순서가 맞아서 O예요.\nping은 ICMP로 상대 호스트까지 IP 경로가 살아 있는지(네트워크 계층), nc나 telnet으로 특정 포트에 TCP 연결이 되는지(전송 계층), curl로 실제 HTTP 요청·응답이 정상인지(애플리케이션 계층)를 확인해요.\n예를 들어 ping은 되는데 nc가 refused면 서버 프로세스·포트 문제이고, nc는 되는데 curl이 500이면 앱 코드 문제예요. 한 번에 한 가지만 바꿔 보면서 '어느 층에서 끊기는지'를 좁히는 게 핵심이에요(단, ping은 방화벽이 막기도 해요).", "295": "'늦게 와도 정확해야 하므로 TCP가 적합'하다는 부분이 틀려서 X예요. 실시간 음성·영상통화는 UDP가 적합해요.\n통화에서는 0.5초 늦게 도착한 음성 조각은 이미 지나간 순간이라 쓸모가 없어요. TCP는 빠진 조각을 재전송받을 때까지 뒤 데이터를 막아 두므로(HOL Blocking) 끊김과 지연이 더 커져요.\nUDP로 보내면 일부 조각이 빠져도 코덱이 앞뒤 소리로 메꾸거나 살짝 뭉개고 넘어가요. 실시간 서비스에서는 '정확하지만 늦은 것'보다 '조금 틀려도 제때 오는 것'이 중요해요.", "296": "신뢰성이 필수인 작업에 TCP를 고른 게 맞아서 O예요.\n파일 전송이나 Git push는 한 바이트만 틀려도 파일이 깨지거나 커밋 해시가 맞지 않아 결과가 망가져요. TCP는 순서번호·ACK·재전송으로 모든 바이트가 순서대로 빠짐없이 도착하게 보장해 줘요.\n대신 손실이 나면 재전송을 기다리느라 몇 백 ms 늦어질 수 있지만, 이런 작업은 1초 늦는 건 괜찮고 틀리는 건 안 돼요. 실시간 통화와 정반대의 우선순위라고 보면 돼요.", "297": "게임 위치 동기화에 UDP를 고른 이유가 맞아서 O예요.\n게임은 초당 수십 번씩 캐릭터 좌표를 보내요. 0.1초 전 좌표 하나가 빠졌다면, 다시 받아 봐야 이미 더 최신 좌표가 도착해 있어서 의미가 없어요.\nTCP를 쓰면 빠진 옛 좌표를 재전송받을 때까지 최신 좌표도 막혀 렉이 생겨요. 다만 아이템 획득·결제처럼 반드시 전달돼야 하는 메시지는 UDP 위에 앱이 확인·재전송을 따로 붙이거나 TCP로 보내요.", "298": "LLM 스트리밍 응답 방식이 맞아서 O예요.\nSSE(Server-Sent Events)는 HTTP 연결 하나를 열어 두고 서버가 데이터를 조금씩 계속 흘려보내는 방식, WebSocket은 한 TCP 연결 위에서 양방향으로 메시지를 계속 주고받는 방식이라는 뜻이에요. 둘 다 토큰이 생성될 때마다 바로 보낼 수 있어요.\n전체 답변이 다 만들어질 때까지 기다렸다 한 번에 보내면 수 초 동안 빈 화면이지만, 스트리밍하면 첫 토큰이 바로 보여 훨씬 빠르게 느껴져요. 그래서 체감 속도 지표로 TTFT(첫 토큰까지 걸린 시간)를 중요하게 봐요.", "299": "이 문장은 O예요. 핵심은 'DNS는 host만 안다'는 부분이에요.\nDNS는 이름을 IP 주소로 바꿔 주는 전화번호부 같은 시스템이라, 'www.shop.com이 어디 있나요?'만 물어요. 그래서 /mug 같은 path나 ?color=red 같은 query는 DNS 질문에 아예 들어가지 않아요. path·query는 연결이 맺어진 뒤 HTTP 요청에 실려 서버로 가고, #fragment는 브라우저 안에서만 쓰여요.\n비유하면 DNS는 건물 주소만 알려 주는 안내원이고, 몇 층 몇 호(path)인지는 건물 안에 들어가서 묻는 거예요.", "300": "이 문장은 X예요. URL과 Domain은 포함 관계이지 같은 말이 아니에요.\nURL은 자원의 위치 전체를 적은 주소로, scheme://host:port/path?query#fragment 모양이에요. Domain(도메인)은 그중 host 자리에 들어가는 이름, 예를 들어 www.inu.ac.kr 부분만을 가리켜요.\n예를 들어 https://www.inu.ac.kr/notice?page=2 전체가 URL이고, 도메인은 www.inu.ac.kr뿐이에요. DNS가 다루는 것도 바로 이 도메인 부분이에요.", "301": "이 문장은 X예요. 재귀와 반복이 일어나는 위치가 서로 뒤바뀌어 있어요.\n재귀 질의는 '답을 끝까지 알아와서 최종 답만 줘'라고 맡기는 방식이고, 내 PC(클라이언트)가 리졸버에게 이렇게 물어요. 반복 질의는 '나는 모르지만 저 서버에 물어봐'라는 안내를 받아 묻는 쪽이 직접 다음 서버로 가는 방식이고, 리졸버가 Root → TLD → 권한 서버를 차례로 돌 때 써요.\n비유하면 나는 비서(리졸버)에게 일을 통째로 맡기고(재귀), 비서는 여러 부서를 직접 돌아다니며 물어보는(반복) 구조예요.", "302": "이 문장은 O예요. '일부 사용자만' 옛 서버로 가는 이유가 캐시와 TTL이라는 점이 맞아요.\nTTL(Time To Live)은 'DNS 답을 몇 초 동안 재사용해도 되는지'를 적은 유효기간이라는 뜻이에요. 브라우저·OS·리졸버는 받은 답을 TTL 동안 저장해 두고, 그 사이에는 권한 서버에 다시 묻지 않아요.\n그래서 레코드를 바꾼 직후, 캐시가 이미 만료된 사람은 새 IP로 가고 아직 만료되지 않은 사람은 옛 IP로 가요. 시간이 지나 모든 캐시의 TTL이 끝나면 자연스럽게 모두 새 서버로 가게 돼요.", "303": "이 문장은 O예요. 헤더와 본문 사이는 빈 줄 하나로 구분해요.\nHTTP 메시지는 시작줄, 헤더 여러 줄, 빈 줄, 본문 순서로 이루어져요. 헤더 한 줄은 \\r\\n(CRLF, 줄바꿈 두 글자)로 끝나는데, 마지막 헤더 뒤에 \\r\\n이 한 번 더 오면 \\r\\n\\r\\n이 되어 '헤더 끝'을 뜻해요.\n그 뒤의 본문이 어디까지인지는 Content-Length(바이트 수)나 chunked 방식으로 알려 줘요. 즉 빈 줄은 '시작 경계', Content-Length는 '끝 경계'를 알려 주는 셈이에요.", "304": "이 문장은 O예요. PUT은 멱등, POST는 멱등이 아니라는 구분이 맞아요.\n멱등(idempotent)이란 같은 요청을 한 번 보내든 여러 번 보내든 서버의 최종 상태가 같다는 뜻이에요. PUT /users/1은 '1번 사용자를 이 내용으로 덮어써'라서 여러 번 해도 결과가 같아요. 반면 POST /orders는 보낼 때마다 주문이 하나씩 새로 생길 수 있어요.\n그래서 네트워크가 끊겨 자동 재시도를 할 때 PUT은 안전하지만, POST는 중복 주문이 생길 수 있어 Idempotency-Key 같은 장치가 필요해요.", "305": "이 문장은 X예요. 502는 앱 서버가 아니라 그 앞의 프록시가 만든 응답이에요.\n404 Not Found는 요청이 앱 서버까지 잘 도착했는데 그 경로나 자원이 없다고 앱이 직접 답한 거예요. 502 Bad Gateway는 리버스 프록시나 로드밸런서(LB)가 뒷단 앱 서버에 요청을 넘기려다 연결이 실패했거나 이상한 응답을 받았을 때, 대신 만들어 보내는 응답이에요.\n그래서 404면 앱의 라우팅·데이터를, 502면 앱 서버가 살아 있는지·포트가 맞는지를 먼저 확인해요. 같은 오류 코드라도 '누가 만들었나'를 보면 조사 방향이 갈려요.", "306": "이 문장은 O예요. HTTP/2가 없앤 HOL과 남은 HOL이 계층별로 다르다는 점이 핵심이에요.\nHOL(Head-of-Line) Blocking은 줄 맨 앞이 막히면 뒤에 있는 것들도 전부 기다려야 하는 현상이라는 뜻이에요. HTTP/2는 한 연결에 여러 스트림을 섞어 보내서 '앞 응답이 끝나야 다음 응답'이라는 HTTP 계층의 줄 서기는 없앴어요.\n하지만 그 아래 TCP는 스트림 구분 없이 바이트를 순서대로만 넘겨서, 패킷 하나만 잃어도 모든 스트림이 멈춰요. 그래서 UDP 위에서 스트림별로 따로 재전송하는 QUIC를 쓰는 HTTP/3가 나왔어요.", "307": "이 문장은 X예요. HTTPS를 써도 접속하는 도메인 이름(SNI)은 기본적으로 보여요.\nSNI(Server Name Indication)는 TLS 연결을 시작하는 ClientHello에 '나는 이 도메인에 접속하려 해요'라고 적는 칸이에요. 아직 암호화가 시작되기 전이라 평문으로 나가요. 평문 DNS 질의, 목적지 IP와 포트도 경로상에서 보여요.\nHTTPS가 숨겨 주는 건 그 뒤 터널 안의 Method·Path·Query·Header·Cookie·Body예요. 즉 '어느 사이트에 갔는지'는 보이고 '그 사이트에서 무엇을 했는지'는 숨겨져요. SNI까지 숨기려면 ECH, DNS까지 숨기려면 DoH가 필요해요.", "308": "이 문장은 O예요. 브라우저가 인증서를 검사하는 다섯 가지 항목이 모두 맞게 나열돼 있어요.\n체인은 인증서가 믿을 수 있는 Root CA까지 서명으로 이어지는지, 이름(SAN)은 인증서에 적힌 도메인이 내가 접속한 주소와 같은지, 유효기간은 지금 시각이 기간 안인지, 폐기 여부는 CA가 취소한 인증서가 아닌지를 보는 거예요. 개인키 소유는 서버가 그 인증서의 개인키로 서명해 '진짜 주인'임을 증명하는지예요.\n예를 들어 shop.com 인증서를 evil.com이 그대로 복사해 내밀어도, 이름이 다르고 개인키도 없어서 검증에 실패해요.", "309": "이 문장은 X예요. TTFB만 길 때 의심할 곳은 DNS·연결이 아니라 서버 쪽 처리예요.\nTTFB(Time To First Byte, DevTools의 Waiting)는 요청을 다 보낸 뒤 응답의 첫 바이트가 올 때까지 기다린 시간이라는 뜻이에요. 이미 연결이 맺어진 뒤의 구간이라, 여기서 길어지면 서버가 느리게 처리했거나 DB 쿼리가 오래 걸렸거나, 서버리스 콜드 스타트, 원본 서버까지의 먼 거리 등을 의심해요.\n반대로 DNS Lookup, Initial connection, SSL 칸이 길다면 그때가 이름 조회나 연결 재사용 문제예요. 어느 칸이 긴지가 곧 병목 위치예요.", "310": "이 문장은 O예요. # 뒤의 fragment는 브라우저만 쓰고 서버로는 보내지 않아요.\nfragment는 한 페이지 안에서 특정 위치(예: #section2)를 가리키는 표시라는 뜻이에요. 브라우저는 페이지를 받아 온 뒤 그 id를 가진 위치로 스크롤하는 데만 써요.\n예를 들어 https://shop.com/guide#faq로 접속하면 서버가 받는 요청은 GET /guide뿐이고 #faq는 빠져요. 그래서 서버 로그로는 사용자가 어느 fragment로 들어왔는지 알 수 없고, path·query와 달리 서버 쪽 처리에 영향을 주지 못해요.", "311": "이 문장은 X예요. 80은 http의 기본 포트이고, https의 기본 포트는 443이에요.\n포트는 한 컴퓨터 안에서 어떤 프로그램(서비스)으로 보낼지 구분하는 번호라는 뜻이에요. URL에 :port를 생략하면 scheme을 보고 기본 포트를 정해요. http://는 80, https://는 443으로 접속해요.\n그래서 https://shop.com은 https://shop.com:443과 같은 뜻이에요. 개발 중에 쓰는 http://localhost:3000처럼 기본이 아닌 포트를 쓸 때만 :3000을 직접 적어 줘요.", "312": "이 문장은 O예요. 한글처럼 URL에 그대로 쓸 수 없는 글자는 퍼센트 인코딩해서 보내요.\n퍼센트 인코딩이란 글자를 UTF-8 바이트로 바꾼 뒤, 각 바이트를 %와 16진수 두 자리(%XX)로 적는 방식이라는 뜻이에요. 한글 한 글자는 UTF-8로 3바이트라서 '네'는 %EB%84%A4처럼 %XX가 세 개 붙어요.\n예를 들어 ?q=네트워크로 검색하면 실제로는 ?q=%EB%84%A4%ED%8A%B8...처럼 길게 바뀌어 전송돼요. 주소창에 한글로 보이는 건 브라우저가 보기 좋게 다시 풀어 보여 주는 거예요.", "313": "이 문장은 X예요. 도메인은 오른쪽에서 왼쪽으로, 큰 범위에서 작은 범위로 읽어요.\n도메인 끝에는 사실 보이지 않는 점(.)이 있는데 이것이 Root(뿌리)예요. www.inu.ac.kr.은 Root → kr(국가) → ac(학교) → inu(인천대) → www(그 안의 웹 서버) 순서로 점점 좁혀져요.\n우편 주소를 '대한민국 인천시 연수구…'처럼 큰 데서 작은 데로 읽는 것과 같은 원리예요. DNS 리졸버도 이 순서대로 Root, kr TLD, 그다음 권한 서버로 내려가며 물어요.", "314": "이 문장은 O예요. Root 서버 '이름'은 13개지만 실제 서버 기계는 훨씬 많아요.\nRoot 서버는 a.root-servers.net부터 m.root-servers.net까지 13개 이름으로 불려요. 그런데 각 이름 뒤에는 anycast(애니캐스트)로 전 세계 수백 곳에 같은 IP를 가진 복제본이 있어요. anycast는 같은 IP 주소를 여러 장소에 두고, 라우팅이 가장 가까운 곳으로 보내 주는 방식이라는 뜻이에요.\n그래서 한국에서 Root에 물으면 대개 국내나 가까운 곳의 복제본이 답해요. 한 곳이 고장 나도 다른 곳이 받아 줘서 튼튼해요.", "315": "이 문장은 X예요. Root 서버는 모든 도메인의 IP가 아니라 'TLD 서버가 어디 있는지'만 알아요.\nDNS는 정보를 한 곳에 모은 거대한 DB가 아니라 위임(delegation)의 사슬이에요. 위임이란 '이 아래 영역은 저 서버가 책임진다'고 관리 권한을 넘겨주는 것이라는 뜻이에요. Root는 .kr, .com 같은 TLD를 맡은 서버를, TLD는 각 도메인의 권한 서버를 알려 줘요.\n예를 들어 Root에게 www.inu.ac.kr을 물으면 IP 대신 'kr 담당 서버에 물어봐'라는 답만 줘요. 실제 IP는 마지막 권한 서버가 알려 줘요.", "316": "이 문장은 O예요. 리졸버 캐시에 답이 있으면 Root부터 내려가는 탐색을 아예 하지 않아요.\n원래 리졸버는 Root → TLD → 권한 서버를 차례로 물어 여러 번 왕복해야 해요. 하지만 누군가 최근에 같은 이름을 물어서 TTL이 아직 남은 답이 캐시에 있다면, 그 답을 바로 돌려줘요. 그러면 내 PC와 리졸버 사이 한 번 왕복(1 RTT)으로 끝나요. RTT는 요청을 보내고 답이 돌아오기까지의 왕복 시간이라는 뜻이에요.\n인기 사이트일수록 캐시 적중률이 높아서, 대부분의 DNS 조회가 수 ms 안에 끝나는 이유예요.", "317": "이 문장은 X예요. '그런 이름 없음'이라는 답도 캐시돼요.\n이를 Negative Caching(부정 응답 캐싱)이라고 해요. 존재하지 않는 이름을 누가 계속 물어도 권한 서버까지 매번 가지 않도록, NXDOMAIN 응답도 일정 시간 저장해 둬요. 그 시간은 해당 zone의 SOA 레코드에 적힌 negative TTL로 정해져요.\n그래서 새 레코드를 만들기 직전에 그 이름을 한 번 조회해 버리면, 레코드를 만든 뒤에도 한동안 '없음'이 계속 보일 수 있어요. 일반 레코드 TTL과 마찬가지로 기다리면 풀려요.", "318": "이 문장은 O예요. 이전 며칠 전에 TTL을 미리 낮춰 두는 게 좋은 운영 습관이에요.\nTTL이 86400초(하루)라면, IP를 바꾼 뒤에도 최대 하루 동안 옛 답이 곳곳의 캐시에 남아 있어요. 그래서 이전 며칠 전에 TTL을 300초(5분) 정도로 낮춰 두면, 그 사이 기존 캐시들이 짧은 TTL 답으로 교체돼요.\n그 상태에서 IP를 바꾸면 옛 IP로 가는 시간이 몇 분 정도로 줄어요. 단, 낮추는 작업 자체도 기존의 긴 TTL이 지나야 반영되니까 '며칠 전'에 미리 해 둬야 해요. 이전이 끝나면 다시 TTL을 올려요.", "319": "이 문장은 O예요. 'DNS 전파'라는 말은 실제로는 '옛 캐시가 만료되는 시간'을 가리켜요.\n레코드를 바꾸면 권한 서버에는 즉시 반영돼요. 새 값이 전 세계 서버로 밀려 퍼져 나가는(push) 구조가 아니에요. 다만 각지의 리졸버·OS·브라우저가 옛 답을 TTL 동안 들고 있다가, 만료된 뒤 다시 물을 때 비로소 새 값을 받아 가요(pull).\n그래서 TTL이 길면 '48시간 걸린다'처럼 느껴지고, TTL을 미리 짧게 해 두면 몇 분 만에 바뀌어요. 권한 서버를 dig로 직접 조회하면 이미 바뀐 값을 확인할 수 있어요.", "320": "이 문장은 X예요. zone 최상단(apex), 즉 example.com 같은 루트 도메인에는 CNAME을 걸 수 없어요.\nCNAME은 '이 이름은 저 이름의 별명'이라는 레코드인데, 규칙상 CNAME이 있는 이름에는 다른 레코드를 함께 둘 수 없어요. 그런데 zone 최상단에는 반드시 SOA와 NS 레코드가 있어야 해서 CNAME과 충돌해요.\n그래서 www.example.com에는 CNAME으로 CDN을 연결할 수 있지만 example.com에는 못 해요. 이 문제를 풀려고 클라우드 DNS가 ALIAS·ANAME처럼 내부에서 대상 IP를 찾아 A 레코드처럼 답해 주는 확장을 제공해요.", "321": "이 문장은 O예요. MX와 CAA의 역할이 맞게 적혀 있어요.\nMX(Mail eXchanger)는 '이 도메인으로 오는 메일은 어느 메일 서버로 보내라'를 알려 주는 레코드예요. CAA(Certification Authority Authorization)는 '이 도메인의 인증서는 이 CA만 발급할 수 있다'고 지정하는 레코드예요. CA는 인증서를 발급해 주는 인증 기관이라는 뜻이에요.\n예를 들어 CAA에 letsencrypt.org만 적어 두면, 다른 CA는 이 도메인 인증서 발급을 거부해야 해요. 헷갈리는 짝으로, 웹 서버 주소는 A(IPv4)·AAAA(IPv6), 권한 서버는 NS예요.", "322": "이 문장은 X예요. NXDOMAIN과 SERVFAIL의 뜻이 서로 바뀌어 있어요.\nNXDOMAIN(Non-eXistent Domain)은 권한 서버가 확실히 '그런 이름은 없다'고 답한 거예요. SERVFAIL(Server Failure)은 리졸버가 답을 구하는 과정에서 실패했다는 뜻으로, 권한 서버가 응답하지 않거나 DNSSEC 검증이 깨졌을 때 등에 나와요.\n그래서 조사 방향이 달라요. NXDOMAIN이면 도메인 철자나 레코드 등록 여부를 확인하고, SERVFAIL이면 권한 서버 상태나 리졸버 설정을 확인해요. '없음'과 '못 찾음'은 다른 문제예요.", "323": "이 문장은 O예요. aa(Authoritative Answer) 플래그는 권한 서버가 직접 준 답이라는 표시예요.\ndig는 DNS 질의를 직접 보내고 응답을 자세히 보여 주는 명령어라는 뜻이에요. 출력의 flags 줄에서 aa가 있으면 그 도메인의 레코드 원본을 가진 권한 서버가 답한 것이고, 없으면 리졸버가 캐시 등에서 전해 준 답이에요.\n짝으로 나오는 rd(Recursion Desired)는 '재귀로 끝까지 알아와 줘'라는 요청 표시, ra(Recursion Available)는 '이 서버는 재귀를 해 줄 수 있음'이라는 표시예요. dig @ns1.example.com처럼 권한 서버에 직접 물으면 aa를 볼 수 있어요.", "324": "이 문장은 O예요. DoH는 DNS 질의를 HTTPS 안에 넣어 보내서 경로에서 보이지 않게 해요.\n평문 DNS는 보통 UDP 53번 포트로 암호화 없이 오가서, 같은 와이파이나 통신사 경로에 있는 사람이 '이 사람이 어떤 도메인을 묻는지' 볼 수 있어요. DoH(DNS over HTTPS)는 이 질의를 일반 웹 트래픽과 같은 HTTPS(443) 요청으로 감싸 보내요.\n비슷한 짝인 DoT(DNS over TLS)는 TLS로 암호화하지만 853번 전용 포트를 써서, 'DNS 트래픽이구나'라는 건 티가 나요. DoH는 일반 웹 트래픽과 섞여 구분이 더 어려워요.", "325": "이 문장은 X예요. DNS Round Robin은 서버가 살아 있는지 확인하지 않아요.\nRound Robin은 한 이름에 IP를 여러 개 등록해 두고, 질의가 올 때마다 순서를 돌려 가며 나눠 주는 단순한 분산 방식이라는 뜻이에요. 서버 상태를 모르기 때문에 한 서버가 죽어도 그 IP를 계속 나눠 줘서, 일부 사용자는 접속에 실패해요.\n죽은 서버를 빼려면 Failover가 필요해요. Failover는 헬스체크(주기적으로 서버에 요청해 살아 있는지 확인)를 하다가 실패하면 그 IP를 레코드에서 빼거나 대체 IP로 바꾸는 방식이에요.", "326": "이 문장은 O예요. hosts 파일은 DNS 서버에 묻기 전에 먼저 확인하는 로컬 고정 표예요.\nhosts 파일은 '이 이름은 이 IP'를 직접 적어 두는 텍스트 파일로, 여기 적힌 이름은 DNS 서버에 묻지 않고 바로 그 IP를 써요. Windows는 C:\\Windows\\System32\\drivers\\etc\\hosts, macOS·Linux는 /etc/hosts에 있어요.\n예를 들어 '127.0.0.1 shop.test'를 적어 두면 shop.test가 내 컴퓨터로 연결돼서, 개발할 때 실제 도메인처럼 테스트할 수 있어요. 반대로 잘못된 줄이 남아 있으면 나만 엉뚱한 서버로 가는 원인이 되기도 해요.", "327": "이 문장은 X예요. HTTP는 상태 유지(stateful)가 아니라 무상태(stateless) 프로토콜이에요.\n무상태란 서버가 이전 요청 내용을 기억하지 않고, 매 요청을 처음 보는 요청처럼 독립적으로 처리한다는 뜻이에요. 그래서 '방금 로그인한 그 사람'이라는 걸 서버가 알려면, 요청마다 스스로 신분을 증명할 정보를 담아 와야 해요.\n그 역할을 하는 게 쿠키(세션 ID)나 토큰(Authorization 헤더)이에요. 비유하면 매번 처음 보는 직원에게 회원증을 보여 주는 것과 같아요. 무상태 덕분에 서버를 여러 대로 늘리기 쉬워요.", "328": "이 문장은 O예요. HTTP는 항상 클라이언트가 먼저 요청하고 서버가 응답하는 구조예요.\n이를 요청-응답 모델이라고 해요. 서버는 아무리 새 소식이 생겨도 요청이 오기 전에는 먼저 보낼 방법이 없어요. 그래서 채팅·알림처럼 서버가 먼저 알려야 하는 기능에는 다른 방식이 필요해요.\nWebSocket은 처음에 HTTP로 연결을 연 뒤 양방향 통신 채널로 바꿔 쓰는 방식이고, SSE(Server-Sent Events)는 서버→클라이언트 한 방향으로 계속 이벤트를 흘려 보내는 방식이에요. 단방향 알림이면 SSE, 양방향 채팅이면 WebSocket이 잘 맞아요.", "329": "이 문장은 O예요. HTTP/1.1에서 Host 헤더는 꼭 넣어야 하는 필수 헤더예요.\n가상 호스팅(virtual hosting)은 IP 주소 하나인 서버 한 대에 여러 웹사이트를 올려 두는 방식이라는 뜻이에요. IP만으로는 어느 사이트를 원하는지 알 수 없으니, 요청에 'Host: shop.com'처럼 적어서 서버가 사이트를 골라 응답해요.\nURL의 host는 이렇게 세 번 쓰여요. DNS에서는 IP를 찾는 질문으로, TLS에서는 SNI로 '어느 인증서를 줄지' 고르는 데, HTTP에서는 Host 헤더로 '어느 사이트 내용을 줄지' 고르는 데 써요.", "330": "이 문장은 O예요. 마지막 빈 줄이 없으면 서버는 헤더가 끝났는지 알 수 없어요.\n서버는 \\r\\n\\r\\n(빈 줄)을 만나야 '헤더가 끝났구나' 하고 요청을 처리해요. 소켓으로 직접 'GET / HTTP/1.1\\r\\nHost: example.com\\r\\n'까지만 보내면, 서버는 헤더가 더 올 거라 생각하고 계속 기다려요. 클라이언트도 응답을 기다리니 둘 다 멈춘 것처럼 보여요.\n또 줄 끝을 \\r\\n 대신 \\n만 쓰는 실수도 흔해요. 관대한 서버는 받아 주지만 엄격한 서버는 형식 오류로 처리해요. 실습 때는 끝에 \\r\\n\\r\\n이 있는지 꼭 확인해요.", "331": "이 문장은 X예요. HTTP/2에서는 'OK' 같은 Reason phrase를 보내지 않아요.\nReason phrase는 HTTP/1.1 상태줄 'HTTP/1.1 200 OK'에서 숫자 뒤에 붙는 사람용 설명 문구라는 뜻이에요. 프로그램은 어차피 200이라는 숫자만 보고 판단하니, HTTP/2는 이를 없애고 :status: 200이라는 특별한 헤더로 숫자만 보내요.\n또 HTTP/2는 헤더 이름을 모두 소문자로 보내요(Content-Type → content-type). DevTools에서 HTTP/2 응답을 보면 'OK' 문구가 없는 이유가 이거예요.", "332": "이 문장은 X예요. 삭제·결제처럼 상태를 바꾸는 동작은 GET으로 만들면 안 돼요.\n안전(safe)하다는 건 서버 상태를 바꾸지 않는 '읽기 전용'이라는 뜻이에요. GET은 원래 안전한 메서드로 약속돼 있어서, 브라우저 프리페치(미리 불러오기), 검색엔진 크롤러, 캐시가 사용자 의도 없이 마음대로 호출해도 괜찮다고 믿어요.\n그런데 GET /delete?id=3 같은 링크를 만들면 크롤러가 지나가기만 해도 글이 지워질 수 있어요. 그래서 삭제는 DELETE, 결제·주문은 POST처럼 의미에 맞는 메서드를 써야 해요.", "333": "이 문장은 O예요. 멱등은 '응답'이 같다는 게 아니라 '서버 상태'가 같다는 뜻이라는 점이 핵심이에요.\nDELETE /posts/3을 처음 보내면 글이 지워지고 200이나 204가 와요. 두 번째로 보내면 이미 없으니 404가 와요. 응답 코드는 달라졌지만 '3번 글이 없다'는 서버 상태는 똑같아요.\n그래서 DELETE는 멱등이에요. 반대로 POST /orders는 두 번 보내면 주문이 두 개가 되어 서버 상태 자체가 달라지니 멱등이 아니에요. 멱등 여부는 '여러 번 해도 결과 세상이 같은가'로 판단해요.", "334": "이 문장은 O예요. Idempotency-Key는 POST 재시도를 안전하게 만드는 장치예요.\nIdempotency-Key는 클라이언트가 요청마다 붙이는 고유한 값(예: UUID)으로, '이 요청은 이 번호의 그 요청이에요'라는 표시라는 뜻이에요. 서버는 처음 처리할 때 키와 결과를 저장해 두고, 같은 키로 다시 오면 새로 처리하지 않고 저장된 결과만 돌려줘요.\n예를 들어 주문 POST의 응답이 네트워크에서 사라져 앱이 재시도해도, 키가 같으니 주문은 하나만 생기고 같은 주문번호를 받아요. 결제 API들이 이 방식을 널리 써요.", "335": "이 문장은 X예요. 4xx는 요청 자체가 잘못된 거라 그대로 다시 보내면 또 실패해요.\n4xx는 클라이언트 오류로, 주소가 틀렸거나(404), 인증이 없거나(401), 형식이 잘못된(400) 경우예요. 요청을 고치지 않으면 몇 번을 보내도 결과가 같아요. 반면 5xx는 서버 쪽 일시적 문제(과부하, 뒷단 장애 등)일 수 있어서 잠시 후 재시도하면 성공하기도 해요.\n단 5xx라도 재시도는 멱등 요청(GET·PUT·DELETE)이나 Idempotency-Key가 있는 경우에만 안전해요. 예외로 429 Too Many Requests는 4xx지만 기다렸다 다시 보내라는 뜻이에요.", "336": "이 문장은 O예요. 상태 코드는 HTTP 응답에 들어 있으니, 그걸 받았다면 그 아래 단계는 모두 통과한 거예요.\n순서를 보면 DNS로 IP를 찾고, TCP로 연결을 맺고, HTTPS라면 TLS 핸드셰이크까지 끝난 뒤에야 HTTP 요청을 보내고 응답을 받을 수 있어요. 그러니 404나 500이 보였다는 건 네트워크 길은 뚫려 있고 상대가 '대답'까지 했다는 뜻이에요.\n그래서 404·500을 보고 DNS나 방화벽을 의심할 필요는 없어요. 반대로 '연결 거부'나 'DNS_PROBE' 같은 오류처럼 상태 코드 자체가 없을 때가 네트워크 단계의 문제예요.", "337": "이 문장은 X예요. 401과 403의 뜻이 서로 바뀌어 있어요.\n401 Unauthorized는 이름과 달리 '당신이 누구인지 모르겠다'는 뜻으로, 인증(authentication)이 안 된 상태예요. 토큰이 없거나 만료됐을 때 나오고, 다시 로그인하면 해결될 수 있어요. 403 Forbidden은 '누군지는 알지만 이 자원에 대한 권한이 없다'는 뜻으로, 인가(authorization)에서 막힌 거예요.\n예를 들어 로그인 안 하고 마이페이지에 가면 401, 일반 회원으로 로그인해서 관리자 페이지에 가면 403이에요. 403은 다시 로그인해도 해결되지 않아요.", "338": "이 문장은 O예요. 504는 프록시가 뒷단 서버의 답을 기다리다 시간 초과해서 만든 응답이에요.\n게이트웨이(gateway)·프록시는 사용자와 앱 서버 사이에서 요청을 대신 전달해 주는 중간 서버라는 뜻이에요. 프록시는 뒷단에 요청을 넘기고 정해진 시간(예: 60초)까지 기다리는데, 그 안에 답이 안 오면 포기하고 504를 사용자에게 보내요.\n502와 비교하면, 502는 뒷단 연결 자체가 실패하거나 이상한 응답을 받은 것이고, 504는 연결은 됐는데 너무 느린 거예요. 그래서 504면 느린 DB 쿼리나 무거운 처리부터 의심해요.", "339": "이 문장은 O예요. 304는 '내용이 바뀌지 않았으니 갖고 있는 캐시를 그대로 써'라는 응답이라 본문이 없어요.\n브라우저는 캐시한 파일의 ETag(파일 내용의 지문 같은 버전 값)를 기억해 뒀다가, 다시 요청할 때 If-None-Match: \"abc123\"처럼 보내요. 서버는 현재 ETag와 비교해서 같으면 본문 없이 304만, 다르면 200과 새 본문을 보내요.\n이렇게 확인만 하는 요청을 '조건부 요청'이라고 해요. 1MB 이미지라도 바뀌지 않았다면 짧은 304 응답만 오가서 전송량이 크게 줄어요.", "340": "이 문장은 X예요. 저장 자체를 막는 건 no-store이고, no-cache는 저장은 허용해요.\nno-cache는 이름 때문에 헷갈리는데, '캐시에 저장은 해도 되지만 쓰기 전에 매번 서버에 아직 유효한지 확인(재검증)하라'는 뜻이에요. 그래서 바뀌지 않았으면 304를 받아 저장본을 그대로 써요.\nno-store는 '어디에도 저장하지 마라'는 뜻이라 매번 전체를 새로 받아요. 은행 계좌 화면처럼 민감한 정보는 no-store, 자주 바뀔 수 있지만 매번 다 받기는 아까운 HTML은 no-cache가 어울려요.", "341": "이 문장은 O예요. HttpOnly 쿠키는 document.cookie 같은 JavaScript로 읽을 수 없어요.\n이 속성의 목적은 XSS(사이트에 악성 스크립트를 몰래 심는 공격)가 생겨도 로그인 세션 쿠키를 훔쳐 가지 못하게 하는 거예요. 쿠키는 브라우저가 요청에 자동으로 붙여 보내기만 하고, 스크립트에는 보이지 않아요.\n짝으로 함께 나오는 속성도 구분해 두면 좋아요. Secure는 HTTPS 연결에서만 쿠키를 보내라는 뜻이고, SameSite는 다른 사이트에서 시작된 요청에 쿠키를 붙일지 제한해서 CSRF를 막는 속성이에요.", "342": "이 문장은 X예요. 강제 로그아웃은 오히려 세션 쿠키 방식이 더 쉬워요.\n세션 방식은 서버가 세션 저장소에 '이 세션 ID는 이 사용자'를 기록해 두고, 요청마다 그 기록을 확인해요. 그래서 서버에서 그 기록만 지우면 다음 요청부터 바로 끊겨요. JWT는 사용자 정보와 서명을 토큰 안에 담아 서버가 따로 저장하지 않는 방식이라, 서명만 맞으면 만료 시각 전까지 계속 유효해요.\n그래서 JWT는 만료를 15분처럼 짧게 하고, 새 토큰은 서버가 관리하는 refresh 토큰으로 받게 해서 이 약점을 보완해요. 블랙리스트를 두는 방법도 있지만 그러면 무상태 장점이 줄어요.", "343": "이 문장은 O예요. Content-Length는 본문이 어디서 끝나는지 알려 주는 값이라 틀리면 경계가 깨져요.\nContent-Length는 본문의 바이트 수라는 뜻이에요. 받는 쪽은 빈 줄 뒤부터 이 숫자만큼 읽고 '끝'이라고 판단해요. 실제보다 작게 적으면 본문 뒤쪽이 잘리고, 크게 적으면 오지 않을 나머지 바이트를 하염없이 기다려요.\n특히 한글은 UTF-8로 한 글자가 3바이트라서, 글자 수로 Content-Length를 계산하면 틀리기 쉬워요. 길이를 미리 모를 때는 Content-Length 대신 Transfer-Encoding: chunked를 써요.", "344": "이 문장은 O예요. 전체 길이를 미리 모를 때는 chunked 방식으로 조각내어 보내요.\nchunked 전송은 본문을 여러 조각(chunk)으로 나누고, 각 조각 앞에 그 조각의 크기를 16진수로 적어 보내는 방식이라는 뜻이에요. 미리 Content-Length를 정할 수 없어도 되고, 크기가 0인 조각이 오면 '이제 끝'이라는 신호예요.\n예를 들어 LLM 챗봇이 답을 생성하면서 글자를 조금씩 흘려 보내거나, 큰 검색 결과를 만들면서 바로바로 내보낼 때 써요. 참고로 HTTP/2부터는 프레임 구조가 있어서 chunked 헤더를 쓰지 않아요.", "345": "이 문장은 O예요. HTTP/1.1 시절 브라우저는 한 호스트에 연결을 보통 6개까지 열었어요.\nHTTP/1.1의 한 연결에서는 응답이 요청 순서대로만 나와서, 앞 응답이 늦으면 뒤 응답도 기다려야 했어요. 이걸 피하려고 브라우저는 같은 서버에 TCP 연결을 여러 개 열어 동시에 내려받았어요. 대부분의 브라우저가 호스트당 6개로 제한했어요.\n하지만 연결마다 TCP·TLS 핸드셰이크 비용이 들고 서버 자원도 많이 써요. 그래서 HTTP/2는 연결 하나에 여러 스트림을 섞는 다중화로 이 문제를 근본적으로 해결했어요.", "346": "이 문장은 X예요. HTTP/2에서는 도메인 샤딩과 파일 합치기가 오히려 역효과를 낼 수 있어요.\n도메인 샤딩은 img1.shop.com, img2.shop.com처럼 도메인을 쪼개서 '호스트당 6개' 제한을 우회하던 꼼수라는 뜻이에요. 파일 합치기는 요청 수를 줄이려고 CSS·JS를 큰 파일 하나로 묶는 거예요. 둘 다 HTTP/1.1의 연결 제한 때문에 쓰던 방법이에요.\nHTTP/2는 연결 1개에 스트림 N개를 섞어 보내서 요청 수가 많아도 부담이 적어요. 샤딩하면 연결이 여러 개로 갈라져 다중화와 압축 이점을 잃고, 큰 합본 파일은 일부만 바뀌어도 캐시 전체를 버리게 돼요.", "347": "이 문장은 O예요. HTTP/2를 쓸지는 TLS 핸드셰이크 안의 ALPN에서 정해요.\nALPN(Application-Layer Protocol Negotiation)은 TLS 연결을 맺는 동안 '이 연결 위에서 어떤 애플리케이션 프로토콜을 쓸지' 정하는 확장이라는 뜻이에요. 클라이언트가 ClientHello에 'h2, http/1.1 가능해요'라고 보내면, 서버가 그중 'h2'를 골라 답해요.\n이렇게 TLS 협상에 끼워 넣어서 추가 왕복 없이 정할 수 있어요. 브라우저들은 평문 HTTP/2(h2c)를 지원하지 않아서, 사실상 HTTPS에서만 HTTP/2를 쓰게 돼요.", "348": "이 문장은 X예요. HTTP/3는 보통 첫 접속부터 바로 쓰지 않아요.\n브라우저는 처음엔 서버가 UDP 기반 QUIC를 지원하는지 몰라서, 먼저 TCP 443으로 HTTP/2(또는 1.1) 연결을 맺어요. 서버가 응답에 Alt-Svc: h3=\":443\" 헤더를 붙여 'HTTP/3도 돼요'라고 광고하면, 브라우저가 이를 기억했다가 다음 연결부터 UDP 443으로 HTTP/3를 시도해요. Alt-Svc는 '다른 방식으로도 접속할 수 있다'는 대체 서비스 안내라는 뜻이에요.\n그래서 DevTools로 보면 첫 요청은 h2, 새로고침 후 요청은 h3로 찍히는 경우가 많아요.", "349": "이 문장은 O예요. UDP 443이 막혀 있으면 브라우저는 오류를 띄우지 않고 HTTP/2로 되돌아가요.\nHTTP/3는 TCP가 아닌 UDP 위의 QUIC를 써요. 그런데 회사·학교 방화벽 중에는 웹은 TCP 443만 열고 UDP 443은 막는 곳이 많아요. 브라우저는 QUIC 연결이 안 되면 사용자에게 알리지 않고 TCP 기반 HTTP/2로 조용히 폴백(fallback, 대체 경로로 물러남)해요.\n그래서 서비스는 잘 열리는데 '우리 서비스만 h3가 안 잡힌다'면 서버 설정보다 먼저 중간 경로에서 UDP 443이 막혀 있는지 확인해요.", "350": "이 문장은 X예요. HTTPS가 보호하는 건 데이터가 오가는 '전송 구간'뿐이에요.\nHTTPS는 브라우저와 서버 사이 도로를 암호화된 터널로 감싸서, 중간에서 엿보거나 바꾸지 못하게 해요. 하지만 터널의 양 끝인 서버와 브라우저에 도착하면 데이터는 다시 평문으로 풀려요. 서버 DB에 저장된 비밀번호나 개인정보는 HTTPS와 상관이 없어요.\n비유하면 HTTPS는 현금 수송차라서 이동 중엔 안전하지만, 은행 금고 안 보안은 따로 챙겨야 해요. 그래서 저장 데이터는 비밀번호 해시, DB 암호화, 접근 권한 관리로 따로 보호해요.", "351": "이 문장은 O예요. URL은 암호화와 별개로 여러 곳에 기록되기 쉬워서, 토큰을 쿼리에 넣으면 위험해요.\n경로상에서는 HTTPS 덕분에 쿼리가 숨겨지지만, 터널의 끝에서는 URL 전체가 서버 접근 로그에 그대로 남아요. 브라우저 방문 기록·북마크에도 저장되고, 다른 사이트로 링크를 타고 이동할 때 Referer 헤더로 이전 페이지 URL이 전달될 수도 있어요. Referer는 '어느 페이지에서 왔는지' 알려 주는 헤더라는 뜻이에요.\n그래서 ?token=abc 대신 Authorization 헤더나 POST 본문에 비밀 값을 담아 보내요.", "352": "이 문장은 X예요. 실제 HTTP 데이터는 공개키 암호가 아니라 대칭키 암호로 암호화해요.\n대칭키 암호는 잠그는 열쇠와 여는 열쇠가 같은 방식으로, AES나 ChaCha20처럼 매우 빨라서 많은 데이터를 처리하기 좋아요. 공개키 암호(RSA·ECDSA 등)는 열쇠가 공개키·개인키 한 쌍인 방식인데 계산이 훨씬 느려서, TLS에서는 '상대가 진짜인지' 서명으로 확인하고 키 교환을 돕는 데만 써요.\n정리하면 핸드셰이크에서 공개키·서명으로 신원을 확인하고 ECDHE로 대칭 세션 키를 만든 뒤, 실제 데이터는 그 세션 키로 빠르게 잠가요.", "353": "이 문장은 O예요. Forward Secrecy(전방 비밀성)는 미래에 개인키가 털려도 과거 대화는 안전하게 지켜 주는 성질이에요.\n예전 RSA 키 교환은 서버 공개키로 세션 키를 감싸 보냈어서, 누군가 트래픽을 녹화해 뒀다가 나중에 서버 개인키를 얻으면 과거 세션 키를 모두 풀 수 있었어요. ECDHE는 연결마다 일회용 키 쌍을 새로 만들어 세션 키를 계산하고, 끝나면 버려요.\n서버의 장기 개인키는 '내가 진짜'라는 서명에만 쓰여서, 그 키가 유출돼도 과거 세션 키를 다시 계산할 수 없어요. TLS 1.3은 ECDHE 같은 방식만 허용해 이를 필수로 만들었어요.", "354": "이 문장은 O예요. 브라우저가 믿는 건 서버가 아니라, 그 서버를 보증해 준 CA들의 신뢰 체인이에요.\nCA(Certificate Authority)는 '이 공개키는 이 도메인 주인의 것'이라고 서명해 보증하는 인증 기관이라는 뜻이에요. 서버 인증서(Leaf)는 중간 CA(Intermediate)가 서명하고, 중간 CA 인증서는 Root CA가 서명해요. 브라우저는 이 서명을 거꾸로 따라 올라가요.\n마지막에 OS나 브라우저에 미리 설치된 Root CA 목록에 닿으면 믿고, 닿지 않으면 경고를 띄워요. 비유하면 처음 보는 사람이라도 내가 믿는 기관이 발급한 신분증을 보여 주면 믿는 것과 같아요.", "355": "이 문장은 O예요. 인증서 유효기간 검사는 내 PC의 현재 시각을 기준으로 해서, 시계가 틀리면 멀쩡한 인증서도 실패해요.\n인증서에는 '이 날짜부터 이 날짜까지 유효'라는 notBefore·notAfter 값이 적혀 있어요. 브라우저는 내 컴퓨터 시계를 보고 지금이 그 기간 안인지 확인해요.\n예를 들어 CMOS 배터리가 나가서 PC 시계가 2015년으로 돌아가 있으면, 2026년에 발급된 인증서는 '아직 유효 기간 전'으로 보여 ERR_CERT_DATE_INVALID가 떠요. 여러 사이트에서 동시에 이 오류가 나면 서버보다 내 PC 시계를 먼저 확인해요.", "356": "이 문장은 O예요. Intermediate 인증서가 빠진 서버는 브라우저에서는 되고 curl·Python에서만 실패하는 일이 흔해요.\n서버는 원래 자기 인증서(Leaf)와 중간 CA 인증서를 함께 보내야 해요. 이 묶음을 fullchain이라고 해요. 브라우저는 빠진 중간 인증서를 예전 방문에서 캐시해 뒀거나, 인증서에 적힌 주소에서 알아서 내려받아(AIA fetching) 체인을 채우는 경우가 많아요.\n반면 curl이나 Python requests는 그런 보정을 하지 않아서 체인이 끊기고, CERTIFICATE_VERIFY_FAILED 오류를 내요. 그래서 '브라우저는 되는데 스크립트만 안 된다'면 서버의 fullchain 설정부터 확인해요.", "357": "이 문장은 X예요. 2 RTT가 드는 건 TLS 1.2이고, TLS 1.3은 1 RTT로 줄였어요.\nTLS 1.2는 먼저 어떤 암호 방식을 쓸지 왕복으로 정한 뒤, 다시 한 번 왕복하며 키를 교환해서 2 RTT가 걸렸어요. TLS 1.3은 클라이언트가 '서버가 아마 이 방식을 고를 것'이라 예상하고 ClientHello에 key_share(키 교환용 공개값)를 미리 실어 보내요.\n서버는 그걸 받자마자 세션 키를 계산하고 답할 수 있어서 한 번 왕복으로 끝나요. RTT가 150ms인 해외 서버라면 이것만으로 연결 시간이 150ms 줄어요.", "358": "이 문장은 O예요. 0-RTT 데이터는 공격자가 복사해 다시 보내는 재전송(replay) 공격에 약해서 멱등 요청만 실어야 해요.\n0-RTT는 예전에 접속한 적 있는 서버에 다시 연결할 때, 핸드셰이크가 끝나기도 전에 첫 패킷에 요청 데이터를 바로 실어 보내는 기능이라는 뜻이에요. 빠르지만, 이 첫 데이터는 매번 새로운 값으로 보호되지 않아서 도청자가 그대로 복사해 다시 보내도 서버가 구분하지 못해요.\n그래서 GET처럼 여러 번 와도 상관없는 요청만 0-RTT로 보내고, 결제 POST처럼 두 번 실행되면 안 되는 요청은 핸드셰이크가 끝난 뒤 보내요.", "359": "이 문장은 O예요. 새 연결마다 DNS, TCP, TLS, 요청 왕복이 차례로 쌓여서 약 470ms가 돼요.\n계산해 보면 DNS 조회 약 20ms, TCP 3-way 핸드셰이크 1 RTT(150ms), TLS 1.3 핸드셰이크 1 RTT(150ms), 그리고 HTTP 요청을 보내고 첫 바이트를 받는 1 RTT(150ms)를 더해 470ms예요. 여기에 서버 처리 시간(α)이 더해져요.\n연결을 재사용(Keep-Alive)하면 DNS·TCP·TLS가 생략돼서 요청 왕복 150ms + α만 남아요. 그래서 해외 서버일수록 연결 재사용과 가까운 CDN이 체감 속도를 크게 바꿔요.", "360": "이 문장은 X예요. curl -w의 시간 값들은 구간별 시간이 아니라 '요청 시작부터 그 시점까지'의 누적 시간이에요.\ncurl -w는 요청이 끝난 뒤 지정한 시간 정보를 출력하는 옵션이에요. time_namelookup은 DNS가 끝난 시점, time_connect는 TCP 연결이 끝난 시점, time_appconnect는 TLS까지 끝난 시점, time_starttransfer는 첫 바이트를 받은 시점까지 걸린 시간이에요.\n그래서 각 구간 시간은 빼서 구해요. 예를 들어 time_connect가 0.170, time_appconnect가 0.320이면 TLS 핸드셰이크는 0.150초 걸린 거예요.", "361": "이 문장은 X예요. requests는 404나 500을 받아도 예외를 던지지 않아요.\nrequests 입장에서는 서버에서 HTTP 응답이 정상적으로 왔으니 통신은 성공한 거예요. 그래서 r.status_code가 404여도 그냥 Response 객체를 돌려주고, 코드는 오류 없이 다음 줄로 넘어가요. 예외는 연결 실패나 타임아웃처럼 응답 자체를 못 받았을 때만 나요.\n4xx·5xx를 오류로 처리하려면 r.raise_for_status()를 직접 불러야 HTTPError가 발생해요. 이걸 빠뜨리면 404 에러 페이지 HTML을 정상 데이터로 착각해 파싱하다 엉뚱한 곳에서 터지기 쉬워요.", "362": "이 문장은 X예요. CORS 오류는 서버가 응답을 안 보낸 게 아니라, 브라우저가 그 응답을 페이지에 넘겨주지 않은 거예요.\nCORS(Cross-Origin Resource Sharing)는 다른 출처의 응답을 JavaScript가 읽어도 되는지 서버가 헤더로 허락하는 규칙이라는 뜻이에요. 서버는 이미 응답을 보냈는데, 거기에 Access-Control-Allow-Origin 같은 허락 헤더가 없거나 맞지 않으면 브라우저가 스크립트에 결과를 숨겨요.\n그래서 같은 요청을 curl로 보내면 잘 되는 경우가 많아요. 고칠 곳은 브라우저가 아니라 서버의 CORS 응답 헤더예요.", "363": "이 문장은 O예요. DNS·Initial connection·SSL 칸이 사라졌다는 건 새 연결을 맺지 않고 기존 연결을 다시 썼다는 뜻이에요.\n첫 요청은 이름 조회, TCP 연결, TLS 핸드셰이크를 모두 거치니 Timing에 세 칸이 다 보여요. 하지만 Keep-Alive로 연결이 유지되면 두 번째 요청부터는 이미 열린 연결로 바로 요청을 보내서, Waiting(TTFB)과 Content Download만 남아요. Keep-Alive는 응답 후에도 연결을 끊지 않고 이어 쓰는 기능이라는 뜻이에요.\n만약 요청마다 세 칸이 계속 나타나면, 서버나 프록시가 Connection: close로 연결을 매번 끊고 있지 않은지 확인해요.", "364": "이 문장은 O예요. URL의 host 하나가 DNS, TLS, HTTP 세 단계에서 각각 다른 용도로 쓰여요.\nDNS에서는 'shop.com의 IP가 뭐야?'라는 질문에, TLS에서는 ClientHello의 SNI로 '어느 도메인 인증서를 줄래?'에, HTTP에서는 Host 헤더로 '이 서버의 여러 사이트 중 어느 사이트?'에 쓰여요.\n보이는 정도도 달라요. 평문 DNS 질의와 SNI는 암호화 전이라 경로에서 보이지만, Host 헤더는 TLS 터널 안에 있어서 보이지 않아요. 그래서 HTTPS를 써도 접속 도메인은 노출될 수 있어요.", "365": "이 문장은 X예요. 브라우저가 가장 먼저 확인하는 곳은 hosts 파일이 아니라 자기 자신의 캐시예요.\n강의의 조회 순서는 브라우저 DNS 캐시 → OS DNS 캐시 → hosts 파일 → Stub Resolver가 외부 리졸버에게 질문이에요. 가까운 곳부터 확인해서 답이 있으면 바로 쓰고, 없을 때만 다음 단계로 가요. Stub Resolver는 OS 안에서 DNS 질문을 대신 보내 주는 작은 프로그램이라는 뜻이에요.\n그래서 hosts 파일을 고쳤는데 바로 반영이 안 된다면, 브라우저나 OS 캐시에 옛 답이 남아 있기 때문일 수 있어요. 브라우저를 다시 열거나 OS DNS 캐시를 비우면 돼요.", "366": "이 문장은 O예요. Stub Resolver는 직접 탐색하지 않고 리졸버에게 재귀 질의로 통째로 맡겨요.\nStub Resolver는 내 PC의 OS 안에 있는 아주 작은 DNS 클라이언트라는 뜻이에요. 'stub'은 '토막, 작은 대리인'이라는 뜻으로, Root부터 찾아 내려가는 능력은 없고 설정된 리졸버(통신사 DNS, 8.8.8.8 등)에게 '끝까지 알아와 줘'라고 부탁만 해요.\n실제로 Root → TLD → 권한 서버를 도는 무거운 일은 풀 리졸버(재귀 리졸버)가 해요. 비유하면 Stub Resolver는 접수 창구, 리졸버는 실제로 뛰어다니며 알아오는 담당 직원이에요.", "367": "이 문장은 O예요. 리졸버는 '받을 때는 재귀, 찾을 때는 반복'이라는 두 얼굴을 가져요.\n클라이언트 쪽에서 보면 리졸버는 '끝까지 알아와 줄게'라는 재귀 질의를 받아 최종 답만 돌려줘요. 직접 답을 찾을 때는 Root에게 묻고 'kr 서버에 물어봐'라는 안내를 받고, kr 서버에 묻고 다시 안내를 받는 식으로 반복 질의를 해요.\n이렇게 얻은 최종 답과 중간 안내(TLD·NS 위치)는 각각의 TTL만큼 캐시해 둬요. 그래서 다음 사람이 같은 이름이나 같은 TLD 아래 이름을 물으면 훨씬 빨리 답할 수 있어요.", "368": "이 문장은 O예요. TLD 서버는 최상위 도메인을 담당하고, 그 아래 도메인의 권한 서버 위치를 알려 줘요.\nTLD(Top-Level Domain)는 도메인 맨 오른쪽 부분, 예를 들어 .com, .org, .kr 같은 최상위 영역이라는 뜻이에요. .kr TLD 서버에게 inu.ac.kr을 물으면 IP를 바로 주지 않고 'inu.ac.kr은 이 NS 서버들이 담당해요'라고 다음 단계를 알려 줘요.\n이렇게 Root는 TLD를, TLD는 권한 서버를 가리키며 책임을 아래로 넘겨주는 걸 위임이라고 해요. 최종 IP는 권한 서버에서만 나와요.", "369": "이 문장은 O예요. 권한 서버는 그 도메인 레코드의 '원본'을 갖고 있어서 최종 답을 줘요.\n권한(Authoritative) 서버는 도메인 주인이 레코드를 등록해 두는 서버라는 뜻이에요. 가비아·Cloudflare·Route 53 같은 DNS 서비스에서 A 레코드를 추가하면, 그 서비스의 권한 서버에 저장돼요. 리졸버가 가진 건 이 원본을 잠시 빌려 둔 캐시 사본이에요.\n그래서 dig로 권한 서버에 직접 물으면 응답에 aa 플래그가 붙고, 레코드를 방금 바꿨어도 바로 새 값이 나와요. 캐시 때문에 헷갈릴 때 원본을 확인하는 방법이에요.", "370": "이 문장은 X예요. AAAA는 메일 서버가 아니라 IPv6 주소를 알려 주는 레코드예요.\nA 레코드가 이름을 IPv4 주소(예: 203.0.113.5)로 바꿔 준다면, AAAA는 이름을 IPv6 주소(예: 2001:db8::1)로 바꿔 줘요. IPv6 주소가 IPv4(32비트)보다 4배 긴 128비트라서 A를 네 번 쓴 AAAA라는 이름이 붙었어요.\n메일 서버를 알려 주는 건 MX 레코드예요. 예를 들어 example.com의 MX가 mail.example.com을 가리키고, mail.example.com의 A·AAAA 레코드가 그 메일 서버의 실제 IP를 알려 줘요.", "371": "이 문장은 O예요. GeoDNS는 질문한 쪽의 위치를 보고 가까운 서버의 IP를 골라 줘요.\n권한 서버가 보는 질문자는 사용자 본인이 아니라 사용자의 리졸버예요. 그래서 기본적으로 리졸버 IP의 위치를 기준으로 판단해요. ECS(EDNS Client Subnet)는 리졸버가 '실제 사용자는 이 대역에 있어요'라는 서브넷 정보를 질의에 함께 실어 보내는 확장이라는 뜻이에요.\n그래서 서울 사용자가 cdn.shop.com을 물으면 서울 엣지 IP를, 도쿄 사용자는 도쿄 엣지 IP를 받아요. 다만 해외 공용 DNS를 쓰고 ECS가 없으면 엉뚱한 지역 서버로 갈 수도 있어요.", "372": "이 문장은 O예요. CDN은 콘텐츠를 사용자 가까이에 복제해 두는 방식으로 RTT를 줄여요.\nCDN(Content Delivery Network)은 전 세계 곳곳에 엣지 서버를 두고, 원본 서버의 이미지·JS·영상 같은 콘텐츠를 복사해 두는 네트워크라는 뜻이에요. 엣지 서버는 사용자와 가까운 끝단 서버라는 뜻이에요.\n데이터는 빛의 속도보다 빨리 갈 수 없어서, 서울에서 미국 원본까지는 아무리 좋은 장비로도 왕복 150ms 정도 걸려요. 하지만 서울 엣지에서 받으면 수 ms면 돼요. 속도를 높일 수 없으니 거리를 줄이는 전략이에요.", "373": "이 문장은 O예요. CNAME은 별명 레코드라서, 리졸버는 진짜 이름에 닿을 때까지 따라가요.\nCNAME(Canonical Name)은 'www.shop.com은 사실 shop.cdn.net의 다른 이름이에요'라고 알려 주는 레코드라는 뜻이에요. 리졸버는 www.shop.com을 물었다가 CNAME을 받으면, 다시 shop.cdn.net의 A 레코드를 찾아서 최종 IP를 돌려줘요.\nCDN 연결에 많이 쓰는 이유는 CDN 업체가 엣지 서버 IP를 수시로 바꿔도 내 도메인 설정은 고칠 필요가 없기 때문이에요. A 레코드가 IP를 직접 적는 거라면, CNAME은 '저 이름을 따라가'라고 위임하는 거예요.", "374": "이 문장은 O예요. HTTP 요청의 첫 줄은 메서드, 경로, 버전 세 부분으로 이루어져요.\n예를 들어 'GET /mug?color=red HTTP/1.1'에서 GET은 무엇을 할지(메서드), /mug?color=red는 어떤 자원을 원하는지(경로와 쿼리), HTTP/1.1은 어떤 버전 규칙으로 말하는지를 뜻해요. 이 줄을 시작줄(request line)이라고 해요.\n헷갈리기 쉬운 짝은 응답의 시작줄이에요. 응답은 'HTTP/1.1 200 OK'처럼 버전, 상태 코드, 이유 문구 순서예요. 요청은 '무엇을 해 달라', 응답은 '결과가 어떻다'를 첫 줄에 적는 셈이에요.", "375": "이 문장은 O예요. 헤더 한 줄은 \\r\\n으로 끝나고, \\r\\n이 연달아 두 번 오면 헤더가 끝나요.\nCRLF는 Carriage Return(\\r, 커서를 줄 맨 앞으로)과 Line Feed(\\n, 다음 줄로)라는 두 제어 문자라는 뜻이에요. 타자기 시절의 줄바꿈 동작에서 온 것으로, HTTP는 줄 끝을 반드시 이 두 글자로 표시해요.\n마지막 헤더 줄의 \\r\\n 바로 뒤에 빈 줄의 \\r\\n이 오면 \\r\\n\\r\\n이 되고, 서버는 '여기부터 본문'이라고 판단해요. 그래서 소켓 실습에서 이 마지막 빈 줄을 빠뜨리면 서버가 계속 기다려요.", "376": "이 문장은 X예요. GET 요청은 보통 본문이 없어서 Content-Length도 적지 않아요.\nGET은 자원을 '가져오기만' 하는 메서드라서, 필요한 조건은 /search?q=mug처럼 URL의 쿼리에 담아요. 본문이 없으니 본문 길이를 알려 주는 Content-Length도 필요 없어요. 표준상 GET 본문은 정해진 의미가 없어서, 넣어도 서버나 프록시가 무시하거나 거부할 수 있어요.\n반대로 POST·PUT은 새로 만들거나 바꿀 데이터를 본문에 담아 보내서, Content-Type과 Content-Length를 함께 적어요. 예를 들어 JSON 주문서를 보낼 때 그렇게 해요.", "377": "이 문장은 O예요. Accept-Encoding으로 '이런 압축을 풀 수 있어요'라고 알리면, 서버가 그중 하나로 압축해 보낼 수 있어요.\n이렇게 클라이언트가 가능한 선택지를 보내고 서버가 골라 응답하는 것을 콘텐츠 협상(content negotiation)이라고 해요. br은 Brotli, gzip은 오래된 표준 압축 방식이에요. 서버가 Brotli로 압축했다면 응답에 Content-Encoding: br을 붙여 '이 방식으로 풀어라'고 알려요.\n텍스트인 HTML·CSS·JS는 압축하면 크기가 70~80%까지 줄기도 해요. 반면 JPEG처럼 이미 압축된 이미지는 다시 압축해도 거의 줄지 않아요.", "378": "이 문장은 O예요. charset은 바이트를 글자로 바꾸는 규칙이라, 실제와 다르면 한글이 깨져요.\n컴퓨터는 글자를 바이트로 저장하는데, 같은 바이트라도 어떤 문자 인코딩 규칙으로 읽느냐에 따라 다른 글자가 돼요. Content-Type: text/html; charset=utf-8처럼 적으면 브라우저는 UTF-8 규칙으로 해석해요.\n예를 들어 서버가 실제로는 EUC-KR로 저장된 파일을 보내면서 charset=utf-8이라고 적으면, 브라우저가 엉뚱한 규칙으로 읽어서 물음표 마름모나 이상한 기호로 보여요. 이른바 '한글 깨짐'의 대표 원인이에요.", "379": "이 문장은 O예요. max-age=60은 60초 동안은 서버에 묻지 않고 캐시를 그대로 써도 된다는 뜻이에요.\nCache-Control은 응답을 어디에 얼마나 저장해 써도 되는지 알려 주는 헤더예요. max-age 안의 기간에는 캐시가 '신선한(fresh)' 상태라 네트워크 요청 자체가 없어서 가장 빨라요.\n60초가 지나면 '오래된(stale)' 상태가 되는데, 바로 버리지 않고 If-None-Match에 ETag를 담아 '아직 그대로예요?'라고 물을 수 있어요. 안 바뀌었으면 본문 없는 304가 와서 저장본을 다시 써요. 정리하면 기간 안에는 묻지도 않고, 기간 후에는 확인만 해요.", "380": "이 문장은 O예요. 긴 캐시와 파일명 버전 해시를 함께 쓰는 것이 정석이에요.\nCSS·JS에 max-age=31536000(1년)처럼 긴 캐시를 주면 재방문이 매우 빨라져요. 그런데 같은 URL인 app.js를 고쳐서 배포하면, 사용자 브라우저는 캐시가 신선하다고 믿고 서버에 묻지도 않고 옛 파일을 계속 써요.\n그래서 빌드할 때 파일 내용으로 만든 해시를 이름에 넣어 app.3f9a2c.js처럼 만들어요. 내용이 바뀌면 이름(URL)도 바뀌어 새 파일로 인식되고, 안 바뀐 파일은 계속 캐시를 써요. 이런 기법을 캐시 버스팅(cache busting)이라고 불러요.", "381": "이 문장은 O예요. HSTS를 기억한 브라우저는 http:// 주소도 요청 전에 스스로 https://로 바꿔요.\nHSTS(HTTP Strict Transport Security)는 서버가 Strict-Transport-Security: max-age=31536000 같은 헤더로 '이 기간 동안 우리 사이트는 HTTPS로만 접속해'라고 알려 두는 기능이라는 뜻이에요.\n이게 없으면 사용자가 주소창에 shop.com만 쳤을 때 첫 요청이 평문 http로 나가는데, 공격자가 그 순간을 가로채 HTTPS로 넘어가지 못하게 막을 수 있어요(다운그레이드 공격). HSTS가 있으면 평문 요청 자체가 나가지 않아서 이 틈이 사라져요.", "382": "이 문장은 X예요. 301 리다이렉트로 옮기는 건 HSTS가 아니라 일반 HTTP→HTTPS 리다이렉트예요.\n리다이렉트 방식은 브라우저가 먼저 http://로 요청을 보내고, 서버가 '301, https로 가세요'라고 답하면 다시 https로 요청해요. 첫 요청이 평문으로 나가고 왕복도 한 번 더 들어요.\nHSTS는 브라우저가 이전에 받은 헤더를 기억해 두었다가, 요청을 보내기 전에 브라우저 내부에서 바로 https로 바꿔요(DevTools에서 307 Internal Redirect로 보여요). 실무에서는 첫 방문용으로 301 리다이렉트를 두고, HSTS 헤더도 함께 보내서 두 번째부터는 평문 요청이 안 나가게 해요.", "383": "이 문장은 O예요. HTML 하나만 받는 게 아니라, 그 안에 연결된 자원마다 추가 요청이 나가요.\n브라우저는 HTML을 읽다가 <link>로 연결된 CSS, <script>의 JS, <img>의 이미지, 폰트 등을 발견할 때마다 각각 따로 요청해요. 그래서 쇼핑몰 첫 화면 하나를 여는 데도 요청이 수십~수백 개 나가는 일이 흔해요. DevTools Network 탭을 보면 요청 목록이 길게 쌓이는 걸 확인할 수 있어요.\n요청이 많을수록 연결을 매번 새로 맺으면 핸드셰이크 비용이 커지니까, 연결 재사용과 HTTP/2 다중화가 체감 속도에 큰 영향을 줘요.", "384": "이 문장은 O예요. SameSite=Lax 쿠키는 다른 사이트에서 시작된 POST에는 붙지 않아 CSRF를 줄여요.\nCSRF(Cross-Site Request Forgery)는 악성 사이트가 사용자 몰래 shop.com으로 요청을 보내게 해서, 로그인 쿠키가 자동으로 붙은 채 주문·송금 같은 동작이 실행되게 하는 공격이라는 뜻이에요. Lax는 다른 사이트에서 온 POST·숨은 요청에는 쿠키를 빼서 이런 공격이 로그인 상태로 실행되지 않게 해요.\n대신 다른 사이트의 링크를 눌러 shop.com으로 이동하는 최상위 GET에는 쿠키를 붙여서 로그인이 유지돼요. Strict는 이 경우까지 막고, None은 제한이 없어요(Secure 필수).", "385": "이 문장은 O예요. 다른 출처로 보내는 비단순 요청은 본 요청 전에 OPTIONS로 먼저 허락을 물어요.\n이 사전 확인 요청을 Preflight(프리플라이트)라고 해요. 비단순 요청이란 Content-Type: application/json처럼 일반 폼 전송에서는 쓰지 않는 형식이나, PUT·DELETE 메서드, 사용자 정의 헤더를 쓰는 요청이라는 뜻이에요.\n브라우저는 'OPTIONS /api/orders'에 Origin, Access-Control-Request-Method 등을 담아 보내고, 서버가 Access-Control-Allow-Origin·Allow-Methods 등으로 허락하면 그제야 본 POST를 보내요. 허락이 없으면 본 요청은 나가지도 않아요.", "386": "이 문장은 X예요. 출처(Origin)는 도메인만이 아니라 scheme, host, port 세 가지가 모두 같아야 같은 출처예요.\n출처는 브라우저가 보안 경계를 나누는 단위라는 뜻이에요. https://shop.com과 http://shop.com은 scheme이 달라서, https://shop.com과 https://shop.com:8443은 port가 달라서 다른 출처예요.\n특히 www.shop.com과 api.shop.com처럼 같은 회사의 서브도메인이라도 host가 다르면 다른 출처예요. 그래서 프론트(www)에서 API(api)를 부르면 CORS 설정이 필요해요. 참고로 '같은 사이트(same-site)'는 더 넓은 개념이라 이 둘은 같은 사이트로 봐요.", "387": "이 문장은 O예요. 201 Created와 함께 오는 Location 헤더는 새로 생긴 자원의 주소를 알려 줘요.\n201 Created는 '요청대로 새 자원을 만들었어요'라는 성공 코드예요. 예를 들어 POST /orders로 주문을 만들면 서버가 201과 함께 Location: /orders/1001을 보내서 '새 주문은 여기서 볼 수 있어요'라고 알려 줘요.\n그래서 클라이언트는 그 주소로 GET을 보내 주문 상세를 바로 조회할 수 있어요. 헷갈리기 쉬운 짝은 3xx 리다이렉트의 Location이에요. 리다이렉트에서는 '여기로 이동하라'는 뜻이고, 201에서는 '새로 만든 건 여기 있다'는 뜻이에요.", "388": "이 문장은 O예요. 중복 주문은 클라이언트와 서버 양쪽에서 함께 막아야 해요.\n버튼 비활성화는 첫 클릭 후 버튼을 잠가서 사용자가 실수로 두 번 누르는 걸 막아요. 하지만 이것만으로는 부족해요. 응답이 늦어 앱이 자동 재시도하거나, 새로고침·뒤로가기·네트워크 재전송으로 같은 POST가 서버에 두 번 도착할 수 있기 때문이에요.\n그래서 서버에서도 Idempotency-Key로 같은 키의 요청이 오면 저장된 결과를 돌려줘서 주문을 하나만 만들어요. 클라이언트 방어는 사용자 경험용, 서버 방어는 데이터 정확성을 지키는 마지막 안전장치라고 생각하면 돼요.", "389": "이 문장은 O예요. 502는 프록시가 뒷단 서버로부터 제대로 된 응답을 받지 못했을 때 나요.\n리버스 프록시(Nginx 등)는 사용자 요청을 받아 뒤에 있는 앱 서버로 넘겨주는 앞단 서버라는 뜻이에요. 앱 서버 프로세스가 죽었거나, 프록시 설정의 포트가 앱이 실제로 듣는 포트와 다르면 연결 자체가 거부돼요. 또 앱이 중간에 연결을 끊거나 HTTP 형식이 아닌 응답을 주면 '응답이 엉망'인 경우가 돼요.\n이런 경우 프록시가 대신 502 Bad Gateway를 만들어 보내요. 기다리다 시간 초과된 경우는 502가 아니라 504예요.", "390": "이 문장은 X예요. 3xx는 서버 오류가 아니라 '다른 곳으로 가라'는 리다이렉트 응답이에요.\n상태 코드는 첫 자리로 큰 뜻이 정해져요. 2xx는 성공, 3xx는 추가 행동 필요(주로 이동), 4xx는 클라이언트 오류, 5xx는 서버 오류예요. 3xx 응답의 Location 헤더에 새 주소가 담기고, 브라우저는 자동으로 그 주소로 다시 요청해요.\n예를 들어 301은 영구 이동, 302는 임시 이동이고, 304 Not Modified도 3xx로 '캐시를 그대로 써라'는 뜻이에요. 서버가 고장 나거나 처리하다 실패한 경우는 500, 502, 503, 504 같은 5xx예요.", "391": "이 문장은 O예요. HTTP/2는 한 연결에서 여러 요청·응답을 스트림으로 섞어 보내서 HTTP 계층의 HOL Blocking을 없앴어요.\n스트림은 한 연결 안에서 요청·응답 한 쌍을 구분하는 번호 붙은 논리적 통로라는 뜻이에요. HTTP/2는 데이터를 작은 프레임으로 잘라 스트림 번호를 붙여 섞어 보내고, 받는 쪽은 번호대로 다시 맞춰요. 이를 다중화(multiplexing)라고 해요.\nHTTP/1.1은 한 연결에서 응답이 요청 순서대로만 나와서, 큰 이미지 응답이 늦으면 뒤의 작은 CSS 응답도 기다려야 했어요. HTTP/2에서는 준비된 응답부터 먼저 흘려 보낼 수 있어요.", "392": "이 문장은 O예요. ALPN은 TLS 핸드셰이크 중에 응용 프로토콜을 정하는 확장이에요.\nALPN(Application-Layer Protocol Negotiation)은 '이 암호 터널 안에서 어떤 언어로 대화할지' 고르는 기능이라는 뜻이에요. 클라이언트는 ClientHello에 ['h2', 'http/1.1']처럼 가능한 목록을 담고, 서버는 그중 하나를 골라 ServerHello 쪽 응답에 담아요.\n핸드셰이크 메시지 안에 끼워서 함께 처리하니 추가 왕복이 없어요. 헷갈리기 쉬운 짝은 SNI예요. SNI는 '어느 도메인'인지를, ALPN은 '어느 프로토콜'인지를 정해요. 둘 다 ClientHello에 실려요.", "393": "이 문장은 O예요. 서버는 개인키로 서명해서 자신이 인증서 공개키의 진짜 주인임을 증명해요.\n인증서 자체는 공개된 파일이라 누구나 복사해 내밀 수 있어요. 그래서 인증서만 보여 주는 걸로는 부족하고, 그 인증서의 공개키와 짝인 개인키를 실제로 가지고 있는지 증명해야 해요. TLS 1.3에서는 서버가 핸드셰이크 내용에 개인키로 서명한 CertificateVerify 메시지를 보내요.\n브라우저는 인증서의 공개키로 이 서명을 확인해요. 개인키가 없는 공격자는 올바른 서명을 만들 수 없어서, 훔친 인증서로는 위장할 수 없어요.", "394": "이 문장은 O예요. Finished 메시지가 핸드셰이크 전체의 위변조를 검사해요.\nFinished는 핸드셰이크 마지막에 양쪽이 '지금까지 주고받은 모든 메시지'를 새로 만든 키로 요약해 계산한 검증 값을 보내는 메시지라는 뜻이에요. 서로 계산한 값이 같아야 '중간에 아무도 손대지 않았다'고 확인하고 데이터를 주고받기 시작해요.\n예를 들어 공격자가 ClientHello의 암호 목록에서 강한 방식을 몰래 지워 약한 방식을 쓰게 만드는 다운그레이드 공격을 시도하면, 양쪽이 본 메시지가 달라져 Finished 값이 맞지 않고 연결이 끊겨요.", "395": "이 문장은 O예요. ECDHE는 세션 키 자체를 보내지 않고, 공개값만 주고받아 양쪽이 같은 키를 각자 계산해요.\n각자 비밀값을 하나씩 만들고, 그 비밀값으로 계산한 공개값만 상대에게 보내요. 그러면 '내 비밀값 + 상대 공개값'으로 계산한 결과가 양쪽에서 똑같이 나와요. 이것이 세션 키의 재료가 돼요. ECDHE는 타원곡선 위에서 매 연결마다 일회용 비밀값을 쓰는 Diffie-Hellman 키 교환이라는 뜻이에요.\n흔히 물감 섞기로 비유해요. 공통 색에 각자 비밀 색을 섞어 교환하고, 받은 색에 다시 자기 비밀 색을 섞으면 같은 색이 돼요. 도청자는 섞인 색만 봐서 원래 비밀 색을 알 수 없어요.", "396": "이 문장은 X예요. Let's Encrypt 인증서는 무료이지만 유효기간이 수년이 아니라 90일로 짧아요.\nLet's Encrypt는 누구나 무료로 TLS 인증서를 받을 수 있게 만든 CA라는 뜻이에요. 기간을 짧게 한 이유는 개인키가 유출되거나 도메인 주인이 바뀌었을 때 피해 기간을 줄이기 위해서예요.\n짧은 대신 사람이 손으로 갱신하지 않고, certbot 같은 도구가 ACME 프로토콜로 만료 전에 자동으로 재발급받아요. 업계 전체도 인증서 최대 유효기간을 점점 줄이는 추세라, '무료=길다'가 아니라 '자동 갱신=짧아도 된다'로 기억하면 돼요.", "397": "이 문장은 O예요. ECH를 쓰면 원래 평문이던 SNI까지 암호화해 접속 도메인을 숨길 수 있어요.\nECH(Encrypted Client Hello)는 ClientHello에서 민감한 부분(진짜 SNI 등)을 서버의 공개키로 암호화해 보내는 기술이라는 뜻이에요. 서버의 ECH용 공개키는 DNS의 HTTPS 레코드로 미리 받아 와요. 바깥에는 CDN 같은 공용 이름만 보여서, 경로상의 관찰자는 그 CDN 뒤 어느 사이트에 가는지 알기 어려워져요.\n하지만 DNS 질의가 평문이면 거기서 도메인이 드러나요. 그래서 DoH로 DNS를 숨기고, ECH로 SNI를 숨겨야 둘 다 가려져요. 목적지 IP는 여전히 보여요.", "398": "이 문장은 O예요. curl -v 출력의 맨 앞 기호로 각 줄의 정체를 구분할 수 있어요.\n-v(verbose)는 통신 과정을 자세히 보여 주는 옵션이에요. *로 시작하는 줄은 curl 자신의 진행 정보(DNS 결과, 'Connected to…', TLS 버전·인증서 정보 등), >는 내가 서버로 보낸 요청 줄과 헤더, <는 서버에게서 받은 상태줄과 응답 헤더예요.\n그래서 * 줄에서 멈추면 연결이나 TLS 단계 문제이고, > 줄은 다 나갔는데 < 줄이 안 오면 서버가 응답을 못 주는 문제예요. 어느 단계까지 진행됐는지가 바로 보여서 장애 위치를 좁히기 좋아요.", "399": "이 문장은 O예요. DevTools Timing은 요청 하나를 구간별로 나눠 보여 줘서 병목을 찾기 좋아요.\nDNS Lookup은 이름을 IP로 바꾸는 시간, Initial connection은 TCP 연결을 맺는 시간, SSL은 TLS 핸드셰이크 시간이에요. Waiting(TTFB)은 요청을 보낸 뒤 첫 바이트가 올 때까지 서버가 처리한 시간, Content Download는 본문을 끝까지 받는 시간이에요.\n예를 들어 Waiting만 길면 서버·DB 처리 문제, Content Download가 길면 파일이 크거나 대역폭이 부족한 거예요. 앞의 세 칸이 매번 길면 연결 재사용이 안 되고 있는 거예요. 가장 긴 칸이 곧 고칠 곳이에요.", "400": "
