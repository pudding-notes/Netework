틀린 부분은 'REST는 통신 프로토콜이다'예요. REST는 프로토콜이 아니라 아키텍처 스타일, 곧 '이렇게 설계하면 좋다'는 제약들의 묶음이에요.\n프로토콜은 메시지의 형식과 주고받는 순서를 정한 약속이라는 뜻이고, HTTP가 바로 그런 프로토콜이에요. REST는 Fielding이 2000년 논문에서 정리한 6가지 제약(Client–Server, Stateless, Cacheable, Uniform Interface, Layered System, Code on Demand)이에요.\n비유하면 HTTP는 '문법', REST는 그 문법으로 글을 잘 쓰는 '문체 규칙'이에요. 그래서 REST는 보통 HTTP 위에서 구현될 뿐, HTTP 자체를 대신하지 않아요.", "401": "나열된 다섯 가지가 모두 REST 제약이 맞아서 O예요.\nClient–Server는 화면과 데이터 처리를 나누고, Stateless는 요청마다 필요한 정보를 다 담으며, Cacheable은 응답이 캐시 가능한지 밝히는 것이에요. Uniform Interface는 URI·표준 메서드로 일관되게 다루는 것, Layered System은 중간 계층(CDN·LB)이 있어도 클라이언트가 몰라도 되는 구조라는 뜻이에요.\n여기에 서버가 실행 코드(JS 등)를 내려보낼 수 있다는 선택 제약 Code on Demand를 더하면 6가지가 돼요. 선택 제약이라 안 지켜도 REST로 인정돼요.", "402": "'행위는 Method, URI는 자원(명사)'이라는 이유가 정확해서 O예요.\nREST에서 URI는 '무엇'을 가리키는 주소이고, '어떻게 할지'는 GET·POST 같은 메서드가 맡아요. /getStudent처럼 URI에 동사를 넣으면 GET과 뜻이 겹쳐서 '가져와 학생 가져오기를'처럼 동사가 두 번 나오게 돼요.\n이렇게 나누면 같은 /students/10 하나로 GET(조회)·PATCH(수정)·DELETE(삭제)를 모두 표현할 수 있어서 API 문법이 일관돼요.", "403": "틀린 부분은 '쿼리로 지정하는 것이 더 REST답다'예요. 자원 하나를 가리킬 때는 경로(/students/10)가 맞아요.\n경로는 '식별', 곧 어떤 자원인지 이름을 붙이는 역할이고, 쿼리(?뒤 부분)는 '조건', 곧 목록을 걸러내거나 정렬하는 옵션이라는 뜻이에요.\n예를 들어 '10번 학생'은 하나뿐인 대상이니 /students/10으로 쓰고, '3학년인 학생들'은 조건이니 /students?grade=3으로 써요. 아파트 주소에 동·호수를 쓰는 것과 '남향인 집만'처럼 조건을 다는 것의 차이라고 생각하면 돼요.", "404": "PUT의 성질을 정확히 말해서 O예요.\nPUT은 '이 자원을 내가 보낸 내용으로 통째로 바꿔라'라는 뜻이에요. 그래서 Body가 자원의 완전한 새 모습이라고 보고, 거기에 없는 필드는 '없어진 것'으로 처리해요. 슬라이드 예처럼 name만 보내면 email이 null이 돼요.\n짝 개념인 PATCH는 '보낸 부분만 고쳐라'라서 빠진 필드를 그대로 둬요. 일부만 바꾸고 싶은데 PUT을 쓰면 다른 데이터가 날아가는 실수가 생기니 주의해요.", "405": "틀린 부분은 '보내지 않은 필드는 null로 바뀐다'예요. PATCH에서 보내지 않은 필드는 그대로 유지돼요.\nPATCH는 부분 수정, 곧 바꾸고 싶은 필드만 골라서 보내는 메서드라는 뜻이에요. 예를 들어 {\"grade\": 4}만 보내면 학년만 바뀌고 이름·이메일은 그대로예요.\n빠진 필드를 없애는 건 PUT(전체 교체)의 성질이에요. 참고로 PATCH에서 필드를 지우고 싶으면 아예 빼는 게 아니라 {\"email\": null}처럼 null을 명시해서 보내요.", "406": "생성 성공을 알리는 좋은 방법을 정확히 말해서 O예요.\n201 Created는 '새 자원이 만들어졌다'는 뜻의 상태 코드이고, Location 헤더는 그 새 자원의 주소(예: /students/11)를 알려 주는 응답 헤더예요. 새 id는 클라이언트가 아니라 서버가 정하기 때문에, 서버가 주소를 알려 줘야 클라이언트가 알 수 있어요.\n도서관에서 새 책을 등록하면 사서가 '청구기호는 이거예요'라고 알려 주는 것과 같아요. 그 번호로 바로 GET해서 찾아갈 수 있죠.", "407": "틀린 부분은 '200을 써도 똑같이 명확하다'예요. 200은 '그냥 성공'이라 새로 만들어졌는지가 드러나지 않아요.\n200 OK는 조회·수정 등 모든 일반 성공에 쓰이는 코드이고, 201 Created는 '새 자원이 생겼다'는 구체적인 의미를 담은 코드예요. 상태 코드는 클라이언트·모니터링 도구가 Body를 열어 보지 않고도 결과를 판단하게 해 주는 약속이에요.\n예를 들어 같은 요청을 다시 보냈을 때 '이미 있어서 그냥 성공'인지 '새로 생성'인지 구분하려면 201 + Location이 필요해요.", "408": "두 코드의 차이를 정확히 말해서 O예요.\n인증(Authentication)은 '당신이 누구인지 확인하는 것', 인가(Authorization)는 '그 사람이 이 일을 해도 되는지 확인하는 것'이라는 뜻이에요. 토큰이 없거나 만료되면 누구인지 모르니 401, 로그인은 했지만 관리자 전용 기능을 쓰려 하면 403이에요.\n아파트 경비실로 비유하면, 출입증이 없으면 '누구세요?'(401), 주민인 건 확인됐지만 남의 집에 들어가려 하면 '여긴 안 됩니다'(403)예요.", "409": "틀린 부분은 '다시 로그인하면 대부분 해결된다'예요. 403은 이미 누구인지는 확인된 상태라 다시 로그인해도 권한은 그대로예요.\n403 Forbidden은 인가 실패, 곧 신원은 알지만 이 자원에 대한 권한이 없다는 뜻이에요. 해결하려면 권한을 받아야지 로그인을 반복해도 소용없어요.\n반대로 401 Unauthorized는 토큰이 없거나 만료된 인증 실패라서 다시 로그인해 새 토큰을 받으면 풀릴 수 있어요. 경비실에서 주민증은 확인됐는데 남의 집 열쇠가 없는 상황이라고 생각하면 돼요.", "410": "틀린 부분은 'handler 안의 코드가 이미 실행되었다'예요. 422는 handler에 들어가기 전에 멈춘 결과예요.\nFastAPI는 요청이 오면 먼저 Pydantic으로 경로 값·Body가 선언한 타입과 규칙에 맞는지 검사해요. Pydantic은 데이터 모양을 검증하는 파이썬 라이브러리라는 뜻이에요. 여기서 실패하면 바로 422 Unprocessable Entity를 돌려주고 handler 함수는 호출조차 안 돼요.\n그래서 422가 났는데 handler 안에 print를 넣어도 아무것도 안 찍혀요. 원인은 요청 데이터 쪽에서 찾아야 해요.", "411": "Origin의 구성 요소를 정확히 말해서 O예요.\nOrigin(출처)은 '어느 사이트에서 왔는지'를 나타내는 단위로, scheme(http/https), host(도메인), port(포트 번호) 세 가지로 이루어져요. 이 셋이 모두 같아야 같은 Origin이에요.\n예를 들어 http://localhost:5500/index.html과 http://localhost:5500/about?x=1은 path·query가 달라도 같은 Origin이에요. 반면 http://localhost:5500과 http://localhost:8000은 포트만 달라도 다른 Origin이라 CORS 규칙이 적용돼요.", "412": "틀린 부분은 '같은 컴퓨터를 가리키므로 같은 Origin이다'예요. 브라우저는 실제 컴퓨터가 같은지가 아니라 host 문자열이 같은지로 비교해요.\nlocalhost는 이름, 127.0.0.1은 IP 주소라서 글자가 다르니 다른 Origin이에요. 실제로 같은 서버에 도착하더라도 브라우저 입장에서는 다른 출처예요.\n그래서 프론트는 http://127.0.0.1:5500에서 열고, 서버 CORS 설정에는 http://localhost:5500만 넣어 두면 CORS 오류가 나요. 실습에서는 둘 중 하나로 통일하거나 둘 다 허용 목록에 넣어요.", "413": "틀린 부분은 'curl 요청도 차단된다'예요. CORS는 서버가 아니라 브라우저가 지키는 보안 규칙이에요.\nCORS(Cross-Origin Resource Sharing)는 '다른 Origin의 웹페이지 JS가 응답을 읽어도 되는지'를 서버가 헤더로 허락하고, 브라우저가 그 허락을 확인하는 구조라는 뜻이에요. curl·Postman·Python requests·서버 간 호출은 브라우저가 아니라서 이 검사를 하지 않아요.\n그래서 'curl로는 되는데 브라우저에서만 안 돼요'라는 상황이 생기면 서버 로직이 아니라 CORS 설정을 의심해야 해요.", "414": "JSON 본문 때문에 Preflight가 생긴다는 점이 맞아서 O예요.\nPreflight는 브라우저가 실제 요청 전에 OPTIONS 메서드로 '이런 요청 보내도 되나요?'라고 먼저 묻는 사전 확인이라는 뜻이에요. Simple Request로 인정되려면 메서드가 GET·HEAD·POST이고, Content-Type이 text/plain, application/x-www-form-urlencoded, multipart/form-data 중 하나여야 해요.\napplication/json은 이 목록에 없어서 POST라도 Preflight가 발생해요. PATCH·DELETE도 메서드 때문에 항상 Preflight가 생겨요.", "415": "credentials와 와일드카드를 함께 쓰면 거부된다는 점이 맞아서 O예요.\ncredentials는 쿠키·인증 헤더 같은 사용자 신원 정보를 요청에 담아 보내는 모드라는 뜻이에요. 이때 서버가 Access-Control-Allow-Origin: *(아무 사이트나 허용)로 답하면 브라우저가 규격상 응답을 막아요. 신원이 걸린 요청은 정확한 Origin을 명시해야 해요.\n이를 피하려고 요청의 Origin을 그대로 돌려주는 '반사'를 하면 아무 사이트나 사용자 쿠키로 요청할 수 있게 되니, 허용할 Origin 목록을 직접 적는 게 안전해요.", "416": "HTTP와 REST API의 관계를 잘 비유해서 O예요.\nHTTP는 요청 줄·헤더·Body 같은 메시지의 형식, 곧 '문장을 어떻게 쓰는가'를 정한 문법이에요. REST API는 그 문법으로 '어떤 단어(URI)를 쓰고 어떤 동사(메서드)로 말할지'를 정한 문체와 어휘집에 해당해요.\n같은 한국어 문법으로도 공문서와 일기는 다르게 쓰듯, 같은 HTTP로도 API마다 설계가 달라질 수 있어요. REST는 그중 일관되고 예측 가능한 문체를 권하는 거예요.", "417": "틀린 부분은 'API는 서버 코드 그 자체'예요. API는 코드가 아니라 서로 주고받는 방식에 대한 약속, 곧 인터페이스(계약)예요.\n인터페이스는 두 시스템이 맞닿는 경계에서 '이렇게 요청하면 이렇게 응답한다'를 정한 것이라는 뜻이에요. 서버 코드는 그 계약을 지키는 구현일 뿐이에요.\n식당 비유로 보면 API는 메뉴판이고, 주방에서 요리하는 방법이 서버 코드예요. 주방장이 바뀌어도 메뉴판이 같으면 손님은 똑같이 주문할 수 있어요.", "418": "계약이 같으면 구현 교체가 상대에게 보이지 않는다는 점이 맞아서 O예요.\nAPI 명세는 URI·메서드·요청/응답 형식·상태 코드를 정한 문서라는 뜻이에요. Frontend는 이 명세만 보고 요청을 보내기 때문에, 뒤에서 FastAPI든 Spring이든 어떤 언어로 만들었는지는 알 필요가 없어요.\n식당에서 메뉴판(명세)이 그대로면 주방 설비(구현)를 바꿔도 손님이 주문하는 방법은 변하지 않는 것과 같아요. 이게 프론트·백엔드를 나눠서 개발할 수 있는 이유예요.", "419": "DB 구조가 응답에 그대로 드러나면 나쁜 계약이라는 점이 맞아서 O예요.\n좋은 계약은 구현(DB 테이블 설계)과 상관없이 클라이언트가 필요한 모양으로 정해져야 해요. 예를 들어 stu_nm 같은 컬럼명이 그대로 응답에 나오면, DB 컬럼 이름을 student_name으로 바꾸는 순간 응답 필드도 바뀌어 프론트 화면이 깨져요.\n그래서 응답 필드는 name처럼 의미 중심으로 정하고, 서버 안에서 DB 컬럼과 연결(매핑)해요. 구현은 바뀌어도 계약은 흔들리지 않게 하는 거예요.", "420": "틀린 부분은 '오류 응답 형식은 handler가 자유롭게 정한다'예요. 오류 응답 형식도 API 계약의 일부예요.\nAPI 명세에는 URI와 메서드뿐 아니라 요청·응답 Body 형식, 상태 코드, 인증 방법, 그리고 오류가 났을 때 어떤 모양으로 알려 줄지까지 들어가요.\n오류 형식이 handler마다 다르면 프론트는 {\"error\":...}, {\"message\":...}, {\"detail\":...}를 다 따로 처리해야 해요. 그래서 RFC 9457 Problem Details처럼 하나의 표준 형식으로 통일하는 게 좋아요.", "421": "틀린 부분은 역할이 서로 바뀌었다는 거예요. 메뉴판이 API 명세, 웨이터가 HTTP예요.\n메뉴판은 '무엇을 주문할 수 있고 어떻게 나오는지'를 정한 약속이니 API 명세(계약)에 해당해요. 웨이터는 손님의 주문을 주방에 전달하고 음식을 가져오는 운반자이니 요청·응답 메시지를 실어 나르는 HTTP에 해당해요.\n주방은 서버 구현이에요. 손님(클라이언트)은 주방 안을 몰라도 메뉴판만 보고 웨이터에게 주문하면 돼요.", "422": "Server-Side Rendering(SSR)의 정의가 맞아서 O예요.\nSSR은 서버가 데이터를 HTML 템플릿에 채워 넣어 완성된 페이지를 만든 뒤 브라우저에 보내는 방식이라는 뜻이에요. PHP·JSP·Django Template가 대표적이고, 화면과 데이터가 한 덩어리로 와요.\n짝 개념인 SPA + REST API에서는 서버가 데이터(JSON)만 보내고 화면은 브라우저의 JS가 그려요. SSR은 완성된 요리를 받는 것, SPA는 재료만 받아 내 식탁에서 조리하는 것에 비유할 수 있어요.", "423": "틀린 부분은 '매 클릭마다 완성된 HTML 전체를 보낸다'예요. 그건 SSR 방식이에요.\nSPA(Single Page Application)는 처음에 HTML·JS를 한 번만 받고, 이후에는 클릭할 때마다 필요한 데이터만 JSON으로 주고받는 구조라는 뜻이에요. 화면을 다시 그리는 일은 브라우저의 JS가 맡아요.\n그래서 페이지 전체가 새로고침되지 않고 필요한 부분만 바뀌어요. 이 구조에서 서버는 화면이 아니라 데이터를 제공하는 REST API 역할을 해요.", "424": "포트가 다르면 다른 Origin이 되어 CORS가 등장한다는 점이 맞아서 O예요.\nOrigin은 scheme·host·port 세 가지가 모두 같아야 같은 출처예요. 실습처럼 프론트를 Live Server(5500)로, 백엔드를 FastAPI(8000)로 띄우면 host가 같아도 포트가 달라 다른 Origin이에요.\n이때 프론트 JS가 8000번 서버에 fetch하면 브라우저가 CORS 검사를 해요. 서버가 Access-Control-Allow-Origin으로 5500번을 허락해 줘야 응답을 읽을 수 있어서 이번 학기에 CORS를 함께 배우는 거예요.", "425": "API가 여러 클라이언트의 공용 '제품'이 되면 관리 요소가 필수라는 점이 맞아서 O예요.\n명세는 모두가 같은 규칙을 보게 하고, 버전은 기존 클라이언트를 깨지 않고 바꾸게 하며, 인증은 누가 쓰는지 확인하고, 속도 제한(Rate Limit)은 한 클라이언트가 과하게 요청하지 못하게 막는 장치라는 뜻이에요.\n예를 들어 앱은 구버전 사용자가 남아 있으니 응답을 함부로 바꾸면 안 되고, IoT 기기가 폭주하면 웹 사용자까지 느려져요. 그래서 하나의 API를 여럿이 쓸수록 이런 장치가 필요해요.", "426": "틀린 부분은 'HTTP와 JSON만 쓰면 REST API'라는 부분이에요. REST는 전송 수단이 아니라 제약을 지켰는지로 판단해요.\n예를 들어 POST /api 하나로 {\"action\":\"getStudent\"}를 보내는 방식도 HTTP+JSON이지만, URI로 자원을 식별하고 표준 메서드로 조작하라는 Uniform Interface를 어기니 REST가 아니에요. 이건 Richardson 성숙도 Level 0에 해당해요.\n즉 HTTP·JSON은 재료일 뿐이고, 자원 중심 URI·메서드 의미·상태 코드·Stateless 같은 제약을 지켜야 REST라고 할 수 있어요.", "427": "Stateless가 깨지면 서버를 늘리기 어려워진다는 점이 맞아서 O예요.\nStateless는 서버가 요청 사이의 대화 상태(세션)를 메모리에 기억하지 않고, 요청마다 필요한 정보(예: 토큰)를 모두 담아 보낸다는 뜻이에요. Scale-out은 서버 대수를 늘려 부하를 나누는 방식이라는 뜻이에요.\n세션이 1번 서버 메모리에만 있으면, 로드밸런서가 다음 요청을 2번 서버로 보냈을 때 '누구세요?'가 돼요. 요청 자체에 신원 정보가 있으면 어느 서버로 가도 처리할 수 있어서 서버를 자유롭게 늘릴 수 있어요.", "428": "Cacheable 제약의 내용이 맞아서 O예요.\nCacheable은 응답마다 '이걸 저장해 두고 다시 써도 되는지, 얼마나 오래 써도 되는지'를 스스로 밝히라는 제약이에요. Cache-Control은 캐시 허용 여부와 유효 시간을 알려 주는 헤더, ETag는 응답 내용의 버전 표시값이라는 뜻이에요.\n예를 들어 학과 목록처럼 잘 안 바뀌는 데이터에 Cache-Control: max-age=3600을 주면 브라우저나 CDN이 한 시간 동안 서버에 묻지 않아요. 이게 없으면 같은 목록을 매번 DB에서 다시 꺼내야 해요.", "429": "틀린 부분은 '클라이언트가 중간 계층이 있는지 알고 있어야 한다'예요. Layered System은 오히려 몰라도 되게 만드는 제약이에요.\nLayered System은 클라이언트와 서버 사이에 CDN(캐시 서버)·LB(로드밸런서)·API Gateway 같은 중간 계층이 끼어도, 클라이언트는 바로 앞의 상대와만 대화한다고 생각하면 된다는 뜻이에요.\n그래서 서버 쪽에 캐시나 보안 게이트웨이를 새로 추가해도 클라이언트 코드는 하나도 고칠 필요가 없어요. 택배를 보낼 때 중간 물류센터를 몰라도 받는 주소만 알면 되는 것과 같아요.", "430": "Uniform Interface의 핵심 내용이 맞아서 O예요.\nUniform Interface는 '모든 API가 같은 방식으로 말한다'는 제약으로, URI로 자원을 식별하고, 표현(JSON 등)을 통해 조작하고, 메시지가 스스로를 설명하고, 응답에 다음 행동 링크를 담는(HATEOAS) 네 가지로 이루어져요.\n이게 지켜지면 /students/10에 GET·PATCH·DELETE만 바꿔 쓰면 되지만, 깨지면 /getStudent, /doDelete, /updateStudentInfo처럼 API마다 이름 규칙을 따로 외워야 해요.", "431": "'표현을 통한 조작'의 뜻이 맞아서 O예요.\n클라이언트는 서버 DB에 직접 접근하지 않고, 자원의 바뀌었으면 하는 모습을 JSON 같은 표현에 담아 보내서 '이렇게 바꿔 주세요'라고 요청해요. 실제 변경 여부는 서버가 규칙을 확인한 뒤 결정해요.\n예를 들어 PATCH /students/10 {\"grade\": 4}는 DB의 grade 컬럼을 직접 고치는 게 아니라 '10번 학생 학년을 4로 해 주세요'라는 요청이에요. 서버는 학년이 1~4 범위인지 확인하고 아니면 거절할 수 있어요.", "432": "틀린 부분은 '클라이언트가 요청 헤더에 값을 넣는 방식'이에요. HATEOAS는 서버가 응답 쪽에 담는 정보예요.\nHATEOAS(Hypermedia As The Engine Of Application State)는 서버가 응답 안에 '다음에 할 수 있는 행동'의 링크를 함께 넣어 준다는 뜻이에요. 예를 들어 수강 정보 응답에 \"cancel\": \"/enrollments/5/cancellation\" 같은 링크를 담아요.\n웹페이지에서 링크를 눌러 다음 화면으로 가듯, 클라이언트가 URI를 외우지 않고 응답의 링크를 따라가게 하는 것이 목적이에요.", "433": "실무 API가 HATEOAS를 대부분 생략한다는 점이 맞아서 O예요.\nUniform Interface는 ①자원 식별(URI) ②표현을 통한 조작 ③자기 서술적 메시지 ④HATEOAS로 이루어지는데, 실무에서는 보통 ①~③까지만 지켜요. 링크를 응답마다 넣고 클라이언트가 그걸 따라가도록 만드는 비용이 크기 때문이에요.\nFielding의 엄밀한 기준으로는 ④까지 지켜야 REST라서, 정확히는 'REST의 원칙을 따르는 HTTP API', 곧 RESTful HTTP API라고 부르는 게 맞아요. 수업에서도 이 차이를 알고 쓰자는 의미예요.", "434": "Level 0의 설명이 맞아서 O예요.\nRichardson 성숙도 모델은 API가 REST에 얼마나 가까운지를 0~3단계로 나눈 기준이라는 뜻이에요. Level 0은 URI 하나(/api)에 POST만 써서, 무엇을 할지는 Body 안의 action 값으로 구분하는 단계예요.\n예: POST /api {\"action\":\"getStudent\",\"id\":10}. HTTP를 그냥 메시지 운반 통로로만 쓰는 셈이라 'The Swamp of POX(평범한 XML의 늪)'라고 불러요. 여기서 자원별 URI를 나누면 Level 1이 돼요.", "435": "틀린 부분은 Level 1의 설명이에요. 메서드와 상태 코드를 의미대로 쓰는 건 Level 2예요.\nLevel 1은 /students/10처럼 자원마다 URI는 따로 있지만, 여전히 모든 요청을 POST 하나로 보내는 단계예요. Level 2에서 비로소 조회는 GET, 삭제는 DELETE처럼 메서드를 구분하고 201·404 같은 상태 코드를 의미대로 써요. Level 3은 여기에 HATEOAS 링크까지 더한 단계예요.\n정리하면 Level 1은 '자원 나누기', Level 2는 '메서드·상태 코드 의미대로 쓰기', Level 3은 '링크 따라가기'예요.", "436": "수업 목표가 Level 2인 것이 맞아서 O예요.\nLevel 2는 자원별 URI를 두고, GET·POST·PUT·PATCH·DELETE를 의미대로 쓰며, 201·204·404·409 같은 상태 코드로 결과를 정확히 알리는 단계예요. 대부분의 실무 'REST API'가 이 수준이라 사실상 실무 표준이에요.\nLevel 3(HATEOAS)은 이론적으로 완전한 REST지만 구현 비용이 커서 잘 쓰이지 않아요. 그래서 수업 과제에서도 Level 2를 확실히 지키는 것을 목표로 해요.", "437": "틀린 부분은 '모니터링 도구가 오류율을 정확히 집계한다'예요. 도구는 Body가 아니라 상태 코드를 보고 판단해요.\n모니터링 도구·로드밸런서·캐시·브라우저 개발자 도구는 응답의 상태 코드(2xx는 성공, 4xx·5xx는 실패)를 기준으로 동작해요. 실패도 200으로 보내면 모두 '성공'으로 세어져서 장애가 나도 대시보드는 초록불이에요.\n게다가 캐시가 실패 응답을 성공으로 알고 저장해 버릴 수도 있어요. 그래서 실패는 404·409·500처럼 맞는 상태 코드로 알려야 하고, 이것이 Level 2를 반드시 넘어야 하는 이유예요.", "438": "자원과 표현의 구분이 맞아서 O예요.\nResource(자원)는 '10번 학생'처럼 서버가 관리하는 개념적인 대상이고, Representation(표현)은 그 자원의 특정 시점 상태를 JSON·CSV·HTML 같은 형식으로 담은 데이터라는 뜻이에요. 네트워크로 오가는 건 항상 표현이에요.\n사람과 사진의 비유로 보면 사람이 자원, 사진이 표현이에요. 같은 사람을 증명사진·단체사진 등 여러 장으로 찍을 수 있듯, 같은 학생을 JSON으로도 CSV로도 받을 수 있어요.", "439": "두 헤더의 역할이 맞아서 O예요.\nAccept는 클라이언트가 '이런 형식으로 주세요'라고 요청하는 헤더(예: Accept: application/json)이고, Content-Type은 '이 Body는 이런 형식이에요'라고 실제 형식을 밝히는 헤더예요. 이렇게 형식을 서로 맞추는 과정을 Content Negotiation(내용 협상)이라고 해요.\n헷갈리기 쉬운 점은 Content-Type이 응답에만 쓰이는 게 아니라는 거예요. 클라이언트가 POST로 JSON을 보낼 때도 요청에 Content-Type: application/json을 붙여요.", "440": "틀린 부분은 '415로 응답한다'예요. Accept에 맞는 형식을 못 만들면 406 Not Acceptable이에요.\n406은 '당신이 원하는 응답 형식을 만들어 줄 수 없다'는 뜻으로, 응답 쪽(Accept) 문제예요. 415 Unsupported Media Type은 '당신이 보낸 요청 Body의 형식(Content-Type)을 처리할 수 없다'는 뜻으로, 요청 쪽 문제예요.\n예를 들어 Accept: application/xml인데 서버가 JSON만 만들 수 있으면 406, XML Body를 보냈는데 서버가 JSON만 읽을 수 있으면 415예요.", "441": "틀린 부분은 '모든 컬럼을 그대로 넣는 것이 좋다'예요. 표현은 DB 테이블의 복사본이 아니에요.\n응답 표현에는 클라이언트가 알아야 할 정보만 골라 담아요. password_hash(비밀번호를 변환해 저장한 값)나 내부 관리용 컬럼을 그대로 내보내면 보안 사고가 되고, DB 구조가 바뀔 때마다 응답도 바뀌어 프론트가 깨져요.\n사람과 사진 비유로 보면, 사진(표현)은 보여 주고 싶은 모습만 찍는 거지 그 사람의 모든 정보를 담는 게 아니에요. FastAPI에서는 response_model로 응답 필드를 제한해요.", "442": "REST라는 이름의 뜻이 맞아서 O예요.\nREST는 Representational State Transfer의 줄임말로, '자원의 상태(State)를 표현(Representation)에 담아 전송(Transfer)한다'는 뜻이에요. 서버에 있는 자원 그 자체가 오가는 게 아니라, 그 상태를 JSON 같은 형식으로 담은 표현이 오가요.\n예를 들어 GET /students/10은 10번 학생의 현재 상태를 JSON으로 받는 것이고, PATCH는 바뀌었으면 하는 상태를 표현으로 보내는 거예요. 이름 자체가 자원과 표현의 관계를 설명해요.", "443": "틀린 부분은 '받은 JSON을 고치면 서버 자원도 바뀐다'예요. 받은 JSON은 자원의 복사본(표현)일 뿐이에요.\n클라이언트가 받은 데이터는 특정 시점의 자원 상태를 찍어 보낸 것이라 서버와 연결되어 있지 않아요. 사람과 사진 비유로, 사진을 찢어도 사람은 다치지 않는 것과 같아요.\n서버의 자원을 바꾸려면 PATCH /students/10처럼 변경 요청을 보내야 하고, 서버는 권한·값 규칙을 확인해 받아들이거나 거절해요. 결정권은 항상 서버에 있어요.", "444": "필드를 골라 받은 것도 같은 자원의 다른 표현이라는 점이 맞아서 O예요.\n자원은 하나지만 표현은 여러 모양일 수 있어요. ?fields=name은 '이름만 담은 표현을 주세요'라는 뜻으로, 자원이 달라지는 게 아니라 보여 주는 범위가 달라지는 거예요.\n사람과 사진 비유로, 같은 사람을 증명사진(상세 조회)·단체사진(목록 속 한 줄)·명함(이름만)으로 보여 줄 수 있어요. 모바일처럼 데이터를 아껴야 할 때 필요한 필드만 받으면 응답이 가벼워져요.", "445": "틀린 부분은 '단수형 + list로 짓는 것이 권장된다'예요. 컬렉션 이름은 복수형 명사(/students)로 써요.\n컬렉션은 같은 종류 자원의 모음이라는 뜻이에요. /students가 학생 모음이고, 그 안의 하나는 /students/10이에요. 이렇게 하면 '모음 → 그중 하나' 구조가 경로만 봐도 일관되게 읽혀요.\n/student/list처럼 쓰면 list가 행위처럼 보이고, 하나를 가리킬 때는 /student/10인지 /student/list/10인지 헷갈려요. 도서관에서 '책장(books) → 그 안의 10번 책'처럼 생각하면 쉬워요.", "446": "포함 관계를 계층 경로로 나타내는 것이 맞아서 O예요.\n계층 경로는 '/부모/부모id/자식'처럼 경로를 이어 붙여 '누구에게 딸린 무엇'인지 보여 주는 방식이라는 뜻이에요. /students/10/enrollments는 '10번 학생에게 딸린 수강 목록'으로 자연스럽게 읽혀요.\n/enrollmentsOfStudent?sid=10처럼 쓰면 URI에 관계 설명이 문장처럼 들어가 일관성이 깨져요. 다만 '3학년 학생'처럼 조건으로 거르는 건 계층이 아니라 쿼리(?grade=3)로 쓴다는 점과 구분해요.", "447": "URI 경로 표기 권장 규칙이 맞아서 O예요.\nURI에서 scheme과 host는 대소문자를 구분하지 않지만, 경로(path)는 구분해요. 그래서 /StudentGrades와 /studentgrades는 서버에 따라 서로 다른 주소로 취급될 수 있어요.\n이런 혼란을 막으려고 경로는 모두 소문자로 쓰고, 단어 사이는 하이픈(-)으로 이어요(예: /student-grades). 밑줄(_)은 링크 밑줄에 가려 잘 안 보이고, camelCase는 대소문자 실수를 부르기 쉬워 피하는 편이에요.", "448": "틀린 부분은 '필터를 경로로 표현한다'예요. 필터는 조건이니 쿼리(GET /students?grade=3)로 써요.\n경로는 자원을 식별하는 이름, 쿼리는 그 모음을 거르거나 정렬하는 조건이라는 뜻이에요. /students/grade/3처럼 쓰면 'grade'라는 하위 자원이 있는 것처럼 오해되고, 조건이 여러 개일 때(학년+학과) 경로가 끝없이 길어져요.\n쿼리로 쓰면 ?grade=3&dept=cs&sort=name처럼 조건을 자유롭게 조합하고 생략할 수 있어요. 아파트의 '동·호수'는 경로, '남향만 보기'는 쿼리라고 생각하면 돼요.", "449": "틀린 부분은 '확장자를 붙이는 것이 권장된다'예요. 형식은 URI가 아니라 Accept 헤더로 정해요.\nURI는 자원을 가리키는 이름이고, JSON이든 CSV든 같은 자원의 표현 형식만 다른 거예요. /students/10.json과 /students/10.csv로 나누면 같은 학생에게 주소가 여러 개 생긴 것처럼 돼요.\n대신 같은 /students/10에 Accept: application/json 또는 Accept: text/csv를 보내 원하는 형식을 협상해요(Content Negotiation). 사람은 한 명, 사진 형식만 다르다고 생각하면 돼요.", "450": "끝 슬래시 혼용이 리다이렉트와 CORS 문제로 이어진다는 점이 맞아서 O예요.\nFastAPI 같은 프레임워크는 /students/로 정의된 경로에 /students로 요청하면 307 Temporary Redirect(같은 메서드로 다른 주소에 다시 요청하라는 뜻)로 올바른 주소를 안내해요.\n일반 요청은 이걸 따라가면 되지만, Preflight(OPTIONS 사전 확인)는 규격상 리다이렉트를 허용하지 않아서 바로 CORS 오류가 나요. 그래서 끝 슬래시는 붙이든 안 붙이든 한 가지로 통일해 두는 게 좋아요.", "451": "URI 중첩을 얕게 유지하라는 권장이 맞아서 O예요.\n중첩은 /부모/id/자식처럼 경로를 이어 붙이는 것이라는 뜻이에요. /schools/1/depts/2/students/10처럼 깊어지면 학생 하나를 가리키는 데 학교·학과 id까지 다 알아야 하고, 학생이 학과를 옮기면 주소가 바뀌어 버려요.\n학생 id만으로 유일하게 찾을 수 있다면 /students/10으로 충분해요. 관계를 보여 줄 때도 /depts/2/students처럼 2단계 이내로 끊는 것이 읽기 쉽고 바뀌지 않는 주소를 만들어요.", "452": "틀린 부분은 'HTTPS라면 안전하다'예요. HTTPS는 전송 중만 보호하고, URL은 여러 곳에 그대로 기록돼요.\nHTTPS는 네트워크를 지나가는 동안 내용을 암호화한다는 뜻이에요. 하지만 URL은 서버·프록시 접근 로그, 브라우저 방문 기록, 다른 사이트로 이동할 때의 Referer 헤더 등에 평문으로 남아요.\n그래서 토큰이 ?token=abc처럼 URL에 있으면 로그를 보는 누구나 그 토큰을 쓸 수 있어요. 토큰은 Authorization: Bearer abc처럼 헤더에 담아 보내는 것이 원칙이에요.", "453": "관계 자원의 생성 위치를 한 곳으로 모으면 좋다는 점이 맞아서 O예요.\n관계 자원은 학생과 수업을 이어 주는 '수강'처럼 두 자원 사이의 연결 자체를 하나의 자원으로 다루는 것이라는 뜻이에요. 생성을 POST /students/10/enrollments와 POST /courses/3/enrollments 두 곳에서 받으면 검증 규칙(정원·중복 체크)을 두 번 구현해야 하고, 한쪽만 고치는 실수가 생겨요.\n조회는 '10번 학생의 수강'과 '3번 수업의 수강생'처럼 양쪽 경로에서 해도 편하지만, 생성은 POST /enrollments 한 곳에서 처리하면 규칙이 한 군데에만 있어서 일관성을 지키기 쉬워요.", "454": "틀린 부분은 /students를 Item, /students/10/enrollments를 Collection으로 본 것이에요.\n자원 트리에서 Collection은 같은 종류의 모음(/students), Item은 그중 하나(/students/10), Sub-resource는 특정 Item에 딸린 하위 자원(/students/10/enrollments)이라는 뜻이에요.\n도서관 비유로 보면 책장 전체가 Collection, 책 한 권이 Item, 그 책에 붙은 대출 기록이 Sub-resource예요. 참고로 Sub-resource도 여러 건의 모음이라 그 자체는 컬렉션 모양이지만, 트리에서는 '딸린 것'으로 구분해요.", "455": "틀린 부분은 'URI부터 정한다'는 순서예요. 자원(명사)을 먼저 찾고 URI는 맨 마지막에 정해요.\n올바른 순서는 ①도메인에서 명사(학생·수업·수강) 찾기 → ②관계 파악(1:N, N:M) → ③자원 트리 만들기 → ④URI 정하기예요. 1:N은 한 학생이 여러 수강을 갖는 관계, N:M은 학생과 수업이 서로 여러 개씩 연결되는 관계라는 뜻이에요.\nURI부터 정하면 /getStudentCourses처럼 화면 기능 중심의 이름이 나오기 쉬워요. 집을 지을 때 방 구성을 먼저 정하고 문패를 다는 것과 같아요.", "456": "CRUD와 HTTP 메서드의 대응이 맞아서 O예요.\nCRUD는 Create(생성)·Read(조회)·Update(수정)·Delete(삭제), 데이터를 다루는 기본 4가지 동작이라는 뜻이에요. 이를 각각 POST·GET·PUT/PATCH·DELETE에 연결해요.\nUpdate가 두 개인 이유는 PUT은 자원을 통째로 교체하고, PATCH는 보낸 필드만 부분 수정하기 때문이에요. 예를 들어 학생 정보를 전부 다시 보낼 땐 PUT, 학년만 바꿀 땐 PATCH를 써요.", "457": "틀린 부분은 '반드시 200과 삭제된 객체를 돌려줘야 한다'예요. 돌려줄 내용이 없으면 204 No Content를 써요.\n204는 '요청은 성공했지만 응답 Body는 비어 있다'는 뜻의 상태 코드예요. 삭제는 결과가 '없어짐'이라 굳이 보낼 데이터가 없어서 204가 가장 흔해요.\n물론 삭제된 내용을 보여 주고 싶으면 200 + Body를 써도 틀린 건 아니에요. 핵심은 '반드시'가 아니라는 점이고, 204를 쓰면 Body를 넣으면 안 된다는 점도 함께 기억해요.", "458": "틀린 부분은 'POST는 멱등하다'예요. POST는 멱등하지 않아서 재전송하면 자원이 중복으로 생길 수 있어요.\n멱등(idempotent)은 같은 요청을 여러 번 보내도 서버의 결과 상태가 한 번 보낸 것과 같다는 뜻이에요. POST /orders를 두 번 보내면 주문이 두 개 생기니 멱등이 아니에요.\n응답을 못 받았다고 그냥 다시 보내면 결제·주문이 두 번 될 수 있어요. 그래서 요청마다 고유한 Idempotency-Key 헤더를 붙이고, 서버는 같은 키가 다시 오면 처음 결과를 그대로 돌려주는 방식으로 막아요.", "459": "틀린 부분은 'PUT은 멱등이 아니다'예요. PUT은 멱등이에요.\nPUT은 자원을 보낸 내용으로 통째로 교체하기 때문에, 같은 요청을 한 번 보내든 열 번 보내든 마지막 상태는 똑같아요. 이게 멱등이라는 뜻이에요.\n헷갈리기 쉬운 짝 개념이 '안전(safe)'이에요. 안전은 서버 상태를 아예 바꾸지 않는다는 뜻이라 GET만 해당돼요. PUT은 상태를 바꾸니 안전하지 않지만 여러 번 해도 결과가 같으니 멱등이에요. 반면 POST는 둘 다 아니에요.", "460": "멱등성은 응답 코드가 아니라 결과 상태로 판단한다는 점이 맞아서 O예요.\n멱등은 같은 요청을 여러 번 보내도 서버에 남는 상태가 한 번 보낸 것과 같다는 뜻이에요. 첫 DELETE는 204(삭제 성공), 두 번째는 이미 없으니 404가 와도, 서버 상태는 두 번 모두 '10번 학생 없음'으로 같아요.\n즉 응답이 달라지는 건 상관없어요. 그래서 네트워크 오류로 DELETE 응답을 못 받았을 때 다시 보내도 추가 피해가 없어 안전하게 재시도할 수 있어요.", "461": "PATCH의 멱등성이 형식에 따라 달라진다는 점이 맞아서 O예요.\n{\"grade\": 4}처럼 '이 값으로 바꿔라'라고 값을 지정하면 몇 번을 보내도 결과는 grade=4라서 사실상 멱등이에요. 하지만 '조회수를 1 늘려라' 같은 증가 연산은 보낼 때마다 값이 1씩 커지니 멱등이 아니에요.\n그래서 HTTP 규격은 PATCH를 멱등이라고 보장하지 않아요. 같은 메서드라도 Body에 무엇을 담느냐가 멱등성을 정한다는 점에서 PUT(항상 멱등)과 달라요.", "462": "PATCH의 두 가지 표준 형식이 맞아서 O예요.\nJSON Merge Patch(application/merge-patch+json, RFC 7396)는 바꿀 필드와 값을 그냥 적는 방식이에요. 예: {\"grade\": 4, \"email\": null}이면 학년은 4로, 이메일은 삭제예요.\nJSON Patch(application/json-patch+json, RFC 6902)는 명령 목록을 적는 방식이에요. 예: [{\"op\":\"replace\",\"path\":\"/grade\",\"value\":4}]. Merge Patch는 간단하고, JSON Patch는 배열 원소 추가·이동처럼 세밀한 조작에 유리해요.", "463": "틀린 부분은 '계약상 문제가 없다'예요. PUT인데 보낸 필드만 덮어쓰면 PUT의 약속을 어긴 거예요.\nPUT의 의미는 '보낸 내용으로 자원 전체를 교체한다'이고, 클라이언트는 이 의미를 믿고 코드를 짜요. 예를 들어 email을 지우려고 email 없이 PUT을 보냈는데 서버가 부분 수정처럼 동작하면 email이 그대로 남아요.\n이렇게 메서드 이름과 실제 동작이 다르면 클라이언트 버그로 이어져요. 부분 수정이 필요하면 PATCH로 따로 만들어 이름과 동작을 일치시켜요.", "464": "상태 하나만 바뀌는 행위는 상태 필드를 PATCH하는 게 가장 REST답다는 점이 맞아서 O예요.\n'취소'는 동사지만, 결과적으로 수강 자원의 status 값이 active에서 cancelled로 바뀌는 것뿐이에요. 그래서 /cancelEnrollment 같은 동사 URI를 만들지 않고 자원의 상태를 수정하는 PATCH로 표현해요.\n판단 기준 ①(A안)이 이 경우예요. 행위를 '상태 변경'으로 바꿔 생각하면 URI는 명사(자원)만 유지하고 메서드로 행위를 표현하는 REST 원칙을 지킬 수 있어요.", "465": "행위에 기록이 필요하면 행위를 자원으로 명사화할 수 있다는 점이 맞아서 O예요.\n명사화는 '취소하다'라는 행위를 '취소(cancellation)'라는 하나의 자원으로 바꿔 다룬다는 뜻이에요. 취소 사유·처리자·승인 여부 같은 정보를 함께 저장해야 한다면 status 필드 하나로는 부족해요.\n그래서 POST /enrollments/5/cancellation {\"reason\":\"시간표 충돌\"}처럼 취소 기록을 새로 만들어요(판단 기준 B안). 상태만 바뀌면 A(PATCH), 행위 자체에 남길 정보가 있으면 B(POST로 명사화)로 구분해요.", "466": "틀린 부분은 '사용자가 직접 누르지 않는 한 문제없다'예요. GET은 사람이 안 눌러도 자동으로 요청될 수 있어요.\nGET은 '안전(safe)'해야 한다는 약속, 곧 서버 상태를 바꾸지 않는다는 전제로 쓰이는 메서드예요. 그래서 검색 엔진 크롤러는 링크를 마구 따라가고, 브라우저는 빨리 보여 주려고 링크를 미리 요청(프리페치)해요.\n취소 기능이 GET 링크라면 크롤러가 지나가기만 해도 수강이 취소될 수 있어요. 상태를 바꾸는 작업은 PATCH나 POST로 만들어야 해요.", "467": "인증 정보가 없거나 틀리면 401이라는 점이 맞아서 O예요.\n상태 코드 결정 흐름은 인증 → 권한 → 형식 → 존재 → 충돌 → 한도 순서로 확인해요. 맨 처음 '누구인지'를 확인해서 토큰이 없거나 만료·위조되었으면 401, 누구인지 알지만 권한이 없으면 403, 요청 형식이 틀리면 400/422, 자원이 없으면 404, 현재 상태와 충돌하면 409, 한도를 넘으면 429예요.\n순서가 중요한 이유는, 로그인도 안 한 사람에게 '그 자원은 없어요(404)'라고 먼저 알려 주면 정보가 새기 때문이에요.", "468": "중복 등록에 409 Conflict가 맞아서 O예요.\n409는 '요청 자체는 형식이 맞지만, 서버의 현재 상태와 부딪혀서 처리할 수 없다'는 뜻이에요. 학번 20231234가 이미 있는데 같은 학번으로 POST하면 데이터는 멀쩡하지만 이미 있는 자원과 충돌하는 거예요.\n짝 개념과 비교하면, 학번이 숫자가 아니라서 규칙을 어긴 건 422(검증 실패), JSON이 깨진 건 400이에요. 409는 '요청은 멀쩡한데 지금 상황 때문에 안 된다'는 점이 달라요.", "469": "틀린 부분은 '503을 반환한다'예요. 한 클라이언트가 정해진 요청 한도를 넘으면 429 Too Many Requests예요.\n429는 '당신이 너무 자주 요청했으니 잠시 후 다시 오라'는 뜻으로, 클라이언트별 속도 제한(Rate Limit)에 걸렸을 때 써요. 보통 Retry-After 헤더로 언제 다시 시도하면 되는지 알려 줘요.\n503 Service Unavailable은 특정 클라이언트 때문이 아니라 서버 자체가 과부하이거나 점검 중이라 아무도 못 쓰는 상황이라는 뜻이에요. 429는 '당신 문제', 503은 '서버 사정'으로 구분해요.", "470": "202 Accepted의 쓰임새가 맞아서 O예요.\n202는 '요청을 잘 받았고 처리는 나중에 하겠다'는 뜻이에요. 비동기 작업은 응답을 먼저 주고 실제 처리는 뒤에서 따로 진행하는 방식이라는 뜻이에요. AI 추론이나 동영상 변환처럼 오래 걸리는 일을 대기열(큐)에 넣을 때 써요.\n카페에서 주문을 받고 진동벨을 주는 것과 같아요. 주문은 접수됐지만 커피가 나온 건 아니에요. 그래서 보통 작업 상태를 확인할 주소(예: /jobs/7)를 함께 알려 주고, 클라이언트는 그 주소로 진행 상황을 조회해요.", "471": "틀린 부분은 '400이 적절하다'예요. DB 연결이 끊긴 건 서버 쪽 문제라 500 Internal Server Error예요.\n4xx는 클라이언트가 요청을 잘못 보내서 클라이언트가 고쳐야 하는 오류, 5xx는 요청은 멀쩡한데 서버가 처리하지 못한 오류라는 뜻이에요. 400 Bad Request는 JSON이 깨지는 등 요청 자체가 이상할 때 써요.\n클라이언트 입장에서 400을 받으면 '내 요청을 고쳐야 하나?' 하고 헤매게 돼요. 500을 받으면 '내 잘못이 아니니 잠시 후 다시 시도하자'고 판단할 수 있어요.", "472": "타입이 맞지 않는 값에 422가 맞아서 O예요.\n{\"grade\": \"삼학년\"}은 JSON 문법으로는 아무 문제가 없어요. 하지만 Schema(데이터가 가져야 할 모양과 규칙을 정한 것)에서 grade를 int로 선언했다면 '삼학년'은 정수로 바꿀 수 없어 규칙 위반이에요.\nFastAPI는 Pydantic으로 이 검사를 handler 실행 전에 해서 422 Unprocessable Entity와 함께 어떤 필드가 왜 틀렸는지 알려 줘요. 참고로 \"3\"처럼 숫자로 바꿀 수 있는 문자열은 기본 설정에서 자동 변환돼 통과해요.", "473": "400과 422의 구분이 맞아서 O예요.\n400 Bad Request는 JSON 괄호가 안 닫히는 등 요청을 아예 해석할 수 없을 때, 422 Unprocessable Entity는 해석은 되지만 값이 규칙(타입·범위·필수 여부)을 어겼을 때 쓴다는 뜻이에요.\n문장으로 비유하면 400은 맞춤법이 엉망이라 읽을 수조차 없는 글, 422는 문장은 맞는데 '나이: 마이너스 5살'처럼 내용이 말이 안 되는 글이에요. FastAPI는 Pydantic 검증 실패를 422로 응답해요.", "474": "틀린 부분은 'Content-Type이 application/json이어야 한다'예요. Problem Details의 Content-Type은 application/problem+json이에요.\nRFC 9457 Problem Details는 HTTP API 오류 응답의 모양을 표준으로 정한 규격이라는 뜻이에요. type(오류 종류 URI), title(짧은 제목), status(상태 코드), detail(구체 설명), instance(문제가 난 요청 위치) 필드를 써요.\n전용 Content-Type을 쓰면 클라이언트가 Body를 열기 전에 '이건 표준 오류 응답이구나' 하고 알아볼 수 있어요. 내용은 JSON 문법 그대로라 파싱 방법은 같아요.", "475": "틀린 부분은 'stack trace와 SQL 문을 포함하는 것이 좋다'예요. 이런 정보는 절대 응답에 넣지 않아요.\nstack trace는 오류가 난 지점까지 함수가 어떻게 호출됐는지 보여 주는 기록이라는 뜻이에요. 여기에는 파일 경로, 사용한 라이브러리 버전, 테이블 이름 같은 내부 정보가 들어 있어서 공격자에게 침입 지도를 건네주는 셈이에요.\n디버깅 정보는 서버 로그에만 남기고, 클라이언트에는 Problem Details처럼 '무슨 문제인지'만 알려 줘요. 필요하면 로그와 연결할 수 있는 요청 id 정도만 함께 보내요.", "476": "Endpoint가 Method + Path의 조합이라는 점이 맞아서 O예요.\nEndpoint는 서버가 요청을 받아 처리하는 하나의 입구라는 뜻이고, 경로만이 아니라 메서드까지 합쳐서 구분해요. 그래서 GET /students/10(조회)과 DELETE /students/10(삭제)은 주소가 같아도 서로 다른 handler 함수로 연결돼요.\nFastAPI에서도 @app.get(\"/students/{sid}\")와 @app.delete(\"/students/{sid}\")를 따로 정의해요. 같은 집 주소라도 '초인종 누르기'와 '택배 놓고 가기'가 다른 일인 것과 같아요.", "477": "틀린 부분은 '404 Not Found가 반환된다'예요. 경로는 있는데 그 메서드가 없으면 405 Method Not Allowed예요.\n404는 '그런 주소 자체가 없다', 405는 '주소는 있지만 그 방식으로는 안 된다'는 뜻이에요. 예를 들어 /students/10에 GET은 있는데 DELETE handler가 없으면 DELETE 요청에 405가 와요.\n405 응답에는 Allow 헤더(예: Allow: GET, PATCH)가 붙어서 이 경로에서 쓸 수 있는 메서드를 알려 줘요. 이 구분 덕분에 클라이언트는 오타인지, 메서드를 잘못 골랐는지 알 수 있어요.", "478": "타입 선언으로 변환과 검증이 자동으로 된다는 점이 맞아서 O예요.\nPath parameter는 /students/{sid}처럼 경로 안에서 바뀌는 부분이라는 뜻이에요. URL은 원래 전부 문자열이라 /students/10의 10도 처음엔 문자 '10'이에요. sid: int로 선언하면 FastAPI가 Pydantic으로 정수 10으로 바꿔서 handler에 넘겨줘요.\n/students/abc처럼 숫자로 바꿀 수 없는 값이 오면 handler를 실행하지 않고 422로 응답해요. 개발자가 int(sid)나 예외 처리를 직접 쓸 필요가 없는 거예요.", "479": "틀린 부분은 'endpoint마다 OPTIONS handler를 따로 만들어야 한다'예요. CORS middleware가 대신 처리해요.\nMiddleware는 요청이 handler에 닿기 전·후에 공통 처리를 해 주는 중간 단계라는 뜻이에요. FastAPI의 CORSMiddleware는 Router(경로별 handler 연결)보다 먼저 동작해서, OPTIONS Preflight가 오면 handler까지 가지 않고 허용 헤더를 담아 바로 응답해요.\n그래서 app.add_middleware(CORSMiddleware, allow_origins=[...], ...)만 설정하면 돼요. 반대로 미들웨어 없이 OPTIONS가 router까지 가면 405가 나서 Preflight가 실패해요.", "480": "response_model이 응답 필터 역할을 한다는 점이 맞아서 O예요.\nresponse_model은 FastAPI에서 '응답은 이 Schema 모양으로만 내보낸다'고 지정하는 옵션이라는 뜻이에요. DB에서 꺼낸 객체에 password_hash 같은 필드가 있어도, 응답 모델(예: StudentOut)에 없는 필드는 자동으로 빠져요.\n입력 검증이 '이상한 데이터가 들어오지 못하게' 막는 문이라면, 출력 필터링은 '보내면 안 되는 데이터가 나가지 못하게' 막는 문이에요. 개발자가 실수로 DB 객체를 그대로 return해도 안전하게 지켜 줘요.", "481": "틀린 부분은 '별도로 실행되는 독립 검증 서버'예요. Pydantic은 서버가 아니라 파이썬 라이브러리예요.\n라이브러리는 프로그램 안에 불러와 함수처럼 쓰는 코드 묶음이라는 뜻이에요. FastAPI는 내부에서 Pydantic을 불러 써서 요청 데이터를 검증하고, 같은 파이썬 프로세스 안에서 함께 동작해요. 네트워크로 다른 서버에 물어보는 구조가 아니에요.\n그래서 따로 띄울 것 없이 pip install로 설치되고, FastAPI 없이도 일반 파이썬 코드에서 데이터 검증용으로 쓸 수 있어요.", "482": "틀린 부분은 '작은따옴표로 감싸도 된다'예요. JSON의 키 이름과 문자열 값은 반드시 큰따옴표를 써요.\n{'name': 'Kim'}은 파이썬 딕셔너리나 JS 객체에서는 되지만 JSON 문법으로는 오류예요. 올바른 JSON은 {\"name\": \"Kim\"}이에요. 또 JS 객체처럼 {name: \"Kim\"}으로 따옴표를 아예 빼는 것도 안 돼요.\n서버가 이런 Body를 받으면 해석 자체가 안 되니 FastAPI는 JSON 파싱 오류로 422를 돌려줘요. 파이썬에서는 json.dumps(), JS에서는 JSON.stringify()로 만들면 이런 실수를 피할 수 있어요.", "483": "틀린 부분은 '마지막 쉼표나 주석을 넣어도 된다'예요. JSON은 둘 다 허용하지 않아요.\n마지막 쉼표(trailing comma)는 {\"a\": 1, \"b\": 2,}처럼 마지막 항목 뒤에 붙는 쉼표라는 뜻이에요. JS 코드나 파이썬에서는 괜찮지만 JSON 규격에서는 문법 오류예요. // 나 /* */ 같은 주석도 JSON에는 없어요.\n그래서 손으로 JSON을 쓰다가 쉼표 하나 때문에 서버가 요청을 거절하는 일이 흔해요. 설명이 필요하면 주석 대신 \"description\" 같은 필드를 따로 두거나 API 문서에 적어요.", "484": "틀린 부분은 'JSON에 날짜 전용 타입이 있다'예요. JSON의 타입은 문자열·숫자·불리언·null·객체·배열 여섯 가지뿐이에요.\n그래서 날짜는 보통 ISO 8601 형식의 문자열로 보내요. ISO 8601은 날짜·시간을 \"2026-10-16T09:00:00+09:00\"처럼 연-월-일T시:분:초+시간대로 적는 국제 표준이라는 뜻이에요.\n시간대(+09:00)를 꼭 붙이는 게 중요해요. 빼면 서버와 클라이언트가 서로 다른 시간대로 해석해서 9시간 차이가 날 수 있어요. Pydantic에서 datetime 타입으로 선언하면 이 문자열을 자동으로 변환해 줘요.", "485": "PATCH에서 null과 누락을 구분한다는 점이 맞아서 O예요.\nJSON Merge Patch 규칙에서 {\"email\": null}은 '이메일 값을 지워라'라는 명시적인 요청이고, email 필드 자체가 Body에 없으면 '이메일은 건드리지 마라'라는 뜻이에요.\n예를 들어 {\"grade\": 4}만 보내면 학년만 바뀌고 이메일은 그대로, {\"grade\": 4, \"email\": null}을 보내면 학년이 바뀌고 이메일은 삭제돼요. FastAPI에서는 model_dump(exclude_unset=True)로 '보낸 필드만' 골라내서 이 둘을 구분해요.", "486": "큰 정수 ID를 문자열로 보내는 이유가 맞아서 O예요.\nJS의 Number는 64비트 부동소수점 방식이라 정수를 정확히 표현할 수 있는 범위가 약 2^53(Number.MAX_SAFE_INTEGER = 2^53-1)까지예요. 부동소수점은 큰 수를 근삿값으로 저장하는 방식이라는 뜻이에요.\n64-bit ID(최대 약 2^63)를 숫자로 보내면 JSON.parse 단계에서 끝자리가 반올림돼 다른 ID로 바뀔 수 있어요. 예를 들어 9007199254740993이 ...992로 바뀌어 엉뚱한 자원을 조회하게 돼요. 그래서 트위터 같은 서비스도 \"id_str\"처럼 문자열로 함께 보내요.", "487": "요청·응답 Schema를 나누면 실수를 막을 수 있다는 점이 맞아서 O예요.\n하나의 모델로 다 쓰면 요청에서 id를 클라이언트가 마음대로 정하거나, 응답에 password가 섞여 나가는 실수가 생겨요. 그래서 StudentIn(생성 요청: id 없음, password 있음), StudentOut(응답: id 있음, password 없음), StudentPatch(부분 수정: 모든 필드 선택)처럼 용도별로 나눠요.\n각 Schema가 '이 상황에 들어오고 나가도 되는 필드'를 정확히 정하니, 코드에서 따로 지우거나 막지 않아도 구조적으로 안전해져요.", "488": "Pydantic 모델 하나가 세 역할을 한다는 점이 맞아서 O예요.\n요청 Body 타입으로 쓰면 입력 검증(규칙 어기면 422), response_model로 쓰면 응답 필터링(정의 안 된 필드 제거), 그리고 FastAPI가 이 모델을 읽어 OpenAPI 문서(/docs)에 요청·응답 형식을 자동으로 그려요.\n문서와 코드가 같은 원본에서 나오니 '문서엔 이렇게 써 있는데 실제론 달라요' 같은 불일치가 생기지 않아요. 그래서 Schema를 문서로만 존재하는 게 아니라 실제로 검사까지 하는 '실행 가능한 계약'이라고 불러요.", "489": "Offset 페이지네이션의 두 가지 약점이 맞아서 O예요.\nOffset 방식은 ?offset=1000&limit=20처럼 '앞에서 1000개 건너뛰고 20개'를 요청하는 방식이라는 뜻이에요. DB는 건너뛸 1000개를 실제로 하나씩 세고 버려야 해서 뒤 페이지로 갈수록 느려져요.\n또 1페이지를 본 사이 맨 앞에 새 글이 하나 추가되면, 모든 항목이 한 칸씩 밀려 2페이지 첫 항목이 1페이지 마지막과 겹쳐요(중복). 삭제가 생기면 반대로 하나를 건너뛰어요(누락). Cursor 방식은 '마지막으로 본 항목 다음부터'로 이 문제를 줄여요.", "490": "틀린 부분은 '임의 페이지 점프에 유리하다'예요. Cursor 방식은 임의 페이지로 바로 이동할 수 없어요.\nCursor 페이지네이션은 응답에 '마지막으로 본 위치(cursor)'를 주고, 다음 요청에서 ?cursor=abc처럼 그 다음부터 읽는 방식이라는 뜻이에요. 책갈피를 꽂아 두고 이어 읽는 것과 같아서, 7페이지 위치를 알려면 1~6페이지를 차례로 지나야 해요.\n대신 DB가 앞부분을 세고 버리지 않아 데이터가 수백만 건이어도 속도가 일정하고, 중간 삽입에도 중복·누락이 잘 안 생겨요. 그래서 SNS 무한 스크롤에 주로 쓰고, 페이지 번호 이동이 필요한 게시판은 Offset을 써요.", "491": "limit에 최대값을 강제해야 한다는 점이 맞아서 O예요.\nlimit은 한 번에 몇 개를 받을지 정하는 쿼리 값이라는 뜻이에요. 서버가 클라이언트 값을 그대로 믿으면 ?limit=1000000 한 번에 DB가 백만 건을 읽고, 메모리와 네트워크가 그걸 다 실어 나르느라 다른 요청까지 멈출 수 있어요.\n그래서 기본값(예: 20)과 최대값(예: 100)을 정해 두고, 넘는 값은 최대값으로 줄이거나 422로 거절해요. FastAPI에서는 limit: int = Query(20, le=100)처럼 선언으로 간단히 막을 수 있어요.", "492": "응답 필드 추가가 Non-breaking 변경이라는 점이 맞아서 O예요.\nNon-breaking 변경은 기존 클라이언트를 고치지 않아도 계속 동작하는 변경이라는 뜻이에요. 응답에 nickname 필드를 새로 넣어도, 기존 클라이언트는 원래 쓰던 name·grade만 읽으면 되니 영향이 없어요.\n이게 가능하려면 클라이언트가 Tolerant Reader 원칙, 곧 '모르는 필드가 와도 오류 내지 말고 무시하라'를 지켜야 해요. 반대로 필드 삭제·이름 변경·타입 변경은 기존 클라이언트를 깨는 Breaking 변경이라 새 버전이 필요해요.", "493": "틀린 부분은 '하위 호환을 유지하는 변경'이라는 부분이에요. 선택 필드를 필수로 바꾸면 호환이 깨져요.\n하위 호환은 기존 클라이언트가 수정 없이도 계속 동작한다는 뜻이에요. 지금까지 phone을 안 보내던 클라이언트는 phone이 필수가 되는 순간 모든 요청이 422로 실패해요.\n이런 Breaking 변경은 /v2처럼 새 버전으로 내야 해요. 반대 방향, 곧 필수 요청 필드를 선택으로 바꾸는 건 기존 클라이언트가 계속 보내도 문제없으니 Non-breaking이에요. '요청은 느슨하게, 응답은 추가만'이라고 기억하면 쉬워요.", "494": "Swagger와 OpenAPI의 구분이 맞아서 O예요.\nOpenAPI는 REST API의 경로·메서드·요청/응답 형식을 JSON이나 YAML로 적는 표준 명세 형식이라는 뜻이에요. Swagger는 원래 이 명세의 옛 이름이었고, 지금은 그 명세를 화면으로 보여 주는 Swagger UI, 편집기 Swagger Editor 같은 도구 이름으로 쓰여요.\nFastAPI에서는 /openapi.json이 OpenAPI 명세 파일이고, /docs가 그 명세를 Swagger UI로 그린 화면이에요. 그래서 'Swagger 문서 주세요'는 보통 이 둘 중 하나를 달라는 뜻이에요.", "495": "/docs는 같은 Origin 페이지라 CORS 검사가 없다는 점이 맞아서 O예요.\nSwagger UI 페이지(http://localhost:8000/docs)는 API 서버가 직접 제공하니, 그 페이지의 JS가 http://localhost:8000/students로 요청해도 scheme·host·port가 모두 같아 같은 Origin이에요. CORS는 다른 Origin끼리일 때만 적용돼요.\n하지만 내 프론트(http://localhost:5500)는 포트가 달라 다른 Origin이에요. 그래서 'Swagger에선 되는데 내 프론트에선 안 돼요'라는 상황이 생기고, 이때는 API 로직이 아니라 서버의 CORS 허용 설정을 확인해야 해요.", "496": "틀린 부분은 '데이터를 전혀 저장하지 않는다'예요. Stateless는 대화 상태(세션)를 서버 메모리에 두지 않는다는 뜻이지, 데이터 저장을 금지하는 게 아니에요.\n자원 상태는 학생 정보처럼 DB에 저장되는 데이터이고, 세션 상태는 '이 사용자가 방금 로그인했고 2단계까지 진행했다' 같은 요청 사이의 대화 맥락이라는 뜻이에요. Stateless는 후자를 서버가 기억하지 않고 요청마다 토큰 등으로 다 담아 보내라는 거예요.\n카페 비유로, 단골 얼굴을 기억하는 대신 매번 회원 카드를 내밀게 하는 것과 같아요. 메뉴와 재고(DB)는 당연히 가게에 있어요.", "497": "틀린 부분은 '요청이 서버에 도달하지 않았다'예요. Simple Request는 서버까지 가서 처리까지 끝난 상태예요.\nSimple Request는 Preflight 없이 바로 보내지는 요청이에요. 서버는 요청을 받아 실행하고 응답을 보내는데, 그 응답에 Access-Control-Allow-Origin이 없으면 브라우저가 '이 페이지 JS에는 결과를 보여 주지 않겠다'며 막는 거예요.\n그래서 POST였다면 DB에 데이터가 이미 저장됐을 수도 있어요(부작용). 개발자 도구 Network 탭에 200이 찍혀 있는데 콘솔엔 CORS 오류가 나는 이유가 이거예요. CORS는 요청을 막는 게 아니라 응답 읽기를 막는 규칙이에요.", "498": "Preflight가 실패하면 본 요청이 안 나간다는 점이 맞아서 O예요.\nPreflight는 브라우저가 PATCH·DELETE나 JSON 요청 같은 비단순 요청 전에 OPTIONS로 '이 메서드·헤더로 보내도 되나요?'라고 먼저 묻는 단계예요. 서버가 허락하는 헤더(Access-Control-Allow-Methods 등)로 답해야 실제 요청을 보내요.\nOPTIONS 응답이 404·405·401이거나 허용 헤더가 빠져 있으면 브라우저는 거기서 멈춰요. 그래서 Simple Request와 달리 서버 데이터는 전혀 바뀌지 않아요. Network 탭에 OPTIONS만 보이고 PATCH가 없다면 이 경우예요.", "499": "Expose-Headers 없이는 JS가 Location을 못 읽는다는 점이 맞아서 O예요.\nCORS 응답에서 다른 Origin의 JS가 읽을 수 있는 응답 헤더는 Content-Type, Cache-Control 같은 기본 목록(CORS-safelisted)뿐이에요. Location은 여기에 없어서, 서버가 실제로 보냈더라도 r.headers.get(\"Location\")은 null이 돼요.\n서버가 Access-Control-Expose-Headers: Location으로 '이 헤더도 JS에 보여 줘도 된다'고 열어 줘야 읽을 수 있어요. FastAPI에서는 CORSMiddleware의 expose_headers=[\"Location\"]으로 설정해요. 201 + Location을 활용하려면 꼭 함께 챙겨야 해요.", "p1": "문장에서 '1 Gbps면 latency도 항상 낮다'는 부분이 틀렸어요. 1 Gbps는 대역폭(Bandwidth), 즉 1초에 얼마나 많은 데이터를 실어 보낼 수 있는지를 나타내는 값이고, 지연(Latency)은 데이터 한 조각이 출발해서 도착할 때까지 걸리는 시간이라는 뜻이에요. 지연은 빛의 속도로도 줄일 수 없는 물리적 거리, 거쳐 가는 라우터 수, 큐 대기 시간에 좌우돼요. 고속도로에 비유하면 대역폭은 차선 수, 지연은 서울에서 부산까지 걸리는 시간이에요. 차선이 10개여도 거리가 멀면 도착은 늦어요.", "p2": "'다른 사람의 컴퓨터라고만 이해해도 충분하다'는 부분이 틀렸어요. 물리적으로는 원격 데이터센터의 컴퓨터가 맞지만, Cloud의 핵심은 필요할 때 자원을 빠르게 늘리고 줄이며(확장성), 데이터베이스·로드밸런서 같은 관리형 서비스를 빌려 쓰는 운영 방식이라는 점이에요. VPC는 클라우드 안에 만드는 나만의 격리된 가상 네트워크라는 뜻이고, Subnet은 그 안을 나눈 작은 구역이에요. 설계자는 이런 네트워크 구조뿐 아니라 사용량만큼 나오는 요금, 특정 업체 서비스에 묶이는 의존성까지 따져야 해요.", "p3": "'장치 종류가 아니라 통신에서의 역할'이라는 부분이 정확해서 O예요. Client는 먼저 요청을 보내는 쪽, Server는 요청을 기다렸다가 응답해 주는 쪽이라는 뜻이에요. 그래서 비싼 서버용 하드웨어가 아니어도 서버 프로그램을 실행하면 그 순간 Server 역할을 해요. 예를 들어 노트북에서 python -m http.server를 켜면 노트북이 Server가 되고, 같은 노트북의 브라우저는 Client가 돼요. 반대로 데이터센터 서버도 다른 API를 호출할 때는 Client예요.", "p4": "'Cloud를 완전히 대체한다'는 부분이 틀렸어요. Edge computing은 데이터가 생기는 곳(카메라, 공장 기기, 스마트폰 등) 가까이에서 바로 처리하는 방식이라는 뜻이에요. 왕복 시간이 짧아 즉각 반응이 필요한 일에 좋지만, 저장 공간과 연산 능력은 제한적이에요. 그래서 Edge는 실시간 판단을, Cloud는 오랜 기간의 데이터 저장, 여러 지점 데이터를 모은 통합 분석, AI 모델 재학습·배포를 맡아요. 자율주행차가 브레이크 판단은 차 안에서 하고, 주행 기록은 클라우드에 올려 모델을 개선하는 것이 좋은 예예요.", "p5": "'AI 서비스도 결국 request와 response를 주고받는다'는 내용이 맞아서 O예요. AI라고 해서 특별한 통로가 있는 게 아니라, 일반 웹 서비스와 똑같이 네트워크 위에서 동작해요. 브라우저가 DNS로 서버 주소를 찾고, 인터넷을 거쳐 로드밸런서(LB, 여러 서버에 요청을 나눠 주는 장치라는 뜻이에요)에 도착하면, API 서버가 GPU 서버에 추론을 맡기고 결과를 돌려줘요. 그래서 AI 응답이 느릴 때는 모델 연산 시간뿐 아니라 DNS, 네트워크 지연, 서버 대기 시간도 함께 의심해야 해요.", "p6": "'단일 네트워크가 아니라 공통 프로토콜(IP)로 연결된 독립 네트워크들의 집합'이라는 설명이 정확해서 O예요. 통신사, 대학, 기업, 클라우드 업체는 각자 자기 네트워크를 따로 운영해요. 이렇게 하나의 관리 주체가 운영하는 네트워크 단위를 AS(자율 시스템)라고 해요. 이들이 서로 연결되고, 모두 IP라는 같은 주소 체계와 규칙을 쓰기 때문에 패킷이 여러 네트워크를 넘나들 수 있어요. 나라마다 도로 관리 기관은 달라도 교통 규칙이 통일돼 있어 국경을 넘어 운전할 수 있는 것과 비슷해요.", "p7": "이 문장은 Router에 대한 설명이라 X예요. Switch는 같은 네트워크(LAN, 한 건물이나 집 안 같은 근거리 네트워크라는 뜻이에요) 안에서 MAC 주소를 보고 프레임을 해당 포트로 전달하는 L2 장비예요. MAC 주소는 네트워크 카드에 붙은 하드웨어 주소예요. 반면 Router는 서로 다른 네트워크 사이에서 IP 주소를 보고 다음 경로를 정하는 L3 장비예요. 비유하면 Switch는 아파트 단지 안에서 동·호수로 택배를 나르는 직원이고, Router는 도시와 도시 사이 경로를 정하는 물류센터예요.", "p8": "'링크를 공유하므로 몰리면 혼잡으로 지연과 손실이 발생할 수 있다'는 설명이 맞아서 O예요. Packet switching은 데이터를 작은 패킷으로 쪼개 링크를 여러 사용자가 그때그때 나눠 쓰는 방식이라는 뜻이에요. 빈 시간 없이 링크를 쓸 수 있어 효율적이지만, 동시에 많이 몰리면 라우터 큐(대기열)에서 기다리느라 지연이 늘고, 큐가 꽉 차면 패킷이 버려져요. 반대 개념인 Circuit switching은 옛 전화망처럼 통화 전에 회선을 예약해 두는 방식이라 품질은 일정하지만, 말을 안 하는 동안에도 회선이 낭비돼요.", "p9": "이 문장은 Bandwidth(대역폭)에 대한 설명이라 X예요. Bandwidth는 링크가 이론적으로 낼 수 있는 최대 전송 능력이고, Throughput(처리량)은 일정 시간 동안 실제로 전달에 성공한 데이터량이라는 뜻이에요. 실제 환경에서는 혼잡, 패킷 손실과 재전송, 프로토콜 오버헤드, 상대 서버 속도 때문에 Throughput이 Bandwidth보다 낮게 나오는 게 보통이에요. 예를 들어 1 Gbps 인터넷 요금제(Bandwidth)를 써도 속도 측정 사이트에서는 600 Mbps(Throughput)가 나올 수 있어요.", "p10": "'주소, Port, Path의 조합으로 표현되는 구체적 접근 지점'이라는 설명이 맞아서 O예요. Endpoint는 클라이언트가 특정 기능을 쓰기 위해 요청을 보내는 정확한 목적지라는 뜻이에요. https://api.example.com:443/users에서 api.example.com은 어느 서버인지, 443은 그 서버의 어느 프로그램인지, /users는 그 프로그램의 어떤 기능인지를 가리켜요. 같은 서버·같은 포트라도 /users와 /orders는 서로 다른 Endpoint예요. 건물 주소, 층, 호실까지 적어야 정확히 찾아가는 것과 비슷해요.", "p11": "'Broker 없이 직접 연결'과 '무거운 프로토콜'이라는 두 부분이 모두 틀렸어요. MQTT는 가운데에 Broker(메시지를 받아 나눠 주는 중개 서버라는 뜻이에요)를 두는 Publish/Subscribe 방식이에요. 발행자는 'home/temp' 같은 토픽에 메시지를 올리기만 하고, 그 토픽을 구독한 쪽이 Broker를 통해 받아요. 서로의 주소를 몰라도 되고 헤더가 아주 작아서, 배터리와 통신이 약한 IoT 센서에 잘 맞아요. HTTP처럼 매번 요청하고 응답받는 방식과 달리, 한 번 구독해 두면 새 값이 생길 때마다 밀어 받을 수 있어요.", "p12": "'한 Region 안에서 장애가 서로 전파되지 않도록 분리된 구역'이라는 설명이 맞아서 O예요. Region은 서울, 도쿄처럼 지리적으로 떨어진 큰 지역 단위이고, AZ는 그 Region 안에 있는 하나 이상의 데이터센터 묶음이라는 뜻이에요. AZ끼리는 전원, 냉각, 네트워크가 따로 있어 한 AZ에 정전이 나도 다른 AZ는 멀쩡해요. 그래서 서버를 AZ 두 곳 이상에 나눠 배치하는 것이 고가용성 설계의 기본이에요. 은행 지점이 한 도시 안 여러 동네에 흩어져 있는 것과 비슷해요.", "p13": "문장은 클라우드 추론(Remote Inference)을 설명하고 있어서 X예요. Local Inference는 스마트폰, 카메라, 임베디드 보드 같은 단말 안에서 AI 모델을 직접 실행해 결과를 내는 방식이라는 뜻이에요. 추론은 학습된 모델에 새 입력을 넣어 답을 얻는 단계예요. Local은 네트워크 왕복이 없어 빠르고, 데이터가 밖으로 안 나가 개인정보에 유리하지만, 단말 성능 때문에 작은 모델만 돌릴 수 있어요. 반대로 Remote는 큰 모델을 쓸 수 있지만 네트워크가 끊기면 동작하지 않아요.", "p14": "'네트워크 계층에서 동작한다'는 부분이 틀렸어요. HTTP(웹 요청), DNS(도메인 이름을 IP로 바꾸는 서비스), MQTT(IoT 메시지)는 모두 사용자 프로그램이 직접 쓰는 애플리케이션 계층 프로토콜이에요. 네트워크 계층은 패킷을 목적지 컴퓨터까지 어떤 경로로 보낼지 정하는 층으로, 대표 프로토콜이 IP예요. 그 사이에 있는 전송 계층에는 TCP와 UDP가 있어요. 택배에 비유하면 HTTP는 편지 내용 형식, TCP는 분실 없이 보내는 배송 방식, IP는 주소와 경로를 정하는 우편망이에요.", "p15": "'TCP 위에서 동작한다'는 부분이 틀렸고, 올바르게는 UDP 위에서 동작해요. QUIC은 구글이 만들고 HTTP/3의 기반이 된 전송 프로토콜이에요. TCP는 운영체제 커널 안에 있어 바꾸기 어렵고, TCP 연결 후 TLS 암호화 협상을 따로 해야 해서 왕복이 여러 번 필요해요. QUIC은 단순한 UDP 위에 재전송·순서 보장 같은 신뢰성 기능을 직접 얹고, TLS 1.3 협상을 연결 설정과 한 번에 처리해요. 그래서 첫 연결이 빠르고, 와이파이에서 LTE로 바뀌어도 연결을 유지할 수 있어요.", "p16": "'HTTP를 TLS로 암호화한 형태'이고 'TLS의 이전 이름이 SSL'이라는 두 부분이 모두 맞아서 O예요. TLS는 통신 내용을 암호화하고 상대 서버가 진짜인지 인증서로 확인하는 보안 프로토콜이라는 뜻이에요. SSL 3.0까지 쓰이다가 이름을 TLS 1.0으로 바꿔 발전시켰고, 옛 SSL은 취약점이 많아 지금은 쓰지 않아요. 그래도 습관처럼 'SSL 인증서'라는 말이 남아 있어요. HTTP는 엽서처럼 중간에서 내용이 다 보이고, HTTPS는 봉인된 편지처럼 받는 사람만 열어 볼 수 있어요.", "p17": "'문법 오류만 없으면 확인하지 않고 배포해도 된다'는 부분이 틀렸어요. 코드가 실행된다는 것과 안전하게 운영된다는 것은 다른 문제예요. 예를 들어 AI가 테스트 편의상 서버를 0.0.0.0에 bind(어느 주소로 연결을 받을지 정하는 것이라는 뜻이에요)하고 인증 없이 열어 두면, 문법상 문제는 없지만 외부에서 누구나 접근할 수 있어요. 그래서 사람이 포트, 방화벽 규칙, 인증 여부, 비밀키 노출, 로그 기록을 직접 검토해야 해요. 운전면허 필기를 통과했다고 바로 고속도로에 나가지 않는 것과 같아요.", "p18": "'같은 subnet에 속한다'는 부분이 틀렸어요. /24는 32비트 IP 주소 중 앞 24비트, 즉 앞의 세 옥텟(점으로 나뉜 8비트 묶음이라는 뜻이에요)이 네트워크 부분이라는 표시예요. 192.168.1.20은 네트워크 192.168.1.0, 192.168.2.20은 네트워크 192.168.2.0이라 서로 다른 동네예요. 그래서 둘이 통신하려면 Router를 거쳐야 해요. 만약 둘 다 /16이었다면 앞 두 옥텟(192.168)만 비교하므로 같은 subnet이 돼요. 이처럼 같은 주소라도 prefix 길이에 따라 결과가 달라져요.", "p19": "Broadcast 주소가 192.168.10.63이라는 계산이 맞아서 O예요. /26은 앞 26비트가 네트워크, 나머지 6비트가 호스트 부분이라 2의 6제곱인 64개 주소가 한 블록이에요. 그래서 192.168.10.0/26은 .0부터 .63까지예요. 블록의 첫 주소는 네트워크 자체를 가리키는 Network 주소, 마지막 주소는 그 subnet 전체에 한 번에 보내는 Broadcast 주소라는 뜻이에요. 같은 방식으로 다음 블록 192.168.10.64/26의 Broadcast는 .127이에요.", "p20": "'할당 가능한 주소가 64개'라는 부분이 틀렸고, 올바른 값은 62개예요. /26 블록에는 주소가 64개 있지만, 첫 주소 .0은 Network 주소(이 subnet 자체의 이름이라는 뜻이에요), 마지막 주소 .63은 Broadcast 주소로 예약돼 있어 PC나 서버에 줄 수 없어요. 그래서 호스트 수는 2의 n제곱에서 2를 뺀 값으로 계산해요. /24라면 256-2=254개, /30이라면 4-2=2개예요. 전체 주소 수와 사용 가능한 호스트 수를 구분하는 것이 시험에서 자주 나오는 함정이에요.", "p21": "'IP는 호스트를, Port는 그 안의 프로세스를 식별한다'는 설명이 맞아서 O예요. 127.0.0.1은 루프백(loopback) 주소로, 패킷을 밖으로 내보내지 않고 자기 자신에게 돌려보내는 특별한 주소라는 뜻이에요. 8000은 그 컴퓨터 안에서 실행 중인 여러 프로그램 중 어느 것에게 전달할지 정하는 번호예요. 아파트에 비유하면 IP는 건물 주소, Port는 호수예요. 그래서 한 컴퓨터에서 웹 서버는 8000, DB는 5432처럼 포트만 달리해서 여러 서비스를 동시에 띄울 수 있어요.", "p22": "'subnet 밖에 있으면 Default Gateway에 맡긴다'는 설명이 맞아서 O예요. 호스트는 자기 IP와 subnet mask로 목적지가 같은 동네인지 먼저 판단해요. 밖이라면 호스트는 경로를 모르기 때문에, 설정된 Default Gateway(외부로 나가는 출구 역할을 하는 라우터라는 뜻이에요)의 MAC 주소로 프레임을 보내요. 그러면 라우터가 다음 경로를 정해 넘겨 줘요. 집에서는 보통 공유기 주소(예: 192.168.0.1)가 Gateway예요. Gateway 설정이 틀리면 같은 공유기 안 기기끼리는 되는데 인터넷만 안 되는 증상이 생겨요.", "p23": "'같은 subnet 안에서도 항상 Gateway를 거쳐야 한다'는 부분이 틀렸어요. 목적지가 같은 subnet이면 호스트는 ARP로 상대의 MAC 주소를 알아낸 뒤, 스위치를 통해 프레임을 바로 보내요. ARP는 IP 주소로 MAC 주소를 알아내는 프로토콜이라는 뜻이에요. Default Gateway는 목적지가 subnet 밖일 때만 사용해요. 같은 반 친구에게 쪽지를 줄 때 교무실을 거치지 않고 직접 건네는 것과 같아요. 다른 학교로 보낼 때만 우체국(Gateway)을 이용하는 거예요.", "p24": "'MAC은 바뀌지만 목적지 IP는 그대로'라는 설명이 맞아서 O예요. MAC 주소는 바로 옆 장비까지 한 구간(hop)을 전달하기 위한 주소라서, 라우터를 지날 때마다 출발지 MAC은 그 라우터, 목적지 MAC은 다음 장비로 새로 써요. 반면 IP 주소는 처음 출발지부터 최종 목적지까지를 나타내는 주소라 바뀌지 않아요. 단, NAT 장비는 IP를 바꾸는 예외예요. 택배로 치면 IP는 송장에 적힌 최종 주소, MAC은 각 물류센터 사이를 옮기는 트럭 번호예요.", "p25": "'IPv4 주소에 해당하는 MAC 주소를 알아내는 프로토콜'이라는 설명이 맞아서 O예요. 스위치는 IP가 아니라 MAC으로 프레임을 전달하므로, IP만 알고 있으면 실제로 보낼 수 없어요. 그래서 ARP Request를 브로드캐스트(같은 네트워크의 모든 기기에게 보내는 것이라는 뜻이에요)로 보내 '192.168.0.5 쓰는 분?' 하고 묻고, 주인이 자기 MAC을 유니캐스트로 답해요. 결과는 ARP 캐시에 잠시 저장돼요. 참고로 IPv6에서는 ARP 대신 NDP라는 프로토콜이 같은 일을 해요.", "p26": "'공유기의 NAT가 Private 주소를 Public 주소로 바꿔 준다'는 설명이 맞아서 O예요. Private IP는 10.x, 172.16~31.x, 192.168.x처럼 내부망에서만 쓰기로 약속된 주소라는 뜻이고, 여러 집에서 같은 주소를 중복해서 쓰기 때문에 인터넷 라우터는 이 주소로 가는 길을 몰라요. 그래서 패킷이 나갈 때 공유기가 출발지를 자신의 Public IP로 바꾸고, 응답이 오면 기록해 둔 표를 보고 원래 PC에게 돌려줘요. 회사 대표번호로 전화가 오면 교환원이 내선으로 연결해 주는 것과 비슷해요.", "p27": "'Public Internet에 자동으로 공개된다'는 부분이 틀렸어요. 0.0.0.0에 bind한다는 것은 이 컴퓨터가 가진 모든 네트워크 인터페이스(유선, 와이파이, 루프백 등)로 들어오는 연결을 받겠다는 뜻이에요. 127.0.0.1에 bind하면 자기 자신만 접속할 수 있는 것과 비교되는 개념이에요. 하지만 실제로 외부에서 닿으려면 그 앞단의 OS 방화벽, 공유기 NAT(포트포워딩), 클라우드 Security Group이 모두 허용해야 해요. 가게 문을 열어 둬도 건물 정문이 잠겨 있으면 손님이 못 들어오는 것과 같아요.", "p28": "172.16.5.10이 Private 대역 안에 있어서 O예요. 172.16.0.0/12는 앞 12비트가 고정이라는 뜻인데, 두 번째 옥텟 기준으로 16부터 31까지 16개 값을 포함해요. 그래서 범위는 172.16.0.0부터 172.31.255.255까지이고, 172.16.5.10은 두 번째 옥텟이 16이라 이 안에 들어가요. Private 대역은 이것 말고도 10.0.0.0/8, 192.168.0.0/16까지 총 세 개예요. 집 공유기는 주로 192.168.x.x, 클라우드 VPC는 주로 10.x.x.x나 172.x 대역을 써요.", "p29": "'172.32.1.1이 Private 대역에 속한다'는 부분이 틀렸어요. 172.16.0.0/12는 두 번째 옥텟이 16~31인 주소만 포함해요. /12라는 건 앞 12비트, 즉 첫 옥텟 8비트와 두 번째 옥텟의 앞 4비트가 고정이라는 뜻이라, 두 번째 옥텟 아래 4비트로 16개 값(16~31)만 바뀔 수 있어요. 172.32는 그 범위를 하나 넘었기 때문에 인터넷에서 실제로 쓰이는 Public 주소예요. '172로 시작하면 다 사설'이라고 외우면 틀리기 쉬우니, 16~31이라는 경계를 꼭 기억해 두세요.", "p30": "'Prefix 길이를 줄여'라는 부분이 틀렸고, 올바르게는 늘려야 해요. Prefix 길이는 IP 주소에서 네트워크 부분이 몇 비트인지를 나타내는 숫자예요. /24에서 /26으로 늘리면 호스트 비트 2개를 네트워크 비트로 빌려 오게 되어, 256개짜리 한 덩어리가 64개짜리 네 개(2의 2제곱)로 나뉘어요. 반대로 /24 네 개를 /22 하나로 묶는 것처럼 Prefix를 줄이는 것은 Supernetting(경로 요약)이라는 뜻이에요. 피자를 더 많은 조각으로 자를수록 한 조각이 작아지는 것과 같아요.", "p31": "'prefix가 가장 짧은(가장 넓은) 경로를 선택한다'는 부분이 반대예요. Longest Prefix Match는 목적지 IP와 일치하는 경로가 여러 개일 때, prefix가 가장 긴 경로, 즉 가장 구체적으로 범위를 좁힌 경로를 고르는 라우팅 규칙이라는 뜻이에요. 예를 들어 10.1.2.5로 가는 패킷에 대해 10.0.0.0/8과 10.1.2.0/24가 둘 다 맞으면 /24를 선택해요. 길을 물을 때 '서울 방향'보다 '강남구 역삼동 방향' 표지판을 따르는 게 더 정확한 것과 같아요.", "p32": "'더 구체적인 경로가 없을 때 사용하는 기본 경로'라는 설명이 맞아서 O예요. 0.0.0.0/0은 고정된 네트워크 비트가 0개라서 세상의 모든 IP 주소와 일치해요. 하지만 Longest Prefix Match 규칙에서는 prefix가 가장 짧은 /0이 우선순위가 가장 낮기 때문에, 라우팅 표에 맞는 다른 경로가 하나도 없을 때만 선택돼요. 집 PC의 라우팅 표에도 '0.0.0.0/0 → 공유기'가 들어 있어서, 모르는 목적지는 전부 공유기로 보내요. 그래서 Default Gateway와 같은 역할을 표현한 경로라고 보면 돼요.", "p33": "DORA 순서가 Discover → Offer → Request → ACK로 맞아서 O예요. DHCP는 네트워크에 새로 붙은 기기에게 IP 주소, subnet mask, Gateway, DNS 서버 정보를 자동으로 나눠 주는 프로토콜이라는 뜻이에요. 기기는 아직 IP가 없어서 Discover를 브로드캐스트로 보내 서버를 찾고, 서버가 쓸 주소를 Offer로 제안하면, 기기가 그 주소를 쓰겠다고 Request하고, 서버가 ACK로 확정해요. Offer 다음에 Request가 한 번 더 있는 이유는 DHCP 서버가 여러 대일 때 어느 제안을 골랐는지 모두에게 알리기 위해서예요.", "p34": "'Lease Time과 무관하게 영구적으로 사용'이라는 부분이 틀렸어요. Lease Time은 DHCP 서버가 IP 주소를 빌려주는 기간이라는 뜻이에요. 기기는 보통 기간의 절반쯤 지나면 서버에 갱신을 요청해 계속 쓰고, 기기가 꺼져 갱신하지 못하면 만료 후 주소가 반납되어 다른 기기에게 갈 수 있어요. 덕분에 한정된 주소를 카페처럼 손님이 자주 바뀌는 곳에서도 돌려 쓸 수 있어요. 서버처럼 주소가 바뀌면 안 되는 기기는 DHCP 예약이나 고정 IP(Static IP)를 따로 설정해요.", "p35": "'IP와 함께 Port까지 변환하며 흔히 NAT라고 부른다'는 설명이 맞아서 O예요. 기본 NAT는 Private IP 하나를 Public IP 하나로 바꾸는 1:1 변환이라 Public IP가 기기 수만큼 필요해요. PAT(Port Address Translation)는 출발지 포트 번호까지 바꿔서 '공인IP:50001은 PC A, 공인IP:50002는 PC B'처럼 변환표에 기록해요. 그래서 Public IP 하나로 집 안 노트북, 폰, TV가 동시에 인터넷을 쓸 수 있어요. 우리가 집 공유기에서 쓰는 NAT는 사실 거의 다 이 PAT예요.", "p36": "적용 단위가 서로 뒤바뀌어 있어서 X예요. Security Group은 EC2 같은 개별 인스턴스(가상 서버라는 뜻이에요)에 붙는 방화벽이고, Network ACL은 서브넷 경계에서 그 안의 모든 인스턴스에 일괄 적용되는 규칙이에요. 또 다른 차이로, Security Group은 상태 저장(stateful)이라 들어온 요청의 응답은 자동으로 허용되고 허용 규칙만 쓸 수 있어요. Network ACL은 상태 비저장(stateless)이라 응답 방향도 따로 열어야 하고 거부 규칙도 쓸 수 있어요. 비유하면 Security Group은 각 방의 문, Network ACL은 층 입구의 출입 통제예요.", "p37": "'인터넷에서 직접 접근할 수 없고, 나갈 때는 NAT Gateway를 쓸 수 있다'는 설명이 맞아서 O예요. Private Subnet은 라우팅 표에 Internet Gateway로 가는 경로가 없는 서브넷이라는 뜻이에요. 그래서 외부에서 먼저 연결을 걸 수 없어 DB나 내부 API 서버를 숨기기 좋아요. 그래도 보안 패치나 패키지 다운로드처럼 안에서 밖으로 나가야 할 때가 있어서, Public Subnet에 둔 NAT Gateway를 통해 나가는 연결만 허용해요. 집 공유기처럼 안에서 시작한 통신의 응답만 들어오는 구조예요.", "p38": "문장은 Connection timed out을 설명하고 있어서 X예요. Connection refused는 패킷이 상대 컴퓨터까지 잘 도착했지만, 그 포트에서 기다리는(listen) 프로그램이 없어서 운영체제가 RST(연결 거절 신호라는 뜻이에요)로 즉시 거절한 상황이에요. 그래서 서버 프로그램이 꺼졌거나 포트 번호가 틀렸는지 먼저 봐야 해요. 반면 timed out은 아무 답도 없이 기다리다 시간이 초과된 것이라 방화벽이 패킷을 조용히 버렸거나 경로가 끊긴 경우가 많아요. 전화로 치면 refused는 '없는 번호입니다' 안내, timed out은 신호만 계속 가는 상황이에요.", "p39": "'DNS 질의 결과를 확인하는 명령'이라는 부분이 틀렸어요. netstat -ano는 현재 컴퓨터의 연결과 열린 포트를 보여 주는데, -a는 모든 연결과 listen 포트, -n은 이름 대신 숫자 주소, -o는 각 연결을 가진 프로세스 ID(PID)를 표시하라는 뜻이에요. 그래서 '8000번 포트를 누가 이미 쓰고 있나?'를 확인할 때 써요. DNS가 도메인을 어떤 IP로 바꿔 주는지 보려면 nslookup이나 dig를 써요. 즉 netstat은 내 컴퓨터 안을, nslookup은 이름 변환을 들여다보는 도구예요.", "p40": "확인 순서가 거꾸로 되어 있어서 X예요. Troubleshooting Ladder는 연결 문제를 가까운 곳부터 한 칸씩 올라가며 확인하는 순서라는 뜻이에요. 먼저 서비스가 실행 중인지, 올바른 주소와 포트에 bind됐는지, 로컬 방화벽이 막는지 보고, 그다음 IP/Subnet, Gateway와 라우팅, NAT나 클라우드 규칙, 마지막으로 DNS를 확인해요. 서버 프로그램이 꺼져 있는데 DNS부터 뒤지면 시간만 낭비돼요. 전등이 안 켜질 때 전구와 스위치부터 보고, 마지막에 한국전력에 전화하는 것과 같은 원리예요.", "p41": "'늦게 도착한 오래된 중복 SYN으로 잘못된 연결이 성립하는 것을 막는다'는 설명이 맞아서 O예요. 네트워크가 느려 예전에 보낸 SYN이 한참 뒤 서버에 도착하면, 서버는 새 요청인 줄 알고 SYN+ACK를 보내요. 2-way였다면 이 시점에 연결이 성립해 서버 자원이 낭비돼요. 3-way에서는 클라이언트가 SYN+ACK의 확인 번호를 보고 '내가 지금 보낸 게 아니네' 하고 RST로 거절하므로 잘못된 연결이 생기지 않아요. 또 세 번째 ACK는 양쪽이 서로의 시작 순서 번호(ISN)를 확인했다는 의미도 있어요.", "p42": "순서가 SYN → ACK → SYN+ACK로 되어 있어서 X예요. 올바른 순서는 SYN → SYN+ACK → ACK예요. 클라이언트가 '연결하고 싶어요'라는 SYN을 보내면, 서버가 '받았어요(ACK), 나도 연결할게요(SYN)'를 한 패킷인 SYN+ACK로 묶어 보내고, 클라이언트가 마지막 ACK로 '확인했어요'라고 답해요. SYN은 연결 시작을 요청하는 플래그, ACK는 받았다는 확인 플래그라는 뜻이에요. 서버의 ACK와 SYN을 따로 보내면 4번이 되지만 하나로 합쳐 3번이 된 거예요. 반면 연결 종료는 보통 FIN과 ACK를 따로 보내 4-way예요.", "p43": "'대역폭 자체를 늘려 준다'와 '어떤 상황에서도 더 빠르다'는 부분이 틀렸어요. 대역폭은 링크의 물리적 한계라 어떤 전송 프로토콜도 늘릴 수 없어요. UDP가 빠르게 느껴지는 이유는 연결 설정(handshake)이 없고, 손실된 패킷을 다시 보내거나 순서를 맞추느라 기다리지 않기 때문이에요. 대신 패킷이 빠지거나 순서가 뒤바뀌어도 알려 주지 않아요. 그래서 조금 끊겨도 실시간성이 중요한 게임, 음성 통화에 UDP를 쓰고, 한 바이트도 틀리면 안 되는 파일 다운로드에는 TCP를 써요.", "p44": "'8바이트, 네 필드 구성'이라는 설명이 맞아서 O예요. UDP 헤더는 Source Port(보내는 프로그램 번호), Destination Port(받는 프로그램 번호), Length(헤더+데이터 전체 길이), Checksum(전송 중 비트가 깨졌는지 검사하는 값이라는 뜻이에요) 네 개가 각각 2바이트씩이에요. 반면 TCP 헤더는 최소 20바이트로, 순서 번호, 확인 번호, 플래그, 윈도우 크기 같은 필드가 더 있어요. 이 필드들이 TCP의 신뢰성과 흐름 제어를 가능하게 하는데, UDP에는 없어서 그만큼 가볍고 단순해요.", "p45": "'Port는 번호, Socket은 통신 객체라서 한 포트에 여러 소켓이 존재할 수 있다'는 설명이 맞아서 O예요. Port는 컴퓨터 안의 프로그램을 가리키는 16비트 번호일 뿐이고, Socket은 프로그램이 운영체제에게서 받아 실제로 데이터를 읽고 쓰는 통신 창구라는 뜻이에요. 웹 서버는 443번에 listen 소켓 하나를 열고, 클라이언트가 연결할 때마다 같은 443번을 쓰는 연결 소켓을 새로 만들어요. 각 연결 소켓은 상대 IP·Port가 달라서 구분돼요. 식당 주소(포트)는 하나지만 테이블(소켓)은 여러 개인 것과 같아요.", "p46": "'목적지 IP와 목적지 Port의 2-tuple만으로'라는 부분이 틀렸어요. TCP 연결은 출발지 IP, 출발지 Port, 목적지 IP, 목적지 Port 네 값을 묶은 4-tuple로 구분해요. tuple은 여러 값을 하나로 묶은 조합이라는 뜻이에요. 만약 목적지 정보만으로 구분한다면 서버의 443번 포트에는 연결이 하나밖에 있을 수 없어요. 실제로는 클라이언트마다 IP가 다르고, 같은 PC에서 탭을 여러 개 열어도 출발지 포트가 다르게 배정되므로 수많은 연결이 동시에 공존할 수 있어요. 프로토콜까지 포함해 5-tuple이라고 부르기도 해요.", "p47": "listen 소켓과 연결 소켓의 역할 구분이 맞아서 O예요. listen 소켓은 listen()을 호출한 뒤 새 연결 요청을 기다리고, 커널이 handshake를 마친 연결을 큐(대기열이라는 뜻이에요)에 쌓아 두는 역할만 해요. 서버 프로그램이 accept()를 호출하면 큐에서 연결 하나를 꺼내 새 연결 소켓을 돌려주고, 이후 그 클라이언트와의 send/recv는 이 소켓으로 해요. 그 사이 listen 소켓은 계속 다음 손님을 받아요. 그래서 listen 소켓으로 recv를 시도하면 에러가 나요.", "p48": "'서버 애플리케이션이 handshake를 직접 수행한다'는 부분이 틀렸어요. 3-way handshake는 운영체제 커널(하드웨어와 프로그램 사이에서 자원을 관리하는 운영체제의 핵심부라는 뜻이에요)이 자동으로 처리해요. listen() 이후 SYN이 오면 커널이 SYN+ACK를 보내고 ACK까지 받으면, 완성된 연결을 Accept 큐에 넣어 둬요. 애플리케이션의 accept()는 그 큐에서 하나를 꺼내 연결 소켓으로 받아올 뿐이에요. 그래서 서버 프로그램이 accept()를 늦게 불러도 handshake는 이미 끝나 있을 수 있어요.", "p49": "보호 대상이 서로 뒤바뀌어 있어서 X예요. Flow control(흐름 제어)은 수신자가 처리할 수 있는 속도에 맞추는 기능으로, 수신자가 알려 주는 남은 버퍼 크기 rwnd(receive window)를 보고 보내는 양을 조절해요. Congestion control(혼잡 제어)은 중간 네트워크가 막히지 않게 하는 기능으로, 송신자가 패킷 손실이나 지연을 보고 스스로 추정하는 cwnd(congestion window)로 조절해요. 비유하면 Flow control은 받는 사람 창고가 넘치지 않게, Congestion control은 가는 길 도로가 막히지 않게 하는 거예요.", "p50": "'Effective Window는 min(rwnd, cwnd)'라는 설명이 맞아서 O예요. Effective Window는 송신자가 ACK를 받지 않고 한 번에 보내 둘 수 있는 데이터 양이라는 뜻이에요. rwnd는 수신자가 '내 버퍼에 이만큼 남았어'라고 알려 주는 값이고, cwnd는 송신자가 네트워크 상태를 보고 추정한 안전한 양이에요. 둘 중 하나라도 넘기면 수신자 버퍼가 넘치거나 네트워크가 혼잡해지므로 작은 쪽에 맞춰요. 예를 들어 rwnd가 64KB여도 cwnd가 10KB라면 실제로는 10KB만 보내요.", "p51": "이 문장은 O예요. 누적 ACK는 '여기까지는 빠짐없이 다 받았다'는 뜻이라서, 중간 조각 하나가 빠지면 그 뒤 조각이 아무리 도착해도 같은 ack 번호만 반복돼요.\n중복 ACK가 계속 온다는 건 '뒤 데이터는 들어오는데 그 번호 조각만 비었다'는 신호예요. 그래서 TCP는 중복 ACK 3번을 받으면 타임아웃까지 기다리지 않고 바로 재전송해요(Fast Retransmit).\n비유하면 책장을 넘기던 친구가 '5쪽까지 읽었어'만 계속 말하면, 6쪽이 빠졌다는 걸 알 수 있는 것과 같아요. 타임아웃 재전송은 아예 소식이 끊겼을 때 쓰는 더 느린 방법이에요.", "p52": "이 문장은 X예요. 설명한 내용(먼저 close()한 쪽이 2×MSL 동안 머무름)은 CLOSE_WAIT이 아니라 TIME_WAIT의 설명이에요.\nMSL은 패킷이 네트워크에 살아 있을 수 있는 최대 시간이라는 뜻이에요. TIME_WAIT은 늦게 도착한 옛 패킷이 새 연결에 섞이지 않게 기다리는 정상 상태예요.\n반면 CLOSE_WAIT은 상대의 FIN을 받아 '상대는 끊었다'는 걸 알았지만, 내 애플리케이션이 아직 close()를 부르지 않은 상태예요. 즉 TIME_WAIT은 먼저 끊은 쪽, CLOSE_WAIT은 나중에 끊는 쪽에 생긴다고 짝지어 기억하면 좋아요.", "p53": "이 문장은 O예요. CLOSE_WAIT은 상대가 FIN을 보내 연결을 끊었는데 내 앱이 close()를 아직 호출하지 않은 상태라서, 이게 계속 쌓인다면 내 코드가 소켓을 닫지 않고 있다는 뜻이에요.\n소켓 누수란 다 쓴 소켓을 닫지 않아 자원이 계속 남아 있는 버그라는 뜻이에요. 쌓이면 파일 디스크립터가 바닥나 새 연결을 못 받게 될 수 있어요.\n헷갈리는 짝인 TIME_WAIT은 많아도 일정 시간이 지나면 OS가 알아서 정리하는 정상 상태예요. 하지만 CLOSE_WAIT은 앱이 닫아 주기 전까지 사라지지 않으니, 예외 처리 경로에서 close()가 빠졌는지 확인해야 해요.", "p54": "이 문장은 O예요. Connection refused는 서버까지 SYN이 도착했지만 그 포트에서 기다리는(listen) 프로그램이 없어 OS가 RST로 '거절'한 경우예요.\nRST는 '이 연결은 받을 수 없다'며 즉시 끊는 TCP 신호라는 뜻이에요. 반면 Connection timed out은 SYN을 보냈는데 아무 답도 없어서 기다리다 포기한 경우예요.\n비유하면 refused는 문을 두드렸더니 '여기 그런 사람 없어요'라고 답이 온 것이고, timed out은 문 앞까지 가지도 못했거나 아무도 대답하지 않은 거예요. 그래서 refused면 서버 프로세스·포트 번호를, timed out이면 방화벽·라우팅 경로를 먼저 살펴봐요.", "p55": "이 문장은 X예요. '몇 번째 세그먼트인지 나타내는 번호'라는 부분이 틀렸어요. TCP의 Sequence Number는 바이트 단위 번호예요.\n즉 이 세그먼트에 담긴 첫 바이트가 전체 데이터 흐름(스트림)에서 몇 번째 바이트인지를 나타내요. 세그먼트는 TCP가 데이터를 잘라 보내는 한 조각이라는 뜻이에요.\n예를 들어 첫 세그먼트가 seq=1이고 1000바이트를 실었다면, 다음 세그먼트는 seq=2가 아니라 seq=1001이 돼요. 세그먼트 번호처럼 1씩 늘어나는 게 아니라, 실은 데이터 크기만큼 늘어난다는 점이 핵심이에요.", "p56": "이 문장은 O예요. seq=1, len=1460이면 1번부터 1460번까지의 바이트를 담은 세그먼트예요. 이것을 잘 받았다면 수신자는 '다음에 받을 바이트 번호'인 1461을 ack로 보내요.\nTCP의 ACK 번호는 '여기까지 받았다'가 아니라 '다음엔 이 번호부터 주세요'라는 뜻이에요. 계산은 seq + len으로 하면 돼요.\n흔히 1460을 답한다고 착각하기 쉬운데, 그건 '마지막으로 받은 번호'예요. 책으로 치면 '1460쪽까지 읽었으니 1461쪽을 줘'라고 말하는 방식이라고 생각하면 기억하기 쉬워요.", "p57": "이 문장은 X예요. 'RTT마다 +1 MSS씩 천천히'라는 부분이 틀렸어요. Slow Start는 이름과 달리 RTT마다 cwnd를 약 2배씩 빠르게 늘려요.\ncwnd(혼잡 윈도우)는 네트워크 상황을 보고 송신자가 스스로 정한 '한 번에 보낼 수 있는 양'이라는 뜻이고, MSS는 세그먼트 하나에 실을 수 있는 최대 데이터 크기예요.\n이름이 Slow인 건 처음 시작을 아주 작은 값(1~10 MSS 정도)에서 출발하기 때문이에요. cwnd가 임계값(ssthresh)에 닿으면 Congestion Avoidance 단계로 넘어가, 그때부터 RTT마다 +1 MSS씩 조심스럽게 늘려요.", "p58": "이 문장은 O예요. AIMD는 Additive Increase(더해서 조금씩 늘림), Multiplicative Decrease(곱해서 크게 줄임)의 줄임말이에요.\n손실이 없을 때는 RTT마다 cwnd를 1 MSS씩 더해 천천히 올리고, 손실이 생기면 cwnd를 절반으로 확 줄여요. 그래프로 그리면 천천히 올라갔다 뚝 떨어지는 톱니 모양이 돼요.\n이렇게 하는 이유는 혼잡은 빨리 풀어야 하고, 대역폭은 조심스럽게 탐색해야 하기 때문이에요. 여러 연결이 이 규칙을 따르면 대역폭을 비교적 공평하게 나눠 쓰게 된다는 장점도 있어요.", "p59": "이 문장은 X예요. '주된 원인은 네트워크 혼잡'이라는 부분이 틀렸어요. Zero Window는 수신 쪽 애플리케이션이 데이터를 늦게 읽어서 수신 버퍼가 꽉 찬 상황이에요.\nwin(수신 윈도우)은 수신자가 '내 버퍼에 아직 이만큼 자리가 있어'라고 알려 주는 값이라는 뜻이에요. 이게 0이면 송신자는 보내기를 멈추고 기다려요.\n헷갈리는 짝은 혼잡 제어예요. 혼잡 제어(cwnd)는 네트워크가 막힐 때 송신자가 스스로 줄이는 것이고, 흐름 제어(rwnd, win)는 수신자가 버거울 때 속도를 맞추는 거예요. Zero Window는 흐름 제어 쪽 문제라서 수신 앱의 처리 속도를 먼저 봐야 해요.", "p60": "이 문장은 O예요. BDP는 대역폭(초당 보낼 수 있는 양)에 RTT(왕복 시간)를 곱한 값으로, ACK를 기다리는 동안 동시에 '날아가고 있어야' 하는 데이터 양이에요.\n윈도우가 BDP보다 작으면 송신자는 ACK를 기다리며 쉬는 시간이 생겨 링크를 다 못 써요. 그래서 BDP는 링크를 꽉 채우는 데 필요한 윈도우 크기라는 뜻이 돼요.\n예를 들어 100Mbps에 RTT 100ms면 BDP는 100Mbps × 0.1s = 10Mbit, 약 1.25MB예요. 파이프에 비유하면 굵기(대역폭)와 길이(지연)를 곱한 파이프 부피만큼 물을 채워야 끊김 없이 흐르는 거예요.", "p61": "이 문장은 O예요. TCP는 바이트 스트림이라서 '메시지 하나'라는 경계를 지켜 주지 않아요. 그래서 send() 3번으로 보낸 데이터가 recv() 1번에 한꺼번에 읽힐 수도, 반대로 쪼개져 읽힐 수도 있어요.\n바이트 스트림이란 데이터를 끊김 없는 바이트의 줄로만 다룬다는 뜻이에요. 그래서 앱이 길이 정보를 앞에 붙이거나 줄바꿈 같은 구분자를 넣어 메시지를 직접 나눠야 해요.\n헷갈리는 짝인 UDP는 데이터그램 방식이라 sendto() 1번이 recvfrom() 1번에 그대로 대응해 경계가 지켜져요. 대신 UDP는 순서·도착을 보장하지 않아요.", "p62": "이 문장은 X예요. TCP와 UDP의 역할이 서로 뒤바뀌었어요. TCP는 unicast만 되고, UDP는 unicast·broadcast·multicast를 모두 쓸 수 있어요.\nunicast는 1:1, broadcast는 같은 네트워크 전체에게, multicast는 특정 그룹에게 보내는 방식이라는 뜻이에요.\nTCP는 두 끝점 사이에 handshake로 연결을 맺고 ACK·재전송으로 상태를 관리하기 때문에, 여러 수신자와 동시에 그런 상태를 맞추는 건 불가능해요. 반면 UDP는 연결 없이 그냥 던지는 방식이라 DHCP 탐색(broadcast)이나 IPTV 방송(multicast)처럼 여럿에게 보내는 데 쓰여요.", "p63": "이 문장은 O예요. 서버를 껐다가 바로 다시 켜면, 이전 연결들이 TIME_WAIT 상태로 그 포트를 잡고 있어 bind()가 EADDRINUSE(주소 사용 중) 오류로 실패할 수 있어요.\nSO_REUSEADDR은 이런 TIME_WAIT 연결이 남아 있어도 같은 주소·포트에 다시 bind할 수 있게 허락하는 소켓 옵션이라는 뜻이에요. 그래서 서버 코드에서 거의 관례처럼 켜 둬요.\n헷갈리는 짝으로 SO_REUSEPORT가 있어요. 이건 여러 프로세스가 같은 포트에 동시에 listen해서 부하를 나누는 용도로, 재시작 문제 해결용인 SO_REUSEADDR과 목적이 달라요.", "p64": "이 문장은 X예요. 원인이 서로 뒤바뀌었어요. Recv-Q가 쌓이면 데이터는 도착했는데 내 앱이 늦게 읽는 것이고, Send-Q가 쌓이면 네트워크나 상대가 데이터를 늦게 받아 가는 거예요.\nRecv-Q는 커널이 받아 두었지만 앱이 아직 읽지 않은 데이터 양, Send-Q는 보냈지만 아직 상대가 ACK하지 않은 데이터 양이라는 뜻이에요.\n택배로 비유하면 Recv-Q는 우리 집 현관에 쌓인 상자(내가 안 뜯음), Send-Q는 보냈는데 아직 상대가 수령 확인을 안 한 상자예요. 쌓인 위치를 보면 병목이 어느 쪽인지 알 수 있어요.", "p65": "이 문장은 O예요. QUIC은 UDP 위에서 동작하고, 그 로직은 OS 커널이 아니라 브라우저·앱 같은 사용자 공간 라이브러리에 구현돼요. 그래서 OS 업데이트 없이도 빠르게 개선할 수 있어요.\n4-tuple은 출발지 IP·포트, 목적지 IP·포트 네 가지 묶음이라는 뜻이에요. TCP는 이걸로 연결을 구분해서 Wi-Fi에서 LTE로 바뀌어 IP가 달라지면 연결이 끊겨요.\n반면 QUIC은 Connection ID라는 별도 식별자로 연결을 구분해서, 주소가 바뀌어도 같은 연결로 이어 갈 수 있어요(연결 마이그레이션). 지하철에서 Wi-Fi가 끊겨도 영상이 계속 나오는 게 좋은 예예요.", "p66": "이 문장은 X예요. '443 포트를 쓰므로 TCP 위에서 동작한다'는 추론이 틀렸어요. HTTP/3는 UDP 443 포트 위의 QUIC 프로토콜로 동작해요.\n포트 번호는 TCP와 UDP에 각각 따로 존재해서, TCP 443과 UDP 443은 완전히 다른 통로라는 뜻이에요. 포트 번호만으로 전송 계층을 알 수는 없어요.\n정리하면 HTTP/1.1과 HTTP/2는 TCP 443(TLS) 위에서, HTTP/3는 UDP 443(QUIC) 위에서 동작해요. 그래서 방화벽이 UDP 443을 막으면 브라우저는 HTTP/3 대신 TCP 기반의 HTTP/2로 되돌아가요.", "p67": "이 문장은 O예요. DNS 질의는 대부분 '이 이름의 IP가 뭐야?' 한 번 묻고 한 번 답하면 끝나는 짧은 대화예요. 여기에 TCP의 3-way handshake로 1 RTT를 더 쓰면 실제 질문보다 준비가 더 오래 걸려요.\nRTT는 패킷이 갔다가 돌아오는 왕복 시간이라는 뜻이에요. UDP는 연결 설정 없이 바로 보내니 1 RTT 만에 끝나요.\n다만 응답이 너무 커서 잘리면(TC 플래그) TCP로 다시 물어보고, 서버끼리 영역 전체를 복사하는 zone transfer도 TCP를 써요. 즉 'DNS는 UDP만 쓴다'가 아니라 '주로 UDP를 쓴다'가 정확해요.", "p68": "이 문장은 X예요. 'RTO를 절반으로 줄여 더 빨리 재전송'이 틀렸어요. Exponential Backoff는 타임아웃이 반복될 때마다 RTO를 2배씩 늘리는 규칙이에요.\nRTO는 재전송 타임아웃, 즉 ACK를 얼마나 기다렸다가 다시 보낼지 정한 시간이라는 뜻이에요. 타임아웃이 계속 난다는 건 네트워크가 많이 막혔을 가능성이 크다는 신호예요.\n이때 더 자주 보내면 혼잡을 더 키우니까 오히려 간격을 1초, 2초, 4초처럼 늘려 숨 돌릴 틈을 줘요. 전화가 안 될 때 계속 재다이얼하기보다 점점 간격을 두고 다시 거는 것과 비슷해요.", "p69": "이 문장은 O예요. MTU 1500바이트에서 IP 헤더 20바이트와 TCP 헤더 20바이트를 빼면 1460바이트가 남아요.\nMTU는 링크 계층이 한 번에 실을 수 있는 IP 패킷의 최대 크기라는 뜻이고, MSS는 그 안에서 TCP가 실을 수 있는 순수 데이터(페이로드)의 최대 크기라는 뜻이에요.\n헷갈리기 쉬운 점은 MTU에 이더넷 헤더는 포함되지 않는다는 거예요. 또 TCP 옵션(타임스탬프 등)을 쓰면 헤더가 커져 실제 데이터는 1448바이트처럼 더 줄어들 수 있어요. 앞의 seq=1, len=1460 예시에서 1460이 바로 이 값이에요.", "p70": "이 문장은 X예요. '나중에 close()한 쪽(수동 종료 측)'이 틀렸어요. TIME_WAIT은 먼저 close()한 쪽, 즉 능동 종료 측에 생겨요.\n능동 종료는 먼저 FIN을 보내 끊기를 시작한 쪽, 수동 종료는 FIN을 받고 나중에 닫는 쪽이라는 뜻이에요. 능동 종료 측은 마지막 ACK를 보낸 뒤 그 ACK가 유실돼 상대 FIN이 다시 올 수 있으니 2×MSL 동안 기다려요.\n수동 종료 측은 FIN을 받은 뒤 CLOSE_WAIT을 거쳐, 앱이 close()하면 LAST_ACK 후 바로 끝나요. 그래서 클라이언트가 먼저 끊으면 TIME_WAIT은 클라이언트에, 서버가 먼저 끊으면 서버에 쌓여요.", "p71": "이 문장은 O예요. DNS는 'www.example.com 같은 이름을 IP 주소로 바꿔 주는' 일만 해서, URL 중 host 부분만 사용해요.\n예를 들어 https://shop.com/items?id=3 에서 DNS가 아는 건 shop.com 뿐이에요. /items라는 path와 ?id=3이라는 query string은 IP를 찾은 뒤 서버에 보내는 HTTP 요청 줄 안에 들어가요.\n비유하면 DNS는 건물 주소를 알려 주는 지도이고, path와 query는 그 건물 안에서 '3층 7호를 찾아요'라고 안내 데스크에 말하는 내용이에요. 지도는 건물 안의 호수까지는 알 필요가 없어요.", "p72": "이 문장은 X예요. 'Fragment가 서버로 전송된다'는 부분이 틀렸어요. # 뒤의 Fragment는 서버로 보내지지 않고 브라우저 안에서만 쓰여요.\nFragment는 한 페이지 안의 특정 위치(예: 목차의 한 섹션)를 가리키는 표시라는 뜻이에요. 브라우저가 페이지를 받은 뒤 그 id를 가진 요소로 스크롤하는 데 사용해요.\n헷갈리는 짝은 query string(?…)이에요. query는 서버로 전송돼 서버가 어떤 데이터를 줄지 결정하는 데 쓰지만, fragment는 서버 로그에도 남지 않아요. 그래서 SPA는 #을 이용해 서버 요청 없이 화면을 바꾸기도 해요.", "p73": "이 문장은 O예요. 내 PC의 Stub Resolver는 재귀 리졸버에게 '최종 답을 찾아서 줘'라고 맡기는 재귀 질의를 해요. 재귀 리졸버는 root, TLD, 권한 서버를 차례로 물어보는 반복 질의를 해요.\n재귀 질의는 받은 쪽이 끝까지 답을 책임지는 질의, 반복 질의는 '나는 모르지만 저 서버에 물어봐'라는 안내를 받아 직접 다음 서버로 가는 질의라는 뜻이에요.\n예를 들어 www.example.com을 찾을 때, 리졸버는 root에게 .com 서버 위치를, .com 서버에게 example.com 권한 서버 위치를 받고, 마지막으로 권한 서버에서 IP를 받아 클라이언트에게 돌려줘요.", "p74": "이 문장은 O예요. DNS 응답은 TTL 동안 리졸버, OS, 브라우저 여러 곳에 캐시돼요. 레코드를 바꿔도 이미 옛 답을 캐시한 곳은 TTL이 끝날 때까지 옛 IP를 계속 써요.\nTTL은 '이 답을 몇 초 동안 믿고 재사용해도 된다'는 유효 시간이라는 뜻이에요. 사용자마다 캐시한 시점이 달라서 만료 시점도 제각각이에요.\n그래서 한동안은 어떤 사용자는 새 서버로, 어떤 사용자는 옛 서버로 가는 상황이 생겨요. 실무에서는 서버 이전 며칠 전에 TTL을 300초처럼 짧게 낮춰 두고, 변경 후 다시 늘리는 방식으로 이 혼선을 줄여요.", "p75": "이 문장은 X예요. '권한 서버가 전 세계 리졸버로 능동적으로 푸시한다'는 부분이 틀렸어요. DNS에는 그런 푸시 기능이 없어요.\n전파(Propagation)는 각 리졸버가 가진 캐시의 TTL이 만료되고, 그다음 질의 때 권한 서버에 다시 물어서 새 값을 받아 가는 과정을 부르는 말이라는 뜻이에요. 즉 실제로는 당겨 가는(pull) 방식이에요.\n신문 배달보다는 게시판에 비유할 수 있어요. 권한 서버는 게시판 내용만 바꿀 뿐이고, 각자가 다시 보러 올 때 비로소 새 내용을 알게 돼요. 그래서 '전파 시간'은 결국 TTL 길이에 달려 있어요.", "p76": "이 문장은 O예요. HTTP/1.1 메시지는 시작 줄, 헤더들, 빈 줄, 본문 순서로 되어 있고 헤더와 본문 사이를 빈 줄로 구분해요.\nCRLF는 줄바꿈 문자(\\r\\n)라는 뜻이에요. 헤더 각 줄은 CRLF로 끝나고, 마지막 헤더 뒤에 CRLF가 한 번 더 오면 CRLF CRLF가 연속돼 '헤더 끝'이 표시돼요.\n예를 들어 'Host: a.com\\r\\nContent-Length: 5\\r\\n\\r\\nhello'에서 \\r\\n\\r\\n 뒤의 hello가 본문이에요. 본문이 어디서 끝나는지는 Content-Length나 chunked 인코딩으로 알려 줘요. 참고로 HTTP/2부터는 텍스트가 아닌 바이너리 프레임으로 헤더와 데이터를 나눠요.", "p77": "이 문장은 O예요. PUT은 '이 자원을 이 내용으로 통째로 바꿔라'라는 요청이라 몇 번을 보내도 최종 상태가 같아 멱등이에요. POST는 '새로 하나 만들어라'처럼 보낼 때마다 결과가 쌓일 수 있어 멱등이 아니에요.\n멱등이란 같은 요청을 여러 번 보내도 서버 상태가 한 번 보낸 것과 같다는 뜻이에요.\n예를 들어 PUT /users/7 {이름: 철수}는 열 번 보내도 7번 사용자의 이름은 철수 하나예요. 하지만 POST /orders를 열 번 보내면 주문이 열 개 생길 수 있어요. 그래서 네트워크 오류 시 PUT은 마음 놓고 재시도하지만 POST는 조심해야 해요.", "p78": "이 문장은 X예요. 'POST 자동 재시도가 항상 안전하다'는 부분이 틀렸어요. 요청은 서버에 도착해 처리됐는데 응답만 유실됐다면, 재시도하는 순간 같은 작업이 한 번 더 실행돼요.\nPOST는 멱등이 아니라서 결제·주문 같은 요청이 중복으로 처리될 수 있어요. 클라이언트는 응답을 못 받으면 '처리 안 됨'인지 '처리됐는데 답만 사라짐'인지 구분할 수 없다는 게 핵심이에요.\n그래서 Idempotency-Key 같은 장치를 써요. 요청마다 고유한 키를 붙여 보내면, 서버가 같은 키를 이미 처리했는지 확인해 두 번째 요청은 새로 실행하지 않고 처음 결과를 돌려줘요.", "p79": "이 문장은 X예요. '두 번째에 404가 오니 멱등이 아니다'라는 판단이 틀렸어요. 멱등은 응답 코드가 같은지가 아니라 서버의 최종 상태가 같은지로 판단해요.\nDELETE /posts/3을 처음 보내면 글이 삭제되고 200이나 204가 와요. 두 번째에는 이미 없으니 404가 올 수 있지만, 서버 상태는 두 번 모두 '3번 글 없음'으로 같아요.\n헷갈리는 짝은 '안전(safe)'이라는 개념이에요. 안전한 메서드(GET 등)는 서버 상태를 아예 바꾸지 않는다는 뜻이에요. DELETE는 상태를 바꾸니 안전하지는 않지만, 여러 번 해도 결과가 같으니 멱등이에요.", "p80": "이 문장은 O예요. 404는 요청이 앱 서버까지 잘 도착했고, 앱이 '그런 자원은 없어요'라고 직접 만든 응답이에요. 반면 502 Bad Gateway는 중간의 프록시가 뒷단 서버와 통신하지 못했을 때 프록시가 만든 응답이에요.\n리버스 프록시는 Nginx처럼 클라이언트 요청을 받아 뒤쪽 서버로 넘겨 주는 중계 서버라는 뜻이고, LB(로드 밸런서)는 여러 서버로 요청을 나눠 주는 장치예요.\n비유하면 404는 가게 점원이 '그 상품 없어요'라고 답한 것이고, 502는 안내원이 '가게 문이 닫혀 있어요'라고 알려 준 거예요. 그래서 502가 나면 앱 서버가 죽었는지, 포트가 맞는지부터 확인해요.", "p81": "이 문장은 X예요. 401과 403의 의미가 서로 뒤바뀌었어요. 401은 누구인지 모를 때, 403은 누구인지는 알지만 권한이 없을 때 써요.\n인증(Authentication)은 '당신이 누구인지' 확인하는 것, 인가(Authorization)는 '당신이 이걸 해도 되는지' 확인하는 것이라는 뜻이에요. 401은 인증 실패, 403은 인가 실패예요.\n회사 출입으로 비유하면, 사원증을 안 가져오거나 만료되면 401(다시 로그인하세요), 사원증은 있는데 사장실에 들어가려 하면 403(당신은 못 들어가요)이에요. 이름이 Unauthorized라 헷갈리지만 실제 뜻은 '인증 안 됨'이에요.", "p82": "이 문장은 O예요. HTTP/1.1은 한 연결에서 응답이 순서대로 와야 해서 앞 응답이 늦으면 뒤가 다 막혔어요. HTTP/2는 하나의 TCP 연결에 여러 스트림을 섞어 보내는 다중화로 이 HTTP 계층 문제를 풀었어요.\nHOL blocking은 줄 맨 앞(Head-of-Line)이 막히면 뒤가 전부 기다리는 현상이라는 뜻이에요.\n하지만 TCP는 바이트 순서를 지켜야 해서, 패킷 하나만 빠져도 그 뒤에 도착한 다른 스트림 데이터까지 앱에 넘기지 못해요. 그래서 HTTP/3는 UDP 위의 QUIC으로 스트림마다 따로 순서를 관리해, 한 스트림의 손실이 다른 스트림을 막지 않게 했어요.", "p83": "이 문장은 X예요. '도메인 이름(SNI)과 목적지 IP까지 모두 암호화된다'는 부분이 틀렸어요. 둘 다 기본적으로 경로상에서 보여요.\n목적지 IP는 라우터가 패킷을 배달하는 주소라서 암호화하면 배달 자체가 불가능해요. SNI는 TLS 시작 때 클라이언트가 '나는 이 도메인에 접속하려 해'라고 알려 주는 값이라는 뜻인데, 암호화가 시작되기 전에 보내서 평문이에요.\n그래서 HTTPS를 써도 통신사는 '이 사용자가 example.com에 접속했다'는 정도는 알 수 있어요. SNI까지 숨기려면 ECH(Encrypted Client Hello) 같은 추가 기술이 필요하고, IP를 숨기려면 VPN 같은 별도 수단이 필요해요.", "p84": "이 문장은 O예요. HTTPS에서는 HTTP 메시지 전체가 TLS로 암호화된 터널 안에 들어가기 때문에, path·query string·헤더(쿠키 포함)·본문 모두 경로상에서 볼 수 없어요.\nTLS는 TCP 위에서 데이터를 암호화하고 상대 서버가 진짜인지 확인해 주는 보안 계층이라는 뜻이에요.\n앞 문제와 짝으로 기억하면 좋아요. 밖에서 보이는 것은 IP·포트·(기본적으로) SNI의 도메인 이름이고, 안 보이는 것은 그 도메인 뒤의 /search?q=비밀 같은 세부 내용이에요. 봉투 겉면의 주소는 보이지만 편지 내용은 안 보이는 것과 같아요.", "p85": "이 문장은 O예요. 브라우저는 인증서를 받으면 여러 가지를 함께 확인하고, 하나라도 어긋나면 경고를 띄워요.\n신뢰 체인은 서버 인증서(Leaf)를 중간 인증서(Intermediate)가 서명하고, 그 중간 인증서를 Root CA가 서명해 위로 이어지는 사슬이라는 뜻이에요. SAN은 그 인증서가 유효한 도메인 이름 목록이 적힌 칸이에요.\n예를 들어 인증서 SAN에 www.shop.com만 있는데 shop.com으로 접속하면 이름이 안 맞아 경고가 떠요. 체인과 이름이 다 맞아도 유효기간이 지났으면 역시 실패해요. 즉 '누가 보증했나', '언제까지인가', '이 사이트용이 맞나'를 모두 확인하는 거예요.", "p86": "이 문장은 X예요. '항상 성공한다'는 부분이 틀렸어요. Root CA가 Trust Store에 있어도 Leaf에서 Root까지 사슬이 이어져야 검증이 성공해요.\nTrust Store는 OS나 브라우저가 미리 믿기로 정해 둔 Root 인증서 목록이라는 뜻이에요. 서버는 보통 Leaf와 Intermediate를 함께 보내 줘야 클라이언트가 사슬을 완성할 수 있어요.\n중간 인증서가 빠지면 이미 캐시로 갖고 있는 일부 브라우저에서는 잘 되지만, curl이나 모바일 앱처럼 그렇지 않은 클라이언트에서는 실패해요. 그래서 '내 PC에선 되는데 다른 데선 안 돼요'라는 문제가 자주 이 원인으로 생겨요.", "p87": "이 문장은 O예요. DNS 조회나 TCP·TLS 연결 구간은 짧은데 TTFB만 길다면, 요청은 빨리 도착했지만 서버가 답을 만드는 데 오래 걸린 거예요.\nTTFB(Time To First Byte)는 요청을 다 보낸 뒤 응답의 첫 바이트가 도착하기까지 걸린 시간이라는 뜻이에요. DevTools에서는 Waiting으로 표시돼요.\n이 시간에는 서버 앱 로직, DB 쿼리, 뒷단 API(upstream) 호출 등이 포함돼요. 반대로 Content Download 구간이 길다면 응답 크기나 대역폭 문제이고, Initial connection이 길다면 네트워크 경로 문제를 먼저 의심해요. 구간별로 나눠 보면 원인을 빠르게 좁힐 수 있어요.", "p88": "이 문장은 X예요. 'apex에도 자유롭게 둘 수 있다'가 틀렸어요. zone 최상단인 example.com 같은 apex에는 CNAME을 둘 수 없어요.\nCNAME은 '이 이름은 저 이름의 별명이니 저쪽을 찾아가라'는 레코드인데, 규칙상 CNAME이 있는 이름에는 다른 레코드를 함께 둘 수 없다는 뜻이에요. 그런데 apex에는 SOA·NS 레코드가 반드시 있어야 하므로 충돌해요.\n그래서 www.example.com처럼 하위 이름에는 CNAME을 쉽게 쓰지만, example.com 자체를 CDN 주소로 연결하고 싶을 땐 ALIAS·ANAME 같은 DNS 업체 확장 레코드나 CNAME flattening을 써요.", "p89": "이 문장은 X예요. MX의 설명이 틀렸어요. MX 레코드는 그 도메인으로 오는 메일을 받을 메일 서버가 어디인지 알려 주는 레코드예요.\n역방향 조회는 IP 주소로 도메인 이름을 찾는 것이라는 뜻이고, 이 역할은 PTR 레코드가 해요. 반대로 이름에서 IP를 찾는 정방향 조회는 A(IPv4)·AAAA(IPv6) 레코드가 해요.\n예를 들어 누군가 user@shop.com으로 메일을 보내면, 보내는 서버는 shop.com의 MX를 조회해 mail.shop.com 같은 메일 서버를 알아내요. MX에는 우선순위 숫자도 있어서 숫자가 작은 서버부터 먼저 시도해요.", "p90": "이 문장은 X예요. 'NXDOMAIN은 캐시되지 않는다'가 틀렸어요. '그런 이름 없음'이라는 답도 캐시되고, 이를 Negative Caching이라고 해요.\nNegative Caching은 존재하지 않는다는 응답도 일정 시간 저장해 두고 재사용한다는 뜻이에요. 이 시간은 zone의 SOA 레코드에 적힌 값으로 정해져요. 없는 이름을 반복해서 물어 서버에 부담을 주지 않기 위해서예요.\n그래서 레코드를 추가하기 전에 누군가 그 이름을 조회해 NXDOMAIN을 받았다면, 레코드를 새로 만들어도 그 캐시가 만료될 때까지는 계속 '없음'으로 보여요. 새 서브도메인을 만들기 전에 미리 접속해 보지 않는 게 좋은 이유예요.", "p91": "이 문장은 X예요. no-cache를 '저장 금지'로 설명한 부분이 틀렸어요. no-cache는 저장은 해도 되지만, 쓰기 전에 매번 서버에 '아직 유효한가요?'라고 확인하라는 뜻이에요.\n캐시 저장 자체를 금지하는 지시어는 no-store예요. 비밀번호나 개인정보가 담긴 응답처럼 아예 남기면 안 되는 경우에 써요.\n이름 때문에 헷갈리기 쉬운 대표적인 짝이에요. no-cache는 '검증 후 사용'이라서 바뀐 게 없으면 304 응답으로 본문 없이 기존 캐시를 재사용해 효율적이에요. 반면 no-store는 매번 전체 응답을 새로 받아요.", "p92": "이 문장은 O예요. 304 Not Modified는 '네가 가진 캐시가 아직 최신이니 그대로 써'라는 응답이고, 다시 보낼 필요가 없으니 본문이 비어 있어요.\n이 검증은 조건부 요청으로 해요. 클라이언트가 If-None-Match에 ETag(자원 버전 표시값)를, If-Modified-Since에 Last-Modified(마지막 수정 시각)를 담아 보내면, 서버가 비교해서 바뀌지 않았으면 304를 보내요.\n바뀌었다면 200과 새 본문을 보내요. 예를 들어 큰 이미지 파일을 다시 열 때 304가 오면 수백 KB를 다시 받지 않고 헤더 몇 줄만 주고받아 빠르게 끝나요.", "p93": "이 문장은 X예요. 공개키 암호와 대칭키 암호의 역할이 뒤바뀌었어요. 실제 데이터는 대칭키(AES 등)로 암호화하고, 공개키 암호는 키 교환과 신원 증명에 써요.\n대칭키 암호는 암호화와 복호화에 같은 키를 쓰는 방식, 공개키 암호는 공개키와 개인키 한 쌍을 쓰는 방식이라는 뜻이에요. 공개키 암호는 계산이 훨씬 무거워 대량 데이터에는 맞지 않아요.\n그래서 TLS는 handshake 때 ECDHE 같은 키 교환으로 양쪽이 같은 세션 키를 만들고, 서버는 인증서의 개인키로 서명해 진짜임을 증명해요. 그 뒤 실제 대화는 빠른 대칭키로 해요. 금고 열쇠를 안전하게 건네는 데만 무거운 방법을 쓰는 셈이에요.", "p94": "이 문장은 O예요. Forward Secrecy는 나중에 서버 개인키가 털려도 과거에 녹화해 둔 암호 트래픽은 풀 수 없게 해 주는 성질이라는 뜻이에요.\n비결은 연결마다 ECDHE로 일회용 임시 키를 만들어 세션 키를 정하고, 끝나면 버리는 데 있어요. 서버 개인키는 '내가 진짜 서버다'라는 서명에만 쓰이고 세션 키를 만드는 데는 쓰이지 않아요.\n헷갈리는 비교 대상은 옛날 RSA 키 교환이에요. 그 방식은 세션 키를 서버 공개키로 암호화해 보냈기 때문에, 개인키가 유출되면 과거 기록을 모두 풀 수 있었어요. 그래서 TLS 1.3은 Forward Secrecy가 있는 방식만 허용해요.", "p95": "이 문장은 O예요. TLS 1.3의 0-RTT는 이전에 접속했던 서버에 다시 연결할 때 handshake가 끝나기도 전에 첫 데이터를 바로 보내는 기능이에요. 빠르지만 그 첫 데이터는 재전송 공격에 약해요.\n재전송(replay) 공격은 공격자가 암호화된 패킷을 그대로 복사해 서버에 다시 보내는 공격이라는 뜻이에요. 내용을 몰라도 같은 요청이 두 번 실행되게 만들 수 있어요.\n그래서 GET처럼 여러 번 실행돼도 결과가 같은 멱등 요청에만 0-RTT를 쓰는 게 바람직해요. '송금 1만 원' 같은 POST를 0-RTT로 보내면 복사본 때문에 두 번 송금될 위험이 있어요.", "p96": "이 문장은 X예요. 'CORS는 서버를 보호하려고 네트워크 단계에서 요청을 차단한다'가 틀렸어요. CORS는 브라우저가 지키는 규칙이고, 요청은 대부분 서버까지 실제로 도착해요.\n출처(Origin)는 프로토콜·도메인·포트의 묶음이라는 뜻이에요. 브라우저는 다른 출처로 요청한 뒤, 서버 응답의 Access-Control-Allow-Origin 헤더를 보고 그 응답을 JS 코드에 넘겨줄지 결정해요.\n즉 CORS는 '사용자 브라우저 안의 다른 사이트 JS가 내 데이터를 몰래 읽지 못하게' 하는 장치예요. curl이나 서버 간 호출은 CORS와 상관없이 요청할 수 있으니, 서버 보호는 반드시 인증·인가로 따로 해야 해요.", "p97": "이 문장은 O예요. 새 HTTPS 연결은 먼저 TCP 3-way handshake에 1 RTT, TLS 1.3 handshake에 1 RTT, 그다음 HTTP 요청을 보내고 응답을 받는 데 1 RTT가 들어 약 3 RTT가 걸려요.\nRTT는 클라이언트와 서버 사이를 한 번 왕복하는 시간이라는 뜻이에요. 서버가 멀수록 RTT가 커져서 이 3배 비용이 크게 느껴져요.\n비교하면 TLS 1.2는 handshake에 2 RTT가 필요해 총 4 RTT였고, 이미 맺은 연결을 재사용(keep-alive)하면 HTTP 1 RTT만 들어요. HTTP/3(QUIC)는 전송과 암호화 handshake를 합쳐 처음에도 약 2 RTT로 줄였어요.", "p98": "이 문장은 X예요. 'TCP 연결 단계의 실패'라는 부분이 틀렸어요. ERR_NAME_NOT_RESOLVED는 도메인 이름을 IP로 바꾸지 못한 DNS 단계의 실패예요.\n이름 해석(resolve)이란 도메인 이름을 IP 주소로 바꾸는 과정이라는 뜻이에요. 이게 실패하면 어느 IP로 갈지 모르니 TCP 연결은 시도조차 하지 않아요.\n그래서 서버나 방화벽이 아니라 도메인 철자, DNS 레코드 존재 여부, 내 PC의 DNS 설정을 먼저 봐야 해요. 반대로 ERR_CONNECTION_REFUSED나 ERR_CONNECTION_TIMED_OUT은 IP는 찾았지만 TCP 연결에서 실패한 경우라 서버 실행 여부와 방화벽을 확인해요.", "p99": "이 문장은 O예요. Virtual Hosting은 IP와 포트 하나로 여러 웹사이트를 운영하는 방식이고, HTTP 요청의 Host 헤더를 보고 어느 사이트로 보낼지 정해요.\nHost 헤더는 클라이언트가 '나는 이 도메인의 페이지를 원해'라고 요청에 적어 보내는 값이라는 뜻이에요. 그래서 a.com과 b.com이 같은 IP여도 서버는 구분할 수 있어요.\n그런데 HTTPS에서는 Host 헤더가 암호화돼 있어서, 암호화가 시작되기 전에 어떤 사이트의 인증서를 줄지 정할 방법이 필요해요. 그 역할을 TLS handshake의 SNI가 해요. 즉 HTTP는 Host로, HTTPS는 먼저 SNI로 사이트를 구분해요.", "p100": "이 문장은 O예요. curl --resolve는 특정 도메인을 원하는 IP로 고정해 요청을 보내는 옵션이에요. 예를 들어 --resolve shop.com:443:1.2.3.4 처럼 쓰면 DNS를 거치지 않고 그 IP로 바로 접속해요.\n이 옵션의 장점은 Host 헤더와 SNI는 shop.com 그대로 유지된다는 점이에요. 그래서 그냥 IP로 접속할 때와 달리 인증서 검증이나 Virtual Hosting도 실제와 똑같이 동작해요.\n진단할 때는 이렇게 생각하면 돼요. 고정한 IP로는 잘 되는데 평소엔 안 된다면 DNS 문제이고, 고정해도 안 된다면 서버 쪽 문제예요."};

(function(){
const QZ=QZ14.map(q=>q.slice(0,5)).concat(QZ5);QZ.forEach((q,i)=>{q[5]=(typeof DETAIL!=='undefined'&&DETAIL[i])||'';});
const NB=QZ.length;PQ.forEach(p=>QZ.push([p[0],null,p[2],p[3],p[4],(typeof DETAIL!=='undefined'&&DETAIL['p'+p[1]])||'',p[1]]));
const det=q=>q[5]?'<div class="qzD"><b>자세한 설명</b>'+esc(q[5]).replace(/\n/g,'<br>')+'</div>':'';
const UN={1:'기초',2:'주소와 길',3:'전송',4:'웹 요청',5:'REST API'},U=[1,2,3,4,5],KEY='nox.wrong.v1';
const q$=id=>document.getElementById(id);
let wrong=new Set();try{wrong=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...wrong]));}catch(e){}};
const S={units:new Set(U),mode:'r100',list:[],i:0,ok:0,bad:[],ans:[],answered:false,screen:'setup',exam:false};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const isP=i=>!!QZ[i][6];
function pool(mode){if(mode==='exam')return QZ.map((q,i)=>i);const ids=QZ.map((q,i)=>i).filter(i=>S.units.has(QZ[i][0]));
  if(mode==='qc')return ids.filter(i=>QZ[i][1]);if(mode==='pq')return ids.filter(isP);if(mode==='wrong')return ids.filter(i=>wrong.has(i));return ids;}
function tag(q){return '<span class="qzU">'+q[0]+'주 '+UN[q[0]]+'</span>'+(q[1]?'<span class="qzQ">퀵체크 '+q[1]+'</span>':'')+(q[6]?'<span class="qzK">[퀴즈] '+q[6]+'번</span>':'');}
function setup(){S.screen='setup';const ex=S.mode==='exam',n={r100:Math.min(100,pool('r100').length),qc:pool('qc').length,pq:pool('pq').length,wrong:pool('wrong').length,exam:100};
  q$('qzBody').innerHTML='<div class="qzH">OX 퀴즈 <small>전체 '+QZ.length+'문제 · 퀵체크 '+QZ.filter(q=>q[1]).length+' · [퀴즈] '+QZ.filter(q=>q[6]).length+'</small></div>'+
  '<div class="qzL">풀 방식</div><div class="qzChips">'+[['r100','100문제 풀기'],['qc','퀵체크만'],['pq','[퀴즈]만'],['wrong','오답노트만'],['exam','시험']].map(([k,t])=>'<button class="qzC'+(k==='exam'?' ex':'')+(S.mode===k?' on':'')+'" data-m="'+k+'">'+t+' <small>'+n[k]+'</small></button>').join('')+'</div>'+
  (ex?'':'<div class="qzL">주차</div><div class="qzChips">'+U.map(u=>'<button class="qzC'+(S.units.has(u)?' on':'')+'" data-u="'+u+'">'+u+'주 '+UN[u]+' <small>'+QZ.filter(q=>q[0]===u).length+'</small></button>').join('')+'</div>')+
  '<p class="qzNote">'+(ex?'<b>시험 모드</b> · 교수님이 주신 <b>[퀴즈] 100문제에서 30문제</b>, 나머지 문제집에서 <b>70문제</b>를 무작위로 뽑아 모두 100문제예요. 볼 때마다 문제가 달라져요.<br>⏱ 시간을 재고, 끝나면 주차별 정답률을 보여 줘요. 해설은 문제마다 바로 나와요.':S.mode==='r100'?'고른 주차에서 무작위로 '+n.r100+'문제를 뽑아요.':S.mode==='qc'?'각 주차 강의의 Quick Check 문항만 풀어요.':S.mode==='pq'?'교수님이 주신 100문제 중 고른 주차의 문제를 순서를 섞어 풀어요. 시험에 약 30%가 나온다고 하셨어요.':'틀렸던 문제만 다시 풀어요. 맞히면 오답노트에서 빠져요.')+'</p>'+
  '<div class="qzRow"><button class="btn pri" id="qzGo"'+(n[S.mode]?'':' disabled')+'>시작하기 ▶</button><button class="btn" id="qzNb">오답노트 보기 ('+wrong.size+')</button></div>'+
  '<p class="qzNote kb">키보드: O 또는 1 = 맞다 · X 또는 2 = 틀리다 · Enter = 다음 문제 · ← = 이전 문제</p>';
  q$('qzBody').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=+b.dataset.u;if(S.units.has(u)){if(S.units.size>1)S.units.delete(u);}else S.units.add(u);setup();});
  q$('qzBody').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;setup();});
  q$('qzGo').onclick=()=>{let l;if(S.mode==='exam'){const all=QZ.map((q,i)=>i);l=shuf(shuf(all.filter(isP)).slice(0,30).concat(shuf(all.filter(i=>!isP(i))).slice(0,70)));}else{l=shuf(pool(S.mode));if(S.mode==='r100')l=l.slice(0,100);}start(l);};
  q$('qzNb').onclick=notebook;}
/* 타이머 (시험 모드) */
const T={acc:0,t0:null,iv:null};
const el=()=>T.acc+(T.t0?Date.now()-T.t0:0);
const fmt=ms=>{const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t/60)%60,x=t%60,p=n=>String(n).padStart(2,'0');return (h?h+':'+p(m):p(m))+':'+p(x);};
function tick(){const e=q$('qzT');if(e)e.textContent='⏱ '+fmt(el());}
function tRun(){if(T.t0||!S.exam||S.screen!=='play')return;T.t0=Date.now();clearInterval(T.iv);T.iv=setInterval(tick,500);tick();}
function tStop(){if(T.t0){T.acc+=Date.now()-T.t0;T.t0=null;}clearInterval(T.iv);tick();}
function start(l){Object.assign(S,{list:l,i:0,ok:0,bad:[],ans:[],answered:false,exam:S.mode==='exam'});T.acc=0;T.t0=null;clearInterval(T.iv);show();tRun();}
const prevBtn=()=>S.i>0?'<button class="btn" id="qzPv">◀ 이전 문제</button>':'';
function show(){S.screen='play';const q=QZ[S.list[S.i]],done=S.ans[S.i]!=null;S.answered=done;
  q$('qzBody').innerHTML='<div class="qzTop">'+tag(q)+'<span class="qzP"></span>'+(S.exam?'<span class="qzT" id="qzT"></span>':'')+'</div>'+
  '<div class="qzBarO"><i style="width:'+(S.ans.filter(x=>x!=null).length/S.list.length*100)+'%"></i></div>'+
  '<div class="qzS">'+esc(q[3])+'</div>'+
  '<div class="qzOX"><button class="qzB o" data-a="1">O<small>맞다</small></button><button class="qzB x" data-a="0">X<small>틀리다</small></button></div>'+
  '<div id="qzF">'+(done?'':'<div class="qzRow">'+prevBtn()+'<button class="btn qzQuit" id="qzQ">그만 풀기</button></div>')+'</div>';
  q$('qzBody').querySelectorAll('.qzB').forEach(b=>b.onclick=()=>answer(+b.dataset.a));
  if(done)feedback();else bind();prog();tick();window.scrollTo(0,0);}
function prog(){q$('qzBody').querySelector('.qzP').textContent=(S.i+1)+' / '+S.list.length+' · 맞힘 '+S.ok;}
function bind(){const p=q$('qzPv');if(p)p.onclick=prevQ;const x=q$('qzQ');if(x)x.onclick=quit;}
function quit(){const e=q$('qzQ');if(!e)return;e.outerHTML='<span id="qzCf">여기까지 채점할까요? <button class="btn pri" id="qzY">결과 보기</button> <button class="btn" id="qzN">계속 풀기</button></span>';
  q$('qzY').onclick=result;q$('qzN').onclick=show;}
function answer(a){if(S.answered)return;S.answered=true;S.ans[S.i]=a;const id=S.list[S.i],q=QZ[id],ok=a===q[2];
  if(ok){S.ok++;if(S.mode==='wrong')wrong.delete(id);}else{S.bad.push(id);wrong.add(id);}save();
  q$('qzBody').querySelector('.qzBarO i').style.width=(S.ans.filter(x=>x!=null).length/S.list.length*100)+'%';
  feedback();prog();}
function feedback(){const a=S.ans[S.i],q=QZ[S.list[S.i]],ok=a===q[2];
  q$('qzBody').querySelectorAll('.qzB').forEach(b=>{b.disabled=true;const v=+b.dataset.a;if(v===q[2])b.classList.add('ans');if(v===a&&!ok)b.classList.add('no');});
  q$('qzF').innerHTML='<div class="qzFb '+(ok?'ok':'ng')+'"><b>'+(ok?'정답이에요!':'아쉬워요. 정답은 '+(q[2]?'O':'X')+'예요.')+'</b><p>'+esc(q[4])+'</p>'+(ok?(q[5]?'<button class="qzMore" id="qzMore">자세한 설명 보기 ▾</button><div id="qzDw" hidden>'+det(q)+'</div>':''):det(q))+'</div>'+
  '<div class="qzRow">'+prevBtn()+'<button class="btn pri" id="qzNx">'+(S.i<S.list.length-1?'다음 문제 ▶':'결과 보기 ▶')+'</button></div>';
  q$('qzNx').onclick=nextQ;bind();const m=q$('qzMore');if(m)m.onclick=()=>{q$('qzDw').hidden=false;m.remove();};}
function prevQ(){if(S.i>0){S.i--;show();}}
function nextQ(){if(!S.answered)return;if(S.i<S.list.length-1){S.i++;show();}else result();}
function result(){S.screen='result';tStop();const tm=T.acc,n=S.ans.filter(x=>x!=null).length,pc=n?Math.round(S.ok/n*100):0;
  q$('qzBody').innerHTML='<div class="qzH">결과</div><div class="qzScore"><b>'+S.ok+'</b> / '+n+'<small>'+pc+'%</small></div>'+
  (S.exam?'<div class="qzTime"><span>⏱ 걸린 시간 <b>'+fmt(tm)+'</b></span><span>문제당 평균 <b>'+(n?(tm/n/1000).toFixed(1):'0')+'초</b></span></div>':'')+
  '<div class="qzUnits">'+U.map(u=>{const ids=S.list.filter((id,k)=>QZ[id][0]===u&&S.ans[k]!=null),ok=S.list.filter((id,k)=>QZ[id][0]===u&&S.ans[k]===QZ[id][2]).length;
     return ids.length?'<div><span>'+u+'주 '+UN[u]+'</span><i><b style="width:'+(ok/ids.length*100)+'%"></b></i><em>'+ok+' / '+ids.length+'</em></div>':'';}).join('')+'</div>'+
  (S.bad.length?'<div class="qzL">이번에 틀린 문제 '+S.bad.length+'개</div><div class="qzList">'+S.bad.map(i=>item(i,false)).join('')+'</div>':(n?'<p class="qzNote">이번에 푼 문제는 모두 맞혔어요.</p>':''))+
  '<div class="qzRow">'+(S.bad.length?'<button class="btn pri" id="qzRe">틀린 문제 다시 풀기</button>':'')+'<button class="btn" id="qzHome">처음으로</button></div>';
  if(S.bad.length)q$('qzRe').onclick=()=>{S.mode='wrong';start(shuf(S.bad.slice()));};
  q$('qzHome').onclick=setup;bindItems();window.scrollTo(0,0);}
function item(i,rm){const q=QZ[i];return '<div class="qzI"><div class="qzIt">'+tag(q)+'<b class="'+(q[2]?'o':'x')+'">'+(q[2]?'O':'X')+'</b></div><p>'+esc(q[3])+'</p><p class="qzE">'+esc(q[4])+'</p>'+det(q)+
  (rm?'<div class="qzRow sm"><button class="btn" data-rm="'+i+'">오답노트에서 빼기</button></div>':'')+'</div>';}
function bindItems(){q$('qzBody').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{wrong.delete(+b.dataset.rm);save();notebook();});}
function notebook(){S.screen='nb';const ids=[...wrong].filter(i=>QZ[i]).sort((a,b)=>a-b);
  q$('qzBody').innerHTML='<div class="qzH">오답노트 <small>'+ids.length+'문제</small></div>'+
  (ids.length?'<div class="qzList">'+ids.map(i=>item(i,true)).join('')+'</div>':'<p class="qzNote">아직 틀린 문제가 없어요.</p>')+
  '<div class="qzRow"><button class="btn" id="qzHome">처음으로</button>'+(ids.length?'<button class="btn" id="qzClr">오답노트 비우기</button><span id="qzCf"></span>':'')+'</div>';
  q$('qzHome').onclick=setup;bindItems();
  if(ids.length)q$('qzClr').onclick=()=>{q$('qzCf').innerHTML='정말 비울까요? <button class="btn pri" id="qzY">비우기</button> <button class="btn" id="qzN">취소</button>';
    q$('qzY').onclick=()=>{wrong.clear();save();notebook();};q$('qzN').onclick=()=>{q$('qzCf').innerHTML='';};};}
window.addEventListener('keydown',e=>{if(S.screen!=='play')return;const k=e.key;
  if(!S.answered){if('oO1ㅐ'.includes(k)&&k.length===1)answer(1);else if('xX2ㅌ'.includes(k)&&k.length===1)answer(0);}
  else if(k==='Enter'||k==='ArrowRight'){e.preventDefault();nextQ();}
  if(k==='ArrowLeft'){e.preventDefault();prevQ();}});
setup();
})();
</script></body></html>
