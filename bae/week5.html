  --bg:#F5F0E6;--bg2:#FBF3E4;--bg3:#FFFBF2;--bg4:#F3EBDD;--stg:#F4ECDD;--grid:rgba(61,43,31,.055);
  --bd:#E6DCCB;--bd2:#D3C3AA;
  --tx:#24170E;--tx2:#4F3D2E;--tx3:#7C6652;
  --or:#D97757;--orD:#9A3F1E;--orL:#FBE9DF;--teal:#2F8F7A;--tealL:#DDF0EA;--amber:#C98A1E;--amL:#FBF3E2;

}

  --ink:#0E0B08;--paper:#2E261F;color-scheme:dark}}

b,strong{font-weight:700}
button{font:inherit;color:inherit}
/* 헤더 */
header{height:64px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:3px solid var(--tx);background:var(--bg2)}
.brand{white-space:nowrap;flex:none}
.brand b{display:block;font-size:22px;line-height:1.15;color:var(--orD)}
.brand span{font-size:12px;color:var(--tx3)}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;padding:6px 4px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--tx);box-shadow:2px 2px 0 var(--tx);background:var(--bg3);font-size:12px;padding:3px 10px;cursor:pointer;white-space:nowrap}
nav button i{font-style:normal;font-family:var(--mono);color:var(--tx3)}
nav button:hover{background:var(--orL)}
nav button.on{background:var(--or);color:var(--on)}
nav button.on i{color:var(--on)}
nav button.lock{opacity:.45;cursor:default;box-shadow:none}
nav .sep{flex:none;align-self:center;color:var(--bd2)}
/* 본문 */
main{display:block;height:calc(100% - 64px)}
.stage{height:100%}
.stage{position:relative;overflow:hidden;background-color:var(--stg);background-image:linear-gradient(90deg,var(--grid) 2px,transparent 2px),linear-gradient(var(--grid) 2px,transparent 2px);background-size:24px 24px}
#sceneWrap{position:absolute;left:8px;top:46px;right:var(--rw,330px);bottom:var(--bb,84px);display:flex;align-items:center;justify-content:center}
#scene{position:relative;width:960px;height:600px;flex:none;transform-origin:center center}
.layer{position:absolute;inset:0;transition:opacity .45s steps(9)}
#scene.ana .real,#scene.real .ana{opacity:0;pointer-events:none}
.layer.intro{opacity:0;pointer-events:none}
#scene.intro .layer{opacity:0;pointer-events:none}
#scene.intro .layer.intro{opacity:1;pointer-events:auto}
#scene.ana .ana,#scene.real .real{opacity:1}
.abs{position:absolute}
/* 모드 표지판 */
.modeTag{position:absolute;left:14px;top:12px;z-index:6;display:flex;align-items:center;gap:8px;border:2px solid var(--tx);box-shadow:3px 3px 0 var(--tx);background:var(--bg3);padding:3px 10px;font-size:12px}
.modeTag b{color:var(--orD)}
/* 칠판 (설명 단계) */
.board{position:absolute;left:96px;top:24px;width:800px;height:470px;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);background:#2F4A3A;color:#F3EBDD;padding:18px 26px 20px;display:flex;flex-direction:column}
.board::after{content:'';position:absolute;left:-4px;right:-4px;bottom:-22px;height:14px;background:#8B5A2B;border:4px solid var(--ink)}
.board .bk{font-size:12px;color:#B9D7C4}
.board h3{font-family:'Galmuri14',var(--font);font-size:28px;line-height:1.3;margin:2px 0 10px;color:#FFF8F0;font-weight:400}
.board .bt{font-family:var(--read);font-size:15px;line-height:1.85;overflow:auto;flex:1;padding-right:6px}
.board .bt p{margin:0 0 9px}
.board .bt b{color:#F2C14E;font-weight:400}
.board .bt code{background:#24392D;border-color:#4E6B58;color:#F2C14E}
.board .bt ul,.board .bt ol{margin:0 0 9px 22px}
.board .bt li{margin-bottom:3px}
.board .go{align-self:flex-end;margin-top:8px}
.chalk{position:absolute;left:30px;top:410px;z-index:9}
/* 하단 바 */
.bar{position:absolute;left:12px;right:12px;bottom:10px;height:56px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:var(--bg2);z-index:7}
.bar .pos{font-family:var(--mono);font-size:12px;color:var(--tx2);min-width:58px;text-align:center}
.seg{display:flex;border:2px solid var(--tx);box-shadow:3px 3px 0 var(--tx);margin:0 auto}
.seg button{border:0;background:var(--bg3);padding:6px 14px;cursor:pointer;font-size:12px;white-space:nowrap}
.seg button+button{border-left:2px solid var(--tx)}
.seg button.on{background:var(--or);color:var(--on)}
.seg button:disabled{opacity:.35;cursor:default}
button.btn{border:2px solid var(--tx);box-shadow:3px 3px 0 var(--tx);background:var(--bg3);font-size:12px;padding:6px 12px;cursor:pointer;line-height:1.3;white-space:nowrap}
button.btn:hover{background:var(--orL)}
button.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tx)}
button.btn.pri{background:var(--or);color:var(--on)}
button.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
button.btn.on{background:var(--orL);color:var(--orD)}
.btn.pulse{animation:bpx 1s steps(30) infinite}
@keyframes bpx{50%{box-shadow:3px 3px 0 var(--tx),0 0 0 4px var(--or)}}
/* 설명 패널 */
aside{display:none}
.kicker{font-size:12px;color:var(--tx3)}
aside h2{font-size:24px;line-height:1.3;margin:2px 0 10px;font-weight:700}
.q{font-family:var(--read);font-size:15px;line-height:1.7;color:var(--orD);background:var(--orL);border-left:4px solid var(--or);padding:8px 12px;margin:0 0 12px}
.q small{display:block;font-family:var(--small);font-size:10px;color:var(--tx3)}
.body{font-family:var(--read);font-size:15px;line-height:1.8}
.body p{margin:0 0 10px}
.body ul,.body ol{margin:0 0 10px 20px}
.body li{margin-bottom:4px}
.body b{color:var(--orD)}
.body table{width:100%;border-collapse:collapse;font-family:var(--font);font-size:12px;line-height:1.55;margin:4px 0 12px}
.body th{text-align:left;font-weight:700;border-bottom:2px solid var(--tx);padding:4px 4px}
.body td{border-bottom:2px dotted var(--bd2);padding:5px 4px;vertical-align:top}
code{font-family:var(--mono);font-size:12px;background:var(--bg4);border:1px solid var(--bd2);padding:0 4px;color:var(--orD)}
.ctrl{margin:12px 0;padding:12px;border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:var(--bg3)}
.ctrl .lab{font-size:12px;color:var(--tx3);margin-bottom:8px}
.ctrl .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .row+.row{margin-top:8px}
.ctrl .out{font-family:var(--read);font-size:15px;line-height:1.7;margin-top:10px;min-height:26px}
.map{margin:12px 0;border:2px solid var(--tx);background:var(--bg3)}
.map .mh{font-size:12px;padding:4px 10px;border-bottom:2px solid var(--tx);background:var(--amL);color:var(--tx)}
.map table{width:100%;border-collapse:collapse;font-size:12px}
.map td{padding:5px 10px;border-bottom:2px dotted var(--bd2);vertical-align:top}
.map td:first-child{width:46%;color:var(--tx2)}
.map td:last-child{color:var(--tx)}
.map tr:last-child td{border-bottom:0}
.tips{margin-top:14px;padding:10px 12px;border:2px solid var(--amber);background:var(--amL)}
.tips h4{font-size:12px;color:var(--amber);margin-bottom:6px}
.tips ul{margin-left:18px;font-family:var(--read);font-size:15px;line-height:1.7}
.tips li{margin-bottom:6px}
.sum{margin-top:14px;padding:10px 12px;border:2px solid var(--or);background:var(--orL);font-family:var(--read);font-size:15px;line-height:1.7}
.sum b{display:block;font-family:var(--font);font-size:12px;color:var(--orD)}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
/* 계약서 카드 */
.ct{border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:var(--paper);margin-bottom:14px}
.ctH{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:2px solid var(--tx);font-size:12px;cursor:pointer;background:var(--bg2)}
.ctH b{color:var(--orD)}
.ctH span{margin-left:auto;font-family:var(--mono);color:var(--tx3)}
.ctB{display:none;padding:6px 10px 8px}
.ct.open .ctB{display:block}
.cr{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:4px 0;border-bottom:2px dotted var(--bd2);font-size:12px;align-items:baseline}
.cr:last-child{border-bottom:0}
.cr .k{color:var(--tx3)}
.cr .v{font-family:var(--mono);color:var(--tx3)}
.cr.done .k{color:var(--tx)}.cr.done .v{color:var(--tx)}
.cr.now{background:var(--orL)}.cr.now .k{color:var(--orD)}
/* 안내 커서 + 말풍선 (지난 주차 웹과 같은 엔진) */
#ptr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:8}
.guide{position:absolute;left:40px;top:70px;width:0;height:0;pointer-events:none;z-index:9}
.guide svg{position:absolute;left:0;top:0;overflow:visible;transform-origin:0 0;filter:drop-shadow(3px 3px 0 rgba(36,23,14,.35));shape-rendering:crispEdges}
.guide.o1 svg{transform:scaleX(-1)}.guide.o2 svg{transform:scaleY(-1)}.guide.o3 svg{transform:scale(-1,-1)}
.guide .ring{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%!important;border:3px solid var(--or);opacity:0}
.guide.click .ring{animation:ringpx calc(.6s / var(--spd)) steps(18)}
@keyframes ringpx{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.8);opacity:0}}
.guide.idle svg{animation:wigpx calc(1.4s / var(--spd)) steps(42) infinite}
@keyframes wigpx{50%{translate:3px 3px}}
.bub{position:absolute;left:110px;top:60px;width:360px;z-index:9;border:3px solid var(--tx);box-shadow:6px 6px 0 var(--or);background:var(--bg3);padding:12px 16px;font-family:var(--read);font-size:15px;line-height:1.8;color:var(--tx);visibility:hidden;max-height:calc(100% - 150px);overflow-y:auto}
.bub.show{visibility:visible}
.bub b{color:var(--orD)}
.bub .gap{display:block;height:.6em}
.bub .ghint{display:block;margin-top:8px;font-family:var(--font);font-size:12px;color:var(--tx2);border-top:2px dashed var(--bd2);padding-top:6px}
.bub ul,.bub ol{margin:2px 0 2px 20px}
.bub table{border-collapse:collapse;font-family:var(--font);font-size:12px;line-height:1.5;margin:4px 0;width:100%}
.bub td,.bub th{border-bottom:2px dotted var(--bd2);padding:3px 4px;text-align:left;vertical-align:top}
.bub th{border-bottom:2px solid var(--tx)}
.bub .okk{color:var(--teal)}.bub .ngg{color:var(--red)}
.scope{position:absolute;left:16px;top:10px;z-index:6;font-size:12px;color:var(--tx2);border:2px solid var(--tx);box-shadow:3px 3px 0 var(--tx);background:var(--bg3);padding:4px 12px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 360px);overflow:hidden;text-overflow:ellipsis}
.scope b{color:var(--tx)}.scope span{color:var(--tx3)}
.vtag{position:absolute;z-index:6;font-size:12px;border:2px solid var(--tx);box-shadow:3px 3px 0 var(--tx);background:var(--bg3);padding:3px 10px;display:flex;gap:0;pointer-events:auto}
.vtag button{border:0;background:transparent;padding:0 8px;cursor:pointer;font-size:12px;color:var(--tx3)}
.vtag button.on{color:var(--orD);font-weight:700}
.vtag button:disabled{display:none}
.vtag i{font-style:normal;color:var(--bd2)}
/* 장면 첫머리 안내 카드 */
#dim{position:absolute;inset:0;background:rgba(36,23,14,.38);z-index:8;opacity:0;pointer-events:none;transition:opacity .3s steps(5)}
#dim.on{opacity:1}
.bub.open{box-shadow:8px 8px 0 var(--or);max-height:calc(100% - 140px)}
.oc .ock{font-family:var(--font);font-size:12px;color:var(--tx3)}
.oc .oct{font-size:24px;line-height:1.3;margin:2px 0 8px;color:var(--tx)}
.oc .ocq{color:var(--orD);background:var(--orL);border-left:4px solid var(--or);padding:4px 10px;margin-bottom:8px}
.oc .och{font-family:var(--font);font-size:12px;color:var(--tx);background:var(--amL);border:2px solid var(--tx);display:inline-block;padding:0 8px;margin:6px 0 4px}
.oc ul{margin:0 0 4px 20px}
.oc .ocm td{border-bottom:2px dotted var(--bd2);padding:3px 6px;font-family:var(--read);font-size:15px}
.oc .ocm td:first-child{color:var(--tx2);width:44%}.oc .ocm td:nth-child(2){color:var(--or);width:20px}
.oc .ocw{margin-top:8px;padding-top:8px;border-top:2px dashed var(--bd2)}
/* 하단 막대 */
.bar{position:absolute;left:12px;right:12px;bottom:10px;min-height:56px;height:auto;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px 10px;border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:var(--bg2);z-index:7}
.bar .bpos{font-family:var(--mono);font-size:12px;color:var(--tx2);min-width:46px;text-align:center}
.bar .sep{width:2px;align-self:stretch;background:var(--bd2);margin:0 4px}
.bar .simLab{font-size:12px;color:var(--tx3);white-space:nowrap}
.simBtns{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 200px;min-width:0}
.simBtns .grp{display:flex;gap:6px;flex-wrap:wrap;padding-right:8px;margin-right:2px;border-right:2px dotted var(--bd2)}
.simBtns .grp:last-child{border-right:0}
select.btn{font-family:var(--mono);cursor:pointer}
button.btn.sm{font-size:12px;padding:5px 10px;white-space:nowrap}
#bAuto.on{background:var(--orL);color:var(--orD)}
.spd{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:var(--tx2);flex:none;padding-left:8px}
.spd input{-webkit-appearance:none;appearance:none;width:80px;height:10px;background:var(--bg4);border:2px solid var(--tx);outline:none}
.spd input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:18px;background:var(--or);border:2px solid var(--tx);cursor:pointer}
.spd input::-moz-range-thumb{width:10px;height:16px;background:var(--or);border:2px solid var(--tx);border-radius:0;cursor:pointer}
.spd b{font-family:var(--mono);color:var(--orD);min-width:22px}
/* 오른쪽 카드 */
#rcol{position:absolute;right:16px;top:10px;width:300px;display:flex;flex-direction:column;gap:10px;z-index:6;max-height:calc(100% - var(--bb,84px) - 16px)}
.hc{position:relative;width:100%;flex:0 1 auto;min-height:0;display:flex;flex-direction:column;border:3px solid var(--tx);box-shadow:4px 4px 0 var(--tx);background:var(--bg3)}
.hcBtn{flex:none;width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:none;font-size:12px;color:var(--tx);padding:7px 12px;cursor:pointer;text-align:left}
.hcBtn .cnt{font-family:var(--mono);font-size:12px;color:var(--or)}
.hcBtn .chev{margin-left:auto;color:var(--tx3)}
.hc.open .chev{transform:rotate(180deg)}
.pill{font-family:var(--small);font-size:10px;padding:0 6px;border:2px solid var(--tx);background:var(--or);color:var(--on);display:none}
.pill.show{display:inline-block;animation:blinkpx calc(1.2s / var(--spd)) steps(36) infinite}
@keyframes blinkpx{50%{opacity:.35}}
.hcBody{display:none;padding:2px 12px 10px;border-top:2px solid var(--tx);overflow-y:auto;min-height:0}
.hc.open .hcBody{display:block}
.lgI{padding:7px 0;border-bottom:2px dotted var(--bd2);font-family:var(--read);font-size:15px;line-height:1.7;color:var(--tx)}
.lgI:last-child{border-bottom:none}
.lgI b{display:block;font-family:var(--font);font-size:12px;margin:0 0 2px;color:var(--tx)}
.lgI.new b{color:var(--orD)}
.lgI.new b::after{content:'NEW';font-family:var(--small);font-size:10px;color:var(--on);background:var(--or);border:1px solid var(--tx);padding:0 6px;margin-left:6px;vertical-align:1px}
.hc .cr{grid-template-columns:70px 1fr}
.btn.pulse{animation:bpx calc(1s / var(--spd)) steps(30) infinite}
:root{--spd:1}
/* 장면 부품: 상자류 */
.box{position:absolute;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:var(--paper)}
.box>.t{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-bottom:3px solid var(--ink);font-size:12px;background:var(--bg2);white-space:nowrap;overflow:hidden}
.box>.t i{font-style:normal;font-family:var(--mono);color:var(--tx3);margin-left:auto}
.dots{display:flex;gap:4px}.dots u{display:block;width:8px;height:8px;border:2px solid var(--ink);text-decoration:none}
.dots u:nth-child(1){background:#E57260}.dots u:nth-child(2){background:#E8B33A}.dots u:nth-child(3){background:#7CD992}
.url{font-family:var(--mono);font-size:12px;border:2px solid var(--ink);background:var(--bg3);padding:0 6px;margin:6px 8px;color:var(--tx2);white-space:nowrap;overflow:hidden}
.lbl{position:absolute;font-size:12px;white-space:nowrap;color:var(--tx2);text-align:center}
.lbl.big{font-size:15px;font-family:var(--read);color:var(--tx)}
.tagp{position:absolute;font-size:12px;border:2px solid var(--ink);background:var(--bg3);padding:0 8px;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.tagp.or{background:var(--or);color:var(--on)}.tagp.teal{background:var(--teal);color:var(--on)}.tagp.red{background:var(--red);color:var(--on)}
/* HTTP 메시지 상자 */
.msg{position:absolute;width:250px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:var(--paper);font-family:var(--mono);font-size:12px;line-height:1.5;z-index:5}
.msg .mk{display:flex;justify-content:space-between;padding:0 6px;font-family:var(--font);font-size:12px;color:var(--on);background:var(--or)}
.msg.res .mk{background:var(--teal)}
.msg.bad .mk{background:var(--red)}
.msg .ml{padding:3px 6px;font-weight:700;border-bottom:2px solid var(--ink);white-space:nowrap;overflow:hidden}
.msg .mh{padding:2px 6px;color:var(--tx2);border-bottom:2px dashed var(--bd2);white-space:nowrap;overflow:hidden}
.msg .mh:empty{display:none}
.msg .mb{padding:3px 6px;white-space:pre-wrap;word-break:break-all}
.msg .mb:empty{display:none}
.msg .hi,.hiPart{background:#F9D9C8;color:#7A3115;outline:2px solid var(--or)}
/* DB 표 */
.dbt{position:absolute;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:var(--paper);font-size:12px}
.dbt .t{padding:0 8px;border-bottom:3px solid var(--ink);background:var(--bg2);font-size:12px}
.dbt table{border-collapse:collapse;font-family:var(--mono);font-size:12px}
.dbt th{padding:2px 8px;border-bottom:2px solid var(--ink);text-align:left;color:var(--tx2);font-weight:400}
.dbt td{padding:2px 8px;border-bottom:2px dotted var(--bd2);white-space:nowrap}
.dbt tr.new td{background:#DDF0EA;color:#17594A}
.dbt tr.chg td.c{background:#FBE9DF;color:#7A3115}
.dbt tr.gone td{text-decoration:line-through;color:var(--tx3)}
.dbt .empty{padding:6px 8px;color:var(--tx3);font-family:var(--font)}
/* 벽 */
.wall{position:absolute;background-color:#B9603F;background-image:linear-gradient(var(--ink) 2px,transparent 2px),linear-gradient(90deg,var(--ink) 2px,transparent 2px),linear-gradient(90deg,var(--ink) 2px,transparent 2px);background-size:100% 14px,28px 28px,28px 28px;background-position:0 0,0 0,14px 14px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.hole{position:absolute;background:var(--stg);border:3px solid var(--ink)}
/* 픽셀 스프라이트 */
.spr{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
.pop{animation:pop .35s steps(6)}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.shake{animation:shake .4s steps(8)}
@keyframes shake{25%{translate:-4px 0}75%{translate:4px 0}}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.fade{transition:opacity .3s steps(6)}
.okk{color:var(--teal)}.ngg{color:var(--red)}
/* 메뉴판/게시판 슬롯 */
.slots{position:absolute;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:var(--paper)}
.slots .sh{padding:0 8px;border-bottom:3px solid var(--ink);background:var(--amL);font-size:12px;text-align:center}
.slot{display:block;width:100%;text-align:left;border:0;border-bottom:2px dotted var(--bd2);background:transparent;padding:3px 8px;font-size:12px;cursor:pointer;line-height:1.4}
.slot:last-child{border-bottom:0}
.slot small{display:block;font-family:var(--mono);font-size:12px;color:var(--tx3)}
.slot.on{background:var(--orL)}
.slot.on small{color:var(--orD)}
.slot.fill small{color:var(--tx)}
/* 사다리 */
.rung{position:absolute;left:0;right:0;height:62px;border:3px solid var(--ink);background:var(--bg3);padding:4px 10px;font-size:12px}
.rung b{font-size:12px}
.rung.at{background:var(--orL);box-shadow:4px 4px 0 var(--or)}
.rung .ex{font-family:var(--mono);color:var(--tx2);display:block;white-space:nowrap;overflow:hidden}
/* 트리 */

<script>
/* ============ 공통: 장면 크기 맞추기 · 부품 · 단계 이동 ============ */
const $=s=>document.querySelector(s);
const scene=$('#scene'),LI=$('#intro'),LA=$('#ana'),LR=$('#real'),wrap=$('#sceneWrap');
let S=0,MODE='ana',RUN=0;
function fit(){const w=wrap.clientWidth,h=wrap.clientHeight;const k=Math.min(w/960,h/600);scene.style.transform='scale('+Math.max(.2,k)+')';}
new ResizeObserver(fit).observe(wrap);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// 단계가 바뀌면 진행 중인 애니메이션을 끊는다
async function W(ms,tok){await sleep(ms);if(tok!==RUN)throw 'stop';}
function run(fn){const tok=++RUN;fn(tok).catch(e=>{if(e!=='stop')console.error(e)});return tok;}

/* DOM 만들기 */
function D(parent,cls,x,y,w,h,html){const e=document.createElement('div');if(cls)e.className=cls;e.style.left=x+'px';e.style.top=y+'px';if(w!=null)e.style.width=w+'px';if(h!=null)e.style.height=h+'px';e.style.position='absolute';if(html!=null)e.innerHTML=html;parent.appendChild(e);return e;}
function L(parent,x,y,text,cls){return D(parent,'lbl '+(cls||''),x,y,null,null,text);}

/* 픽셀 스프라이트 (캔버스에 그려 이미지로) */
function mk(W_,H_,draw,sc=3){const c=document.createElement('canvas');c.width=W_*sc;c.height=H_*sc;const g=c.getContext('2d');const P=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x*sc),Math.round(y*sc),Math.round(w*sc),Math.round(h*sc))};draw(P);return {src:c.toDataURL(),w:W_*sc,h:H_*sc};}
const K='#24170E';
function person(o={}){return mk(18,34,P=>{
  const s=o.skin||'#F6D2B4',hr=o.hair||'#3D2B1F',sh=o.shirt||'#7FB2F0',y=4;
  if(o.hat==='chef'){P(4,0,10,1,K);P(3,1,12,4,K);P(4,1,10,3,'#FFFFFF');P(4,4,10,1,'#E6DED2');}
  P(3,y+1,12,11,K);P(4,y+2,10,9,s);
  if(o.hat==='chef'){P(4,y+2,10,1,hr);}else{P(4,y+2,10,3,hr);P(4,y+5,1,2,hr);P(13,y+5,1,2,hr);}
  if(o.long){P(3,y+5,2,9,K);P(4,y+5,1,8,hr);P(13,y+5,2,9,K);P(13,y+5,1,8,hr);}
  if(o.glasses){P(5,y+5,4,4,K);P(6,y+6,2,2,'#BFE3F2');P(9,y+5,4,4,K);P(10,y+6,2,2,'#BFE3F2');}
  else{P(6,y+6,2,2,K);P(10,y+6,2,2,K);}
  if(o.mood==='sad'){P(7,y+10,4,1,K);P(6,y+9,1,1,K);P(11,y+9,1,1,K);}
  else if(o.mood==='wow'){P(8,y+9,2,2,K);}
  else if(o.mood==='?'){P(7,y+9,4,1,K);}
  else{P(7,y+9,4,1,'#C0392B');}
  P(2,y+12,14,11,K);P(3,y+13,12,9,sh);P(3,y+13,2,9,'rgba(255,255,255,.28)');
  if(o.apron){P(5,y+14,8,8,'#FFFFFF');P(5,y+14,8,1,'#E6DED2');}
  if(o.vest){P(3,y+13,4,9,'#2A1C12');P(11,y+13,4,9,'#2A1C12');P(8,y+14,2,2,'#C0392B');}
  if(o.badge){P(11,y+15,3,3,'#E8B33A');}
  P(4,y+23,4,6,K);P(10,y+23,4,6,K);P(5,y+23,2,5,o.pants||'#2A3868');P(11,y+23,2,5,o.pants||'#2A3868');
});}
const SP={};

<table><tr><th>제약</th><th>한 줄</th><th>깨지면</th></tr>
<tr><td>Client–Server</td><td>화면과 데이터를 나눔</td><td>배포가 서로 묶임</td></tr>
<tr><td>Stateless</td><td>서버는 기억 안 함</td><td>서버를 늘릴 수 없음</td></tr>

<ul><li><b>요청</b>은 클라이언트 → 서버, <b>응답</b>은 서버 → 클라이언트로 가요. 둘 다 <b>텍스트 한 통</b>이고, 칸이 정해져 있어요: <b>첫 줄 · 헤더 · 빈 줄 · Body</b>.</li>
<li>요청 첫 줄의 <b>메서드</b>는 "무엇을 하려는지"(GET 조회, POST 생성 …), 응답 첫 줄의 <b>상태 코드</b>는 "결과가 어땠는지"(2xx 성공, 4xx 요청 쪽 문제, 5xx 서버 문제)예요.</li>
<li>이 메시지는 <b>TCP</b>(3주차) 연결 위로, <b>IP</b>(2주차) 주소를 따라 운반돼요.</li></ul>
<p>4주차가 HTTP라는 <b>"문법"</b>을 배운 주였다면, 5주차는 그 문법으로 <b>"어떤 문장을 쓸지"</b> 약속하는 주예요.</p>`,

/* ---- 커서 움직임 ---- */
function bez(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t,Y=t=>((ay*t+by)*t+cy)*t,dX=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{let t=x;for(let i=0;i<8;i++){const e=X(t)-x,d=dX(t);if(Math.abs(e)<1e-5||Math.abs(d)<1e-6)break;t-=e/d;}return Y(Math.min(1,Math.max(0,t)));};}
const EASE=bez(.4,0,.2,1);
function animPos(e,x,y,ms){ms=ms/SPD;if(!e._p)e._p=[parseFloat(e.style.left)||0,parseFloat(e.style.top)||0];
  const from=[e._p[0],e._p[1]],st=performance.now(),id=(e._aid||0)+1;e._aid=id;let last=-1;
  (function f(n){if(e._aid!==id)return;const t=Math.min(1,(n-st)/ms),fr=Math.floor((n-st)/33.333);
    if(fr!==last||t>=1){last=fr;const k=t>=1?1:EASE(Math.min(1,fr*33.333/ms));
      e._p=[from[0]+(x-from[0])*k,from[1]+(y-from[1])*k];e.style.left=e._p[0]+'px';e.style.top=e._p[1]+'px';}
    if(t<1)requestAnimationFrame(f);else if(e===bub||e===guide)updatePtr();})(st);}
function moveCursor(x,y,o,click){setEyes(curT?-1:1);animPos(guide,x,y,900);guide.classList.remove('o1','o2','o3');if(o)guide.classList.add('o'+o);
  const moved=Math.hypot(x-curPos[0],y-curPos[1])>3;curPos=[x,y];curO=o;
  if(click&&moved){guide.classList.remove('click');clearTimeout(guide._ct);guide._ct=setTimeout(()=>{guide.classList.remove('click');void guide.offsetWidth;guide.classList.add('click');},900/SPD);}}
function bubW(){return bub.classList.contains('open')?Math.min(620,SW()-40):Math.min(BW0,SW()-40);}
function obstacles(){const out=[];const lay=VIEW==='ana'?LA:LR;const st=stage.getBoundingClientRect();
  lay.querySelectorAll('*').forEach(e=>{const own=[...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim());
    const big=/\b(msg|dbt|slots|box|phone|room|rung|mon|node|verdict|tagp|spr)\b/.test(e.className);if(!own&&!big)return;
    const r=e.getBoundingClientRect();if(r.width<2||r.height<2)return;if(getComputedStyle(e).visibility==='hidden')return;
    out.push([r.left-st.left-3,r.top-st.top-3,r.width+6,r.height+6,big?2:1]);});
  ['rcol','scope','bar','vtag'].forEach(id=>{const e=$('#'+id);if(!e||getComputedStyle(e).display==='none')return;const r=stageRect(e);out.push([r.x-6,r.y-6,r.w+12,r.h+12,40]);});
  return out;}
function ovA(a,b){const w=Math.min(a[0]+a[2],b[0]+b[2])-Math.max(a[0],b[0]),h=Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1]);return w>0&&h>0?w*h:0;}
function bodyRect(x,y,o){const w=30,h=58;return [o&1?x-w:x-3,y-14,w+3,h];}
function bestO(T,obs){let q=null;for(const r of obs){if(r[4]>2)continue;if(T[0]>=r[0]&&T[0]<=r[0]+r[2]&&T[1]>=r[1]&&T[1]<=r[1]+r[3]&&r[4]===1){q=r;break;}}
  const cands=[[T,0,0],[T,1,0]];
  if(q){const cy=q[1]+q[3]/2;cands.push([[T[0],q[1]+q[3]+13],0,10],[[T[0],q[1]+q[3]+13],1,10],[[q[0]-1,cy],1,6],[[q[0]+q[2]+1,cy],0,6]);}
  let best=null;
  for(const [t,o,pen] of cands){const r=bodyRect(t[0],t[1],o);let sc=pen*20+(o?60:0);
    if(r[0]<4||r[1]<40||r[0]+r[2]>SW()-4||r[1]+r[3]>SH()-BOT())sc+=1e6;for(const x of obs)sc+=ovA(r,x)*Math.min(x[4],3)*3;
    if(!best||sc<best[0])best=[sc,o,t];}
  return [best[1],best[2]];}
function placeNear(T){
  if(!T||T[0]<0||T[0]>SW()||T[1]<20||T[1]>SH()){parkSmart();return;}guide.classList.remove('idle');
  const BW=bubW();bub.style.width=BW+'px';const bh=bub.offsetHeight||110;
  const obs=obstacles();const [o,tp]=bestO(T,obs);tipOff=[tp[0]-T[0],tp[1]-T[1]];const body=bodyRect(tp[0],tp[1],o);const tz=[T[0]-34,T[1]-20,68,40];
  moveCursor(tp[0],tp[1],o,true);
  let best=null;
  for(const r of [60,100,140,190,250,320,400,500,620])for(let a=0;a<360;a+=15){
    const rad=a*Math.PI/180,cx=T[0]+Math.cos(rad)*(r+BW/2*Math.abs(Math.cos(rad))),cy=T[1]+Math.sin(rad)*(r*0.7+bh/2*Math.abs(Math.sin(rad)));
    const b=[Math.round(cx-BW/2),Math.round(cy-bh/2),BW,bh];
    if(b[0]<8||b[1]<44||b[0]+BW>SW()-8||b[1]+bh>SH()-BOT()-4)continue;
    let sc=0;for(const q of obs)sc+=ovA(b,q)*q[4]*3;
    sc+=(ovA(b,tz)+ovA(b,body))*40+r*4;
    if(!best||sc<best[0])best=[sc,b[0],b[1]];}
  if(!best)best=[0,Math.max(8,Math.min(SW()-BW-8,T[0]+40)),Math.max(44,Math.min(SH()-BOT()-bh-4,T[1]+50))];
  animPos(bub,best[1],best[2],800);bub.dataset.x=best[1];bub.dataset.y=best[2];}
function parkSmart(){const BW=bubW();bub.style.width=BW+'px';const bh=bub.offsetHeight||110;const obs=obstacles();let best=null;
  for(let y=44;y<=SH()-BOT()-bh-4;y+=20)for(let x=48;x<=SW()-BW-8;x+=30){const b=[x,y,BW,bh];let sc=(Math.abs(x-(SW()-BW-14))+y)*0.3;for(const q of obs)sc+=ovA(b,q)*q[4]*3;if(!best||sc<best[0])best=[sc,x,y];}
  if(!best)best=[0,48,50];curT=null;guide.classList.add('idle');moveCursor(best[1]-34,best[2]+6,0,false);animPos(bub,best[1],best[2],700);bub.dataset.x=best[1];bub.dataset.y=best[2];ptr.style.display='none';}
function updatePtr(){
  if(!curT){ptr.style.display='none';return;}
  const T=tgtScreen(curT);if(!T){ptr.style.display='none';return;}
  const tx=T[0]+tipOff[0],ty=T[1]+tipOff[1];if(Math.hypot(tx-curPos[0],ty-curPos[1])>2)moveCursor(tx,ty,curO,false);
  const bx=+bub.dataset.x,by=+bub.dataset.y,bw=bub.offsetWidth,bh=bub.offsetHeight;
  const px=Math.max(bx,Math.min(bx+bw,tx)),py=Math.max(by,Math.min(by+bh,ty));
  const d=Math.hypot(tx-px,ty-py);
  if(d<60){ptr.style.display='none';return;}
  ptr.style.display='';pLine.setAttribute('x1',px);pLine.setAttribute('y1',py);
  const k=(d-22)/d;pLine.setAttribute('x2',px+(tx-px)*k);pLine.setAttribute('y2',py+(ty-py)*k);}

function buildSims(){const rows=simRows();$('#simBtns').innerHTML='';

      se.onchange=()=>{if(se.value!=='')pressSim(ri,+se.value);};g.appendChild(se);$('#simBtns').appendChild(g);return;}
    r.bs.forEach((b,bi)=>{const n=document.createElement('button');n.className='btn sm';n.textContent=(bi===0&&r.lab?r.lab+' ':'')+b.textContent.trim();n.title=b.textContent.trim();

function syncSims(){const rows=simRows();document.querySelectorAll('#simBtns .grp').forEach((g,ri)=>{const r=rows[ri];if(!r)return;

function beatLabel(){$('#bPos').textContent=(beat+1)+' / '+STEPS[S].beats.length;}
async function playBeat(i){
  const B=STEPS[S].beats;if(i<0||i>=B.length)return;
  clearTimeout(autoTimer);beat=i;beatLabel();const b=B[i],step=S,tok=++beatTok;
  const v=b.v||(i>0?null:STEPS[S].v0)||null;
  if(v&&v!==VIEW){bub.style.visibility='hidden';guide.style.visibility='hidden';ptr.style.display='none';setView(v);await esleep(380);if(tok!==beatTok||step!==S)return;}
  bub.style.visibility='';guide.style.visibility='';
  $('#dim').classList.toggle('on',!!b.open);bub.classList.toggle('open',!!b.open);
  if(b.open){gsay(b.s+'<span class="ghint">아래 <b>다음 설명 ▶</b>을 누르면 장면 설명을 시작해요.</span>');curT=null;setBar();ptr.style.display='none';
    requestAnimationFrame(()=>{const W_=Math.min(620,SW()-40);bub.style.width=W_+'px';const sw=$('#sceneWrap'),r=stageRect(sw);const bh=bub.offsetHeight;
      const x=Math.round(r.x+(r.w-W_)/2),y=Math.max(46,Math.round(r.y+(r.h-bh)/2));animPos(bub,x,y,500);bub.dataset.x=x;bub.dataset.y=y;
      guide.classList.add('idle');moveCursor(x-30,y+8,0,false);});
    scheduleAuto(2500+txtLen(b.s)*45);return;}
  if(b.do)b.do();
  if(b.btn){gsay(b.s+'<span class="ghint">'+(b.hint||('아래 <b>직접 해 보기</b>의 버튼을 눌러 직접 확인해 보세요.'))+'</span>');
    curT={btn:b.btn};setBar();requestAnimationFrame(()=>{placeNear(tgtScreen(curT));});
    if(auto)scheduleAuto(2600+txtLen(b.s)*50,b.btn);return;}
  gsay(b.s);curT=b.t||null;setBar();
  requestAnimationFrame(()=>{if(curT)placeNear(tgtScreen(curT));else parkSmart();});
  scheduleAuto(1800+txtLen(b.s)*55);}
function txtLen(s){return s.replace(/<[^>]+>/g,'').length;}
// 자동 재생: btn 장면이면 그 줄의 버튼을 차례로 눌러 보이고 넘어간다
function scheduleAuto(ms,row){clearTimeout(autoTimer);if(!auto)return;
  autoTimer=setTimeout(async()=>{if(row){const rows=simRows();const ri=rows.findIndex(r=>r.id===row);const tok=beatTok;
      if(ri>=0){const n=Math.min(rows[ri].bs.length,3);for(let k=0;k<n;k++){if(!auto||tok!==beatTok)return;pressSim(ri,k);await esleep(5200);}}
      if(!auto||tok!==beatTok)return;}
    next();},ms/SPD);}
function next(){if(beat<STEPS[S].beats.length-1)playBeat(beat+1);else if(S<STEPS.length-1)go(S+1);}
function prev(){if(beat>0)playBeat(beat-1);else if(S>0)go(S-1,STEPS[S-1].beats.length-1);}
function setBar(){
  $('#bPrevS').disabled=S===0;$('#bNextS').disabled=S===STEPS.length-1;$('#bPrev').disabled=S===0&&beat===0;
  const last=beat>=STEPS[S].beats.length-1,nb=$('#bNext');
  nb.textContent=last?(S<STEPS.length-1?'다음 장면으로 ▶':'끝'):'다음 설명 ▶';nb.disabled=last&&S===STEPS.length-1;
  nb.classList.toggle('pulse',last&&S<STEPS.length-1);
  $('#bAuto').classList.toggle('on',auto);}

  if(a==='bNext')next();if(a==='bPrev')prev();if(a==='bPrevS')go(S-1);if(a==='bNextS')go(S+1);

{t:[715,300],s:'상태 코드는 <b>첫 자리</b>만 봐도 누가 고칠지 알 수 있어요.'+GP+'<b>2xx</b> 성공 · <b>4xx</b> 요청을 보낸 쪽이 고칠 것 · <b>5xx</b> 서버가 고칠 것.'},
{t:[180,290],s:'층으로 보면 이렇게 쌓여요. IP(2주차)가 컴퓨터까지, TCP(3주차)가 그 안의 프로그램까지 빠짐없이 운반하고, HTTP(4주차)가 메시지의 <b>문법</b>을 정해요.'+GP+'5주차 REST API는 그 문법으로 <b>어떤 문장을 쓸지</b> 정하는 거예요. 강의 3쪽 표현으로 HTTP가 "문법"이면 REST API는 "문체와 어휘집"이에요.'},
{btn:'cp1',s:'아래 버튼으로 <b>첫 줄 · 헤더 · Body</b>를 하나씩 칠해 보세요. 요청과 응답에서 같은 칸이 함께 칠해져요.'},
{s:'메서드 다섯 개만 미리 보고 갈게요. 2장에서 직접 확인해요.'+GP+'<table><tr><th>메서드</th><th>뜻</th><th>안전</th><th>멱등</th></tr><tr><td>GET</td><td>보기</td><td>O</td><td>O</td></tr><tr><td>POST</td><td>새로 만들기</td><td>X</td><td>X</td></tr><tr><td>PUT</td><td>통째로 바꾸기</td><td>X</td><td>O</td></tr><tr><td>PATCH</td><td>일부만 고치기</td><td>X</td><td>△</td></tr><tr><td>DELETE</td><td>지우기</td><td>X</td><td>O</td></tr></table><b>안전</b> = 서버 데이터를 바꾸지 않음. <b>멱등</b> = 여러 번 보내도 결과 상태가 같음.'},
{s:'하나 더. HTTP는 <b>앞 요청을 기억하지 않아요.</b> 그래서 "로그인 상태"는 쿠키나 토큰을 <b>매번</b> 같이 보내서 흉내 내요(8장).'+GP+'HTTPS에선 이 메시지 전체가 암호화돼 <b>중간</b>에선 안 보이지만, <b>양 끝</b>(브라우저 개발자 도구, 서버 로그)에선 다 보여요.'},
{s:'<b>정리:</b> HTTP 메시지는 첫 줄 · 헤더 · Body로 된 텍스트 한 통이에요. 요청 첫 줄엔 <b>메서드와 경로</b>, 응답 첫 줄엔 <b>상태 코드</b>가 있어요. 이번 주는 이 칸들에 무엇을 적을지 약속해요.'}]});

sc('배경지식 ② 프론트엔드 · 백엔드 · fetch',{name:'프론트 · 백엔드',scope:'배경지식 ② · 강의 5, 7쪽 앞부분',v0:'real',
sims:[['cp2','real','']],
beats:[
{s:'웹 서비스는 보통 <b>두 프로그램</b>으로 나뉘어요. 이번 실습도 그래요. 두 프로그램이 어디서 돌아가고 어떻게 말을 거는지 볼게요.'},
{t:[160,84],s:'왼쪽은 <b>프론트엔드</b>예요. 실습에선 <code>index.html</code>을 <b>5500번 포트</b>로 띄워요.'+GP+'<b>포트</b>는 한 컴퓨터 안에서 프로그램을 구분하는 번호예요(3주차). 같은 컴퓨터라도 포트가 다르면 다른 프로그램이에요.'},
{t:[700,84],s:'오른쪽은 <b>백엔드</b>, FastAPI 서버예요. <b>8000번 포트</b>에서 요청을 기다려요.'},
{t:[150,144],s:'프론트의 JavaScript는 <code>fetch()</code>로 서버에 말을 걸어요.'+GP+'<b>fetch</b>는 브라우저에 들어 있는 JS 함수예요. 페이지를 새로 고치지 않고 HTTP 요청을 보내고 응답을 받아 와요. <code>await</code>는 "응답이 올 때까지 기다려"라는 뜻이에요.'},
{t:[660,118],s:'백엔드 코드의 <code>@app.get("/students/{sid}")</code>는 "이 주소로 GET 요청이 오면 아래 함수를 실행해"라는 표시예요.'+GP+'함수가 파이썬 사전(dict)을 돌려주면 FastAPI가 <b>JSON</b>으로 바꿔 응답에 실어요.'},
{t:[660,186],s:'실제 데이터는 서버 뒤의 <b>DB</b>(데이터베이스)에 있어요. 브라우저는 DB를 직접 볼 수 없고, 서버에 <b>물어봐야만</b> 알 수 있어요.'},
{btn:'cp2',s:'아래 <b>fetch 실행</b>을 눌러 보세요. 요청이 5500번에서 8000번으로 건너가고, JSON 응답이 돌아와 화면에 이름이 찍혀요.'},
{s:'이 대화에서 "이런 요청을 보내면 이런 응답이 온다"는 <b>약속의 목록</b>을 <b>API</b>라고 해요. Application Programming Interface, 프로그램끼리 말을 거는 창구라는 뜻이에요.'+GP+'그래서 이번 주의 핵심어가 <b>"계약"</b>이에요.'},
{s:'자주 헷갈리는 두 가지.'+GP+'① 4장에 나올 <b>Pydantic</b>은 따로 떠 있는 서비스가 아니라, FastAPI 서버 프로그램 <b>안에서</b> 함께 도는 라이브러리예요. 오른쪽 상자 하나 안에 다 들어 있어요.'+GP+'② 이 공부 웹처럼 데이터를 HTML 안에 다 넣어 두고 서버는 파일만 건네주는 웹은 백엔드 API가 없는 <b>정적 웹</b>이에요.'},
{s:'<b>정리:</b> 프론트는 <code>fetch()</code>로 묻고, 백엔드는 JSON으로 답해요. 그 문답의 약속이 API예요. 이제 0장, 이 약속이 <b>없으면</b> 어떻게 되는지부터 봐요.'}]});

sc('학생 목록 하나 받아 오기',{name:'약속 없는 대화',scope:'0장 · 약속이 필요하다',
sims:[['c0','keep','']],
beats:[

{v:'ana',t:[140,385],s:'여기 <b>손님</b>이 있어요. 실제로는 <b>프론트엔드</b>(브라우저)예요. 무언가를 달라고 <b>요청하는 쪽</b>이에요.'},
{t:[846,385],s:'벽 너머엔 <b>주방</b>이 있어요. 실제로는 <b>백엔드</b>(서버)예요. 요청을 받아 <b>만들어 주는 쪽</b>이에요.'},
{t:[480,375],s:'손님은 주방 안을 못 보고, 주방은 손님 얼굴을 못 봐요. 오갈 수 있는 건 벽에 난 <b>창구</b>뿐이에요. 실제로는 <b>HTTP</b>예요.'},
{t:[477,140],s:'그런데 벽에 <b>메뉴판이 비어 있어요.</b> 무엇을 시킬 수 있는지, 어떻게 말해야 하는지 아무 약속이 없어요.'},
{btn:'c0',s:'이 상태로 손님이 "먹을 거 주세요!"라고 외치면 어떻게 될까요? 아래 버튼을 눌러 보세요.'},
{v:'real',t:[107,176],s:'실제로 바꿔 보면 이래요. 브라우저의 JS가 서버에 학생 목록을 달라고 해요. 그런데 두 팀이 <b>어느 주소로, 어떤 형식으로</b> 주고받을지 정한 게 없어요. 무대 속 버튼을 눌러도 똑같이 막혀요.'},

{s:'<b>정리:</b> API는 서버 코드가 아니라, 벽 너머 두 팀 사이의 <b>약속</b>이에요. 약속이 없으면 둘 다 멀쩡해도 대화가 안 돼요.'}]});

sc('API는 "계약"이다',{name:'API = 계약',scope:'0장 · 약속이 필요하다',ctNow:null,
sims:[['c1','keep','칸 눌러 보기:']],
beats:[
{s:'앞 장면에서 약속이 없으면 대화가 안 된다는 걸 봤어요. 그 약속을 글로 적은 것이 <b>API 명세</b>, 강의 5쪽 표현으로는 <b>"계약"</b>이에요.'},
{v:'ana',t:[477,106],s:'식당으로는 벽에 붙은 <b>메뉴판</b>이에요. 손님은 주방 안을 몰라도, 주방은 손님 얼굴을 몰라도 돼요. 둘 다 <b>메뉴판만</b> 보면 되니까요.'},
{t:[477,150],s:'메뉴판엔 7가지가 적혀 있어요. 메뉴 이름, 주문 종류, 주문서 양식, 나오는 그릇, 결과 알림, 회원 확인, 안내문 양식. 하나하나가 실제 API의 한 칸에 대응해요.'},
{v:'real',t:[477,106],s:'실제로 바꾸면 <b>API 명세의 7칸</b>이에요.'+GP+'<b>URI</b>(어디로) · <b>Method</b>(무엇을) · <b>요청 형식</b>(보내는 모양) · <b>응답 형식</b>(받는 모양) · <b>상태 코드</b>(결과 번호) · <b>인증</b>(누구인지) · <b>오류 형식</b>(실패 안내).'},
{t:[200,250],s:'왼쪽 팀은 상대가 FastAPI인지 Spring인지 몰라도 되고, 자기가 React든 모바일 앱이든 AI Agent든 상관없어요.'},
{t:[760,165],s:'오른쪽 팀도 무엇으로 만들든 상관없어요. 가운데 <b>계약만 지키면</b> 협업이 돼요. 이게 "API = 서버 코드"가 아닌 이유예요.'},
{btn:'c1',s:'칸을 하나씩 눌러 보세요. 비유와 실제에서 같은 자리가 함께 켜지고, 뜻이 나와요.'},
{s:'강의 5쪽은 좋은 계약과 나쁜 계약을 이렇게 나눠요.'+GP+'<table><tr><th></th><th>좋은 계약</th><th>나쁜 계약</th></tr><tr><td>특징</td><td>안정적, 예측 가능</td><td>구현에 끌려다님</td></tr><tr><td>모습</td><td>이름만 보고 동작을 짐작, 바뀔 땐 버전으로 알림</td><td>DB 컬럼명이 그대로 노출, 백엔드 수정이 곧 프론트 장애</td></tr></table>'},
{t:'ct',s:'오른쪽 위 <b>우리 계약서</b>가 바로 이 7칸이에요. 1장부터 한 칸씩 정해 채워 가요. 지금은 아직 비어 있어요.'},
{s:'요즘은 사람만 API를 읽지 않아요. LLM(대형 언어 모델)의 <b>Tool / Function calling</b>도 결국 API 명세를 읽고 호출해요. 명세가 분명해야 사람도 AI도 정확히 불러요.'},
{s:'<b>정리:</b> API 명세는 두 팀 사이의 <b>계약</b>이에요. 구현을 바꿔도 계약이 유지되면 상대는 영향을 받지 않아요.'}]});

sc('주문 한 번을 4단계로',{name:'주문 4단계',scope:'0장 · 약속이 필요하다',
sims:[['c2','keep','']],
beats:[

{v:'ana',t:[120,34],s:'① 손님이 <b>메뉴판을 보고</b> 주문서를 써요. 메뉴판에 있는 대로만 쓰면 돼요.'},
{t:[340,34],s:'② <b>웨이터</b>가 주문서를 주방에 전달해요. 웨이터는 주문을 바꾸거나 요리하지 않아요. 들고 가고 들고 올 뿐이에요. <b>HTTP도 메시지를 운반만</b> 해요.'},
{t:[552,34],s:'③ 주방은 <b>주문서대로</b> 조리해요. 손님 얼굴은 몰라도 돼요. 주문서만 보면 되니까요.'+GP+'"앞 일을 기억하지 않고 받은 내용만으로 처리"하는 이 성질을 8장에서 <b>Stateless</b>라고 불러요.'},
{t:[777,34],s:'④ 음식이 나오거나, <b>"품절"</b>이라는 안내가 와요. 실패도 <b>약속된 모양</b>으로 돌아와요.'},
{btn:'c2',s:'아래에서 재고가 있을 때와 품절일 때를 각각 주문해 보세요. 웨이터가 주문서를 들고 창구를 지나가요.'},
{v:'real',t:[78,200],s:'실제로 바꾸면, 주문서는 <b>요청 메시지</b>(<code>POST /orders</code> + <code>{menu, qty}</code>), 주방은 FastAPI예요. 성공하면 <code>201 Created</code>와 JSON이 와요. 201은 "새로 만들어졌어요"라는 상태 코드예요.'},
{s:'품절은 <code>409 Conflict</code>예요. 주문서는 멀쩡한데 <b>가게의 현재 상태</b>와 부딪힌다는 뜻이에요.'+GP+'반대로 수량 칸에 "많이"라고 쓰면 주문서 <b>자체가</b> 틀린 거라 <code>422</code>예요. 이 차이는 3장에서 다시 봐요.'},
{s:'<b>정리:</b> 메뉴판(계약)만 같으면 손님은 레시피도, 냉장고 위치도 몰라도 돼요. 웨이터(HTTP)는 운반만 하고, 결과는 약속된 모양으로 돌아와요.'}]});

sc('주방장이 바뀌어도, 메뉴판이 같으면',{name:'구현 vs 계약',scope:'0장 · 약속이 필요하다',

{v:'ana',t:[846,385],s:'주방장이 바뀌거나 냉장고를 새것으로 바꾸는 건 주방 <b>안</b>의 일이에요. 실제로는 언어(FastAPI → Spring)나 DB(MySQL → PostgreSQL) 교체예요. 이런 걸 <b>구현</b>이라고 해요.'},
{t:[477,128],s:'메뉴판의 <b>"김치찌개"</b>라는 이름은 손님과의 약속이에요. 단골손님은 늘 이 이름으로 주문해요.'},
{btn:'c3',s:'두 가지를 비교해 보세요. 주방 안을 바꿀 때와, 메뉴 이름을 몰래 바꿀 때 손님에게 무슨 일이 생기는지.'},
{v:'real',t:[120,165],s:'실제 프론트 코드는 응답에서 <code>data.name</code>을 꺼내 화면에 보여 줘요. 프론트는 필드 <b>이름을 그대로</b> 믿고 써요.'},
{t:[700,182],s:'그래서 서버의 응답 모양 <code>{"id", "name"}</code>이 곧 계약이에요. 이게 <code>stu_nm_kor</code>처럼 바뀌면 프론트는 <code>undefined</code>를 받고 화면이 깨져요.'},
{s:'한눈에 보면 이래요.'+GP+'<table><tr><th>바꾼 것</th><th>손님(프론트)</th></tr><tr><td>주방장 = FastAPI → Spring</td><td class="okk">그대로 주문됨</td></tr><tr><td>냉장고 = MySQL → PostgreSQL</td><td class="okk">그대로 주문됨</td></tr><tr><td>메뉴 이름 = 응답 필드 이름</td><td class="ngg">주문 실패 · 화면 깨짐</td></tr></table>'},
{s:'메뉴판을 꼭 바꿔야 할 땐 <b>새 메뉴판(v2)</b>을 따로 만들고 옛 메뉴판도 한동안 받아 줘요(6장, 버전 관리).'+GP+'"나쁜 계약"의 대표 예가 <b>DB 컬럼명이 그대로 응답에 나가는 것</b>이에요. DB 이름을 바꾸는 순간 계약도 같이 바뀌어 버려요.'},
{s:'<b>정리:</b> 구현은 마음대로 바꿔도 돼요. <b>계약(메뉴판)만</b> 지키면요.'}]});

sc('왜 지금 "계약"이 중요해졌나',{name:'왜 계약인가',scope:'0장 · 약속이 필요하다',
sims:[['c4','keep','시대:']],
beats:[
{s:'왜 요즘 "계약"이 이렇게 중요해졌을까요? <b>웹의 구조가 바뀌어 왔기</b> 때문이에요(강의 7쪽). 세 시대를 차례로 볼게요.'},
{v:'ana',t:[105,34],s:'① 예전 식당은 반찬 하나 더 달라고 해도 <b>테이블 세팅 전체</b>를 다시 차려서 가져왔어요.'},
{v:'real',t:[130,34],s:'이게 <b>SSR</b>(Server-Side Rendering)이에요. 서버가 <b>HTML 화면까지</b> 다 만들어 보내요. PHP · JSP · Django 템플릿이 그래요.'+GP+'화면과 데이터가 한 덩어리라, 숫자 하나만 바뀌어도 페이지 전체가 다시 와요. 한 프로그램 안의 일이라 약속할 게 적었어요.'},
{btn:'c4',s:'아래에서 ② ③도 눌러 보세요. 서버가 주는 것이 어떻게 바뀌는지 보여요.'},
{s:'② <b>SPA + REST API</b>: 서버는 <b>데이터(JSON)만</b> 주고, 화면은 브라우저의 JS가 그려요. SPA(Single Page Application)는 한 페이지 안에서 JS가 내용만 바꿔 끼우는 웹이에요.'+GP+'화면 쪽과 데이터 쪽이 <b>두 프로그램으로 갈라지면서</b> 약속이 필요해졌어요.'},
{s:'③ <b>Multi-Client</b>: 웹 · 모바일 앱 · IoT 기기 · AI가 <b>같은 API</b>를 써요. 이제 API 자체가 하나의 <b>제품</b>이 돼요. 명세 · 버전 · 인증 · 속도 제한까지 고민해야 해요.'},
{s:'<table><tr><th></th><th>① SSR</th><th>② SPA</th><th>③ Multi</th></tr><tr><td>서버가 주는 것</td><td>완성된 HTML</td><td>JSON</td><td>JSON</td></tr><tr><td>화면은 누가</td><td>서버</td><td>브라우저 JS</td><td>각 클라이언트</td></tr><tr><td>새 고민</td><td>—</td><td>CORS</td><td>명세·버전·인증·제한</td></tr></table>오른쪽으로 갈수록 계약이 중요해져요.'},
{s:'<b>이번 학기 실습은 ②예요.</b> 프론트(5500번)와 FastAPI(8000번)가 분리돼 있어요. 이 "포트가 다르다"는 점이 9장 <b>CORS</b>의 씨앗이 돼요.'},
{s:'<b>정리:</b> 서버가 HTML 대신 <b>데이터만</b> 주게 되면서, 둘 사이의 계약이 중요해졌어요. 0장 끝! 1장에선 계약의 첫 칸, <b>주소에 이름 짓기</b>를 해요.'}]});

sc('REST = 모두가 같은 문법',{name:'REST',scope:'1장 · 이름 짓기',
sims:[['c5a','ana','비유:'],['c5','real','실제:']],
beats:[
{s:'1장의 주제는 <b>"주소에 이름을 어떻게 붙일까"</b>예요.'+GP+'API 주소를 사람마다 제멋대로 지으면(<code>/getStudent</code>, <code>/doDelete</code> …) 쓰는 사람이 매번 문서를 찾아봐야 해요. 그래서 "모두 같은 방식으로 짓자"는 공통 규칙이 생겼어요. 그게 <b>REST</b>예요.'},
{s:'REST는 HTTP 같은 <b>프로토콜</b>(주고받는 형식을 정한 규격)이 아니라 <b>설계 스타일</b>이에요.'+GP+'Roy Fielding이 2000년 박사논문에서 "웹이 왜 이렇게 크게 확장될 수 있었나"를 <b>6가지 제약</b>으로 정리한 거예요.'},
{v:'ana',t:[110,200],s:'비유는 <b>도서관</b>이에요(강의 8쪽). 처음 가는 도서관에서도 <b>청구기호</b> 규칙만 알면 책을 찾을 수 있죠. 모든 책엔 고유한 청구기호가 있어요. 실제로는 <b>URI</b>, 자원의 고유 주소예요.'},
{t:[720,192],s:'사서에게 할 수 있는 일은 <b>정해져 있어요</b>: 열람 · 대출 · 반납. 실제로는 <b>Method</b>(GET · POST · DELETE …)예요.'},
{t:[535,272],s:'사서는 나를 기억하지 못해요. 그래서 갈 때마다 <b>회원증</b>을 보여 줘요. 실제로는 <b>Stateless</b>, 매 요청마다 <code>Authorization</code> 헤더로 신분을 밝혀요.'},
{t:[855,272],s:'그리고 받는 건 책 자체가 아니라 <b>정보 카드</b>예요. 실제로는 <b>Representation</b>(표현), 서버의 진짜 데이터를 JSON으로 적은 모습이에요(뒤에서 자세히).'},
{btn:'c5a',s:'규칙을 하나씩 눌러 보세요. 도서관에서 해당 부분이 칠해지고 실제 이름이 나와요.'},
{v:'real',t:[240,92],s:'실제로 볼게요. 왼쪽 API는 이름에 <b>동사</b>가 섞여 제각각이에요. 잘 돌아가지만, 처음 보는 사람은 문서를 봐야 알아요.'},
{t:[710,92],s:'오른쪽은 REST 방식이에요. URL엔 <b>명사(자원)만</b>, 동사는 정해진 <b>메서드</b>로 말해요. 그래서 처음 보는 API도 짐작이 돼요.'},
{btn:'c5',s:'아래에서 <b>/courses</b>(수업)가 새로 생긴 상황과, <code>GET /removeStu</code>의 위험을 확인해 보세요.'},
{s:'REST의 6가지 제약이에요. 한 줄씩 깨지면 무엇이 문제인지 같이 봐요.'+GP+'<table><tr><th>제약</th><th>깨지면</th></tr><tr><td>Client–Server: 화면과 데이터를 나눔</td><td>배포가 서로 묶임</td></tr><tr><td>Stateless: 서버는 기억 안 함</td><td>서버를 늘릴 수 없음</td></tr><tr><td>Cacheable: 저장해도 되는지 밝힘</td><td>매번 DB 조회</td></tr><tr><td>Uniform Interface: 같은 문법</td><td>API마다 제각각</td></tr><tr><td>Layered System: 중간 계층을 몰라도 됨</td><td>프록시 추가 = 클라이언트 수정</td></tr><tr><td>Code on Demand (선택)</td><td>없어도 REST</td></tr></table>'},
{s:'자주 헷갈리는 두 가지.'+GP+'① 왼쪽 API도 HTTP + JSON을 써요. 하지만 Uniform Interface를 어겨서 REST가 아니에요. <b>JSON을 HTTP로 주고받는다고 REST가 되는 건 아니에요</b>(9쪽).'+GP+'② <b>Code on Demand</b>는 서버가 보낸 코드(JS)를 브라우저가 그 자리에서 <b>실행</b>해 기능이 생기는 거예요. 단순한 다운로드와는 달라요.'},
{s:'<b>정리:</b> URL에는 <b>명사(자원)만</b>, 동사는 정해진 <b>메서드</b>로. 모두가 같은 문법을 쓰면 처음 보는 API도 짐작돼요.'}]});

sc('같은 문법의 4가지 규칙',{name:'4가지 규칙',scope:'1장 · 이름 짓기',
sims:[['c6','keep','규칙:'],['c6h','real','HATEOAS:']],
beats:[
{s:'6가지 제약 중 핵심이 <b>Uniform Interface</b>, 곧 "모두 같은 문법"이에요. 강의 10쪽은 이걸 <b>4가지 규칙</b>으로 나눠요.'},
{v:'ana',t:[120,200],s:'<b>① 자원의 식별</b>: 청구기호 하나 = 책 한 권이듯, <b>URI 하나 = 자원 하나</b>예요. <code>/students/10</code>은 언제나 10번 학생을 가리켜요.'},
{t:[345,280],s:'<b>② 표현을 통한 조작</b>: 서가에 들어가 책을 직접 고치지 않고, 정보 카드에 "반납일을 바꿔 주세요"라고 적어 내요.'+GP+'클라이언트도 DB를 직접 못 만지고, <b>JSON을 보내</b> "이렇게 바꿔 주세요"라고 부탁해요.'},
{t:[655,330],s:'<b>③ 자기 서술적 메시지</b>: 겉표지 라벨만 봐도 무슨 책인지 알 수 있어요.'+GP+'메시지도 <b>Method · Content-Type · 상태 코드</b>만 보면 해석돼요. 따로 설명서가 필요 없어요.'},
{t:[855,240],s:'<b>④ HATEOAS</b>: 다 읽은 뒤 "다음 권은 3번 서가" 같은 <b>안내 표지판</b>이 있어요.'+GP+'응답 안에 <b>다음에 갈 수 있는 곳의 링크</b>를 넣어 주는 거예요. 이름은 Hypermedia As The Engine Of Application State의 줄임말이에요.'},
{btn:'c6',s:'번호를 눌러 보세요. 비유와 실제 메시지에서 같은 부분이 칠해져요.'},
{v:'real',t:[600,168],s:'실제 응답의 <code>"links"</code>가 HATEOAS예요. 주의할 점: HATEOAS는 요청의 종류가 아니라 <b>응답을 만드는 방식</b>이에요.'+GP+'URL 모양은 똑같아요. 서버는 늘 링크를 넣어 주고, 클라이언트는 주소를 코드에 직접 적는 대신 <b>응답에서 꺼내 쓰는</b> 거예요. 따라가든 무시하든 자유예요.'},
{btn:'c6h',s:'수강 신청 자리가 <b>남았을 때</b>와 <b>마감됐을 때</b>, 서버가 넣어 주는 링크가 어떻게 다른지 직접 확인해 보세요.'},
{s:'실무의 "REST API"는 대부분 <b>①~③만</b> 지키고 ④는 생략해요. 그래서 엄밀히는 <b>RESTful HTTP API</b>라고 불러요.'},
{s:'<b>정리:</b> ①~③을 지키면 메시지만 봐도 <b>누구에게, 무엇을, 어떤 형식으로, 결과는</b> 알 수 있어요.'}]});

sc('우리 API는 얼마나 REST다운가',{name:'성숙도',scope:'1장 · 이름 짓기',
sims:[['c7a','keep','사다리:'],['c7','keep','10번 보내기:']],
beats:[
{s:'어떤 API가 <b>얼마나 REST다운지</b>는 어떻게 잴까요? Richardson이라는 개발자가 만든 <b>0~3단계 자</b>가 있어요(강의 11쪽). 아래일수록 HTTP를 그냥 봉투로만 쓰고, 위일수록 HTTP의 단어(메서드, 상태 코드)를 제대로 써요.'},
{v:'ana',t:[110,345],s:'비유는 <b>택배 송장</b>이에요. <b>Level 0</b>은 송장 없이 상자 안 쪽지에 전부 적은 거예요.'+GP+'실제로는 주소 하나(<code>/api</code>)에 POST로 다 보내고 Body의 <code>"action"</code>으로 구분해요. 이걸 <b>POX</b>(Plain Old XML)의 늪이라고 불러요.'},
{t:[110,262],s:'<b>Level 1</b>은 송장에 받는 사람만 적어요. 실제로는 자원마다 <b>URI</b>가 생겨요(<code>/students/10</code>). 하지만 동작은 여전히 POST 하나로 해요.'},
{t:[110,178],s:'<b>Level 2</b>는 송장에 할 일과 결과까지 적어요. <b>메서드와 상태 코드를 의미대로</b> 써요. <code>GET /students/10 → 200 / 404</code>. 여기가 수업의 <b>목표선</b>이에요.'},
{t:[110,94],s:'<b>Level 3</b>은 다음 배송 안내 스티커까지 붙여요. 앞 장면의 <b>HATEOAS</b>, 응답에 링크를 넣는 단계예요.'},
{btn:'c7a',s:'같은 API를 Level 0부터 한 단계씩 고쳐 보세요.'},
{t:[700,90],s:'왜 Level 2가 중요할까요? <b>분류 기계는 송장(겉)만</b> 읽어요. 반송된 상자에 송장은 "배송 완료"라 찍고 안쪽 쪽지에만 "반송"이라 쓰면, 기계는 끝까지 몰라요.'},
{btn:'c7',s:'10번 중 3번은 <b>없는 학생</b>을 찾는 요청이에요. Level 0 서버와 Level 2 서버로 각각 보내 보세요.'},
{v:'real',t:[700,90],s:'실제로는 <b>모니터링 도구</b>가 분류 기계예요. 도구들은 응답 첫 줄의 <b>상태 코드</b>만 읽고 오류율을 세요.'+GP+'실패를 <code>200 + {"success": false}</code>처럼 Body에만 적으면 전부 "성공"으로 집계돼요. AI가 만든 코드에서 이 모양을 보면 고쳐야 해요.'},
{s:'<table><tr><th></th><th>Level 0</th><th>Level 2</th></tr><tr><td>의도</td><td>Body의 "action"을 읽어야 앎</td><td>PATCH = 부분 수정</td></tr><tr><td>대상</td><td>Body의 "id"</td><td>URI /students/10</td></tr><tr><td>결과</td><td>200인데 실패?</td><td>404 = 실패</td></tr><tr><td>도구</td><td>모두 "성공"으로 집계</td><td>오류율·재시도·캐시 정상</td></tr></table>'},
{s:'<b>정리:</b> Level 2 = 메서드와 상태 코드를 <b>의미대로</b>. HTTP가 이미 가진 어휘를 쓰면, 사람도 도구도 겉만 보고 알아들어요.'}]});

sc('스마트 교실의 자원 트리',{name:'자원 트리',scope:'1장 · 이름 짓기',v0:'real',
sims:[['c8','real','명사:'],['c8q','keep','URI 고치기:']],
beats:[
{s:'이제 직접 이름을 지어 볼 차례예요. 소재는 강의와 과제의 <b>스마트 교실</b>(학생 · 수업 · 수강 · 강의실 · 센서)이에요.'+GP+'순서가 중요해요. <b>① 명사(자원) 뽑기 → ② 관계 그리기 → ③ 트리로 정리 → ④ URI 정하기.</b> 과제 STEP 1이 바로 이 과정이에요.'},
{v:'ana',t:[130,70],s:'트리에는 세 종류의 칸이 있어요. 도서관으로는 <b>서가 → 책 한 권 → 그 책에 딸린 것</b>(대출 기록)이에요.'},
{v:'real',t:[180,70],s:'실제 이름으로는 <b>Collection</b>(같은 종류의 모음, <code>/students</code>) · <b>Item</b>(그중 하나, <code>/students/10</code>) · <b>Sub-resource</b>(그 하나에 딸린 것, <code>/students/10/enrollments</code>)예요.'},
{t:[58,262],s:'뿌리의 <code>/v1</code>은 API의 <b>버전</b>이에요. 나중에 계약을 크게 바꿀 때 <code>/v2</code>를 따로 열 수 있게 미리 붙여 둬요(6장).'},
{btn:'c8',s:'아래에서 <b>학생 · 수업 · 강의실</b>을 눌러 가지를 키워 보세요. 무대의 칸을 누르면 그 주소를 문장으로 읽어 줘요.'},
{s:'설계 팁 하나. <b>수강</b>(enrollment)은 학생과 수업 사이의 관계예요. 학생 한 명이 여러 수업을, 수업 하나에 여러 학생이 있는 <b>N:M</b> 관계죠.'+GP+'조회는 양쪽에서 해도 되지만, 생성은 <b>한 곳으로</b> 모아요: <code>POST /enrollments {"student_id": 10, "course_id": 7}</code>'},
{btn:'c8q',s:'강의 15쪽의 URI 규칙 8개예요. 잘못 지은 주소를 하나씩 눌러 정답과 이유를 확인해 보세요.'},
{s:'자주 헷갈리는 두 가지.'+GP+'① <code>{student_id}</code>의 중괄호는 "값이 들어갈 자리"예요. 숫자만이 아니라 <code>t1</code> 같은 문자도 와요. 어떤 타입인지는 Schema에서 따로 정해요(4장).'+GP+'② 비밀번호 · 토큰 같은 <b>민감 정보는 URI · 쿼리에 넣지 않아요.</b> 전송 중엔 암호화되지만 서버 로그 · 방문 기록에 그대로 남아요.'},
{t:'ct',s:'계약서의 <b>URI</b> 칸이 채워졌어요. <code>/v1/students</code>, <code>/v1/students/{id}</code> …'},
{s:'<b>정리:</b> 명사 → 관계 → 트리 → URI. 모음은 복수형 명사, 하나는 <code>/{id}</code>, 딸린 것은 그 아래에.'}]});

sc('자원과 표현: 사람과 사진',{name:'자원과 표현',scope:'1장 · 이름 짓기',
sims:[['c9','keep','모습:'],['c9a','real','형식:'],['c9t','keep','']],
beats:[
{s:'주소로 가리키는 "학생 10번"은 사실 <b>DB 안에 있는 진짜 데이터</b>예요. 그런데 클라이언트가 받는 건 그 진짜가 아니라, JSON으로 <b>적어 보낸 모습</b>이에요.'+GP+'진짜를 <b>자원</b>(Resource), 적어 보낸 모습을 <b>표현</b>(Representation)이라고 해요(강의 13~14쪽).'},
{v:'ana',t:[160,366],s:'비유는 <b>사람과 사진</b>이에요. 김인천 학생은 <b>한 명</b>이에요. 실제로는 DB 속 한 행, 곧 자원이에요.'},
{t:[414,306],s:'그런데 사진은 여러 장일 수 있어요. 증명사진(상세), 단체사진 속 한 명(목록), 명함(일부). 모두 <b>같은 사람의 다른 모습</b>, 곧 표현이에요.'},
{btn:'c9',s:'사진을 하나씩 골라 보세요. 같은 자원이 어떤 모습으로 오는지 보여요.'},
{t:[155,432],s:'사진에 안 찍히는 것도 있어요. 비밀번호, 내부 메모. 응답에도 <b>클라이언트가 알아야 할 것만</b> 넣어요.'+GP+'HTTPS를 써도 양 끝(브라우저 개발자 도구)에선 응답이 다 보이니까, 비밀번호 해시 같은 건 애초에 넣지 않아요.'},
{v:'real',t:[200,100],s:'실제 DB 행이에요. <code>password_hash</code>와 <code>memo</code>는 표현에 넣지 않아요. 표현은 DB 테이블과 <b>같을 필요가 없어요</b>. 그래서 DB 이름을 바꿔도 표현은 유지할 수 있어요(0장 "나쁜 계약").'},
{t:[470,286],s:'<b>무슨 형식</b>으로 받을지는 요청의 <code>Accept</code> 헤더로 골라요. "JSON으로 주세요", "CSV로 주세요"처럼요. 서버가 그 형식을 못 만들면 <code>406 Not Acceptable</code>이에요.'},
{btn:'c9a',s:'주소는 그대로 두고 Accept 헤더만 JSON · CSV · HTML로 바꿔 보세요.'},
{btn:'c9t',s:'마지막 실험이에요. 브라우저가 받은 JSON의 grade를 99로 고치면, 서버의 진짜 학생도 99학년이 될까요?'},
{s:'REST라는 이름이 바로 여기서 나왔어요. <b>RE</b>presentational <b>S</b>tate <b>T</b>ransfer: 자원의 <b>상태</b>를 <b>표현</b>으로 주고받는다.'+GP+'<table><tr><th>달라지는 것</th><th>고르는 법</th></tr><tr><td>형식: JSON / CSV / HTML</td><td>Accept 헤더</td></tr><tr><td>양: 상세 / 요약 / 일부</td><td>URI, 쿼리 <code>?fields=</code></td></tr></table>'},
{s:'<b>정리:</b> 사진을 찢어도 사람은 다치지 않아요. 진짜를 바꾸려면 <b>요청</b>을 보내야 해요. 1장 끝! 2장에선 그 요청의 <b>동사</b>를 골라요.'}]});

sc('학생 한 명의 일생 (CRUD)',{name:'CRUD',scope:'2장 · 동사 고르기',
sims:[['c10','keep','']],
beats:[
{s:'2장의 주제는 <b>"무엇을 할지(동사)를 어떻게 말할까"</b>예요. 1장에서 URL엔 명사만 쓰기로 했으니, 동사는 <b>HTTP 메서드</b>가 맡아요.'},
{s:'데이터를 다루는 기본 동작은 거의 네 가지예요.'+GP+'<b>C</b>reate 만들기 · <b>R</b>ead 보기 · <b>U</b>pdate 고치기 · <b>D</b>elete 지우기'+GP+'줄여서 <b>CRUD</b>라고 하고, 각각 <b>POST · GET · PATCH(또는 PUT) · DELETE</b>에 짝지어져요(강의 18~19쪽).'},
{v:'ana',t:[200,100],s:'비유는 휴대폰 <b>연락처 앱</b>이에요. "+새 연락처", 보기, 편집, 삭제. 누구나 매일 하는 CRUD예요.'},
{btn:'c10',s:'아래 버튼을 <b>순서대로</b> 눌러 학생 한 명의 일생을 따라가 보세요. 등록 → 조회 → 학년 수정 → 삭제 → 삭제 후 다시 조회.'},
{v:'real',t:[386,342],s:'실제로는 버튼을 누를 때마다 <b>요청</b>이 가고, 가운데 <b>DB 표</b>가 바뀌고, <b>응답</b>이 돌아와요. 요청 Body가 있는 건 어느 것인지도 눈여겨보세요.'},
{s:'<table><tr><th>작업</th><th>요청</th><th>성공</th></tr><tr><td>목록 조회</td><td>GET /students</td><td>200</td></tr><tr><td>단건 조회</td><td>GET /students/10</td><td>200 / 404</td></tr><tr><td>생성</td><td>POST /students</td><td>201 + Location</td></tr><tr><td>전체 교체</td><td>PUT /students/10</td><td>200 / 204</td></tr><tr><td>부분 수정</td><td>PATCH /students/10</td><td>200</td></tr><tr><td>삭제</td><td>DELETE /students/10</td><td>204</td></tr></table><code>Location</code>은 "새로 만든 것의 주소는 여기"라는 응답 헤더, <code>204</code>는 "성공, 돌려줄 Body는 없음"이에요.'},
{s:'자주 헷갈리는 <b>POST vs PATCH</b>.'+GP+'<b>POST</b>는 모음(<code>/students</code>)에 보내서 <b>개수가 늘어나요.</b> 번호는 서버가 정해요.<br><b>PATCH</b>는 하나(<code>/students/11</code>)에 보내서 개수는 그대로, <b>내용만</b> 바뀌어요.'+GP+'연락처 앱의 "+새 연락처"와 "편집"의 차이예요.'},
{t:'ct',s:'계약서의 <b>Method</b> 칸이 채워졌어요.'},
{s:'<b>정리:</b> 삭제 후 다시 GET하면 <code>404</code>. 같은 DELETE를 또 보내도 DB는 똑같이 "없음"이에요. 그래서 DELETE는 <b>멱등</b>이에요. 이 말은 두 장면 뒤에서 제대로 봐요.'}]});

sc('PUT vs PATCH: 통째로 vs 부분만',{name:'PUT · PATCH',scope:'2장 · 동사 고르기',
sims:[['c11','keep','']],
beats:[
{s:'"고치기(Update)"에는 메서드가 두 개 있어요. <b>PUT</b>과 <b>PATCH</b>예요(강의 20쪽).'+GP+'<b>PUT</b>: "보낸 내용이 <b>전체</b>다. 통째로 갈아 끼워라"<br><b>PATCH</b>: "보낸 <b>부분만</b> 바꿔라"'},
{v:'ana',t:[766,110],s:'비유는 <b>방 정리</b>예요. 요청에 사진 한 장을 담아 보내요. 사진엔 <b>책상과 파란 커튼</b>만 찍혀 있어요.'},
{t:[302,348],s:'그런데 지금 방엔 <b>화분과 의자</b>도 있어요. 사진에 없는 이것들은 어떻게 될까요?'+GP+'PUT = "이 사진대로 방을 <b>똑같이</b>" / PATCH = "커튼만 파랗게".'},
{btn:'c11',s:'아래에서 PUT과 PATCH로 각각 보내 보세요. 실제 쪽에선 학년만 4로 바꾸려다 Body에 <code>email</code>을 깜빡 빠뜨린 상황이에요.'},
{v:'real',t:[134,90],s:'실제 DB 행이에요. PUT은 빠진 <code>email</code>을 <b>지워 버리고</b>, PATCH는 <b>그대로</b> 둬요. 필드 하나 빠뜨린 차이가 데이터 손실이 될 수 있어요.'},
{s:'<table><tr><th></th><th>PUT</th><th>PATCH</th></tr><tr><td>Body의 뜻</td><td>자원의 완전한 새 모습</td><td>바꿀 내용만</td></tr><tr><td>빠진 필드</td><td>삭제 · 기본값</td><td>그대로 유지</td></tr><tr><td>멱등</td><td>항상</td><td>형식에 따라 (△)</td></tr><tr><td>실무</td><td>설정 전체 저장</td><td>대부분의 "수정" 화면</td></tr></table>'},
{s:'PATCH엔 두 형식이 있어요.'+GP+'<b>Merge Patch</b>(RFC 7396): 바꿀 값을 그냥 적어요. <code>null</code>은 삭제, 안 적으면 그대로. 지금까지 본 PATCH예요.'+GP+'<b>JSON Patch</b>(RFC 6902): <code>[{"op":"replace","path":"/grade","value":4}]</code>처럼 명령 목록이에요. "목록 끝에 추가" 같은 명령은 할 때마다 늘어나서 <b>멱등이 아니에요</b>. 앞 표의 △가 이 뜻이에요.'},
{s:'AI가 만든 PUT 핸들러를 볼 땐 <b>빠진 필드를 어떻게 처리하는지</b> 확인하세요. 이름은 PUT인데 보낸 필드만 덮어쓰면(= PATCH처럼 동작) <b>계약 위반</b>이에요. 과제의 "AI 활용 기록"에 좋은 소재예요.'},
{s:'<b>정리:</b> PUT은 사진대로 <b>통째로</b>, PATCH는 <b>말한 것만</b>.'}]});

sc('응답이 사라졌다, 다시 보내도 될까?',{name:'재시도와 멱등',scope:'2장 · 동사 고르기',
sims:[['c12a','ana','비유:'],['c12','real','재시도:'],['ikey','real','']],
beats:[
{s:'네트워크는 가끔 끊겨요. 요청은 서버에 도착해 처리됐는데, <b>응답만 사라지는</b> 일이 생겨요. 클라이언트는 처리됐는지 모르니 다시 보내고 싶어지죠.'+GP+'이때 "다시 보내도 안전한가"를 정하는 성질이 <b>멱등</b>(idempotent)이에요. 같은 요청을 여러 번 보내도 서버의 <b>결과 상태</b>가 한 번 보낸 것과 같으면 멱등이에요.'},
{v:'ana',t:[187,280],s:'비유는 두 가지 버튼이에요. <b>자판기</b>는 버튼을 두 번 누르면 음료가 <b>두 개</b> 나와요. 누를 때마다 하나씩 생기는 <b>POST</b>예요.'},
{t:[854,260],s:'<b>엘리베이터 호출 버튼</b>은 여러 번 눌러도 엘리베이터는 <b>한 대만</b> 와요. 몇 번을 해도 결과가 같은 <b>PUT · DELETE</b>예요.'},
{btn:'c12a',s:'두 버튼을 각각 두 번씩 눌러 보세요.'},
{v:'real',t:[180,152],s:'실제 상황이에요. 프론트가 요청을 보냈고 서버는 처리했는데, 응답이 오다가 사라졌어요(와이파이 끊김). 프론트는 몰라서 <b>같은 요청을 다시</b> 보내요.'},
{btn:'c12',s:'메서드마다 재시도해 보고, 가운데 DB 표가 어떻게 되는지 보세요. POST만 학생이 <b>두 명</b> 생겨요.'},
{s:'주의! 멱등은 <b>응답 코드가 같다</b>는 뜻이 아니에요. DELETE는 두 번째에 <code>404</code>가 와도, DB는 똑같이 "없음"이라 멱등이에요.'+GP+'<code>PATCH {"grade":4}</code>는 몇 번 해도 4라 멱등이지만, "1 올려"는 할 때마다 바뀌어서 멱등이 아니에요.'},
{btn:'ikey',s:'POST의 중복을 막는 방법이 <b>Idempotency-Key</b>(4주차)예요. 요청에 고유 번호를 붙이면, 서버가 같은 번호를 두 번 받았을 때 "아까 처리했어요"라며 새로 만들지 않아요. 켜고 다시 POST를 재시도해 보세요.'},
{s:'<table><tr><th>메서드</th><th>재시도</th></tr><tr><td>GET · PUT · DELETE</td><td class="okk">안전하게 다시 보내도 됨</td></tr><tr><td>PATCH {"grade":4}</td><td class="okk">"4로"는 몇 번 해도 4</td></tr><tr><td>PATCH "1 올려"</td><td class="ngg">할 때마다 바뀜</td></tr><tr><td>POST</td><td class="ngg">중복 생성 위험</td></tr></table>결제 버튼 두 번 = 두 번 결제가 POST의 문제예요.'},
{s:'<b>정리:</b> 응답을 못 받았을 때 <b>그냥 다시 보내도 되는가</b>를 정하는 게 멱등이에요. POST는 아니라서, Idempotency-Key로 막아요.'}]});

sc('CRUD로 표현하기 어려운 "행위"',{name:'행위 표현',scope:'2장 · 동사 고르기',
sims:[['c13','keep','방법:'],['c13x','real','안티패턴:']],
beats:[
{s:'현실의 기능이 늘 CRUD 네 개로 딱 떨어지진 않아요. "수강 취소", "결제 승인", "출석 체크"처럼 <b>동사가 꼭 필요해 보이는</b> 일이 있어요(강의 21쪽).'+GP+'이럴 때 쓰는 <b>세 가지 방법</b>과, 절대 하면 안 되는 방법 <b>하나</b>를 봐요.'},
{v:'ana',t:[477,122],s:'비유는 다시 식당이에요. 주문 31번이 지금 <b>조리 대기</b> 상태예요. 이 주문을 취소하려면 어떻게 말해야 할까요?'},
{btn:'c13',s:'A · B · C 세 방법을 차례로 눌러 보세요. 비유와 실제가 함께 바뀌어요.'},
{v:'real',t:[124,92],s:'<b>A · 상태 필드로</b>: <code>PATCH /enrollments/5 {"status":"cancelled"}</code>. 취소를 "상태 하나 바꾸기"로 봐요. 가장 REST다워요.'},
{t:[108,202],s:'<b>B · 행위를 자원으로</b>: <code>POST /enrollments/5/cancellation {"reason":…}</code>. "취소 기록" 자체를 새로 만들어요. 취소 이력 · 사유 · 승인이 필요할 때 좋아요.'},
{s:'<b>C · Controller 경로</b>: <code>POST /enrollments/5/cancel</code>. 동사를 쓰되 <b>끝 경로에만</b>, 메서드는 POST로요. 팀이 합의했을 때 써요.'},

{btn:'c13x',s:'GET 링크와 POST 버튼으로 각각 만들어 두고 <b>크롤러를 풀어</b> 보세요. 아무도 안 눌렀는데 무슨 일이 생기는지.'},

function openCard(st){const o=OPEN[st.title];if(!o)return null;
  let h='<div class="oc"><div class="ock">STEP '+STEPS.indexOf(st)+' · '+(st.ch==='pre'?'시작하기':st.ch+'장 · '+CHAP[st.ch])+' · 강의 '+st.pages+'쪽</div><div class="oct">'+st.title+'</div>';
  h+='<div class="ocq">'+o.q+'</div>';
  h+='<div class="och">이 장면에서 배울 것</div><ul>'+o.learn.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  if(o.map)h+='<div class="och">비유가 뜻하는 것'+(st.anaName?' · '+st.anaName:'')+'</div><table class="ocm">'+o.map.map(r=>'<tr><td>'+r[0]+'</td><td>→</td><td>'+r[1]+'</td></tr>').join('')+'</table>';
  h+='<div class="ocw">'+o.why+'</div></div>';return h;}
function addOpenBeats(){STEPS.forEach(st=>{const h=openCard(st);if(h)st.beats.unshift({open:true,v:st.v0||(st.anaName||st.anaOnly?'ana':'real'),s:h});});}

/* 시작 */
sprites();attachScenes();addOpenBeats();navBuild();
let h0=parseInt((location.hash||'').slice(1));layout();go(isNaN(h0)?0:h0-1);
